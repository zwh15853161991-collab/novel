<script>
const D={"name": "程简简", "meta": "17 · 高三（七）班 · 最后一排靠窗 · 垫底但嘴硬", "world": "明德中学高三（七）班，八月底。后墙的倒计时牌会从一百八十天慢慢换到三十天；同桌、月考、家长会与志愿表，将把两个人的距离反复拉近又推开。", "profile": [["性格", "自尊心比成绩单硬。越紧张越贫嘴，从不真躺平。"], ["说话习惯", "先自嘲再反弹；被戳穿就硬顶；从不说「我不行」，只说「我懒得」。"], ["喜欢", "薄荷糖、错题本最后一页、放学后的空教室。"], ["讨厌", "被同情；被当成需要拯救的人；别人替她做决定。"], ["现在", "高三上学期，家里托关系把她塞进重点班，坐在最后一排。"], ["不知道的事", "她把志愿表第一栏填成了你保送学校所在的城市，没人知道。"]], "premise": "八月底，教室后墙挂起高考倒计时。座位表最后一排的名字被红笔圈住。你搬过去时，程简简还低着头，先把那句「这位置有人了」顶了回来；桌上的本子合得很快。", "chapters": [{"title": "第一章 倒计时 180 天", "scenes": [{"lines": [["nar", "八月底，明德中学高三（七）班。你被班主任叫到办公室，桌上放了一张座位表，最后一排靠窗的位置用红笔圈了出来，旁边写了个名字：程简简。"], ["nar", "班主任说：「转学生，家里托人来的，底子差。你年级第一，坐她旁边，帮一把。」"], ["nar", "你回到教室，最后一排靠窗的座位空着，桌面上有人用铅笔写了一行字，又擦掉了——看不清写的什么。"], ["say", "「看什么看。这位置有人了。」"]], "choices": ["答应换座位，搬到最后一排", "「我自己坐挺好的，老师。」", "不说话，回座位收拾东西"], "n": 1}, {"lines": [["nar", "第一周同桌。她上课不听讲，低着头在本子上写东西，你以为她在画画，扫了一眼——是错题本，抄得很工整，但一道力学公式抄反了两个符号。"], ["nar", "你指了一下，她啪地把本子合上。"], ["say", "「你管得真宽。年级第一了不起啊？」"], ["nar", "你没接话。她把本子翻回来，盯着那两个符号看了三秒，拿笔划掉，重写了一遍。"]], "choices": ["「这个符号是向下的，你写成向上了。」", "「行，你写吧。」然后不再管她", "把自己的草稿纸推过去，上面写了一遍正确公式"], "n": 2}, {"lines": [["nar", "体育课自由活动。你跑完三千米，弯着腰喘气，抬头看见她一个人坐在跑道边的台阶上，膝盖上摊着一本单词本，嘴在动，没出声。"], ["nar", "你走过去，她下意识把本子翻过去盖住，抬头看你，脸上的表情像被抓了现行但死不承认。"], ["say", "「看什么看，没见过人背单词啊？」"], ["nar", "你看见她本子背面露出一角——不是单词本，是英语课本的附录，高频词汇表，每一行后面都标了日期，从转学那天开始，一天二十个，一天没断过。"]], "choices": ["坐下来，不问她在背什么", "「你在背什么？」", "把自己的水壶递给她，说「润润嗓子」"], "n": 3}, {"lines": [["nar", "午休。全班趴在桌上睡觉。你没睡着，在改上午数学卷子的错。她也醒着，在改同一张卷子，笔尖很轻，怕吵到别人。"], ["nar", "两张卷子挨在一起，你看见她改错的方式——不是抄答案，是先写自己的思路，划掉，再写正确思路，旁边标「为什么错了」。"], ["nar", "她突然从口袋里摸出一颗薄荷糖，推到你桌角。没说话，没看你。"], ["say", "「别客气，楼下小卖部两毛钱一颗，不心疼。」"]], "choices": ["接了糖，剥开吃了，不说话", "轻声说「谢了」", "把糖推回去，说「我不吃甜的」"], "n": 4}, {"lines": [["nar", "月考成绩贴出来了。你年级第一。她年级四百八十名（设定值，非真实数据），倒数第三排的位置，红纸黑字。"], ["nar", "她站在成绩单前看了一会儿，回来把成绩单折成纸飞机，从窗口飞出去。纸飞机被风卷了两圈，落在操场边的梧桐树上。"], ["say", "「看什么看，考都考了，还能退回去？」"], ["nar", "她说这话的时候嘴角是翘的，但你看见她手在桌子底下攥着笔，指节发白。"]], "choices": ["「下次我教你这道。」", "「嗯，考都考了。」", "把自己整理的错题笔记推过去，说「按这个顺序复习」"], "n": 5}]}, {"title": "第二章 倒计时 90 天", "scenes": [{"lines": [["nar", "月考后按成绩调座位。她被调到中间第四排，你留在最后一排。她收拾东西时错题本从抽屉滑出来，你弯腰捡起，她手抖了一下，接过去没说话。"], ["say", "「行了，我自己搬。」"], ["nar", "她搬走那天，你的桌面上多了一行铅笔字，又擦掉了——这次你看见了：「谢谢，但不用。」"]], "choices": ["去找班主任说「不用换，我帮她挺有效的」", "不说什么，帮她把书搬到新座位", "什么都不做，看她搬走"], "n": 1}, {"lines": [["nar", "教室后门的锁坏了两天，没人报修。她从后门进来，绕过讲台，把卷子反扣在最后一排的空桌上。"], ["nar", "那张桌子空着。她把卷子摊平，用笔袋压住一角，又抽出来。"], ["say", "「我不是来求你的。这题我做了三遍，三遍三个答案。」"], ["nar", "卷子背面写着三种解法，每一种都划掉一半，第三种旁边画了个问号。"], ["say", "「你告诉我哪个对就行。别讲思路，我没空听。」"], ["nar", "她说完把笔袋推过来，拉链没拉，一支笔滚到桌边。"]], "choices": ["「第三个对。前两个错在符号。」", "不问哪个对，拿草稿纸重算一遍", "「我没空。」"], "n": 2}, {"lines": [["nar", "她在新座位跟后排的几个人混熟了。上课传纸条，下课嘻嘻哈哈。你从最后一排看过去，她在笑，笑得很用力。"], ["nar", "你桌上放着她上礼拜落在这儿的错题本，你翻了一下——扉页上多了一行字：「年级310名（设定值），比上次进步170名。继续。」"], ["say", "「……」"]], "choices": ["不管她，自己复习", "下课走过去把错题本还给她", "在错题本扉页她的那行字下面写「牛」字，再还给她"], "n": 3}, {"lines": [["nar", "期中家长会那天下午，她妈在教室门口拉住班主任，声音不大，走廊里的人都听得见。"], ["nar", "她站在拐角，背对着这边，手里攥着刚发下来的卷子，卷角被捏得起了褶。"], ["say", "「我妈说话难听。你别听。」"], ["nar", "她说完就往教室走，走了两步又停下，没回头：「……教室后门没锁，你要是想躲一会儿。」"]], "choices": ["跟上去，坐她旁边", "从后门进，把卷子摊开一起看", "什么也没做，留在原地"], "n": 4}, {"lines": [["nar", "晚自习突然停电。走廊应急灯亮着，你去接水，走到拐角听见她在走廊尽头打电话，声音很轻，但走廊太安静了。"], ["say", "「爸，你别打了……我说了没有。」"], ["say", "「我没有……我跟谁借？」"], ["nar", "她挂了电话，转身看见你站在拐角，手里拿着空水壶。两个人隔着十米，应急灯的光照着她一半脸。"]], "choices": ["装没听到，转身走开", "走过去把你的校服外套搭在她肩上，说「走廊冷」", "举举手里的水壶，说「接水」然后走开"], "n": 5}, {"lines": [["nar", "第二天，她像没事人一样。上课照常贫嘴，跟后排的人借修正带，笑得很大声。你把昨天整理的一套卷子递过去，她没接。"], ["say", "「我自己会做，不用。」"], ["nar", "她说这话的时候没看你，看着黑板。你注意到她课本边角卷起来了，是夜里翻太多遍磨的。"]], "choices": ["强行把卷子塞到她桌上", "收回来不说话，但上课时把解题步骤写在草稿纸上推过去", "收回来，什么都不做"], "n": 6}, {"lines": [["nar", "班会课。班主任站在讲台上说：「这次月考有几个同学进步很大，程简简进步了一百多名，主要是同桌帮扶效果好——」"], ["nar", "她站起来了。全班安静。椅子在地上刮了一声，很刺耳。"], ["say", "「老师，是我自己学的。」"], ["nar", "班主任愣了两秒，笑了笑说「好好好」，接着念下一个名字。她坐下来，脊背挺得很直，你看见她耳朵红了。"]], "choices": ["替她圆场说「她确实自己努力多」", "不说话，低头看课本", "抬头看她，对她点了一下头"], "n": 7}, {"lines": [["nar", "班会后你去了天台。她靠在栏杆上，背对着楼梯口，风吹得她头发乱七八糟。你在门口站了一会儿，她没回头，但开口了。"], ["say", "「你是不是觉得我特可笑。」"], ["nar", "这是她第一次主动跟你说软话。风很大，她的声音被吹得断断续续，但你听清了每一个字。"], ["say", "「站什么站，过来。」"]], "choices": ["靠过去说「不可笑。」", "走过去说「你觉得可笑吗？我觉得你挺厉害的」", "不过去，站在门口说「你自己说的，又不是我说的」"], "n": 8}]}, {"title": "第三章 倒计时 30 天", "scenes": [{"lines": [["nar", "志愿表草表发下来了。三栏，第一栏最重要。你在第一栏填了一直想考的学校。她坐在新座位上，低头填表，笔停了很久。"], ["nar", "你路过她桌边，瞥了一眼——第一栏写的是一所双非院校，就在你保送学校那座城市。"], ["say", "「看什么看，我填个志愿还得跟你报告？」"]], "choices": ["「你为什么填那儿。」", "不问，但记住了那个城市名", "「那学校不错，分数线跟你差不多。」"], "n": 1}, {"lines": [["nar", "倒计时牌换成三十天。晚自习后教室空了一半，她留在最后一排，桌上摊着草表。"], ["nar", "草表第一栏被涂过，黑笔描了两遍，透到背面。纸被橡皮擦得起了毛，原来那行字还看得出。"], ["say", "「看什么看。涂错了，重填。」"], ["nar", "她把错题本抽出来压在草表上，压得很快，边角露出来一点。"], ["say", "「这本借你。最后一道大题我没做出来，你别问我。」"], ["nar", "错题本的扉页空着。她平时每一本，都要在扉页写日期和名次。"]], "choices": ["「第一栏涂掉的字，我看见了。」", "把本子推回去，「最后一页留给我写。」", "翻开第一页，指那道大题"], "n": 2}, {"lines": [["nar", "你收到保送确认通知了。信封是导师签的字，最后一栏是你一直想自己考的学校。导师说：「签了就不用高考了，名额给你留着，想清楚。」"], ["nar", "你把信封夹在课本里，坐在最后一排，她的新座位在前面第四排，你看着她后脑勺。"], ["say", "「……」"]], "choices": ["签了保送确认书", "撕了，决定自己考", "先不签，把信封压在课本最底下"], "n": 3}, {"lines": [["nar", "她从班主任办公室门口路过，听见了你的名字和「保送」两个字。下午自习，你看见她在志愿表上把第一栏擦掉了，重写。新写的学校在另一个省。"], ["nar", "橡皮屑落了一桌子。她擦得很用力，纸都快擦破了。"], ["say", "「改主意了，那边的学校也不错。」"], ["nar", "她把笔帽扣上，扣了两次才扣住——第一次没对准。"], ["nar", "教室里很吵，她却像在等你说点什么。"]], "choices": ["什么都没说，回座位继续做题", "放学时拦住她说「我还没签」", "「你填什么都行。」"], "n": 4}, {"lines": [["nar", "高考前三天的晚自习。她翻开错题本的最后一页，写了一行字，又划掉了。你以为她没发现你在看，但她头也没抬就开口了。"], ["say", "「你看到了？」"], ["nar", "她划掉的那行字看不太清了，但有一个字你认出来了——像是个「你」字，或者是个「你」字加了一笔什么，被橡皮蹭成了一团灰。"]], "choices": ["「没看清，写的什么。」", "「看到了，但你划掉了。」", "「你写的跟我没关系吧。」"], "n": 5}, {"lines": [["nar", "高考前一天，全班拍毕业照。她站在最后一排最角落，你站在前排中间。摄影师喊一二三，她在最后一排做了个鬼脸——吐舌头那种，很幼稚。"], ["nar", "拍完散场，你看见她从人群里挤出来，校服领子立着，手里攥着一瓶矿泉水，瓶盖拧开又拧上了，一口没喝。"], ["say", "「拍完了？拍完了走吧，太阳晒死了。」"]], "choices": ["走过去说「站我旁边重拍一张」", "什么都没说，但偷偷拍了那张她做鬼脸的照片", "递给她一瓶水，说「走吧」"], "n": 6}, {"lines": [["nar", "志愿表交上去那天，她在办公室门口站了很久，出来的时候表已经交了。"], ["nar", "你问她填了什么，她不说，只说「填都填了」。"], ["say", "「反正考完才知道。」"], ["nar", "她说完把笔袋往书包里一塞，拉链拉得很响。"]], "choices": ["「我猜到了。」", "「考完告诉我。」", "不再问，把卷子推过去"], "n": 7}, {"lines": [["nar", "考完最后一科。出考场下大雨，没带伞。她站在校门口的梧桐树下，头发湿了一半，贴在脸上。你也没带伞，两人淋着雨沿校门口那条路走。"], ["nar", "走了大概五十米，她突然停下来了。雨很大，她的声音不大，但你听见了。"], ["say", "「我有话跟你说。」"], ["nar", "她转过身，面对你，雨水从她刘海淌下来，她拿手背擦了一下，没擦干净。"]], "choices": ["停下来，说「我也有」", "把书包举过她头顶，说「先走吧，别淋了」", "说「有什么话考完了再说，先躲雨」"], "n": 8}]}, {"title": "第三章 · 最后", "scenes": [{"lines": [["nar", "雨停了。她站在书店门口，手里拿着那张后天的车票。"], ["say", "「……」"]], "choices": ["把话说出口", "拉住她，不让她走", "什么也没做，松开手"], "n": 1}]}], "endings": {"A": {"title": "同桌的你", "text": "她在雨里说「我喜欢你，从你帮我捡卷子那天起」。你说「我也没签保送，我跟你考一座城」。成绩出来她去了那所双非，你考上了你想去的学校，地铁三站路。\n大一寒假她回母校看老师，在最后一排靠窗的座位上看到一张纸条，你高三写的：「这道题她做对了，牛。」\n她把纸条拍了张照发给你，配文：「这谁写的，字真丑。」你回：「你同桌写的。」"}, "B": {"title": "各自远扬", "text": "她在雨里话到嘴边咽回去了，说「没事，考完了」。你签了保送，她去了志愿表第二栏的学校，在另一个省。\n两个人偶尔在朋友圈点赞，从没单独聊过天。她大三那年考了研，考到了你保送的那所学校——但那时你已经毕业走了。\n你在校友群里看到她的名字，想了一分钟，点进去看了一眼，退出来了。\n志愿表交上去那天，她在门口站了很久才走。\n她复读那年把错题本烧了，说留着没用。"}, "C": {"title": "同一排", "text": "她没说那句话，你也没说。两人淋着雨走到公交站，各自上了不同的车，各自回家。\n成绩出来她去了双非，你去了想去的学校，不同城。大一她寄过一封信，里面只有一颗薄荷糖和一行字：「这次轮我先说了，谢谢。」\n你回了她一道高数题的解题步骤，附了一句「这道你肯定会」。她没再回信，但你大二那年收到一个快递，里面是一本新版错题本，扉页写着：「继续。」\n讲台旁边那张桌子后来换了人，桌上摆着别人的文具袋。\n她仍旧把错题本带在书包里，一页没撕。"}, "D": {"title": "没对上号", "text": "她在雨里张了张嘴，最后说「谢谢你借我的错题本」。你没接话，两人各自走了。\n她复读了一年，考到了另一个城市。你在保送的学校读得很好，课业很忙，很少想起高中。\n三年后你在校友群里看到她的名字，想了一分钟才想起是高中那个同桌，又过了一分钟才想起来她叫程简简。\n你翻出那本旧错题本，最后一道大题旁边空着，笔迹早褪了。"}}, "vigs": [{"title": "旁边那个座", "need": 0, "lines": ["班主任调座位时问她对调到第一排有什么意见，她把书包甩到新桌上没抬头。", "「没意见。旁边那个座空着也行，反正他不常来。」", "她拉开椅子坐下把错题本翻开放在桌上，往旁边空座位的桌角看了一眼。"]}, {"title": "笔袋拉上", "need": 0, "lines": ["有人趁她不在翻了她桌上的错题本还拿走了夹在里面的志愿草表，她回来发现本子摊着，拉链拉开着。", "「谁翻的。」", "她把错题本塞进书包最底层拉上拉链，把笔袋也收了塞进去。"]}, {"title": "蓝笔不黑笔", "need": 0, "lines": ["她从笔袋里倒出五支笔，把三支黑色的推到一边，留两支蓝色的在桌面上，黑色那三支塞回笔袋底层。", "「蓝笔写卷子老师看得清。黑笔写错了老师也看不清改没改。」", "她拧开一支蓝笔在草稿纸角上画了两道试出水，把另一支备用蓝笔搁在笔袋口。"]}, {"title": "小卖部那条", "need": 0, "lines": ["她从笔袋底部摸出一张旧照片翻过来，背面写着光明路小学六年三班，日期是六年前。", "「小学门口那条光明路有个小卖部，辣条一毛钱一根，我那时候一天买两根，攒了一个月请人吃了根冰棍。」", "她把照片塞回笔袋底部，拉上拉链把错题本翻到新的一页。"]}, {"title": "借什么橡皮", "need": 0, "lines": ["前排一个女生回头说想借她的橡皮，她手捂着错题本看了一眼那女生的桌面。", "「桌上不是还有一块？比这块还新。不借。」", "那女生转回去了，她把橡皮塞进笔袋拉上拉链，低头接着算第三道大题。"]}, {"title": "填了才算", "need": 0, "lines": ["她趴在桌上填志愿表填到第二栏停了笔，你问她卡什么了，她拿笔帽敲了两下桌面。", "「……填了的才算数。没填的那个不算，对吧。」", "她把志愿表折了两折塞进书包夹层，从抽屉里翻出一套数学卷子铺在桌上。"]}, {"title": "一个人刷题", "need": 0, "lines": ["晚自习后教室空了，她把课桌上的练习册摞成一摞挡住脸，从底下抽出一套数学卷子。", "「最后这道大题怎么又是对的，答案印错了吧。」", "她翻到答案页看了两遍，把卷子折成四折塞进书包夹层，趴在桌上闭了眼。"]}, {"title": "错题本还我", "need": 0, "lines": ["她一把抽走你桌上的错题本，翻了两页，嗤了一声，扔回你怀里。你桌上摊着志愿表，她瞥了一眼又移开。", "「你这错题本比我脸皮还厚，第三道你抄了三遍还能抄错，你是故意的吧？」", "「……志愿表别给我看，看了我也不会帮你填。」"]}, {"title": "值日表", "need": 0, "lines": ["值日表贴在门后，每周换一次。你发现自己和她被排在同一组，连续三周。", "「不是我改的。」", "她说这话时没抬头，笔尖在纸上顿了一下。"]}, {"title": "薄荷糖", "need": 0, "lines": ["她的笔袋里有一小罐薄荷糖，铁盒，盖子磨花了。", "午休时她会推一颗到你桌上，从来不多说。", "你后来数过：一罐三十颗，她给你二十三颗，自己留七颗。", "「数什么数。给你就吃。」"]}, {"title": "最后一页", "need": 0, "lines": ["错题本最后一页，她写过一行字又划掉，划得很用力，纸都破了。", "你凑近看，只认得出一个「你」字，后面全被墨水盖住了。", "她把本子合上，塞进抽屉最里面。", "「别看。看什么看。」"]}], "route": "jian", "arch": "", "context": {"world": "明德中学高三（七）班，八月底。后墙的倒计时牌会从一百八十天慢慢换到三十天；同桌、月考、家长会与志愿表，将把两个人的距离反复拉近又推开。", "premise": "八月底，教室后墙挂起高考倒计时。座位表最后一排的名字被红笔圈住。你搬过去时，程简简还低着头，先把那句「这位置有人了」顶了回来；桌上的本子合得很快。", "player": "你是明德中学高三（七）班的学生，成绩是年级第一。班主任把你叫去办公室，安排你到最后一排，和转学生程简简同桌。", "relation": "程简简才是转来的那个人，你原本就在这个班。你们从新同桌与学习帮扶的安排开始相处；你不是她的老师、监护人，也不是她已经交往的对象。", "known": ["班主任希望你帮她补基础，但成绩与选择仍然属于她自己。", "她嘴硬、警惕被人小看；你目前只知道她学习吃力，还不知道她在背后做了多少努力。"], "unknown": "她为什么转来、家里给了她怎样的压力，以及她想去哪里，都需要由她逐渐说出来。不能把后面的志愿选择当作你们已经约好的未来。", "opening": "座位表上，最后一排靠窗的位置被圈了起来。你抱着书走过去，程简简用手肘压住桌上的本子。\n「看什么看。这位置有人了。」\n后墙的倒计时牌刚换上新的数字。", "goal": "从新同桌的第一天开始，决定怎样与她相处。帮忙可以先问一句，考试、志愿和是否接受帮助都需要尊重她的决定。"}, "desc": "自尊心比成绩单硬。越紧张越贫嘴，从不说我不行。"};

(D.context.known||[]).forEach(text=>{const li=document.createElement('li');li.textContent=text;$('#known').appendChild(li);});
if(D.world){ $('#world').textContent=D.world; } else { $('#secWorld').style.display='none'; $('#world').style.display='none'; }
if(D.premise){ $('#premise').textContent=D.premise; } else { $('#secPremise').style.display='none'; $('#premise').style.display='none'; }
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      if(/陪|等|不|别走|谢|留|帮|说|问|看|递|握/.test(t)) warm++;
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=warm/Math.max(1,total);
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
let started=false;
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; if(!started){started=true;render();} };
$('#contextAgain').onclick=()=>{ $('#intro').style.display='block'; $('#stage').style.display='none'; $('#go').textContent=started?'回到当前剧情':'开始'; window.scrollTo({top:0,behavior:'smooth'}); };
</script></body></html>
