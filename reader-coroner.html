<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>陈默 · 逐字版</title>
<style>
:root{--bg:#0f0c0b;--ink:#ece6de;--dim:#a49b90;--faint:#6f6862;--line:rgba(255,255,255,.09);
--accent:#c9a06a;--acc-ink:#1a140e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 70% at 50% 0,#1a1512,#0f0c0b 62%);color:var(--ink);
 font:17px/1.9 "Songti SC","Noto Serif SC",serif;min-height:100dvh}
.wrap{max-width:680px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px 60px}
h1{font-size:22px;font-weight:500;margin:0 0 4px;letter-spacing:.04em}
.meta{color:var(--faint);font-size:12.5px;letter-spacing:.12em}
.sec{color:var(--accent);font-size:11.5px;letter-spacing:.18em;margin:20px 0 6px}
p.world{color:var(--dim);font-size:14px;margin:0}
.btn{display:inline-block;margin-top:18px;background:var(--accent);color:var(--acc-ink);border:0;
 border-radius:12px;padding:11px 20px;font-size:15px;font-family:inherit}
#stage{display:none}
.chap{color:var(--faint);font-size:12px;letter-spacing:.16em;text-align:center;margin:26px 0 14px}
.nar{margin:0 0 14px;line-height:2;font-size:16.5px}
.her{background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:2px solid var(--accent);
 border-radius:14px;padding:11px 15px;margin:0 0 14px}
.choices{display:grid;gap:9px;margin:18px 0 0}
.choices button{text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);
 border-radius:12px;padding:12px 14px;font-size:14.5px;font-family:inherit}
.choices button:hover{border-color:rgba(201,160,106,.5)}
.endcard{margin:22px 0;padding:16px 18px;border-radius:16px;border:1px solid rgba(201,160,106,.32);
 background:linear-gradient(180deg,rgba(201,160,106,.1),transparent)}
.eth{color:var(--accent);font-size:12.5px;letter-spacing:.12em;margin-bottom:8px}
.vig{margin-top:20px;border-top:1px dashed var(--line);padding-top:14px}
.vig h3{font-size:14px;font-weight:500;margin:0 0 8px;color:#c8a37a}
.vig p{margin:0 0 8px;color:var(--dim);font-size:14px}
.small{color:var(--faint);font-size:12.5px;margin-top:10px}
</style></head><body><div class="wrap">
<div id="intro">
  <h1 id="nm"></h1><div class="meta" id="mt"></div>
  <div class="sec" id="secWorld">故事背景</div><p class="world" id="world"></p>
  <div class="sec" id="secProfile">人物</div><div id="profile"></div>
  <div class="sec" id="secPremise">前情提要</div><p class="world" id="premise"></p>
  <button class="btn" id="go">开始</button>
  <div class="small">这一版是写死的正文：不联网、不需要模型，每句都对过。</div>
</div>
<div id="stage"><div id="log"></div><div class="choices" id="ch"></div></div>
</div>
<script>
const D={"name": "陈默", "meta": "30 · 市局法医", "premise": "雨夜送来一具无名女尸，指甲缝里有贝壳粉。你被派来做协查记录。", "world": "市局法医室在地下二层，常年十七度。走廊尽头一台老式除湿机，响一整夜。", "chapters": [{"title": "第一章 一具无名尸", "scenes": [{"lines": [["nar", "雨从卷帘门缝里打进来，在地上积成一条细线。担架轮子碾过水渍，停在解剖台边。"], ["nar", "陈默把无影灯拉低，灯罩边缘滴下一颗水珠。他戴上手套，托起死者的右手，指缝里嵌着细白的碎屑。"], ["say", "“记录：指甲缝内见白色粉末，颗粒均匀。”"], ["nar", "你把记录本翻到第一页，笔尖停在日期栏。他把那只手放回白布上，指腹的位置留下一个浅印。"]], "choices": ["（把记录本翻到第一页）", "问他先看什么", "站在门口先不进去"], "n": 1}, {"lines": [["nar", "他换了一副手套，把装碎屑的纸袋封口压平。窗外的雨敲在排风扇上，一下一下。"], ["say", "“贝壳粉。来源应该在城东旧码头。”"], ["nar", "你把地点写进备注栏，笔尖在“码头”两个字上多停了一瞬。他没有抬头，把纸袋放进证物盒。"], ["say", "“不是海里捞上来的那种。颗粒里混着水泥灰。”"]], "choices": ["记下来，不打断", "问他怎么确定", "说这也能查？"], "n": 2}, {"lines": [["nar", "你翻回前一页，在“溺水”旁边画了一道横线。解剖台上的白布只掀到胸口，死者手腕上有一圈浅白的压痕。"], ["say", "“肺里没水。”陈默把气管切开处的棉签放进试管，“不是溺死。”"], ["nar", "你把那行推测划掉，笔迹压在横线上。他拧开试管架上的盖子，玻璃碰出一声轻响。"], ["say", "“压痕是绳子的。死后入水。”"]], "choices": ["（把推测划掉）", "再猜一次", "问他那是什么"], "n": 3}, {"lines": [["nar", "凌晨三点，走廊的灯灭了一半。你桌上的咖啡凉透，杯壁凝着一圈褐色的渍。"], ["nar", "你把它端去茶水间，倒掉，重新冲了一杯。热气从杯口升起来，糊住值班表的边角。"], ["nar", "你回到解剖室，把杯子放在他手边的托盘外沿，没有碰那排试管。"], ["say", "“趁热。”"]], "choices": ["放在他手边就走", "说一句趁热", "看着他喝完"], "n": 4}, {"lines": [["nar", "报告打印出来，第三页有一段被他用黑笔划掉。划痕很重，纸背凸起一道印。"], ["nar", "你凑近看，被删掉的是“疑似在旧码头落水”。下面只留：指甲缝内检出贝壳粉及水泥灰。"], ["say", "“这样上面会退。”"], ["say", "“只留证据。”"], ["nar", "陈默把笔帽扣上，推回你面前。笔尖在“鉴定人”栏旁边停住，没有落下去。"]], "choices": ["问为什么删", "（什么也没问）", "说这样上面会退"], "n": 5}, {"lines": [["nar", "天亮前，协查系统弹出一条比对结果。旧城区，周桂芬，五十七岁，裁缝。"], ["nar", "陈默把打印页从传真机里抽出来，纸边还热着。他看着“职业”一栏，手指在“裁缝”两个字下面划过。"], ["nar", "你把名字抄进记录本，笔尖在“桂”字的最后一横上顿了顿。桌角放着她随身物品的透明袋，里面有一把缠着线头的软尺。"], ["say", "“通知家属的事，等指甲缝的报告出来再走。”"]], "choices": ["（把名字抄一遍）", "问要不要通知家属", "看他怎么反应"], "n": 6}]}, {"title": "第二章 证据不足", "scenes": [{"lines": [["nar", "解剖室的门是双开的，左扇底下有一道被推车撞出来的凹痕。陈默背对着门在洗手，肘部以上全是水。"], ["say", "“站那边。”"], ["nar", "他抬了抬下巴，指向器械台侧面的黄线。你把记录本夹在腋下，站到线外。台面上一排器械按长短排开，最长的那把尺子边缘有一处豁口。"], ["nar", "他关了水，抽纸巾擦手，擦到指缝时停了一下，纸团扔进黄色桶里，桶盖弹回来，响了一声。"], ["say", "“无名氏，编号照昨天的往下排。先记体表。”"]], "choices": ["站在他指定的位置", "问能不能靠近", "说你不怕"], "n": 7}, {"lines": [["nar", "你退到墙边，后背贴住瓷砖。有一块松了，随着呼吸轻轻磕出声音。"], ["nar", "他没抬头。刀在组织间走的声音很轻，像撕一张湿的纸。"], ["say", "“脾，十二乘七，表面未见破口。”"], ["nar", "他把取样瓶递向记录员，瓶壁上一片水雾。玻璃碰到不锈钢托盘，叮的一下。"], ["nar", "他换了一只手套，手停了几秒，等这一声散干净，才继续往下切。"]], "choices": ["（扶着墙缓一会儿）", "说声抱歉", "问还有多久"], "n": 8}, {"lines": [["nar", "收尾的时候他把手套反过来脱，一层滑石粉。水池上方的镜子里映出他没刮干净的下颌。"], ["say", "“陈老师，你刚才说了三次证据不足。”"], ["nar", "他把手套丢进桶里，拧开水龙头，等水变热的几秒里没说话。"], ["say", "“证据不足不是没有证据。是有的东西还不够多，不够排他。”"], ["say", "“指甲缝里那点贝壳粉，只能说明她碰过海。说明不了她在哪儿碰的，也说明不了是谁让她碰的。”"]], "choices": ["等他答", "说这不是回答", "把话题岔开"], "n": 9}, {"lines": [["nar", "他拉开抽屉找烟，抽屉里有一盒火柴和一个铁皮盒，盒面印着某年的月饼广告。他没找到烟，把抽屉推回去。"], ["say", "“我第一具尸体，叫周小满。”"], ["nar", "窗外的雨敲在空调外机上，节奏很密。他伸手把百叶窗的叶片掰正了一格。"], ["say", "“十九岁。她母亲来认的时候，手里拎着一袋她爱吃的橘子。”"], ["nar", "他说完，把记录本合上，纸页对齐，在桌沿上磕了两下。"]], "choices": ["（不接话，只听着）", "问他现在还记不记得", "说谢谢告诉我"], "n": 10}, {"lines": [["nar", "通知是下午三点到的，一张纸，盖了红章，压在他桌上的电话机底下。他看了不到十秒。"], ["say", "“辖区变更。上面写的。”"], ["nar", "他把纸推过来。你帮他把散在台面上的照片和取样单一张张收进档案袋，袋口的绳子绕了三圈。"], ["say", "“要不要争一下。”"], ["nar", "他接过档案袋，掂了掂，放进柜子最下层，锁上，钥匙转了两圈。"]], "choices": ["问他要不要争", "（帮他把记录收好）", "说这不合理"], "n": 11}, {"lines": [["nar", "晚上九点，走廊的声控灯灭了。解剖室的门虚掩着，里面没开灯。"], ["nar", "他坐在靠墙的圆凳上，面前是不锈钢台。台面擦得很干，映着走廊漏进来的一条白光。"], ["say", "“门带上。”"], ["nar", "声音在瓷砖之间撞了一下，散了。你站在门口，没动。他手边放着一只纸杯，杯口的水汽早就没了。"]], "choices": ["（把灯打开）", "在门口站一会儿", "叫他的名字"], "n": 12}]}, {"title": "第三章 不必证明", "scenes": [{"lines": [["nar", "台风在窗外拐了弯。解剖室的灯闪了两下，灭了。应急灯撑了几秒也暗下去。陈默从器械台底下摸出手电，用牙咬住，光柱横着打上台面。"], ["say", "“要不要等来电？”"], ["nar", "他没应。左手接手电，右手持刀。水还在流，雨砸在玻璃上，一下是一下。"], ["nar", "最后一刀走完，他关水，手套上全是水。手电光里，切面平得像刚磨过的。"]], "choices": ["举着手电不放", "问要不要停", "说已经够了"], "n": 13}, {"lines": [["nar", "你把牛皮纸袋放上器械台，袋口没封，纸角翘着。"], ["say", "“被删掉的那份，复印件。”"], ["nar", "他没接。手套上的水沿指缝滴在台面上，一滴，两滴。光柱斜过去，停在纸袋口。"], ["nar", "纸抽出来，第三页右下角有一块白边，裁掉又补上的。"], ["say", "“原件在谁手里？”"]], "choices": ["放在台上，不解释", "说这是我留的", "问他敢不敢用"], "n": 14}, {"lines": [["nar", "他摘下口罩，挂在一边耳朵上。窗外的雨声稀了。"], ["say", "“我女儿也玩那种沙子。水族馆门口卖的。”"], ["nar", "他说得很轻，说完就脱手套，扔进黄桶。桶盖合上，没响。"], ["nar", "你听清了，没让他重复。他去洗手，水开得很大。"]], "choices": ["（听清了，没让他重复）", "说我听见了", "问他什么意思"], "n": 15}, {"lines": [["nar", "卷宗合上，封条压平，归档章盖在骑缝上。走廊尽头有一根灯管在闪。"], ["say", "“结了。”"], ["nar", "你把擦过骨锯的布翻了个面，又擦一遍。刃上照出一小条灯管的白光。"], ["say", "“没人被追责。”"], ["nar", "他拧开水龙头，冲手，冲了很久。水从指缝里过。"]], "choices": ["问他还做不做", "（把骨锯擦干净）", "说这不公平"], "n": 16}, {"lines": [["nar", "他把骨锯放回箱子。凹槽正好卡住，海绵垫压下去，合盖。"], ["nar", "锁扣扣上，两声。箱角蹭过桌沿，留下一道浅白印子。"], ["nar", "你拎起自己的包。门外的雨停了，地上有水光，反着路灯。"], ["say", "“下次别带复印件来。”"], ["nar", "他提起箱子，往门口走。经过你身边时，箱角轻轻碰了一下你的包。"]], "choices": ["帮他扣上", "说下次还来", "（什么都不说）"], "n": 17}]}], "endings": {"A": {"title": "不是速溶的", "text": "他把手套摘了，很慢，一只一只。手背上有一道旧疤，从虎口斜到腕子。然后他伸手，把你湿透的袖子捏了一下，只捏了一下就松开，像在确认温度。明天我请你喝咖啡，他说，不是速溶的。"}, "B": {"title": "下周还来吗", "text": "他把那份副本收进箱子，说等我用完。箱子锁上，钥匙挂回墙上，他在门口停了半步，问你下周还来吗。走廊的除湿机还在响，你点头，他说好，然后先走了。"}, "C": {"title": "盖章那天", "text": "报告最后只写了结论，一页半，没有推测。信封上盖了章，编号是新的。他把箱子放回柜子，锁好，钥匙挂回墙上，位置和之前一模一样，差半厘米都看得出来。"}, "D": {"title": "台上那份副本", "text": "台风过后他调去了邻市。解剖室的灯还亮着，台上的那份副本没人收，边角被风翻起来。你把它压平，看了一眼最后一页，那里空着，什么都没写。"}}, "vigs": [{"title": "十七度", "need": 6, "lines": ["法医室常年十七度，比走廊低四度。", "他从不穿外套，说温度高了手会软。", "你第一次进来打了个哆嗦，他抬头看了一眼，把空调调高一度。", "第二天又调回十七度，谁也没提。"]}, {"title": "手套", "need": 12, "lines": ["他一天换四副手套，换之前先把旧的叠成方块。", "有人问他为什么这么讲究。", "他说：手套破了，证据就脏了。", "抽屉最里面有一副没拆封的，尺码比他的小一号。"]}, {"title": "第一具", "need": 18, "lines": ["他说起自己第一具尸体时，语速比平时慢。", "名字、年龄、指甲颜色，一个数字都没错。", "「你怎么记得这么清？」", "「记不清就得重来。」他顿了顿，「可人不能重来。」"]}], "route": "coroner", "arch": "验尸人"};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
if(D.world){ $('#world').textContent=D.world; } else { $('#secWorld').style.display='none'; $('#world').style.display='none'; }
if(D.profile && D.profile.length){ $('#profile').innerHTML = D.profile.map(([k,v])=>'<p class="world"><b style="color:#c8a37a;font-weight:400">'+k+'</b>　'+v+'</p>').join(''); }
else { $('#secProfile').style.display='none'; $('#profile').style.display='none'; }
if(D.premise){ $('#premise').textContent=D.premise; } else { $('#secPremise').style.display='none'; $('#premise').style.display='none'; }
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      if(/陪|等|不|别走|谢|留|帮|说|问|看|递|握/.test(t)) warm++;
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=warm/Math.max(1,total);
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; render(); };
</script></body></html>
