<script>
const D={"name": "霍衍", "meta": "36 · 家族企业总经理", "premise": "季报会议开到一半，顾问推门进来。霍衍握笔的手停了一秒，仍把报告说完。等他抬头时，面对的已经不是当年可以随意安排的员工。", "world": "家族企业的顶层办公室，玻璃隔断，百叶帘常年半开。董事会会议室里挂着一张老照片。", "chapters": [{"title": "第一章 她回来了", "scenes": [{"lines": [["nar", "钢笔尖停在会议记录本上，墨水洇出一个圆点。"], ["nar", "他把最后半句季报分析说完，声音和语速都没变。"], ["say", "“华东区的渠道成本下季度再压五个点。”"], ["nar", "合上笔帽，才抬起眼看向会议室门口。"]], "choices": ["先说完手里的话", "直接叫她的名字", "（把笔放下）"], "n": 1, "fx": [0, 0, 0]}, {"lines": [["nar", "他把面前的红笔往桌角一推，下巴朝长桌另一端抬了抬。"], ["say", "“坐那边。”"], ["nar", "她拉开椅子，文件夹放在桌上，翻开第一页。"], ["nar", "他伸手去拧笔帽，拧了半圈，又退回来把手搁下。"]], "choices": ["照旧命令", "改口说请", "（什么也不说）"], "n": 2, "fx": [0, 0, 0]}, {"lines": [["nar", "她翻到数据页，手指点在第三行。"], ["say", "“三家子公司去年人力成本超预算百分之十七，主要在销售部门。”"], ["nar", "他盯着她按纸面的食指，指甲剪得很短，指节比三年前明显。"], ["say", "“销售离职率多少。”"], ["nar", "她报了一串数字，中间没有停顿，视线始终在纸上。"]], "choices": ["按公事谈完", "问她过得怎么样", "（把细节问细）"], "n": 3, "fx": [0, 1, 1]}, {"lines": [["nar", "散会后他站在走廊尽头，助理小周追上来递了一张对折的便签纸。"], ["nar", "他打开，上面写着一个小区名字和门牌号。"], ["say", "“查一下她什么时候搬来的。”"], ["say", "“再问问，董事会那边是谁提的名。”"], ["nar", "回到办公室，他把便签对折，压在名片盒底下，露出一个角。"]], "choices": ["让人继续查", "停手", "（把地址收进抽屉）"], "n": 4, "fx": [0, 0, 0]}, {"lines": [["nar", "第二天上午，小周把那盆绿萝从窗台端进里间，放在靠墙的桌上。"], ["nar", "外间空出来的工位上只剩一个马克杯，杯底一圈旧茶渍。"], ["nar", "她从走廊拐过来，看了一眼新位置，又看他。"], ["say", "“霍总，我的位置在外间。”"], ["nar", "他没抬头，把签好的文件翻到下一页。"]], "choices": ["亲自去说", "让助理去说", "（不解释）"], "n": 5, "fx": [0, 0, 0]}, {"lines": [["nar", "散会的人陆续出了门，投影仪的风扇还在转。她收好文件夹，最后一个走到门口。"], ["nar", "他立在门边，一只手扶着门框，留出半个身位的空隙。"], ["say", "“简顾问。”"], ["nar", "她停住，抱着文件夹转过身，等他说下去。"], ["nar", "走廊的感应灯亮了一下，照出他扶在门框上的指节。"]], "choices": ["等她说", "先开口", "（把门扶着）"], "n": 6, "fx": [1, 0, 0]}]}, {"title": "第二章 命令句变成问句", "scenes": [{"lines": [["nar", "会议室的百叶窗拉到一半，投影的光落在长桌尽头。她坐在顾问席，桌牌是新的，边角还没磨圆。"], ["say", "“三厂的产线不能停。”"], ["nar", "霍衍的手指点在成本表那一栏，没有移开。她把笔帽扣上，声音不高。"], ["say", "“停两周，换的是明年整年的交付。”"], ["nar", "桌尾有人咳嗽。他合上册子，推回桌心，手掌压着封皮。"], ["say", "“按原方案走。”"], ["nar", "她点头，把笔放进包里，拉链拉到一半停住，又抽出来在本子上写了一行小字。散会时椅子腿在木地板上响了一声。"]], "choices": ["压到底", "让她讲完", "（把方案退回去）"], "n": 7, "fx": [0, 0, 0]}, {"lines": [["nar", "第二天上午，他桌上多了一只牛皮纸信封，没有封口，压在他的保温杯底下。"], ["nar", "他抽出两页纸，看完，放回去，把杯子挪回来压住。"], ["say", "“这是什么意思。”"], ["nar", "她站在门口，没有进来，手里还捏着门把手。"], ["say", "“顾问合同里写着，建议不被采纳，我可以退出。”"], ["nar", "他把信封往桌沿推了半寸，没有推下去。"], ["say", "“董事会签的，不是我签的。”"], ["nar", "她走过来，把信封推回桌子中央，指尖在纸上按了一下，转身走了。门没关严，走廊的光从缝里进来，落在信封上。"]], "choices": ["不接", "问她为什么", "（把辞呈推回去）"], "n": 8, "fx": [0, 1, 0]}, {"lines": [["nar", "下午四点，他在她临时办公室门口站了一会儿。门开着，她在收图纸，桌上摆着一只纸箱，里面是样件和三本旧台账。"], ["say", "“你留一下。”"], ["nar", "她抬头，笔没放下。他走进来，把门带上，站在桌对面，没有坐。"], ["say", "“你要什么。”"], ["nar", "她的笔搁在图纸上，滚了半圈停住。窗外空调外机响起来，一阵一阵。"], ["say", "“说慢一点也行。”"], ["nar", "他把手从桌沿拿开，垂在身侧。纸箱里最上面那本台账的角卷了，露出里面一张折过的报销单。"]], "choices": ["等她答", "说自己想给什么", "（把话咽下去）"], "n": 9, "fx": [1, 0, 0]}, {"lines": [["nar", "台风登陆那晚，公司群发了停工通知。他十一点从公司出来，雨刷开到最快，还是看不清路。"], ["nar", "车停在她楼下，老小区，路灯坏了一盏。六楼靠东的那扇窗亮着，窗帘没拉严。"], ["nar", "他熄了火，雨砸在车顶，声音很闷。副驾上放着一把伞，他拿起来，又放回去。"], ["nar", "手机屏幕亮过一次，他按灭。车窗起了雾，他抹出一道，那扇窗还亮着。"], ["say", "“别上来。”他在电话里只说了这三个字。"], ["nar", "两点十分，灯灭了。他把钥匙拧到一半，又松开。"]], "choices": ["在车里等", "上去敲门", "（发消息问在不在）"], "n": 10, "fx": [1, 0, 1]}, {"lines": [["nar", "天亮时雨小了。她撑伞下来，敲了敲驾驶座的窗。玻璃降下来，潮气涌进来。"], ["nar", "他往副驾挪了挪，把伞接过来靠在脚垫上，水滴在上面洇开一片。"], ["say", "“三年前那句话，你再说一遍。”"], ["nar", "她坐进来，没有关车门，一只脚还踩在外面。仪表盘的光映在他手背上，他握着方向盘。"], ["say", "“那句话是错的。”"], ["nar", "暖风开得太大，他伸手把旋钮关小一格。她看着他，等下文，他没有下文。"], ["say", "“就这一句？”"], ["say", "“就这一句。”"]], "choices": ["承认是错的", "说当时有别的原因", "（沉默）"], "n": 11, "fx": [0, 1, 0]}, {"lines": [["nar", "她把脚收回去，关上车门，力道不轻。伞在雨里撑开，她往楼道走。"], ["nar", "他推开车门下来，站在车头前面，雨落在肩上。"], ["nar", "楼道口的感应灯亮了一下，又灭。她的伞收了，门关上了。"], ["nar", "六楼那扇窗的灯亮起来，再没有灭。他站着，没动。"], ["say", "“当年那句话，我不解释了。”他把车窗摇下一半，雨声灌进来。"], ["nar", "回到车里，他把车灯关了，钥匙插在锁孔里，没有拧。"]], "choices": ["追出去", "站在原地看着", "（把车灯关了）"], "n": 12, "fx": [0, 1, 0]}]}, {"title": "第三章 把自己交出去", "scenes": [{"lines": [["nar", "会议室在十七楼，落地窗外是灰白的天。霍衍翻开面前的文件夹，纸页边缘有一道旧折痕。"], ["say", "“三年前，我跟她说的是——你明天不用来了，工资结到今天。”"], ["nar", "桌面上几只茶杯同时放下，瓷底磕在桌板上，一声接一声。她坐在顾问席，笔帽还没拔。"], ["say", "“原因是我签的那份合同出了纰漏，执行是她去做的，责任在我。”"], ["nar", "出风口的冷气吹得文件角翘起来。她把笔帽拔了，笔尖悬在记录本上方，没有落下去。"]], "choices": ["只说事实", "说出那句原话", "（把责任全揽下）"], "n": 13, "fx": [0, 0, 0]}, {"lines": [["nar", "散会后走廊只剩他们两个人，日光灯管有一支接触不良，隔几秒嗡一声。窗台上摆着一盆绿萝，垂下来的叶子扫到她的手背。"], ["say", "“我不信。”"], ["nar", "他靠住窗台，两只手插在裤兜里，目光落在她手里那份会议纪要上。"], ["say", "“图个干净。”"], ["nar", "她把纪要卷成纸筒，握在手里，指节泛白。窗外起了风，玻璃震了一下。"]], "choices": ["说图你留下", "说图个干净", "（不解释）"], "n": 14, "fx": [1, 0, 0]}, {"lines": [["nar", "他把一份授权文件放在桌面上，旁边搁着一支黑色签字笔。总经理的职责栏印了半页，他在第一行签了自己的名字。"], ["say", "“运营和人事归你。我只管财务和董事会。”"], ["nar", "她把文件转向自己，逐行往下看，看到第三页，停了。"], ["nar", "他把笔拿起来，笔帽拧开，放在她手边。"], ["say", "“签不签，今天都算数。”"]], "choices": ["签字", "等她开口", "（把笔递给她）"], "n": 15, "fx": [0, 1, 1]}, {"lines": [["nar", "下班的时候天阴得厉害，走廊尽头那扇门开着。她站在门框外面，一只手搭在把手上，没有往里迈。"], ["nar", "他坐在办公桌后，翻开一份报表，用红笔在一个数字上画了圈。"], ["nar", "门框上她的影子被灯拉得很长，一直铺到他的桌角。"], ["say", "“桌上的东西，你自己收。”他说完就转过身去。"], ["nar", "他合上报表，拉开抽屉，把钥匙放进去，转了一下锁。"]], "choices": ["走出去", "等她自己进来", "（先说话）"], "n": 16, "fx": [0, 1, 0]}, {"lines": [["nar", "雨停在傍晚，楼下的地砖还湿着，路灯照出一片一片的水光。他走出大门，看见她站在台阶下面看手机。"], ["say", "“要不要一起吃个饭。”"], ["nar", "她把手机收进口袋，抬头看他。台阶边沿有一小摊积水，正慢慢往地砖缝里渗。"], ["say", "“吃什么。”"], ["nar", "他往右边走了两步，站到那一排地砖干的地方，停下来，回头看她。"]], "choices": ["问吃什么", "说好", "（先走两步等她）"], "n": 17, "fx": [1, 0, 1]}]}], "endings": {"A": {"title": "位置你挑", "text": "他把办公室钥匙推过来，铜的，磨得发亮，说位置你挑。窗外的雨停了，玻璃上还挂着水痕。她拿起钥匙，先在桌上放了放，才握进手里，很轻地说了一句：那我挑里间。"}, "B": {"title": "不用你决定", "text": "董事会散了，他一个人坐在原位，百叶帘拉开半截。桌上的方案被翻到最后一页，那里有她留的一行字，圆珠笔写的：这次不用你决定。他把那页看了两遍，才合上。"}, "C": {"title": "空着的桌子", "text": "她没留下。他让人把里间那张桌子留着，一直空着。桌面不许人擦，笔筒里的笔还是她走时那个方向，斜着的。有人问要不要收起来，他说放着。"}, "D": {"title": "不用叫霍总", "text": "他交出总经理位置那天，她来送文件。签完字他把笔盖扣上，说以后不用叫我霍总了。她笑了一下，笑得很短，把文件收进包里，走廊的灯正好亮起来。"}}, "vigs": [{"title": "百叶帘", "need": 6, "lines": ["百叶帘常年半开，角度是固定的。", "有人调过一回，第二天就恢复了。", "她说光线刺眼，他就让人换了更厚的帘子，没解释。", "帘子换好之后，角度还是那个角度。"]}, {"title": "钢笔", "need": 12, "lines": ["他签字用一支旧钢笔，笔杆有裂纹。", "秘书买过新的，被他放回盒子里。", "那支笔是他父亲留下的，笔尖有点分叉。", "写「霍衍」两个字的时候，他会慢半拍。"]}, {"title": "老照片", "need": 18, "lines": ["董事会会议室挂着一张老照片，厂门口的合影。", "照片第三排左边第三个人是他父亲。", "他每次开会都坐在能看见照片的位置。", "有一年照片被取下来过，他让人重新挂回去，钉子换了新的。"]}], "route": "tyrant", "arch": "施害后知后觉者", "context": {"world": "家族企业的顶层办公室，玻璃隔断，百叶帘常年半开。董事会会议室里挂着一张老照片。", "premise": "季报会议开到一半，顾问推门进来。霍衍握笔的手停了一秒，仍把报告说完。等他抬头时，面对的已经不是当年可以随意安排的员工。", "player": "本篇跟随总经理霍衍的视角。三年前，是他让一位旧员工离开公司；如今对方作为董事会聘请的顾问回来。", "relation": "霍衍与回来的顾问有一段未处理的伤害。对方只谈公事，不等于接受道歉，更不等于已经与他重建私人关系。", "known": ["霍衍知道当年让人离开的决定出自自己。", "这次顾问由董事会聘请，有独立职责，不能当成他的私人安排。"], "unknown": "他是否会承担当年的责任、如何学会征询而非命令，以及对方会怎样选择，都还没有发生。", "opening": "你推开会议室门，文件夹上的顾问聘任字样露在外面。霍衍合上钢笔帽，目光在你脸上停了一秒。\n「坐那边。」\n他说得仍是命令句，长桌对面有人把椅子往后拉开。", "goal": "面对顾问的独立立场与旧日责任，决定继续用命令处理一切，还是开始把事情说明白。"}, "desc": "傲慢、算计、迟钝；把关系当成本核算。命令句慢慢变成问句，是他唯一的变化。"};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
['player','relation','unknown','goal'].forEach(key=>{$('#'+key).textContent=D.context[key]||'';});
$('#persona').textContent=D.desc||'';
(D.context.known||[]).forEach(text=>{const li=document.createElement('li');li.textContent=text;$('#known').appendChild(li);});
if(D.world){ $('#world').textContent=D.world; } else { $('#secWorld').style.display='none'; $('#world').style.display='none'; }
if(D.premise){ $('#premise').textContent=D.premise; } else { $('#secPremise').style.display='none'; $('#premise').style.display='none'; }
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;   /* warm = 累计显式效果分（来自数据里的 fx.aff），不再用关键词猜 */
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach((choice, idx)=>{
    const t = (typeof choice === 'string') ? choice : (choice && choice.t) || '';
    const aff = (typeof choice === 'object' && choice && choice.fx && Number.isFinite(Number(choice.fx.aff)))
      ? Number(choice.fx.aff)
      : Number((s.fx && s.fx[idx]) || 0);
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      warm += aff;                    /* 分数只来自数据里的 fx，改文案不影响判定 */
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=Math.max(0, Math.min(1, warm/Math.max(1,total)));
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
let started=false;
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; if(!started){started=true;render();} };
$('#contextAgain').onclick=()=>{ $('#intro').style.display='block'; $('#stage').style.display='none'; $('#go').textContent=started?'回到当前剧情':'开始'; window.scrollTo({top:0,behavior:'smooth'}); };
</script></body></html>
