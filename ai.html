<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a0d12">
<link rel="apple-touch-icon" href="icon.svg">
<title>借你一场雨 · AI 版</title>
<style>
:root{--ink:#eef1f5;--dim:#9aa4b2;--warm:#e9b689;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:17px/1.85 "Songti SC","Noto Serif SC",serif;
background:radial-gradient(120% 80% at 50% 0,#141b26,#0a0d12 60%);min-height:100dvh;display:flex;flex-direction:column}
header{padding:calc(12px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ava{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#c9a0a6,#8a7fb8,#5d6f97);display:flex;align-items:center;justify-content:center;color:#1a1410;font-size:15px;flex:0 0 auto}
.who{flex:1 1 auto;min-width:52%}.nm{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{height:3px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:5px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--warm),#f3d0ab);transition:.4s}
.tools{display:flex;gap:6px;width:100%;overflow-x:auto}
button.mini{background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:7px 11px;font-size:12px;white-space:nowrap;min-height:34px}
button.mini.on{color:var(--warm);border-color:rgba(233,182,137,.5)}
main{flex:1;overflow-y:auto;padding:12px 13px 6px;max-width:760px;width:100%;margin:0 auto}
.b{max-width:88%;padding:10px 13px;border-radius:14px;margin:0 0 11px;white-space:pre-wrap;font-size:16.5px}
.b.her{background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:2px solid var(--warm)}
.b.me{margin-left:auto;background:rgba(233,182,137,.14);border:1px solid rgba(233,182,137,.3);text-align:right}
.act{color:var(--dim);font-size:14.5px;margin-top:5px}
#choices{display:flex;gap:7px;overflow-x:auto;padding:0 13px 8px;max-width:760px;margin:0 auto;width:100%}
#choices button{flex:0 0 auto;background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13.5px;font-family:inherit;min-height:38px}
footer{padding:7px 13px calc(11px + env(safe-area-inset-bottom));display:flex;gap:7px;border-top:1px solid var(--line);max-width:760px;margin:0 auto;width:100%}
#inp{flex:1;font-family:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px 13px;outline:none;resize:none;height:44px;max-height:110px}
#send{background:var(--warm);color:#20160d;border:0;border-radius:14px;padding:0 16px;font-size:15px;font-weight:600;min-width:66px}
#send[disabled]{opacity:.5}
#mem{display:none;padding:10px 14px;border-top:1px solid var(--line);max-height:38dvh;overflow:auto;font-size:13.5px;color:var(--dim);max-width:760px;margin:0 auto;width:100%}
.tip{color:var(--dim);font-size:12.5px;text-align:center;margin:4px 0 10px}
.endcard{margin:14px 0;padding:14px 16px;border-radius:16px;border:1px solid rgba(233,182,137,.35);background:linear-gradient(180deg,rgba(233,182,137,.10),rgba(233,182,137,.03))}
.eth{font-size:13px;letter-spacing:.12em;color:var(--warm);margin-bottom:8px}
.eb{font-size:16px;line-height:1.9}
.adv{color:#b9a894;font-size:13px;border-left:2px solid rgba(185,168,148,.4);padding:4px 0 4px 9px;margin:-4px 0 12px;line-height:1.6}
</style></head><body>
<header><div class="ava" id="ava">晞</div>
<div class="who"><div class="nm" id="nm">林未晞</div><div class="pl" id="pl"></div><div id="bar"><i id="affBar"></i></div></div>
<div class="tools"><button class="mini" id="pick">换人</button><button class="mini" id="mbtn">记忆</button>
<button class="mini" id="aibtn">AI</button><button class="mini" id="exp">存档</button><button class="mini" id="rst">重开</button></div></header>
<main id="log"><div class="tip" id="hint">点 <b>AI</b> 填入 DeepSeek key，她就会真的读你这句话；不填也能玩（模板演示）。</div></main>
<div id="choices"></div><div id="mem"></div>
<footer><textarea id="inp" placeholder="（动作）“台词”——只想说一句也行"></textarea><button id="send">发送</button></footer>
<script>
const CHARS={"wan": {"name": "林未晞", "meta": "23 · 旧书店店员 · 画画的", "desc": "慢热、克制。她把没画完的东西都藏起来。", "voice": "慢、低、克制，话少但每句都有信息", "start_chapter": "第一章 雨的形状"}, "yao": {"name": "沈之遥", "meta": "26 · 中学音乐老师 · 弹琴的", "desc": "外放、爱笑，用玩笑挡问题。三年前不告而别。", "voice": "亮、快一点，爱笑，用玩笑挡问题", "start_chapter": "第一章 旧调重弹"}, "wen": {"name": "闻笛", "meta": "27 · 深夜电台主持 · 便利店夜班", "desc": "声音比人先认识你。白天她不太会说话。", "voice": "电台压低，气声多，说话像在对麦克风", "start_chapter": "第一章 零点之后"}, "xiao": {"name": "萧明烛", "meta": "26 · 摄政长公主 · 掌兵符", "desc": "她只问你能做什么，不问你想什么。", "voice": "最慢、最平，命令句多，少用问号", "start_chapter": "第一章 抄书"}, "lu": {"name": "陆知白", "meta": "22 · 刑部主事 · 寒门进士", "desc": "她把自己活成了另一个人，只为把父亲没读完的书读完。", "voice": "稳、短、公文腔，偶尔冒出一句很软的", "start_chapter": "第一章 同僚"}, "shen": {"name": "沈知微", "meta": "18 · 替嫁庶女 · 开布铺", "desc": "她替姐姐嫁进裴家，进门前就记了半年的账。", "voice": "算账式，先说数字再说感受", "start_chapter": "第一章 替嫁"}, "jian": {"name": "程简简", "meta": "17 · 高三（七）班 · 垫底但嘴硬", "desc": "自尊心比成绩单硬。越紧张越贫嘴，从不说我不行。", "voice": "快、贫嘴，嘴硬，越紧张话越多", "start_chapter": "第一章 倒计时 180 天"}, "qing": {"name": "顾青梧", "meta": "29 · 建筑事务所合伙人", "desc": "六年前拿走了你的方案。她只会发号施令，正在学怎么问。", "voice": "干脆，习惯下指令，正在学怎么问", "start_chapter": "第一章 归来"}}, SCENES={"第一章 雨的形状": [{"id": "c1s1", "route": "wan", "beat": "半小时后，雨没有停的意思。屋檐的水连成一道帘子，街对面的人在跑，伞面被风吹得翻了边。"}, {"id": "c1s2", "route": "wan", "beat": "杯子是温的。握久了有点烫，得换手。柚子皮的苦味被热气顶着往上走，很淡。"}, {"id": "c1s3", "route": "wan", "beat": "你去书架深处闲逛。书是按颜色排的，不是按类别，红的一排、蓝的一排，最后一排全是褪成灰黄的旧译本。"}, {"id": "c1s4", "route": "wan", "beat": "八点，雨大到雨刷都来不及的那种程度。玻璃门外面什么也看不清，路灯只剩几团橘色的光。"}, {"id": "c1s5", "route": "wan", "beat": "伞下的空间窄得过分。她的肩膀和你的手臂之间隔着一层湿布料，能感觉到温度，也能感觉到那层布很薄。"}, {"id": "c1s6", "route": "wan", "beat": "她住的老楼没有电梯。楼梯间的声控灯坏了一半，走两步亮一下，暗下去的时候能听见雨水从伞尖滴到台阶上的声音。"}, {"id": "c1s7", "route": "wan", "beat": "第二天你带了两杯柚子茶，一杯正常，一杯少糖。塑料袋在手上晃，杯壁的水汽把袋子洇出一层白。"}, {"id": "c1s8", "route": "wan", "beat": "傍晚她在后门接电话。门没关严，声音一串一串飘进来，被雨打得很碎。"}, {"id": "c1s9", "route": "wan", "beat": "打烊之前，她在收银台后面写什么，写完撕下来，又揉掉。纸团在脚边堆了三个。"}], "第二章 未完成的画": [{"id": "c2s1", "route": "wan", "beat": "隔了一天，雨小了一些，成了很细的、落在脸上没有声音的那种。她带你穿过旧城区的巷子，两边是关着门的裁缝铺和修表摊。"}, {"id": "c2s90", "route": "wan", "beat": "书店下午没有客人。她蹲在书架和柜台之间的空地上，速写本摊在膝头，铅笔搁在耳朵上。"}, {"id": "c2s2", "route": "wan", "beat": "巷子尽头是一段废弃的站台。铁轨被雨泡得发黑，枕木间长满了草，草尖上挂着水。远处的信号灯还亮着，红得没有意义。"}, {"id": "c2s3", "route": "wan", "beat": "雨棚的缺口那边，水一层一层往下掉。她把本子从你手里拿回去，合上，两只手压在封面上。"}, {"id": "c2s4", "route": "wan", "beat": "她把手机递过来，屏幕上是一封邮件。退稿信只有三行，最下面是已经看过很多遍的“感谢您的投稿”。"}, {"id": "c2s5", "route": "wan", "beat": "她把本子合上，声音第一次变硬。硬得很干脆，像一块玻璃被人从中间掰断。"}, {"id": "c2s6", "route": "wan", "beat": "你到的时候她已经在搬了。书架最下面两层要清空，纸箱摞在门口，箱子上用马克笔写着文学、画册、不要了。"}, {"id": "c2s7", "route": "wan", "beat": "八点十七分，整条街的灯一起灭掉。"}, {"id": "c2s10", "route": "wan", "beat": "第三次退稿信是当面退的。编辑把稿子放在柜台上，往外推了两寸。"}, {"id": "c2s8", "route": "wan", "beat": "电一直没有来。后来你打开手机的灯，光柱里全是浮尘，慢慢地转，像雪。"}, {"id": "c2s9", "route": "wan", "beat": "十一点，她站起来，拍了拍裤子上的灰，从包里拿出那本速写本。"}], "第三章 雨停之前": [{"id": "c3s1", "route": "wan", "beat": "台风过境那两天，风把雨吹成横的。街上的树被剪掉了半边，断枝堆在路边，像谁随手扔下的骨头。"}, {"id": "c3s90", "route": "wan", "beat": "雨在半夜停过一阵，天亮又落下来。水顺着门檐往下滴，砸在石阶上，声音是闷的。"}, {"id": "c3s2", "route": "wan", "beat": "她靠在门口的纸箱上，把雨衣的帽子放下来。头发有点乱，被雨气压得贴着头皮。"}, {"id": "c3s3", "route": "wan", "beat": "最后一箱书搬上了租来的小货车。司机在车上抽烟，把烟灰弹在雨里。"}, {"id": "c3s4", "route": "wan", "beat": "她没有立刻回答。风把雨丝吹成斜的，落在她的帽檐上，一滴，两滴。"}, {"id": "c3s5", "route": "wan", "beat": "两天后，十点零七分。站台上风很大，把人的衣服吹得贴在身上。LED 屏上的车次一格一格翻，每翻一次就响一声。"}, {"id": "c3s6", "route": "wan", "beat": "她把雨衣的帽子放下来，头发立刻被打湿，一绺一绺贴在脸侧。"}, {"id": "c3s7", "route": "wan", "beat": "那天晚上雨停了一会儿。云裂开一道口子，路灯的光斜斜地照下来，像有人把世界擦了一下。"}, {"id": "c3s1", "route": "yao", "beat": "台风过后第三天，天放晴了一会儿。琴房的地板被泡翘了边，她拿着一把螺丝刀，蹲在地上撬。"}, {"id": "c3s2", "route": "yao", "beat": "木板被撬起来，底下全是积水，一股旧纸和潮气的味道涌上来。"}, {"id": "c3s3", "route": "yao", "beat": "她坐在琴凳上，弹了一小段，又停。那首卡农，她弹到第二声部就断了。"}, {"id": "c3s4", "route": "yao", "beat": "她停下手，转过来，很认真地看着你。三年来第一次，她没有先笑。"}, {"id": "c3s905", "route": "yao", "beat": "车停在教学楼下面，后厢门开着，纸箱摞到车窗那么高。雨不大，落在箱盖上，洇出一片深色。"}, {"id": "c3s5", "route": "yao", "beat": "她拿过一个旧录音笔，放在琴盖上，按下去。"}], "第一章 旧调重弹": [{"id": "c1s1", "route": "yao", "beat": "你还没进门就先听见了琴声——一段弹到一半停下的旋律，停了很久，没有接下去。"}, {"id": "c1s2", "route": "yao", "beat": "曲子断在一个休止符上。她转过来，头发比三年前短，笑起来还是先动眼睛。"}, {"id": "c1s3", "route": "yao", "beat": "她把手从琴键上收回去，掌心在裙子上擦了一下。"}, {"id": "c1s4", "route": "yao", "beat": "谱架是松的，你扶起来，它又歪。她伸手来按，两个人的手背撞在一起。"}, {"id": "c1s5", "route": "yao", "beat": "楼下有人喊「沈老师」，是来上课的学生，在门口抖伞。"}, {"id": "c1s6", "route": "yao", "beat": "晚上八点，雨小了些。琴要挪到窗边，给漏雨的天花板腾出地方。"}], "第二章 卡农": [{"id": "c2s1", "route": "yao", "beat": "台风「白鹭」要来那几天，琴房的天花板开始漏雨，一滴滴落在琴盖上，滴出一小片水声。"}, {"id": "c2s2", "route": "yao", "beat": "雨声太大，两个人都不说话。她把一块旧毛毯搭在琴上，拍了拍，像拍一只动物。"}, {"id": "c2s3", "route": "yao", "beat": "她按着你的手，一节一节地带。指尖是凉的，掌心很热。"}, {"id": "c2s4", "route": "yao", "beat": "手机在琴凳上震，她看了一眼，按掉，又震，又按掉。"}, {"id": "c2s5", "route": "yao", "beat": "雨小了一点。她坐回琴凳，手指搭在琴盖上，没弹。"}, {"id": "c2s906", "route": "yao", "beat": "下午最后一节课下了，琴房的门没关，里头还有人在弹，一句一句地停。"}, {"id": "c2s6", "route": "yao", "beat": "台风登陆那晚，琴房的玻璃一直在响。你们在窗上一条一条贴胶带，贴成一张网。"}], "第二章 裂缝": [{"id": "c2s7", "route": "yao", "beat": "市里合唱比赛那天，第三排中间那个男生在第二段抢了半拍，整个声部跟着塌了一片。"}], "第三章 裂缝": [{"id": "c3s6", "route": "yao", "beat": "琴房的钥匙交还那天，管理员在登记本上划掉了她的名字。"}], "第一章 零点之后": [{"id": "c1s1", "route": "wen", "beat": "凌晨一点，你先把收音机打开，再关上门。那个声音已经在里面了——她说「欢迎收听」，像在跟房间里的人打招呼。"}, {"id": "c1s2", "route": "wen", "beat": "她把收音机的音量调小了一格，动作很熟练，像每天都在做。"}, {"id": "c1s3", "route": "wen", "beat": "她终于抬头，看了你两秒。那两秒里，收音机正好播到一句「晚安」。"}, {"id": "c1s4", "route": "wen", "beat": "之后你几乎每天都来。她夜班，你就买一盒关东煮，坐到窗边那张高脚凳上。"}, {"id": "c1s5", "route": "wen", "beat": "那只耳机里正放着同一档节目，延迟半秒。她的声音在耳朵里，也在耳朵外。"}, {"id": "c1s6", "route": "wen", "beat": "五点，天要亮了。她要交班，把收音机关掉，动作比开的时候慢。"}], "第二章 声音的形状": [{"id": "c2s1", "route": "wen", "beat": "那周的节目里，她说了一句话，说到一半笑场。"}, {"id": "c2s2", "route": "wen", "beat": "她关掉收音机，收银台一下就安静了。安静得能听见冰柜的嗡嗡声。"}, {"id": "c2s3", "route": "wen", "beat": "那天她提前下班，说想去看一眼电台。老楼十二层，电梯常年坏。"}, {"id": "c2s4", "route": "wen", "beat": "她在录音室里坐下，把耳机挂在脖子上，习惯性地开口："}, {"id": "c2s5", "route": "wen", "beat": "她戴上耳机，手指在调音台上滑了一下，推子慢慢推上去。"}, {"id": "c2s906", "route": "wen", "beat": "上午十点，便利店的灯调得很亮。柜台后面换了人，她站在货架边上，穿一件洗得发白的衬衫，手里拎着一瓶水。"}, {"id": "c2s6", "route": "wen", "beat": "那一期节目她做了四十分钟。你在走廊上靠着墙，听见门缝里漏出来的声音，忽远忽近。"}], "第二章 一夜之间": [{"id": "c2s7", "route": "wen", "beat": "凌晨三点，便利店的自动门开了两次，没有人进来——风把门口的塑料帘吹得直响。"}], "第三章 闭麦之前": [{"id": "c3s1", "route": "wen", "beat": "她走之前的最后一周，便利店照常营业，收音机里换成了别的节目。"}, {"id": "c3s2", "route": "wen", "beat": "最后一班，她破例把收音机打开了，调到一个没有信号的空白频道。"}, {"id": "c3s3", "route": "wen", "beat": "五点，天要亮了。她把工牌摘下来，放在收银台上，像放下一件很重的东西。"}, {"id": "c3s4", "route": "wen", "beat": "门口的天已经蓝了，路灯一盏一盏灭下去。她站在光里，你站在阴影里。"}, {"id": "c3s905", "route": "wen", "beat": "四点四十，最后一班的点快到了。她蹲在货架前把糖盒一盒一盒摆直，盒沿对着盒沿，留出一指宽的缝。"}, {"id": "c3s5", "route": "wen", "beat": "她低头看了很久地面，然后抬起头，眼睛亮得不像熬了夜。"}], "第三章 最后一期": [{"id": "c3s6", "route": "wen", "beat": "录最后一期那天，台里已经搬空了一半。隔壁办公室的桌子都掀了，地上剩一圈圈电线。"}], "第一章 抄书": [{"id": "c1s1", "route": "xiao", "beat": "调令是三天前送来的：着国史馆抄书吏一人，赴长公主府听候。调令上没写为什么，只盖了一个印。"}, {"id": "c1s2", "route": "xiao", "beat": "屋里只有三个人：她、一个老嬷嬷、一个捧着朱笔的小宫女。"}, {"id": "c1s3", "route": "xiao", "beat": "帘子动了一下。她伸手把帘子掀开半尺，露出半张脸，眼睛很静，像在看一件器物值不值钱。"}, {"id": "c1s4", "route": "xiao", "beat": "她笑了一声，很短，像咳嗽。"}, {"id": "c1s5", "route": "xiao", "beat": "三天的第二天夜里，你在偏房抄到三更。灯芯爆了一下，你才发现门外站着人。"}, {"id": "c1s6", "route": "xiao", "beat": "她在外间的椅子上坐下，离你有三步，隔着半张案。"}], "第二章 把柄": [{"id": "c2s1", "route": "xiao", "beat": "第三天，书校完了。你把改好的那一页铺在案上，字是你的，意思不是。"}, {"id": "c2s2", "route": "xiao", "beat": "她没有生气，只是把纸又推回来，指尖在那行字上敲了一下。"}, {"id": "c2s3", "route": "xiao", "beat": "她沉默了一会儿。窗外有人打更，三更三点。"}, {"id": "c2s4", "route": "xiao", "beat": "她没有回答，只把那份弹劾往前推了半寸。"}, {"id": "c2s5", "route": "xiao", "beat": "天没亮，东华门的采买车排了一长队。你把纸压在萝卜下面，手心全是汗。"}, {"id": "c2s906", "route": "xiao", "beat": "御史台来人的时候，雨还没停。两个人站在偏房门口，靴底带进来一脚泥。"}, {"id": "c2s6", "route": "xiao", "beat": "她走近两步，在你面前停下。这是你第一次在白天、在宫墙外、离她这么近。"}], "第三章 宫门": [{"id": "c3s1", "route": "xiao", "beat": "那一夜宫门闭得很早。街上巡防比平日多了一倍，家家户户关窗。"}, {"id": "c3s2", "route": "xiao", "beat": "她第一次看着你的眼睛说完整句话。"}, {"id": "c3s3", "route": "xiao", "beat": "她听完，没有立刻说话。灯芯烧短了，光很小。"}, {"id": "c3s4", "route": "xiao", "beat": "四更天，宫里传来第一声更鼓。她站起来，走到窗边，把窗推开一条缝。"}, {"id": "c3s905", "route": "xiao", "beat": "天没亮，宫门还闭着。她在廊下等你，手里握着一枚铜符，符上的字被手汗磨得发亮。"}, {"id": "c3s5", "route": "xiao", "beat": "她背对着你站了很久，肩膀有一次很轻的起伏。"}], "第三章 案结之前": [{"id": "c3s7", "route": "xiao", "beat": "消息压在偏殿的案上，一整天没动。她坐在灯下，没有翻开任何一本折子。"}, {"id": "c3s6", "route": "xiao", "beat": "折子是次日早朝递的。你站在殿外第三排，按规矩该跪，你站着。"}, {"id": "c3s1", "route": "lu", "beat": "上奏前夜，她把官服叠得整整齐齐，摆在案上，像摆一件借来的东西。"}, {"id": "c3s90", "route": "lu", "beat": "殿门关了三个时辰。檐下的更漏滴得很慢，里面一直没有声音传出来。"}, {"id": "c3s2", "route": "lu", "beat": "她看着你，看了很久。"}, {"id": "c3s3", "route": "lu", "beat": "天亮之前，宫里来了人，比她的折子早了两个时辰。"}, {"id": "c3s4", "route": "lu", "beat": "案子结了，十年前的漕运账被翻出来，牵出三个人。陆知白在朝上把话说完，没有一个人敢接。"}, {"id": "c3s5", "route": "lu", "beat": "雨停了。宫里的人来请她，说陛下要见。"}], "第一章 同僚": [{"id": "c1s1", "route": "lu", "beat": "你在刑部二门口被拦下，值守的老吏把你的官牌翻过来看了三遍，才让开半步。"}, {"id": "c1s2", "route": "lu", "beat": "她指给你看：同一份供词，三处「画押」的字迹深浅不同，日期却是一天。"}, {"id": "c1s3", "route": "lu", "beat": "案卷查到一起，天就黑了。她起身时扶了一下案角，袖子滑上去半寸。"}, {"id": "c1s4", "route": "lu", "beat": "她没有立刻答，手在案下攥了一下，攥得指节发白。"}, {"id": "c1s5", "route": "lu", "beat": "那晚她没走。两个人对着一盏灯坐到三更，她把话说得很慢。"}, {"id": "c1s6", "route": "lu", "beat": "第二天，漕运案的卷宗被调走了，说是上头要看。调走的人连回执都没留。"}], "第二章 替她瞒": [{"id": "c2s1", "route": "lu", "beat": "为了查那桩旧案，你们换了便装去城南的茶楼。她穿男装比穿官服更自然，走路带风。"}, {"id": "c2s90", "route": "lu", "beat": "吏部来了文书，要刑部各员报一份年貌册：籍贯、年岁、面貌，另附一只手印。"}, {"id": "c2s2", "route": "lu", "beat": "茶楼里坐着几个刑部的老吏。有人认出她，端了酒过来。"}, {"id": "c2s3", "route": "lu", "beat": "出了茶楼，她走了一段才开口，声音有点闷。"}, {"id": "c2s7", "route": "lu", "beat": "夜里刑部的门要落三道锁。她值夜那次，第三道锁卡住了，钥匙插进去转不动。"}, {"id": "c2s4", "route": "lu", "beat": "查到第七天，那个替死人签字的老吏死在了牢里，说是自尽。"}, {"id": "c2s5", "route": "lu", "beat": "三天后，有人递了折子，参刑部主事陆知白「行止不端，恐非男子」。"}, {"id": "c2s6", "route": "lu", "beat": "她一个人去的，回来时天快亮了。官服上沾了酒气，人倒是没事。"}], "第三章 同僚": [{"id": "c3s6", "route": "lu", "beat": "停尸房在西角，只有一盏油灯。仵作把验状摊在石台上，指尖点着最后一行。"}], "第一章 替嫁": [{"id": "c1s1", "route": "shen", "beat": "喜棚搭好那天下了雨，红绸被打湿，颜色深了一块。府里说，沈家的小姐明日进门。"}, {"id": "c1s2", "route": "shen", "beat": "册子上的字很干净，一笔一划，不像仓促写的。她把每一项都记了：米、布、银，连两匹绢的颜色都注了。"}, {"id": "c1s3", "route": "shen", "beat": "喜宴散得早。二公子身子弱，拜完堂就被扶回房里，咳嗽声隔着两道墙都听得见。"}, {"id": "c1s4", "route": "shen", "beat": "她愣了一下，手抬起来，又放下。"}, {"id": "c1s5", "route": "shen", "beat": "三更，府里忽然乱起来。二公子咳血，请了大夫，大夫摇头。"}], "第二章 守寡": [{"id": "c2s1", "route": "shen", "beat": "二公子死在第七天。府里换了白，红绸被扯下来，堆在院角，像一堆没人要的东西。"}, {"id": "c2s9936", "route": "shen", "beat": "祠堂散了之后，府里换了白。她把袖子里的册子摊在桌上，摊得很平，用手指把折痕压实。"}, {"id": "c2s2", "route": "shen", "beat": "你翻出账房底册，一笔一笔对。三十六抬嫁妆，二十六抬入户，十抬记在「待补」，却有三笔银子早在半年前就出了府。"}, {"id": "c2s3", "route": "shen", "beat": "二管事姓周，管着府里三十年的账。他见了你，笑得很和气。"}, {"id": "c2s4", "route": "shen", "beat": "那晚她来账房，看见你桌上的底册，什么也没问。"}, {"id": "c2s5", "route": "shen", "beat": "族长在祠堂议事，说新妇守寡三年，若不安分，就送回沈家。周管事站在旁边，一句没辩。"}, {"id": "c2s6", "route": "shen", "beat": "祠堂里静了一瞬。族长的目光从底册移到你脸上，又移到门口。"}, {"id": "c2s8", "route": "shen", "beat": "底册在库房最里头的柜子里。第二天她去取，被两个管事拦在门口——一个说钥匙在周管事手上，一个说府里查不到这张凭据。"}, {"id": "c2s7", "route": "shen", "beat": "三天后她一个人去了库房，回来的时候袖口撕了一道口子，头发也有点乱。"}], "第三章 出府": [{"id": "c3s1", "route": "shen", "beat": "族长没有当场发作。三日后，周管事被查，府里封了两间库房。"}, {"id": "c3s9128", "route": "shen", "beat": "门板是新上的，漆味还没散。她一个人把三匹布摞上柜台，摞完退后两步，看了一看高度。"}, {"id": "c3s2", "route": "shen", "beat": "她从床底下拖出一个小箱子。里面有布样、账目、还有一张画得很粗的铺面图。"}, {"id": "c3s3", "route": "shen", "beat": "出府那天要签字画押：退了婚书，嫁妆归沈家，从此与裴府无涉。"}, {"id": "c3s8", "route": "shen", "beat": "退婚书要去沈家拿。她一个人回去的，没让你跟，说这是她家的事。"}, {"id": "c3s4", "route": "shen", "beat": "铺子开在城南，门面不大，招牌是新的，字是她自己写的。"}, {"id": "c3s5", "route": "shen", "beat": "入夜，铺子关门。她把灯芯挑亮，坐下来，第一次没有急着说什么。"}, {"id": "c3s6", "route": "shen", "beat": "开张第十天，来了两个人，说是裴府旧人，来收「例钱」——铺子在城南，归这条街的规矩管。"}, {"id": "c3s7", "route": "shen", "beat": "那两个人走了。她关上门，把门闩插上，回头时眼圈是红的，但没哭。"}], "第一章 倒计时 180 天": [{"id": "c1s1", "route": "jian", "beat": "八月底，明德中学高三（七）班。你被班主任叫到办公室，桌上放了一张座位表，最后一排靠窗的位置用红笔圈了出来，旁边写了个名字：程简简。"}, {"id": "c1s2", "route": "jian", "beat": "第一周同桌。她上课不听讲，低着头在本子上写东西，你以为她在画画，扫了一眼——是错题本，抄得很工整，但一道力学公式抄反了两个符号。"}, {"id": "c1s3", "route": "jian", "beat": "体育课自由活动。你跑完三千米，弯着腰喘气，抬头看见她一个人坐在跑道边的台阶上，膝盖上摊着一本单词本，嘴在动，没出声。"}, {"id": "c1s4", "route": "jian", "beat": "午休。全班趴在桌上睡觉。你没睡着，在改上午数学卷子的错。她也醒着，在改同一张卷子，笔尖很轻，怕吵到别人。"}, {"id": "c1s5", "route": "jian", "beat": "月考成绩贴出来了。你年级第一。她年级四百八十名（设定值，非真实数据），倒数第三排的位置，红纸黑字。"}], "第二章 倒计时 90 天": [{"id": "c2s1", "route": "jian", "beat": "月考后按成绩调座位。她被调到中间第四排，你留在最后一排。她收拾东西时错题本从抽屉滑出来，你弯腰捡起，她手抖了一下，接过去没说话。"}, {"id": "c2s9471", "route": "jian", "beat": "教室后门的锁坏了两天，没人报修。她从后门进来，绕过讲台，把卷子反扣在最后一排的空桌上。"}, {"id": "c2s2", "route": "jian", "beat": "她在新座位跟后排的几个人混熟了。上课传纸条，下课嘻嘻哈哈。你从最后一排看过去，她在笑，笑得很用力。"}, {"id": "c2s7", "route": "jian", "beat": "期中家长会那天下午，她妈在教室门口拉住班主任，声音不大，走廊里的人都听得见。"}, {"id": "c2s3", "route": "jian", "beat": "晚自习突然停电。走廊应急灯亮着，你去接水，走到拐角听见她在走廊尽头打电话，声音很轻，但走廊太安静了。"}, {"id": "c2s4", "route": "jian", "beat": "第二天，她像没事人一样。上课照常贫嘴，跟后排的人借修正带，笑得很大声。你把昨天整理的一套卷子递过去，她没接。"}, {"id": "c2s5", "route": "jian", "beat": "班会课。班主任站在讲台上说：「这次月考有几个同学进步很大，程简简进步了一百多名，主要是同桌帮扶效果好——」"}, {"id": "c2s6", "route": "jian", "beat": "班会后你去了天台。她靠在栏杆上，背对着楼梯口，风吹得她头发乱七八糟。你在门口站了一会儿，她没回头，但开口了。"}], "第三章 倒计时 30 天": [{"id": "c3s1", "route": "jian", "beat": "志愿表草表发下来了。三栏，第一栏最重要。你在第一栏填了一直想考的学校。她坐在新座位上，低头填表，笔停了很久。"}, {"id": "c3s9619", "route": "jian", "beat": "倒计时牌换成三十天。晚自习后教室空了一半，她留在最后一排，桌上摊着草表。"}, {"id": "c3s2", "route": "jian", "beat": "你收到保送确认通知了。信封是导师签的字，最后一栏是你一直想自己考的学校。导师说：「签了就不用高考了，名额给你留着，想清楚。」"}, {"id": "c3s3", "route": "jian", "beat": "她从班主任办公室门口路过，听见了你的名字和「保送」两个字。下午自习，你看见她在志愿表上把第一栏擦掉了，重写。新写的学校在另一个省。"}, {"id": "c3s4", "route": "jian", "beat": "高考前三天的晚自习。她翻开错题本的最后一页，写了一行字，又划掉了。你以为她没发现你在看，但她头也没抬就开口了。"}, {"id": "c3s5", "route": "jian", "beat": "高考前一天，全班拍毕业照。她站在最后一排最角落，你站在前排中间。摄影师喊一二三，她在最后一排做了个鬼脸——吐舌头那种，很幼稚。"}, {"id": "c3s7", "route": "jian", "beat": "志愿表交上去那天，她在办公室门口站了很久，出来的时候表已经交了。"}, {"id": "c3s6", "route": "jian", "beat": "考完最后一科。出考场下大雨，没带伞。她站在校门口的梧桐树下，头发湿了一半，贴在脸上。你也没带伞，两人淋着雨沿校门口那条路走。"}], "第一章 归来": [{"id": "c1s1", "route": "qing", "beat": "六年没回这座城。出租车从机场开到老城区，你路过那栋玻璃楼——青梧建筑事务所的招牌挂在十七层，灯亮着。"}, {"id": "c1s2", "route": "qing", "beat": "她转过身来。六年了，她瘦了，颧骨更高了，头发剪到肩膀，不像当年那种长得能扎马尾的样子。她看了你一眼，目光很短，然后看回图纸。"}, {"id": "c1s3", "route": "qing", "beat": "她把红笔搁下了。笔滚了两圈，碰到图纸上的一块橡皮，停了。"}, {"id": "c1s4", "route": "qing", "beat": "她从柜子里翻出一卷图纸，扔在桌上。不是新方案——是你六年前做的那个立面重构，A2图幅，四张，折痕都磨白了，边角起了毛。"}, {"id": "c1s5", "route": "qing", "beat": "她站在门口，手没离开门把。雨声大了，走廊的灯是感应的，亮了一下又灭了。"}, {"id": "c1s6", "route": "qing", "beat": "那天晚上你做了个梦。不是噩梦，是六年前那间会议室。"}], "第二章 对账": [{"id": "c2s1", "route": "qing", "beat": "第二天。事务所十七层，她的办公室门开着。桌上多了一样东西——一个旧模型，巴掌大，是当年你们一起做的社区图书馆草模，你切的纸板，她上的色。"}, {"id": "c2s90", "route": "qing", "beat": "下午三点，她把改过的立面摊在长桌上，用红笔在两处各画了一个圈。笔压得很重，纸背透出红。"}, {"id": "c2s2", "route": "qing", "beat": "你把新图纸展开，跟旧方案并排放。退线多两米，立面确实要重来。但旧方案的结构逻辑还能用——你当年花了三个月推导的那套模数关系，不是白做的。"}, {"id": "c2s7", "route": "qing", "beat": "档案室最里面那一格，标签上的日期是六年前。你抽出来的时候，纸边已经发黄。"}, {"id": "c2s3", "route": "qing", "beat": "她手顿了一下，从口袋里摸出一盒烟，看了看，又塞回去了。没点。"}, {"id": "c2s4", "route": "qing", "beat": "下午，你在她办公室改立面。她出去了，门没锁。你翻她桌上的项目档案，翻到一份会议纪要——日期是六年前，就是那场会。"}, {"id": "c2s5", "route": "qing", "beat": "她回来了，看见桌上的纪要没动过（或者你以为她没看出来）。她坐下来，翻了翻你改的立面初稿，拿红笔圈了两处。"}, {"id": "c2s6", "route": "qing", "beat": "她笔尖停了。红笔戳在图纸上，墨水洇了一个点。她没抬头，但你看见她喉结动了一下。"}], "第三章 问句": [{"id": "c3s1", "route": "qing", "beat": "第三天。你把初稿改完了，两处模数节点保留，但调了比例，绕过了规划局的退线问题。她翻了一遍，没圈红。"}, {"id": "c3s90", "route": "qing", "beat": "雨停了半小时，又落下来。她把那只缺角的模型从柜子最上层搬下来，放在窗前，缺角朝里。"}, {"id": "c3s2", "route": "qing", "beat": "施工节点图铺在桌上。你逐张看过去——结构合理，材料选得准，但有三处节点的逻辑跟她六年前的风格不一样，倒像你当年的思路。"}, {"id": "c3s3", "route": "qing", "beat": "她没接话。把文件合上，站起来，走到窗边。烟盒在窗台上，她拿了一支，没点，夹在指间转。"}, {"id": "c3s4", "route": "qing", "beat": "她回过身来，第一次在这一整天正面看你。烟还夹在手里，没点，滤嘴被她捏扁了。"}, {"id": "c3s5", "route": "qing", "beat": "她把那支捏扁的烟扔进了垃圾桶。纸篓里已经有七八个烟头了，都是今天攒的。"}, {"id": "c3s6", "route": "qing", "beat": "她终于看你了。不是扫一眼，是看。站在窗和桌之间，背后是灰色的雨后天空，光打在她半边脸上。"}, {"id": "c3s7", "route": "qing", "beat": "她在门口站住，转过身来。雨已经停了，路面反着灯，像刚擦过。"}]};
const MOCK={"wan": {"hit": ["「……你干嘛。」她往后让了半步，没恼，只是把手里的书抱得更紧。", "把书脊对齐，摆回架上。"], "ask": ["「今天不忙。雨停之前都没什么人来。」", "她把杯子往你那边推了推。"], "care": ["「……我没事。」停了一下又说，「柚子茶凉了就不好喝了。」", "低头擦柜台，擦的是同一块地方。"], "quiet": ["「你不说话，我就当你听懂了。」", "把铅笔在指间转了一圈。"], "other": ["「嗯。」她应一声，等着你往下说。", "目光落在你手上，像在看什么画。"]}, "jian": {"hit": ["「你踹我？」她愣了一秒，笑出声，「行啊你。」", "把椅子往后一蹬，坐直了。"], "ask": ["「关你什么事。」嘴上这么说，本子还是往你这边偏了半寸。", "笔尖点着那道错题。"], "care": ["「我好不好我自己不知道？」她顿了一下，声音低下去，「……谢谢。」", "把袖子往下拉了拉。"], "quiet": ["「哑了？」她敲了敲你的桌角。", "歪头看你。"], "other": ["「说啊。」她催你，笔在指尖转。", "把椅子往你这边拖了一点。"]}};
const CN={'一':1,'二':2,'三':3};
function order(n){for(const k in CN){if(n.includes('第'+k+'章'))return CN[k];}return 9;}
let route=new URLSearchParams(location.search).get('r')||'wan';
let KEY=localStorage.getItem('jieyu.key')||'';
let S=JSON.parse(localStorage.getItem('ai.'+route)||'null')||{aff:0,trust:0,turns:[],facts:[],summary:'',chapter:CHARS[route].start_chapter||'',log:[],threads:[],stage:'陌生',hits:{},outline:[]};
const $=id=>document.getElementById(id), log=$('log');
function bubble(c,h){const d=document.createElement('div');d.className='b '+c;d.innerHTML=h;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
function setBar(v){$('affBar').style.width=Math.max(0,Math.min(100,(v+20)/60*100))+'%';}
function save(){localStorage.setItem('ai.'+route,JSON.stringify(S));}
function beatsFor(ch){return (SCENES[ch]||[]).filter(b=>b.route===route);}
function advance(){
  let chs=Object.keys(SCENES).filter(c=>beatsFor(c).length).sort((a,b)=>order(a)-order(b));
  if(!S.chapter||!beatsFor(S.chapter)){S.chapter=CHARS[route].start_chapter||chs[0]||'';if(!beatsFor(S.chapter))S.chapter=chs[0]||S.chapter;}
  let idx=Math.floor(S.turns.length/6), bs=beatsFor(S.chapter);
  if(idx>=bs.length){const i=chs.indexOf(S.chapter);if(i>=0&&i+1<chs.length){S.chapter=chs[i+1];bs=beatsFor(S.chapter);idx=0;}else idx=Math.max(0,bs.length-1);}
  S.beat=bs[idx]?bs[idx].beat:'';
}
function render(){const c=CHARS[route];$('nm').textContent=c.name;$('ava').textContent=c.name.slice(-1);
  $('pl').textContent=S.chapter+' · '+(c.meta||'');setBar(S.aff);
  $('aibtn').textContent = KEY? 'AI 已接':'AI'; $('aibtn').className='mini'+(KEY?' on':'');}
function endingHint(){const a=S.aff,t=S.trust,closed=(S.threads||[]).length===0;
  return (a>=30&&t>=20&&closed)?'A 走成了':(a>=20&&t>=10)?'B 差一步':(a>=10)?'C 停在原地':'D 散了';}
function memHTML(){return '<div><b>好感</b> '+S.aff+' · <b>信任</b> '+S.trust+' · <b>阶段</b> '+S.stage+' · <b>章节</b> '+(S.chapter||'—')+' · <b>倾向</b> '+endingHint()+'</div>'
  +'<div style="margin-top:8px"><b>未解的线索</b><br>'+(((S.threads||[]).map(x=>'· '+x).join('<br>'))||'（暂无）')+'</div>'
  +'<div style="margin-top:8px"><b>本局大纲</b><br>'+(((S.outline||[]).map((o,i)=>(o.done?'√ ':'· ')+(i+1)+'. '+o.t).join('<br>'))||'（还没定）')+'</div>'
  +'<div style="margin-top:8px"><b>剧情年表</b><br>'+(((S.log||[]).slice(-6).map(x=>'· '+x).join('<br>'))||'（还没有）')+'</div>'
  +'<div style="margin-top:8px"><b>她记住的事</b><br>'+(S.facts.slice(-8).map(x=>'· '+x).join('<br>')||'（还没有）')+'</div>'
  +'<div style="margin-top:8px"><b>更早的事</b><br>'+((S.summary||'').trim()||'（还没有）')+'</div>';}

function remember(t){const ps=[/(?:我|俺)(?:很|特别|最)?(?:喜欢|爱)([^，。！？]{1,10})/,/(?:我|俺)(?:很|特别|最)?怕([^，。！？]{1,10})/,/(?:我|俺)(?:叫|是)([^，。！？]{1,8})/];
  for(const p of ps){const m=t.match(p);if(m&&m[1]){S.facts.push(t.slice(0,26));S.facts=S.facts.slice(-12);return;}}}

const SEEDS=['雨','台风','月考','家长会','停电','夜自习','剪头发','体检','生日','搬家','感冒','旧同学'];
function makeOutline(){
  const out=[{t:SEEDS[Math.floor(Math.random()*SEEDS.length)]+'（本局的引子）',done:false}];
  const bs=Object.keys(SCENES).filter(c=>beatsFor(c).length).sort((a,b)=>order(a)-order(b));
  const pool=[]; bs.forEach(c=>beatsFor(c).forEach(b=>{ if(!(S.used_ids||[]).includes(b.id)) pool.push(b); }));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  pool.slice(0,4).forEach(b=>out.push({t:b.beat.slice(0,42),id:b.id,done:false}));
  return out;
}
function outlineText(){
  const ol=S.outline||[]; if(!ol.length) return '（还没定大纲）';
  return ol.map((o,i)=>(o.done?'√ ': '· ')+(i+1)+'. '+o.t).join('\n');
}
function tickOutline(idx){
  const ol=S.outline||[]; if(idx>=1&&idx<=ol.length) ol[idx-1].done=true;
}
function countHits(txt){
  S.hits=S.hits||{}; const w=['座位表','小字','红圈','外套','错题本','笔袋','琴房','图纸'];
  w.forEach(k=>{ if(txt.includes(k)) S.hits[k]=(S.hits[k]||0)+1; });
  (S.threads||[]).forEach(th=>{ const key=th.slice(0,8); if(key&&txt.includes(key)) S.hits[key]=(S.hits[key]||0)+1; });
}
function bannedList(){ return Object.keys(S.hits||{}).filter(k=>(S.hits[k]||0)>=2).slice(-6); }
function intent(t){return /踢|踹|打|推|撞/.test(t)?'hit':/[?？]|吗|什么|为什么|怎么/.test(t)?'ask':/累|还好|别|休息|冷|饿|疼/.test(t)?'care':t.length<=4?'quiet':'other';}
function mockReply(t){const k=intent(t),tb=MOCK[route]||MOCK.wan,p=tb[k]||['「嗯。」','点了点头。'];
  return {say:p[0],act:p[1],aff:{hit:1,care:2,ask:1,quiet:0,other:1}[k],trust:k==='care'?1:0,memory:'',
    choices:{hit:['道歉','继续说狠话','转身走'],ask:['再问一句','换个话题','不说了'],care:['把外套给她','装作没听见','开个玩笑'],quiet:['先开口','继续沉默','起身离开'],other:['顺着聊','问回去','换个话题']}[k]};}

function sysPrompt(){
  const c=CHARS[route];
  const L=[];
  L.push('你在一部中文互动小说里扮演'+c.name+'（'+(c.meta||'')+'）。');
  L.push(c.desc||''); L.push('口吻：'+(c.voice||''));
  L.push('');
  L.push('规矩：');
  L.push('1 只输出两点：你说的话（用「」包住），和你做的一个动作（一句，不要清单）');
  L.push('2 不解释动机、不总结主题、不描写读者内心、不替读者做决定');
  L.push('2b 「动作」用第三人称写她做了什么（例：「把椅子往后一蹬」），不要写「我」');
  L.push('3 每次 30–110 字，最多两段');
  L.push('4 你只知道你知道的事，不知道就说不懂或不耐烦地岔开，绝不编造设定');
  L.push('5 剧情由你推进：玩家的行为要真的改变事情走向，不能聊完又回到原样');
  L.push('5b 不要重复最近两轮写过的物件、动作、话题；同一线索最多连写两轮，第三轮必须换新的');
  L.push('5c aff 按行为给分：被关心/被理解 +1~+2；被挑衅且她反击 +0~+1；被羞辱/被戳痛处 -1~-2；闲聊 0');
  L.push('');
  L.push('【当下处境】'+S.chapter+'。'+(S.beat||''));
  L.push('【关系】好感 '+S.aff+'／信任 '+S.trust+'／阶段 '+S.stage);
  L.push('【你记得的事】'+((S.facts.slice(-12).map(x=>'· '+x).join('\n'))||'（还没有）')+((S.summary)?('\n· （更早的事）'+S.summary):''));
  L.push('【刚才聊到】'+((S.turns.slice(-8).join('\n'))||'（刚见面）'));
  L.push('【剧情年表】（已经发生过的事，不要重复）');
  L.push(((S.log||[]).slice(-6).map(x=>'· '+x).join('\n'))||'（还没有）');
  L.push('【未解的线索】'+(((S.threads||[]).map(x=>'· '+x).join('\n'))||'（暂无）'));
  L.push('【本局大纲】（打勾的已发生；你要把它们演出来，也可以加戏）');
  L.push(outlineText());
  L.push('【本轮禁止再写的细节】（已写够两次，必须换新的物件/话题）'+((bannedList().join('、'))||'（无）'));
  L.push('【这一轮可以往哪推】'+candsText());
  L.push('');
  L.push('只输出 JSON：{"say":"…","act":"第三人称动作","advance":"这一轮剧情推进的一句话(15-40字)","open_thread":"新埋的线索或不填","close_thread":"解开的线索或不填","outline_hit":0到5的整数(这轮演了大纲第几条,没演写0),"aff":-2到2,"trust":-2到2,"memory":"要长期记住的一句话或不填","choices":["…","…","…"]}');
  return L.join('\n');
}
function candsText(){
  const p=(S.turns||[]).join(' ');
  const hard=(p.match(/滚|闭嘴|少管|打|踢|踹|烦/g)||[]).length;
  const soft=(p.match(/谢谢|还好吗|累|别勉强|陪你|冷/g)||[]).length;
  const out=[];
  out.push('1. [main] 顺着原剧本往下推一步');
  if(hard>soft){ out.push('2. [conflict] 他被你顶得下不来台，把话挑明'); out.push('3. [detour] 她冷下来，把话题岔开'); }
  else if(soft>hard){ out.push('2. [intimacy] 她第一次主动提起自己的事'); out.push('3. [detour] 她用一件小事遮住刚才的松动'); }
  else { out.push('2. [intimacy] 她试探着问一句关于你的事'); out.push('3. [conflict] 她被你戳到痛处，回一句难听的'); }
  return out.join('\n');
}

async function aiReply(text){
  const body={model:'deepseek-chat',temperature:0.9,max_tokens:400,messages:[
    {role:'system',content:sysPrompt()},{role:'user',content:'读者说／做：'+text}]};
  const r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('接口 '+r.status+'（key 是否有效？）');
  const d=await r.json();
  let s=d.choices[0].message.content.trim();
  if(s.startsWith('```'))s=s.split('```')[1].replace(/^json/,'').trim();
  const i=s.indexOf('{'),j=s.lastIndexOf('}'); if(i>=0&&j>i)s=s.slice(i,j+1);
  let o={}; try{o=JSON.parse(s);}catch(e){o={say:s.slice(0,200),act:''};}
  return {say:o.say||'……',act:o.act||'',aff:Number(o.aff||0),trust:Number(o.trust||0),memory:o.memory||'',
    advance:o.advance||'',open_thread:o.open_thread||'',close_thread:o.close_thread||'',outline_hit:Number(o.outline_hit||0),
    choices:Array.isArray(o.choices)?o.choices.slice(0,3):[]};
}

let busy=false;
async function send(text){
  if(busy||!text.trim())return;
  busy=true;$('send').disabled=true;
  bubble('me',text.replace(/[<>]/g,''));
  const holder=bubble('her',KEY?'…':'');
  $('choices').innerHTML='';$('inp').value='';
  let d;
  try{ d = KEY? await aiReply(text) : mockReply(text); }
  catch(e){ holder.innerHTML='<span style="color:#e39aa2">（'+e.message+'）已退回模板</span>'; d=mockReply(text); }
  holder.innerHTML='「'+d.say+'」'+(d.act?'<div class="act">'+d.act+'</div>':'');
  S.aff=Math.max(-20,Math.min(40,S.aff+d.aff)); S.trust=Math.max(-20,Math.min(40,S.trust+d.trust));
  S.turns.push(text); S.turns.push(CHARS[route].name+'：「'+d.say+'」'+d.act);
  if(d.memory)S.facts.push(d.memory);
  countHits((d.advance||'')+' '+(d.say||'')+' '+(d.act||''));
  if(d.outline_hit) tickOutline(d.outline_hit);
  if(d.advance){ S.log=(S.log||[]).concat([d.advance]).slice(-12);
    const adv=document.createElement('div'); adv.className='adv'; adv.textContent='剧情：'+d.advance; log.appendChild(adv); log.scrollTop=log.scrollHeight; }
  if(d.open_thread){ S.threads=S.threads||[]; if(!S.threads.some(x=>x.slice(0,6)===d.open_thread.slice(0,6))) S.threads.push(d.open_thread); S.threads=S.threads.slice(-4); }
  if(d.close_thread){ S.threads=(S.threads||[]).filter(x=>!x.includes(d.close_thread)); }
  remember(text);
  if(S.turns.length>40){const old=S.turns.slice(0,-24).filter(x=>x.startsWith(CHARS[route].name)).slice(0,4);
    S.summary=((S.summary||'')+' '+old.map(x=>x.slice(0,40)).join('；')).trim().slice(-400);S.turns=S.turns.slice(-24);}
  const t=(S.turns||[]).length/2;
  S.stage = (S.aff>=25||t>=20)?'不可替代':(S.aff>=15||t>=14)?'交心':(S.aff>=5||t>=8)?'熟人':'陌生';
  advance();save();render();
  d.choices.forEach(c=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>send(c);$('choices').appendChild(b);});
  busy=false;
  if(shouldEnd()){ await askEnding(); return; }
  $('send').disabled=false;$('inp').focus();
}
function tier(){ if(S.aff>=25&&S.trust>=10) return 'A（走成了）'; if(S.aff>=15) return 'B（差一步）'; if(S.aff>=5) return 'C（停在原地）'; return 'D（散了）'; }
function shouldEnd(){ return (S.turns||[]).length>=24 || S.aff>=25 || S.aff<=-6; }
async function askEnding(){
  if(S.ended) return;
  S.ended=true;
  const c=CHARS[route];
  const L=['你在写一部中文互动小说的结局。角色：'+c.name+'（'+(c.meta||'')+'）。'+(c.desc||''),
    '已知：好感 '+S.aff+'，信任 '+S.trust+'，阶段 '+S.stage+'，未解线索：'+(((S.threads||[]).join('；'))||'无'),
    '剧情年表：'+(((S.log||[]).slice(-6).join('；'))||'无'),
    '请写这个结局：'+tier()+'。要求：120-180 字，纯叙述（不要对白占一半以上），必须回应至少一条线索，最后落在一个具体物件上，不解释道理。',
    '只输出 JSON：{"ending":"…","title":"4-8字的结局名"}'];
  let title='结局', body='（结局生成失败）';
  try{
    const r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},
      body:JSON.stringify({model:'deepseek-chat',temperature:0.95,max_tokens:500,
        messages:[{role:'system',content:L.join('\n')},{role:'user',content:'写结局'}]})});
    const d=await r.json(); let s=d.choices[0].message.content.trim();
    if(s.startsWith('```'))s=s.split('```')[1].replace(/^json/,'').trim();
    const i=s.indexOf('{'),j=s.lastIndexOf('}'); if(i>=0&&j>i)s=s.slice(i,j+1);
    const o=JSON.parse(s); title=o.title||'结局'; body=o.ending||body;
  }catch(e){ body='（结局没能生成：'+e.message+'）'; }
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+title+' · '+tier()+'</div><div class="eb">'+body+'</div>';
  log.appendChild(card); log.scrollTop=log.scrollHeight;
  $('send').disabled=true; $('inp').disabled=true;
  $('inp').placeholder='这一局结束了，点「重开」再来一次';
  save();
}
$('send').onclick=()=>send($('inp').value);
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(e.target.value);}});
$('mbtn').onclick=()=>{const m=$('mem');if(m.style.display==='block'){m.style.display='none';}else{m.innerHTML=memHTML();m.style.display='block';}};
$('rst').onclick=()=>{if(confirm('清掉和这位的进度？')){localStorage.removeItem('ai.'+route);location.reload();}};
$('exp').onclick=()=>{const all={};Object.keys(CHARS).forEach(id=>{const v=localStorage.getItem('ai.'+id);if(v)all[id]=JSON.parse(v);});
  const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify({v:1,saves:all}));
  a.download='借你一场雨-存档.json';a.click();};
$('aibtn').onclick=()=>{const k=prompt('粘贴 DeepSeek API key（只存在这台设备的浏览器里）：',KEY?'':'' );
  if(k!==null){KEY=k.trim(); if(KEY){localStorage.setItem('jieyu.key',KEY);}else{localStorage.removeItem('jieyu.key');} render();
    $('hint').innerHTML=KEY?'已接入真模型：她会读你这句话。':'已改回模板演示。';}};
$('pick').onclick=()=>{const ids=Object.keys(CHARS);const n=prompt('换谁？输入序号：\n'+ids.map((id,i)=>(i+1)+'. '+CHARS[id].name).join('\n'));
  const id=ids[(parseInt(n,10)||0)-1];if(id)location.search='?r='+id;};
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
if(!S.outline||!S.outline.length){ S.outline=makeOutline(); save(); }
advance();render();
const OPEN={wan:'「雨还没停。」她把梯子挪了挪，让你好走过去。',yao:'「来得正好。」她头也没回，手指在琴键上走了一遍。',
 wen:'「……喂？」她压着声音，像怕吵到谁。',xiao:'「站着。说事。」她手里的朱笔没停。',lu:'「门带上。」她把手里的卷宗翻过一页。',
 shen:'「坐。账还没算完。」她拨了一下算盘。',jian:'「看什么看。这位置有人了。」她头都没抬。',qing:'「你迟到了三分钟。」她把图纸摊开。'};
bubble('her',OPEN[route]+(S.beat?'<div class="act">'+S.beat+'</div>':''));
</script></body></html>
