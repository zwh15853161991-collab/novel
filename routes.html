<script>
const R=[{"id": "wan", "name": "林未晞", "meta": "23 · 旧书店店员 · 画画的", "desc": "慢热、克制。她把没画完的东西都藏起来。", "arch": "过度能扛的照顾者", "voice": "慢、低、克制，话少但每句都有信息", "chapters": 2, "scenes": 20, "endings": [], "vigs": [], "premise": "雨季第一天，你走进这间书店避雨。她正踩着梯子把最后一摞书摆平。", "prose": false, "level": "入门", "why": "最完整的一条线，26 场，节奏稳，适合先玩", "minutes": 36}, {"id": "yao", "name": "沈之遥", "meta": "26 · 中学音乐老师 · 弹琴的", "desc": "外放、爱笑，用玩笑挡问题。三年前不告而别。", "arch": "落魄归来的女主", "voice": "亮、快一点，爱笑，用玩笑挡问题", "chapters": 4, "scenes": 15, "endings": [], "vigs": [], "premise": "三年前她不告而别。今夜你推开门，听见楼上有人在弹卡农——只弹声部，不弹旋律。", "prose": false, "level": "入门", "why": "破镜重圆的经典结构，情绪起伏清楚", "minutes": 27}, {"id": "wen", "name": "闻笛", "meta": "27 · 深夜电台主持 · 便利店夜班", "desc": "声音比人先认识你。白天她不太会说话。", "arch": "被留下的孩子", "voice": "电台压低，气声多，说话像在对麦克风", "chapters": 5, "scenes": 21, "endings": [], "vigs": [], "premise": "你值夜班的第一天，收银台旁的收音机没关。她说：「欢迎收听，这里是城市零点。」", "prose": false, "level": "进阶", "why": "深夜电台，气氛重、台词少，喜欢慢节奏再进", "minutes": 38}, {"id": "xiao", "name": "萧明烛", "meta": "26 · 摄政长公主 · 掌兵符", "desc": "她只问你能做什么，不问你想什么。", "arch": "掌局的长公主", "voice": "最慢、最平，命令句多，少用问号", "chapters": 4, "scenes": 21, "endings": [], "vigs": [], "premise": "你抱着《河渠志》的残本进府时，雨正顺着瓦当往下淌。她要的不是书，是书里的人。", "prose": false, "level": "偏难", "why": "权谋线，权力关系复杂，草率选择会掉好感", "minutes": 38}, {"id": "lu", "name": "陆知白", "meta": "22 · 刑部主事 · 寒门进士", "desc": "她把自己活成了另一个人，只为把父亲没读完的书读完。", "arch": "女扮男装的寒门进士", "voice": "稳、短、公文腔，偶尔冒出一句很软的", "chapters": 4, "scenes": 21, "endings": [], "vigs": [], "premise": "你被派来与她同案。她把门带上，说：「门关上，接下来的话不能出这间屋子。」", "prose": false, "level": "进阶", "why": "女扮男装 + 查案，线索多，跳读容易断", "minutes": 38}, {"id": "shen", "name": "沈知微", "meta": "18 · 替嫁庶女 · 开布铺", "desc": "她替姐姐嫁进裴家，进门前就记了半年的账。", "arch": "替嫁庶女", "voice": "算账式，先说数字再说感受", "chapters": 3, "scenes": 23, "endings": [], "vigs": [], "premise": "你被指给裴家抄账。推开偏院的门，她正拨着算盘，头也没抬：「坐。账还没算完。」", "prose": false, "level": "进阶", "why": "古言 + 算账，信息密度高，需要读细", "minutes": 41}, {"id": "jian", "name": "程简简", "meta": "17 · 高三（七）班 · 垫底但嘴硬", "desc": "自尊心比成绩单硬。越紧张越贫嘴，从不说我不行。", "arch": "垫底但嘴硬的女生", "voice": "快、贫嘴，嘴硬，越紧张话越多", "chapters": 3, "scenes": 21, "endings": [], "vigs": [], "premise": "班主任把你叫到办公室，指着座位表最后一排那个红圈：「转学生，家里托人来的，你坐她旁边，帮一把。」", "prose": false, "level": "入门", "why": "对话最生活化，贫嘴密度高，不费脑", "minutes": 38}, {"id": "qing", "name": "顾青梧", "meta": "29 · 建筑事务所合伙人", "desc": "六年前拿走了你的方案。她只会发号施令，正在学怎么问。", "arch": "高位冷面男主", "voice": "干脆，习惯下指令，正在学怎么问", "chapters": 3, "scenes": 22, "endings": [], "vigs": [], "premise": "项目重启，甲方把她的事务所拉了进来。会议室里，她把图纸摊开：「你迟到了三分钟。」", "prose": false, "level": "进阶", "why": "职场线，说话方式会影响结局，要留意用词", "minutes": 40}, {"id": "loop", "name": "沈砚", "meta": "25 · 急诊科医生，记性太好，从不写备忘", "desc": "记性极好，从不写备忘；把每一次重来都当成一次修改机会，改到自己都认不出。", "arch": "读档者", "voice": "短句、爱用条件句「如果这轮……」；越急越冷静", "chapters": 3, "scenes": 16, "endings": [["A", "雨停了"], ["B", "三点十八分"], ["C", "灯还亮着"], ["D", "没打伞那天"]], "vigs": ["换班表", "保温杯", "第三病床"], "premise": "暴雨夜三点十七分，一个没有名字的男人死在她手上；她睁眼，又回到同一场雨。", "prose": true, "level": "入门", "why": "循环设定，16 场，一次读完不累", "minutes": 29}, {"id": "scar", "name": "郑迟", "meta": "31 · 汽修厂老板，兼跑夜路货运", "desc": "只谈事不谈感受；习惯说「我没事」；把关心翻译成干活。", "arch": "带伤的自持者", "voice": "短句，一句话不超过七个字；越在乎越谈天气和路况", "chapters": 3, "scenes": 16, "endings": [["A", "多一把钥匙"], ["B", "周四回来一次"], ["C", "伞留在店里"], ["D", "两块牌子"]], "vigs": ["工具箱", "体检单", "七个字"], "premise": "台风夜末班车停运，你拦下一辆货车。司机只说路况和雨量，一句话不超过七个字。", "prose": true, "level": "入门", "why": "话少的人，靠动作推进，适合安静读", "minutes": 29}, {"id": "revenge", "name": "许照", "meta": "27 · 旧书店店主", "desc": "冷静、记仇、会演；客气得过分，句句是反话。她要的不是道歉，是一个自己的活法。", "arch": "被辜负的归来者", "voice": "客气、慢、每句留后手；越生气越礼貌", "chapters": 3, "scenes": 17, "endings": [["A", "写回本名"], ["B", "锁进抽屉"], ["C", "北上的车"], ["D", "半面空招牌"]], "vigs": ["假姓", "剪报", "半面招牌"], "premise": "她在南巷盘下这间漏雨的旧书店，用的是假姓。你推门避雨，没认出她。", "prose": true, "level": "偏难", "why": "记仇线，客气话里全是刀，需要读潜台词", "minutes": 31}, {"id": "ledger", "name": "苏晚", "meta": "26 · 建筑公司法务专员", "desc": "记性极好、不擅诉苦，把喜欢做成待办清单；三年四十七笔，全带日期。", "arch": "隐忍记账型女主", "voice": "短句、少形容词、只讲事实和结论，情绪藏在停顿里", "chapters" 成安排。", "arch": "克制强势型男主", "voice": "陈述句、少反问；习惯给解决方案，而不是安慰", "chapters": 3, "scenes": 17, "endings": [["A", "第二个问题"], ["B", "一个句号"], ["C", "划线很直"], ["D", "笔帽不见了"]], "vigs": ["白板", "外卖", "周报"], "premise": "你被临时调进她的项目组，第一天她在白板上写了一行字：这周只解决一个问题。", "prose": true, "level": "偏难", "why": "负责人线，边界感很强，越界就掉好感", "minutes": 31}, {"id": "tyrant", "name": "霍衍", "meta": "36 · 家族企业总经理", "desc": "傲慢、算计、迟钝；把关系当成本核算。命令句慢慢变成问句，是他唯一的变化。", "arch": "施害后知后觉者", "voice": "命令句为主；问句出现时说明他在意了；从不解释，解释就是让步", "chapters": 3, "scenes": 17, "endings": [["A", "位置你挑"], ["B", "不用你决定"], ["C", "空着的桌子"], ["D", "不用叫霍总"]], "vigs": ["百叶帘", "钢笔", "老照片"], "premise": "三年前他一句话把她赶出公司；今天董事会请的顾问推门进来，是她。", "prose": true, "level": "偏难", "why": "傲慢线，命令句变问句就是他在意的信号", "minutes": 31}, {"id": "steady", "name": "温叙", "meta": "29 · 旧照相馆老板", "desc": "稳定、不争，把喜欢存成长期存款；从不越界，也不让人为难。", "arch": "温吞守护型男二", "voice": "温和、绕弯，常以「你需要的话」开头；从不说重话", "chapters": 3, "scenes": 17, "endings": [["A", "留个念想"], ["B", "纸上的号码"], ["C", "一页没翻"], ["D", "落在指腹上的灰"]], "vigs": ["红灯", "钥匙", "多洗一张"], "premise": "你回小城取一张十几年前的旧照片，照相馆换了老板，他说：你需要的话，我帮你找。", "prose": true, "level": "入门", "why": "守护型，慢慢来的那种好，适合睡前读", "minutes": 31}, {"id": "double", "name": "江栖", "meta": "26 · 旧货铺店员", "desc": "疑心重、善演、记得别人的语气；演久了分不清哪个是自己，但从不承认。", "arch": "替身者", "voice": "忽真忽假；会模仿对方的措辞和停顿，像是把别人的话借来穿", "chapters": 3, "scenes": 17, "endings": [["A", "念得很慢"], ["B", "就这个"], ["C", "没拆的信"], ["D", "另一把钥匙"]], "vigs": ["旧表", "语气", "信"], "premise": "你认识的「她」三个月前失踪了；今天她推门进来，用同一个名字，语气却是另一个人的。", "prose": true, "level": "偏难", "why": "替身线，她演谁像谁，读的是同一张脸下的两套语气", "minutes": 31}, {"id": "secret", "name": "雨里的旧人", "meta": "？ ·「浮光」最早的店主", "desc": "二十年前离开这座城，现在回来处理卖店的事。", "arch": "知情不说的第三人", "voice": "克制，先看人再说话", "chapters": 0, "scenes": 10, "endings": [], "vigs": [], "premise": "雨天，你推开一间要卖的旧书店的门。", "prose": false, "level": "隐藏", "why": "通关后解锁，短篇，收尾性质", "minutes": 18}];
