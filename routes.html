<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>借你一场雨 · 故事总览</title>
<style>
:root{--bg:#12100e;--bg2:#181614;--ink:#ece6de;--dim:#a49b90;--faint:#6f6862;--line:rgba(255,255,255,.09);
--accent:#c9a06a;--acc-ink:#1a140e;--card:rgba(255,255,255,.05)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Songti SC","Noto Serif SC",serif}
header{max-width:900px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 20px 6px}
h1{margin:0;font-size:25px;font-weight:500;letter-spacing:.04em}
.sub{color:var(--faint);font-size:12.5px;letter-spacing:.12em;margin-top:6px}
nav{max-width:900px;margin:14px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}
nav a{color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px}
main{max-width:900px;margin:0 auto;padding:14px 20px 60px;display:grid;gap:12px}
@media(min-width:720px){main{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.top{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,var(--accent),rgba(201,160,106,.5));color:var(--acc-ink);font-size:16px;flex:0 0 auto}
.nm{font-size:15.5px}.mt{color:var(--faint);font-size:12.5px}
.ds{color:var(--dim);font-size:13px;margin:8px 0 6px}
.arch{color:var(--accent);font-size:12px}
.stat{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.tag{font-size:11.5px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.end{font-size:12.5px;color:var(--dim);margin-top:6px}
.end b{color:#c8a37a;font-weight:400}
a.play{display:inline-block;margin-top:10px;background:var(--accent);color:var(--acc-ink);
 border-radius:10px;padding:8px 14px;font-size:13.5px;text-decoration:none}
a.play.ghost{background:none;border:1px solid var(--line);color:var(--dim);margin-left:6px}
footer{max-width:900px;margin:0 auto;padding:0 20px 50px;color:var(--faint);font-size:12px;text-align:center}
</style></head><body>
<header><h1>故事总览</h1><div class="sub">11 条线 · 点进去直接开始</div>
<nav><a href="./app-v2.html">AI 版</a><a href="./index.html">离线完整版</a><a href="./library.html">小说资料库</a><a href="./staging.html">测试通道</a></nav></header>
<main id="m"></main>
<footer>新线由「资料库原型 → 大纲 → 结局与番外」流程产出；点「AI 版」进入后可从首页继续。</footer>
<script>
const R=[{"id": "wan", "name": "林未晞", "meta": "23 · 旧书店店员 · 画画的", "desc": "慢热、克制。她把没画完的东西都藏起来。", "arch": "过度能扛的照顾者", "voice": "慢、低、克制，话少但每句都有信息", "chapters": 2, "scenes": 20, "endings": [], "vigs": [], "premise": "雨季第一天，你走进这间书店避雨。她正踩着梯子把最后一摞书摆平。", "prose": false}, {"id": "yao", "name": "沈之遥", "meta": "26 · 中学音乐老师 · 弹琴的", "desc": "外放、爱笑，用玩笑挡问题。三年前不告而别。", "arch": "落魄归来的女主", "voice": "亮、快一点，爱笑，用玩笑挡问题", "chapters": 4, "scenes": 15, "endings": [], "vigs": [], "premise": "三年前她不告而别。今夜你推开门，听见楼上有人在弹卡农——只弹声部，不弹旋律。", "prose": false}, {"id": "wen", "name": "闻笛", "meta": "27 · 深夜电台主持 · 便利店夜班", "desc": "声音比人先认识你。白天她不太会说话。", "arch": "被留下的孩子", "voice": "电台压低，气声多，说话像在对麦克风", "chapters": 5, "scenes": 21, "endings": [], "vigs": [], "premise": "你值夜班的第一天，收银台旁的收音机没关。她说：「欢迎收听，这里是城市零点。」", "prose": false}, {"id": "xiao", "name": "萧明烛", "meta": "26 · 摄政长公主 · 掌兵符", "desc": "她只问你能做什么，不问你想什么。", "arch": "掌局的长公主", "voice": "最慢、最平，命令句多，少用问号", "chapters": 4, "scenes": 21, "endings": [], "vigs": [], "premise": "你抱着《河渠志》的残本进府时，雨正顺着瓦当往下淌。她要的不是书，是书里的人。", "prose": false}, {"id": "lu", "name": "陆知白", "meta": "22 · 刑部主事 · 寒门进士", "desc": "她把自己活成了另一个人，只为把父亲没读完的书读完。", "arch": "女扮男装的寒门进士", "voice": "稳、短、公文腔，偶尔冒出一句很软的", "chapters": 4, "scenes": 21, "endings": [], "vigs": [], "premise": "你被派来与她同案。她把门带上，说：「门关上，接下来的话不能出这间屋子。」", "prose": false}, {"id": "shen", "name": "沈知微", "meta": "18 · 替嫁庶女 · 开布铺", "desc": "她替姐姐嫁进裴家，进门前就记了半年的账。", "arch": "替嫁庶女", "voice": "算账式，先说数字再说感受", "chapters": 3, "scenes": 23, "endings": [], "vigs": [], "premise": "你被指给裴家抄账。推开偏院的门，她正拨着算盘，头也没抬：「坐。账还没算完。」", "prose": false}, {"id": "jian", "name": "程简简", "meta": "17 · 高三（七）班 · 垫底但嘴硬", "desc": "自尊心比成绩单硬。越紧张越贫嘴，从不说我不行。", "arch": "垫底但嘴硬的女生", "voice": "快、贫嘴，嘴硬，越紧张话越多", "chapters": 3, "scenes": 21, "endings": [], "vigs": [], "premise": "班主任把你叫到办公室，指着座位表最后一排那个红圈：「转学生，家里托人来的，你坐她旁边，帮一把。」", "prose": false}, {"id": "qing", "name": "顾青梧", "meta": "29 · 建筑事务所合伙人", "desc": "六年前拿走了你的方案。她只会发号施令，正在学怎么问。", "arch": "高位冷面男主", "voice": "干脆，习惯下指令，正在学怎么问", "chapters": 3, "scenes": 22, "endings": [], "vigs": [], "premise": "项目重启，甲方把她的事务所拉了进来。会议室里，她把图纸摊开：「你迟到了三分钟。」", "prose": false}, {"id": "loop", "name": "沈砚", "meta": "25 · 急诊科医生，记性太好，从不写备忘", "desc": "记性极好，从不写备忘；把每一次重来都当成一次修改机会，改到自己都认不出。", "arch": "读档者", "voice": "短句、爱用条件句「如果这轮……」；越急越冷静", "chapters": 3, "scenes": 16, "endings": [["A", "雨停了"], ["B", "三点十八分"], ["C", "灯还亮着"], ["D", "没打伞那天"]], "vigs": ["换班表", "保温杯", "第三病床"], "premise": "暴雨夜三点十七分，一个没有名字的男人死在她手上；她睁眼，又回到同一场雨。", "prose": true}, {"id": "scar", "name": "郑迟", "meta": "31 · 汽修厂老板，兼跑夜路货运", "desc": "只谈事不谈感受；习惯说「我没事」；把关心翻译成干活。", "arch": "带伤的自持者", "voice": "短句，一句话不超过七个字；越在乎越谈天气和路况", "chapters": 3, "scenes": 16, "endings": [["A", "多一把钥匙"], ["B", "周四回来一次"], ["C", "伞留在店里"], ["D", "两块牌子"]], "vigs": ["工具箱", "体检单", "七个字"], "premise": "台风夜末班车停运，你拦下一辆货车。司机只说路况和雨量，一句话不超过七个字。", "prose": true}, {"id": "revenge", "name": "许照", "meta": "27 · 旧书店店主", "desc": "冷静、记仇、会演；客气得过分，句句是反话。她要的不是道歉，是一个自己的活法。", "arch": "被辜负的归来者", "voice": "客气、慢、每句留后手；越生气越礼貌", "chapters": 3, "scenes": 17, "endings": [["A", "写回本名"], ["B", "锁进抽屉"], ["C", "北上的车"], ["D", "半面空招牌"]], "vigs": ["假姓", "剪报", "半面招牌"], "premise": "她在南巷盘下这间漏雨的旧书店，用的是假姓。你推门避雨，没认出她。", "prose": true}, {"id": "secret", "name": "雨里的旧人", "meta": "？ ·「浮光」最早的店主", "desc": "二十年前离开这座城，现在回来处理卖店的事。", "arch": "知情不说的第三人", "voice": "克制，先看人再说话", "chapters": 0, "scenes": 10, "endings": [], "vigs": [], "premise": "雨天，你推开一间要卖的旧书店的门。", "prose": false}];
const esc=s=>String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
document.getElementById('m').innerHTML=R.map(r=>`
 <div class="card">
  <div class="top"><div class="av">${esc(r.name.slice(-1))}</div>
   <div><div class="nm">${esc(r.name)}</div><div class="mt">${esc(r.meta)}</div></div></div>
  <div class="ds">${esc(r.premise||r.desc)}</div>
  <div class="arch">原型：${esc(r.arch||'—')}　台词：${esc(r.voice||'')}</div>
  <div class="stat"><span class="tag">${r.chapters} 章</span><span class="tag">${r.scenes} 场</span>
    <span class="tag">${r.endings.length} 结局</span><span class="tag">${r.vigs.length} 段番外</span></div>
  ${r.endings.length?`<div class="end">${r.endings.map(([k,t])=>`<b>${k}</b> ${esc(t)}`).join('　')}</div>`:''}
  ${r.vigs.length?`<div class="end">番外：${r.vigs.map(esc).join(' · ')}</div>`:''}
  <a class="play" href="./app-v2.html?r=${esc(r.id)}">开始这条线</a>
  <a class="play ghost" href="./staging.html?r=${esc(r.id)}">测试通道</a>
  ${r.prose?`<a class="play ghost" href="./reader-${esc(r.id)}.html">逐字版</a>`:''}
 </div>`).join('');
</script></body></html>
