, {"id": "lu", "name": "陆知白", "meta": "22 · 刑部主事 · 寒门进士", "desc": "她把自己活成了另一个人，只为把父亲没读完的书读完。", "arch": "女扮男装的寒门进士", "voice": "稳、短、公文腔，偶尔冒出一句很软的", "chapters": 4, "scenes": 21, "endings": [["A", "并肩"], ["B", "辞官"], ["C", "同僚"], ["D", "败露"]], "vigs": ["那人答得出", "卷宗合上", "左手执笔", "渡口收卷人", "验过了", "袖口那道痕", "换装那刻", "灯", "算稿", "官帽"], "premise": "卷宗摞满值夜房。陆知白把同一份供词摊在灯下，指出三处画押的字迹深浅不一，日期却相同。你刚坐下，案子就从例行翻卷变成了一个问题：有没有人在替死人签字？", "prose": false, "level": "进阶", "why": "女扮男装 + 查案，线索多，跳读容易断", "minutes": 38}, {"id": "shen", "name": "沈知微", "meta": "18 · 替嫁庶女 · 开布铺", "desc": "她替姐姐嫁进裴家，进门前就记了半年的账。", "arch": "替嫁庶女", "voice": "算账式，先说数字再说感受", "chapters": 3, "scenes": 23, "endings": [["A", "一起算"], ["B", "各自记账"], ["C", "还了婚书"], ["D", "没签的那一笔"]], "vigs": ["那笔记着呢", "算盘停了", "算盘放左", "半匹素绢", "不抹零", "不是我的", "盘今天的账", "记在册上", "盘货", "最后一页"], "premise": "喜棚上的红绸被雨打湿，花轿刚进门。单子写着三十六抬嫁妆，实际只到了二十六抬，余下十抬标成「沈府补送」。沈知微找到偏院，把自己记的薄册推到你面前：少的那十抬，不会再送来了。", "prose": false, "level": "进阶", "why": "古言 + 算账，信息密度高，需要读细", "minutes": 41}, {"id": "jian", "name": "程简简", "meta": "17 · 高三（七）班 · 垫底但嘴硬", "desc": "自尊心比成绩单硬。越紧张越贫嘴，从不说我不行。", "arch": "垫底但嘴硬的女生", "voice": "快、贫嘴，嘴硬，越紧张话越多", "chapters": 3, "scenes": 21, "endings": [["A", "同桌的你"], ["B", "各自远扬"], ["C", "同一排"], ["D", "没对上号"]], "vigs": ["旁边那个座", "笔袋拉上", "蓝笔不黑笔", "小卖部那条", "借什么橡皮", "填了才算", "一个人刷题", "错题本还我", "值日表", "薄荷糖", "最后一页"], "premise": "八月底，教室后墙挂起高考倒计时。座位表最后一排的名字被红笔圈住。你搬过去时，程简简还低着头，先把那句「这位置有人了」顶了回来；桌上的本子合得很快。", "prose": false, "level": "入门", "why": "对话最生活化，贫嘴密度高，不费脑", "minutes": 38}, {"id": "qing", "name": "顾青梧", "meta": "29 · 建筑事务所合伙人", "desc": "六年前拿走了你的方案。她只会发号施令，正在学怎么问。", "arch": "高位冷面男主", "voice": "干脆，习惯下指令，正在学怎么问", "chapters": 3, "scenes": 22, "endings": [["A", "学会问的人"], ["B", "各归各位"], ["C", "重蹈一次"], ["D", "擦肩"]], "vigs": ["那人懂结构", "图纸扣下", "窗不开半扇", "工地那把伞", "重画三次", "给谁的位", "模型没装好", "加建的阳台", "红笔", "模型"], "premise": "出租车经过挂着「青梧建筑事务所」招牌的玻璃楼。十七层会议室里，顾青梧背对门站着，桌上摊着总平面图与一份已经签了她名字的顾问协议。她如今又需要你当年那套立面重构的思路。", "prose": false, "level": "进阶", "why": "职场线，说话方式会影响结局，要留意用词", "minutes": 40}, {"id": "loop", "name": "沈砚", "meta": "25 · 急诊科医生，记性太好，从不写备忘", "desc": "记性极好，从不写备忘；把每一次重来都当成一次修改机会，改到自己都认不出。", "arch": "读档者", "voice": "短句、爱用条件句「如果这轮……」；越急越冷静", "chapters": 3, "scenes": 16, "endings": [["A", "雨停了"], ["B", "三点十八分"], ["C", "灯还亮着"], ["D", "没打伞那天"]], "vigs": ["旧挂表", "换班表", "保温杯", "急诊窗台", "第三病床"], "premise": "急诊走廊的灯闪两下才亮，墙上的钟停在三点十七分。你醒来时衣服还带着雨水，身边的人刚结束一轮抢救。沈砚抬眼看了一下钟，像在确认某个反复出现的时刻。", "prose": true, "level": "入门", "why": "循环设定，16 场，一次读完不累", "minutes": 29}, {"id": "scar", "name": "郑迟", "meta": "31 · 汽修厂老板，兼跑夜路货运", "desc": "只谈事不谈感受；习惯说「我没事」；把关心翻译成干活。", "arch": "带伤的自持者", "voice": "短句，一句话不超过七个字；越在乎越谈天气和路况", "chapters": 3, "scenes": 16, "endings": [["A", "多一把钥匙"], ["B", "周四回来一次"], ["C", "伞留在店里"], ["D", "两块牌子"]], "vigs": ["扳手号码", "工具箱", "体检单", "夜路发票", "七个字"], "premise": "末班车取消，路上的雨越来越密。货车停在你面前，副驾放着一把旧伞。郑迟先问去向，又说起前面哪段路积水，话短得像只肯把车开到该开的地方。", "prose": true, "level": "入门", "why": "话少的人，靠动作推进，适合安静读", "minutes": 29}, {"id": "revenge", "name": "许照", "meta": "27 · 旧书店店主", "desc": "冷静、记仇、会演；客气得过分，句句是反话。她要的不是道歉，是一个自己的活法。", "arch": "被辜负的归来者", "voice": "客气、慢、每句留后手；越生气越礼貌", "chapters": 3, "scenes": 17, "endings": [["A", "写回本名"], ["B", "锁进抽屉"], ["C", "北上的车"], ["D", "半面空招牌"]], "vigs": ["牛皮纸书衣", "假姓", "剪报", "打烊以后", "半面招牌"], "premise": "书店屋顶漏雨，招牌空着半边。新店主报的姓并不是你记忆里的那个。你提到这间店从前的旧事，她只把粗茶推过来，客气得让人接不上下一句。", "prose": true, "level": "偏难", "why": "记仇线，客气话里全是刀，需要读潜台词", "minutes": 31}, {"id": "ledger", "name": "苏晚", "meta": "26 · 建筑公司法务专员", "desc": "记性极好、不擅诉苦，把喜欢做成待办清单；三年四十七笔，全带日期。", "arch": "隐忍记账型女主", "voice": "短句、少形容词、只讲事实和结论，情绪藏在停顿里", "chapters": 3, "scenes": 16, "endings": [["A", "第七十三页"], ["B", "第48条"], ["C", "归档"], ["D", "并成一张"]], "vigs": ["便利贴颜色", "账本", "第37条", "加班电梯", "四十七笔"], "premise": "雨夜加班结束，你的手机快没电，苏晚替你付了车费。你先上车离开，她在另一辆车里翻开一本薄账册，把日期、金额和这趟车费记了进去。下一次见面，你们仍要继续处理公司里的事。", "prose": false, "level": "—", "why": "", "minutes": 29}, {"id": "coroner", "name": "陈默", "meta": "30 · 市局法医", "desc": "抠细节、不浪漫、沉默；只信证据，答非所问是他的保护色。", "arch": "验尸人", "voice": "术语切入、句子短、答非所问；越在意越谈流程", "chapters": 3, "scenes": 17, "endings": [["A", "不是速溶的"], ["B", "下周还来吗"], ["C", "盖章那天"], ["D", "台上那份副本"]], "vigs": ["除湿机水箱", "十七度", "手套", "手套尺码", "第一具"], "premise": "地下二层的法医室恒温十七度。陈默先看死者的指缝，再把一项细小的发现指给你：贝壳粉。外面还在下雨，记录表上的身份一栏仍空着，死亡原因也不能凭雨夜就下结论。", "prose": false, "level": "—", "why": "", "minutes": 31}, {"id": "hollow", "name": "宋屿", "meta": "28 · 广告公司创意", "desc": "会讨好、怕冲突；被戳穿就消失；用玩笑挡问题。好得不像真的，是因为他不敢让人看见不好的那部分。", "arch": "被爱泡大的空心人", "voice": "话多、爱开玩笑，关键时刻突然沉默；句子常以「都行」「没关系」结尾", "chapters": 3, "scenes": 17, "endings": [["A", "关灯以后"], ["B", "两个空格"], ["C", "没人动的那杯"], ["D", "他还是会笑"]], "vigs": ["两杯半糖", "马克杯", "表情包", "清空的备忘", "楼梯间"], "premise": "聚会上，宋屿记得谁不吃辣、谁只喝无糖饮料，自己的那杯却始终没喝完。散场后他提出送你到地铁口。离开热闹的包厢，雨里的这段路，他反而没剩多少话。", "prose": false, "level": "—", "why": "", "minutes": 31}, {"id": "rival", "name": "纪南", "meta": "31 · 同业事务所合伙人", "desc": "聪明、体面、目的明确、不演受害者；每句话都留后手，赢了不炫耀，输了不撒泼。", "arch": "清醒型前任/竞争者", "voice": "慢、准；先给结论再补一句退路，很少用语气词", "chapters": 3, "scenes": 17, "endings": [["A", "一人一半"], ["B", "下次别迟到"], ["C", "被磨掉的号码"], ["D", "散标那天"]], "vigs": ["同一家咖啡", "名片", "前一页", "评标席外", "凉掉的咖啡"], "premise": "重启项目的竞标会结束了，甲方把预算压得很低。纪南从长桌另一端走来，将名片推到你面前。六年未见，她只说了一句：「好久不见。」旧日来往仍在，两个人却已经各有自己的团队与方案。", "prose": false, "level": "—", "why": "", "minutes": 31}, {"id": "badge", "name": "裴则", "meta": "34 · 派出所民警", "desc": "讲规则、扛责任；把价值绑在「有没有用」上；不允许自己出错，出错就自己先罚自己。", "arch": "制度里的好人", "voice": "术语多、陈述句；几乎不说软话，但在念条款时会慢半拍", "chapters": 3, "scenes": 17, "endings": [["A", "这顿他请"], ["B", "念到一半"], ["C", "磨淡的编号"], ["D", "帽檐压得很低"]], "vigs": ["旧胃药盒", "一米二", "胃药", "雨夜巡逻", "检查"], "premise": "办事窗口下推来一张「接报登记」。裴则指了指第一行，让你逐项填写。你心里已有一个怀疑的名字，但他先要姓名、经过和能核实的线索，没有直接替你把结论写进去。", "prose": false, "level": "—", "why": "", "minutes": 31}, {"id": "boss", "name": "谢临", "meta": "33 · 品牌部负责人", "desc": "逻辑先行、边界感强；承诺一旦给出就不撤；把关心翻译成安排。", "arch": "克制强势型男主", "voice": "陈述句、少反问；习惯给解决方案，而不是安慰", "chapters": 3, "scenes": 17, "endings": [["A", "第二个问题"], ["B", "一个句号"], ["C", "划线很直"], ["D", "笔帽不见了"]], "vigs": ["白板右下角", "白板", "外卖", "十七层茶水间", "周报"], "premise": "白板上只写着一行字：「这周只解决一个问题。」谢临把马克笔放回笔槽，暂停了组员想继续加便利贴的动作。你手里的方案即将展开，核心口径需要经得起当面追问。", "prose": false, "level": "—", "why": "", "minutes": 31}, {"id": "tyrant", "name": "霍衍", "meta": "36 · 家族企业总经理", "desc": "傲慢、算计、迟钝；把关系当成本核算。命令句慢慢变成问句，是他唯一的变化。", "arch": "施害后知后觉者", "voice": "命令句为主；问句出现时说明他在意了；从不解释，解释就是让步", "chapters": 3, "scenes": 17, "endings": [["A", "位置你挑"], ["B", "不用你决定"], ["C", "空着的桌子"], ["D", "不用叫霍总"]], "vigs": ["百叶窗角度", "百叶帘", "钢笔", "空出来的副驾", "老照片"], "premise": "会议室里正在汇报季报。你拿着顾问文件推门进来，霍衍手里的钢笔停了一下，随即把原来的分析说完。他合上笔帽，指向长桌另一端，开口仍像在给旧员工下命令。", "prose": false, "level": "—", "why": "", "minutes": 31}, {"id": "steady", "name": "温叙", "meta": "29 · 旧照相馆老板", "desc": "稳定、不争，把喜欢存成长期存款；从不越界，也不让人为难。", "arch": "温吞守护型男二", "voice": "温和、绕弯，常以「你需要的话」开头；从不说重话", "chapters": 3, "scenes": 17, "endings": [["A", "留个念想"], ["B", "纸上的号码"], ["C", "一页没翻"], ["D", "落在指腹上的灰"]], "vigs": ["暗房计时器", "红灯", "钥匙", "胶卷编号", "多洗一张"], "premise": "柜台玻璃下压着泛黄底片，暗房的红灯还亮着。你把要找的照片说给温叙听，他没有先问太多理由，只答应进去找。旧店的东西还在，经营它的人已经不同。", "prose": false, "level": "—", "why": "", "minutes": 31}, {"id": "double", "name": "江栖", "meta": "26 · 旧货铺店员", "desc": "疑心重、善演、记得别人的语气；演久了分不清哪个是自己，但从不承认。", "arch": "替身者", "voice": "忽真忽假；会模仿对方的措辞和停顿，像是把别人的话借来穿", "chapters": 3, "scenes": 17, "endings": [["A", "念得很慢"], ["B", "就这个"], ["C", "没拆的信"], ["D", "另一把钥匙"]], "vigs": ["不合脚的鞋", "旧表", "语气", "旧表的走秒", "信"], "premise": "旧货铺的铜铃响到半途卡住。来客收好湿伞，报出「江栖」这个名字，说要拿走樟木箱。你手里的抹布停在青瓷碗上：这个名字你等了三个月，声音却不对。", "prose": false, "level": "—", "why": "", "minutes": 31}, {"id": "gate", "name": "卫言", "meta": "看上去二十八 · 关隘守门人", "desc": "冷、守约、从不解释规则；把规则当挡箭牌，也当唯一的锚。", "arch": "守规人", "voice": "陈述句、报条文编号、不说废话；解释规则时最慢，护人时先动手再补一句冷淡的理由", "chapters": 3, "scenes": 17, "endings": [["A", "可回头一次"], ["B", "这算犯规吗"], ["C", "比过又收手"], ["D", "第十八个"]], "vigs": ["石板上的苔", "十七条", "关内不下雨", "关内无雨", "刀"], "premise": "关外雨不停，石门内却没有雨。门旁一块石板刻着十七条规矩，卫言站在门内，先念第一条：报上名字。他没有直接解释这些规矩的来历，也没有答应让你先进去。", "prose": false, "level": "—", "why": "", "minutes": 31}, {"id": "doomed", "name": "时雨", "meta": "22 · 书里注定的配角", "desc": "好奇、 let LV='全部', Q='';
const esc=s=>String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
function draw(){
  const q=Q.trim().toLowerCase();
  const list=R.filter(r=>{
    if(LV!=='全部' && (r.level||'')!==LV) return false;
    if(!q) return true;
    return (r.name+' '+r.meta+' '+r.desc+' '+r.arch+' '+r.why).toLowerCase().includes(q);
  });
  document.getElementById('m').innerHTML=list.map(r=>`
   <div class="card">
    <div class="ctop lv-${esc(r.level||'')}">
      <span style="font:600 11px 'PingFang SC',sans-serif;letter-spacing:.1em;color:rgba(255,255,255,.85)">${esc(r.level||'标准')} · ≈${r.minutes||'?'} 分钟</span>
      <span style="font:500 11px 'PingFang SC',sans-serif;color:var(--accent)">${r.scenes} 场 · ${r.endings.length} 结局</span>
    </div>
    <div class="cbody">
      <div class="top"><div class="av">${esc(r.name.slice(-1))}</div>
       <div><div class="nm">${esc(r.name)}</div><div class="mt">${esc(r.meta)}</div></div></div>
      <div class="ds">${esc((r.premise||r.desc||'').slice(0,86))}${(r.premise||r.desc||'').length>86?'…':''}</div>
      <div class="arch">原型：${esc(r.arch||'—')}</div>
      ${r.why?`<div class="ds" style="color:var(--faint);font-size:12px;margin:4px 0">${esc(r.why)}</div>`:''}
      <div class="acts">
        <a class="play" href="./app-v2.html?r=${esc(r.id)}">开始这条线</a>
        <a class="play ghost" href="./reader-${esc(r.id)}.html">逐字版</a>
      </div>
    </div>
   </div>`).join('');
}
document.getElementById('q').oninput=e=>{Q=e.target.value;draw();};
document.querySelectorAll('#chips .chip').forEach(b=>b.onclick=()=>{
  LV=b.dataset.lv;
  document.querySelectorAll('#chips .chip').forEach(x=>x.classList.toggle('on',x.dataset.lv===LV));
  draw();
});
draw();
