enes": [{"lines": [["nar", "台风过后第三天，天放晴了一会儿。琴房的地板被泡翘了边，她拿着一把螺丝刀，蹲在地上撬。"], ["nar", "门边放着搬家公司给的纸箱，箱子上写着「琴」，还没拆开。"], ["say", "「下周三的车。琴先运走。」"], ["nar", "她说这话的时候，把螺丝刀插进木板缝里，用力得手背发白。"]], "choices": ["「所以连琴都要走。」", "蹲下去，接过螺丝刀自己撬", "「我帮你搬。」"], "n": 1}, {"lines": [["nar", "木板被撬起来，底下全是积水，一股旧纸和潮气的味道涌上来。"], ["say", "「其实我不想卖它。」"], ["say", "「这琴是我十二岁那年，我妈卖了两头猪买的。她说学琴的姑娘不会太野。」"], ["nar", "她笑了一下，笑得很轻：「结果我野得连家都不回。」"]], "choices": ["「那就别卖。我这儿有地方放。」", "「你妈现在后悔吗。」", "「你不是野。你只是跑得太快。」"], "n": 2}, {"lines": [["nar", "她坐在琴凳上，弹了一小段，又停。那首卡农，她弹到第二声部就断了。"], ["say", "「如果我又走一次，你会怎么办。」"], ["nar", "她问得很随意，手指还在琴键上按着，没抬起来。"]], "choices": ["「那就再留我一次。我等你回来。」", "「我会把你从站台上拽回来。」", "「走吧。这次我不留你。」"], "n": 3}, {"lines": [["nar", "她停下手，转过来，很认真地看着你。三年来第一次，她没有先笑。"], ["say", "「你这个人，怎么到现在还这样。」"], ["nar", "她伸手，把你的手按在琴键上，按出一个很乱的音。"], ["say", "「那你弹。你弹完这句，我就告诉你我买哪天的票。」"]], "choices": ["「沈之遥，我喜欢你。」", "把那句弹完，什么也不说", "「你想走就走。但走之前，把这首弹完。」"], "n": 4}, {"lines": [["nar", "车停在教学楼下面，后厢门开着，纸箱摞到车窗那么高。雨不大，落在箱盖上，洇出一片深色。"], ["nar", "她把一件叠好的雨衣塞到你手上，袖口印着校名，边角磨白了。"], ["say", "「你穿这个走。我这件不收了。」"], ["nar", "说完她就去抬箱子，一只手扶着车沿，另一只手先垫在箱角底下。"], ["nar", "写着「琴」的那个纸箱放在最上面，绳扣松开一半，垂在车外。"], ["say", "「别帮我。你一帮，我就抬不动了。」"]], "choices": ["把雨衣穿好，站在原地看她抬", "还是走过去，把最上面那个箱子扶住", "把雨衣塞回她手里，「那你抬吧。」"], "n": 5}, {"lines": [["nar", "她拿过一个旧录音笔，放在琴盖上，按下去。"], ["say", "「这个给你。里面是我这三年写的曲子，一共十一首，都没名字。」"], ["say", "「最后一首，我本来想留给一个人。后来发现留给谁都可以。」"], ["nar", "她把录音笔推到你手上，手指在笔身上停了一秒才松开。"]], "choices": ["「第十二首，写给谁？」", "「我替你寄去投稿。」", "收下，什么也没说"], "n": 6}]}, {"title": "第三章 裂缝", "scenes": [{"lines": [["nar", "琴房的钥匙交还那天，管理员在登记本上划掉了她的名字。"], ["nar", "她把柜子里剩下的东西收进纸箱：一本谱子、一节旧琴弦、一个落了灰的节拍器。"], ["say", "「节拍器送你。它走得比我准。」"], ["nar", "说完她笑了一下，那个笑很像她第一天上课时的样子。"]], "choices": ["「准不准，我一直是听你的。」", "把节拍器拧上，让它继续走", "接过纸箱，替她拿一段路"], "n": 1}]}, {"title": "第三章 · 最后", "scenes": [{"lines": [["nar", "琴房的灯灭了。她拎着箱子，站在楼梯口回头。"], ["say", "「……」"]], "choices": ["把话说出口", "拉住她，不让她走", "什么也没做，松开手"], "n": 1}]}], "endings": {"A": {"title": "旧调重弹", "text": "她没走。车票退掉那天，她在琴房里坐了整整一个下午，一句话都没说。\n后来她把那架琴留在了书店二楼，说等学生教完了再搬。\n半年后她真的回去了一趟，又回来，说：「我妈说，学琴的姑娘不用非得嫁得好，别太野就行。我做到了。」\n那年冬天，她把十二首曲子录完了。第十二首有名字，叫《跟着，不超过去》。"}, "B": {"title": "各自远扬", "text": "她还是走了。你在站台上把录音笔还给她，她推回来，说留着。\n半年后，一档音乐节目里放了其中一段，没有署名，主持人说「作者不愿透露」。\n你听出来了，那首是第十二首。\n后来你给她发消息：「听到了。」她隔了很久才回：「你耳朵还行。」\n谱架上那首卡农后来换了人弹，第二声部依旧空着。\n她在另一座城的中学教书，课间仍会去琴房坐一会儿。"}, "C": {"title": "朋友以上", "text": "她走的那天，车开走前，她隔着玻璃对你笑了一下，什么也没说。\n你们一直有联系，聊琴，聊学生，聊她妈的身体，就是不聊那天晚上。\n第二年梅雨季，琴房又漏雨。你上去接水，看见她站在窗边，正在擦琴盖。\n「我回来代课。」她说，「这次教一年。」\n琴房的钥匙还回来了，门牌上她的名字被白漆盖住一半。\n她还在那间琴房上课，仍旧只弹声部。"}, "D": {"title": "雨一直下", "text": "她走的那天，你去了，但站在柱子后面。\n车开走以后，你上楼去看那架琴。琴已经搬走了，地板上留着一块四方的浅色印子。\n录音笔在琴凳上。你没打开。\n那年雨下得比往年久，一直到十一月才停。\n琴房后来改成了储物间，门口那块「禁止入内」的牌子一直没摘。"}}, "vigs": [{"title": "没在琴房", "need": 0, "lines": ["一个同事路过琴房探头问她今天怎么提前收了排练，她把琴盖合上，手上没停。", "「没事。有个人说路过，我等了他一会儿，没来，就收了。」", "她把谱子塞进包拉上拉链，从兜里掏出手机看了一眼又扣回桌上。"]}, {"title": "琴盖合上", "need": 0, "lines": ["排练时一个学生偷拍了她在弹琴的视频发班群，她没看手机，伸手把琴盖合上声音很响。", "「删了。下课。」", "她拿起谱子夹在腋下走出了琴房，门带上没锁。"]}, {"title": "走东边那条", "need": 0, "lines": ["出校门她拐向东边那条梧桐路而不是直走的大路，梧桐路要多绕五分钟但车少，她走得比平时慢。", "「这边耳朵不疼。大路上喇叭太多了。」", "她从包里掏出一颗薄荷糖剥开含着，脚步没停。"]}, {"title": "金东方琴行", "need": 0, "lines": ["她调弦时从琴盖夹层里掉出一张旧琴行收据，抬头写着金东方琴行，日期是四年前。", "「金东方琴行，南山路拐角那家。第一把琴在那买的，一千二，押了三个月伙食费才凑够。」", "她把收据塞回琴盖夹层，按上盖子坐回琴凳弹了一个和弦。"]}, {"title": "别再吹了", "need": 0, "lines": ["一个男生在琴房走廊里跟她说他上周比赛拿了区里第二名，语气很得意，她靠在门框上听完。", "「第二名。挺好。下次别跟人吹，吹多了手会抖。」", "男生走后她回琴房把门关上，从谱架底下抽出一支红笔在今天的排练备注上画了个勾。"]}, {"title": "第四遍才好", "need": 0, "lines": ["她给琴弦调音调到第三遍还差一个半音，你问她这首是不是弹了很多次才熟的，她笑了笑没接。", "「这首啊，前三年弹了上百遍都不对。后来有一天弹到第四遍突然就……算了，不说了。」", "她拨了一下高音弦听余音，把谱子翻到下一页像是要换一首。"]}, {"title": "琴房练和弦", "need": 0, "lines": ["最后一节课的学生走后，她把琴房门反锁，坐在钢琴前反复弹同一段减七和弦分解。", "「这手怎么就不听话呢。」", "她甩了甩左手手腕，从琴凳上站起来，把谱架上摊开的乐谱合上码齐。"]}, {"title": "挡回去了", "need": 0, "lines": ["她把谱子卷成筒，敲了敲你的肩膀，笑得很大声。你问她最近怎么样，她拿谱子指了指教室后排的钢琴。", "「怎么样？我今天弹了三遍《欢乐颂》，第四节课的小孩鼓掌比你还大声——你别老问这个。」", "「你要真想聊点深刻的，帮我搬琴谱架，比问'最近怎么样'有用多了。」"]}, {"title": "第二声部", "need": 0, "lines": ["她把卡农的谱子摊在琴盖上，第二声部那一行用铅笔描了又擦，纸都起了毛。", "「这一行我写过七遍。每一遍都像在等一个人先开口。」", "她把铅笔递给你，笔杆上有一圈牙印。"]}, {"title": "空琴房", "need": 0, "lines": ["下课以后琴房空着。她没有走，坐在琴凳上，把卡农弹了一遍。", "第二声部弹到一半停了，因为她要等一个不存在的人接下一句。", "「……算了。」", "她把手放回琴键，从第一小节重弹。这一次她弹得很慢，像在教一个不在场的初学者。"]}, {"title": "谱子背面", "need": 0, "lines": ["谱子的背面写满了字，都是她的字。", "「第十一首，写给还没走的人。」后面被划掉了，改成了「写给不走的人」。", "「你倒是挑一个啊。」", "她对着自己写的字说了这句，然后把谱子翻过来，扣在琴盖上。"]}], "route": "yao", "arch": ""};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
if(D.world){ $('#world').textContent=D.world; } else { $('#secWorld').style.display='none'; $('#world').style.display='none'; }
if(D.profile && D.profile.length){ $('#profile').innerHTML = D.profile.map(([k,v])=>'<p class="world"><b style="color:#c8a37a;font-weight:400">'+k+'</b>　'+v+'</p>').join(''); }
else { $('#secProfile').style.display='none'; $('#profile').style.display='none'; }
if(D.premise){ $('#premise').textContent=D.premise; } else { $('#secPremise').style.display='none'; $('#premise').style.display='none'; }
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      if(/陪|等|不|别走|谢|留|帮|说|问|看|递|握/.test(t)) warm++;
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=warm/Math.max(1,total);
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; render(); };
</script></body></html>
