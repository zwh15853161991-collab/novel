<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>裴则 · 逐字版</title>
<style>
:root{--bg:#0f0c0b;--ink:#ece6de;--dim:#a49b90;--faint:#6f6862;--line:rgba(255,255,255,.09);
--accent:#c9a06a;--acc-ink:#1a140e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 70% at 50% 0,#1a1512,#0f0c0b 62%);color:var(--ink);
 font:17px/1.9 "Songti SC","Noto Serif SC",serif;min-height:100dvh}
.wrap{max-width:680px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px 60px}
h1{font-size:22px;font-weight:500;margin:0 0 4px;letter-spacing:.04em}
.meta{color:var(--faint);font-size:12.5px;letter-spacing:.12em}
.sec{color:var(--accent);font-size:11.5px;letter-spacing:.18em;margin:20px 0 6px}
p.world{color:var(--dim);font-size:14px;margin:0}
.btn{display:inline-block;margin-top:18px;background:var(--accent);color:var(--acc-ink);border:0;
 border-radius:12px;padding:11px 20px;font-size:15px;font-family:inherit}
#stage{display:none}
.chap{color:var(--faint);font-size:12px;letter-spacing:.16em;text-align:center;margin:26px 0 14px}
.nar{margin:0 0 14px;line-height:2;font-size:16.5px}
.her{background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:2px solid var(--accent);
 border-radius:14px;padding:11px 15px;margin:0 0 14px}
.choices{display:grid;gap:9px;margin:18px 0 0}
.choices button{text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);
 border-radius:12px;padding:12px 14px;font-size:14.5px;font-family:inherit}
.choices button:hover{border-color:rgba(201,160,106,.5)}
.endcard{margin:22px 0;padding:16px 18px;border-radius:16px;border:1px solid rgba(201,160,106,.32);
 background:linear-gradient(180deg,rgba(201,160,106,.1),transparent)}
.eth{color:var(--accent);font-size:12.5px;letter-spacing:.12em;margin-bottom:8px}
.vig{margin-top:20px;border-top:1px dashed var(--line);padding-top:14px}
.vig h3{font-size:14px;font-weight:500;margin:0 0 8px;color:#c8a37a}
.vig p{margin:0 0 8px;color:var(--dim);font-size:14px}
.small{color:var(--faint);font-size:12.5px;margin-top:10px}
</style></head><body><div class="wrap">
<div id="intro">
  <h1 id="nm"></h1><div class="meta" id="mt"></div>
  <div class="sec" id="secWorld">故事背景</div><p class="world" id="world"></p>
  <div class="sec" id="secProfile">人物</div><div id="profile"></div>
  <div class="sec" id="secPremise">前情提要</div><p class="world" id="premise"></p>
  <button class="btn" id="go">开始</button>
  <div class="small">这一版是写死的正文：不联网、不需要模型，每句都对过。</div>
</div>
<div id="stage"><div id="log"></div><div class="choices" id="ch"></div></div>
</div>
<script>
const D={"name": "裴则", "meta": "34 · 派出所民警", "premise": "你到派出所补一张丢失的证明，窗口后面的民警把表格推出来，说先按流程填。", "world": "老城区的派出所，办事窗口一米二高，台面被手肘磨得发亮。走廊墙上贴着办事流程，纸角卷起。", "chapters": [{"title": "第一章 笔录", "scenes": [{"lines": [["nar", "表格从窗口下沿推出来，纸角蹭着台面，停在一支笔跟前。笔是塑料壳的，按一下才出芯，表头印着“接报登记”。"], ["say", "“姓名，住址，身份证号。一行一行填。”"], ["nar", "裴则的手搭在窗台上，食指点了点第一行。他穿藏青制服，领口扣到最上面一颗，袖口磨出一道浅白的折痕。"], ["say", "“填完递回来。”"], ["nar", "他退后半步，拉开椅子坐下，把一本登记簿摊在面前，笔尖悬着，等。窗口的玻璃下沿贴着一道黄线，线以上是表格，线以下是他的手。"]], "choices": ["配合着答", "问他能不能快些", "（把表格填全）"], "n": 1}, {"lines": [["nar", "我说了那个名字。裴则没抬眼，摇了摇头，手里的笔在表格空白处停住。"], ["say", "“这个不归填。”"], ["nar", "他把表格转了个方向，让空白格正对着窗口。玻璃上有一块指印，他抬手用袖口蹭了一下，又放下。"], ["say", "“有证据，写证据。没证据，写情况。”"], ["nar", "他的手指在“情况”两个字上敲了一下，指甲碰着纸面，笃笃两声。敲完，手收回去，搁在登记簿边上。"]], "choices": ["争一句", "问他那怎么办", "（把话咽回去）"], "n": 2}, {"lines": [["nar", "他从抽屉里抽出一张回执，复写纸的蓝印还没干透。编号那一栏，数字一个挨一个，像是用尺子比着写的。"], ["say", "“收好。编号记着。”"], ["nar", "回执递出来的时候，纸边对得很齐。他的拇指压在编号上，松开时留下一个浅浅的指纹，印在最后一个数字旁边。"], ["say", "“有消息会打电话。”"]], "choices": ["收好", "问他多久有消息", "（看了一眼编号）"], "n": 3}, {"lines": [["nar", "窗台里面靠墙放着一盒胃药，铝箔板抽出来半截。盒子底下压着半张便签，上面写着两行字，被药盒挡去大半，只露出一个“饭”字。"], ["say", "“还有事？”"], ["nar", "裴则顺着我的目光低头看了一眼，把药盒往里推了推，便签跟着滑进去，只剩一个角露在盒子外面。他没再碰，手回到桌面上。"], ["say", "“没事就回吧。”"]], "choices": ["没提", "问他吃药了没", "（把便签扶正）"], "n": 4}, {"lines": [["nar", "我走到门口，玻璃门推开一半，冷风灌进来。身后传来椅子腿蹭地的声音。"], ["say", "“等一下。”"], ["nar", "裴则站在窗口后面，一只手搭在台面上，另一只手还捏着那张刚填完的表格。表格的边角被他捏出一道折。"], ["say", "“别自己去找人。有事打这个电话。”"], ["nar", "他把回执上的号码指了一下，指尖在纸面上停了停，然后收回去，插进制服口袋。"]], "choices": ["说知道了", "问他为什么", "（回头看他一眼）"], "n": 5}, {"lines": [["nar", "夜里十一点多，派出所的卷帘门拉下来一半。值班室的窗户亮着，白光从里面透出来，照见窗台上一个搪瓷缸，缸壁印着“先进”，红漆掉了一半。"], ["nar", "裴则坐在桌前，面前摊着几页纸，手里的笔没动。搪瓷缸里剩半缸水，水面浮着一层凉了的茶色。他隔一会儿端起来喝一口，放下，杯底磕在玻璃板上。"], ["nar", "窗台外沿放着一盒没拆封的烟，旁边是个一次性打火机。烟盒上落了点灰，手指一抹就是一道痕。"], ["say", "“还没走？”"], ["nar", "他抬了一下头，又低下去，笔尖在纸上划了一道，划完把笔搁下，看向窗外。"]], "choices": ["进去说一句", "在门口站着", "（买两瓶水放窗台）"], "n": 6}]}, {"title": "第二章 按规矩来", "scenes": [{"lines": [["nar", "接警大厅的长椅硬，靠背上一道裂口用透明胶粘过。隔壁两家人在饮水机旁站着，一个抱孩子，一个拎着被撕开的快递盒。"], ["say", "“他先动的手。”"], ["say", "“她把我家门牌掰了。”"], ["nar", "裴则把两人往两边分开，各退半步。他从胸袋里抽出一张打印好的调解流程单，纸角卷着，摊在两人中间。"], ["say", "“先登记。谁先说的，谁后说的，我都记。监控我去调，调不到就找见证人。今天不评谁有理，先把事摆清楚。”"], ["nar", "抱孩子那位哭起来，孩子跟着哼。裴则把桌上那盒抽纸往前推了推，没再说话，低头写接警登记，笔尖压得很重。"]], "choices": ["在旁边听", "帮他劝一句", "（递纸巾给哭的人）"], "n": 7}, {"lines": [["nar", "男的在门口回头，声音抬起来：“一张纸跑三趟，你们这规矩是给谁定的？”"], ["nar", "裴则把盖好章的那页对齐，压进档案袋，拉链拉到头。他没抬头，也没接话。大厅的挂钟秒针走过去四格。"], ["say", "“下一位。”"], ["nar", "等人走了，他才把印泥盒盖上，指腹沾的一点红在裤缝上蹭掉。桌角那杯水凉了，浮着一层薄灰。"]], "choices": ["事后问他委屈吗", "说他说得对", "（不说话）"], "n": 8}, {"lines": [["nar", "台风夜，卷帘门被风推得咚咚响。值班室的灯管有一根不亮，桌面只剩下台灯一圈黄光。电话每隔十几分钟响一次。"], ["say", "“树倒了压车……好，位置，我记。”"], ["nar", "他一手夹着听筒，一手在记录本上画格，写完一行，笔在纸边点一下，再写下一行。第七个电话挂掉时，他把听筒搁回去，手在桌沿停了一会儿。"], ["nar", "我从门口把打包盒放下，塑料盖里全是水汽。他抬头看了一眼，说：“先放着。”又拿起笔，把刚才那页重新誊了一遍，字压在格子里。"]], "choices": ["给他带夜宵", "问他困不困", "（坐在外面等）"], "n": 9}, {"lines": [["nar", "凌晨三点多，风小了些。他坐在台阶上，警服外套搭在腿上，手机屏亮着又灭。夜宵盒开着，筷子没拆。"], ["say", "“累不怕。怕的是判断错。你觉得该劝和，人家其实是来报案的；你觉得是小事，回头出了人命。”"], ["nar", "他说到这儿停住，拧开矿泉水喝了一口，瓶身被捏出一个坑。院子里积水映着路灯，一片黄。"], ["say", "“一张纸写下去，就是记录。记录错了，后面全是错的。”"], ["nar", "他把筷子拆开，夹了一口早就凉透的菜，慢慢嚼。"]], "choices": ["问他错过吗", "说人都会错", "（把话听完）"], "n": 10}, {"lines": [["nar", "笔录打了三页。打印机吐纸的时候卡了一下，他伸手把纸抽出来，吹了吹边上的墨。"], ["say", "“我给你念一遍。念到哪你听着，有不对的就说。”"], ["nar", "他从第一行开始念，声音不高，一个字一个字过。念到“本人确认以上内容”时，他抬眼看了一下，等我点头，才把笔递过来。"], ["nar", "笔是所里那种按动圆珠笔，笔帽上有一道牙印。他把签字那一栏的位置指给我，手指压在纸上，没挪开。"]], "choices": ["说不用念", "认真听完", "（指出一处写错）"], "n": 11}, {"lines": [["nar", "下午有人进来，没取号，直接往窗口边上一靠，笑着递烟。裴则手上正在装订卷宗，钉书机咔一声。"], ["say", "“这事你帮我压一压，都是熟人。”"], ["say", "“压不了。该立案立案，该调解调解。”"], ["nar", "烟搁在台面上没动。来人收了笑，站了几秒，转身走了，门帘晃了两下才停。裴则把烟拿起来，放进窗口外的失物盒里，继续按钉书机。"]], "choices": ["问他不怕吗", "说这样会得罪人", "（什么也没说）"], "n": 12}]}, {"title": "第三章 我也会错", "scenes": [{"lines": [["nar", "值班室靠窗那根灯管一闪一闪，笔录纸摊在桌上，笔没盖帽。"], ["nar", "裴则把监控时间轴往回拖，停在二十三点十七分，画面里那个人正走出大门，肩膀擦过门框。"], ["say", "“这个人，是我放的。”"], ["nar", "他把接警登记本推过来，食指按住其中一行，纸面压出一个浅窝。"], ["say", "“他报的住址，我没核。电话也没打回去。”"], ["nar", "窗外一辆自行车过去，车铃响了一声，屋里没人动。他拧上笔帽，又拧开，来回两次。"]], "choices": ["问他怎么办", "说这不怪他", "（陪他去补材料）"], "n": 13}, {"lines": [["nar", "后半夜的办公室只剩台灯亮着，暖水瓶搁在桌角，瓶塞没塞严，冒一点白气。"], ["nar", "一页检查压在灯下，稿纸边角卷起来，钢笔尖划破了两处。"], ["nar", "他把纸抽出来揉成团，扔进脚边的纸篓，又从抽屉里抽一张新的。"], ["say", "“第一句就不对，”他说，“写得太像往外推。”"], ["nar", "第四遍他换了支笔，字压得很轻，稿纸推到桌子中间，边线对齐了桌沿。"], ["say", "“你帮我看看，这句‘未及时核实’……是不是太轻了。”"]], "choices": ["帮他看措辞", "说不用这么严", "（把纸推回去）"], "n": 14}, {"lines": [["nar", "办公室的门半开着，领导坐在对面，茶杯盖掀在一边，热气早散了。"], ["say", "“这事，谁担？”"], ["nar", "裴则站着，手垂在身侧，警服下摆有一道没抹平的折痕。"], ["say", "“我担。”"], ["nar", "领导把考核表往前推了推，纸边蹭过桌面，声音很轻。"]], "choices": ["拉他衣角", "等他自己说", "（先开口替他解释）"], "n": 15}, {"lines": [["nar", "走廊尽头的窗台上搁着一块旧布。他拿起来，把胸前的警号牌解下来。"], ["nar", "号码牌背面有一层灰，他擦了两遍，就着窗玻璃看了看。"], ["say", "“不是讲究，”他说，“扣歪了不好看。”"], ["nar", "别针穿过布料，他把牌子按回胸前，掌心压了一下才松手。"]], "choices": ["说你还挺讲究", "问他后悔吗", "（帮他扶正）"], "n": 16}, {"lines": [["nar", "卷帘门拉到一半，外头的路灯刚亮，飞虫在光里撞。"], ["nar", "他站在台阶上，手插在裤袋里，没急着走。"], ["say", "“你先回吧。”"], ["nar", "门里的灯灭了一盏，他的影子从台阶上落到地面，拉长了一截。"]], "choices": ["走过去并肩", "先走，回头看一眼", "（等他一起）"], "n": 17}]}], "endings": {"A": {"title": "这顿他请", "text": "警号牌擦得能照出人影，他把它扣回胸前，帽子夹在腋下。走到门口他停了一下，说这顿他请，不算公事。面馆就在街对面，灯管一闪一闪的，他先替你推了门。"}, "B": {"title": "念到一半", "text": "检查交了，处分下来了，写在一张白纸上，编号很小。他照旧站在窗口后面，把每一行念给你听，念到一半停了停，喝了口水，再接着念。台面上那盒胃药换成了新的。"}, "C": {"title": "磨淡的编号", "text": "他调到内勤，窗口换了人。那张回执你一直留着，编号后面几位的墨迹被手指磨淡了。有天你在窗口问起他，新来的人翻了翻册子，说不太清楚，好像调走了。"}, "D": {"title": "帽檐压得很低", "text": "案子结了，他把材料归档，柜门关得很轻。后来在街口碰见过一次，他点了下头，帽檐压得很低，走过去之后你才反应过来。地上的水洼里有半边制服的影子。"}}, "vigs": [{"title": "一米二", "need": 6, "lines": ["办事窗口一米二高，站着说话得稍微低头。", "他从不坐下来说话，说站着快。", "有人搬了凳子来请他坐，他摆摆手，说流程里没这条。", "凳子在墙边放了一整天，晚上才被他自己搬回去。"]}, {"title": "胃药", "need": 12, "lines": ["桌上那盒胃药压着半张便签，便签上写着三个电话号码。", "药只剩两粒，盒沿被捏得起了毛。", "你问他吃饭了吗。", "他说吃了，然后把药盒往抽屉里推了推。"]}, {"title": "检查", "need": 18, "lines": ["检查写在一页纸上，改了四遍，每一版的错处都圈出来。", "最后一版只剩两行字，字比前面都小。", "他签名字的时候，笔尖在纸上停了一下。", "签完他把纸对折，折痕压得很实。"]}], "route": "badge", "arch": "制度里的好人"};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
if(D.world){ $('#world').textContent=D.world; } else { $('#secWorld').style.display='none'; $('#world').style.display='none'; }
if(D.profile && D.profile.length){ $('#profile').innerHTML = D.profile.map(([k,v])=>'<p class="world"><b style="color:#c8a37a;font-weight:400">'+k+'</b>　'+v+'</p>').join(''); }
else { $('#secProfile').style.display='none'; $('#profile').style.display='none'; }
if(D.premise){ $('#premise').textContent=D.premise; } else { $('#secPremise').style.display='none'; $('#premise').style.display='none'; }
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      if(/陪|等|不|别走|谢|留|帮|说|问|看|递|握/.test(t)) warm++;
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=warm/Math.max(1,total);
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; render(); };
