<script>
const D={"name": "苏晚", "meta": "26 · 建筑公司法务专员", "premise": "她替沈亦舟垫了三年人情账，等他先开口；雨落第四十天，她把账本摊在桌上。", "world": "建筑公司十七层，会议室的玻璃上常年挂着雨水。她的工位抽屉里有一本薄薄的记账本，封皮磨白。", "chapters": [{"title": "第一章 记在账上", "scenes": [{"lines": [["nar", "雨从玻璃幕墙往下淌，前台只剩一盏灯。苏晚把工牌塞进包里，手机屏亮着打车软件的等待页。"], ["say", "“你先走，我手机快没电了。”沈亦舟把西装外套搭在臂弯，站在旋转门内侧。"], ["nar", "她点开付款码，替他把车费付了。闸机口的冷风把雨腥味送进来，他抬手拦车，没有回头。"], ["nar", "上车后，她把记账本翻到第三十七行，写下日期、金额和“沈”。笔尖在“垫付”两个字上停了一下，又划掉，改成“车费”。"]], "choices": ["顺手记下，不提", "把收款码发给他", "不记，当没发生"], "n": 1}, {"lines": [["nar", "茶水间的热水器跳到绿灯，苏晚捏着杯耳，杯底还沾着咖啡渍。"], ["say", "“小周做事是真细，上次会议纪要连页码都标了。”沈亦舟靠在冰箱边，对行政的人说。"], ["nar", "她把马克杯放回杯架，杯口朝里，和旁边那排白瓷杯对齐。热水没接，茶包留在台面上。"], ["nar", "门弹回去的时候，沈亦舟抬了一下眼。她没停，走廊尽头的复印机正在吐纸。"]], "choices": ["出声纠正事实", "转身走开", "在心里记他一笔"], "n": 2}, {"lines": [["nar", "火锅店包间的排风扇嗡嗡响，桌上的账单压在湿纸巾盒下。沈亦舟把手机扣在桌面，冲收银台抬了抬下巴。"], ["say", "“苏晚，你先垫一下，回头我一起转你。”他正把最后一片毛肚捞进自己碗里。"], ["nar", "她扫了付款码，输入金额，在备注栏打了“暂借-部门聚餐-沈”，按了确认。收银机的热敏纸吐出来，她把小票对折，夹进手机壳。"], ["say", "“好了。”她把手机放回桌面，屏幕朝下。"]], "choices": ["备注写“暂借”", "备注只写金额", "让他当场转"], "n": 3}, {"lines": [["nar", "出租车停在小区门口，雨刷刮不净前挡的积水。苏晚抱着包跑进单元门，裤脚湿到脚踝。"], ["nar", "玄关的灯打开，她把湿伞立在瓷砖上，水滴沿着伞尖汇成一小滩。餐桌上摊着那本记账本，旁边是开了机的笔记本。"], ["nar", "她打开“待收”表格，把这个月的条目逐行敲进去：车费、咖啡、代付的干洗费、聚餐。光标跳到合计栏，数字停在2400。"], ["say", "“两千四。”她报了个数，把手机屏扣在桌上。"], ["nar", "她盯着屏幕右下角的日期，保存，合上电脑。窗外的雨砸在空调外机上，一声接一声。"]], "choices": ["录入“待收”表格", "删掉全部记录", "折算成人情份额"], "n": 4}, {"lines": [["nar", "手机在桌面上震了一下，屏幕亮起来，是沈亦舟的消息。客厅没开大灯，光从屏幕里漏出来，照在记账本的塑料封皮上。"], ["say", "“改天请你。”"], ["nar", "她擦干手指，点开对话框。光标在输入栏里闪，她看了很久，直到屏幕自动暗下去，又用指腹按亮。"], ["nar", "她打了三个字，又删掉，最后发出去：“好，记着。”"]], "choices": ["回：好，记着", "不回", "回：哪天"], "n": 5}]}, {"title": "第二章 雨里对账", "scenes": [{"lines": [["nar", "会议室投影亮着，甲方的指节敲在附件第三页，纸角被戳出一个小窝。"], ["nar", "苏晚把三个版本的合同摊在桌上，边缘对齐，抽出最薄的那份推到中间。"], ["say", "“第四点二条，工期可以顺延，但要书面通知，送达日期以签收为准。”"], ["nar", "她划了一下屏幕，打开邮件草稿，收件人那一栏空着。"], ["say", "“你发，我这边要留时间戳。”"], ["nar", "沈亦舟的指尖停在句末，回车键落下去，隔壁打印机开始吐纸。"]], "choices": ["逐条讲清，顺带记时", "要他发正式邮件", "拒绝，先划清责任"], "n": 6}, {"lines": [["nar", "会议记录打到第六页，责任栏里原本写着“沈亦舟”，她按退格键删了三次。"], ["nar", "键盘声停住，她把“法务专员苏晚”填了进去，字号调得和正文一样大。"], ["nar", "他坐在长桌另一头，笔在指间转了半圈，笔帽磕在杯沿上，很轻的一响。"], ["say", "“记录我签了，追责到我为止。”"], ["nar", "散会后她扫描原件，扫描仪的绿光来回走了两遍，文件命名带上当天日期，存进贴着“留底”标签的文件夹。"], ["say", "“纸质的我锁柜子里。”"]], "choices": ["私下留一份原始记录", "当面跟他要一句话", "什么都不留"], "n": 7}, {"lines": [["nar", "雨停在四点十分，楼下台阶的积水漫过鞋头，他收伞，伞尖在花坛边磕了两下。"], ["say", "“你人真好。”"], ["nar", "她从包里摸出纸巾，把他伞柄上沾的水擦在纸上，折好，扔进楼梯口的桶。"], ["say", "“这不是好，是成本。”"], ["nar", "他笑了一下，抬手去摸口袋，楼里电梯的楼层数一格一格往下跳。"], ["say", "“成本总得有个数吧。”"], ["nar", "雨又落下来，她撑开自己的伞，往地铁口的方向走。"]], "choices": ["这不是好，是成本", "嗯", "你打算怎么还"], "n": 8}, {"lines": [["nar", "打印机出了一夜的纸，A4拿出来还带着温，四十七笔，每一笔前面都有日期，加粗。"], ["nar", "她按页码排好，在最后一页的空白处补上“合计”，写完把笔帽按回去。"], ["nar", "订书机压下去两次，两份，一厚一薄，钉子压得不一样深。"], ["nar", "一份夹进他办公室门缝底下那份摊开的文件夹里，边角对齐桌沿。"], ["nar", "另一份放进自己包里，拉链拉到一半，又拉开，指尖按了按纸角。"], ["say", "“三年，四十七笔。”"]], "choices": ["发给他", "打印两份", "锁进抽屉"], "n": 9}, {"lines": [["nar", "他生日那天，转账页面的默认金额还停在去年的数，她没有改。"], ["nar", "备注栏一根竖线闪动，她打了四个字，停了两秒，按了发送。"], ["say", "“最后一笔。”"], ["nar", "顶端“对方正在输入”亮起又消失，隔了很久，跳出来一个问号。"], ["nar", "她把手机扣在桌上，抽出账本，把那一页拍下来，存进同一个文件夹。"], ["nar", "窗外的雨敲在空调外机上，一声接一声，跟昨天一样密。"]], "choices": ["最后一笔", "生日礼物", "删掉备注再发"], "n": 10}]}, {"title": "第三章 我直接要", "scenes": [{"lines": [["nar", "会议室的灯管闪了一下。苏晚把两个文件夹并排搁在沈亦舟的笔记本电脑前，左边牛皮纸的封皮磨了角，右边是一沓打印纸，边角还带着打印机的余温。"], ["nar", "窗外的雨敲在遮阳棚上，一阵一阵的。她退开半步，手指从纸页上收回来，在身侧攥了一下，又松开。"], ["say", "“左边三年的人情账，一笔一笔，日期、事由、垫付数，都在里面。右边是本金之外的时间，我照日历抄的，从你答应那天起，到今天四十七天，雨落第四十天。”"], ["nar", "沈亦舟没伸手，只抬头看她。她把那沓纸又朝他那侧推了半寸，纸边蹭着桌面发出一声轻响。"], ["say", "“你先看。看完找我。”"]], "choices": ["看完找我", "站在旁边等他看完", "拍照留存"], "n": 11}, {"lines": [["nar", "他到底翻开了左边那份，手指顺着条目标下去，翻了两页，停住。"], ["say", "“苏晚，我们之间，不用算这么清。”"], ["nar", "她没有坐下，站在桌沿旁边，视线落在自己的手背上。杯里的水凉了，浮着一层薄薄的灰。"], ["say", "“那你给个数。”"], ["nar", "他笑了一下，把纸合上，往旁边推。她伸手把纸又拉回他面前，指尖在纸角按出一小片白印。"], ["say", "“我算清才安心。”"]], "choices": ["那你给个数", "我算清才安心", "收起纸转身"], "n": 12}, {"lines": [["nar", "出了电梯，雨还在下。门厅的地垫吸饱了水，踩上去没有声音。苏晚把伞撑开，伞骨卡了一声才弹到位。"], ["nar", "沈亦舟跟出来，站在檐下，肩膀露在雨里，没去接她手里的伞。雨点打在他西装上，一小块一小块地深下去。"], ["say", "“总额。”她看着他说，“连本带那四十七天，一共多少，我报给你，还是你报给我。”"], ["nar", "雨水顺着伞沿连成一条线，正好隔在两个人中间。她把伞往自己这边偏了偏，肩膀后面那一片衣料，慢慢湿了。"], ["say", "“三天。三天之内到账，我们两清。”"]], "choices": ["等他先开口", "直接报出总额", "给三天期限"], "n": 13}, {"lines": [["nar", "第四十一天的早晨，雨小了些，楼道的窗上蒙着一层白汽。沈亦舟堵在她工位旁，手里捏着那两张纸。"], ["say", "“非要这样吗。”"], ["nar", "苏晚把电脑屏幕按暗，转过身来，看着他，没有让开。"], ["say", "“是。”"], ["nar", "她拉开抽屉，取出一支黑色的签字笔，拔了笔帽，把笔杆朝他手里递过去，笔尖对着自己。"], ["say", "“签个字，写个日期。剩下的，照三天走。”"]], "choices": ["把原因说完整", "只重复期限", "把笔递过去"], "n": 14}, {"lines": [["nar", "转账提示是在第四十三天的下午进来的，手机在桌角震了一下。她点开，数字是对的，一分不差。日期比三天约定晚了两个日子。"], ["nar", "她在账本最后一页那个数字后面，写了个“收”字，笔画很稳。写完合上，把本子塞进抽屉最里面。"], ["say", "“钱到了。”她对着手机那头的人说，“迟了两天，这我不追究了。”"], ["nar", "电话那头停了几秒。窗外的雨正好停住，檐角最后一滴落下来，砸在空调外机上。"], ["say", "“剩下的，见一面说完。”"]], "choices": ["收下，备注“已清”", "原路退回", "追那两天的利息"], "n": 15}, {"lines": [["nar", "楼下咖啡店的卷帘门半拉着，里面没人。苏晚坐在靠窗的位置，把倒扣的杯子翻过来，杯底有一道水渍。"], ["nar", "沈亦舟进来，在她对面坐下，把手机放在桌上。她看了一眼手机，又看回他的脸。"], ["say", "“账清了。可我要的东西，从来不是钱。”"], ["nar", "她把手掌平放在桌上，推过去一张便签，上面只有一行字。她按着那张便签，指尖没松。"], ["say", "“我要你先开口。这次，从你嘴里说出来。”"]], "choices": ["我要你先开口", "我要一句准确的", "我要我自己"], "n": 16}]}], "endings": {"A": {"title": "第七十三页", "text": "账本最后一页写满那天，她把它合上，放回抽屉最里面。外面的雨停了，她把伞留在工位上，第一次空手走出写字楼。玻璃门映出她自己的影子，走得很稳，没有回头看一眼十七层。"}, "B": {"title": "第48条", "text": "他终于先开口，说得磕磕绊绊，把「我欠你的」说成「我一直知道」。她没笑，翻开账本，在最后一行写下第 48 条：这笔不是垫的。写完之后笔停了很久，才把本子合上。"}, "C": {"title": "归档", "text": "那句话没等到。她把清单复印一份，装进档案袋，写上日期，归到自己那一格。钱一分不少地到了，时间晚了三天。雨还在下，她撑着伞走进雨里，伞面只遮住一个人。"}, "D": {"title": "并成一张", "text": "两人把旧账并成一张表，各写一半。他的字大，她的字小，两栏并排，中间用铅笔划了一道线。雨一直没停，表格最后一行她留了空，笔搁在线上，谁也没先动。"}}, "vigs": [{"title": "账本", "need": 6, "lines": ["账本是薄薄一本，封皮磨白，里面用尺子画了竖线。", "每一笔都写着日期、金额、事由，字小而整齐。", "「你记这个干嘛？」同事问。", "「习惯了。」她合上本子，塞回抽屉。"]}, {"title": "第37条", "need": 12, "lines": ["第 37 条那页有一道折痕，是反复翻过的痕迹。", "事由栏写着两个字：车费。", "下面空着一行，像是留给什么。", "她后来用铅笔在那行补了日期，又擦掉。"]}, {"title": "四十七笔", "need": 18, "lines": ["三年，四十七笔，全带日期。", "她把清单打印出来，纸边对齐，压在一叠合同下面。", "有人问她为什么不算清。", "她说算清就没意思了——说完自己愣了一下。"]}], "route": "ledger", "arch": "隐忍记账型女主"};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
if(D.world){ $('#world').textContent=D.world; } else { $('#secWorld').style.display='none'; $('#world').style.display='none'; }
if(D.profile && D.profile.length){ $('#profile').innerHTML = D.profile.map(([k,v])=>'<p class="world"><b style="color:#c8a37a;font-weight:400">'+k+'</b>　'+v+'</p>').join(''); }
else { $('#secProfile').style.display='none'; $('#profile').style.display='none'; }
if(D.premise){ $('#premise').textContent=D.premise; } else { $('#secPremise').style.display='none'; $('#premise').style.display='none'; }
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      if(/陪|等|不|别走|谢|留|帮|说|问|看|递|握/.test(t)) warm++;
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=warm/Math.max(1,total);
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; render(); };
</script></body></html>
