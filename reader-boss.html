<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>谢临 · 逐字版</title>
<style>
:root{--bg:#0f0c0b;--ink:#ece6de;--dim:#a49b90;--faint:#6f6862;--line:rgba(255,255,255,.09);
--accent:#c9a06a;--acc-ink:#1a140e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 70% at 50% 0,#1a1512,#0f0c0b 62%);color:var(--ink);
 font:17px/1.9 "Songti SC","Noto Serif SC",serif;min-height:100dvh}
.wrap{max-width:680px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px 60px}
h1{font-size:22px;font-weight:500;margin:0 0 4px;letter-spacing:.04em}
.meta{color:var(--faint);font-size:12.5px;letter-spacing:.12em}
.sec{color:var(--accent);font-size:11.5px;letter-spacing:.18em;margin:20px 0 6px}
p.world{color:var(--dim);font-size:14px;margin:0}
.btn{display:inline-block;margin-top:18px;background:var(--accent);color:var(--acc-ink);border:0;
 border-radius:12px;padding:11px 20px;font-size:15px;font-family:inherit}
#stage{display:none}
.chap{color:var(--faint);font-size:12px;letter-spacing:.16em;text-align:center;margin:26px 0 14px}
.nar{margin:0 0 14px;line-height:2;font-size:16.5px}
.her{background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:2px solid var(--accent);
 border-radius:14px;padding:11px 15px;margin:0 0 14px}
.choices{display:grid;gap:9px;margin:18px 0 0}
.choices button{text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);
 border-radius:12px;padding:12px 14px;font-size:14.5px;font-family:inherit}
.choices button:hover{border-color:rgba(201,160,106,.5)}
.endcard{margin:22px 0;padding:16px 18px;border-radius:16px;border:1px solid rgba(201,160,106,.32);
 background:linear-gradient(180deg,rgba(201,160,106,.1),transparent)}
.eth{color:var(--accent);font-size:12.5px;letter-spacing:.12em;margin-bottom:8px}
.vig{margin-top:20px;border-top:1px dashed var(--line);padding-top:14px}
.vig h3{font-size:14px;font-weight:500;margin:0 0 8px;color:#c8a37a}
.vig p{margin:0 0 8px;color:var(--dim);font-size:14px}
.small{color:var(--faint);font-size:12.5px;margin-top:10px}
</style></head><body><div class="wrap">
<div id="intro">
  <h1 id="nm"></h1><div class="meta" id="mt"></div>
  <div class="sec">故事背景</div><p class="world" id="world"></p>
  <div class="sec">前情提要</div><p class="world" id="premise"></p>
  <button class="btn" id="go">开始</button>
  <div class="small">这一版是写死的正文：不联网、不需要模型，每句都对过。</div>
</div>
<div id="stage"><div id="log"></div><div class="choices" id="ch"></div></div>
</div>
<script>
const D={"name": "谢临", "meta": "33 · 品牌部负责人", "premise": "你被临时调进她的项目组，第一天她在白板上写了一行字：这周只解决一个问题。", "world": "品牌部在十五层，白板永远擦得干净。她的办公室门常年开着，但没人随便进去。", "chapters": [{"title": "第一章 一个问题", "scenes": [{"lines": [["nar", "会议室的白板没擦净，边角还留着上一轮马克笔的影子。谢临抽了支黑笔，拔盖，抬手在正中写了一行字。"], ["say", "“这周只解决一个问题。”"], ["nar", "她把笔横放回笔槽，退半步，两手插在西装口袋里。白板上就那一行，下面空出很大一块，白得晃眼。"], ["nar", "有人捏着便利贴站到白板前，手抬到一半又落下。空调风口正对着板面，纸角被吹得一抖一抖。"], ["say", "“想加的，周五再说。”"], ["nar", "她说完转身，鞋跟在地板上敲了两下，出门时顺手把门带到了门吸上。"]], "choices": ["问为什么只写一个", "直接往上加一行", "（先把白板擦干净）"], "n": 1}, {"lines": [["nar", "投影亮着，你讲到第二页。她抬手，食指在桌面上点了两下。"], ["say", "“这一页的数字，谁的口径？”"], ["nar", "你把页面翻回去，光标停在图表标题上。桌尾有人转笔，笔掉在桌面上，滚了半圈。"], ["say", "“我重讲一遍，这个口径是——”"], ["nar", "她第二次打断，同样的问题，只是更短。空调的风把她面前那张纸吹起一角，她用手掌压住。"], ["say", "“口径。”"]], "choices": ["按她的问法重讲", "说这样太慢", "（把数据翻出来）"], "n": 2}, {"lines": [["nar", "投影关了，会议室亮起来。她合上笔记本，指尖压在封面边缘，压出一道白痕。"], ["say", "“这个方案不行。重做。”"], ["nar", "同事陆续起身，椅子腿刮过地面。她最后一个走，把门带上，却没关严，留了一条缝。"], ["nar", "晚上九点四十，手机在桌面上震了一下。三条消息，标着一二三，每条后面跟着半句为什么。"], ["say", "“一，删掉第二部分的比喻。二，把结论提到第一页。三，别再写‘赋能’。”"]], "choices": ["当晚改完", "问她哪条最重要", "（先不回）"], "n": 3}, {"lines": [["nar", "十点过五分，办公区只剩两排灯。她把最后一份外卖放在你桌角，塑料袋提手还系着，盒盖有点鼓。"], ["say", "“吃吧，我吃过了。”"], ["nar", "她回自己工位，显示器光落在脸上。你听见她那边拆了一包饼干，声音很轻，撕开又停住。"], ["nar", "你翻开盒盖，米饭上压着一张便利贴，边缘是从打印纸上撕下来的，上面没字，只有一个箭头，指着一楼的会议室。"], ["say", "“吃完把那盏灯关了。”"]], "choices": ["说谢谢", "问她吃了没", "（分她一半）"], "n": 4}, {"lines": [["nar", "茶水间的烧水壶跳了开关。两个人靠在台面边，声音压得低，杯子在手里转。"], ["say", "“她一句多余的话都没有，改起东西倒是一二三条。”"], ["nar", "你接了一杯热水，杯壁烫手，换了个握法。水汽在眼镜上蒙了一层。"], ["nar", "她们看了你一眼，话题拐到明天的天气。水壶又跳了一次，谁也没去按。"], ["nar", "你把杯子端出去，杯子放在工位上，没喝。"]], "choices": ["替她说一句", "说确实冷", "（什么也没说）"], "n": 5}, {"lines": [["nar", "群里跳出她的头像，只有一个字。发送时间十一点零七分，后面没有人接话。"], ["say", "“好”"], ["nar", "手机屏幕在没开灯的房间亮着，光落在天花板上，一小块。"], ["nar", "你截了图，存进相册。往下翻两张，是第一天白板上那行字的照片，字迹还挺新。"]], "choices": ["回个收到", "私聊问她满意吗", "（截图存下来）"], "n": 6}]}, {"title": "第二章 边界", "scenes": [{"lines": [["nar", "会议室玻璃墙外有人走过。她把一张A4纸推到你面前，订书钉在左上角，纸面还带着打印机的余温。"], ["say", "“下周一你去B组报到。”"], ["nar", "她没抬头，鼠标在屏幕上点了两下，光标停在某个表格单元格里。"], ["say", "“项目交接清单我发你了，今晚之前填完。”"], ["nar", "她合上笔记本，杯里的美式还剩三分之一，杯壁挂着水珠。"]], "choices": ["问为什么", "接受安排", "（把项目交接完）"], "n": 7}, {"lines": [["nar", "楼梯间只有安全出口的绿光。她站在下一层半的拐角，手机贴着右耳，左手插在外套口袋里。"], ["say", "“……嗯，我知道。”"], ["nar", "她转过身，看见你，点了一下头，手机没放下。"], ["say", "“先这样，回头说。”"], ["nar", "她按掉电话，把手机滑进口袋，手再抽出来时带出一张门禁卡，在指尖转了一圈。"]], "choices": ["走开", "等她挂断", "（点头就走）"], "n": 8}, {"lines": [["nar", "傍晚六点二十，办公室只剩两排灯亮着。她靠在椅背上，右手按着眉心，左手还搭在鼠标上。"], ["nar", "白板上“这周只解决一个问题”没擦，下面多了一行小字：边界。"], ["say", "“我也会累。”"], ["nar", "她说这话时看着显示器边框，鼠标的红色指示灯一闪一闪。"], ["nar", "她松开手，把椅子往前拉了一截，鼠标点了一下。"]], "choices": ["说我知道", "问要不要歇一天", "（没接）"], "n": 9}, {"lines": [["nar", "甲方群里弹出一条长消息，她扫了一眼，把手机扣在桌上。"], ["say", "“需求我接了，你们先把手头的收尾。”"], ["nar", "她回到工位，翻开笔记本，键盘声从她那边传过来，比平时快。"], ["nar", "晚上八点，屏幕还亮着，桌角的饭团包装拆了一半。"], ["say", "“不用等我，先走。”"]], "choices": ["帮她分一半", "问她图什么", "（陪她加班）"], "n": 10}, {"lines": [["nar", "群里弹出她发的一段话：“因个人工作安排冲突，本次晚宴无法列席，改日专程登门致歉。”"], ["nar", "发送键一按，她的手机屏幕朝下扣在桌上。"], ["say", "“这理由太官方了。”"], ["nar", "对面工位的小陈抬头看了她一眼。她没接话，把水杯端起来喝了一口。"], ["nar", "杯底磕在桌面上，声音很轻。"]], "choices": ["问理由", "说会得罪人", "（帮她挡一次）"], "n": 11}, {"lines": [["nar", "周五下午五点四十，邮箱弹出一封新邮件，发件人：谢临，主题：周报0317。"], ["nar", "正文只有三行数据，最后一行写着：“下周你决定。”"], ["nar", "你抬头，她工位的椅子空着，桌面收拾过了，白板上的字擦掉了。"], ["say", "“看完了？”"], ["nar", "她从茶水间回来，手里端着两杯水，一杯放在你桌角。"]], "choices": ["问她为什么", "说我来", "（回一个好）"], "n": 12}]}, {"title": "第三章 说清楚", "scenes": [{"lines": [["nar", "会议室只剩半排灯亮着。谢临把一只牛皮纸文件夹从桌面那头推过来，回形针别在封口上，压出一道浅痕。白板还没擦，那行字下面多了一列编号，最后一个圈被框了两遍。"], ["say", "“收尾这摊，你来定。”"], ["nar", "她把马克笔横放在文件夹上面，笔帽没扣，笔尖朝你。手指在桌沿敲了一下，收回去。"], ["say", "“定完给我一句就行，不用先问我。”"]], "choices": ["接下", "问她想怎么收", "（先列三个方案）"], "n": 13}, {"lines": [["nar", "散会的人走光了，投影仪还亮着，蓝底投在她背后的墙上。她没动，把电脑合到一半又打开，指腹在触控板上滑了两下。"], ["nar", "纸杯里的水剩一个底，她捏扁了纸杯口，没扔，放在桌角。椅子往后推了半掌，人还坐着。"], ["say", "“你先别走。”"], ["nar", "她把手机翻面扣在桌上，屏幕的光从杯壁边漏出来一条。"]], "choices": ["等她开口", "先说话", "（收拾桌子）"], "n": 14}, {"lines": [["nar", "她从包里摸出一支旧钢笔，笔杆上的漆掉了一块，搁在清单旁边。笔夹是歪的。"], ["say", "“我刚上手那年，也有人这么带。就给一句话，剩下的自己撞。”"], ["nar", "她把笔推正，笔尖对着文件夹的方向。"], ["say", "“后来撞出来了。”"], ["nar", "说完她去够那个扁纸杯，扔进垃圾桶，桶盖弹了一下。"]], "choices": ["问她后来呢", "说谢谢", "（记下来）"], "n": 15}, {"lines": [["nar", "第三稿摊在会议桌上，你那份方案打印出来十二页，第七页有她用红笔划的一道，从段首斜到段尾，没写字。页角折了个三角。"], ["nar", "她把稿子往你那边推了三厘米，又停下。红笔搁在折角上，滚了半圈。"], ["say", "“按你的走。”"], ["nar", "她起身去接水，纸杯接满了没停，水溢到托盘里，她才关掉龙头。"]], "choices": ["问她意见", "直接推进", "（把风险写清）"], "n": 16}, {"lines": [["nar", "交付当天，她在电梯口站着，两份合同夹在腋下，最上面那份露出一个签名角，墨还没完全干。电梯到层的提示响了两遍，她没进。"], ["nar", "她把合同抽出来，对齐了边角，递到你面前，笔从合同里滑出来，被她另一只手接住。"], ["say", "“签完这份，项目就结了。”"], ["nar", "她低头看了一眼腕表，抬手按住电梯的开门键，门停在那里，合不上。"]], "choices": ["接过", "问哪份是我的", "（看她先签）"], "n": 17}]}], "endings": {"A": {"title": "第二个问题", "text": "她把你那份合同翻到最后一页，签完递回来，说下个项目你来带。白板上那行字还没擦，下面多了一行新的，笔画比上面那行轻：第二个问题，我们一起解决。"}, "B": {"title": "一个句号", "text": "项目结了，她照旧只发一个字：好。区别是这次后面跟了一个句号，那个点很小，落在屏幕正中。你盯着它看了很久，才回了一个收到。"}, "C": {"title": "划线很直", "text": "她把你调回原来的组，交接表写得很清楚，一条没漏。最后一栏的「下周你决定」被划掉了，改成「按原计划」。那道划线很直，直得像用尺子比着画的。"}, "D": {"title": "笔帽不见了", "text": "项目结束后她升了职，办公室搬到十七层。白板擦得很干净，那行字谁也没再写上去。桌角的笔筒里少了一支白板笔的笔帽，找了半天没找到。"}}, "vigs": [{"title": "白板", "need": 6, "lines": ["白板上只写一行字，别人不敢往上加。", "她擦白板从上往下擦，一条一条擦，不留横线。", "有次你加了半行，第二天那半行被擦掉，字下留了空白。", "空白在中间，像她特意留的。"]}, {"title": "外卖", "need": 12, "lines": ["加班到十点，她会把最后一份外卖放在公共桌上。", "不写名字，也不说是给谁的。", "有人问是不是没人要，她说放这儿。", "第二天盒子空着，被洗干净倒扣在沥水架上。"]}, {"title": "周报", "need": 18, "lines": ["她的周报每一栏都有结论，只有最后一栏写「下周待定」。", "那栏空了六周。", "第七周她写上：下周你决定。", "写完之后她把字号调小了半号。"]}], "route": "boss", "arch": "克制强势型男主"};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
$('#world').textContent=D.world; $('#premise').textContent=D.premise;
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      if(/陪|等|不|别走|谢|留|帮|说|问|看|递|握/.test(t)) warm++;
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=warm/Math.max(1,total);
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; render(); };
</script></body></html>
