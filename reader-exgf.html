<script>
const D={"name": "苏梨", "meta": "26 · 广告公司客户总监", "premise": "同学会快散场了，苏梨才推门进来。她迟到了整晚，风衣还没脱，举杯和大家打过招呼，目光最后落到角落里的你。\n「好久不见，你还是坐角落。」\n这是你们分手五年后的第一次见面。", "world": "小城的同学会馆、路口的便利店、机场的落地窗。常年下雨，玻璃上都是水痕。", "chapters": [{"title": "第一章 同学会", "scenes": [{"lines": [["nar", "包厢门被推开时，桌上的转盘刚停住。走廊的冷气挤进来，一次性桌布的一角翘了翘。"], ["nar", "苏梨站在门口，风衣没脱，手里拎着一瓶没开的红酒，瓶身上挂着水汽。"], ["say", "“路上堵。”"], ["nar", "她把酒放上转盘，自己倒了半杯啤酒，举到眉骨的高度，绕着桌子走了一圈，杯沿在每张椅子前停一下。"], ["say", "“好久不见——你还是坐角落。”"]], "choices": ["站起来接杯", "坐着不动", "（把杯子推过去）"], "n": 1, "fx": [0, 0, 0]}, {"lines": [["nar", "椅子腿刮过瓷砖。她把风衣搭在椅背上，袖子垂到你这侧的扶手。"], ["say", "“过得怎么样？”"], ["nar", "她面前的骨碟里堆着别人剥的虾壳，她用筷子拨到一边，没动。"], ["nar", "手机在她手边亮了一下，她翻过去扣在桌上，指尖在桌沿敲了两下。"], ["say", "“还行。”"]], "choices": ["说还行", "反问她", "（说不如你）"], "n": 2, "fx": [0, 1, 0]}, {"lines": [["nar", "桌上的果盘剩了几瓣橘子，皮干得卷起来。空调风口正对着这一侧，桌布角一直抖。"], ["say", "“你还是坐角落。”"], ["nar", "她说这话时没看你，食指把杯壁上的水珠抹开，抹成一道横线。"], ["say", "“习惯了。”"], ["nar", "她抬了下眼皮，又低下去，把杯子往你那边推了半寸。"]], "choices": ["问她记得挺清楚", "说习惯", "（笑一下）"], "n": 3, "fx": [1, 0, 0]}, {"lines": [["nar", "对面有人把啤酒瓶往桌上一墩，瓶底的泡沫涌上来。"], ["say", "“哎，当年谁先提的？”"], ["nar", "谁推了下转盘，盘子慢慢转，转到苏梨面前停住，上面是半盘凉掉的糖醋排骨。"], ["say", "“是我。”"], ["nar", "她端起杯子喝了一口，剩下的半杯放回桌上，没再动。"]], "choices": ["说是我", "等她答", "（把话岔开）"], "n": 4, "fx": [0, 1, 0]}, {"lines": [["nar", "走廊的灯关了一半。有人抱着外套在电梯口对单子，电梯门开时，镜面上有一道裂痕。"], ["nar", "苏梨站在按键旁边，风衣腰带还系着，手里捏着车钥匙。"], ["say", "“顺路吗？”"], ["nar", "她先进去，抬手按住开门键，指腹停在那个三角符号上。"], ["say", "“顺路。”"]], "choices": ["说顺路", "说不顺", "（问她想干嘛）"], "n": 5, "fx": [0, 0, 1]}, {"lines": [["nar", "路口的风把她的头发吹到脸上。她摸出烟盒，抽了一支，打火机打了两次才着，火苗被风压得很低。"], ["nar", "烟只燃了一截，她弯腰在垃圾桶边缘按灭，烟头丢进去，手指在风衣上擦了两下。"], ["say", "“不抽了？”"], ["say", "“戒了。”"], ["nar", "绿灯亮了，斑马线上没人动。一辆出租车的顶灯从路口滑过去，照亮她半边侧脸，又暗下来。"]], "choices": ["问她不抽了吗", "（站着等）", "说你先回"], "n": 6, "fx": [1, 1, 0]}]}, {"title": "第二章 算得清账", "scenes": [{"lines": [["nar", "面馆只剩两桌人。灯管有一根在闪，塑料桌布上的牡丹褪成了浅粉色，醋瓶的盖子缺了个角。"], ["nar", "苏梨把包搁在旁边的凳子上，外套没脱，肩头那块颜色比别处深。"], ["say", "“你想听，我就说快一点。说完你别打断我。”"], ["nar", "筷子把面挑起来，悬了两秒，又落回碗里，汤面上浮着的葱花散开。"], ["say", "“那年我二十三，你二十七。我等不了，就这么简单。”"]], "choices": ["说不是这样", "听她说完", "（问她后悔吗）"], "n": 7, "fx": [0, 0, 1]}, {"lines": [["nar", "她伸出手指，一根一根按在桌面上，指甲剪得很短。"], ["say", "“第一，你从来不谈以后。我问过一次房子，你说再说。第二，我妈住院那回，你出差，我一个人在走廊坐了一夜。”"], ["nar", "第二根手指按下去，桌面上的水渍被推开一道弧。"], ["say", "“第三，你生日那天，你手机亮在桌上，那条消息你没解释。我也没问。三件事，够了。”"], ["nar", "她把手收回去，指尖在袖口上蹭了一下。"]], "choices": ["逐条反驳", "说你说得对", "（问她清单呢）"], "n": 8, "fx": [0, 0, 1]}, {"lines": [["nar", "他把三件事一条一条往回说，声音不高。她没插话，手边的玻璃杯里冰早化完了，水漫到杯口。"], ["nar", "说完了。她还是没动，眼睛落在碗里那层结起来的油上。"], ["say", "“说完了？”"], ["nar", "她把杯子往旁边挪开半寸，杯底在桌上留下一圈水印，慢慢洇开。"]], "choices": ["说完", "停下来看她", "（把水推过去）"], "n": 9, "fx": [0, 1, 0]}, {"lines": [["say", "“这些账我算得清。我从来不吃亏，你知道的。”"], ["nar", "她说这话时把手机翻过去扣在桌上，屏幕亮了一下，又暗了。"], ["nar", "收银台的阿姨把找零压在酱油瓶底下，硬币磕出一声。"], ["say", "“跟谁在一起，图什么，划不划算，我一眼就看得出来。”"], ["nar", "面汤的表面结了一层薄膜，她拿筷子尖挑破，又放下。"]], "choices": ["说她算错一样", "问她算什么", "（笑出声）"], "n": 10, "fx": [0, 1, 0]}, {"lines": [["nar", "她没接下去。卷帘门拉下来一半，雨水顺着门缝往下淌，在门槛外积成一条细线。"], ["nar", "她转过头去看窗外，玻璃上有她半张脸的影子，隔着一层水汽，轮廓糊掉了。"], ["say", "“行，那不算了。”她把杯子往里推了推，转去看窗外。"], ["nar", "筷子横在碗沿上，一头翘起来，慢慢滑下去，磕在桌布上。"]], "choices": ["等", "说算了", "（问她要不要走）"], "n": 11, "fx": [1, 0, 1]}, {"lines": [["nar", "过了很久，她重新坐直，把筷子摆正，碗推到一边。"], ["say", "“那天我在你楼下站了两个钟头。十点到十二点。你窗户一直亮着。”"], ["nar", "她低头去拉包的拉链，拉了两下才拉上，铁齿咬住里头的布。"], ["nar", "阿姨过来收盘子。“还要点什么？”苏梨没抬头，把外套的扣子一颗一颗扣上了。"]], "choices": ["说我不知道", "问她为什么不说", "（沉默）"], "n": 12, "fx": [0, 1, 0]}]}, {"title": "第三章 我自己走", "scenes": [{"lines": [["nar", "便利店靠窗只剩一个高脚凳。她坐下，把手里那杯豆浆在台面上转了半圈，杯底蹭着塑料桌面，发出一声轻响。"], ["say", "“下周三的调令，去上海。”"], ["nar", "吸管的纸套撕开一半，她停住，把纸套放回桌上，让它翘着。"], ["say", "“客户总监，带三个人。”"], ["nar", "窗外一辆洒水车过去，音乐由远及近，又远。她低头看了眼手机，没解锁，屏幕自己暗了下去。"]], "choices": ["问她为什么现在说", "说去吧", "（问她哪天）"], "n": 13, "fx": [1, 0, 1]}, {"lines": [["nar", "她从包里抽出一张对折的纸，展开，是打印的租房信息，两室一厅，月租后面用笔圈了一道。"], ["say", "“房子看过了，两室。另一间空着。”"], ["nar", "她把纸推过来，指尖在“空着”两个字上停了一下，又收回去。"], ["say", "“你要不要一起。”"], ["nar", "关东煮的汤锅咕嘟一声。她抬手把纸折回原来的折痕，折得很齐。"]], "choices": ["问你想要我一起吗", "说不去", "（反问她怕什么）"], "n": 14, "fx": [1, 0, 1]}, {"lines": [["nar", "折好的纸塞回包里，拉链拉到一半卡住，她拽了两下才拉过去。"], ["say", "“上次同学会，我在楼下坐了两个小时。”"], ["nar", "她拿起豆浆插上吸管，没喝，指腹捏着杯壁。"], ["say", "“这次我不等了。你要来，就自己走到我面前。”"], ["nar", "她把没喝的豆浆丢进垃圾桶，杯盖弹开，浆液溅在桶沿上。"]], "choices": ["说这次我送", "说自己想清楚", "（不接话）"], "n": 15, "fx": [0, 0, 0]}, {"lines": [["nar", "出发大厅自助值机前排着队。她站在队尾，脚边一个二十寸的灰色登机箱，箱面有一道旧划痕。"], ["say", "“就这些。”"], ["nar", "登机牌捏在手里，对折，塞进大衣内袋，又隔着布料按了按。"], ["say", "“书捐了，锅送人了。这次我自己走，不用送。”"], ["nar", "头顶广播报着一趟延误的航班号，她抬头看屏幕，又低下，把拉杆往下压了一格。"]], "choices": ["帮她提", "站在原处", "（问她带够衣服没）"], "n": 16, "fx": [1, 0, 1]}, {"lines": [["nar", "安检口黄线外，她把箱子放上传送带，外套脱下来叠好，搁进塑料筐。"], ["nar", "过安检门的时候门没响。她走出去两步，回头。"], ["nar", "她抬了抬手，掌心停在肩高，像在人群里打招呼，又像没打完。"], ["nar", "传送带把箱子送出来，她转身去拿，拉杆一按，咔地弹起。"], ["say", "“走了。”"]], "choices": ["挥手", "走过去", "（站着不动）"], "n": 17, "fx": [0, 0, 0]}]}], "endings": {"A": {"title": "撕成两半", "text": "她把登机牌撕成两半，一半塞给你，说退不了了，你看着办。玻璃外的飞机正在滑行，尾灯亮了一下。她笑了一下，转身往出口走，走了几步又停下来，把手里的箱子换到另一只手。"}, "B": {"title": "念完航班号", "text": "她还是走了，箱子过安检的时候没回头。你在原地站到广播念完她的航班号，才把手里那半张登机牌折起来。纸很硬，折了两道才服帖。"}, "C": {"title": "算清了", "text": "她走前把当年那张电影票根放在你手里，票根已经褪色，日期还看得清。她说这次算清了，说完把箱子拉杆按下去，声音很脆。"}, "D": {"title": "从不提这座城", "text": "后来听说她在那边做得很好。同学群里她偶尔冒泡，发工作照，配文很短，从不提这座城市。有一年同学会她没来，群里有人问，没人答。"}}, "vigs": [{"title": "票根", "need": 6, "lines": ["那张电影票根她留了很多年，字都淡了。", "夹在一本旧书里，书是当年你送的。", "有人问她为什么还留着。", "她说：留着算账用。"]}, {"title": "烟", "need": 12, "lines": ["她其实早戒了。", "那天在路口点了一支，只烧了一半就掐了。", "烟盒塞回包里，包侧袋还有半盒陌生的烟。", "「别人的。」她说，「我帮忙拿着。」"]}, {"title": "两小时", "need": 18, "lines": ["那天下雨，她在你楼下站了两个小时。", "手机调到静音，来电显示亮了七次。", "后来她把那七次都删了。", "只留了一条没发出去的草稿：我到了。"]}], "route": "exgf", "arch": "直球女配 / 前女友", "context": {"world": "小城的同学会馆、路口的便利店、机场的落地窗。常年下雨，玻璃上都是水痕。", "premise": "同学会快散场了，苏梨才推门进来。她迟到了整晚，风衣还没脱，举杯和大家打过招呼，目光最后落到角落里的你。\n「好久不见，你还是坐角落。」\n这是你们分手五年后的第一次见面。", "relation": "你们大学时在同一座城市，曾交往两年。五年前、毕业之前，是她提出了分手。分开后，你们再没有见过。", "player": "你是苏梨的高中同学。今晚，你来参加多年未聚的同学会。", "known": ["当年分手时，她只解释了半句：「我不想等。」", "那半句话后面的原因，她没有说清，你也没有追问。"], "unknown": "她当年为什么不愿再等、这些年过得怎样，都还没有向你交代。你知道分手这件事，但不知道她没说完的理由。", "opening": "包厢门被推开，走廊的冷气卷进来。苏梨站在门口，风衣还没脱，手里的酒瓶沾着水汽。\n她绕着桌子打过招呼，目光停在你这边。\n「好久不见，你还是坐角落。」", "goal": "面对分手五年后的第一次重逢，决定先寒暄，还是问清当年没说完的话。分手是你知道的事实，原因需要她解释。"}, "desc": "性格直，不愿示弱，也不喜欢被人安排；能当面说清自己的事，不想谈时也会回避。她有自己的工作和生活。"};

let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;   /* warm = 累计显式效果分（来自数据里的 fx.aff），不再用关键词猜 */
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach((choice, idx)=>{
    const t = (typeof choice === 'string') ? choice : (choice && choice.t) || '';
    const aff = (typeof choice === 'object' && choice && choice.fx && Number.isFinite(Number(choice.fx.aff)))
      ? Number(choice.fx.aff)
      : Number((s.fx && s.fx[idx]) || 0);
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      warm += aff;                    /* 分数只来自数据里的 fx，改文案不影响判定 */
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=Math.max(0, Math.min(1, warm/Math.max(1,total)));
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
let started=false;
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; if(!started){started=true;render();} };
$('#contextAgain').onclick=()=>{ $('#intro').style.display='block'; $('#stage').style.display='none'; $('#go').textContent=started?'回到当前剧情':'开始'; window.scrollTo({top:0,behavior:'smooth'}); };
</script></body></html>
