<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>萧珩 · 逐字版</title>
<style>
:root{--bg:#0f0c0b;--ink:#ece6de;--dim:#a49b90;--faint:#6f6862;--line:rgba(255,255,255,.09);
--accent:#c9a06a;--acc-ink:#1a140e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 70% at 50% 0,#1a1512,#0f0c0b 62%);color:var(--ink);
 font:17px/1.9 "Songti SC","Noto Serif SC",serif;min-height:100dvh}
.wrap{max-width:680px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px 60px}
h1{font-size:22px;font-weight:500;margin:0 0 4px;letter-spacing:.04em}
.meta{color:var(--faint);font-size:12.5px;letter-spacing:.12em}
.sec{color:var(--accent);font-size:11.5px;letter-spacing:.18em;margin:20px 0 6px}
p.world{color:var(--dim);font-size:14px;margin:0}
.btn{display:inline-block;margin-top:18px;background:var(--accent);color:var(--acc-ink);border:0;
 border-radius:12px;padding:11px 20px;font-size:15px;font-family:inherit}
#stage{display:none}
.chap{color:var(--faint);font-size:12px;letter-spacing:.16em;text-align:center;margin:26px 0 14px}
.nar{margin:0 0 14px;line-height:2;font-size:16.5px}
.her{background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:2px solid var(--accent);
 border-radius:14px;padding:11px 15px;margin:0 0 14px}
.choices{display:grid;gap:9px;margin:18px 0 0}
.choices button{text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);
 border-radius:12px;padding:12px 14px;font-size:14.5px;font-family:inherit}
.choices button:hover{border-color:rgba(201,160,106,.5)}
.endcard{margin:22px 0;padding:16px 18px;border-radius:16px;border:1px solid rgba(201,160,106,.32);
 background:linear-gradient(180deg,rgba(201,160,106,.1),transparent)}
.eth{color:var(--accent);font-size:12.5px;letter-spacing:.12em;margin-bottom:8px}
.vig{margin-top:20px;border-top:1px dashed var(--line);padding-top:14px}
.vig h3{font-size:14px;font-weight:500;margin:0 0 8px;color:#c8a37a}
.vig p{margin:0 0 8px;color:var(--dim);font-size:14px}
.small{color:var(--faint);font-size:12.5px;margin-top:10px}
</style></head><body><div class="wrap">
<div id="intro">
  <h1 id="nm"></h1><div class="meta" id="mt"></div>
  <div class="sec" id="secWorld">故事背景</div><p class="world" id="world"></p>
  <div class="sec" id="secProfile">人物</div><div id="profile"></div>
  <div class="sec" id="secPremise">前情提要</div><p class="world" id="premise"></p>
  <button class="btn" id="go">开始</button>
  <div class="small">这一版是写死的正文：不联网、不需要模型，每句都对过。</div>
</div>
<div id="stage"><div id="log"></div><div class="choices" id="ch"></div></div>
</div>
<script>
const D={"name": "萧珩", "meta": "二十岁 · 邻国质子", "premise": "他被押在驿馆三年，脚上有链。你奉命送饭，第一次进门时，他说：先尝一口。", "world": "驿馆西厢，窗纸补过三处。院里一棵老槐树，落叶没人扫，积到门槛。", "chapters": [{"title": "第一章 铁链", "scenes": [{"lines": [["nar", "驿馆西厢的门轴卡着，推开时响了一声。食盒提在手里，盖缝里冒白气，凝在铜扣上。他坐在墙根，脚踝上一只铁环，环上连着链，链尾钉进地砖。"], ["nar", "我把碗摆上矮几：粟饭、腌菜、一碗热汤，木箸横在碗沿。他没抬头，只把矮几往墙里挪了半寸。"], ["say", "“先尝一口。”"], ["nar", "碗被推回我面前，停在桌沿，汤面晃了一圈，没洒。他的手收回去，搭在膝上。"], ["nar", "我拿起箸，夹了一口饭咽下，又舀了半匙汤。他这才把碗拉回去，先喝汤。"]], "choices": ["当着他的面吃一口", "说没毒", "（把碗放下）"], "n": 1}, {"lines": [["nar", "第二日我照旧去，门还没开，链子在里头拖了一下。"], ["say", "“昨日是辰时三刻。”"], ["nar", "他说这话时没看我，手指在矮几上敲了两下，像在数什么。碗摆好，他没动箸。"], ["say", "“明日你还会早一刻。”"], ["nar", "第三日我还是那个时辰去。他等碗摆稳，才把箸拿起来，先说了一句“没早”，然后低头吃饭。"]], "choices": ["问他记这个干嘛", "说不会提前", "（改天换时辰来）"], "n": 2}, {"lines": [["nar", "汤喝到一半，他忽然说起北边的粮价，说今年雪早，道上要封。"], ["say", "“十一月的粮，入不了仓。”"], ["say", "“这个我不能听。”"], ["nar", "他把碗底的米粒拨到一处，用箸尖压平，压成一小块。"], ["say", "“你听不听，它都一样。我不说给谁听，我说给墙听。”"]], "choices": ["顺着说下去", "说这个不能讲", "（笑而不答）"], "n": 3}, {"lines": [["nar", "夜里巡到西廊，窗纸透着一点昏黄。链子在地上拖，一下，又一下，不是走动，是来回磨。"], ["nar", "门没闩。他跪坐在砖地上，指腹沾了灰，砖缝里划出几条线，横的是河，歪的是山。"], ["say", "“送饭的，你踩着了。”"], ["nar", "他抬起手，掌心压在灰上，把那条线抹掉一半。"], ["nar", "我退回门槛外，把门带上一半，背靠门框站着。链子又响了一声，这回是往回拖。"]], "choices": ["装没看见", "问他画什么", "（替他挡住门口）"], "n": 4}, {"lines": [["nar", "他把空碗摞好，碗底朝上，摆得齐整，箸搁在碗沿正中。"], ["say", "“你比上一个客气。”"], ["say", "“上一个呢？”"], ["nar", "他抬手指了指脚踝上的铁环，环内侧磨得发亮，磨出一道浅槽。"], ["say", "“他说，毒死一个质子，比养着省事。”"]], "choices": ["问上一个呢", "说客不客气没用", "（不接话）"], "n": 5}, {"lines": [["nar", "食盒扣上，铜扣咔了一声。他忽然开口。"], ["say", "“你叫什么？”"], ["nar", "我报了名字。他跟着重复了一遍，声音很轻，像在称分量。"], ["say", "“记住了。”"], ["nar", "链子拖了一下，他挪回墙根去了，背对着门。"]], "choices": ["说全名", "说姓就行", "（反问他记得住吗）"], "n": 6}]}, {"title": "第二章 把温柔当陷阱", "scenes": [{"lines": [["nar", "药碗搁在桌上，白气绕了一圈就散。他低头闻了闻，又凑近闻一下。"], ["say", "“这回是什么？”"], ["nar", "我没应声。他抬眼看我，把碗端起来，抿了一小口，含在嘴里停了停才咽。"], ["nar", "空碗放回原处，碗底磕出一声轻响。他用袖口擦了擦嘴角。"]], "choices": ["说怕什么", "等他喝完", "（自己也喝一口）"], "n": 7}, {"lines": [["say", "“从前有人笑着给我递过一碗东西。”"], ["nar", "他的手指在碗口转了一圈，指甲刮过釉面，发出细响。"], ["say", "“后来呢？”"], ["nar", "他抬眼看我，笑了一下，把空碗推到我这边，没有再说话。"]], "choices": ["问后来呢", "说我不是他", "（把药收走）"], "n": 8}, {"lines": [["nar", "他进门时左肩比右肩塌，衣领扯开一道口子，线头翻在外面。"], ["nar", "我走过去，伸手把领子拢合。指腹碰到他脖颈，筋跳了一下。他站着没动，下巴微抬。"], ["say", "“上头问话，从上往下问。”"], ["nar", "我收回手，指尖沾了一点灰。他把领子重新扯平，拇指压了压那道口子。"]], "choices": ["问发生了什么", "帮他理衣领", "（什么也不问）"], "n": 9}, {"lines": [["say", "“欠你一件事。我记着。”"], ["nar", "他说这话时没看我，目光落在脚踝的链子上，链环磨得发白。"], ["say", "“不用记。”"], ["nar", "他摇了摇头，弯腰把裤脚拉下来，盖住链子。"]], "choices": ["说不用记", "问他要怎么还", "（说那你好好活着）"], "n": 10}, {"lines": [["nar", "炭盆里的灰塌下去一块，火苗缩了缩。他盯着炭看了一会儿，开口讲起家里的河。"], ["say", "“河冻实了能走人。我娘在岸边摆摊，热汤碗沿搁一圈铜钱，防人烫手。”"], ["nar", "他讲得慢，手在膝上比了个碗口大的圆。炭火噼啪响了一声，他接着说，说河开冻时冰块挤着往下游走。"], ["nar", "我把炭拨旺，火苗蹿上来，映在他脸上。他还在讲。"]], "choices": ["听下去", "问他回得去吗", "（把炭火拨旺）"], "n": 11}, {"lines": [["say", "“你这名字，念起来像一句诗。”"], ["nar", "他念了一句，声音压得低，尾音在墙角散开。"], ["say", "“什么诗？”"], ["nar", "他摇了摇头，又念了下一句。这次我听清了，是他家乡的调子，每个字都咬得短，尾音落进砖缝里。"]], "choices": ["问是什么诗", "说你念错了", "（沉默）"], "n": 12}]}, {"title": "第三章 学会把人当人", "scenes": [{"lines": [["nar", "驿馆前院停了一辆黑漆马车，车辕上的铜环擦得发亮。两个穿青袍的人站在廊下，靴底没沾泥。"], ["say", "“萧公子，国书在此。明日卯时启程。”"], ["nar", "萧珩坐在窗边的矮凳上，脚链从凳腿后绕出一截。他没有起身，只把碗端起来，碗底在桌面上留下一圈湿印。"], ["nar", "你把食盒搁在桌角，看着那两个青袍人退出去，门轴响了一声。"], ["say", "“你高兴吗？”"], ["nar", "他把碗放回原处，正压着那圈湿印。窗纸破了个洞，风把洞边吹得一掀一掀。"], ["say", "“三年了，头一回有人问我这个。”"]], "choices": ["恭喜他", "问他高兴吗", "（帮他收拾）"], "n": 13}, {"lines": [["nar", "午后，他从床底拖出一只木匣，把里面东西倒在桌上：一把钥匙，缺齿的梳子，半块墨，一小卷皮绳。"], ["say", "“钥匙。”"], ["nar", "你解下腰间的钥匙串递过去。铜钥匙在他掌心里翻了个面，齿口磨出一道白亮的痕。"], ["nar", "锁响了一声。他把链子从脚踝上取下来，两节铁环并排摊在桌面上，摆得笔直。链子内侧有一小段磨得发亮，位置正好在骨头凸起的地方。"], ["nar", "你伸手把链子拿起来，比看着沉。铁是凉的，那一小段是温的。"], ["say", "“这个不用带。”"]], "choices": ["问要带走吗", "说这个不用带", "（拿起来看了看）"], "n": 14}, {"lines": [["nar", "晚饭的食盒他没有先动，等你在对面坐下来，才掀开盖子。里面是两个饼、一碗汤，汤面上结了一层薄皮。"], ["say", "“跟我走吗？”"], ["nar", "你手上正把饼掰成两半，掰到一半停住。饼屑掉了几粒在桌面上。"], ["say", "“去了算什么？”"], ["nar", "他低头喝汤，喝了三口才把碗放下，碗里剩的汤晃了两下。"], ["say", "“算个人。”"], ["nar", "他把碗往前推，推到桌子中间，正好搁在你和他之间。汤已经不冒热气了。"]], "choices": ["问去了算什么", "说走不了", "（看着他）"], "n": 15}, {"lines": [["nar", "出发前一夜，驿馆的火盆烧到后半夜就弱了。他从枕下抽出那把刀——不长，刀鞘上有一道裂。"], ["say", "“这刀在你们库里记着数的吧。”"], ["nar", "他蘸了水，把刀身从根到尖擦了一遍，刃上的旧痕一道道显出来。擦完，他把刀插回鞘里，放回桌上，刀鞘的裂口朝里去。"], ["say", "“为什么放下？”"], ["nar", "他用布把指尖上的水擦干，布叠了两折。"], ["say", "“过关卡要搜。带着它，他们就有话说。”"]], "choices": ["问他为什么放下", "说这才对", "（没说话）"], "n": 16}, {"lines": [["nar", "寅时末，天还没亮透，城门内的石板结了一层白霜。马车停在门洞底下，车轮上缠了新绳。"], ["nar", "他换了身干净衣服，脚上没链子，走路的步子有些飘，落下去不太准。"], ["say", "“就到这儿吧。”"], ["nar", "城门轴的响声从头顶滚下来。他上车前回过头，看了一眼你脚边的地上——那里什么也没有。"], ["nar", "你往前迈了一步，靴底踩碎一片薄霜。"], ["say", "“路上有人问起，就说这三年送饭的是个不说话的。”"], ["say", "“那我记着。”"]], "choices": ["挥手", "站着不动", "（往前走一步）"], "n": 17}]}], "endings": {"A": {"title": "刀口朝内", "text": "他把那把不该带的刀留在驿馆，刀口朝内，压在桌上的旧信下面。出城门时他没回头，只把手抬了一下，像在挡风。你站在阶上看着那只手，一直看到看不见。"}, "B": {"title": "空木匣", "text": "他回国三年，第四年派人送来一只空的木匣。匣子里什么也没有，匣底刻着你的名字，刻得很深，像是怕磨掉。送匣的人说他一切安好，别的没让多讲。"}, "C": {"title": "尝过", "text": "城门关上那天下了雪。驿馆桌上留着他的链子，链子下面压着一张纸，只写了两个字：尝过。字被炭火烤过一点，边角发脆。窗纸补的第三处又破了。"}, "D": {"title": "没人擦的刀", "text": "他走后驿馆换了人看守。那把刀一直挂在墙上，没人动，刀鞘上落了灰，谁也不擦。新来的人问那把刀是谁的，老差役说不记得了。"}}, "vigs": [{"title": "链子", "need": 6, "lines": ["链子是铁的，磨得发亮，脚踝那圈有旧痕。", "他从不要求换新的。", "「换了不还是铁的。」他说。", "说完把裤脚放下来，遮住了。"]}, {"title": "碗", "need": 12, "lines": ["他吃饭前一定等人先尝。", "有一回没人尝，他就一整天没动那碗。", "后来你把碗端起来自己吃了一口。", "他看着你吃完，才动筷子。"]}, {"title": "地图", "need": 18, "lines": ["夜里他用炭在地上画地图，画完就擦。", "有一次没擦干净，留下半条河。", "第二天他说是水洒了。", "那半条河一直留到开春才被脚步蹭掉。"]}], "route": "hostage", "arch": "被折辱的质子"};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
if(D.world){ $('#world').textContent=D.world; } else { $('#secWorld').style.display='none'; $('#world').style.display='none'; }
if(D.profile && D.profile.length){ $('#profile').innerHTML = D.profile.map(([k,v])=>'<p class="world"><b style="color:#c8a37a;font-weight:400">'+k+'</b>　'+v+'</p>').join(''); }
else { $('#secProfile').style.display='none'; $('#profile').style.display='none'; }
if(D.premise){ $('#premise').textContent=D.premise; } else { $('#secPremise').style.display='none'; $('#premise').style.display='none'; }
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      if(/陪|等|不|别走|谢|留|帮|说|问|看|递|握/.test(t)) warm++;
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=warm/Math.max(1,total);
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; render(); };
</script></body></html>
