<script>
const D={"name": "宋屿", "meta": "28 · 广告公司创意", "premise": "聚会上，宋屿记得谁不吃辣、谁只喝无糖饮料，自己的那杯却始终没喝完。散场后他提出送你到地铁口。离开热闹的包厢，雨里的这段路，他反而没剩多少话。", "world": "广告公司十二层，会议室玻璃上贴满了废掉的提案。茶水间的马克杯按颜色排，他记得每个人用哪个。", "chapters": [{"title": "第一章 谁都说你好", "scenes": [{"lines": [["nar", "包厢里转盘停在一盘凉透的糖醋排骨上，宋屿把每个人的杯子往面前推，啤酒、豆奶、热水，各归各位。"], ["say", "“林姐不喝冰的，小周那杯换过无糖的，你的是酸梅汤。”"], ["nar", "他面前那杯啤酒只下去一层，杯壁的水珠沿着桌布洇出深色圆点。"], ["say", "“你记这些倒清楚。”"], ["nar", "他笑了一下，拿筷子把最后一块排骨夹到旁边空碟里，没接话。"]], "choices": ["问他怎么记得住", "（给他换一杯热水）", "看着他喝"], "n": 1}, {"lines": [["nar", "饭店门口的台阶下，他把外套搭在手臂上，手机电筒照着人行道上一小片翘起的砖。"], ["say", "“地铁口就前面，不用绕。”"], ["nar", "路灯隔一盏亮一盏，他走在你外侧，步子放慢，鞋底蹭过落叶。"], ["say", "“你累不累？今天一直站着。”"], ["nar", "他偏头看你，嘴角提了一下，又转回去看路。"], ["say", "“还好。你走你的。”"]], "choices": ["说不用送", "问他累不累", "（并肩走快一点）"], "n": 2}, {"lines": [["nar", "地铁口的灯箱广告亮得发白，他停下来，手插在外套口袋里。"], ["say", "“你为什么总在笑？”"], ["nar", "他嘴角的弧度停了一秒，喉结动了一下，视线落到你身后的闸机。"], ["say", "“有吗。”"], ["nar", "他从口袋里摸出手机，屏幕亮起又暗下去，没打开任何东西。"]], "choices": ["不等答案", "说这不是回答", "转移话题"], "n": 3}, {"lines": [["nar", "第二天上午，那份打印好的报价单还压在键盘下面，页脚卷起来。"], ["nar", "对话框弹出一张表情包：戴眼镜的猫举着‘收到’的牌子，后面跟一句‘昨晚忘了，现在补’。"], ["say", "“我记得。”"], ["nar", "他隔了很久回了一个‘好’，又发来一个相同的猫。"]], "choices": ["说没关系", "回他一句：我记得", "（不回）"], "n": 4}, {"lines": [["nar", "晚上十点，写字楼大堂的灯灭了一半，宋屿靠在门口的立柱旁，手里两杯奶茶，杯壁的水珠滴在鞋边。"], ["say", "“顺路。凉了就别喝。”"], ["nar", "他把其中一杯递过来，吸管已经插好，标签上写着三分糖。"], ["nar", "你接过来，杯身还是温的，珍珠沉在底下。"], ["say", "“凉了。”"]], "choices": ["说凉了", "问他为什么等", "（接过来喝完）"], "n": 5}, {"lines": [["nar", "公司楼下的便利店灯牌把地面照成一块青白色，他站在那道光边上，手里捏着空奶茶杯。"], ["say", "“你这个人，好得不像真的。”"], ["nar", "他笑得更用力了，眼尾挤出细纹，手指把杯沿捏出一道折痕。"], ["say", "“谁都说你好。”"], ["nar", "他把空杯丢进垃圾桶，杯底碰到桶壁，发出一声闷响。"]], "choices": ["盯着他看", "说算了", "问他敢不敢不笑"], "n": 6}]}, {"title": "第二章 别看我", "scenes": [{"lines": [["nar", "投影仪的散热风扇还在响，白板上“Slogan”那行被红笔划了两道，笔帽滚到桌角，停在一次性纸杯旁边。"], ["say", "“这版先放着。”"], ["nar", "他拿起杯子，手背在裤缝上蹭了一下。玻璃门合上时弹回来半寸，没有关严。走廊的感应灯亮起来，又暗掉一段，再亮。"], ["say", "“你们先吵，我接杯水。”"], ["nar", "门缝里看得见他站在饮水机前，水满了溢出来一点，他才把开关按回去。他用袖口擦了擦杯壁，没有往回走，转身往消防通道那边去了。"]], "choices": ["跟出去", "留在原位", "发消息问他"], "n": 7}, {"lines": [["nar", "消防门推开时，橡胶条发出一声闷响。楼梯间没有窗，绿色安全出口灯照在他鞋尖上。他坐在第三级台阶，背靠着墙，搪瓷杯放在膝头，水面上浮着一层薄薄的热气。"], ["say", "“你也出来了。”"], ["nar", "他把杯子往旁边挪了半块砖的位置，杯底和水泥地磨出一声长响。"], ["nar", "手机在他裤兜里亮了一下，隔着布料透出方形的光。他没有掏。"]], "choices": ["在他旁边坐下", "问他怕什么", "（递一瓶水）"], "n": 8}, {"lines": [["nar", "楼上有人摁电梯，钢缆在管道里滑了一截，声音从头顶落下来。"], ["say", "“刚才那个提案，我其实挺怕的。”"], ["nar", "他说完抿了下嘴，指节在杯沿上敲了两下，节奏像在试音。"], ["say", "“——怕它不够烂，配不上今天这场架。”"], ["nar", "他笑了一声，笑声在楼梯井里撞回来，散得很快。他把杯子里的水一口喝掉，站起来拍裤子，膝盖那块湿了一小片。"]], "choices": ["不接玩笑", "说再说一遍", "（不说话）"], "n": 9}, {"lines": [["nar", "周一到周三，他的显示器黑着，键帽上落了薄薄一层灰，键盘托里塞着一张没拆的快递单。"], ["nar", "工作群里@他的消息后面跟着三个句号。你的对话框里，他回了一个“收到”的表情，一只黄色手掌举起来，没有别的。"], ["say", "“我在。”消息发出去之后，他把手机翻过来看了一眼，又扣回桌上。"], ["nar", "第三天下午，他桌角多了一杯没盖盖子的美式，冰块化完了，杯壁的水痕淌到桌面上，洇湿了那张快递单的一角。"]], "choices": ["不追", "直接去他家楼下", "发一句：我在"], "n": 10}, {"lines": [["nar", "周四早上他来了，头发短了一截，外套换了新的，袖口的标签还没剪。他把打印好的方案摞成一摞，抱着去了碎纸机。"], ["say", "“这版不行。全部重做。”"], ["nar", "碎纸机吃了半个钟头，纸屑在透明窗里堆成雪。他回到工位，把白板擦干净，重新写，字比之前小，横平竖直。"], ["nar", "写到第三行他停下来，把马克笔帽扣上，又拔开，笔尖悬在“客户”两个字上方，没有落下去。"]], "choices": ["问为什么", "帮他改", "说别再讨好了"], "n": 11}, {"lines": [["nar", "会议室的灯灭了一半，只剩靠窗那一排。他坐在长桌尽头，面前摊着一张空白A4，笔横在上面。百叶窗没有拉严，路灯的光一道一道切在他手背上。"], ["nar", "他把椅子往后挪，轮子压过地毯上的一条胶带，粘了一下才过去。"], ["say", "“你别站门口了。”"], ["nar", "他没有抬头，把那张A4对折，再对折，压进杯垫底下。"]], "choices": ["留下陪他", "关灯走开", "问他是不是又怕了"], "n": 12}]}, {"title": "第三章 好人不等于谁都可以", "scenes": [{"lines": [["nar", "楼道的声控灯亮了一下又灭。他站在门口，两个塑料袋勒在手腕上，袋口往下滴水，在脚垫上洇出两个深色圆点。"], ["say", "“楼下便利店还开着。”他把袋子往上提了提，“鸡蛋只剩最后一盒。”"], ["nar", "玻璃瓶在袋子里碰了一声。他的鞋尖对着门垫边缘，没有往里迈。"], ["say", "“我放下就走。”"], ["nar", "你侧身让开，他才抬脚。鞋底在地砖上留下两行水印，一路到厨房。"]], "choices": ["让他进来", "问他怎么来的", "（接过袋子）"], "n": 13}, {"lines": [["nar", "他坐在沙发最边上，那盒鸡蛋搁在膝盖上，手指抠着纸盒的边角。窗外的雨砸在空调外机上，一阵一阵。"], ["say", "“我这几天一直在想一件事。”他停了停，“我好像只会让人觉得方便。谁开口，我都说行。”"], ["nar", "杯口的热气散到他下巴那儿。他没抬头，纸盒的角被他抠得起了毛。"], ["say", "“后来我想明白了，好人不等于谁都可以。”他声音压得低，“包括你。”"], ["nar", "雨声把最后两个字盖过去一点。他把鸡蛋放到茶几上，摆正，又重新摆了一次。"]], "choices": ["听完再说话", "打断他说我知道", "（握住他的手背）"], "n": 14}, {"lines": [["nar", "上午十点，打印机在响。小李抱着笔记本过来，站在他工位边上。"], ["say", "“宋屿，这个明早要，你帮我改一版呗，就调调字号，很快的。”"], ["nar", "他手上的鼠标停住，屏幕上的光标还在闪。他把椅子转过来，正面朝着那人。"], ["say", "“改不了。我这边排到周四，你要急就找组长调人。”"], ["nar", "小李抱着电脑站了两秒，走了。你在桌子底下用膝盖碰了碰他的腿，他没回头，耳朵尖红了一片。"]], "choices": ["事后说做得好", "装作没听见", "（在桌下碰他一下）"], "n": 15}, {"lines": [["nar", "便利店门口的两把塑料椅，一把腿短，晃。他把工牌摘下来放在桌面上，照片朝下。"], ["say", "“你以前说我脾气好。”他拧开瓶盖，又拧回去，“那不是脾气好。”"], ["nar", "塑料椅被他压得吱了一声。路灯下有水洼，一辆车过去，光在水面上碎了一下。"], ["say", "“是我怕。怕一说不，别人就都不理我了。”他抬了下眼，“现在这样，就是我。不好看，但省得猜。”"], ["nar", "他把工牌翻过来看了一眼，又扣回去，压在水瓶下面。"]], "choices": ["说挺好", "问他累不累", "（点头，不评价）"], "n": 16}, {"lines": [["nar", "会议室白板上还留着上一轮的箭头，红色马克笔，画到一半断了。客户那边三个人坐在长桌另一头，笔帽都没打开。"], ["say", "“这个方向不好卖。”他把激光笔搁在桌上，“另一个方案数据好看，落地会翻车。我建议还是走这个。”"], ["nar", "有人咳嗽了一声。空调出风口的声音忽然很清楚。他站着，没坐下，手扶在椅背上。"], ["nar", "桌面上安静了两秒。你把手举起来，胳膊肘压在会议记录本上。"], ["say", "“我投他。方案我跟着落地。”"]], "choices": ["说我投你", "问他怕不怕", "（直接举手）"], "n": 17}]}], "endings": {"A": {"title": "关灯以后", "text": "他去关会议室的灯，站在门口没走。灯灭了一半，另外一半还亮着，照着他的侧脸。他说其实我一直想让你留下来，就这一句，没有玩笑。窗外的雨停在一句话的缝里，谁也没补下一句。"}, "B": {"title": "两个空格", "text": "他开始学着拒绝，第一件事是把周末还给自己。你在他的日历上看到两个空白的方格，什么也没写。他说还没想好放什么，先空着，空着也行。"}, "C": {"title": "没人动的那杯", "text": "他还是对谁都好，只是看你的那一眼短了半秒。奶茶还是买两杯，一杯放在你桌上，放凉了也没人动。第二天早上杯子还在原处，杯盖没开。"}, "D": {"title": "他还是会笑", "text": "项目结束他调去别的组，走廊里碰见还是会笑。茶水间的马克杯他不再记谁用哪个，按颜色随便拿。有人问他要不要一起吃饭，他说都行。"}}, "vigs": [{"title": "马克杯", "need": 6, "lines": ["茶水间的杯子按颜色排，他知道每个人用哪个。", "新来的实习生随手拿了一个，他递过去另一只：「那个是别人的。」", "实习生问：那你的呢？", "他笑了一下，说我都行。"]}, {"title": "表情包", "need": 12, "lines": ["他道歉的方式是发一个表情包。", "连着三天，每天一个，配字都不一样。", "第四天没发了。", "第五天他出现在楼下，什么也没带。"]}, {"title": "楼梯间", "need": 18, "lines": ["楼梯间的应急灯是坏的，一直没人报修。", "他靠着墙，手机屏幕朝下扣在膝盖上。", "你问他在这儿待多久了。", "他说不久，说完看了一眼表，表停在三天前。"]}], "route": "hollow", "arch": "被爱泡大的空心人", "context": {"world": "广告公司十二层，会议室玻璃上贴满了废掉的提案。茶水间的马克杯按颜色排，他记得每个人用哪个。", "premise": "聚会上，宋屿记得谁不吃辣、谁只喝无糖饮料，自己的那杯却始终没喝完。散场后他提出送你到地铁口。离开热闹的包厢，雨里的这段路，他反而没剩多少话。", "player": "你是宋屿所在广告公司项目组的一员，今晚刚参加完组里的聚餐。你们有工作上的来往，也见过他在众人面前照顾每个人的样子。", "relation": "宋屿是与你共事的创意人员，还不是你已经确认交往的恋人。他的周到与送你回去的提议，都不能自动解释成双方已经说开的喜欢。", "known": ["你们在同一个项目组工作，彼此并非陌生人。", "宋屿在社交场合很会照顾人、很少当面拒绝；这些是你见过的行为，不是你已经知道的内心答案。"], "unknown": "他的笑容后面有什么顾虑、为什么关键时刻会沉默或消失，以及他真正想要什么，还需要由他亲口表达。", "opening": "聚餐散了，宋屿替最后一个人拎好落下的袋子，才转向你。\n「我送你到地铁口。」\n走到街上，他把刚才用过的笑容收了一点，低头避开一小滩积水。", "goal": "从这段散场后的路开始认识不在人群里的宋屿。你可以问近况、谈工作，也可以留一点安静。"}, "desc": "会讨好、怕冲突；被戳穿就消失；用玩笑挡问题。好得不像真的，是因为他不敢让人看见不好的那部分。"};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
['player','relation','unknown','goal'].forEach(key=>{$('#'+key).textContent=D.context[key]||'';});
$('#persona').textContent=D.desc||'';
(D.context.known||[]).forEach(text=>{const li=document.createElement('li');li.textContent=text;$('#known').appendChild(li);});
if(D.world){ $('#world').textContent=D.world; } else { $('#secWorld').style.display='none'; $('#world').style.display='none'; }
if(D.premise){ $('#premise').textContent=D.premise; } else { $('#secPremise').style.display='none'; $('#premise').style.display='none'; }
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      if(/陪|等|不|别走|谢|留|帮|说|问|看|递|握/.test(t)) warm++;
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=warm/Math.max(1,total);
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
let started=false;
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; if(!started){started=true;render();} };
$('#contextAgain').onclick=()=>{ $('#intro').style.display='block'; $('#stage').style.display='none'; $('#go').textContent=started?'回到当前剧情':'开始'; window.scrollTo({top:0,behavior:'smooth'}); };
</script></body></html>
