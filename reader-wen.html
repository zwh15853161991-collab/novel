const D={"name": "闻笛", "meta": "27 · 便利店夜班店员", "world": "凌晨的小城，便利店与电台仍亮着灯。楼下的二十四小时便利店里，一台收音机总在播放「城市零点」；街上渐渐安静，节目却像在对某一个人说话。", "profile": [["性格", "夜里能说，白天社恐。说话慢，句尾常带「算了」「你猜」。"], ["习惯", "上节目前数「三、二、一」；理货时把同一种糖摆得笔直；值夜班听自己的节目。"], ["喜欢", "凌晨的便利店、关东煮的萝卜、没人打扰的四十分钟。"], ["讨厌", "被追问为什么这么晚还不睡；被人说「这工作不三不四」。"], ["家里", "母亲催她回老家，说她做的工作「没出息」。"], ["不知道的事", "最后一期节目里那句「算了」，她其实录了三遍，前两遍说的是你的名字。"]], "premise": "店里只剩冰柜的嗡鸣与深夜节目。广播里的人正为没睡的人放歌，柜台后的姑娘把关东煮推过来，多放了一根萝卜。她胸前的工牌上写着：闻笛。", "chapters": [{"title": "第一章 零点之后", "scenes": [{"lines": [["nar", "凌晨一点，你先把收音机打开，再关上门。那个声音已经在里面了——她说「欢迎收听」，像在跟房间里的人打招呼。"], ["nar", "凌晨一点，楼下那家 24 小时便利店只剩一个店员，和一台一直在放深夜节目的收音机。"], ["nar", "节目里那个女人在说话，声音很慢，像在念给某一个人听。"], ["say", "「欢迎回到城市零点。今天的第一首歌，点给所有还没睡的人。」"], ["nar", "收银台后面的姑娘抬头看了一眼收音机，又低下头，把一盒关东煮推到你面前。"], ["say", "「送你一根萝卜。快打烊了，不吃也浪费。」"]], "choices": ["「这个节目你常听？」", "接过萝卜，说谢谢", "「你也睡不着？」"], "n": 1}, {"lines": [["nar", "她把收音机的音量调小了一格，动作很熟练，像每天都在做。"], ["say", "「值夜班的时候听。她说话不吵。」"], ["nar", "她说这话时没抬头，工牌上写着两个字：闻笛。"]], "choices": ["「你声音跟她有点像。」", "「她叫什么？」", "不再问，把萝卜吃完"], "n": 2}, {"lines": [["nar", "她终于抬头，看了你两秒。那两秒里，收音机正好播到一句「晚安」。"], ["say", "「……听多了会像吧。」"], ["nar", "她把找零压在收银台上，指腹在纸币边上按了一下，很快收回去。"], ["say", "「你天天这个点来吗。」"]], "choices": ["「以后会。」", "「看你什么时候值夜班。」", "把找零推回去，没说要来"], "n": 3}, {"lines": [["nar", "之后你几乎每天都来。她夜班，你就买一盒关东煮，坐到窗边那张高脚凳上。"], ["nar", "收音机成了你们之间唯一不停说话的东西。"], ["say", "「你今天又没睡。」"], ["say", "「别买了，萝卜天天送你，店长要骂我。」"]], "choices": ["「那我自己付。」", "「你陪我坐到下班，我就不买。」", "把耳机递给她一只"], "n": 4}, {"lines": [["nar", "那只耳机里正放着同一档节目，延迟半秒。她的声音在耳朵里，也在耳朵外。"], ["nar", "她怔了一下，笑出来，笑起来比节目里年轻很多。"], ["say", "「你这是作弊。」"]], "choices": ["「那你也作弊一次。」", "把耳机拿回来，什么也没说", "「节目里的你，比现在老气。」"], "n": 5}, {"lines": [["nar", "五点，天要亮了。她要交班，把收音机关掉，动作比开的时候慢。"], ["say", "「我走了。你路上小心。」"], ["nar", "她走到门口，忽然回头，像想起什么。"], ["say", "「……你叫什么名字来着。」"]], "choices": ["报上名字", "「你猜。」", "不回答，替她拉开门"], "n": 6}]}, {"title": "第二章 声音的形状", "scenes": [{"lines": [["nar", "那周的节目里，她说了一句话，说到一半笑场。"], ["say", "「今天没什么想说的。就是……最近便利店的萝卜涨价了。」"], ["nar", "你差点把嘴里的水喷出来。她坐在你对面的高脚凳上，一脸无辜。"], ["say", "「怎么 let flat=[];

let i=0, warm=0, log=null;
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      if(/陪|等|不|别走|谢|留|帮|说|问|看|递|握/.test(t)) warm++;
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=warm/Math.max(1,total);

  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';

  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';

}
let started=false;
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; if(!started){started=true;render();} };
$('#contextAgain').onclick=()=>{ $('#intro').style.display='block'; $('#stage').style.display='none'; $('#go').textContent=started?'回到当前剧情':'开始'; window.scrollTo({top:0,behavior:'smooth'}); };
</script></body></html>
