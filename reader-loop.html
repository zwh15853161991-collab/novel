<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>沈砚 · 逐字版</title>
<style>
:root{--bg:#0f0c0b;--ink:#ece6de;--dim:#a49b90;--faint:#6f6862;--line:rgba(255,255,255,.09);
--accent:#c9a06a;--acc-ink:#1a140e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 70% at 50% 0,#1a1512,#0f0c0b 62%);color:var(--ink);
 font:17px/1.9 "Songti SC","Noto Serif SC",serif;min-height:100dvh}
.wrap{max-width:680px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px 60px}
h1{font-size:22px;font-weight:500;margin:0 0 4px;letter-spacing:.04em}
.meta{color:var(--faint);font-size:12.5px;letter-spacing:.12em}
.sec{color:var(--accent);font-size:11.5px;letter-spacing:.18em;margin:20px 0 6px}
p.world{color:var(--dim);font-size:14px;margin:0}
.btn{display:inline-block;margin-top:18px;background:var(--accent);color:var(--acc-ink);border:0;
 border-radius:12px;padding:11px 20px;font-size:15px;font-family:inherit}
#stage{display:none}
.chap{color:var(--faint);font-size:12px;letter-spacing:.16em;text-align:center;margin:26px 0 14px}
.nar{margin:0 0 14px;line-height:2;font-size:16.5px}
.her{background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:2px solid var(--accent);
 border-radius:14px;padding:11px 15px;margin:0 0 14px}
.choices{display:grid;gap:9px;margin:18px 0 0}
.choices button{text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);
 border-radius:12px;padding:12px 14px;font-size:14.5px;font-family:inherit}
.choices button:hover{border-color:rgba(201,160,106,.5)}
.endcard{margin:22px 0;padding:16px 18px;border-radius:16px;border:1px solid rgba(201,160,106,.32);
 background:linear-gradient(180deg,rgba(201,160,106,.1),transparent)}
.eth{color:var(--accent);font-size:12.5px;letter-spacing:.12em;margin-bottom:8px}
.vig{margin-top:20px;border-top:1px dashed var(--line);padding-top:14px}
.vig h3{font-size:14px;font-weight:500;margin:0 0 8px;color:#c8a37a}
.vig p{margin:0 0 8px;color:var(--dim);font-size:14px}
.small{color:var(--faint);font-size:12.5px;margin-top:10px}
</style></head><body><div class="wrap">
<div id="intro">
  <h1 id="nm"></h1><div class="meta" id="mt"></div>
  <div class="sec">故事背景</div><p class="world" id="world"></p>
  <div class="sec">前情提要</div><p class="world" id="premise"></p>
  <button class="btn" id="go">开始</button>
  <div class="small">这一版是写死的正文：不联网、不需要模型，每句都对过。</div>
</div>
<div id="stage"><div id="log"></div><div class="choices" id="ch"></div></div>
</div>
<script>
const D={"name": "沈砚", "meta": "25 · 急诊科医生，记性太好，从不写备忘", "premise": "暴雨夜三点十七分，一个没有名字的男人死在她手上；她睁眼，又回到同一场雨。", "world": "南方小城的急诊科，暴雨夜。走廊的灯有一盏坏了，闪两下才亮；抢救室墙上的钟停在三点十七分，没人报修。", "chapters": [{"title": "第一章 这一轮我改了七次", "scenes": [{"lines": [["nar", "雨砸在急诊通道的铁皮顶上，声音盖过平车的轱辘。走廊那盏灯闪了两下才亮起来，把地面上的水照出一层薄白。"], ["nar", "推车上是个男人，三十岁上下，湿透的夹克，左脚没有鞋。护士一边捏气囊一边报：无意识，无家属，身上没有证件，没有手机。"], ["say", "“除颤仪推过来。肾上腺素一支备着，抽好。”"], ["nar", "她的手已经搭在平车侧栏上，掌心贴着金属，凉。墙上的钟停在三点十七分，秒针不动已经不知道多久了。"], ["nar", "按压到第三十下，男人的眼皮动了一下。上一轮，他是在第四十下才动的。"]], "choices": ["先上除颤，别问名字", "翻他口袋找证件", "看一眼钟，记住这刻"], "n": 1}, {"lines": [["nar", "护士小周的手刚抬到胸口，沈砚就知道她要说什么。连她吸气的那半秒都一样。"], ["say", "“先抽血，血气。别急着推药。”"], ["nar", "小周的手停在半空，看了她一眼，又低头去拿采血针。“……好。”"], ["nar", "沈砚把听诊器从脖子上取下来，绕在手里，转过身去整理器械车上的纱布。车面上有一小滩水，她用袖口擦掉。"], ["nar", "走廊的灯又闪了两下才亮。她跟着数：一，二。这回她连灯什么时候灭都清楚。"]], "choices": ["抢在护士前开口", "装作什么都没发生", "把话咽回去"], "n": 2}, {"lines": [["nar", "肾上腺素提前抽好了，放在推车最上层，针头朝外。上一轮她是让小周去拿的，小周跑回来用了二十六秒。"], ["say", "“三分钟一轮，报时。到点喊我。”"], ["nar", "她按着节拍压下去，一下，一下，肩膀不晃，手也不抖。数到一百二十，她抬眼看了看监护仪，再看了看表。"], ["nar", "平车右边空着一块地方，本该站着人的位置，只有一道被雨水带进来的鞋印，慢慢淡了。"], ["nar", "第四次除颤结束，屏幕上的线没有变直。比上一轮，早了十九秒。"]], "choices": ["按秒推进流程", "留三十秒给家属", "先看一眼他的脸"], "n": 3}, {"lines": [["nar", "护士站的电脑屏幕上还挂着上一台手术的记录。沈砚把光标移到床位栏。"], ["say", "“06床，先把床位留出来，别排给别人。”"], ["nar", "对面的老陈抬起头，眼镜滑到鼻尖上。“你还没看分诊单，怎么知道是06？”"], ["say", "“我记性好。”"], ["nar", "她低头继续写病历，笔尖压在纸上，把“沈”字的最后一笔拖得很长。老陈没有再问，只是翻开交班本，写下了什么。她看见那一行的头两个字，是她的名字。"]], "choices": ["笑着糊过去", "干脆说真话", "低头继续写病历"], "n": 4}, {"lines": [["nar", "06床的血压往下掉的时候，五床的监护仪也响了。两个声音叠在一起，谁先谁后，说不清。"], ["nar", "她站在两张床中间，脚下是一道没干的水痕。她数到四十。"], ["say", "“五床——去个人。”"], ["nar", "声音出来比她想的小。老人的胸廓在按压下起伏，第三次除颤才回来，比上一轮多停了一次。"], ["nar", "记录本上，五床的心跳停止时间，她比上一轮多写了四十秒。笔尖停在那个数字上，墨水洇开一小团。"]], "choices": ["立刻冲过去接手", "骗自己这轮不算", "躲进更衣室吐"], "n": 5}, {"lines": [["nar", "更衣室的瓷砖凉，膝盖贴上去，凉意顺着骨头往上走。水龙头没关紧，一滴，一滴，砸在不锈钢水槽里。"], ["nar", "她把手撑在膝盖上，头低下去，头发垂下来挡住脸。呼吸声很响，在这间小屋子里显得不像自己的。"], ["say", "“如果这轮只有一次。”"], ["nar", "她说完，等了一会儿，没有人回答。她抬手把水龙头拧紧，那滴水挂在口子上，晃了晃，没有落。"], ["nar", "她站起来，把袖口的水拧干，推门出去。走廊那盏灯闪了两下才亮。她没有数。"]], "choices": ["从此不留余地", "只救他一个人", "当没这回事"], "n": 6}]}, {"title": "第二章 他手背上的旧疤", "scenes": [{"lines": [["nar", "雨砸在急诊通道的铁皮雨棚上，顶灯闪了两下。她跪在推床边上，手套上一层水，膝盖压着湿透的纱布包装袋。"], ["nar", "他右手搭在床沿，虎口斜着一道旧疤，边缘发白，早已长好，把纹路断成两截。她把手电换到左手，光挪开一寸。"], ["say", "“伤口不深，缝四针。”"], ["nar", "她没报秒数。眼睛落在那道疤上，顺着它的走向看了一遍，又看一遍，像在核一张单子。"], ["say", "“你不看钟了。”"]], "choices": ["问这道疤哪来的", "什么也不问", "给他盖好被子"], "n": 7}, {"lines": [["nar", "剪刀卡进他湿透的袖口，布太韧，她手腕加了力。走廊尽头有平车推过，轮子压过门槛，闷响一声。"], ["say", "“你上一轮也是这么站的。”"], ["nar", "剪刀没停，从袖缝一路剪到肘弯，露出一截沾着雨水的胳膊。"], ["say", "“站哪儿？”"], ["say", "“左边。手电在右手。你剪袖子的时候会先咬一下下唇。”"], ["nar", "雨声压下来，把两个人的呼吸都盖住了。"]], "choices": ["承认，全都说", "装听不懂", "反问他记得多少"], "n": 8}, {"lines": [["say", "“上一轮，我先说什么？”她问，镊子尖悬在伤口上方。"], ["say", "“让开。”他说，“然后我被抬进来，膝盖先撞门框。”"], ["nar", "他笑了一下，颧骨上的擦伤被牵开，渗出一点红。"], ["say", "“第三轮，雨棚漏水，滴在你左肩，滴了七下。”"], ["nar", "她抬头。水痕正在雨棚的接缝那里聚成一颗，坠下来，落在她左肩的布上。"]], "choices": ["问他还想不想活", "问他怕不怕", "不问，先救"], "n": 9}, {"lines": [["nar", "他把头偏回枕上，喉结动了一下，眼睛看着天花板的一块水渍。"], ["say", "“每回都得再死一次。”"], ["nar", "声音轻得像在报体温，尾音被走廊的广播吃掉一半。"], ["say", "“第几次了？”"], ["say", "“记不清。所以我才记得你站左边。”"]], "choices": ["我来想办法", "你可以不记得", "那我们一起记"], "n": 10}, {"lines": [["nar", "她拿起持针器，针尖在灯下亮了一下，又搁回托盘，金属碰金属，很轻的一声。"], ["nar", "她重新对齐皮缘，一毫米一毫米地压，比规范慢了三倍，钳子在指间换了两次角度。"], ["say", "“你在拖时间。”"], ["say", "“我在缝好。”"], ["nar", "墙上的钟在走，秒针刮过刻度。她一次也没抬头。"]], "choices": ["停手，握住他", "再看一眼钟", "按流程走完"], "n": 11}]}, {"title": "第三章 雨停之前", "scenes": [{"lines": [["nar", "保温杯的盖子被拧开，热气在夜里散得很快。杯身上的漆掉了一块，露出下面银白的铝。她把表留在了值班室抽屉里，抽屉没锁。"], ["nar", "走廊尽头的挂钟走得很慢，秒针每到十二都顿一下。"], ["say", "“喝口热水。”"], ["nar", "男人没有接，手垂在担架边缘，指节发白。雨敲在铁皮雨棚上，一下，一下。"]], "choices": ["把水递给他", "自己喝一口", "放在窗台上"], "n": 12}, {"lines": [["nar", "雨声渐渐落到了窗外台阶下面。走廊顶灯闪了两下，把墙上的人影抖动了一下，然后又稳住。"], ["say", "“灯没坏。”"], ["nar", "窗缝里有一股风钻进来，把病历夹的纸角掀起来，又让它落下。她伸手，把窗往下一按，扣住了锁。"], ["nar", "他没有看窗，看的是她的袖口，那里沾了一小块干了的暗红。"]], "choices": ["去关那扇窗", "让他看雨", "拉住他的袖口"], "n": 13}, {"lines": [["nar", "她把手掌压在胸骨中段，数着，一、二、三。掌下的肋骨比她记忆里的更凉。"], ["say", "“这轮我赢不了。”"], ["nar", "按压没有停。她手背上凸起的腱，一下一下，随着节拍移动。"], ["say", "“换人。”"], ["nar", "她对着空走廊说出这两个字。没有人应，只有雨棚上的声音密了一层。"]], "choices": ["说完就哭", "笑着说完", "说完继续按"], "n": 14}, {"lines": [["nar", "秒针挪到十二，顿了一下。分针压在十七上。她没有伸手去拨。"], ["nar", "男人的瞳孔对着灯，反出一小点白。他的喉结没有动。"], ["say", "“你叫什么。”"], ["nar", "回答她的是雨，还有被压断的呼吸声。"]], "choices": ["闭上眼", "看他的眼睛", "数他的呼吸"], "n": 15}, {"lines": [["say", "“如果真只剩一次，你想干什么。”"], ["nar", "他问得很轻，像是替另一个人问的。她把球囊放回架子上，塑料回弹了一声。"], ["nar", "保温杯立在窗台，杯口上方的白气已经没了。玻璃外面，雨线开始变细。"], ["say", "“陪你坐着。”"], ["nar", "她把凳子挪到担架旁边，坐下去。凳子腿一短，晃了一下。"]], "choices": ["救你", "陪你坐着", "说我不知道"], "n": 16}]}], "endings": {"A": {"title": "雨停了", "text": "雨停得很突然。她把保温杯塞进他手里，杯壁还是烫的。他从抢救室门口的伞架上抽了一把断了骨的旧伞，撑开，骨头歪着，勉强挡住两个人。走到巷口她才发现自己一直没松手，掌心全是印子。他没说话，只是把伞往她那边偏了两寸。"}, "B": {"title": "三点十八分", "text": "她刚摸到他的手，墙上的钟跳到三点十八分。抢救室的门被人从外面推开，风灌进来，带着雨味。她低头看自己的手，空的。护士问她要不要休息，她说不用，转身去写记录，写到一半笔停住了——纸上那个名字，她一次也没写对过。"}, "C": {"title": "灯还亮着", "text": "抢救室的灯一直亮着。她站在原地，保温杯放在窗台上，凉透了也没人动。走廊那盏坏灯闪了两下，没灭。外面天快亮了，雨还在下，声音很轻，像有人在隔壁翻一页纸。她伸手把钟往回拨了一格，又停住，把手收了回来。"}, "D": {"title": "没打伞那天", "text": "他出院那天没打伞，走到门口还回头看了一眼，像在确认什么。她那晚值到天亮，把抢救室的器械一件一件擦干净，最后擦到那把断骨的旧伞，撑开看了看，收进了柜子最里面。谁也没留电话。雨下了整整一周。"}}, "vigs": [{"title": "换班表", "need": 6, "lines": ["换班表贴在护士站左边，用磁贴压着，纸角卷起来一块。", "她从来不抬头看。谁几点来、带没带早饭、先进哪间病房，她都知道。", "「你怎么记得住？」同事问她。", "「记性好。」她答，把笔帽按回去，声音没有起伏。"]}, {"title": "保温杯", "need": 12, "lines": ["那只旧保温杯放在值班室最上层，杯底有一圈洗不掉的茶渍。", "侧面贴过名字贴，撕了，只留下一小块胶印和半个字。", "「这谁的？」新来的实习生问。", "「我的。」她伸手拿回来，放进柜子，柜门关得很轻。"]}, {"title": "第三病床", "need": 18, "lines": ["三床的老人每次都在三点二十一分停一次心跳。", "她试过三次：提前给药、提前叫人、提前把除颤仪推到床边。", "第三次之后，老人照旧在那个时间停了一下。她站在床边没动，看着监护仪上的线重新走起来。", "那天她在记录上多写了一行字，又划掉了。"]}]};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
$('#world').textContent=D.world; $('#premise').textContent=D.premise;
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      if(/陪|等|不|别走|谢|留|帮|说|问|看|递|握/.test(t)) warm++;
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=warm/Math.max(1,total);
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; render(); };
</script></body></html>
