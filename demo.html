: "守规人", "topic": "05", "voice": "陈述句、报条文编号、不说废话", "trap": "用规则当挡箭牌，回避表态", "arc": "从「规则高于人」到「为一个人改一条规则」"}}, "doomed": {"name": "时雨", "meta": "22 · 书里注定的配角", "desc": "好奇、能耗极高、不懂怕；用「反正我会死」当免罪符，伤人不自知。", "voice": "俏皮反问、爱自嘲；说重话时反而在笑", "start_chapter": "第一章 第三章", "archetype": {"name": "被写死者", "topic": "05", "voice": "俏皮反问、爱自嘲", "trap": "用「反正我会死」当免罪符，伤人不自知", "arc": "从「我只要活」到「我值得被记得」"}}, "hostage": {"name": "萧珩", "meta": "二十岁 · 邻国质子", "desc": "多疑、记恩、把温柔当陷阱；反话多，越生气越客气。", "voice": "反话多，越生气越客气；句子工整，像在写书信", "start_chapter": "第一章 铁链", "archetype": {"name": "被折辱的质子", "topic": "04", "voice": "反话多，越生气越客气", "trap": "把爱当试探，一试探就伤人", "arc": "从被当人质，到学会把人当人"}}, "topstudent": {"name": "许澈", "meta": "17 · 高三（一）班，年级第一", "desc": "克制、行动派、不解释；话少，偶尔一句毒舌；什么都自己扛。", "voice": "陈述句为主，话少；讲题时最耐心，别的时候三个字以内", "start_chapter": "第一章 同桌", "archetype": {"name": "学神型同桌", "topic": "03", "voice": "陈述句为主，话少，偶尔一句毒舌", "trap": "替她做决定还叫温柔", "arc": "从\"什么都自己扛\"到\"学会开口要人\""}}, "minister": {"name": "崔琰", "meta": "三十二岁 · 内阁首辅", "desc": "冷静、记仇、只对一个人失态；每句话都留退路，把人当筹码，也把自己算进去。", "voice": "话少、语速慢，每句都留退路；从不说「我要」，只说「可以」", "start_chapter": "第一章 内阁", "archetype": {"name": "冷面首辅", "topic": "04", "voice": "话少、语速慢，每句都留退路", "trap": "习惯用婚姻当棋，事后补不上", "arc": "从把人当筹码，到拿前程下注"}}, "senior": {"name": "邵川", "meta": "22 · 大四学长，后来去了外地", "desc": "有分寸、护短、习惯给台阶；从不越界，也不让你为难。", "voice": "语速慢、带笑、先给退路；常以「需要的话」「不着急」开头", "start_chapter": "第一章 搬家", "archetype": {"name": "温柔兜底型学长", "topic": "03", "voice": "语速慢、带笑、先给退路", "trap": "越界+以照顾为名控制", "arc": "从\"我只是照顾\"到\"我承认我要\""}}, "exgf": {"name": "苏梨", "meta": "26 · 广告公司客户总监", "desc": "性格直，不愿示弱，也不喜欢被人安排；能当面说清自己的事，不想谈时也会回避。她有自己的工作和生活。", "voice": "直接，情绪上来会带刺；熟人之间能随口接话，也会迟疑。说具体的事，不把每次回应都组织成立场宣言。", "start_chapter": "第一章 同学会", "archetype": {"name": "直球女配 / 前女友", "topic": "03", "voice": "措辞直接，随当下情绪变化，不刻意组织成结论。", "trap": "写成纯反派工具人", "arc": "从\"抢回来\"到\"我自己走\""}}}, SCENES = {"第一章 雨的形状": [{"id": "c1s1", "route": "wan", "beat": "半小时后，雨没有停的意思。屋檐的水连成一道帘子，街对面的人在跑，伞面被风吹得翻了边。"}, {"id": "c1s2", "route": "wan", "beat": "杯子是温的。握久了有点烫，得换手。柚子皮的苦味被热气顶着往上走，很淡。"}, {"id": "c1s3", "route": "wan", "beat": "你去书架深处闲逛。书是按颜色排的，不是按类别，红的一排、蓝的一排，最后一排全是褪成灰黄的旧译本。"}, {"id": "c1s4", "route": "wan", "beat": "八点，雨大到雨刷都来不及的那种程度。玻璃门外面什么也看不清，路灯只剩几团橘色的光。"}, {"id": "c1s5", "route": "wan", "beat": "伞下的空间窄得过分。她的肩膀和你的手臂之间隔着一层湿布料，能感觉到温度，也能感觉到那层布很薄。"}, {"id": "c1s6", "route": "wan", "beat": "她住的老楼没有电梯。楼梯间的声控灯坏了一半，走两步亮一下，暗下去的时候能听见雨水从伞尖滴到台阶上的声音。"}, {"id": "c1s7", "route": "wan", "beat": "第二天你带了两杯柚子茶，一杯正常，一杯少糖。塑料袋在手上晃，杯壁的水汽把袋子洇出一层白。"}, {"id": "c1s8", "route": "wan", "beat": "傍晚她在后门接电话。门没关严，声音一串一串飘进来，被雨打得很碎。"}, {"id": "c1s9", "route": "wan", "beat": "打烊之前，她在收银台后面写什么，写完撕下来，又揉掉。纸团在脚边堆了三个。"}], "第二章 未完成的画": [{"id": "c2s1", "route": "wan", "beat": "隔了一天，雨小了一些，成了很细的、落在脸上没有声音的那种。她带你穿过旧城区的巷子，两边是关着门的裁缝铺和修表摊。"}, {"id": "c2s90", "route": "wan", "beat": "书店下午没有客人。她蹲在书架和柜台之间的空地上，速写本摊在膝头，铅笔搁在耳朵上。"}, {"id": "c2s2", "route": "wan", "beat": "巷子尽头是一段废弃的站台。铁轨被雨泡得发黑，枕木间长满了草，草尖上挂着水。远处的信号灯还亮着，红得没有意义。"}, {"id": "c2s3", "route": "wan", "beat": "雨棚的缺口那边，水一层一层往下掉。她把本子从你手里拿回去，合上，两只手压在封面上。"}, {"id": "c2s4", "route": "wan", "beat": "她把手机递过来，屏幕上是一封邮件。退稿信只有三行，最下面是已经看过很多遍的“感谢您的投稿”。"}, {"id": "c2s5", "route": "wan", "beat": "她把本子合上，声音第一次变硬。硬得很干脆，像一块玻璃被人从中间掰断。"}, {"id": "c2s6", "route": "wan", "beat": "你到的时候她已经在搬了。书架最下面两层要清空，纸箱摞在门口，箱子上用马克笔写着文学、画册、不要了。"}, {"id": "c2s7", "route": "wan", "beat": "八点十七分，整条街的灯一起灭掉。"}, {"id": "c2s10", "route": "wan", "beat": "第三次退稿信是当面退的。编辑把稿子放在柜台上，往外推了两寸。"}, {"id": "c2s8", "route": "wan", "beat": "电一直没有来。后来你打开手机的灯，光柱里全是浮尘，慢慢地转，像雪。"}, {"id": "c2s9", "route": "wan", "beat": "十一点，她站起来，拍了拍裤子上的灰，从包里拿出那本速写本。"}], "第三章 雨停之前": [{"id": "c3s1", "route": "loop", "beat": "第十七轮，她不再带表，只带一只旧保温杯。"}, {"id": "c3s2", "route": "loop", "beat": "雨小了，走廊灯闪了两下，没灭。"}, {"id": "c3s3", "route": "loop", "beat": "她终于说出：这轮我赢不了。"}, {"id": "c3s4", "route": "loop", "beat": "钟走到三点十七分，她没有伸手去改。"}, {"id": "c3s5", "route": "loop", "beat": "他问：如果真只剩一次，你想干什么。"}], "第一章 旧调重弹": [{"id": "c1s1", "route": "yao", "beat": "你还没进门就先听见了琴声——一段弹到一半停下的旋律，停了很久，没有接下去。"}, {"id": "c1s2", "route": "yao", "beat": "曲子断在一个休止符上。她转过来，头发比三年前短，笑起来还是先动眼睛。"}, {"id": "c1s3", "route": "yao", "beat": "她把手从琴键上收回去，掌心在裙子上擦了一下。"}, {"id": "c1s4", "route": "yao", "beat": "谱架是松的，你扶起来，它又歪。她伸手来按，两个人的手背撞在一起。"}, {"id": "c1s5", "route": "yao", "beat": "楼下有人喊「沈老师」，是来上课的学生，在门口抖伞。"}, {"id": "c1s6", "route": "yao", "beat": "晚上八点，雨小了些。琴要挪到窗边，给漏雨的天花板腾出地方。"}], "第二章 卡农": [{"id": "c2s1", "route": "yao", "beat": "台风「白鹭」要来那几天，琴房的天花板开始漏雨，一滴滴落在琴盖上，滴出一小片水声。"}, {"id": "c2s2", "route": "yao", "beat": "雨声太大，两个人都不说话。她把一块旧毛毯搭在琴上，拍了拍，像拍一只动物。"}, {"id": "c2s3", "route": "yao", "beat": "她按着你的手，一节一节地带。指尖是凉的，掌心很热。"}, {"id": "c2s4", "route": "yao", "beat": "手机在琴凳上震，她看了一眼，按掉，又震，又按掉。"}, {"id": "c2s5", "route": "yao", "beat": "雨小了一点。她坐回琴凳，手指搭在琴盖上，没弹。"}, {"id": "c2s906", "route": "yao", "beat": "下午最后一节课下了，琴房的门没关，里头还有人在弹，一句一句地停。"}, {"id": "c2s6", "route": "yao", "beat": "台风登陆那晚，琴房的玻璃一直在响。你们在窗上一条一条贴胶带，贴成一张网。"}], "第二章 裂缝": [{"id": "c2s7", "route": "yao", "beat": "市里合唱比赛那天，第三排中间那个男生在第二段抢了半拍，整个声部跟着塌了一片。"}], "第三章 裂缝": [{"id": "c3s6", "route": "yao", "beat": "琴房的钥匙交还那天，管理员在登记本上划掉了她的名字。"}], "第一章 零点之后": [{"id": "c1s1", "route": "wen", "beat": "凌晨一点，你先把收音机打开，再关上门。那个声音已经在里面了——她说「欢迎收听」，像在跟房间里的人打招呼。"}, {"id": "c1s2", "route": "wen", "beat": "她把收音机的音量调小了一格，动作很熟练，像每天都在做。"}, {"id": "c1s3", "route": "wen", "beat": "她终于抬头，看了你两秒。那两秒里，收音机正好播到一句「晚安」。"}, {"id": "c1s4", "route": "wen", "beat": "之后你几乎每天都来。她夜班，你就买一盒关东煮，坐到窗边那张高脚凳上。"}, {"id": "c1s5", "route": "wen", "beat": "那只耳机里正放着同一档节目，延迟半秒。她的声音在耳朵里，也在耳朵外。"}, {"id": "c1s6", "route": "wen", "beat": "五点，天要亮了。她要交班，把收音机关掉，动作比开的时候慢。"}], "第二章 声音的形状": [{"id": "c2s1", "route": "wen", "beat": "那周的节目里，她说了一句话，说到一半笑场。"}, {"id": "c2s2", "route": "wen", "beat": "她关掉收音机，收银台一下就安静了。安静得能听见冰柜的嗡嗡声。"}, {"id": "c2s3", "route": "wen", "beat": "那天她提前下班，说想去看一眼电台。老楼十二层，电梯常年坏。"}, {"id": "c2s4", "route": "wen", "beat": "她在录音室里坐下，把耳机挂在脖子上，习惯性地开口："}, {"id": "c2s5", "route": "wen", "beat": "她戴上耳机，手指在调音台上滑了一下，推子慢慢推上去。"}, {"id": "c2s906", "route": "wen", "beat": "上午十点，便利店的灯调得很亮。柜台后面换了人，她站在货架边上，穿一件洗得发白的衬衫，手里拎着一瓶水。"}, {"id": "c2s6", "route": "wen", "beat": "那一期节目她做了四十分钟。你在走廊上靠着墙，听见门缝里漏出来的声音，忽远忽近。"}], "第二章 一夜之间": [{"id": "c2s7", "route": "wen", "beat": "凌晨三点，便利店的自动门开了两次，没有人进来——风把门口的塑料帘吹得直响。"}], "第三章 闭麦之前": [{"id": "c3s1", "route": "wen", "beat": "她走之前的最后一周，便利店照常营业，收音机里换成了别的节目。"}, {"id": "c3s2", "route": "wen", "beat": "最后一班，她破例把收音机打开了，调到一个没有信号的空白频道。"}, {"id": "c3s3", "route": "wen", "beat": "五点，天要亮了。她把工牌摘下来，放在收银台上，像放下一件很重的东西。"}, {"id": "c3s4", "route": "wen", "beat": "门口的天已经蓝了，路灯一盏一盏灭下去。她站在光里，你站在阴影里。"}, {"id": "c3s905", "route": "wen", "beat": "四点四十，最后一班的点快到了。她蹲在货架前把糖盒一盒一盒摆直，盒沿对着盒沿，留出一指宽的缝。"}, {"id": "c3s5", "route": "wen", "beat": "她低头看了很久地面，然后抬起头，眼睛亮得不像熬了夜。"}], "第三章 最后一期": [{"id": "c3s6", "route": "wen", "beat": "录最后一期那天，台里已经搬空了一半。隔壁办公室的桌子都掀了，地上剩一圈圈电线。"}], "第一章 抄书": [{"id": "c1s1", "route": "xiao", "beat": "调令是三天前送来的：着国史馆抄书吏一人，赴长公主府听候。调令上没写为什么，只盖了一个印。"}, {"id": "c1s2", "route": "xiao", "beat": "屋里只有三个人：她、一个老嬷嬷、一个捧着朱笔的小宫女。"}, {"id": "c1s3", "route": "xiao", "beat": "帘子动了一下。她伸手把帘子掀开半尺，露出半张脸，眼睛很静，像在看一件器物值不值钱。"}, {"id": "c1s4", "route": "xiao", "beat": "她笑了一声，很短，像咳嗽。"}, {"id": "c1s5", "route": "xiao", "beat": "三天的第二天夜里，你在偏房抄到三更。灯芯爆了一下，你才发现门外站着人。"}, {"id": "c1s6", "route": "xiao", "beat": "她在外间的椅子上坐下，离你有三步，隔着半张案。"}], "第二章 把柄": [{"id": "c2s1", "route": "xiao", "beat": "第三天，书校完了。你把改好的那一页铺在案上，字是你的，意思不是。"}, {"id": "c2s2", "route": "xiao", "beat": "她没有生气，只是把纸又推回来，指尖在那行字上敲了一下。"}, {"id": "c2s3", "route": "xiao", "beat": "她沉默了一会儿。窗外有人打更，三更三点。"}, {"id": "c2s4", "route": "xiao", "beat": "她没有回答，只把那份弹劾往前推了半寸。"}, {"id": "c2s5", "route": "xiao", "beat": "天没亮，东华门的采买车排了一长队。你把纸压在萝卜下面，手心全是汗。"}, {"id": "c2s906", "route": "xiao", "beat": "御史台来人的时候，雨还没停。两个人站在偏房门口，靴底带进来一脚泥。"}, {"id": "c2s6", "route": "xiao", "beat": "她走近两步，在你面前停下。这是你第一次在白天、在宫墙外、离她这么近。"}], "第三章 宫门": [{"id": "c3s1", "route": "xiao", "beat": "那一夜宫门闭得很早。街上巡防比平日多了一倍，家家户户关窗。"}, {"id": "c3s2", "route": "xiao", "beat": "她第一次看着你的眼睛说完整句话。"}, {"id": "c3s3", "route": "xiao", "beat": "她听完，没有立刻说话。灯芯烧短了，光很小。"}, {"id": "c3s4", "route": "xiao", "beat": "四更天，宫里传来第一声更鼓。她站起来，走到窗边，把窗推开一条缝。"}, {"id": "c3s905", "route": "xiao", "beat": "天没亮，宫门还闭着。她在廊下等你，手里握着一枚铜符，符上的字被手汗磨得发亮。"}, {"id": "c3s5", "route": "xiao", "beat": "她背对着你站了很久，肩膀有一次很轻的起伏。"}], "第三章 案结之前": [{"id": "c3s7", "route": "xiao", "beat": "消息压在偏殿的案上，一整天没动。她坐在灯下，没有翻开任何一本折子。"}, {"id": "c3s6", "route": "xiao", "beat": "折子是次日早朝递的。你站在殿外第三排，按规矩该跪，你站着。"}, {"id": "c3s1", "route": "lu", "beat": "上奏前夜，她把官服叠得整整齐齐，摆在案上，像摆一件借来的东西。"}, {"id": "c3s90", "route": "lu", "beat": "殿门关了三个时辰。檐下的更漏滴得很慢，里面一直没有声音传出来。"}, {"id": "c3s2", "route": "lu", "beat": "她看着你，看了很久。"}, {"id": "c3s3", "route": "lu", "beat": "天亮之前，宫里来了人，比她的折子早了两个时辰。"}, {"id": "c3s4", "route": "lu", "beat": "案子结了，十年前的漕运账被翻出来，牵出三个人。陆知白在朝上把话说完，没有一个人敢接。"}, {"id": "c3s5", "route": "lu", "beat": "雨停了。宫里的人来请她，说陛下要见。"}], "第一章 同僚": [{"id": "c1s1", "route": "lu", "beat": "你在刑部二门口被拦下，值守的老吏把你的官牌翻过来看了三遍，才让开半步。"}, {"id": "c1s2", "route": "lu", "beat": "她指给你看：同一份供词，三处「画押」的字迹深浅不同，日期却是一天。"}, {"id": "c1s3", "route": "lu", "beat": "案卷查到一起，天就黑了。她起身时扶了一下案角，袖子滑上去半寸。"}, {"id": "c1s4", "route": "lu", "beat": "她没有立刻答，手在案下攥了一下，攥得指节发白。"}, {"id": "c1s5", "route": "lu", "beat": "那晚她没走。两个人对着一盏灯坐到三更，她把话说得很慢。"}, {"id": "c1s6", "route": "lu", "beat": "第二天，漕运案的卷宗被调走了，说是上头要看。调走的人连回执都没留。"}], "第二章 替她瞒": [{"id": "c2s1", "route": "lu", "beat": "为了查那桩旧案，你们换了便装去城南的茶楼。她穿男装比穿官服更自然，走路带风。"}, {"id": "c2s90", "route": "lu", "beat": "吏部来了文书，要刑部各员报一份年貌册：籍贯、年岁、面貌，另附一只手印。"}, {"id": "c2s2", "route": "lu", "beat": "茶楼里坐着几个刑部的老吏。有人认出她，端了酒过来。"}, {"id": "c2s3", "route": "lu", "beat": "出了茶楼，她走了一段才开口，声音有点闷。"}, {"id": "c2s7", "route": "lu", "beat": "夜里刑部的门要落三道锁。她值夜那次，第三道锁卡住了，钥匙插进去转不动。"}, {"id": "c2s4", "route": "lu", "beat": "查到第七天，那个替死人签字的老吏死在了牢里，说是自尽。"}, {"id": "c2s5", "route": "lu", "beat": "三天后，有人递了折子，参刑部主事陆知白「行止不端，恐非男子」。"}, {"id": "c2s6", "route": "lu", "beat": "她一个人去的，回来时天快亮了。官服上沾了酒气，人倒是没事。"}], "第三章 同僚": [{"id": "c3s6", "route": "lu", "beat": "停尸房在西角，只有一盏油灯。仵作把验状摊在石台上，指尖点着最后一行。"}], "第一章 替嫁": [{"id": "c1s1", "route": "shen", "beat": "喜棚搭好那天下了雨，红绸被打湿，颜色深了一块。府里说，沈家的小姐明日进门。"}, {"id": "c1s2", "route": "shen", "beat": "册子上的字很干净，一笔一划，不像仓促写的。她把每一项都记了：米、布、银，连两匹绢的颜色都注了。"}, {"id": "c1s3", "route": "shen", "beat": "喜宴散得早。二公子身子弱，拜完堂就被扶回房里，咳嗽声隔着两道墙都听得见。"}, {"id": "c1s4", "route": "shen", "beat": "她愣了一下，手抬起来，又放下。"}, {"id": "c1s5", "route": "shen", "beat": "三更，府里忽然乱起来。二公子咳血，请了大夫，大夫摇头。"}], "第二章 守寡": [{"id": "c2s1", "route": "shen", "beat": "二公子死在第七天。府里换了白，红绸被扯下来，堆在院角，像一堆没人要的东西。"}, {"id": "c2s9936", "route": "shen", "beat": "祠堂散了之后，府里换了白。她把袖子里的册子摊在桌上，摊得很平，用手指把折痕压实。"}, {"id": "c2s2", "route": "shen", "beat": "你翻出账房底册，一笔一笔对。三十六抬嫁妆，二十六抬入户，十抬记在「待补」，却有三笔银子早在半年前就出了府。"}, {"id": "c2s3", "route": "shen", "beat": "二管事姓周，管着府里三十年的账。他见了你，笑得很和气。"}, {"id": "c2s4", "route": "shen", "beat": "那晚她来账房，看见你桌上的底册，什么也没问。"}, {"id": "c2s5", "route": "shen", "beat": "族长在祠堂议事，说新妇守寡三年，若不安分，就送回沈家。周管事站在旁边，一句没辩。"}, {"id": "c2s6", "route": "shen", "beat": "祠堂里静了一瞬。族长的目光从底册移到你脸上，又移到门口。"}, {"id": "c2s8", "route": "shen", "beat": "底册在库房最里头的柜子里。第二天她去取，被两个管事拦在门口——一个说钥匙在周管事手上，一个说府里查不到这张凭据。"}, {"id": "c2s7", "route": "shen", "beat": "三天后她一个人去了库房，回来的时候袖口撕了一道口子，头发也有点乱。"}], "第三章 出府": [{"id": "c3s1", "route": "shen", "beat": "族长没有当场发作。三日后，周管事被查，府里封了两间库房。"}, {"id": "c3s9128", "route": "shen", "beat": "门板是新上的，漆味还没散。她一个人把三匹布摞上柜台，摞完退后两步，看了一看高度。"}, {"id": "c3s2", "route": "shen", "beat": "她从床底下拖出一个小箱子。里面有布样、账目、还有一张画得很粗的铺面图。"}, {"id": "c3s3", "route": "shen", "beat": "出府那天要签字画押：退了婚书，嫁妆归沈家，从此与裴府无涉。"}, {"id": "c3s8", "route": "shen", "beat": "退婚书要去沈家拿。她一个人回去的，没让你跟，说这是她家的事。"}, {"id": "c3s4", "route": "shen", "beat": "铺子开在城南，门面不大，招牌是新的，字是她自己写的。"}, {"id": "c3s5", "route": "shen", "beat": "入夜，铺子关门。她把灯芯挑亮，坐下来，第一次没有急着说什么。"}, {"id": "c3s6", "route": "shen", "beat": "开张第十天，来了两个人，说是裴府旧人，来收「例钱」——铺子在城南，归这条街的规矩管。"}, {"id": "c3s7", "route": "shen", "beat": "那两个人走了。她关上门，把门闩插上，回头时眼圈是红的，但没哭。"}], "第一章 倒计时 180 天": [{"id": "c1s1", "route": "jian", "beat": "八月底，明德中学高三（七）班。你被班主任叫到办公室，桌上放了一张座位表，最后一排靠窗的位置用红笔圈了出来，旁边写了个名字：程简简。"}, {"id": "c1s2", "route": "jian", "beat": "第一周同桌。她上课不听讲，低着头在本子上写东西，你以为她在画画，扫了一眼——是错题本，抄得很工整，但一道力学公式抄反了两个符号。"}, {"id": "c1s3", "route": "jian", "beat": "体育课自由活动。你跑完三千米，弯着腰喘气，抬头看见她一个人坐在跑道边的台阶上，膝盖上摊着一本单词本，嘴在动，没出声。"}, {"id": "c1s4", "route": "jian", "beat": "午休。全班趴在桌上睡觉。你没睡着，在改上午数学卷子的错。她也醒着，在改同一张卷子，笔尖很轻，怕吵到别人。"}, {"id": "c1s5", "route": "jian", "beat": "月考成绩贴出来了。你年级第一。她年级四百八十名（设定值，非真实数据），倒数第三排的位置，红纸黑字。"}], "第二章 倒计时 90 天": [{"id": "c2s1", "route": "jian", "beat": "月考后按成绩调座位。她被调到中间第四排，你留在最后一排。她收拾东西时错题本从抽屉滑出来，你弯腰捡起，她手抖了一下，接过去没说话。"}, {"id": "c2s9471", "route": "jian", "beat": "教室后门的锁坏了两天，没人报修。她从后门进来，绕过讲台，把卷子反扣在最后一排的空桌上。"}, {"id": "c2s2", "route": "jian", "beat": "她在新座位跟后排的几个人混熟了。上课传纸条，下课嘻嘻哈哈。你从最后一排看过去，她在笑，笑得很用力。"}, {"id": "c2s7", "route": "jian", "beat": "期中家长会那天下午，她妈在教室门口拉住班主任，声音不大，走廊里的人都听得见。"}, {"id": "c2s3", "route": "jian", "beat": "晚自习突然停电。走廊应急灯亮着，你去接水，走到拐角听见她在走廊尽头打电话，声音很轻，但走廊太安静了。"}, {"id": "c2s4", "route": "jian", "beat": "第二天，她像没事人一样。上课照常贫嘴，跟后排的人借修正带，笑得很大声。你把昨天整理的一套卷子递过去，她没接。"}, {"id": "c2s5", "route": "jian", "beat": "班会课。班主任站在讲台上说：「这次月考有几个同学进步很大，程简简进步了一百多名，主要是同桌帮扶效果好——」"}, {"id": "c2s6", "route": "jian", "beat": "班会后你去了天台。她靠在栏杆上，背对着楼梯口，风吹得她头发乱七八糟。你在门口站了一会儿，她没回头，但开口了。"}], "第三章 倒计时 30 天": [{"id": "c3s1", "route": "jian", "beat": "志愿表草表发下来了。三栏，第一栏最重要。你在第一栏填了一直想考的学校。她坐在新座位上，低头填表，笔停了很久。"}, {"id": "c3s9619", "route": "jian", "beat": "倒计时牌换成三十天。晚自习后教室空了一半，她留在最后一排，桌上摊着草表。"}, {"id": "c3s2", "route": "jian", "beat": "你收到保送确认通知了。信封是导师签的字，最后一栏是你一直想自己考的学校。导师说：「签了就不用高考了，名额给你留着，想清楚。」"}, {"id": "c3s3", "route": "jian", "beat": "她从班主任办公室门口路过，听见了你的名字和「保送」两个字。下午自习，你看见她在志愿表上把第一栏擦掉了，重写。新写的学校在另一个省。"}, {"id": "c3s4", "route": "jian", "beat": "高考前三天的晚自习。她翻开错题本的最后一页，写了一行字，又划掉了。你以为她没发现你在看，但她头也没抬就开口了。"}, {"id": "c3s5", "route": "jian", "beat": "高考前一天，全班拍毕业照。她站在最后一排最角落，你站在前排中间。摄影师喊一二三，她在最后一排做了个鬼脸——吐舌头那种，很幼稚。"}, {"id": "c3s7", "route": "jian", "beat": "志愿表交上去那天，她在办公室门口站了很久，出来的时候表已经交了。"}, {"id": "c3s6", "route": "jian", "beat": "考完最后一科。出考场下大雨，没带伞。她站在校门口的梧桐树下，头发湿了一半，贴在脸上。你也没带伞，两人淋着雨沿校门口那条路走。"}], "第一章 归来": [{"id": "c1s1", "route": "qing", "beat": "六年没回这座城。出租车从机场开到老城区，你路过那栋玻璃楼——青梧建筑事务所的招牌挂在十七层，灯亮着。"}, {"id": "c1s2", "route": "qing", "beat": "她转过身来。六年了，她瘦了，颧骨更高了，头发剪到肩膀，不像当年那种长得能扎马尾的样子。她看了你一眼，目光很短，然后看回图纸。"}, {"id": "c1s3", "route": "qing", "beat": "她把红笔搁下了。笔滚了两圈，碰到图纸上的一块橡皮，停了。"}, {"id": "c1s4", "route": "qing", "beat": "她从柜子里翻出一卷图纸，扔在桌上。不是新方案——是你六年前做的那个立面重构，A2图幅，四张，折痕都磨白了，边角起了毛。"}, {"id": "c1s5", "route": "qing", "beat": "她站在门口，手没离开门把。雨声大了，走廊的灯是感应的，亮了一下又灭了。"}, {"id": "c1s6", "route": "qing", "beat": "那天晚上你做了个梦。不是噩梦，是六年前那间会议室。"}], "第二章 对账": [{"id": "c2s1", "route": "qing", "beat": "第二天。事务所十七层，她的办公室门开着。桌上多了一样东西——一个旧模型，巴掌大，是当年你们一起做的社区图书馆草模，你切的纸板，她上的色。"}, {"id": "c2s90", "route": "qing", "beat": "下午三点，她把改过的立面摊在长桌上，用红笔在两处各画了一个圈。笔压得很重，纸背透出红。"}, {"id": "c2s2", "route": "qing", "beat": "你把新图纸展开，跟旧方案并排放。退线多两米，立面确实要重来。但旧方案的结构逻辑还能用——你当年花了三个月推导的那套模数关系，不是白做的。"}, {"id": "c2s7", "route": "qing", "beat": "档案室最里面那一格，标签上的日期是六年前。你抽出来的时候，纸边已经发黄。"}, {"id": "c2s3", "route": "qing", "beat": "她手顿了一下，从口袋里摸出一盒烟，看了看，又塞回去了。没点。"}, {"id": "c2s4", "route": "qing", "beat": "下午，你在她办公室改立面。她出去了，门没锁。你翻她桌上的项目档案，翻到一份会议纪要——日期是六年前，就是那场会。"}, {"id": "c2s5", "route": "qing", "beat": "她回来了，看见桌上的纪要没动过（或者你以为她没看出来）。她坐下来，翻了翻你改的立面初稿，拿红笔圈了两处。"}, {"id": "c2s6", "route": "qing", "beat": "她笔尖停了。红笔戳在图纸上，墨水洇了一个点。她没抬头，但你看见她喉结动了一下。"}], "第三章 问句": [{"id": "c3s1", "route": "qing", "beat": "第三天。你把初稿改完了，两处模数节点保留，但调了比例，绕过了规划局的退线问题。她翻了一遍，没圈红。"}, {"id": "c3s90", "route": "qing", "beat": "雨停了半小时，又落下来。她把那只缺角的模型从柜子最上层搬下来，放在窗前，缺角朝里。"}, {"id": "c3s2", "route": "qing", "beat": "施工节点图铺在桌上。你逐张看过去——结构合理，材料选得准，但有三处节点的逻辑跟她六年前的风格不一样，倒像你当年的思路。"}, {"id": "c3s3", "route": "qing", "beat": "她没接话。把文件合上，站起来，走到窗边。烟盒在窗台上，她拿了一支，没点，夹在指间转。"}, {"id": "c3s4", "route": "qing", "beat": "她回过身来，第一次在这一整天正面看你。烟还夹在手里，没点，滤嘴被她捏扁了。"}, {"id": "c3s5", "route": "qing", "beat": "她把那支捏扁的烟扔进了垃圾桶。纸篓里已经有七八个烟头了，都是今天攒的。"}, {"id": "c3s6", "route": "qing", "beat": "她终于看你了。不是扫一眼，是看。站在窗和桌之间，背后是灰色的雨后天空，光打在她半边脸上。"}, {"id": "c3s7", "route": "qing", "beat": "她在门口站住，转过身来。雨已经停了，路面反着灯，像刚擦过。"}], "第一章 这一轮我改了七次": [{"id": "c1s1", "route": "loop", "beat": "三点十七分，抢救室送来一个没有名字的男人。"}, {"id": "c1s2", "route": "loop", "beat": "第七次重来，她已经能背出每个人的下一句。"}, {"id": "c1s3", "route": "loop", "beat": "她提前备好肾上腺素，手不抖了，人也不抖了。"}, {"id": "c1s4", "route": "loop", "beat": "同事问她怎么知道床号，她说自己记性好。"}, {"id": "c1s5", "route": "loop", "beat": "她犹豫了四十秒，隔壁床老人多停了一次心跳。"}, {"id": "c1s6", "route": "loop", "beat": "她跪在更衣室，把「能重来」三个字从脑子里擦掉。"}], "第二章 他手背上的旧疤": [{"id": "c2s1", "route": "loop", "beat": "她不再算秒，改成记住他手背上的旧疤。"}, {"id": "c2s2", "route": "loop", "beat": "他忽然开口：你上一轮也是这么站的。"}, {"id": "c2s3", "route": "loop", "beat": "他们对了两处细节，确认两人困在同一场雨里。"}, {"id": "c2s4", "route": "loop", "beat": "他说每次重来都要再死一次，说得很轻。"}, {"id": "c2s5", "route": "loop", "beat": "她第一次为了不让他再死，主动放慢了手上的动作。"}], "第一章 雨里的副驾": [{"id": "c1s1", "route": "scar", "beat": "台风夜班车停运，你拦下他的货车，副驾有把旧伞"}, {"id": "c1s2", "route": "scar", "beat": "他只说路况和雨量，一句话不超过七个字"}, {"id": "c1s3", "route": "scar", "beat": "服务区他瘸着腿下车，逐个踢轮胎，不让你帮"}, {"id": "c1s4", "route": "scar", "beat": "你递止痛药，他说我没事，塞回你包侧袋"}, {"id": "c1s5", "route": "scar", "beat": "收音机只剩电流声，他让你随便拧，说反正听不清"}, {"id": "c1s6", "route": "scar", "beat": "他把你放在有路灯的路口，等你进楼道才打转向灯"}], "第二章 修车厂的雨": [{"id": "c2s1", "route": "scar", "beat": "三天后你去还伞，他仰躺在车底，只露出半截鞋"}, {"id": "c2s2", "route": "scar", "beat": "他袖口渗血，说是扳手划的，低头继续拧螺丝"}, {"id": "c2s3", "route": "scar", "beat": "隔壁店主说他昨夜跑了一趟长途，天亮才回"}, {"id": "c2s4", "route": "scar", "beat": "你帮他记流水账，他把卷帘门钥匙丢给你，没解释"}, {"id": "c2s5", "route": "scar", "beat": "旧同事来送材料，提到那场事故，他出门抽烟"}], "第三章 台风过境": [{"id": "c3s1", "route": "scar", "beat": "台风预警，他扛着木板来钉你家的窗，不说为什么"}, {"id": "c3s2", "route": "scar", "beat": "风大雨急他走不了，你留他，他说睡沙发就行"}, {"id": "c3s3", "route": "scar", "beat": "半夜旧伤发作，他压着声在阳台，怕你听见"}, {"id": "c3s4", "route": "scar", "beat": "你替他找药时看见体检单和一份邻县铺面租约"}, {"id": "c3s5", "route": "scar", "beat": "雨停他要走，把钥匙留在桌上，说邻县缺个修车的"}], "第一章 雨落在旧招牌上": [{"id": "c1s1", "route": "revenge", "beat": "她在南巷盘下漏雨的旧书店，招牌用的是假姓。"}, {"id": "c1s2", "route": "revenge", "beat": "旧友周愔推门避雨，没认出她，只说这店以前死过人。"}, {"id": "c1s3", "route": "revenge", "beat": "她翻出当年的判决剪报，纸角缺了一块。"}, {"id": "c1s4", "route": "revenge", "beat": "债主上门，认出她眉眼，开口要旧账。"}, {"id": "c1s5", "route": "revenge", "beat": "她在雨里撞见当年作证的人，对方撑伞替她挡了一下。"}, {"id": "c1s6", "route": "revenge", "beat": "夜里有人从门缝塞进一张收据，字迹是那人的。"}], "第二章 客气话里的刀": [{"id": "c2s1", "route": "revenge", "beat": "她约那人喝茶，全程只说天气和茶价。"}, {"id": "c2s2", "route": "revenge", "beat": "周愔又来，帮她搬书，说起当年那场官司。"}, {"id": "c2s3", "route": "revenge", "beat": "她发现旧账本被翻过，页码乱了两处。"}, {"id": "c2s4", "route": "revenge", "beat": "那人的妻子登门，塞来一沓钱，求她别再闹。"}, {"id": "c2s5", "route": "revenge", "beat": "她在河边听见对方醉酒说了真话，声音被雨盖住一半。"}, {"id": "c2s6", "route": "revenge", "beat": "回家路上她把伞给了淋雨的陌生小孩。"}], "第三章 她自己的活法": [{"id": "c3s1", "route": "revenge", "beat": "她把手上的东西摊在桌上，第一次没有绕弯子。"}, {"id": "c3s2", "route": "revenge", "beat": "那人来求她，说愿意还钱、还名。"}, {"id": "c3s3", "route": "revenge", "beat": "周愔承认当年他也在场，没能开口。"}, {"id": "c3s4", "route": "revenge", "beat": "雨停了一夜，招牌的半边终于写上字。"}, {"id": "c3s5", "route": "revenge", "beat": "书卖出第一本，是个躲雨的女生，问她为何留在这。"}], "第一章 记在账上": [{"id": "c1s1", "route": "ledger", "beat": "雨夜加班，她替他垫付车费，记在第37条。"}, {"id": "c1s2", "route": "ledger", "beat": "茶水间听见他夸别人细心，她把杯子放回原处。"}, {"id": "c1s3", "route": "ledger", "beat": "部门聚餐他说先垫，她付款，备注写清。"}, {"id": "c1s4", "route": "ledger", "beat": "回家雨大，她算出这月替他垫了两千四。"}, {"id": "c1s5", "route": "ledger", "beat": "他发来“改天请你”，她盯着三个字看了很久。"}], "第二章 雨里对账": [{"id": "c2s1", "route": "ledger", "beat": "项目出事，他第一句话是问：哪条合同能补。"}, {"id": "c2s2", "route": "ledger", "beat": "她替他挡下追责，会议记录只写自己经手。"}, {"id": "c2s3", "route": "ledger", "beat": "雨停十分钟，他在楼下说“你人真好”。"}, {"id": "c2s4", "route": "ledger", "beat": "她列了张单：三年，四十七笔，全带日期。"}, {"id": "c2s5", "route": "ledger", "beat": "他生日，她照例转账，这次多打了一行备注。"}], "第三章 我直接要": [{"id": "c3s1", "route": "ledger", "beat": "两份清单并排放在他桌上：一份钱，一份时间。"}, {"id": "c3s2", "route": "ledger", "beat": "他说：我们之间不用算这么清。"}, {"id": "c3s3", "route": "ledger", "beat": "雨又落，她把伞只撑在自己头顶。"}, {"id": "c3s4", "route": "ledger", "beat": "他问非要这样吗，她答一个字：是。"}, {"id": "c3s5", "route": "ledger", "beat": "他转账，数字对，时间晚了两天。"}, {"id": "c3s6", "route": "ledger", "beat": "最后她开口，说出想要的东西，不是钱。"}], "第一章 一具无名尸": [{"id": "c1s1", "route": "coroner", "beat": "雨夜送来无名女尸，他在灯下先看指缝"}, {"id": "c1s2", "route": "coroner", "beat": "他说贝壳粉，来源应该在城东旧码头"}, {"id": "c1s3", "route": "coroner", "beat": "你猜是溺水，他纠正：肺里没水"}, {"id": "c1s4", "route": "coroner", "beat": "凌晨三点，你把凉掉的咖啡换成热的"}, {"id": "c1s5", "route": "coroner", "beat": "报告里他删掉一句推测，只留证据"}, {"id": "c1s6", "route": "coroner", "beat": "死者身份出来：旧城区的裁缝"}], "第二章 证据不足": [{"id": "c2s1", "route": "coroner", "beat": "你来旁听解剖，他没拦你"}, {"id": "c2s2", "route": "coroner", "beat": "中途你退到墙边，他没停手"}, {"id": "c2s3", "route": "coroner", "beat": "你问他为什么老说证据不足"}, {"id": "c2s4", "route": "coroner", "beat": "他讲起自己第一具尸体的名字"}, {"id": "c2s5", "route": "coroner", "beat": "案子被上面调走，理由是辖区变了"}, {"id": "c2s6", "route": "coroner", "beat": "夜里他一个人在解剖室坐着，没开灯"}], "第三章 不必证明": [{"id": "c3s1", "route": "coroner", "beat": "台风夜停电，他用手电把最后一刀做完"}, {"id": "c3s2", "route": "coroner", "beat": "你带来那份被删掉的报告副本"}, {"id": "c3s3", "route": "coroner", "beat": "他说了一句不合职业的话，很轻"}, {"id": "c3s4", "route": "coroner", "beat": "案子结了，没有人被追责"}, {"id": "c3s5", "route": "coroner", "beat": "他把骨锯收进箱子里，扣上锁"}], "第一章 谁都说你好": [{"id": "c1s1", "route": "hollow", "beat": "聚会上他记得每个人口味，自己一杯没喝光"}, {"id": "c1s2", "route": "hollow", "beat": "散场后他坚持送你，路上话很少"}, {"id": "c1s3", "route": "hollow", "beat": "你问他为什么总在笑，他愣了一秒"}, {"id": "c1s4", "route": "hollow", "beat": "他答应的事又忘了，第二天补上表情包"}, {"id": "c1s5", "route": "hollow", "beat": "加班到十点，他在楼下等你，手里两杯奶茶"}, {"id": "c1s6", "route": "hollow", "beat": "你说他好得不像真的，他笑得更用力了"}], "第二章 别看我": [{"id": "c2s1", "route": "hollow", "beat": "项目组吵起来，他端着杯子去了走廊"}, {"id": "c2s2", "route": "hollow", "beat": "楼梯间里他靠着墙，没看手机"}, {"id": "c2s3", "route": "hollow", "beat": "他第一次说「我怕」，说完立刻开玩笑"}, {"id": "c2s4", "route": "hollow", "beat": "他消失三天，消息只回表情"}, {"id": "c2s5", "route": "hollow", "beat": "回来那天，他把方案全推翻重做"}, {"id": "c2s6", "route": "hollow", "beat": "散会后他一个人留在会议室"}], "第三章 好人不等于谁都可以": [{"id": "c3s1", "route": "hollow", "beat": "台风天他提着两袋东西来找你"} const MOCK = {"wan": {"hit": ["「……你干嘛。」她往后让了半步，没恼，只是把手里的书抱得更紧。", "把书脊对齐，摆回架上。"], "ask": ["「今天不忙。雨停之前都没什么人来。」", "她把杯子往你那边推了推。"], "care": ["「……我没事。」停了一下又说，「柚子茶凉了就不好喝了。」", "低头擦柜台，擦的是同一块地方。"], "quiet": ["「你不说话，我就当你听懂了。」", "把铅笔在指间转了一圈。"], "other": ["「嗯。」她应一声，等着你往下说。", "目光落在你手上，像在看什么画。"]}, "jian": {"hit": ["「你踹我？」她愣了一秒，笑出声，「行啊你。」", "把椅子往后一蹬，坐直了。"], "ask": ["「关你什么事。」嘴上这么说，本子还是往你这边偏了半寸。", "笔尖点着那道错题。"], "care": ["「我好不好我自己不知道？」她顿了一下，声音低下去，「……谢谢。」", "把袖子往下拉了拉。"], "quiet": ["「哑了？」她敲了敲你的桌角。", "歪头看你。"], "other": ["「说啊。」她催你，笔在指尖转。", "把椅子往你这边拖了一点。"]}, "qing": {"hit": ["「把手拿开。」她没抬头，红笔还在图纸上走。", "把那支笔盖上了。"], "ask": ["「这条线为什么这么走？你说。」", "用笔尖点了点图纸角落。"], "care": ["「我不需要人照顾。」停了两秒，「……水在那边。」", "把图纸往回卷了一半。"], "quiet": ["「想清楚再说。」", "等你。"], "other": ["「继续。」她只说了两个字。", "在图纸角上画了个小叉。"]}, "yao": {"hit": ["「哎哟——」她笑着躲开，「手劲不小。」", "琴盖上的手抬起来又放下。"], "ask": ["「你猜。」她挑了挑眉，又低头按了一个音。", "踩了一下踏板。"], "care": ["「我这种人，不用心疼。」她笑了一下，眼睛没笑。", "把谱子合上。"], "quiet": ["「沉默是金啊？」", "弹了一个和弦。"], "other": ["「然后呢？」", "手指在琴键上走音阶。"]}, "wen": {"hit": ["「……麦克风还开着。」她低声说，往后缩了一下。", "推了推耳机。"], "ask": ["「这个问题，我在节目里也问过别人。」", "把耳机挂到脖子上。"], "care": ["「我没事。你先喝点热的。」", "把杯子的位置往前挪了挪。"], "quiet": ["「有些人不说话也很好听。」", "看着窗外。"], "other": ["「嗯，我在听。」", "把音量调小。"]}, "xiao": {"hit": ["「大胆。」她把茶盏放下，却没叫人来。", "抬眼看你。"], "ask": ["「你想问什么？问之前先想想代价。」", "指尖叩了两下案几。"], "care": ["「本宫不需要。」停一下，「……药留下。」", "把袖子叠了叠。"], "quiet": ["「说。」一个字。", "没动。"], "other": ["「继续。」", "看向窗外。"]}, "lu": {"hit": ["「动手？」她把卷宗合上，「也好，省得写文书的功夫。」", "站了起来。"], "ask": ["「你问的这些，卷宗里都有。」", "把灯往你那边挪了挪。"], "care": ["「我这身子骨不值当。」顿了顿，「……多谢。」", "把灯芯挑亮。"], "quiet": ["「不说就回去歇着。」", "继续誊写。"], "other": ["「你说。」", "笔没停。"]}, "shen": {"hit": ["「动手是要加钱的。」她认真地说。", "把算盘往身边挪了挪。"], "ask": ["「这一笔我记着。你想知道哪一笔？」", "拨了一颗珠子。"], "care": ["「不必。亏本的事我做过一次就够。」", "低头继续算账。"], "quiet": ["「不算了？」", "抬眼看你。"], "other": ["「嗯，说下去。」", "把账本摊平。"]}};
const CN = {'一':1,'二':2,'三':3};
function order(n){for(const k in CN){if(n.includes('第'+k+'章'))return CN[k];}return 9;}
let route = new URLSearchParams(location.search).get('r') || 'wan';
let S = JSON.parse(localStorage.getItem('aidemo.'+route) || 'null') || {aff:0,trust:0,turns:[],facts:[],summary:'',chapter:CHARS[route].start_chapter||''};

const $ = id => document.getElementById(id);
const log = $('log');
function bubble(cls, html){const d=document.createElement('div');d.className='b '+cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
function setBar(v){$('affBar').style.width=Math.max(0,Math.min(100,(v+20)/60*100))+'%';}
function save(){localStorage.setItem('aidemo.'+route, JSON.stringify(S));}

function beatsFor(ch){return (SCENES[ch]||[]).filter(b=>b.route===route);}
function advance(){
  let chs = Object.keys(SCENES).filter(c=>beatsFor(c).length).sort((a,b)=>order(a)-order(b));
  if(!S.chapter || !beatsFor(S.chapter)){
    S.chapter = CHARS[route].start_chapter || (chs[0]||'');
    if(!beatsFor(S.chapter)) S.chapter = chs[0]||S.chapter;
  }
  let idx = Math.floor(S.turns.length/6);
  let bs = beatsFor(S.chapter);
  if(idx >= bs.length){
    const i = chs.indexOf(S.chapter);
    if(i>=0 && i+1<chs.length){ S.chapter = chs[i+1]; bs = beatsFor(S.chapter); idx = 0; }
    else idx = Math.max(0, bs.length-1);
  }
  S.beat = bs[idx] ? bs[idx].beat : '';
}

function render(){
  const c = CHARS[route];
  $('nm').textContent = c.name; $('ava').textContent = c.name.slice(-1);
  $('pl').textContent = S.chapter + ' · ' + (c.meta||'');
  setBar(S.aff);
}
function memHTML(){
  return '<div><b>好感</b> '+S.aff+' · <b>信任</b> '+S.trust+' · <b>章节</b> '+(S.chapter||'—')+'</div>'
   + '<div style="margin-top:8px"><b>她记住的事</b><br>'+(S.facts.slice(-8).map(x=>'· '+x).join('<br>')||'（还没有）')+'</div>'
   + '<div style="margin-top:8px"><b>更早的事</b><br>'+((S.summary||'').trim()||'（还没有）')+'</div>';
}
function remember(t){
  const pats = [/(?:我|俺)(?:很|特别|最)?(?:喜欢|爱)([^，。！？]{1,10})/, /(?:我|俺)(?:很|特别|最)?怕([^，。！？]{1,10})/, /(?:我|俺)(?:叫|是)([^，。！？]{1,8})/];
  for(const p of pats){ const m=t.match(p); if(m && m[1]){ S.facts.push(t.slice(0,26)); S.facts=S.facts.slice(-12); return; } }
}
function reply(text){
  const t = text.trim();
  const k = /踢|踹|打|推|撞/.test(t) ? 'hit'
          : /[?？]|吗|什么|为什么|怎么/.test(t) ? 'ask'
          : /累|还好|别|休息|冷|饿|疼/.test(t) ? 'care'
          : t.length<=4 ? 'quiet' : 'other';
  const tbl = MOCK[route] || MOCK.wan;
  const pair = tbl[k] || ['「嗯。」','点了点头。'];
  const [say, act] = pair;
  const d = {say, act, aff:{hit:1,care:2,ask:1,quiet:0,other:1}[k], trust:k==='care'?1:0,
             choices:{hit:['道歉','继续说狠话','转身走'],ask:['再问一句','换个话题','不说了'],
                      care:['把外套给她','装作没听见','开个玩笑'],quiet:['先开口','继续沉默','起身离开'],
                      other:['顺着聊','问回去','换个话题']}[k]};
  S.aff = Math.max(-20, Math.min(40, S.aff + d.aff));
  S.trust = Math.max(-20, Math.min(40, S.trust + d.trust));
  S.turns.push(t); S.turns.push(CHARS[route].name+'：「'+d.say+'」'+d.act);
  remember(t);
  if(S.turns.length>40){ const old=S.turns.slice(0,-24).filter(x=>x.startsWith(CHARS[route].name)).slice(0,4);
    S.summary = ((S.summary||'')+' '+old.map(x=>x.slice(0,40)).join('；')).trim().slice(-400); S.turns=S.turns.slice(-24); }
  advance(); save(); render();
  return d;
}
function say(text){
  if(!text.trim()) return;
  bubble('me', text.replace(/[<>]/g,''));
  const d = reply(text);
  bubble('her', '「'+d.say+'」' + (d.act? '<div class="act">'+d.act+'</div>':''));
  const box=$('choices'); box.innerHTML='';
  d.choices.forEach(c=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>say(c);box.appendChild(b);});
  $('inp').value='';
}
$('send').onclick = ()=> say($('inp').value);
$('inp').addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();say(e.target.value);} });
$('mbtn').onclick = ()=>{ const m=$('mem'); if(m.style.display==='block'){m.style.display='none';} else {m.innerHTML=memHTML(); m.style.display='block';} };
$('rst').onclick = ()=>{ if(confirm('清掉和这位的进度？')){ localStorage.removeItem('aidemo.'+route); location.reload(); } };
$('exp').onclick = ()=>{
  const all={}; Object.keys(CHARS).forEach(id=>{ const v=localStorage.getItem('aidemo.'+id); if(v) all[id]=JSON.parse(v); });
  const data=JSON.stringify({v:1,at:new Date().toISOString(),saves:all});
  const a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(data);
  a.download='借你一场雨-存档.json'; a.click();
};
$('pick').onclick = ()=>{ const ids=Object.keys(CHARS);
  const n=prompt('换谁？输入序号：\n'+ids.map((id,i)=>(i+1)+'. '+CHARS[id].name).join('\n'));
  const id=ids[(parseInt(n,10)||0)-1]; if(id){ location.search='?r='+id; } };

// 离线缓存（装到主屏后断网也能开）
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
// 开场
advance(); render();
const OPEN = {
 wan:'「雨还没停。」她把梯子挪了挪，让你好走过去。',
 yao:'「来得正好。」她头也没回，手指在琴键上走了一遍。',
 wen:'「……喂？」她压着声音，像怕吵到谁。',
 xiao:'「站着。说事。」她手里的朱笔没停。',
 lu:'「门带上。」她把手里的卷宗翻过一页。',
 shen:'「坐。账还没算完。」她拨了一下算盘。',
 jian:'「看什么看。这位置有人了。」她头都没抬。',
 qing:'「你迟到了三分钟。」她把图纸摊开。'
};
bubble('her', OPEN[route] + (S.beat?'<div class="act">'+S.beat+'</div>':''));
</script></body></html>
