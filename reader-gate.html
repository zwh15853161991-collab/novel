<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>卫言 · 逐字版</title>
<style>
:root{--bg:#0f0c0b;--ink:#ece6de;--dim:#a49b90;--faint:#6f6862;--line:rgba(255,255,255,.09);
--accent:#c9a06a;--acc-ink:#1a140e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 70% at 50% 0,#1a1512,#0f0c0b 62%);color:var(--ink);
 font:17px/1.9 "Songti SC","Noto Serif SC",serif;min-height:100dvh}
.wrap{max-width:680px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px 60px}
h1{font-size:22px;font-weight:500;margin:0 0 4px;letter-spacing:.04em}
.meta{color:var(--faint);font-size:12.5px;letter-spacing:.12em}
.sec{color:var(--accent);font-size:11.5px;letter-spacing:.18em;margin:20px 0 6px}
p.world{color:var(--dim);font-size:14px;margin:0}
.btn{display:inline-block;margin-top:18px;background:var(--accent);color:var(--acc-ink);border:0;
 border-radius:12px;padding:11px 20px;font-size:15px;font-family:inherit}
#stage{display:none}
.chap{color:var(--faint);font-size:12px;letter-spacing:.16em;text-align:center;margin:26px 0 14px}
.nar{margin:0 0 14px;line-height:2;font-size:16.5px}
.her{background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:2px solid var(--accent);
 border-radius:14px;padding:11px 15px;margin:0 0 14px}
.choices{display:grid;gap:9px;margin:18px 0 0}
.choices button{text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);
 border-radius:12px;padding:12px 14px;font-size:14.5px;font-family:inherit}
.choices button:hover{border-color:rgba(201,160,106,.5)}
.endcard{margin:22px 0;padding:16px 18px;border-radius:16px;border:1px solid rgba(201,160,106,.32);
 background:linear-gradient(180deg,rgba(201,160,106,.1),transparent)}
.eth{color:var(--accent);font-size:12.5px;letter-spacing:.12em;margin-bottom:8px}
.vig{margin-top:20px;border-top:1px dashed var(--line);padding-top:14px}
.vig h3{font-size:14px;font-weight:500;margin:0 0 8px;color:#c8a37a}
.vig p{margin:0 0 8px;color:var(--dim);font-size:14px}
.small{color:var(--faint);font-size:12.5px;margin-top:10px}
</style></head><body><div class="wrap">
<div id="intro">
  <h1 id="nm"></h1><div class="meta" id="mt"></div>
  <div class="sec" id="secWorld">故事背景</div><p class="world" id="world"></p>
  <div class="sec" id="secProfile">人物</div><div id="profile"></div>
  <div class="sec" id="secPremise">前情提要</div><p class="world" id="premise"></p>
  <button class="btn" id="go">开始</button>
  <div class="small">这一版是写死的正文：不联网、不需要模型，每句都对过。</div>
</div>
<div id="stage"><div id="log"></div><div class="choices" id="ch"></div></div>
</div>
<script>
const D={"name": "卫言", "meta": "看上去二十八 · 关隘守门人", "premise": "雨夜里你走到关隘下，石板上刻着十七条规矩，守门人只念了第一条：报上名字。", "world": "山口的关隘，石门厚三尺，门内侧刻着十七条规矩。关外常年落雨，关内不下。", "chapters": [{"title": "第一章 石板", "scenes": [{"lines": [["nar", "雨顺着关墙的砖缝往下淌，在石阶上积成一条浅水。石板上刻着字，笔画里塞满了泥。"], ["nar", "卫言提着灯，灯罩上糊了一层纸，光只照见脚前三步。他把灯放在石板上，用拇指抹掉第一行里的泥。"], ["say", "“第一条。报上名字。”"], ["nar", "他从袖子里摸出一块炭，放在石板边，炭头朝你。"], ["say", "“陆迟。”"], ["nar", "他把炭收回去，在袖口上按了按，手指留下一点黑。灯芯响了一声。"]], "choices": ["报全名", "只报姓", "（把名字写在手心）"], "n": 1}, {"lines": [["nar", "他蹲下去，一行一行往下念。声音不高，念得不快，像在数米。"], ["say", "“第二条，不得带兵器过关。第三条，不得夜半叫门。第四条……”"], ["nar", "雨点打在灯纸上，一下一下。他的手指在石面上移动，指腹磨过刻痕。"], ["say", "“第七条，过关者不得回头。”"], ["nar", "你低头去看那一行，字比别的小，刻得也浅。念到第十七条时，他停下来，把灯挪回原位。"], ["say", "“就这些。”"]], "choices": ["听完", "打断问哪条最要紧", "（记下第七条）"], "n": 2}, {"lines": [["nar", "灯焰矮下去一截。"], ["say", "“问什么？”"], ["nar", "他把手按在第七条上，掌心的泥把两个字盖住了。"], ["say", "“回头的，都回来了。回来的人，不是原来那个。”"], ["nar", "他收回手，石板上留了个湿手印，慢慢渗开。"]], "choices": ["问为什么", "说这不讲理", "（点头）"], "n": 3}, {"lines": [["nar", "关城落锁，铜钟敲了三下。门洞里的风换成从里往外吹，带着柴灰味。"], ["nar", "他坐在门内侧的石墩上，背靠着门轴，刀横在膝上，刀鞘上有一道豁口。"], ["nar", "你把饼掰成两半，递过去。他没有接，只把灯往你这边推了推。"], ["say", "“你吃。我夜里不吃东西。”"], ["nar", "灯照着他的手，指节上一层硬皮。整夜，他的眼睛没合过。"]], "choices": ["问他不困吗", "把饼分他一半", "（陪他坐）"], "n": 4}, {"lines": [["nar", "后半夜，有人从坡下上来，肩上扛着东西，脚步很重。"], ["say", "“让开。”"], ["nar", "卫言站起来，往前走了一步，一只手按在那人胸口。那人退了两步，肩上的麻袋掉在台阶上，滚出几块干粮。"], ["say", "“东西留下，人回去。天亮再来。”"], ["nar", "那人骂了一句，还是弯腰捡起麻袋，转身走了。卫言回到石墩上坐下，把刀重新横好，没有擦手。"]], "choices": ["帮他拦", "问他为什么不还手", "（退开一步）"], "n": 5}, {"lines": [["nar", "天快亮时，雨停了。檐上还在滴水，滴在石板的凹处，一声一声。"], ["say", "“你走这条道，是找人，还是躲人？”"], ["nar", "他把灯芯挑高了一点，光落到你脸上，又落回石板上。"], ["nar", "你没有答。他也不催，把灯盖扣上，火灭了。"], ["say", "“不答也行。进了门，就不许回头了。”"]], "choices": ["说找人", "说逃", "（不答）"], "n": 6}]}, {"title": "第二章 规则高于人", "scenes": [{"lines": [["nar", "雨停在后半夜。檐水一滴一滴砸在石阶上，砸出小坑。"], ["nar", "那人从坡下上来，鞋底带泥，右手垂着，刀尖朝下，沿石板缝一路划。"], ["say", "“把刀放下。”"], ["nar", "他没放。脚跟压住第十七条，压着“夜不过关”四个字。"], ["say", "“再说一遍。放下。”"], ["nar", "刀抬起来。卫言往前一步，身子横在门洞前，肩把灯影挡去大半。"]], "choices": ["喊他", "自己挡", "（躲到门后）"], "n": 7}, {"lines": [["nar", "刀掉在石板上，弹了一下。血从卫言左臂滴下来，顺刻痕淌，把“一”字填满。"], ["nar", "他没看胳膊。他蹲下去，两只手扶着石板边，一寸一寸推，眼睛贴着刻痕瞄。"], ["say", "“歪了半指。”"], ["nar", "他嗯了一声，用袖子擦血，擦到刻痕露出干净的石色为止。"], ["say", "“规矩不能斜。”"]], "choices": ["先包扎", "问他疼不疼", "（帮他把石板扶正）"], "n": 8}, {"lines": [["nar", "门闩抬起来，木头磨出一声长响。他侧身，让出半扇门的宽度。"], ["say", "“天亮前走。”"], ["nar", "门里是一间矮屋，一盏灯，一张板床，墙上挂着十七块木牌，绳头都磨白了。"], ["say", "“这算第几条？”"], ["nar", "他把灯往你这边推了推，没答。桌上有半张饼，你推过去，他掰下指甲盖大的一块，剩下的推回来。"]], "choices": ["问他要担什么", "说谢谢", "（把饼全留给他）"], "n": 9}, {"lines": [["nar", "天没亮透，坡上来了一辆马车，轮子包着布，压过石板没有声音。"], ["nar", "下来三个人，袖口一样宽。走在前头的那个不看门，只看石板。"], ["say", "“昨夜有人过关？”"], ["nar", "卫言站在门洞里，手垂着，袖子盖住胳膊上的布条。"], ["say", "“没有。”"], ["nar", "那人看完石板，又看他的袖子。卫言没动。你站在门后，隔着一道门缝。"]], "choices": ["替他说话", "沉默", "（站到他身后）"], "n": 10}, {"lines": [["nar", "马车走了以后，他把门闩落到底，又抬起来看了一眼，再落下。"], ["say", "“规矩不是我定的。”"], ["nar", "他伸手，指腹从第一条划到第十七条，指头上有血痂，蹭过刻痕时顿了一下。"], ["say", "“但我守。”"], ["say", "“谁定的？”"], ["nar", "他抬头看关口上头，那里黑着，什么也没有。"]], "choices": ["问谁定的", "说那你可以改", "（问他守了多少年）"], "n": 11}, {"lines": [["say", "“你守了多少年？”"], ["say", "“三百年。”"], ["nar", "他说这话的时候正把灯芯剪短，火苗矮下去，屋里暗了一层。"], ["nar", "剪下的那截灯芯被他放在桌角，摆平，跟旁边一小堆烧过的排在一起。"], ["say", "“你还记得自己叫什么吗？”"], ["nar", "他手上停了一下，把灯罩扣回去，玻璃上蒙了一层烟。"], ["say", "“卫言。”"]], "choices": ["问他累不累", "问他还记得自己名字吗", "（不说话）"], "n": 12}]}, {"title": "第三章 改一条规则", "scenes": [{"lines": [["nar", "他提起灯，绕到刻字的石板背后。灯焰压低，只照亮一小片湿地。"], ["nar", "那里立着一块窄石，比人矮一截，两面空着，雨水顺着石边往下淌。"], ["nar", "他把灯搁在石脚，蹲下去，袖口沾了泥，没有擦。"], ["say", "“这块是空的。”"], ["nar", "你伸手贴上去，石头凉，比雨还凉。他看见了，没有拦。"]], "choices": ["问这是干什么的", "伸手去摸", "（后退半步）"], "n": 13}, {"lines": [["nar", "他从门洞里的木箱底摸出一块磨石、一把短凿，蹲在檐下磨。铁声一下一下，很慢。"], ["say", "“改一条，刻一夜。”"], ["nar", "他用拇指抹过刃口，又磨，水顺着凿尖滴下来，在石面上点出一个小坑。"], ["say", "“刻错一笔，从头来。石头不认第二次。”"], ["nar", "檐角的水滴在他后颈，他没有动。"]], "choices": ["帮他磨刀", "说别改", "（问他改哪条）"], "n": 14}, {"lines": [["nar", "第一刀落在石板下方，横折钩，石屑卷起来，是白的。"], ["nar", "你凑近认出来：第七条，过关者不得回头。"], ["say", "“第七条。”"], ["nar", "他没有抬头，凿子顺着原来的笔画走，把“不”字一笔一笔剔下去。"], ["nar", "剔完最后一横，他停住，换了个角度，才落下一刀。"]], "choices": ["问他为什么改这条", "说这条最要紧", "（把手按在石上）"], "n": 15}, {"lines": [["nar", "天从门缝里白起来。石头上的新字是湿的，摸一下会沾手。"], ["nar", "他收凿子。右手虎口有一道口子，血沿掌纹走到腕上，滴在石脚。"], ["nar", "他把手在衣襟上按了一下，衣襟本来就有一块深色。"], ["say", "“成了。”"], ["nar", "灯油烧到底，焰只剩一粒，照着他的指甲。"]], "choices": ["替他包手", "问他会怎样", "（把名字补刻上去）"], "n": 16}, {"lines": [["nar", "他把门推开一半，门轴响得很长。外面的雾没散，路面白着，看不出往哪去。"], ["nar", "他退到门后，手还搭在门板上，没有再推。"], ["say", "“路在那边。”"], ["nar", "门槛上有一道旧磨痕，被脚底踩得发亮。你回头看他，他站在暗处，脸只照到一半。"]], "choices": ["问他走不走", "转身拉他", "（站在门口等）"], "n": 17}]}], "endings": {"A": {"title": "可回头一次", "text": "石板上第七条被磨平重刻，多出四个字：可回头一次。刻痕还很新，石粉落在门槛上没扫。他站在门里没动，说你走吧，回头的时候我还在。关外的雨正落着，关内一滴也没有。"}, "B": {"title": "这算犯规吗", "text": "他守了三百年，第一次跟着过了那道门。走出去三步他才回头，像在确认门还在，然后问你：这算犯规吗。雨水打在他肩上，他没躲，只是把手里那半块饼递过来。"}, "C": {"title": "比过又收手", "text": "门合上了。石板上的第七条还是原样，只是边角多了一道新刻的浅痕，像有人拿刀比过又收手。关内的灯还亮着，他的影子投在石板上，正好压住那道浅痕。"}, "D": {"title": "第十八个", "text": "上面的人来了，他被调去看别处的门。石板留在原地，第七条下面多了一行小字，字迹很轻：第十八个不回头的人。后来那行字被雨泡过，笔画涨开，还看得清。"}}, "vigs": [{"title": "十七条", "need": 6, "lines": ["石板十七条，从上到下刻得很密。", "他念的时候不看石面，眼睛看着来人的鞋。", "有人问第十七条写的什么。", "他说：第十七条，不许问第十七条。"]}, {"title": "关内不下雨", "need": 12, "lines": ["关外常年落雨，关内一滴也没有。", "有孩子问为什么。", "他说门厚三尺。", "孩子又问：那雨去哪了。他抬头看了看门。"]}, {"title": "刀", "need": 18, "lines": ["他随身一把刀，从没用来砍过东西。", "刀口磨得很平，刀柄上缠着旧布。", "有人说他不像守门的，像刻字的。", "他把刀收回去，说：也刻。"]}], "route": "gate", "arch": "守规人"};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
if(D.world){ $('#world').textContent=D.world; } else { $('#secWorld').style.display='none'; $('#world').style.display='none'; }
if(D.profile && D.profile.length){ $('#profile').innerHTML = D.profile.map(([k,v])=>'<p class="world"><b style="color:#c8a37a;font-weight:400">'+k+'</b>　'+v+'</p>').join(''); }
else { $('#secProfile').style.display='none'; $('#profile').style.display='none'; }
if(D.premise){ $('#premise').textContent=D.premise; } else { $('#secPremise').style.display='none'; $('#premise').style.display='none'; }
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      if(/陪|等|不|别走|谢|留|帮|说|问|看|递|握/.test(t)) warm++;
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=warm/Math.max(1,total);
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; render(); };
</script></body></html>
