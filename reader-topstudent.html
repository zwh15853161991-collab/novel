<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>许澈 · 逐字版</title>
<style>
:root{--bg:#0f0c0b;--ink:#ece6de;--dim:#a49b90;--faint:#6f6862;--line:rgba(255,255,255,.09);
--accent:#c9a06a;--acc-ink:#1a140e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 70% at 50% 0,#1a1512,#0f0c0b 62%);color:var(--ink);
 font:17px/1.9 "Songti SC","Noto Serif SC",serif;min-height:100dvh}
.wrap{max-width:680px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px 60px}
h1{font-size:22px;font-weight:500;margin:0 0 4px;letter-spacing:.04em}
.meta{color:var(--faint);font-size:12.5px;letter-spacing:.12em}
.sec{color:var(--accent);font-size:11.5px;letter-spacing:.18em;margin:20px 0 6px}
p.world{color:var(--dim);font-size:14px;margin:0}
.btn{display:inline-block;margin-top:18px;background:var(--accent);color:var(--acc-ink);border:0;
 border-radius:12px;padding:11px 20px;font-size:15px;font-family:inherit}
#stage{display:none}
.chap{color:var(--faint);font-size:12px;letter-spacing:.16em;text-align:center;margin:26px 0 14px}
.nar{margin:0 0 14px;line-height:2;font-size:16.5px}
.her{background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:2px solid var(--accent);
 border-radius:14px;padding:11px 15px;margin:0 0 14px}
.choices{display:grid;gap:9px;margin:18px 0 0}
.choices button{text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);
 border-radius:12px;padding:12px 14px;font-size:14.5px;font-family:inherit}
.choices button:hover{border-color:rgba(201,160,106,.5)}
.endcard{margin:22px 0;padding:16px 18px;border-radius:16px;border:1px solid rgba(201,160,106,.32);
 background:linear-gradient(180deg,rgba(201,160,106,.1),transparent)}
.eth{color:var(--accent);font-size:12.5px;letter-spacing:.12em;margin-bottom:8px}
.vig{margin-top:20px;border-top:1px dashed var(--line);padding-top:14px}
.vig h3{font-size:14px;font-weight:500;margin:0 0 8px;color:#c8a37a}
.vig p{margin:0 0 8px;color:var(--dim);font-size:14px}
.small{color:var(--faint);font-size:12.5px;margin-top:10px}
</style></head><body><div class="wrap">
<div id="intro">
  <h1 id="nm"></h1><div class="meta" id="mt"></div>
  <div class="sec">故事背景</div><p class="world" id="world"></p>
  <div class="sec">前情提要</div><p class="world" id="premise"></p>
  <button class="btn" id="go">开始</button>
  <div class="small">这一版是写死的正文：不联网、不需要模型，每句都对过。</div>
</div>
<div id="stage"><div id="log"></div><div class="choices" id="ch"></div></div>
</div>
<script>
const D={"name": "许澈", "meta": "17 · 高三（一）班，年级第一", "premise": "高三换座位，你被调到靠窗第三排。他把桌上的书往自己那边挪了两寸，算是打过招呼。", "world": "南方小城的高三教室，靠窗第三排。窗台上摆着两摞卷子，风扇转起来咔咔响。", "chapters": [{"title": "第一章 同桌", "scenes": [{"lines": [["nar", "靠窗第三排的桌子是旧的，右上角翘起一小块漆皮。九月的风从纱窗缝里挤进来，把前排的试卷边吹得翻了一下。"], ["nar", "许澈坐在左边。他把堆在两张桌子中间的一摞书往自己那边挪了两寸，露出一段桌面，书脊磕在桌沿，闷闷一声。"], ["say", "“谢谢。”"], ["nar", "他点了下头，眼睛没离开练习册，笔尖在纸上走，把刚才被书挡住的题继续往后写。"]], "choices": ["说声谢谢", "（也把书挪挪）", "问他叫什么"], "n": 1}, {"lines": [["nar", "一整天，他开口的次数一只手数得过来。早读一次，对课代表说“放那儿”；中午一次，对值日生说“别碰我桌子”。"], ["nar", "晚自习前作业本发下来，他的选择题全对，连最后一步的负号都没落。草稿纸压在胳膊底下，字小而密，一行一行往下排。"], ["say", "“你这题怎么想到的？”"], ["nar", "他停了半秒，指了一下题干里的一个条件，把草稿纸往我这边推了半寸，随即又收回到原来的位置。"]], "choices": ["借他的笔记", "问他怎么学的", "（不打扰他）"], "n": 2}, {"lines": [["nar", "英语小测的卷子沿座位一排排传下来，到我手里还飘着油墨味。我翻到选择题那页，斜眼去看他的答题区。"], ["nar", "他的胳膊本来就搁在桌沿，这时往里一收，前臂压住大半张卷子，只留一个被校服袖口盖住的角。"], ["say", "“你干嘛呀。”"], ["say", "“自己做。”"], ["nar", "他头也没抬，笔尖在括号里落下一个字母，又挪到下一题。我也把笔拿起来，在自己的卷子上盯了半天。"]], "choices": ["赌气不抄了", "问他为什么", "（把卷子收起来）"], "n": 3}, {"lines": [["nar", "晚自习下课前十来分钟，教室里只剩翻纸声和日光灯的一点嗡响。他从草稿本上撕下半页纸，写了几个字，折成四四方方一块，推过桌缝。"], ["nar", "纸边压着一道旧折痕，上面是第三题的解法，字迹小而齐，最后一步用铅笔圈了一下，旁边注了四个字：这里约分。"], ["say", "“谢谢。”"], ["nar", "他没抬头，只把手边的尺子放进文具袋，放得很轻。"]], "choices": ["回一句谢谢", "也写一张回他", "（把纸条夹进书里）"], "n": 4}, {"lines": [["nar", "月考成绩单贴在教室后墙，红笔批的。我的名字比上次往上走了二十行，从中间靠后挪到中间靠前。"], ["nar", "我把成绩单翘起的一角按回去，走回座位，拉开椅子时它在地上磨出一声。"], ["say", "“看见成绩单了吗？”"], ["say", "“嗯。”"], ["nar", "他翻过一页卷子，红笔在错处画了个圈，笔尖在下一题的括号前停了一下，又往前走。"]], "choices": ["问他看见没", "自己高兴一下", "（把成绩单放他桌上）"], "n": 5}, {"lines": [["nar", "放学时雨还在下，走廊地砖被踩得一步一个湿脚印。他从书包侧袋抽出折叠伞，在楼下台阶口撑开，伞骨弹了一下。"], ["nar", "伞面不宽。两个人走进去，我右肩上很快落不到雨了，他左袖的颜色却深了一块。"], ["say", "“你伞往我这边偏了，你那边淋着了。”"], ["say", "“没偏。”"], ["nar", "他没看我，脚步往路沿里边带了带，把我让在离车流远的那一侧。伞柄在他手里，朝我这边斜出一个很小的角度。"]], "choices": ["说你这样要淋湿", "把伞推回去", "（往他那边靠一点）"], "n": 6}]}, {"title": "第二章 分数", "scenes": [{"lines": [["nar", "卷子发下来，红笔的分数压在桌角，纸边卷起一小截。"], ["nar", "你把脸埋进胳膊，前额的汗把卷面洇出一小块深色。"], ["nar", "窗开着，风把卷子吹翻了一角，他伸手按住，顺手往自己那边挪了两寸。"], ["say", "“先别看分数。”"], ["nar", "一包纸巾推过来，塑料壳磕在桌沿，停在你手边。"]], "choices": ["等他说话", "自己起来", "（问他有纸巾吗）"], "n": 7}, {"lines": [["nar", "他把你的卷子转过去，笔尖点在第三题上。"], ["say", "“这一步，先算括号里的。”"], ["nar", "他等着，笔尖悬着不落，草稿纸边上被指甲压出一道白痕。"], ["say", "“别急。这一步算完，再往下。”"], ["nar", "他数到第二遍，声音比第一遍低，喉咙里带一点干。"]], "choices": ["跟着算", "说没听懂", "（让他再讲一遍）"], "n": 8}, {"lines": [["nar", "公告栏前挤着人，名单是红纸打印的，四个角用图钉按着。"], ["nar", "他站在人群外面，手插在袖子里，看了不到十秒。"], ["say", "“上面有我。”"], ["nar", "风把红纸一角吹得翘起来，他伸手按平，退了半步。"]], "choices": ["恭喜他", "问他去不去", "（不说话）"], "n": 9}, {"lines": [["nar", "晚自习前的走廊，他把保送表格折成四折，塞进校服内袋。"], ["say", "“我不打算去。”"], ["nar", "走廊尽头的灯管闪了一下，他的影子在墙上跟着跳。"], ["say", "“专业不合我。我要考。”"], ["nar", "折过的表格在布料下面透出一个方方正正的轮廓。"]], "choices": ["问他为什么", "说太傻了", "（看着他）"], "n": 10}, {"lines": [["nar", "他把保温杯拧开，热气冒出来，又拧回去，没喝。"], ["say", "“我妈在菜市场卖鱼。”"], ["nar", "他说得很平，手指在杯盖的螺纹上转了半圈。"], ["say", "“凌晨三点起。我小时候跟着去，现在不去了。”"], ["nar", "他把杯子放回桌角，位置和原先差了一指。"]], "choices": ["听着", "说我不知道", "（把题本合上）"], "n": 11}]}, {"title": "第三章 一起考", "scenes": [{"lines": [["nar", "志愿表发下来时，油墨味还没散，纸边被前面的人捏出了褶。他把自己的那张摊在桌角，用铅笔压住，又把我这张往我这边推了两寸。"], ["say", "“先填第一志愿。”"], ["nar", "铅笔尖停在“院校名称”那一格上面，没有落下去。窗外的蝉一声接一声，叫得不齐。"], ["say", "“你填哪儿？”"], ["nar", "他把表格转了半圈，让我看见第一行，随即又压回胳膊底下，用橡皮摁住。"]], "choices": ["问他想去哪个学校", "说别管我", "（把自己的填好）"], "n": 12}, {"lines": [["nar", "放学后走廊里没剩几个人，饮水机的绿灯亮着，水一滴一滴落进桶里。他把搪瓷杯接满，杯壁上一道旧磕痕，白漆掉了一小片。"], ["say", "“……一起考吧。”"], ["nar", "他的声音压在杯子后头，尾音被水声盖掉半截。他拧杯盖，拧了两次才拧上。"], ["say", "“什么？”"], ["nar", "“一起考。”这次声音大了一点，说完就端着杯子往楼梯口走，水在杯口晃了一圈，没有洒。"]], "choices": ["没听清", "说再说一遍", "（笑了）"], "n": 13}, {"lines": [["nar", "高考前一晚，操场只开了一半的灯，跑道另一头黑着。我从铁门缝里侧身进去，塑胶跑道上有一股白线的粉末味。"], ["nar", "他走过灯下，影子被拉长又缩回去，第三圈，第四圈……走到我面前才停下，鞋底在地上蹭了两下。"], ["say", "“你怎么下来了。”"], ["say", "“上面闷。”"], ["nar", "他没再说什么，转身往前走，我跟上。两个人的脚步声在跑道上错开半拍，一直没对齐。"]], "choices": ["下去找他", "在楼上看着", "（发一条消息）"], "n": 14}, {"lines": [["nar", "最后一门的铃响过之后，楼道像被拉开的水闸。纸屑和草稿纸从楼梯缝里飘下来，落在人肩上。"], ["nar", "我在人流里找那件洗得发白的短袖，找到了，他正被人推着往门口去，手里还捏着准考证，边角被汗浸软，卷了起来。"], ["say", "“考完了。”"], ["say", "“嗯。”"], ["nar", "警戒线在门口撤开，家长涌上来。他被撞了一下，准考证掉在地上，我弯腰去捡。"]], "choices": ["找他", "在门口等", "（跟着走）"], "n": 15}, {"lines": [["nar", "毕业那天，后黑板上“距高考0天”的粉笔字还没擦，斜着挂下来一道白灰。"], ["nar", "他站在窗边，手里捏着两张硬纸车票，边角对齐，压在拇指和食指之间。"], ["say", "“你去哪儿？”"], ["nar", "他把上面那张递过来。票面上印着同一天、同一个车次，座位挨着，一个靠窗，一个不靠窗。"], ["say", "“先去看看。”"]], "choices": ["接过", "问他去哪", "（看票上的字）"], "n": 16}]}], "endings": {"A": {"title": "两张票", "text": "两张票是同一天同一趟车，座位隔了两个。他把你那张折好，塞进你校服口袋，说别弄丢了，这个不好补。说完他把自己的票也对折了一次，折痕压在同一个位置。"}, "B": {"title": "做一遍", "text": "他去了保送那所。开学前寄来一本旧的错题本，扉页上写着：这些题我都讲过了，你自己再做一遍。字很小，写在原本印着日期的那一栏里，挤得有点歪。"}, "C": {"title": "没等到", "text": "高考结束那天雨很大，他站在校门口的屋檐下等了一会儿。人一波一波往外涌，他把伞撑开又收起来，最后没等到，伞收起来走了，地上留了一小圈干的地面。"}, "D": {"title": "一袋橘子", "text": "后来你们在不同城市的大学。有一年春节回家，在巷口碰见，他手里拎着一袋橘子，问你题还会不会做。你说早忘了，他嗯了一声，把袋子往你手里塞了一只橘子。"}}, "vigs": [{"title": "两寸", "need": 6, "lines": ["他把书往自己那边挪了两寸，空出一条线。", "那条线正好放得下一个人的胳膊肘。", "有人问他要不要换座位。", "他说不用，这样刚好。"]}, {"title": "纸条", "need": 12, "lines": ["晚自习他递纸条，字很小，写在草稿纸背面。", "从来不写多余的字，只有步骤和答案。", "有一次背面多写了一行：这题你上次错在符号。", "那张纸条被夹在书里，压得很平。"]}, {"title": "操场", "need": 18, "lines": ["高考前一晚，他在操场走了很多圈。", "灯照着跑道，影子一圈一圈叠上去。", "有人问他紧张吗。", "他说不紧张，就是想把圈走完。"]}], "route": "topstudent", "arch": "学神型同桌"};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
$('#world').textContent=D.world; $('#premise').textContent=D.premise;
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      if(/陪|等|不|别走|谢|留|帮|说|问|看|递|握/.test(t)) warm++;
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=warm/Math.max(1,total);
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; render(); };
</script></body></html>
