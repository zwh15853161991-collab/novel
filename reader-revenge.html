<style>
:root{--bg:#0f0c0b;--ink:#ece6de;--dim:#a49b90;--faint:#6f6862;--line:rgba(255,255,255,.09);
--accent:#c9a06a;--acc-ink:#1a140e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 70% at 50% 0,#1a1512,#0f0c0b 62%);color:var(--ink);
 font:17px/1.9 "Songti SC","Noto Serif SC",serif;min-height:100dvh}
.wrap{max-width:680px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px 60px}
h1{font-size:22px;font-weight:500;margin:0 0 4px;letter-spacing:.04em}

.sec{color:var(--accent);font-size:11.5px;letter-spacing:.18em;margin:20px 0 6px}
p.world{color:var(--dim);font-size:14px;margin:0}
.btn{display:inline-block;margin-top:18px;background:var(--accent);color:var(--acc-ink);border:0;
 border-radius:12px;padding:11px 20px;font-size:15px;font-family:inherit}

.her{background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:2px solid var(--accent);
 border-radius:14px;padding:11px 15px;margin:0 0 14px}

.choices button{text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);
 border-radius:12px;padding:12px 14px;font-size:14.5px;font-family:inherit}
.choices button:hover{border-color:rgba(201,160,106,.5)}

 background:linear-gradient(180deg,rgba(201,160,106,.1),transparent)}
.eth{color:var(--accent);font-size:12.5px;letter-spacing:.12em;margin-bottom:8px}

</style></head><body><div class="wrap">

<script>
const D={"name": "许照", "meta": "27 · 旧书店店主", "premise": "三年前她替人顶罪离城，如今化名回南巷开店，等一句迟来的交代。", "world": "南巷的旧书店，招牌空着半边，雨一大就漏。街坊只当新来的店主姓周。", "chapters": [{"title": "第一章 雨落在旧招牌上", "scenes": [{"lines": [["nar", "雨从屋檐的铁皮缝里漏下来，落在木地板上砸出一个小坑。许照把一只搪瓷盆挪过去，盆底积了半指深的水。"], ["nar", "门梁上悬着块旧招牌，漆掉了大半，只剩“南巷”两个字还认得出来。她踩上矮凳，用砂纸磨掉第三字的下半截，木屑混着雨点掉在袖口上。"], ["nar", "巷口卖伞的阿婆探头进来，问新东家姓什么。她把手从袖子里抽出来，指了指招牌上的空处。"], ["say", "“姓陆。陆地的陆。”"], ["nar", "阿婆哦了一声，说这铺子空了一年多，屋顶得先补，不然书要发霉。许照把砂纸折成两半，没接话。"]], "choices": ["先把屋顶补好", "留半面招牌空着", "打听隔壁的店租"], "n": 1}, {"lines": [["nar", "傍晚雨大了，门上那串铜铃响了一下又卡住。进来的女人收伞，伞尖在门槛上磕了两下，水珠子溅到书架腿上。"], ["nar", "许照从柜台后抬起眼，认了三秒，把手里那本《南货志》合上，转身去够暖壶。"], ["say", "“躲雨？坐吧。茶是粗的。”"], ["nar", "女人在靠窗的凳子上坐下，抖了抖肩上的水，环顾一圈，手指敲着桌面。"], ["say", "“这店以前死过人，你知道吗？老东家，欠了债，听说最后是替人顶了事，走的。”"], ["nar", "许照把茶推到她面前，杯沿上有一道缺口。她笑了笑，回到柜台后，把台灯往暗里拧了一格。"], ["say", "“那都是别人的旧事。喝茶。”"]], "choices": ["笑着续一杯热茶", "问死的是谁", "把灯调暗一点"], "n": 2}, {"lines": [["nar", "打烊后她从柜台底下抽出一只牛皮纸袋，倒出几张剪报，边角泛黄，其中一张从中间缺了一块，正好缺掉名字那行。"], ["nar", "台灯拉近了，纸上铅字被雨气熏得有点发潮。她伸手把卷起的角按平，指腹在那道缺口上压了一会儿。"], ["nar", "账本摊在旁边，她没把剪报夹进去，也没点火柴。她捏着那张纸站起来，走到柜台背面，掀开一块松动的木板。"], ["nar", "木板后面有个空腔，是三年前就有的。她把剪报对折，塞进去，把板子按回原处，掌根压了三下。"], ["say", "“这案子当年判得太快。”她把剪报推过来一寸。"], ["nar", "雨还在漏。盆里的水满了，溢出来一线，沿着地板缝慢慢爬向柜台。"]], "choices": ["夹进账本里", "烧掉，灰冲进水槽", "贴在柜台背面"], "n": 3}, {"lines": [["nar", "第二天中午，一个穿灰夹克的男人进门，伞都没收，水顺着裤脚滴。他没看书，先看她的脸，看了好一会儿。"], ["say", "“许……”他停了一下，“不对。你现在叫什么？”"], ["nar", "她把手里的书码正，抽出一张凳推到他跟前，动作不快。"], ["say", "“坐。外面雨大。”"], ["nar", "男人坐下，从怀里掏出个塑料皮的册子，翻开，指甲点在一行数字上，指尖压得纸发白。"], ["say", "“旧账不认人，只认数。你知道该多少。”"], ["nar", "她掀起柜台上那本账本，翻到空白页，把一支笔搁在页边，笔杆朝着他。"], ["say", "“那你报个数。写在纸上，别写在嘴上。”"]], "choices": ["客气请他坐下", "报个假数糊弄", "直接掀开账本"], "n": 4}, {"lines": [["nar", "她锁了店门往巷子深处走，雨斜着灌进领口。走到拐角，一把黑伞忽然从旁边横过来，伞沿正好压在她头顶。"], ["nar", "撑伞的是个瘦男人，伞柄握得紧，手背上有道旧疤。他看她一眼，又看前面的水洼，把伞往前送了送。"], ["nar", "她站住，抬眼。雨打在伞面上噗噗响，两人之间隔了半步。那半步地上，水正往低处流。"], ["say", "“多谢。”"], ["nar", "她把伞轻轻推回去，侧身绕过他，鞋跟踩进水洼，半条裤腿立刻贴了腿。走出四五步，她没回头。"]], "choices": ["说声多谢，走开", "问他记不记得我", "把伞借走不还"], "n": 5}, {"lines": [["nar", "夜里十一点，店已关门，铜铃挂在门内没人碰。门缝底下有人塞进来东西，一张折了两折的收据，一角是湿的。"], ["nar", "她蹲下去捡起来，就着柜台的灯看。收据是三个月前的一张旧租契回执，字迹瘦而急，末笔总往上提。"], ["nar", "她拉开抽屉，取出一个铁盒，盒盖上有一道浅凹痕。她把收据放进去，连同那张缺了角的剪报，一起压在最上面。"], ["nar", "锁扣咔的一声合拢。她把铁盒放回抽屉深处，推上，掌心在抽屉沿上停了停。"], ["nar", "外头的雨还在下。招牌上被磨掉的那半截字，在灯影里剩下一个模糊的凹。"], ["say", "“我知道了。”"]], "choices": ["收进铁盒锁好", "照着号码打回去", "夹进剪报同一页"], "n": 6}]}, {"title": "第二章 客气话里的刀", "scenes": [{"lines": [["nar", "碗沿磕在托盘上，热气贴着杯盖散开。她把茶单推过去，指尖在“白毫银针”那行点了点。"], ["say", "“这两天闷，下午准下。”"], ["nar", "对面的人掀开杯盖一条缝，又盖上。“茶价涨了，去年还没这个数。”她把杯子转了半圈，没接话。"], ["say", "“三年前那笔账，你算清了没有。”"], ["nar", "对方把茶盏放下，瓷底磕出闷闷一声，手缩回袖口里。"]], "choices": ["临走才提一句旧事", "故意留半句不说", "把账单一并给他"], "n": 7}, {"lines": [["nar", "周愔抱着一摞旧书从后门进来，纸箱边角磨在手肘上留了一道红印。他把书搁在柜台上，顺手理齐书脊。"], ["say", "“那年开庭，你坐在旁听席第三排。”"], ["nar", "周愔的手停了一下，把最上面一本《城南旧事》摞正。"], ["say", "“你站在哪一边。”"], ["nar", "他从口袋里摸出一张书签，夹进那本书里。“我站在门外。”"]], "choices": ["问他站在哪一边", "装作头回听说", "让他别再来了"], "n": 8}, {"lines": [["nar", "她拉开柜台下面的抽屉，账本摆在原来的位置，包角的牛皮纸还是朝上。翻到第三页，页码从十七直接跳到二十。再往后翻，又倒回去一页。"], ["nar", "她把账本合上，搁回抽屉，又从里屋摸出一把新锁。铜的，带两道簧。"], ["say", "“有人动过。”她合上账本，“页码乱了。”"], ["nar", "锁芯推进去的时候，柜台的木板震了一下。她把钥匙串在红绳上，打了个结，塞进围裙口袋。"]], "choices": ["按原样摆回去", "换一把新锁", "把关键页撕走"], "n": 9}, {"lines": [["nar", "门帘掀开，进来一个穿灰外套的女人，手里攥着一个牛皮纸信封。她没往书架那边看，径直走到柜台前，把信封搁在账本旁边。"], ["say", "“一点心意。你开个价也行。”"], ["nar", "许照把信封推回去，手指在信封口停了一下，抽出一张对折的纸钞。"], ["say", "“这张我收着。”"], ["nar", "女人张了张嘴，把信封收进挎包，转身时肩膀撞了一下门框。"]], "choices": ["收下，记进账本", "当众推回去", "只留一张做凭证"], "n": 10}, {"lines": [["nar", "雨落在河面上，砸出一层白麻点。他靠在栏杆上，衬衫领口歪着，酒气顺着风飘过来。"], ["say", "“我跟你说……那年的事，不是我一个人的主意……”"], ["nar", "她把手机从口袋里摸出来，屏幕贴在袖口下面，红色的点一闪一闪。"], ["say", "“当初你走……是我对不住你……”"], ["nar", "他的话被一阵雨压下去，后半截含混在喉咙里。她把手机翻过来，按了暂停。"]], "choices": ["凑近再听", "转身就走", "用手机录下"], "n": 11}, {"lines": [["nar", "巷口的梧桐滴水，一个小孩蹲在杂货店屋檐下，书包抱在胸前，头发贴在额头上。她把伞柄递过去，小孩抬头看她，没接。"], ["say", "“拿着。”"], ["nar", "小孩接了伞跑进雨里，书包在背后一跳一跳。她把外套领子竖起来，往南巷走。"], ["nar", "雨顺着脖子灌进去，鞋里灌满了水，每一步都响。走到书店门口，她在台阶上拧了拧裤脚，水淌在石板上，汇成一小股往低处流。"]], "choices": ["自己淋回去", "回头再买一把", "站在檐下等雨停"], "n": 12}]}, {"title": "第三章 她自己的活法", "scenes": [{"lines": [["nar", "她把牛皮纸袋里的东西倒在柜台上，几张复印件散开，边角卷着，最上面那张盖着红章。"], ["nar", "台灯拉过来，光压在纸上。她弯腰把墙边四把椅子搬到中间，摆成一圈，椅脚在木地板上蹭出四道白痕。"], ["say", "“明天下午三点，都来。”"], ["nar", "她拨了三个电话，每个只说这一句，说完就挂。最后一个拨完，她数了数椅子，又多摆了一把。"]], "choices": ["约所有人当面谈", "只寄复印件", "全部交给律师"], "n": 13}, {"lines": [["nar", "男人站在门槛外，伞尖朝下滴水，在青砖上积成一小滩，没进来。"], ["say", "“钱我凑齐了。名字，我也可以去说清楚。”"], ["nar", "她把手里的书翻过一页，指腹压在书脊上，没抬头。柜台上的台灯照着她半张脸。"], ["say", "“当年为什么不还？”"], ["nar", "门外的水滴到第五下，他才开口，声音比雨声低。"]], "choices": ["问他当年为什么不还", "先说让我想想", "当场应下，再改口"], "n": 14}, {"lines": [["nar", "周愔坐在窗边，手指在杯沿上转了两圈，茶一口没动，凉了。"], ["say", "“那天我在。我站在后头，一个字也没说。”"], ["nar", "她把他的杯子往桌心推了推，杯底在木头上刮出一声长响。"], ["say", "“那你替我做一件事。”"], ["nar", "她起身进里间，出来时手上多一串钥匙，放在他面前，钥匙串上还挂着半截褪色的红绳。"]], "choices": ["说我不怪你，假的", "让他替我做一件事", "把茶泼了，重倒"], "n": 15}, {"lines": [["nar", "天刚亮，梯子架在门檐下，油漆桶搁在第三级，报纸铺了一地，边角被风掀起来。"], ["nar", "她蘸漆，从招牌左端落笔，横、竖、撇，一笔一笔压住旧痕，手很稳。"], ["nar", "写到最后一个字，太阳爬到对面屋脊上，巷口有推车过去的声音，铁皮碰着石板。"], ["say", "“还差一个字。”她仰头看那半边空招牌。"], ["nar", "她把梯子挪开，仰头看那四个字——南巷书店。漆还没干，风一过，味道很冲。"]], "choices": ["写回本名", "写店名", "空着不写"], "n": 16}, {"lines": [["nar", "雨从午后开始下，越下越密。女生抱着书包进来，头发梢在滴水，在门口站了一会儿才往书架走。"], ["nar", "她抽出一本薄的诗集，翻到定价那页，又合上，抬头问价。许照报了数，用旧报纸把书包好，报纸上还印着去年的日期。"], ["say", "“姐姐，你为什么留在这儿啊？”"], ["say", "“我也不清楚。”"], ["nar", "她把收银的抽屉推回去，合上时响了一声。女生靠着门框看雨，没再问。"]], "choices": ["说这店欠我", "说我喜欢下雨", "说我也不清楚"], "n": 17}]}], "endings": {"A": {"title": "写回本名", "text": "她把旧账一笔一笔清算完，最后一页撕下来，压在新招牌背面。招牌重新刷字那天雨很小，字写回本名，笔画比原来深。夜里她关灯上楼，第一次没检查门锁。楼下书还浸着潮气，纸味慢慢散开。"}, "B": {"title": "锁进抽屉", "text": "她留下了，和周愔合伙开这间店。账本锁进最深的抽屉，钥匙挂在柜台内侧。有人问起当年的事，她说得像在讲别人，语气平得听不出情绪。只有下雨那天，她会把那本账拿出来，翻到最后空着的一页，看很久。"}, "C": {"title": "北上的车", "text": "钱和道歉她都收了，店转出去，招牌留给下一个人。收拾时她把剪报烧了，纸灰落进窗台的水渍里。北上那班车在雨里开得很慢，她抱着那本账，一路上没有翻。"}, "D": {"title": "半面空招牌", "text": "她什么都没要，走的时候把半面空招牌留在门上。新店在别的街，不欠任何人的账，也不挂名字。第一个客人是躲雨的女生，问她为什么不写招牌，她说还没想好。"}}, "vigs": [{"title": "假姓", "need": 6, "lines": ["她在招牌上只写了一个「周」字，是随手挑的姓。", "街坊叫她周老板，她应得很顺，一次没有迟疑。", "派出所登记那天，表格上那栏她写得很慢，笔尖在纸上停了一下，最后落笔还是那个字。"]}, {"title": "剪报", "need": 12, "lines": ["剪报压在柜台的玻璃下面，只露一角，字被磨得发白。", "有客人弯下身想看，她把杯子往那一角上一放：「凉了不好喝。」", "晚上打烊，她把剪报抽出来，对着灯看，看完折好，放回原处，边角对齐玻璃的边缘。"]}, {"title": "半面招牌", "need": 18, "lines": ["招牌空着半边，木板被雨泡得起了毛，钉子还留着旧孔。", "木匠说刷一遍要两天，她说不用急。", "后来木匠自己把字描了个底，还没上漆，只写了半个。", "她站在门口看了一会儿，说就这样吧，剩下的等你认出来再写。"]}], "route": "revenge", "arch": "被辜负的归来者"};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
if(D.world){ $('#world').textContent=D.world; } else { $('#secWorld').style.display='none'; $('#world').style.display='none'; }
if(D.profile && D.profile.length){ $('#profile').innerHTML = D.profile.map(([k,v])=>'<p class="world"><b style="color:#c8a37a;font-weight:400">'+k+'</b>　'+v+'</p>').join(''); }
else { $('#secProfile').style.display='none'; $('#profile').style.display='none'; }
if(D.premise){ $('#premise').textContent=D.premise; } else { $('#secPremise').style.display='none'; $('#premise').style.display='none'; }
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      if(/陪|等|不|别走|谢|留|帮|说|问|看|递|握/.test(t)) warm++;
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=warm/Math.max(1,total);
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; render(); };
</script></body></html>
