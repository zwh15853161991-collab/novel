<script>
const D={"name": "林未晞", "meta": "23 · 插画系毕业一年 ·「浮光」旧书店兼职店员", "world": "", "profile": [["性格", "话少，句子短，数到三就停。观察力太好的那种安静——别人夸她，她先怀疑；别人同情她，她会炸。"], ["习惯", "用左手撑下巴；打完草稿把纸角折起来；接电话会绕到后门去。"], ["喜欢", "雨声、柚子茶（少糖）、旧书的纸味、把没画完的东西藏起来。"], ["讨厌", "被当成需要安慰的人；「你别想太多」；有人替她做决定。"], ["家里", "老家在县城，母亲身体不好，一直催她回去考编。她答应了「再给我半年」。"], ["不知道的事", "七封退稿信她都留着。第一封夹在速写本最里面，纸已经黄了。"]], "premise": "「我不是不想画了。我是怕再画下去，就没人告诉我该停了。」", "chapters": [{"title": "序 · 书店", "scenes": [{"lines": [["nar", "雨是下午四点开始下的。先是几滴砸在遮阳棚上，像有人在外面敲门；半分钟后整条街白蒙蒙一片，行人在雨里跑成模糊的影子。"], ["nar", "你退进「浮光」的门洞，收伞。伞尖在水泥地上敲出两下湿响，水顺着伞骨往下淌，很快在脚边摊开一小块深色。"], ["nar", "这间旧书店你路过很多次，从没进来过。门楣上的木牌被雨气熏得发黑，背面用铅笔写过两个字：未晞。里面堆着几摞高过头的书，旧纸的味道从门缝漏出来。"], ["nar", "店里只有一个客人——不，是店员。她站在第四级木梯上，踮着脚，把一个泛黄的硬壳本往最高一层塞。梯子有点晃，晃得很有耐心。"], ["nar", "雨声太大，她没听见门上的铃。直到梯子又晃了一下，她才偏过头，看见门口的你，和一个正在往下滴水的伞。"], ["nar", "她说这话的时候没有生气，只是陈述。像天气预报。"], ["say", "「……」"]], "choices": ["说声抱歉，退到门边把伞收好。", "上前一步，扶住那把晃动的梯子。", "“那我先进来。”说完径直往里走。"], "n": 1}]}, {"title": "序 · 一把伞", "scenes": [{"lines": [["nar", "7 路末班的站台上只有两个人。雨斜着打进来，把候车亭的铁皮顶敲得像一口鼓。她抱着一个帆布包站在最里面，肩膀已经湿了一小片。"], ["nar", "你把伞塞进她手里，自己转身走进雨里。她还没反应过来，末班车的灯就把你照白了，白得像一张纸。"], ["nar", "车开走之后，雨还在下。你走回家，鞋里灌满了水，走一步响一声。"], ["nar", "第二天早上，那把伞挂回了书店的门把手上。伞柄缠着一圈牛皮纸，用铅笔写着两个字：谢谢。字很小，写得很规矩。"], ["nar", "你推门进去。她正在擦玻璃杯，抹布在杯口转着圈。听见铃响，她抬眼看你，又低下头，好像什么都没发生过。"], ["say", "「……」"]], "choices": ["把那张牛皮纸举给她看。", "“伞我收到了。”", "什么也不说，把纸折好放进口袋。"], "n": 1}]}, {"title": "序 · 一杯咖啡", "scenes": [{"lines": [["nar", "咖啡是滚烫的。你转身的时候手肘撞到了杯沿，整杯深褐色的水沿着桌沿流下去，正正泼在她摊开的速写本上。"], ["nar", "那一瞬间，她的第一反应不是躲，是伸手去护那一页。纸湿了，颜色化开，像一朵开坏的花。"], ["nar", "店里所有声音都停了一下。收银台的姑娘“哎呀”了一声，又识趣地闭了嘴。"], ["nar", "她说得很轻，手却在抖，抖得连本子都合不稳。她没有骂你，也没有抬头，只是把湿掉的那一页先合上，像在替谁遮羞。"], ["say", "「……」"]], "choices": ["立刻道歉，把一沓纸巾按上去。", "“我赔你一本。”", "先不说话，去柜台要一条干毛巾。"], "n": 1}]}, {"title": "第一章 雨的形状", "scenes": [{"lines": [["nar", "半小时后，雨没有停的意思。屋檐的水连成一道帘子，街对面的人在跑，伞面被风吹得翻了边。"], ["nar", "店里只有你们两个人，还有一台旧风扇在角落里空转。风扇转得很慢，把纸味、木头味、雨水味搅在一起，搅成一种很旧的气味。"], ["nar", "她在梯子上把最后一摞书摆平，跳下来。落地的时候膝盖微微弯了一下，是很习惯的动作。"], ["nar", "她把一只杯子推到你手边。玻璃杯，杯壁上一层薄薄的水汽，指印按上去能留很久。"], ["say", "「……」"]], "choices": ["“谢谢。你在这里打工？”", "“你不问问我叫什么？”", "接过杯子，先不说话。"], "n": 1}, {"lines": [["nar", "杯子是温的。握久了有点烫，得换手。柚子皮的苦味被热气顶着往上走，很淡。"], ["nar", "她坐回柜台后面，拉开抽屉，里面是橡皮、便利贴、一大盒削得很短的铅笔。她挑了一支，在指间转了一圈，又放回去。"], ["nar", "她说得很平静，好像这一整句话都在等一个人来问。"], ["say", "「……」"]], "choices": ["报上自己的名字。", "「先记住我这个人。」——最后报了名字。", "“一个总在雨天出现的人。”——她瞪着你，你只好说了。"], "n": 2}, {"lines": [["nar", "你去书架深处闲逛。书是按颜色排的，不是按类别，红的一排、蓝的一排，最后一排全是褪成灰黄的旧译本。"], ["nar", "你随手抽出一本硬壳书。纸页黏在一起，得用一点力才翻得开。翻到中间，一张便签滑出来，落在你鞋面上。"], ["nar", "你捡起来看。上面画着一个撑伞的小人，线条很轻，轻得像怕弄脏纸。伞骨一根一根数过去——七根。"], ["nar", "小人的脚下有一道很淡的水渍，画的时候笔尖可能停了很久。"], ["nar", "她不知什么时候站到了你身后，手伸出来一半，停在半空。指尖有一点铅笔灰。"], ["say", "「……」"]], "choices": ["“是你画的吧。”", "把便签夹回书里：“我看到七根伞骨了。”", "收进口袋，走了两步，又放回书里。"], "n": 3}, {"lines": [["nar", "八点，雨大到雨刷都来不及的那种程度。玻璃门外面什么也看不清，路灯只剩几团橘色的光。"], ["nar", "她锁门，把钥匙在指间绕了一圈，抬头看天，很轻地叹了一口气。那口气在潮湿的空气里几乎看不见。"], ["nar", "她说这话的时候没有看你，眼睛盯着屋檐往下淌的水，好像在跟水说。"], ["say", "「……」"]], "choices": ["把伞递给她。", "“一起走吧，我的伞很大。”", "“我在这儿等，我去买一把。”"], "n": 4}, {"lines": [["nar", "伞下的空间窄得过分。她的肩膀和你的手臂之间隔着一层湿布料，能感觉到温度，也能感觉到那层布很薄。"], ["nar", "雨声盖住了脚步。路灯光落在水洼里，被雨点敲成一块一块的碎月亮，踩上去就散。"], ["nar", "她走得很慢。慢到你以为她在等什么，又慢到你觉得她只是想在你身边多站一会儿雨。"], ["say", "「……」"]], "choices": ["把伞悄悄往她那边偏一些。", "伸手牵她。", "“雨落在伞上，像翻书。”"], "n": 5}, {"lines": [["nar", "她住的老楼没有电梯。楼梯间的声控灯坏了一半，走两步亮一下，暗下去的时候能听见雨水从伞尖滴到台阶上的声音。"], ["nar", "三楼，靠窗那间。窗台上摆着一个空的玻璃瓶，瓶口插着一支削得很尖的铅笔，笔尖朝上，像一朵很硬的植物。"], ["nar", "她在门洞里收伞，抖了两下，水滴在台阶上溅开。然后她转过身，看着你，好像要说什么，又好像只是看看。"], ["nar", "她顿了顿。楼道的灯在这时候暗了一下，又亮起来。"], ["say", "「……」"]], "choices": ["把伞递给她，点了下头", "“明天几点？”", "“周末……有空吗？”"], "n": 6}, {"lines": [["nar", "第二天你带了两杯柚子茶，一杯正常，一杯少糖。塑料袋在手上晃，杯壁的水汽把袋子洇出一层白。"], ["nar", "推门的时候她正在贴价格签。看见你手里的袋子，她先愣了一下，然后笑了。"], ["nar", "她笑起来的时候，眼睛会先弯，嘴角才跟上，像是两台仪器先后启动。"], ["nar", "她接过那杯，低头看了一会儿杯盖上的水珠，好像那上面写着什么。"], ["say", "「……」"]], "choices": ["“你昨天那杯喝到最后才加糖。”", "把糖包推到她那边", "“你笑起来，比昨天好看。”"], "n": 7}, {"lines": [["nar", "傍晚她在后门接电话。门没关严，声音一串一串飘进来，被雨打得很碎。"], ["nar", "对面说了很久。她一直没插话，只偶尔“嗯”一声，声音越来越低，低到后来几乎听不见。"], ["nar", "挂了之后她在那里站了很久。后门外是一堵湿墙，墙上爬着半死的爬山虎。"], ["nar", "回到店里的时候，她手背擦过眼睛，只说了一句：「外面风大。」"], ["say", "「……」"]], "choices": ["“家里的事？”", "装作没听见，把书翻到下一页。", "递一张纸巾，什么也不问。"], "n": 8}, {"lines": [["nar", "打烊之前，她在收银台后面写什么，写完撕下来，又揉掉。纸团在脚边堆了三个。"], ["nar", "她把手里的笔放下，笔尖抵着桌面，力气有点大。"], ["nar", "说完她自己也觉得这话奇怪，补了一句：「不是那种地方。是……旧站台。我小时候常去。」"], ["say", "「……」"]], "choices": ["“好。”", "“去哪儿？”", "“随时。”"], "n": 9}]}, {"title": "第二章 未完成的画", "scenes": [{"lines": [["nar", "隔了一天，雨小了一些，成了很细的、落在脸上没有声音的那种。她带你穿过旧城区的巷子，两边是关着门的裁缝铺和修表摊。"], ["nar", "路面上全是水洼。她走得很慢，右脚总是绕开最亮的那片水，像在遵守一条只有她知道的规则。"], ["nar", "然后她一脚踩进去，水花溅到两个人的裤脚上。"], ["nar", "说完她自己的耳尖先红了，红得很快，一直红到耳廓。她加快了两步，走到你前面去。"], ["say", "「……」"]], "choices": ["“那我多踩几次。”", "学她慢慢走，也不说话。", "“你在数什么？”"], "n": 1}, {"lines": [["nar", "书店下午没有客人。她蹲在书架和柜台之间的空地上，速写本摊在膝头，铅笔搁在耳朵上。"], ["nar", "翻开那页，一把伞已经画完。伞骨七根，线条很轻；伞下空着，只留两条辅助线。"], ["say", "「……别站在后面看。」"], ["nar", "她把本子往怀里收了半寸，又松开，停在半合的位置，像按住一扇要关的门。"], ["nar", "柜台上压着一张便签，一行字写了又划，划掉以后底下只剩一个数：0.3。纸角被水气泡软，卷了起来。"], ["say", "「画不下去。笔不对。」"]], "choices": ["「伞骨我数过了，七根。」", "把她耳朵上的铅笔取下来，放回本子上", "什么也没说，退到门口"], "n": 2}, {"lines": [["nar", "巷子尽头是一段废弃的站台。铁轨被雨泡得发黑，枕木间长满了草，草尖上挂着水。远处的信号灯还亮着，红得没有意义。"], ["nar", "站台的雨棚缺了一角，雨水从缺口垂下来，像有人在上面挂了一条湿毛巾。她坐到长椅上，拍了拍旁边的位置。"], ["nar", "然后从帆布包里拿出速写本，很轻地放在腿上，手指在封面上按了一下才翻开。"], ["nar", "一整本，都是撑伞的人。同一个人，从不同的角度，画了无数遍：侧脸、背影、只画一只手和半把伞、只画一双沾了泥的鞋。"], ["nar", "有几页被撕掉了，撕得很干净，只剩毛边。剩下那些，铅笔线都起过很多次稿，擦了又画，纸面起了毛。"], ["nar", "最新的一页还空着一半。伞画完了，伞下的人是空的，只有两条淡淡的辅助线。"], ["say", "「……」"]], "choices": ["“这个撑伞的人……是我。”", "“为什么只画伞下的人？”", "一页一页往后翻，什么也不说。"], "n": 3}, {"lines": [["nar", "雨棚的缺口那边，水一层一层往下掉。她把本子从你手里拿回去，合上，两只手压在封面上。"], ["nar", "她问得很慢，眼睛看的是铁轨，不是画。好像只要不看着，答案就不会伤人。"], ["say", "「……」"]], "choices": ["指着其中一张，说出具体哪里好。", "“很好。”", "“你自己觉得呢？”"], "n": 4}, {"lines": [["nar", "她把手机递过来，屏幕上是一封邮件。退稿信只有三行，最下面是已经看过很多遍的“感谢您的投稿”。"], ["nar", "她说这个数字的时候语气很平，像在念一个背过很多遍的数。"], ["nar", "远处有列车从别的线上过，轰的一声，站台上的积水上浮起细细的波纹。"], ["say", "「……」"]], "choices": ["什么也不说，就坐在她旁边，把伞往她那边挪。", "“那就第八次。稿子我帮你整理，投之前你自己看一遍。”", "“要不……先画点别的？”"], "n": 5}, {"lines": [["nar", "她把本子合上，声音第一次变硬。硬得很干脆，像一块玻璃被人从中间掰断。"], ["nar", "她站起来，站台的石板湿滑，她晃了一下，扶住椅子。"], ["nar", "雨忽然大了一阵，砸在铁皮棚顶上，像有人在上面走。她别过脸，肩膀在抖，抖得很轻，很用力地压着。"], ["say", "「……」"]], "choices": ["“对不起，我越界了。”", "“我确实不懂。所以我想听你说完。”", "把书合上，放回原处"], "n": 6}, {"lines": [["nar", "你到的时候她已经在搬了。书架最下面两层要清空，纸箱摞在门口，箱子上用马克笔写着文学、画册、不要了。"], ["nar", "她抱一箱书要停两次。停的时候下巴抵在纸箱边缘，喘得很轻，像是怕吵到谁。"], ["nar", "屋子里的湿气重，玻璃上全是水。她的手冻得发红，指尖是那种被冷过的、有点透明的红。哈气的时候，手指在抖。"], ["say", "「……」"]], "choices": ["脱下外套披在她身上。", "“你手很凉。”伸手握住。", "“我买了手套，先戴着。”"], "n": 7}, {"lines": [["nar", "八点十七分，整条街的灯一起灭掉。"], ["nar", "黑暗里最先响起来的是雨。刚才还有冰箱、风扇、日光灯在响；现在全停了，雨就一层一层地涌上来，像把整座房子包了进去。"], ["nar", "你们在书店中间，谁都没有动。你能听见自己的呼吸，也能听见她的。"], ["nar", "她叫你的名字，声音比平时轻，轻到要很努力才听得清。"], ["nar", "停顿了一下，她又说：「不是那种怕。是一个人待着的那种怕。」"], ["say", "「……」"]], "choices": ["在黑暗里牵住她的手。", "说一个很冷的笑话。", "“我跟你说个秘密。”"], "n": 8}, {"lines": [["nar", "第三次退稿信是当面退的。编辑把稿子放在柜台上，往外推了两寸。"], ["nar", "她伸手去拿，拿到一半停住，先把手在围裙上擦干净。"], ["say", "「这个……是哪里不行。」"], ["nar", "编辑说了两句，她一直点头，点得很快。人走了以后，她把稿子对折了三次，折成很小一块。"], ["nar", "她没哭。把折好的稿子塞进书架最里面那一层，转身问你：「要不要喝点热的。」"]], "choices": ["「我看了，我觉得好。」", "把那块折好的稿子抽出来，摊平", "什么也没说，去接水"], "n": 9}, {"lines": [["nar", "电一直没有来。后来你打开手机的灯，光柱里全是浮尘，慢慢地转，像雪。"], ["nar", "她坐在地上，膝盖抱着，下巴搁在膝盖上。灯光从下往上照，把她的睫毛照成一排很短的影子。"], ["nar", "她没有看你。问得也很平，平到像早就想好了要问，只是一直没找到地方。"], ["say", "「……」"]], "choices": ["“别走。”", "“我尊重你的决定。但我会记得你。”", "站在门口，没让开路"], "n": 10}, {"lines": [["nar", "十一点，她站起来，拍了拍裤子上的灰，从包里拿出那本速写本。"], ["nar", "她把本子放进你手里，很用力地按了一下，按得你的手掌都凹下去。"], ["nar", "她说这话的时候看着你，眼睛在手机的光里亮得很清楚。"], ["nar", "门外的雨已经小成了雾。街对面的招牌歪了，一直没修。"], ["say", "「……」"]], "choices": ["“台风一停我就还你。”", "“下一页画什么？”", "“那你答应我，画完给我看。”"], "n": 11}]}, {"title": "第三章 雨停之前", "scenes": [{"lines": [["nar", "台风过境那两天，风把雨吹成横的。街上的树被剪掉了半边，断枝堆在路边，像谁随手扔下的骨头。"], ["nar", "第三天下午，雨小了一点，风还在。书店门玻璃上贴着胶带，一横一竖，贴了一墙的叉。"], ["nar", "你把速写本放回她手里。她翻了翻，什么也没说，把它塞进纸箱最上面。"], ["nar", "她已经把最后的东西收完了。收银台上压着一张车票，边角被水汽浸软：后天，十点零七分。"], ["nar", "车票下面压着一张便签，写着几行采购清单。最后一行被划掉了——“再买一盒 0.3 的笔”。"], ["say", "「……」"]], "choices": ["拿起车票看一眼。", "什么也不问，先帮她把箱子搬上车。", "“你要回去了？”"], "n": 1}, {"lines": [["nar", "雨在半夜停过一阵，天亮又落下来。水顺着门檐往下滴，砸在石阶上，声音是闷的。"], ["nar", "她把一摞画纸搬下阁楼。最上面那张边角卷着，纸上是一把没撑开的伞，只画了伞柄。"], ["say", "「这些不要了。装箱。」"], ["nar", "柜台上摊着那把伞，伞面撑开晾着，伞骨上还挂着水珠，一只能看见七根。"], ["nar", "伞柄缠的牛皮纸换了新的一圈。铅笔字写到一半停住，最后那道笔画悬着，没有落下去。"], ["say", "「纸用完了。就写到这儿。」"]], "choices": ["「写不完的那半句，我记着。」", "把伞收好，靠在门边", "「伞先放我这儿。」"], "n": 2}, {"lines": [["nar", "她靠在门口的纸箱上，把雨衣的帽子放下来。头发有点乱，被雨气压得贴着头皮。"], ["nar", "她笑了一下。这个笑很标准，先有嘴角，再有眼睛，顺序和之前是反的。"], ["nar", "雨棚上的水滴下来，落在她脚边，一下，一下。"], ["say", "「……」"]], "choices": ["“挺好的。除了你笑起来不像在笑。”", "“那你呢。你想留吗？”", "“你在怕什么。”"], "n": 3}, {"lines": [["nar", "最后一箱书搬上了租来的小货车。司机在车上抽烟，把烟灰弹在雨里。"], ["nar", "她裹在雨衣里，帽沿往下滴水。她看着你，像在等什么，也像在告别。"], ["nar", "这种时候，人说的话会变得很重。每一句都像要在雨里留下痕迹。"], ["say", "「……」"]], "choices": ["“林未晞，我喜欢你。”", "“我送你到车站。”", "“有一句话，我想等雨停再说。”"], "n": 4}, {"lines": [["nar", "她没有立刻回答。风把雨丝吹成斜的，落在她的帽檐上，一滴，两滴。"], ["nar", "货车司机按了一声喇叭。她抬手示意，没有回头。"], ["nar", "她终于抬起头。眼睛是红的，但没有要哭的样子。"], ["say", "「……」"]], "choices": ["“我不催。”", "把伞整个倾向她，自己站进雨里。", "吻她。"], "n": 5}, {"lines": [["nar", "两天后，十点零七分。站台上风很大，把人的衣服吹得贴在身上。LED 屏上的车次一格一格翻，每翻一次就响一声。"], ["nar", "她把行李放在脚边，把伞折好，挂在你手腕上。"], ["nar", "检票口开了。她走进去，走到一半，回过头隔着玻璃看了你一眼。"], ["nar", "她的口型动了三下。你没有听清。车开走的时候，雨又开始下了。"], ["say", "「……」"]], "choices": ["什么也不说，只是站着。", "挥手。", "追上去，敲玻璃。"], "n": 6}, {"lines": [["nar", "她把雨衣的帽子放下来，头发立刻被打湿，一绺一绺贴在脸侧。"], ["nar", "她看着你，很平静。平静得让人心里发慌——那种平静不是想清楚了，是把所有话都咽下去之后的安静。"], ["nar", "风从巷口灌进来，把她的外套吹开一角。她没有伸手去按。"], ["say", "「……」"]], "choices": ["“那就现在说。林未晞，我喜欢你。”", "“好。那我等。”", "把她淋湿的头发拨到耳后。"], "n": 7}, {"lines": [["nar", "那天晚上雨停了一会儿。云裂开一道口子，路灯的光斜斜地照下来，像有人把世界擦了一下。"], ["nar", "她的车是后天十点零七分。你手机里还留着那张采购单的照片，最后一行被划掉了。"], ["nar", "有些话在雨里说完了，有些话还留在伞骨上，等着下一次下雨。"], ["say", "「……」"]], "choices": ["看看她最后留下的东西。", "在雨里再站一会儿。"], "n": 8}]}, {"title": "第三章 · 最后", "scenes": [{"lines": [["nar", "雨停了。她站在书店门口，手里拿着那张后天的车票。"], ["say", "「……」"]], "choices": ["把话说出口", "拉住她，不让她走", "什么也没做，松开手"], "n": 1}]}], "endings": {"A": {"title": "雨停之后", "text": "两天后，十点零七分。你在检票口把她拉了回来。\n她骂了你一句，很难听，眼睛却是亮的。检票员在雨里笑，说这年头还有人把要走的姑娘拽回来。\n后来她在书店最里面那面墙上办了一次小展，主题叫《撑伞的人》，一共十二张。第一张挂在最高的地方，画的是雨天里一个把伞倾向别人的背影。\n画的右下角有一行很小的字：不催我走的人。\n「白鹭」过后，南方还是常常下雨。现在你们共撑一把伞，她依然走得很慢，依然在数水洼。\n只是走到水最深的地方，她会故意踩一脚，然后回头看你的裤子。"}, "B": {"title": "晴天预报", "text": "半个月后，她自己投出去的第八份稿子有了回音。编辑说，想约她见一面。\n她站在书店门口，手里还捏着那张车票，很久没说话。边角已经被水汽泡软了。\n「我妈会骂我的。」她说。然后她把车票撕成两半，扔进雨里，「不过她骂我，我也听得见。」\n后来她在书店最里面那面墙上办了一次小展，只挂了三张。她说剩下的等画好了再说。\n开幕那天她把你安排在门口，说：你站这儿，别人进来第一眼看到的就是撑伞的那个。\n你在门口站了一整个下午。谁进来都先看你一眼，再去看墙上的画。\n你没有告诉她，其实你只是想第一个看见她笑。\n那本素描本最后被放在柜台最下层，和旧账本摞在一起。\n她后来在城南一家书店做事，不再画画。"}, "C": {"title": "同撑一把伞", "text": "你还是送她去了车站。一路上你们谁都没有说话，伞一直偏向她那边，你的左肩全湿了，她假装没看见。\n她进站之后回头，隔着玻璃用口型说了三个字。你没听清，也不想问。\n秋天的时候，你收到一个没有署名的信封。里面是一张画：雨天，两把伞，一把空着。\n背面写着地址，还有一个字——「来」。\n你把画夹进那本旧书里，翻到中间那一页。便签还在，七根伞骨，一根不少。\n后来你再路过那条街，橱窗里换了一盆绿植，摆得整整齐齐。\n她每天仍旧六点开门，先把伞挂好，再翻开那本没画完的。"}, "D": {"title": "雨一直下", "text": "后天十点零七分，她走了。\n书店照常开门，风扇照常空转。新来的店员问你找什么，你说随便看看。\n你在最高那一格找到一本硬壳的旧书，中间夹着一张便签，上面还是那个撑伞的小人。\n你不会画，所以你把便签放回原地，合上书，像合上一封没有寄出的信。\n雨停了很久之后，你才想起来：那天在站台上，她其实回过头。而你只顾着低头看鞋，没看清她口型说的是什么。\n再后来你搬家，那张便签没带走，夹在旧书里，一起卖给了下一家书店。"}}, "vigs": [{"title": "那本他找的", "need": 0, "lines": ["送货的师傅把新到的书搬进店里，她清点完抽出其中一本放到柜台最里侧，不在上架的那一摞里。", "「这本先留着。上次有个人问过，他可能会来拿。」", "她把书脊朝里搁好，用一本字典挡在前面，拿抹布擦了擦柜面。"]}, {"title": "画扣过去", "need": 0, "lines": ["有人把一本刚到的画册随手翻开放在柜台上压了一杯水，她走过去把水杯拿开，画册合上翻面扣在台面上。", "「别把水搁画上。」", "她把水杯搁到窗台最远处，转身去后屋没回头。"]}, {"title": "书脊朝外", "need": 0, "lines": ["她在书架前停了一下，伸手把第二排歪了的两本书抽出来转九十度，书脊朝外重新插好，跟旁边的齐平。", "「脊朝外才看得见书名。书架不是摆设。」", "她用指腹沿书脊边缘抹了一遍确认没有翘出来的，转身去柜台后面泡茶。"]}, {"title": "青田街那家", "need": 0, "lines": ["她翻书架底层翻出一本封皮发脆的素描本，扉页写着青田街四十七号，日期是五年前。", "「青田街那家画材店，老板姓周，关门前最后一次去，他送了我一整盒马利炭笔。十二支，一支没拆。」", "她把素描本合上插回原位，手指在书脊上停了一下才松开。"]}, {"title": "书不收了", "need": 0, "lines": ["一个拎着编织袋的老人把一摞旧书搬到柜台上说要卖，她翻了几本，大部分是过期的教辅和杂志。", "「这几本品相太差了，没法上架。您拿回去吧，我不收了。」", "老人走后她把留下的一本诗集插进书架最里排，用旁边两本书挡住。"]}, {"title": "那天没有雪", "need": 0, "lines": ["她把一本画册翻到某一页停在柜面上，你随口问这页画的是什么时候的事，她手指压在纸面上没松。", "「……那天没有雪，画的时候手不抖。后来就再没画过那种天。」", "她翻过那页用另一张画压住，拿起旁边的抹布去擦根本不脏的柜台。"]}, {"title": "擦那块玻璃", "need": 0, "lines": ["打烊后她把店面灯调暗，搬了张凳子去擦橱窗内侧那块玻璃，擦到一半发现纸巾用完了。", "「……又忘买。」", "她从口袋里摸出一支秃头铅笔，在玻璃水雾上画了一条鱼的轮廓，看了两秒，用袖子抹掉了。"]}, {"title": "没画完的", "need": 0, "lines": ["你从书架后摸出一张画了一半的速写，正面朝下扣在柜面上。她伸手要翻，你按住纸角。", "「别翻。那张还没画完，画完了我自己给你看。」", "她收回手，坐回窗边的旧沙发，翻开一本没拆塑封的书，不说话了。", "「……行。那我等。」"]}, {"title": "第十二张", "need": 0, "lines": ["画到第十二张的时候，她在背面写了日期，写上天气，然后停住。", "前面十一张的背面都只写天气，没写别的。这一张她多写了一行，写得很小。", "「要是有人看得懂，就看得懂吧。」", "她把画翻过去，正面朝上，晾在窗台上。"]}, {"title": "关灯", "need": 0, "lines": ["打烊以后，书店要留一盏灯。她每天关灯的顺序都一样：先把靠窗的那盏关掉，最后才是柜台。", "今天她关到一半，停在第四盏前面。", "「你先别暗。」", "她对着那盏灯说了一句，然后自己也觉得好笑，把它关了。", "黑下来以后，她在门口站了一会儿，等眼睛适应。"]}, {"title": "第七封", "need": 0, "lines": ["她把七封退稿信按日期排开，铺在柜台上。", "第一封已经被翻得起了毛边。她用食指把折角一一压平。", "「第七封。」", "她数到第七封的时候停住，然后从抽屉里拿出第八张信纸。", "写地址的时候，笔尖抖了一下。"]}], "route": "wan", "arch": ""};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
if(D.world){ $('#world').textContent=D.world; } else { $('#secWorld').style.display='none'; $('#world').style.display='none'; }
if(D.profile && D.profile.length){ $('#profile').innerHTML = D.profile.map(([k,v])=>'<p class="world"><b style="color:#c8a37a;font-weight:400">'+k+'</b>　'+v+'</p>').join(''); }
else { $('#secProfile').style.display='none'; $('#profile').style.display='none'; }
if(D.premise){ $('#premise').textContent=D.premise; } else { $('#secPremise').style.display='none'; $('#premise').style.display='none'; }
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      if(/陪|等|不|别走|谢|留|帮|说|问|看|递|握/.test(t)) warm++;
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=warm/Math.max(1,total);
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; render(); };
</script></body></html>
