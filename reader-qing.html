<script>
const D={"name": "顾青梧", "meta": "29 · 青梧建筑事务所合伙人", "premise": "「坐。咖啡让人给你端。」", "world": "做事狠，话少，习惯发号施令。真正在意的东西说不出口。", "chapters": [{"title": "第一章 归来", "scenes": [{"lines": [["nar", "六年没回这座城。出租车从机场开到老城区，你路过那栋玻璃楼——青梧建筑事务所的招牌挂在十七层，灯亮着。"], ["nar", "她约你在事务所的会议室见。前台把你带到门口，门没关，你推门进去，她背对着你站在窗前，手里捏着一支红笔，桌上摊着一张总平面图。"], ["nar", "她没回头，听见脚步声就说："], ["say", "「坐。咖啡让人给你端。」"], ["nar", "你坐下。桌上放着一份「顾问协议」，甲方是她的事务所，乙方是你。最后一页她已经签了字，字迹跟六年前一样，横平竖直，没有多余的笔画。"]], "choices": ["翻开合同先看条款", "「六年不见，你还是不回头说话。」", "「先不急，你让我来到底做什么。」"], "n": 1}, {"lines": [["nar", "她转过身来。六年了，她瘦了，颧骨更高了，头发剪到肩膀，不像当年那种长得能扎马尾的样子。她看了你一眼，目光很短，然后看回图纸。"], ["say", "「城南旧改，规划局要求保留原有立面。」"], ["say", "「我团队做了一版，不行。你当年那个立面重构，是我见过最好的。」"], ["nar", "她说「你当年做的」这五个字的时候，语速没变，重音没变，像在念图纸编号。你盯着她侧脸，她耳根没有红。"]], "choices": ["「那个方案不是你的吗。会议上你说是你做的。」", "「你找到我了，说条件吧。」", "「你当年说'这种水平能待在这是我罩着'，现在又要我回来？」"], "n": 2}, {"lines": [["nar", "她把红笔搁下了。笔滚了两圈，碰到图纸上的一块橡皮，停了。"], ["nar", "那块橡皮被磨成了一个斜面，用了很久。"], ["say", "「当年的事不用提。你现在是顾问，合同签了就干活。」"], ["nar", "会议室的空调嗡嗡响。窗外开始下雨了，雨点打在玻璃幕墙上，歪歪扭扭地往下淌。她站起来把百叶帘调了个角度，光暗了半格。"]], "choices": ["「行，干活。但图我得先看。」", "把笔搁下，没接这句", "把红笔在图纸上按了一下"], "n": 3}, {"lines": [["nar", "她从柜子里翻出一卷图纸，扔在桌上。不是新方案——是你六年前做的那个立面重构，A2图幅，四张，折痕都磨白了，边角起了毛。"], ["nar", "你展开第一张。右下角有你的签名和日期，旁边被人用铅笔写了一行小字：「存档·勿动」。是她的字。"], ["say", "「图纸都在。你拿去看，明天给我意见。」"], ["nar", "她说完就要走。走到门口停了一下，手搭在门把上，没回头。"]], "choices": ["「顾青梧。」叫住她", "什么都不说，让她走", "「这图你留了六年？」"], "n": 4}, {"lines": [["nar", "她站在门口，手没离开门把。雨声大了，走廊的灯是感应的，亮了一下又灭了。"], ["nar", "她鞋边沾着水，脚垫上洇开一小片深色。"], ["say", "「图纸是项目资产，当然留。」"], ["nar", "她拉开门，走出去之前说了最后一句，声音跟前面一样硬，但语速快了一拍："], ["say", "「明早九点，别迟到。」"], ["nar", "门关上了。你坐在空会议室里，面前是四张图纸，右下角你的签名已经褪色了，旁边那行「存档·勿动」倒还清楚。"]], "choices": ["把图纸卷起来带走，明天再看", "在图纸背面写一行字：「我来了。」", "坐了一会儿，把合同签了"], "n": 5}, {"lines": [["nar", "那天晚上你做了个梦。不是噩梦，是六年前那间会议室。"], ["nar", "你站在投影旁边，讲到退线那一段。她坐在长桌另一头，手指敲着桌面，一下，一下。"], ["say", "「这段重做。你这种水平，能待在这儿已经是我罩着你了。」"], ["nar", "梦里她说完这句，抬头看了你一眼。你以前总觉得那一眼是不屑，现在想起来，更像是说完就后悔了。"]], "choices": ["醒来后把这段写在纸上", "第二天问她，那天她到底在想什么", "什么也不说，把它当作已经过去的事"], "n": 6}]}, {"title": "第二章 对账", "scenes": [{"lines": [["nar", "第二天。事务所十七层，她的办公室门开着。桌上多了一样东西——一个旧模型，巴掌大，是当年你们一起做的社区图书馆草模，你切的纸板，她上的色。"], ["nar", "模型的缺角用胶水粘过，粘得很拙，胶痕发白。她没提这东西是怎么回来的。"], ["nar", "模型缺了一角，是屋顶东面的转角，纸板翘起来了，用透明胶粘过，胶也黄了。"], ["say", "「坐。模型翻出来的，你看看还能不能用。」"], ["nar", "她没解释为什么翻出来。她把一叠新图纸推过来，指着总平面上的红线："], ["say", "「规划局砍了一块，退线多了两米。原来的立面比例全废了。你重做。」"]], "choices": ["「这是我们当年一起做的模型。」", "「退线两米，那我得重新算比例。」先看图纸", "「你让我重做？当年这方案是我的。」"], "n": 1}, {"lines": [["nar", "下午三点，她把改过的立面摊在长桌上，用红笔在两处各画了一个圈。笔压得很重，纸背透出红。"], ["nar", "桌角摆着一个模型，旧的，缺了一角。底座侧面还留着一道胶痕，刮歪了，干了六年。"], ["say", "「这两处不行。比例不对，重画。」"], ["nar", "你俯身看。她圈住的正好是那两处模数节点，旧方案里你推了三个晚上才推出来的两笔。"], ["say", "「明天早上要。图纸放这儿，别带回去。」"], ["nar", "她把笔帽扣上，扣了两次才扣住。窗外的雨敲在玻璃上，一下一下，很密。"]], "choices": ["「这两处是模数核心，不是比例。」", "拿起红笔，在圈旁边照原样再画一遍", "「你说不行，给个理由。」"], "n": 2}, {"lines": [["nar", "你把新图纸展开，跟旧方案并排放。退线多两米，立面确实要重来。但旧方案的结构逻辑还能用——你当年花了三个月推导的那套模数关系，不是白做的。"], ["nar", "她站在你旁边看，没坐。你能闻到她身上有烟味，淡的，不像她以前——她以前不抽烟。"], ["say", "「结构你定。立面我团队配合。三天，初稿。」"], ["nar", "她说「三天」的时候语气是命令，但她手指点在旧方案的模数轴线上，点的是你推导的那条线。她知道这套逻辑是谁的。"]], "choices": ["「三天太赶了，能不能宽两天。」", "「三天就三天，你别催。」", "「你以前不抽烟。」"], "n": 3}, {"lines": [["nar", "档案室最里面那一格，标签上的日期是六年前。你抽出来的时候，纸边已经发黄。"], ["nar", "整份方案都在：你的手绘、你的标注、被划掉又重写的节点。扉页上还有一行铅笔字，是你的名字。"], ["nar", "她站在门口，没有走进来。"], ["say", "「我留着。」"], ["nar", "她说得很轻，像怕声音大了会把这叠纸吹散。"]], "choices": ["把扉页翻到正面，让她看那个名字", "「留着做什么。」", "把档案放回去，什么也不说"], "n": 4}, {"lines": [["nar", "她手顿了一下，从口袋里摸出一盒烟，看了看，又塞回去了。没点。"], ["nar", "烟盒是压瘪的，边角起了毛，显然揣了很多天。"], ["say", "「三年前开始的。熬夜多。」"], ["nar", "她走回自己的位子坐下，第一次在你面前坐下来。以前开会她从不坐，站着，像随时要走。"], ["say", "「初稿的事定了。别的你不用管。」"]], "choices": ["「你为什么开始熬夜。」", "低头继续改图，没接这句", "「你要是扛不住，可以说。」"], "n": 5}, {"lines": [["nar", "下午，你在她办公室改立面。她出去了，门没锁。你翻她桌上的项目档案，翻到一份会议纪要——日期是六年前，就是那场会。"], ["nar", "纪要上写着：「方案汇报人：顾青梧。协助：——」后面是空的。你的名字被删了，格子留着一个白框。"], ["nar", "她什么时候删的？会议当天？还是后来？档案装订过了，那一页有拆开重订的痕迹，订书钉换过，位置错了一点。"], ["say", "「……」"]], "choices": ["把纪要放回去，不提", "等她回来，把纪要摆到桌上", "拍一张照，放回原处"], "n": 6}, {"lines": [["nar", "她回来了，看见桌上的纪要没动过（或者你以为她没看出来）。她坐下来，翻了翻你改的立面初稿，拿红笔圈了两处。"], ["say", "「这两处不行。比例不对。」"], ["nar", "你看了一眼——那两处恰好是旧方案里你推导的模数节点。她说「不行」，但她圈的正是你当年最好的两笔。"], ["say", "「重画。明天给我。」"]], "choices": ["「这两处是当年的模数核心，不是比例问题。」", "「你说不行就不行？给个理由。」", "「你圈的这两笔，是你当年唯一没改的地方。」"], "n": 7}, {"lines": [["nar", "她笔尖停了。红笔戳在图纸上，墨水洇了一个点。她没抬头，但你看见她喉结动了一下。"], ["say", "「……这两处，我留的。」"], ["nar", "这是她第一次承认旧方案里有你的东西。不是道歉，是陈述。语气还是硬的，但「我留的」三个字说得比前面慢。"], ["say", "「明天改完给我。不用解释为什么。」"], ["nar", "最后半句又是命令了。她站起来，把窗户推开了一条缝，雨声灌进来。她背对着你，点了一支烟。"]], "choices": ["「我不解释。但你心里清楚。」", "什么也不说，收图纸走", "「这烟，是熬夜那年还是心虚那年？」"], "n": 8}]}, {"title": "第三章 问句", "scenes": [{"lines": [["nar", "第三天。你把初稿改完了，两处模数节点保留，但调了比例，绕过了规划局的退线问题。她翻了一遍，没圈红。"], ["nar", "她把图纸放下，靠在椅背上。窗外还在下雨，玻璃幕墙上全是水痕，光线灰蒙蒙的。"], ["say", "「这版可以。」"], ["nar", "三个字。你等她接着说，她没说。她看着窗外，手指在桌上敲了两下，像在犹豫什么。然后她开口了，第一个字带着一点上扬的音调，你从来没在她嘴里听过："], ["say", "「你要不要……看一下后面的施工节点。」"], ["nar", "不是「看施工节点」。是「你要不要」。她第一次用了问句。"]], "choices": ["把图纸接过来，翻到立面那页", "「你在问我？」", "「施工节点不用问我，你团队的人能做。」"], "n": 1}, {"lines": [["nar", "雨停了半小时，又落下来。她把那只缺角的模型从柜子最上层搬下来，放在窗前，缺角朝里。"], ["nar", "模型上落了灰。她拿袖子擦了一下，擦出一道亮痕，手停在那儿，又收回去。"], ["say", "「这个一直在这儿。项目结了，就没人看了。」"], ["nar", "她站在窗边，手指搭在模型底座上，敲了两下，像在数什么。"], ["say", "「你要不要……把它带回去。」"], ["nar", "走廊的感应灯亮了一下。门牌上刻着她的名字，下面还留着一格空的，露着没刻的白。"]], "choices": ["「这一格，是留给谁的。」", "把模型抱起来，缺角朝你这边", "「带回去做什么。放着。」"], "n": 2}, {"lines": [["nar", "施工节点图铺在桌上。你逐张看过去——结构合理，材料选得准，但有三处节点的逻辑跟她六年前的风格不一样，倒像你当年的思路。"], ["nar", "你抬头看她。她在翻另一叠文件，没看你，但像知道你在看她。"], ["say", "「那三处是我按你旧方案推的。不一样的话，你改。」"], ["nar", "又是命令。但「你改」之前，她加了一个停顿。像把「要不要你改」吞掉了前半截。"]], "choices": ["「不用改，那三处很好。」", "「你学了我的做法，用了六年？」", "「你按我的方案做了六年，嘴上还说是你的。」"], "n": 3}, {"lines": [["nar", "她没接话。把文件合上，站起来，走到窗边。烟盒在窗台上，她拿了一支，没点，夹在指间转。"], ["nar", "雨小了。窗外的玻璃楼反光，你能看见她映在玻璃上的脸——虚的，看不清表情，但嘴角是绷着的。"], ["say", "「项目完了你就走。」"], ["nar", "又是命令。但她说完之后，过了大概三秒，补了一句。声音比前面低半度，低到你差点没听清："], ["say", "「……还是你打算多留几天。」"], ["nar", "问句。第二个。她还是没回头。"]], "choices": ["「项目完了再说。」", "「你在留我？」", "「我走不走跟你没关系了。」"], "n": 4}, {"lines": [["nar", "她回过身来，第一次在这一整天正面看你。烟还夹在手里，没点，滤嘴被她捏扁了。"], ["say", "「当年的事。」"], ["nar", "两个字。她开口像是要说下一句，喉咙卡了一下，又咽回去了。你等着。窗外的雨停了，檐上有水滴砸在空调外机上，一下一下。"], ["say", "「……你当年走的那天，我去了机场。」"], ["nar", "你不知道这件事。你走的那天没见到她。"]], "choices": ["「我没看见你。」", "「去了又怎么样，你没上前。」", "什么也不说，等她继续"], "n": 5}, {"lines": [["nar", "她把那支捏扁的烟扔进了垃圾桶。纸篓里已经有七八个烟头了，都是今天攒的。"], ["nar", "垃圾桶是新的，袋子还没套，烟头直接落在铁皮上，响了一声。"], ["say", "「我在出口等你。你过了安检我才走的。」"], ["nar", "她说这话的时候看着垃圾桶，不是看你。声音平的，没有颤，但她说完之后咬了一下下唇——很快松开了，你没来得及看清是不是咬出了印子。"], ["say", "「……你要是当年没走，这个项目，还有这间事务所——」"]], "choices": ["「也是你的。我知道。」", "「你到底想说什么，直说。」", "「你想说当年不该那么做？」"], "n": 6}, {"lines": [["nar", "她终于看你了。不是扫一眼，是看。站在窗和桌之间，背后是灰色的雨后天空，光打在她半边脸上。"], ["say", "「我想说的是——」"], ["nar", "她停了一下。喉结又动了。这一次你说什么也等她把那句话说完，但她没说完。她深吸了一口气，像是在命令自己开口，最后说出来的是："], ["say", "「……你以后，还愿不愿意跟我做项目？」"], ["nar", "不是「留下来做项目」。是「愿不愿意」。她用了一整个问句，把六年来从没说出口的话，绕成了这三个字。"]], "choices": ["停下来，说「我有话跟你说」", "「先把这个项目做完再说。」", "「不了。这次做完我就走。」"], "n": 7}, {"lines": [["nar", "她在门口站住，转过身来。雨已经停了，路面反着灯，像刚擦过。"], ["nar", "她把手插回大衣口袋，缺了一下的那个动作又出现了——想抽烟，忍住了。"], ["say", "「我能问你一件事吗。」"], ["nar", "不是命令。她自己也听出来了，所以说完先愣了一下。"], ["say", "「六年前那句话……是不是到现在还没过去？」"]], "choices": ["「没过去。但我可以试着放下。」", "「过去了。是你没过去。」", "不回答，只把伞递给她"], "n": 8}]}, {"title": "第三章 · 最后", "scenes": [{"lines": [["nar", "雨停了。她站在书店门口，手里拿着那张后天的车票。"], ["say", "「……」"]], "choices": ["把话说出口", "拉住她，不让她走", "什么也没做，松开手"], "n": 1}]}], "endings": {"A": {"title": "学会问的人", "text": "她在办公室听完了你的话——你说「六年前你把我的方案说成你的，我恨过你。但我现在恨不动了。」她没回话，把桌上的旧模型推到你面前，缺角朝向你。\n你留下来做了这个项目，也做了下一个。她不再说「我说了算」，开始说「你觉得呢」。第一个问句比道歉难，她花了六年才说出口。\n事务所的招牌后来换了，名字加了你。她刻字的时候手没抖，你看着她刻，什么都没说。"}, "B": {"title": "各归各位", "text": "项目做完了，结款那天她把合同和图纸一起推过来，说「签收」。你签了。她把旧模型还给你，你说「留这儿吧，项目资产」。\n她点了头。你离开了这座城，第二次。后来你听说事务所拿了那个旧改项目的奖，领奖人写的是她的名字，你不在上面。\n她偶尔给你发消息，都是工作相关的。你偶尔回。两个人像两条平行线，离得不远，但永远碰不上。\n门牌上那个名字最后只刻了她一个，另一格空着。\n她自己单干，接的活都不大，从不署名。"}, "C": {"title": "重蹈一次", "text": "你留下来了。不是因为项目，是因为她那句「愿不愿意」。你告诉自己这次不一样，她学会了问。\n但三个月后，新项目的汇报会上，她又站在了台上。PPT上你的方案署着她的名字。你在台下看着，手心出汗。\n散会后她找到你，说「这次我跟你说过会写你的名字，是他们排版漏了。」语气是命令，不是解释。你信了。或者说，你选择了信。\n工位上的模型搬走了，桌面擦得很干净，什么都没留。\n她仍旧把图纸折三折，角上留一处标红。"}, "D": {"title": "擦肩", "text": "你说「不了」，她点了头。没有挽留，没有第二句。你收拾东西的时候她在窗边站着，背对着你，又点了一支烟。\n你走到门口，停了一下。她没回头。你出了门，走廊的感应灯亮了又灭。\n第二年你在另一座城做项目，甲方发来的合作方名单里有她的事务所。你看了三秒，划掉了。\n名单退回去那天，你在楼下抽完了整支烟，烟灰掉在鞋面上，没拍。窗外没有下雨，天很干，你点了支烟，才发现自己什么时候也学会了抽。"}}, "vigs": [], "route": "qing", "arch": ""};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
$('#world').textContent=D.world; $('#premise').textContent=D.premise;
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      if(/陪|等|不|别走|谢|留|帮|说|问|看|递|握/.test(t)) warm++;
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=warm/Math.max(1,total);
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; render(); };
</script></body></html>
