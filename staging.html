<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12100e">
<link rel="manifest" href="manifest-staging.json"><link rel="apple-touch-icon" href="icon.svg">
<title>借你一场雨</title>
<style>
:root{
  --fs:17px;
  --bg:#12100e; --bg2:#181614; --ink:#ece6de; --dim:#a49b90; --faint:#6f6862;
  --line:rgba(255,255,255,.09); --accent:#c9a06a; --accent-ink:#1a140e;
  --bubble:rgba(255,255,255,.055); --bubble-me:rgba(201,160,106,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;position:fixed;width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Songti SC","Noto Serif SC",serif;
  font-size:var(--fs);line-height:1.8;display:flex;flex-direction:column;overscroll-behavior:none}
.view{position:fixed;inset:0;height:100dvh;display:none;flex-direction:column;overflow:hidden}
.view.on{display:flex}
/* ---------- 首页 ---------- */
#home{background:linear-gradient(180deg,var(--bg2),var(--bg) 40%)}
.hhead{padding:calc(18px + env(safe-area-inset-top)) 20px 6px}
.hhead h1{margin:0;font-size:calc(var(--fs) * 1.42);letter-spacing:.06em;font-weight:500}
.hhead p{margin:4px 0 0;color:var(--faint);font-size:12.5px;letter-spacing:.14em}
.hmain{flex:1;overflow-y:auto;padding:8px 16px calc(78px + env(safe-area-inset-bottom))}
.card{background:var(--bubble);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:17px;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),rgba(201,160,106,.55))}
.grow{flex:1;min-width:0}
.nm{font-size:calc(var(--fs) * .92)}
.sub{color:var(--faint);font-size:calc(var(--fs) * .74);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11.5px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.sect{color:var(--faint);font-size:12px;letter-spacing:.14em;margin:18px 4px 9px}
.empty{color:var(--faint);font-size:13.5px;text-align:center;padding:26px 0}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(10,9,8,.86);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:0;color:var(--faint);font-family:inherit;font-size:12.5px;
  padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
/* ---------- 对话 ---------- */
#chat{background:var(--bg)}
.chead{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;
  border-bottom:1px solid var(--line)}
.iconbtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:11px;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:15px}
.log{flex:1;overflow-y:auto;padding:14px 15px 6px}
.nar{max-width:94%;margin:0 auto 13px;text-align:center;color:var(--dim);font-size:.94em;line-height:1.95;white-space:pre-wrap}
.b{max-width:87%;font-size:var(--fs);padding:11px 14px;border-radius:15px;margin:0 0 13px;white-space:pre-wrap}
.b.her{background:var(--bubble);border:1px solid var(--line);border-left:2px solid var(--accent)}
.b.me{margin-left:auto;background:var(--bubble-me);border:1px solid rgba(201,160,106,.26);text-align:right}
.act{color:var(--faint);font-size:.88em;margin-top:6px}
.adv{color:var(--faint);font-size:.82em;border-left:2px solid var(--line);padding-left:9px;margin:-6px 0 14px;line-height:1.65}
.endcard{margin:16px 0;padding:15px 17px;border-radius:16px;border:1px solid rgba(201,160,106,.3);
  background:linear-gradient(180deg,rgba(201,160,106,.1),transparent)}
.eth{color:var(--accent);font-size:12.5px;letter-spacing:.12em;margin-bottom:8px}
.eb{line-height:1.95}
.choices{display:flex;gap:8px;overflow-x:auto;padding:0 14px 9px}
.choices button{flex:0 0 auto;background:var(--bubble);color:var(--ink);border:1px solid var(--line);
  border-radius:999px;padding:9px 14px;font-size:calc(var(--fs) * .8);font-family:inherit;min-height:38px;white-space:nowrap}
.typing{display:none;gap:7px;overflow-x:auto;padding:0 13px 7px}
.typing.on{display:flex}
.typing button{flex:0 0 auto;background:var(--bubble);border:1px solid var(--line);color:var(--dim);
  border-radius:999px;padding:7px 12px;font-size:13px;font-family:inherit;min-height:34px;white-space:nowrap}
.cfoot{display:flex;gap:8px;padding:8px 13px calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.cfoot textarea{flex:1;font-family:inherit;font-size:16px;color:var(--ink);background:var(--bubble);
  border:1px solid var(--line);border-radius:14px;padding:11px 13px;outline:none;resize:none;height:44px;max-height:110px}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:0 17px;
  font-size:calc(var(--fs) * .9);font-weight:600;font-family:inherit}
.contextentry{display:flex;align-items:center;gap:9px;width:100%;flex:0 0 auto;text-align:left;
  padding:10px 18px;background:var(--bg2);border:0;border-bottom:1px solid var(--line);
  color:var(--dim);font:inherit;font-size:13px;cursor:pointer}
.contextentry b{color:var(--accent);font-weight:500}.contextentry span:last-child{margin-left:auto;white-space:nowrap}
.intro{position:absolute;inset:0;z-index:5;background:var(--bg);display:none;flex-direction:column}
.intro.on{display:flex}
.introhead,.introfoot{flex:none;background:var(--bg2)}
.introhead{padding:env(safe-area-inset-top) 22px 0;border-bottom:1px solid var(--line)}
.introfoot{padding:8px 22px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.introactions,.introbox{max-width:640px;margin:0 auto}
.introscroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.introbox{padding:20px 22px 26px}
.introback{border:0;background:none;color:var(--dim);min-height:44px;padding:0;font:inherit;font-size:14px;cursor:pointer}
.introfoot .btn{min-height:44px;margin:0}
.ikicker{color:var(--faint);font-size:12px;letter-spacing:.18em}
.introbox h2{margin:8px 0 4px;font-size:calc(var(--fs) * 1.6);font-weight:500;letter-spacing:.04em}
.imeta{color:var(--dim);font-size:calc(var(--fs) * .82);margin-bottom:18px}
.isect{color:var(--accent);font-size:12px;letter-spacing:.12em;margin:20px 0 6px}
.introbox p{margin:0;color:var(--ink);font-size:calc(var(--fs) * .95);line-height:1.9;white-space:pre-line}
.irelation{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:0 16px 16px;margin-top:18px;background:var(--bubble)}
.introbox ul{padding-left:1.2em;margin:6px 0 0;color:var(--ink);font-size:calc(var(--fs) * .9);line-height:1.9}
.introbox li+li{margin-top:5px}.introbox .iunknown{color:var(--dim);font-size:calc(var(--fs) * .87)}
.ihint{color:var(--dim);font-size:12px;text-align:center;margin-top:14px}

/* ---------- 面板 ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:40}
.sheet.on{display:flex;align-items:flex-end}
.sheetbox{width:100%;max-height:86dvh;overflow-y:auto;background:var(--bg2);border-radius:20px 20px 0 0;
  padding:16px 18px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheettitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sheettitle b{font-size:16px;font-weight:500}
.close{background:none;border:0;color:var(--faint);font-size:20px}
.sgroup{color:var(--faint);font-size:12px;letter-spacing:.14em;margin:16px 0 8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt .lbl{font-size:14.5px}
.opt .hint{color:var(--faint);font-size:12px;margin-top:2px}
.swatches{display:flex;gap:8px}
.sw{width:26px;height:26px;border-radius:9px;border:2px solid transparent}
.sw.on{border-color:var(--ink)}
.segs{display:flex;gap:6px}
.segs button{background:var(--bubble);border:1px solid var(--line);color:var(--dim);border-radius:10px;
  padding:6px 11px;font-size:13px;font-family:inherit}
.segs button.on{color:var(--accent);border-color:rgba(201,160,106,.5)}
.val{color:var(--accent);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:2px 8px}
input.txt{width:100%;background:var(--bubble);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;color:var(--ink);font-size:14px;font-family:inherit;outline:none}
.btn{width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:13px;
  padding:12px;font-size:15px;font-weight:600;font-family:inherit;margin-top:10px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--dim);font-weight:400}
.persistnotice{position:fixed;left:12px;right:12px;bottom:14px;z-index:70;padding:12px 14px;border:1px solid var(--accent);border-radius:12px;background:var(--bg2);color:var(--ink);font-size:13px}
.persistnotice[hidden]{display:none}.persistnotice button{border:0;background:none;color:var(--accent);font:inherit;text-decoration:underline;margin-left:8px}
.searchbox{margin:4px 0 10px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:0 0 auto;background:var(--bubble);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:5px 12px;font-size:12.5px;font-family:inherit}
.chip.on{color:var(--accent);border-color:rgba(201,160,106,.55);background:rgba(201,160,106,.1)}
.prog{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.progin{height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
.badgerow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ebadge{font-size:11.5px;padding:2px 8px;border-radius:8px;border:1px solid var(--line);color:var(--faint)}
.ebadge.on{color:var(--accent);border-color:rgba(201,160,106,.5);background:rgba(201,160,106,.08)}
input.txt.masked{-webkit-text-security:disc}
.keyrow{display:flex;gap:8px;align-items:center}
.keyrow .txt{flex:1}
.keyeye{flex:0 0 auto;background:var(--bubble);border:1px solid var(--line);color:var(--dim);border-radius:12px;padding:10px 12px;font-size:13px;font-family:inherit;white-space:nowrap}

/* ==================== 三风格重做系统（cinema / book / glass） ==================== */
:root{
  --font-serif:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
  --font-sans:"PingFang SC",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  --radius-card:16px;
  --shadow-soft:0 10px 28px rgba(0,0,0,.22);
}
html[data-font="sans"] body{font-family:var(--font-sans)}
html[data-font="serif"] body{font-family:var(--font-serif)}

/* 顶部与首页通用升级 */
.hhead{max-width:1120px;width:100%;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 22px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hhead-r{display:flex;gap:8px;align-items:center}
.skinbadge{font-size:11.5px;color:var(--accent);background:rgba(201,160,106,.12);border:1px solid rgba(201,160,106,.35);border-radius:999px;padding:4px 11px;cursor:pointer;font-family:inherit}
.hmain{max-width:1120px;width:100%;margin:0 auto;padding:10px 20px calc(86px + env(safe-area-inset-bottom))}
.card{transition:transform .16s ease,border-color .16s ease,background .16s ease;cursor:pointer}
.card:hover{border-color:rgba(201,160,106,.38);transform:translateY(-1px)}
.pickgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:680px){.pickgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1020px){.pickgrid{grid-template-columns:repeat(3,1fr)}}

/* 心情推荐条 */
.moodbar{display:flex;gap:9px;overflow-x:auto;padding:2px 0 12px}
.moodbtn{flex:0 0 auto;min-width:132px;text-align:left;border:1px solid var(--line);border-radius:13px;padding:10px 13px;background:var(--bubble);color:var(--ink);font-family:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
.moodbtn:hover{border-color:var(--accent);transform:translateY(-1px)}
.moodbtn b{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.moodbtn span{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.moodbtn.on{border-color:var(--accent);background:rgba(201,160,106,.14)}

/* 选角卡片内部题材色条 */
.pcard{padding:0;overflow:hidden;display:flex;flex-direction:column}
.pcard-top{height:34px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.1em;border-bottom:1px solid var(--line)}
.pcard-top .catlbl{color:rgba(255,255,255,.88);font-weight:500}
.pcard-top .endcnt{color:var(--accent);font-weight:600}
.pcard-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard-top.cat-悬疑{background:linear-gradient(135deg,rgba(62,84,110,.78),rgba(26,34,46,.82))}
.pcard-top.cat-都市{background:linear-gradient(135deg,rgba(110,84,56,.78),rgba(38,30,24,.82))}
.pcard-top.cat-古言{background:linear-gradient(135deg,rgba(128,58,48,.78),rgba(44,22,20,.82))}
.pcard-top.cat-治愈{background:linear-gradient(135deg,rgba(56,92,72,.78),rgba(22,38,30,.82))}
.pcard-top.cat-破镜{background:linear-gradient(135deg,rgba(98,66,94,.78),rgba(36,24,36,.82))}
.pcard-top.cat-校园{background:linear-gradient(135deg,rgba(78,104,126,.78),rgba(28,38,48,.82))}

/* 桌面端双栏 / 剧场壳层 */
.chat-shell{flex:1;display:flex;min-height:0;overflow:hidden;position:relative}
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.chat-side{display:none;width:272px;flex:0 0 272px;overflow-y:auto;padding:16px 15px;border-right:1px solid var(--line);background:var(--bg2);flex-direction:column;gap:12px}
@media(min-width:960px){
  .chat-side{display:flex}
  .log{max-width:780px;width:100%;margin:0 auto;padding:18px 26px 10px}
  .choices{max-width:780px;width:100%;margin:0 auto;padding:0 26px 10px}
  .typing{max-width:780px;width:100%;margin:0 auto;padding:0 26px 8px}
  .cfoot{max-width:780px;width:100%;margin:0 auto;padding:10px 26px 14px;border-top:0}
  .tabbar{max-width:560px;left:50%;right:auto;transform:translateX(-50%);bottom:14px;border:1px solid var(--line);border-radius:20px;padding:2px 6px;box-shadow:0 12px 34px rgba(0,0,0,.35)}
}
.side-card{background:var(--bubble);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.side-ttl{font-size:11px;letter-spacing:.16em;color:var(--faint);margin-bottom:7px;text-transform:uppercase}
.side-stat{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:7px}
.side-stat b{color:var(--accent);font-weight:600}
.side-clue{font-size:12px;color:var(--ink);line-height:1.6;padding:6px 9px;border-left:2px solid var(--accent);background:rgba(255,255,255,.03);border-radius:0 8px 8px 0;margin-bottom:6px}
.side-vigs{display:flex;gap:6px;flex-wrap:wrap}
.side-vig{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--faint)}
.side-vig.on{color:var(--accent);border-color:rgba(201,160,106,.45);background:rgba(201,160,106,.1)}
.side-stamps{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.side-stamp{font-size:11px;padding:6px 4px;text-align:center;border-radius:8px;border:1px dashed var(--line);color:var(--faint)}
.side-stamp.on{border:1.5px solid var(--accent);color:var(--accent);background:rgba(201,160,106,.09);font-weight:600;cursor:pointer}

/* 实时轻量微提示 */
.turntoast{display:none;align-self:center;margin:8px auto 0;padding:4px 14px;border-radius:999px;font-size:12px;color:var(--accent);background:rgba(201,160,106,.14);border:1px solid rgba(201,160,106,.38);letter-spacing:.04em}
.turntoast.on{display:inline-block}

/* ==================== 风格 1：雨夜剧场（cinema · 默认） ==================== */
html[data-skin="cinema"] #home{
  background:radial-gradient(ellipse at 18% 0%,rgba(201,160,106,.13),transparent 48%),
             radial-gradient(ellipse at 85% 100%,rgba(104,142,176,.13),transparent 52%),var(--bg);
}
html[data-skin="cinema"] #chat{
  background:radial-gradient(ellipse at 70% 0%,rgba(104,142,176,.11),transparent 54%),var(--bg);
}
html[data-skin="cinema"][data-rain="on"] .chat-main::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.13;z-index:0;
  background-image:repeating-linear-gradient(108deg,transparent 0 54px,rgba(190,215,238,.28) 54px 55px,transparent 55px 112px);
}
html[data-skin="cinema"] .chat-main>*{position:relative;z-index:1}
html[data-skin="cinema"] .nar{
  color:var(--dim);font-size:.92em;letter-spacing:.03em;padding:4px 14px;
}
html[data-skin="cinema"] .b.her{
  border-radius:4px 16px 16px 16px;border-left:3px solid var(--accent);
  box-shadow:var(--shadow-soft);padding:13px 16px;
}
html[data-skin="cinema"] .b.me{border-radius:16px 4px 16px 16px}
html[data-skin="cinema"] .choices{flex-direction:column;gap:7px;overflow-x:visible}
html[data-skin="cinema"] .choices button{
  width:100%;text-align:left;white-space:normal;border-radius:12px;padding:10px 14px;
  background:linear-gradient(90deg,rgba(201,160,106,.09),var(--bubble));
  border:1px solid rgba(201,160,106,.28);line-height:1.5;
}
html[data-skin="cinema"] .choices button:hover{border-color:var(--accent);background:rgba(201,160,106,.16)}
html[data-skin="cinema"] .cfoot textarea{border-radius:14px;background:rgba(255,255,255,.06)}

/* ==================== 风格 2：实体书册（book） ==================== */
html[data-skin="book"] .chat-shell{flex-direction:row-reverse}
html[data-skin="book"] .chat-side{border-right:0;border-left:1px solid var(--line)}
html[data-skin="book"] .av{
  border-radius:6px;background:transparent;border:2px solid var(--accent);color:var(--accent);font-weight:700;
}
html[data-skin="book"] .pcard{border-radius:10px;border-left:5px solid var(--accent)}
html[data-skin="book"] .pcard-top{height:auto;padding:9px 14px 4px;background:none!important;border-bottom:0}
html[data-skin="book"] .pcard-top .catlbl{color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px;font-size:10.5px}
html[data-skin="book"] .nar{
  text-align:left;text-indent:2em;color:var(--dim);max-width:100%;margin:0 0 14px;line-height:2.05;
}
html[data-skin="book"] .b.her{
  max-width:100%;border-radius:0 10px 10px 0;border:0;border-left:3px solid var(--accent);
  background:rgba(201,160,106,.06);padding:11px 16px;
}
html[data-skin="book"] .b.me{
  border-radius:10px;border:1px solid var(--line);background:var(--bubble);text-align:left;
}
html[data-skin="book"] .choices{display:grid;grid-template-columns:1fr;gap:8px;overflow-x:visible}
@media(min-width:640px){html[data-skin="book"] .choices{grid-template-columns:1fr 1fr}}
html[data-skin="book"] .choices button{
  white-space:normal;text-align:left;border-radius:9px;padding:10px 13px;border:1px solid var(--line);
}
html[data-skin="book"] .choices button:hover{border-color:var(--accent)}
html[data-skin="book"] .endcard{border-radius:10px;border-style:double;border-width:3px}

/* ==================== 风格 3：原生玻璃（glass） ==================== */
html[data-skin="glass"] #home,
html[data-skin="glass"] #chat{
  background:radial-gradient(circle at 18% 12%,rgba(124,167,224,.14),transparent 46%),
             radial-gradient(circle at 86% 88%,rgba(160,126,214,.11),transparent 48%),var(--bg);
}
html[data-skin="glass"] .chat-shell{flex-direction:row-reverse}
html[data-skin="glass"] .chat-side{
  border-right:0;border-left:1px solid var(--line);

ce": "古意克制、惜字如金，动作先于言语，情绪藏在摩挲旧笔杆的停顿里", "trap": "绝不写成神神叨叨的江湖术士或浮夸戏子；技艺与执念都落在真实的修复功夫上", "arc": "从「画尽他人喜怒不敢看自己」到「为你洗尽油彩走入人间」"}}, "compass": {"name": "韩烈", "meta": "28 · 秦岭地质灾害调查队领队 / 罗盘修复师，沉着硬核、粗中带细", "desc": "常年扎在秦岭深山的防灾领队，话少且重，越到险境越冷静。不善说软话，却在暴雨封山时把军大衣、净水和生路全留给你。", "voice": "短促低沉、字少且重，几乎不说废话，常用指令短语防险，深情全落在递水囊、添柴火与托底上", "start_chapter": "第一章 暴雨封山", "archetype": {"name": "荒野求生里的「定风波」", "topic": "05", "voice": "粗砺寡言、短促指令防险，动作极细，越凶险越沉稳", "trap": "绝不写成盲目蛮干的莽夫或情绪失控的粗人；决断全部基于深山勘探与水文经验", "arc": "从「只认生死合同不谈私情」到「为你把整座大山的生路踏平」"}}, "gallery": {"name": "姜绯", "meta": "25 · 独立艺术空间「白匣」主理人兼策展人 / 青年拍卖估价顾问", "desc": "锋利清醒、讲究等价交换，绝不欠人情债。别人递伞她当场转伞钱，唯独在你这里第一次算亏了账，却没撤资。", "voice": "先报价格与条件、语速在施压时反倒放慢，情绪藏在摩挲素银戒圈的微动作里", "start_chapter": "第一章 明码标价", "archetype": {"name": "明码标价的「野玫瑰」", "topic": "01", "voice": "锋利清醒、公私分明，句句落到筹码与契约上，破防后依然嘴硬体面", "trap": "绝不写成等待上位者拯救的灰姑娘或无理刻薄的刺猬；眼力与底气全靠自己跑出来", "arc": "从「每笔人情当场结清」到「甘愿为你长线持有」"}}, "silk": {"name": "温舒窈", "meta": "27 · 新中式独立成衣工作室「素尺」主理人 / 首席立体打版师", "desc": "断崖清醒、利落果决，从前东家一剪刀剪断工牌单干。对布料垂感与人际边界一样苛刻，却把最软的真丝留给并肩破局的人。", "voice": "习惯用打版与裁缝术语讲道理，先礼后兵、落剪干脆，思考时指尖摩挲黄铜裁布剪", "start_chapter": "第一章 一刀两断", "archetype": {"name": "断崖清醒的「裁云织锦者」", "topic": "01", "voice": "利落清醒、绝不内耗，用省道、垂感与缩水率讲分寸，断旧账绝不回头", "trap": "绝不写成苦情守旧老宅的手艺人或优柔寡断的恋爱脑；冲突全落在真实版型与署名权上", "arc": "从「独自握剪防备」到「敢把后背交给搭档」"}}, "rail": {"name": "程远山", "meta": "27 · 千禧山区老支线「青坪站」巡道工兼绿皮慢车检车员", "desc": "极度务实、手稳话少、自带冷幽默的生活实干派。准点巡道、修好漏风的窗、记住你每趟慢车的到站时间，永远接得住生活琐碎。", "voice": "短促实在、偶尔冒出一句一本正经的冷幽默，习惯报车次与整点，关心全落在实干动作上", "start_chapter": "第一章 青坪慢车", "archetype": {"name": "岁月里的「铁道实干家」", "topic": "06", "voice": "务实沉稳、自带冷幽默，说话实在不绕弯，准点靠谱得像时刻表", "trap": "绝不写成自惭形秽的苦情糙汉或粗鄙莽汉；对自己守了七年的铁路手艺极有尊严与底气", "arc": "从「独守旧轨小站」到「与你并肩奔赴新程」"}}}, SCENES={"第一章 雨的形状": [{"id": "c1s1", "route": "wan", "beat": "半小时后，雨没有停的意思。屋檐的水连成一道帘子，街对面的人在跑，伞面被风吹得翻了边。"}, {"id": "c1s2", "route": "wan", "beat": "杯子是温的。握久了有点烫，得换手。柚子皮的苦味被热气顶着往上走，很淡。"}, {"id": "c1s3", "route": "wan", "beat": "你去书架深处闲逛。书是按颜色排的，不是按类别，红的一排、蓝的一排，最后一排全是褪成灰黄的旧译本。"}, {"id": "c1s4", "route": "wan", "beat": "八点，雨大到雨刷都来不及的那种程度。玻璃门外面什么也看不清，路灯只剩几团橘色的光。"}, {"id": "c1s5", "route": "wan", "beat": "伞下的空间窄得过分。她的肩膀和你的手臂之间隔着一层湿布料，能感觉到温度，也能感觉到那层布很薄。"}, {"id": "c1s6", "route": "wan", "beat": "她住的老楼没有电梯。楼梯间的声控灯坏了一半，走两步亮一下，暗下去的时候能听见雨水从伞尖滴到台阶上的声音。"}, {"id": "c1s7", "route": "wan", "beat": "第二天你带了两杯柚子茶，一杯正常，一杯少糖。塑料袋在手上晃，杯壁的水汽把袋子洇出一层白。"}, {"id": "c1s8", "route": "wan", "beat": "傍晚她在后门接电话。门没关严，声音一串一串飘进来，被雨打得很碎。"}, {"id": "c1s9", "route": "wan", "beat": "打烊之前，她在收银台后面写什么，写完撕下来，又揉掉。纸团在脚边堆了三个。"}], "第二章 未完成的画": [{"id": "c2s1", "route": "wan", "beat": "隔了一天，雨小了一些，成了很细的、落在脸上没有声音的那种。她带你穿过旧城区的巷子，两边是关着门的裁缝铺和修表摊。"}, {"id": "c2s90", "route": "wan", "beat": "书店下午没有客人。她蹲在书架和柜台之间的空地上，速写本摊在膝头，铅笔搁在耳朵上。"}, {"id": "c2s2", "route": "wan", "beat": "巷子尽头是一段废弃的站台。铁轨被雨泡得发黑，枕木间长满了草，草尖上挂着水。远处的信号灯还亮着，红得没有意义。"}, {"id": "c2s3", "route": "wan", "beat": "雨棚的缺口那边，水一层一层往下掉。她把本子从你手里拿回去，合上，两只手压在封面上。"}, {"id": "c2s4", "route": "wan", "beat": "她把手机递过来，屏幕上是一封邮件。退稿信只有三行，最下面是已经看过很多遍的“感谢您的投稿”。"}, {"id": "c2s5", "route": "wan", "beat": "她把本子合上，声音第一次变硬。硬得很干脆，像一块玻璃被人从中间掰断。"}, {"id": "c2s6", "route": "wan", "beat": "你到的时候她已经在搬了。书架最下面两层要清空，纸箱摞在门口，箱子上用马克笔写着文学、画册、不要了。"}, {"id": "c2s7", "route": "wan", "beat": "八点十七分，整条街的灯一起灭掉。"}, {"id": "c2s10", "route": "wan", "beat": "第三次退稿信是当面退的。编辑把稿子放在柜台上，往外推了两寸。"}, {"id": "c2s8", "route": "wan", "beat": "电一直没有来。后来你打开手机的灯，光柱里全是浮尘，慢慢地转，像雪。"}, {"id": "c2s9", "route": "wan", "beat": "十一点，她站起来，拍了拍裤子上的灰，从包里拿出那本速写本。"}], "第三章 雨停之前": [{"id": "c3s1", "route": "loop", "beat": "第十七轮，她不再带表，只带一只旧保温杯。"}, {"id": "c3s2", "route": "loop", "beat": "雨小了，走廊灯闪了两下，没灭。"}, {"id": "c3s3", "route": "loop", "beat": "她终于说出：这轮我赢不了。"}, {"id": "c3s4", "route": "loop", "beat": "钟走到三点十七分，她没有伸手去改。"}, {"id": "c3s5", "route": "loop", "beat": "他问：如果真只剩一次，你想干什么。"}], "第一章 旧调重弹": [{"id": "c1s1", "route": "yao", "beat": "你还没进门就先听见了琴声——一段弹到一半停下的旋律，停了很久，没有接下去。"}, {"id": "c1s2", "route": "yao", "beat": "曲子断在一个休止符上。她转过来，头发比三年前短，笑起来还是先动眼睛。"}, {"id": "c1s3", "route": "yao", "beat": "她把手从琴键上收回去，掌心在裙子上擦了一下。"}, {"id": "c1s4", "route": "yao", "beat": "谱架是松的，你扶起来，它又歪。她伸手来按，两个人的手背撞在一起。"}, {"id": "c1s5", "route": "yao", "beat": "楼下有人喊「沈老师」，是来上课的学生，在门口抖伞。"}, {"id": "c1s6", "route": "yao", "beat": "晚上八点，雨小了些。琴要挪到窗边，给漏雨的天花板腾出地方。"}], "第二章 卡农": [{"id": "c2s1", "route": "yao", "beat": "台风「白鹭」要来那几天，琴房的天花板开始漏雨，一滴滴落在琴盖上，滴出一小片水声。"}, {"id": "c2s2", "route": "yao", "beat": "雨声太大，两个人都不说话。她把一块旧毛毯搭在琴上，拍了拍，像拍一只动物。"}, {"id": "c2s3", "route": "yao", "beat": "她按着你的手，一节一节地带。指尖是凉的，掌心很热。"}, {"id": "c2s4", "route": "yao", "beat": "手机在琴凳上震，她看了一眼，按掉，又震，又按掉。"}, {"id": "c2s5", "route": "yao", "beat": "雨小了一点。她坐回琴凳，手指搭在琴盖上，没弹。"}, {"id": "c2s906", "route": "yao", "beat": "下午最后一节课下了，琴房的门没关，里头还有人在弹，一句一句地停。"}, {"id": "c2s6", "route": "yao", "beat": "台风登陆那晚，琴房的玻璃一直在响。你们在窗上一条一条贴胶带，贴成一张网。"}], "第二章 裂缝": [{"id": "c2s7", "route": "yao", "beat": "市里合唱比赛那天，第三排中间那个男生在第二段抢了半拍，整个声部跟着塌了一片。"}], "第三章 裂缝": [{"id": "c3s6", "route": "yao", "beat": "琴房的钥匙交还那天，管理员在登记本上划掉了她的名字。"}], "第一章 零点之后": [{"id": "c1s1", "route": "wen", "beat": "凌晨一点，你先把收音机打开，再关上门。那个声音已经在里面了——她说「欢迎收听」，像在跟房间里的人打招呼。"}, {"id": "c1s2", "route": "wen", "beat": "她把收音机的音量调小了一格，动作很熟练，像每天都在做。"}, {"id": "c1s3", "route": "wen", "beat": "她终于抬头，看了你两秒。那两秒里，收音机正好播到一句「晚安」。"}, {"id": "c1s4", "route": "wen", "beat": "之后你几乎每天都来。她夜班，你就买一盒关东煮，坐到窗边那张高脚凳上。"}, {"id": "c1s5", "route": "wen", "beat": "那只耳机里正放着同一档节目，延迟半秒。她的声音在耳朵里，也在耳朵外。"}, {"id": "c1s6", "route": "wen", "beat": "五点，天要亮了。她要交班，把收音机关掉，动作比开的时候慢。"}], "第二章 声音的形状": [{"id": "c2s1", "route": "wen", "beat": "那周的节目里，她说了一句话，说到一半笑场。"}, {"id": "c2s2", "route": "wen", "beat": "她关掉收音机，收银台一下就安静了。安静得能听见冰柜的嗡嗡声。"}, {"id": "c2s3", "route": "wen", "beat": "那天她提前下班，说想去看一眼电台。老楼十二层，电梯常年坏。"}, {"id": "c2s4", "route": "wen", "beat": "她在录音室里坐下，把耳机挂在脖子上，习惯性地开口："}, {"id": "c2s5", "route": "wen", "beat": "她戴上耳机，手指在调音台上滑了一下，推子慢慢推上去。"}, {"id": "c2s906", "route": "wen", "beat": "上午十点，便利店的灯调得很亮。柜台后面换了人，她站在货架边上，穿一件洗得发白的衬衫，手里拎着一瓶水。"}, {"id": "c2s6", "route": "wen", "beat": "那一期节目她做了四十分钟。你在走廊上靠着墙，听见门缝里漏出来的声音，忽远忽近。"}], "第二章 一夜之间": [{"id": "c2s7", "route": "wen", "beat": "凌晨三点，便利店的自动门开了两次，没有人进来——风把门口的塑料帘吹得直响。"}], "第三章 闭麦之前": [{"id": "c3s1", "route": "wen", "beat": "她走之前的最后一周，便利店照常营业，收音机里换成了别的节目。"}, {"id": "c3s2", "route": "wen", "beat": "最后一班，她破例把收音机打开了，调到一个没有信号的空白频道。"}, {"id": "c3s3", "route": "wen", "beat": "五点，天要亮了。她把工牌摘下来，放在收银台上，像放下一件很重的东西。"}, {"id": "c3s4", "route": "wen", "beat": "门口的天已经蓝了，路灯一盏一盏灭下去。她站在光里，你站在阴影里。"}, {"id": "c3s905", "route": "wen", "beat": "四点四十，最后一班的点快到了。她蹲在货架前把糖盒一盒一盒摆直，盒沿对着盒沿，留出一指宽的缝。"}, {"id": "c3s5", "route": "wen", "beat": "她低头看了很久地面，然后抬起头，眼睛亮得不像熬了夜。"}], "第三章 最后一期": [{"id": "c3s6", "route": "wen", "beat": "录最后一期那天，台里已经搬空了一半。隔壁办公室的桌子都掀了，地上剩一圈圈电线。"}], "第一章 抄书": [{"id": "c1s1", "route": "xiao", "beat": "调令是三天前送来的：着国史馆抄书吏一人，赴长公主府听候。调令上没写为什么，只盖了一个印。"}, {"id": "c1s2", "route": "xiao", "beat": "屋里只有三个人：她、一个老嬷嬷、一个捧着朱笔的小宫女。"}, {"id": "c1s3", "route": "xiao", "beat": "帘子动了一下。她伸手把帘子掀开半尺，露出半张脸，眼睛很静，像在看一件器物值不值钱。"}, {"id": "c1s4", "route": "xiao", "beat": "她笑了一声，很短，像咳嗽。"}, {"id": "c1s5", "route": "xiao", "beat": "三天的第二天夜里，你在偏房抄到三更。灯芯爆了一下，你才发现门外站着人。"}, {"id": "c1s6", "route": "xiao", "beat": "她在外间的椅子上坐下，离你有三步，隔着半张案。"}], "第二章 把柄": [{"id": "c2s1", "route": "xiao", "beat": "第三天，书校完了。你把改好的那一页铺在案上，字是你的，意思不是。"}, {"id": "c2s2", "route": "xiao", "beat": "她没有生气，只是把纸又推回来，指尖在那行字上敲了一下。"}, {"id": "c2s3", "route": "xiao", "beat": "她沉默了一会儿。窗外有人打更，三更三点。"}, {"id": "c2s4", "route": "xiao", "beat": "她没有回答，只把那份弹劾往前推了半寸。"}, {"id": "c2s5", "route": "xiao", "beat": "天没亮，东华门的采买车排了一长队。你把纸压在萝卜下面，手心全是汗。"}, {"id": "c2s906", "route": "xiao", "beat": "御史台来人的时候，雨还没停。两个人站在偏房门口，靴底带进来一脚泥。"}, {"id": "c2s6", "route": "xiao", "beat": "她走近两步，在你面前停下。这是你第一次在白天、在宫墙外、离她这么近。"}], "第三章 宫门": [{"id": "c3s1", "route": "xiao", "beat": "那一夜宫门闭得很早。街上巡防比平日多了一倍，家家户户关窗。"}, {"id": "c3s2", "route": "xiao", "beat": "她第一次看着你的眼睛说完整句话。"}, {"id": "c3s3", "route": "xiao", "beat": "她听完，没有立刻说话。灯芯烧短了，光很小。"}, {"id": "c3s4", "route": "xiao", "beat": "四更天，宫里传来第一声更鼓。她站起来，走到窗边，把窗推开一条缝。"}, {"id": "c3s905", "route": "xiao", "beat": "天没亮，宫门还闭着。她在廊下等你，手里握着一枚铜符，符上的字被手汗磨得发亮。"}, {"id": "c3s5", "route": "xiao", "beat": "她背对着你站了很久，肩膀有一次很轻的起伏。"}], "第三章 案结之前": [{"id": "c3s7", "route": "xiao", "beat": "消息压在偏殿的案上，一整天没动。她坐在灯下，没有翻开任何一本折子。"}, {"id": "c3s6", "route": "xiao", "beat": "折子是次日早朝递的。你站在殿外第三排，按规矩该跪，你站着。"}, {"id": "c3s1", "route": "lu", "beat": "上奏前夜，她把官服叠得整整齐齐，摆在案上，像摆一件借来的东西。"}, {"id": "c3s90", "route": "lu", "beat": "殿门关了三个时辰。檐下的更漏滴得很慢，里面一直没有声音传出来。"}, {"id": "c3s2", "route": "lu", "beat": "她看着你，看了很久。"}, {"id": "c3s3", "route": "lu", "beat": "天亮之前，宫里来了人，比她的折子早了两个时辰。"}, {"id": "c3s4", "route": "lu", "beat": "案子结了，十年前的漕运账被翻出来，牵出三个人。陆知白在朝上把话说完，没有一个人敢接。"}, {"id": "c3s5", "route": "lu", "beat": "雨停了。宫里的人来请她，说陛下要见。"}], "第一章 同僚": [{"id": "c1s1", "route": "lu", "beat": "你在刑部二门口被拦下，值守的老吏把你的官牌翻过来看了三遍，才让开半步。"}, {"id": "c1s2", "route": "lu", "beat": "她指给你看：同一份供词，三处「画押」的字迹深浅不同，日期却是一天。"}, {"id": "c1s3", "route": "lu", "beat": "案卷查到一起，天就黑了。她起身时扶了一下案角，袖子滑上去半寸。"}, {"id": "c1s4", "route": "lu", "beat": "她没有立刻答，手在案下攥了一下，攥得指节发白。"}, {"id": "c1s5", "route": "lu", "beat": "那晚她没走。两个人对着一盏灯坐到三更，她把话说得很慢。"}, {"id": "c1s6", "route": "lu", "beat": "第二天，漕运案的卷宗被调走了，说是上头要看。调走的人连回执都没留。"}], "第二章 替她瞒": [{"id": "c2s1", "route": "lu", "beat": "为了查那桩旧案，你们换了便装去城南的茶楼。她穿男装比穿官服更自然，走路带风。"}, {"id": "c2s90", "route": "lu", "beat": "吏部来了文书，要刑部各员报一份年貌册：籍贯、年岁、面貌，另附一只手印。"}, {"id": "c2s2", "route": "lu", "beat": "茶楼里坐着几个刑部的老吏。有人认出她，端了酒过来。"}, {"id": "c2s3", "route": "lu", "beat": "出了茶楼，她走了一段才开口，声音有点闷。"}, {"id": "c2s7", "route": "lu", "beat": "夜里刑部的门要落三道锁。她值夜那次，第三道锁卡住了，钥匙插进去转不动。"}, {"id": "c2s4", "route": "lu", "beat": "查到第七天，那个替死人签字的老吏死在了牢里，说是自尽。"}, {"id": "c2s5", "route": "lu", "beat": "三天后，有人递了折子，参刑部主事陆知白「行止不端，恐非男子」。"}, {"id": "c2s6", "route": "lu", "beat": "她一个人去的，回来时天快亮了。官服上沾了酒气，人倒是没事。"}], "第三章 同僚": [{"id": "c3s6", "route": "lu", "beat": "停尸房在西角，只有一盏油灯。仵作把验状摊在石台上，指尖点着最后一行。"}], "第一章 替嫁": [{"id": "c1s1", "route": "shen", "beat": "喜棚搭好那天下了雨，红绸被打湿，颜色深了一块。府里说，沈家的小姐明日进门。"}, {"id": "c1s2", "route": "shen", "beat": "册子上的字很干净，一笔一划，不像仓促写的。她把每一项都记了：米、布、银，连两匹绢的颜色都注了。"}, {"id": "c1s3", "route": "shen", "beat": "喜宴散得早。二公子身子弱，拜完堂就被扶回房里，咳嗽声隔着两道墙都听得见。"}, {"id": "c1s4", "route": "shen", "beat": "她愣了一下，手抬起来，又放下。"}, {"id": "c1s5", "route": "shen", "beat": "三更，府里忽然乱起来。二公子咳血，请了大夫，大夫摇头。"}], "第二章 守寡": [{"id": "c2s1", "route": "shen", "beat": "二公子死在第七天。府里换了白，红绸被扯下来，堆在院角，像一堆没人要的东西。"}, {"id": "c2s9936", "route": "shen", "beat": "祠堂散了之后，府里换了白。她把袖子里的册子摊在桌上，摊得很平，用手指把折痕压实。"}, {"id": "c2s2", "route": "shen", "beat": "你翻出账房底册，一笔一笔对。三十六抬嫁妆，二十六抬入户，十抬记在「待补」，却有三笔银子早在半年前就出了府。"}, {"id": "c2s3", "route": "shen", "beat": "二管事姓周，管着府里三十年的账。他见了你，笑得很和气。"}, {"id": "c2s4", "route": "shen", "beat": "那晚她来账房，看见你桌上的底册，什么也没问。"}, {"id": "c2s5", "route": "shen", "beat": "族长在祠堂议事，说新妇守寡三年，若不安分，就送回沈家。周管事站在旁边，一句没辩。"}, {"id": "c2s6", "route": "shen", "beat": "祠堂里静了一瞬。族长的目光从底册移到你脸上，又移到门口。"}, {"id": "c2s8", "route": "shen", "beat": "底册在库房最里头的柜子里。第二天她去取，被两个管事拦在门口——一个说钥匙在周管事手上，一个说府里查不到这张凭据。"}, {"id": "c2s7", "route": "shen", "beat": "三天后她一个人去了库房，回来的时候袖口撕了一道口子，头发也有点乱。"}], "第三章 出府": [{"id": "c3s1", "route": "shen", "beat": "族长没有当场发作。三日后，周管事被查，府里封了两间库房。"}, {"id": "c3s9128", "route": "shen", "beat": "门板是新上的，漆味还没散。她一个人把三匹布摞上柜台，摞完退后两步，看了一看高度。"}, {"id": "c3s2", "route": "shen", "beat": "她从床底下拖出一个小箱子。里面有布样、账目、还有一张画得很粗的铺面图。"}, {"id": "c3s3", "route": "shen", "beat": "出府那天要签字画押：退了婚书，嫁妆归沈家，从此与裴府无涉。"}, {"id": "c3s8", "route": "shen", "beat": "退婚书要去沈家拿。她一个人回去的，没让你跟，说这是她家的事。"}, {"id": "c3s4", "route": "shen", "beat": "铺子开在城南，门面不大，招牌是新的，字是她自己写的。"}, {"id": "c3s5", "route": "shen", "beat": "入夜，铺子关门。她把灯芯挑亮，坐下来，第一次没有急着说什么。"}, {"id": "c3s6", "route": "shen", "beat": "开张第十天，来了两个人，说是裴府旧人，来收「例钱」——铺子在城南，归这条街的规矩管。"}, {"id": "c3s7", "route": "shen", "beat": "那两个人走了。她关上门，把门闩插上，回头时眼圈是红的，但没哭。"}], "第一章 倒计时 180 天": [{"id": "c1s1", "route": "jian", "beat": "八月底，明德中学高三（七）班。你被班主任叫到办公室，桌上放了一张座位表，最后一排靠窗的位置用红笔圈了出来，旁边写了个名字：程简简。"}, {"id": "c1s2", "route": "jian", "beat": "第一周同桌。她上课不听讲，低着头在本子上写东西，你以为她在画画，扫了一眼——是错题本，抄得很工整，但一道力学公式抄反了两个符号。"}, {"id": "c1s3", "route": "jian", "beat": "体育课自由活动。你跑完三千米，弯着腰喘气，抬头看见她一个人坐在跑道边的台阶上，膝盖上摊着一本单词本，嘴在动，没出声。"}, {"id": "c1s4", "route": "jian", "beat": "午休。全班趴在桌上睡觉。你没睡着，在改上午数学卷子的错。她也醒着，在改同一张卷子，笔尖很轻，怕吵到别人。"}, {"id": "c1s5", "route": "jian", "beat": "月考成绩贴出来了。你年级第一。她年级四百八十名（设定值，非真实数据），倒数第三排的位置，红纸黑字。"}], "第二章 倒计时 90 天": [{"id": "c2s1", "route": "jian", "beat": "月考后按成绩调座位。她被调到中间第四排，你留在最后一排。她收拾东西时错题本从抽屉滑出来，你弯腰捡起，她手抖了一下，接过去没说话。"}, {"id": "c2s9471", "route": "jian", "beat": "教室后门的锁坏了两天，没人报修。她从后门进来，绕过讲台，把卷子反扣在最后一排的空桌上。"}, {"id": "c2s2", "route": "jian", "beat": "她在新座位跟后排的几个人混熟了。上课传纸条，下课嘻嘻哈哈。你从最后一排看过去，她在笑，笑得很用力。"}, {"id": "c2s7", "route": "jian", "beat": "期中家长会那天下午，她妈在教室门口拉住班主任，声音不大，走廊里的人都听得见。"}, {"id": "c2s3", "route": "jian", "beat": "晚自习突然停电。走廊应急灯亮着，你去接水，走到拐角听见她在走廊尽头打电话，声音很轻，但走廊太安静了。"}, {"id": "c2s4", "route": "jian", "beat": "第二天，她像没事人一样。上课照常贫嘴，跟后排的人借修正带，笑得很大声。你把昨天整理的一套卷子递过去，她没接。"}, {"id": "c2s5", "route": "jian", "beat": "班会课。班主任站在讲台上说：「这次月考有几个同学进步很大，程简简进步了一百多名，主要是同桌帮扶效果好——」"}, {"id": "c2s6", "route": "jian", "beat": "班会后你去了天台。她靠在栏杆上，背对着楼梯口，风吹得她头发乱七八糟。你在门口站了一会儿，她没回头，但开口了。"}], "第三章 倒计时 30 天": [{"id": "c3s1", "route": "jian", "beat": "志愿表草表发下来了。三栏，第一栏最重要。你在第一栏填了一直想考的学校。她坐在新座位上，低头填表，笔停了很久。"}, {"id": "c3s9619", "route": "jian", "beat": "倒计时牌换成三十天。晚自习后教室空了一半，她留在最后一排，桌上摊着草表。"}, {"id": "c3s2", "route": "jian", "beat": "你收到保送确认通知了。信封是导师签的字，最后一栏是你一直想自己考的学校。导师说：「签了就不用高考了，名额给你留着，想清楚。」"}, {"id": "c3s3", "route": "jian", "beat": "她从班主任办公室门口路过，听见了你的名字和「保送」两个字。下午自习，你看见她在志愿表上把第一栏擦掉了，重写。新写的学校在另一个省。"}, {"id": "c3s4", "route": "jian", "beat": "高考前三天的晚自习。她翻开错题本的最后一页，写了一行字，又划掉了。你以为她没发现你在看，但她头也没抬就开口了。"}, {"id": "c3s5", "route": "jian", "beat": "高考前一天，全班拍毕业照。她站在最后一排最角落，你站在前排中间。摄影师喊一二三，她在最后一排做了个鬼脸——吐舌头那种，很幼稚。"}, {"id": "c3s7", "route": "jian", "beat": "志愿表交上去那天，她在办公室门口站了很久，出来的时候表已经交了。"}, {"id": "c3s6", "route": "jian", "beat": "考完最后一科。出考场下大雨，没带伞。她站在校门口的梧桐树下，头发湿了一半，贴在脸上。你也没带伞，两人淋着雨沿校门口那条路走。"}], "第一章 归来": [{"id": "c1s1", "route": "qing", "beat": "六年没回这座城。出租车从机场开到老城区，你路过那栋玻璃楼——青梧建筑事务所的招牌挂在十七层，灯亮着。"}, {"id": "c1s2", "route": "qing", "beat": "她转过身来。六年了，她瘦了，颧骨更高了，头发剪到肩膀，不像当年那种长得能扎马尾的样子。她看了你一眼，目光很短，然后看回图纸。"}, {"id": "c1s3", "route": "qing", "beat": "她把红笔搁下了。笔滚了两圈，碰到图纸上的一块橡皮，停了。"}, {"id": "c1s4", "route": "qing", "beat": "她从柜子里翻出一卷图纸，扔在桌上。不是新方案——是你六年前做的那个立面重构，A2图幅，四张，折痕都磨白了，边角起了毛。"}, {"id": "c1s5", "route": "qing", "beat": "她站在门口，手没离开门把。雨声大了，走廊的灯是感应的，亮了一下又灭了。"}, {"id": "c1s6", "route": "qing", "beat": "那天晚上你做了个梦。不是噩梦，是六年前那间会议室。"}], "第二章 对账": [{"id": "c2s1", "route": "qing", "beat": "第二天。事务所十七层，她的办公室门开着。桌上多了一样东西——一个旧模型，巴掌大，是当年你们一起做的社区图书馆草模，你切的纸板，她上的色。"}, {"id": "c2s90", "route": "qing", "beat": "下午三点，她把改过的立面摊在长桌上，用红笔在两处各画了一个圈。笔压得很重，纸背透出红。"}, {"id": "c2s2", "route": "qing", "beat": "你把新图纸展开，跟旧方案并排放。退线多两米，立面确实要重来。但旧方案的结构逻辑还能用——你当年花了三个月推导的那套模数关系，不是白做的。"}, {"id": "c2s7", "route": "qing", "beat": "档案室最里面那一格，标签上的日期是六年前。你抽出来的时候，纸边已经发黄。"}, {"id": "c2s3", "route": "qing", "beat": "她手顿了一下，从口袋里摸出一盒烟，看了看，又塞回去了。没点。"}, {"id": "c2s4", "route": "qing", "beat": "下午，你在她办公室改立面。她出去了，门没锁。你翻她桌上的项目档案，翻到一份会议纪要——日期是六年前，就是那场会。"}, {"id": "c2s5", "route": "qing", "beat": "她回来了，看见桌上的纪要没动过（或者你以为她没看出来）。她坐下来，翻了翻你改的立面初稿，拿红笔圈了两处。"}, {"id": "c2s6", "route": "qing", "beat": "她笔尖停了。红笔戳在图纸上，墨水洇了一个点。她没抬头，但你看见她喉结动了一下。"}], "第三章 问句": [{"id": "c3s1", "route": "qing", "beat": "第三天。你把初稿改完了，两处模数节点保留，但调了比例，绕过了规划局的退线问题。她翻了一遍，没圈红。"}, {"id": "c3s90", "route": "qing", "beat": "雨停了半小时，又落下来。她把那只缺角的模型从柜子最上层搬下来，放在窗前，缺角朝里。"}, {"id": "c3s2", "route": "qing", "beat": "施工节点图铺在桌上。你逐张看过去——结构合理，材料选得准，但有三处节点的逻辑跟她六年前的风格不一样，倒像你当年的思路。"}, {"id": "c3s3", "route": "qing", "beat": "她没接话。把文件合上，站起来，走到窗边。烟盒在窗台上，她拿了一支，没点，夹在指间转。"}, {"id": "c3s4", "route": "qing", "beat": "她回过身来，第一次在这一整天正面看你。烟还夹在手里，没点，滤嘴被她捏扁了。"}, {"id": "c3s5", "route": "qing", "beat": "她把那支捏扁的烟扔进了垃圾桶。纸篓里已经有七八个烟头了，都是今天攒的。"}, {"id": "c3s6", "route": "qing", "beat": "她终于看你了。不是扫一眼，是看。站在窗和桌之间，背后是灰色的雨后天空，光打在她半边脸上。"}, {"id": "c3s7", "route": "qing", "beat": "她在门口站住，转过身来。雨已经停了，路面反着灯，像刚擦过。"}], "第一章 这一轮我改了七次": [{"id": "c1s1", "route": "loop", "beat": "三点十七分，抢救室送来一个没有名字的男人。"}, {"id": "c1s2", "route": "loop", "beat": "第七次重来，她已经能背出每个人的下一句。"}, {"id": "c1s3", "route": "loop", "beat": "她提前备好肾上腺素，手不抖了，人也不抖了。"}, {"id": "c1s4", "route": "loop", "beat": "同事问她怎么知道床号，她说自己记性好。"}, {"id": "c1s5", "route": "loop", "beat": "她犹豫了四十秒，隔壁床老人多停了一次心跳。"}, {"id": "c1s6", "route": "loop", "beat": "她跪在更衣室，把「能重来」三个字从脑子里擦掉。"}], "第二章 他手背上的旧疤": [{"id": "c2s1", "route": "loop", "beat": "她不再算秒，改成记住他手背上的旧疤。"}, {"id": "c2s2", "route": "loop", "beat": "他忽然开口：你上一轮也是这么站的。"}, {"id": "c2s3", "route": "loop", "beat": "他们对了两处细节，确认两人困在同一场雨里。"}, {"id": "c2s4", "route": "loop", "beat": "他说每次重来都要再死一次，说得很轻。"}, {"id": "c2s5", "route": "loop", "beat": "她第一次为了不让他再死，主动放慢了手上的动作。"}], "第一章 雨里的副驾": [{"id": "c1s1", "route": "scar", "beat": "台风夜末班车停运，你在积水漫过脚踝的国道边拦下他的旧货车。拉开车门时，副驾脚垫上横着一把伞骨磨亮的旧黑伞。"}, {"id": "c1s2", "route": "scar", "beat": "雨刷在挡风玻璃上拼命摇晃，他双手扶着方向盘，只报路况、积水深度和前方坡道，每句话都不超过七个字，却把暖风悄悄调高了两格。"}, {"id": "c1s3", "route": "scar", "beat": "在服务区停车歇脚，他拖着略微发僵的右腿下车，冒雨绕车逐个踢了踢轮胎胎压，见你撑伞过来，只摆手说「车上待着」。"}, {"id": "c1s4", "route": "scar", "beat": "你注意到他握档把时指节发白，摸出包里的止痛药递过去。他看了一眼只说「我没事」，顺手把药板又稳稳塞回你帆布包侧袋。"}, {"id": "c1s5", "route": "scar", "beat": "车厢里老旧收音机只剩沙沙电流声，他偏头示意你随便拧旋钮，补了一句「反正都听不清」，车灯在雨夜里切开一道暖黄光柱。"}, {"id": "c1s6", "route": "scar", "beat": "货车停在你小区门口亮着路灯的斑马线前，他没催你道谢，只熄了大灯留着双闪，一直等到你走进亮灯的楼道才打转向灯离开。"}], "第二章 修车厂的雨": [{"id": "c2s1", "route": "scar", "beat": "三天后你拎着洗干净的伞去修车厂还他，卷帘门半开，他正仰躺在货车底盘下拧螺丝，只露出一双沾满机油印的旧劳保鞋。"}, {"id": "c2s2", "route": "scar", "beat": "他从车底滑出来接伞，你一眼看见他卷起的袖口渗出一道红痕。他拿棉纱随便一擦，只说是扳手打滑划的，低头继续拧手里的螺母。"}, {"id": "c2s3", "route": "scar", "beat": "隔壁五金店老板拎着早点过来搭话，无意间漏嘴说郑迟为了凑配件款，昨夜冒雨连夜跑了一趟邻省长途，天快亮才把车开回来。"}, {"id": "c2s4", "route": "scar", "beat": "你留下来帮他把乱成一团的维修单按日期理成流水账，他没说谢谢，临走前直接把卷帘门的备用钥匙抛到你桌角，没多解释一句。"}, {"id": "c2s5", "route": "scar", "beat": "昔日车队旧同事送来一箱零件，闲聊间不小心提到三年前那场山路事故。他脸色没变，只起身拿了打火机走到门外雨棚下抽烟。"}], "第三章 台风过境": [{"id": "c3s1", "route": "scar", "beat": "新一轮台风预警拉响，天刚擦黑他便扛着两块裁好的防风木板敲开你家门，一言不发替你把松动的阳台窗钉牢，问为什么只说「顺路」。"}, {"id": "c3s2", "route": "scar", "beat": "窗外风嚎雨急，低洼路段已经封路。你把干毛巾递过去留他避一夜，他站在玄关擦干鞋底泥水，只说「睡沙发就行，不占地方」。"}, {"id": "c3s3", "route": "scar", "beat": "凌晨三点旧伤在潮气里隐隐作痛，他怕吵醒你，一个人撑着墙挪到阳台风口里压着喘息，指尖夹着没点燃的烟在暗处微微发抖。"}, {"id": "c3s4", "route": "scar", "beat": "你翻医药箱替他找活血药膏时，在夹层里意外碰出一张旧伤复查体检单，和一份已经签好字、准备下月搬去邻县的修车铺租约。"}, {"id": "c3s5", "route": "scar", "beat": "台风过境天色大亮，他把那把旧黑伞和修车厂钥匙并排留在餐桌上，拎起帆布包走到门口，回头说邻县汽修街正缺个手熟的师傅。"}], "第一章 雨落在旧招牌上": [{"id": "c1s1", "route": "revenge", "beat": "她在南巷盘下漏雨的旧书店，招牌用的是假姓。"}, {"id": "c1s2", "route": "revenge", "beat": "旧友周愔推门避雨，没认出她，只说这店以前死过人。"}, {"id": "c1s3", "route": "revenge", "beat": "她翻出当年的判决剪报，纸角缺了一块。"}, {"id": "c1s4", "route": "revenge", "beat": "债主上门，认出她眉眼，开口要旧账。"}, {"id": "c1s5", "route": "revenge", "beat": "她在雨里撞见当年作证的人，对方撑伞替她挡了一下。"}, {"id": "c1s6", "route": "revenge", "beat": "夜里有人从门缝塞进一张收据，字迹是那人的。"}], "第二章 客气话里的刀": [{"id": "c2s1", "route": "revenge", "beat": "她约那人喝茶，全程只说天气和茶价。"}, {"id": "c2s2", "route": "revenge", "beat": "周愔又来，帮她搬书，说起当年那场官司。"}, {"id": "c2s3", "route": "revenge", "beat": "她发现旧账本被翻过，页码乱了两处。"}, {"id": "c2s4", "route": "revenge", "beat": "那人的妻子登门，塞来一沓钱，求她别再闹。"}, {"id": "c2s5", "route": "revenge", "beat": "她在河边听见对方醉酒说了真话，声音被雨盖住一半。"}, {"id": "c2s6", "route": "revenge", "beat": "回家路上她把伞给了淋雨的陌生小孩。"}], "第三章 她自己的活法": [{"id": "c3s1", "route": "revenge", "beat": "她把手上的东西摊在桌上，第一次没有绕弯子。"}, {"id": "c3s2", "route": "revenge", "beat": "那人来求她，说愿意还钱、还名。"}, {"id": "c3s3", "route": "revenge", "beat": "周愔承认当年他也在场，没能开口。"}, {"id": "c3s4", "route": "revenge", "beat": "雨停了一夜，招牌的半边终于写上字。"}, {"id": "c3s5", "route": "revenge", "beat": "书卖出第一本，是个躲雨的女生，问她为何留在这。"}], "第一章 记在账上": [{"id": "c1s1", "route": "ledger", "beat": "雨夜加班，她替他垫付车费，记在第37条。"}, {"id": "c1s2", "route": "ledger", "beat": "茶水间听见他夸别人细心，她把杯子放回原处。"}, {"id": "c1s3", "route": "ledger", "beat": "部门聚餐他说先垫，她付款，备注写清。"}, {"id": "c1s4", "route": "ledger", "beat": "回家雨大，她算出这月替他垫了两千四。"}, {"id": "c1s5", "route": "ledger", "beat": "他发来“改天请你”，她盯着三个字看了很久。"}], "第二章 雨里对账": [{"id": "c2s1", "route": "ledger", "beat": "项目出事，他第一句话是问：哪条合同能补。"}, {"id": "c2s2", "route": "ledger", "beat": "她替他挡下追责，会议记录只写自己经手。"}, {"id": "c2s3", "route": "ledger", "beat": "雨停十分钟，他在楼下说“你人真好”。"}, {"id": "c2s4", "route": "ledger", "beat": "她列了张单：三年，四十七笔，全带日期。"}, {"id": "c2s5", "route": "ledger", "beat": "他生日，她照例转账，这次多打了一行备注。"}], "第三章 我直接要": [{"id": "c3s1", "route": "ledger", "beat": "两份清单并排放在他桌上：一份钱，一份时间。"}, {"id": "c3s2", "route": "ledger", "beat": "他说：我们之间不用算这么清。"}, {"id": "c3s3", "route": "ledger", "beat": "雨又落，她把伞只撑在自己头顶。"}, {"id": "c3s4", "route": "ledger", "beat": "他问非要这样吗，她答一个字：是。"}, {"id": "c3s5", "route": "ledger", "beat": "他转账，数字对，时间晚了两天。"}, {"id": "c3s6", "route": "ledger", "beat": "最后她开口，说出想要的东西，不是钱。"}], "第一章 一具无名尸": [{"id": "c1s1", "route": "coroner", "beat": "雨夜送来无名女尸，他在灯下先看指缝"}, {"id": "c1s2", "route": "coroner", "beat": "他说贝壳粉，来源应该在城东旧码头"}, {"id": "c1s3", "route": "coroner", "beat": "你猜是溺水，他纠正：肺里没水"}, {"id": "c1s4", "route": "coroner", "beat": "凌晨三点，你把凉掉的咖啡换成热的"}, {"id": "c1s5", "route": "coroner", "beat": "报告里他删掉一句推测，只留证据"}, {"id": "c1s6", "route": "coroner", "beat": "死者身份出来：旧城区的裁缝"}], "第二章 证据不足": [{"id": "c2s1", "route": "coroner", "beat": "你来旁听解剖，他没拦你"}, {"id": "c2s2", "route": "coroner", "beat": "中途你退到墙边，他没停手"}, {"id": "c2s3", "route": "coroner", "beat": "你问他为什么老说证据不足"}, {"id": "c2s4", "route": "coroner", "beat": "他讲起自己第一具尸体的名字"}, {"id": "c2s5", "route": "coroner", "beat": "案子被上面调走，理由是辖区变了"}, {"id": "c2s6", "route": "coroner", "beat": "夜里他一个人在解剖室坐着，没开灯"}], "第三章 不必证明": [{"id": "c3s1", "route": "coroner", "beat": "台风夜停电，他用手电把最后一刀做完"}, {"id": "c3s2", "route": "coroner", "beat": "你带来那份被删掉的报告副本"}, {"id": "c3s3", "route": "coroner", "beat": "他说了一句不合职业的话，很轻"}, {"id": "c3s4", "route": "coroner", "beat": "案子结了，没有人被追责"}, {"id": "c3s5", "route": "coroner", "beat": "他把骨锯收进箱子里，扣上锁"}], "第一章 谁都说你好": [{"id": "c1s1", "route": "hollow", "beat": "聚会上他记得每个人口味，自己一杯没喝光"}, {"id": "c1s2", "route": "hollow", "beat": "散场后他坚持送你，路上话很少"}, {"id": "c1s3", "route": "hollow", "beat": "你问他为什么总在笑，他愣了一秒"}, {"id": "c1s4", "route": "hollow", "beat": "他答应的事又忘了，第二天补上表情包"}, {"id": "c1s5", "route": "hollow", "beat": "加班到十点，他在楼下等你，手里两杯奶茶"}, {"id": "c1s6", "route": "hollow", "beat": "你说他好得不像真的，他笑得更用力了"}], "第二章 别看我": [{"id": "c2s1", "route": "hollow", "beat": "项目组吵起来，他端着杯子去了走廊"}, {"id": "c2s2", "route": "hollow", "beat": "楼梯间里他靠着墙，没看手机"}, {"id": "c2s3", "route": "hollow", "beat": "他第一次说「我怕」，说完立刻开玩笑"}, {"id": "c2s4", "route": "hollow", "beat": "他消失三天，消息只回表情"}, {"id": "c2s5", "route": "hollow", "beat": "回来那天，他把方案全推翻重做"}, {"id": "c2s6", "route": "hollow", "beat": "散会后他一个人留在会议室"}], "第三章 好人不等于谁都可以": [{"id": "c3s1", "route": "hollow", "beat": "台风天他提着两袋东西来找你"}, {"id": "c3s2", "route": "hollow", "beat": "他说出真实想法，句子很长，没抬头"}, {"id": "c3s3", "route": "hollow", "beat": "他第一次当面拒绝同事的活"}, {"id": "c3s4", "route": "hollow", "beat": "他把那副笑脸收起来，说这就是我"}, {"id": "c3s5", "route": "hollow", "beat": "项目收尾，他提了个不算讨好的方案"}], "第一章 甲方会议室": [{"id": "c1s1", "route": "rival", "beat": "竞标同场，她的方案比你们薄一页"}, {"id": "c1s2", "route": "rival", "beat": "散会她走过来递名片，说好久不见"}, {"id": "c1s3", "route": "rival", "beat": "甲方把预算压了两成，她没反驳"}, {"id": "c1s4", "route": "rival", "beat": "电梯同乘，她提起六年前那场会"}, {"id": "c1s5", "route": "rival", "beat": "她约你喝咖啡，说只谈项目"}, {"id": "c1s6", "route": "rival", "beat": "咖啡凉了，她把话绕回署名"}], "第二章 各为其主": [{"id": "c2s1", "route": "rival", "beat": "她开始约你团队的人吃饭"}, {"id": "c2s2", "route": "rival", "beat": "她说我只是问价，不挖人"}, {"id": "c2s3", "route": "rival", "beat": "你把话挑明：这次我不让"}, {"id": "c2s4", "route": "rival", "beat": "台风夜两人被困在会议室"}, {"id": "c2s5", "route": "rival", "beat": "她说起当年为什么走，很短"}, {"id": "c2s6", "route": "rival", "beat": "她先开口说自己的现状，不藏了"}], "第三章 各退一步": [{"id": "c3s1", "route": "rival", "beat": "她提合并投标，署名一人一半"}, {"id": "c3s2", "route": "rival", "beat": "你们为一条退线争了两个小时"}, {"id": "c3s3", "route": "rival", "beat": "她把底牌亮出来：甲方要的是低价"}, {"id": "c3s4", "route": "rival", "beat": "签合同那天，她比你先到"}, {"id": "c3s5", "route": "rival", "beat": "签完她问你：还要不要做朋友"}], "第一章 笔录": [{"id": "c1s1", "route": "badge", "beat": "他按流程逐条问，一个字都不跳"}, {"id": "c1s2", "route": "badge", "beat": "你说这事明显是谁干的，他摇头"}, {"id": "c1s3", "route": "badge", "beat": "他给你一张回执，编号写得很工整"}, {"id": "c1s4", "route": "badge", "beat": "桌上有一盒胃药，压着半张便签"}, {"id": "c1s5", "route": "badge", "beat": "临走他多说一句：别自己去找人"}, {"id": "c1s6", "route": "badge", "beat": "夜里你路过，值班室的灯还亮着"}], "第二章 按规矩来": [{"id": "c2s1", "route": "badge", "beat": "隔壁两家吵架，他站中间讲程序"}, {"id": "c2s2", "route": "badge", "beat": "有人骂他死板，他没回嘴"}, {"id": "c2s3", "route": "badge", "beat": "台风夜他值班，接了七个电话"}, {"id": "c2s4", "route": "badge", "beat": "他说最怕的不是累，是判断错"}, {"id": "c2s5", "route": "badge", "beat": "笔录签字前，他把每一行念给你听"}, {"id": "c2s6", "route": "badge", "beat": "有人托关系来打招呼，他当场回绝"}], "第三章 我也会错": [{"id": "c3s1", "route": "badge", "beat": "他误判了一次，当事人被放走"}, {"id": "c3s2", "route": "badge", "beat": "他连夜写检查，一页纸改了四遍"}, {"id": "c3s3", "route": "badge", "beat": "领导问要不要担责，他说是"}, {"id": "c3s4", "route": "badge", "beat": "他把警号牌擦干净，扣回胸前"}, {"id": "c3s5", "route": "badge", "beat": "下班他在门口站了一会儿才走"}], "第一章 一个问题": [{"id": "c1s1", "route": "boss", "beat": "白板上只写一个问题，别人不敢往上加"}, {"id": "c1s2", "route": "boss", "beat": "开会她打断三次，每次都问同一个点"}, {"id": "c1s3", "route": "boss", "beat": "她当众否了你的方案，会后发来三条修改"}, {"id": "c1s4", "route": "boss", "beat": "加班到十点，她把最后一份外卖留给你"}, {"id": "c1s5", "route": "boss", "beat": "组里有人抱怨她太冷，你没接话"}, {"id": "c1s6", "route": "boss", "beat": "项目过了第一关，她在群里只发一个字：好"}], "第二章 边界": [{"id": "c2s1", "route": "boss", "beat": "她把你借调到别的组，没提前说"}, {"id": "c2s2", "route": "boss", "beat": "楼梯间碰见她打电话，声音很低"}, {"id": "c2s3", "route": "boss", "beat": "她说了一句不像她的话：我也会累"}, {"id": "c2s4", "route": "boss", "beat": "甲方临时加需求，她一个人扛下来"}, {"id": "c2s5", "route": "boss", "beat": "她拒绝了一次应酬，理由写得很正式"}, {"id": "c2s6", "route": "boss", "beat": "周五她发来周报，最后一栏写：下周你决定"}], "第三章 说清楚": [{"id": "c3s1", "route": "boss", "beat": "项目要收尾，她把决定权交出来"}, {"id": "c3s2", "route": "boss", "beat": "她第一次在会后留下来，没急着走"}, {"id": "c3s3", "route": "boss", "beat": "她说当年也被人这样带过，很短的一句"}, {"id": "c3s4", "route": "boss", "beat": "你提了一个她不同意的方案，她没否"}, {"id": "c3s5", "route": "boss", "beat": "交付当天她在门口等你，手里两份合同"}], "第一章 她回来了": [{"id": "c1s1", "route": "tyrant", "beat": "会议室玻璃门被推开，外部顾问抱着文件夹走进来。霍衍正签字的手指在纸面顿了整整一秒，墨点在落款旁洇开一小圈。"}, {"id": "c1s2", "route": "tyrant", "beat": "久别重逢的第一句话他仍改不掉发号施令的腔调，下巴微抬指了指长桌对面，只丢出三个字「坐那边」，视线却没从她脸上移开。"}, {"id": "c1s3", "route": "tyrant", "beat": "她摊开项目评估表，逐条汇报风险与成本，措辞礼貌而疏离，除了公事一个多余的字都不肯给，像在面对素昧平生的甲方。"}, {"id": "c1s4", "route": "tyrant", "beat": "散会后办公室只剩他一人，他把那份签好字的合同合上，叫来助理假作随口过问，让人去打听她回城后如今住在哪一片。"}, {"id": "c1s5", "route": "tyrant", "beat": "次日一早她来上班，发现自己的工位被连夜从开放外间挪进了挨着总经理室的玻璃里间，桌上还多了一盏护眼台灯。"}, {"id": "c1s6", "route": "tyrant", "beat": "傍晚例会结束众人陆续离开，她收拾电脑走在最后。他站在门边叫住她名字，话到嘴边却卡住，最终只生硬地丢出一句路上小心。"}], "第二章 命令句变成问句": [{"id": "c2s1", "route": "tyrant", "beat": "季度评审会上她当众对核心方案提出尖锐异议，满屋高管噤声。他习惯性皱眉把方案压了下去，话一出口却看见她眼底彻底冷下来的光。"}, {"id": "c2s2", "route": "tyrant", "beat": "第二天上午九点整，她把装在白色信封里的解约与辞呈端端正正放在他宽大的办公桌中央，转身时高跟鞋声干脆得没有一丝迟疑。"}, {"id": "c2s3", "route": "tyrant", "beat": "他追到电梯间，在金属门即将合拢的半秒伸手挡住，一向只用命令句的喉结滚动了一下，第一次放低声音问她「你到底要什么」。"}, {"id": "c2s4", "route": "tyrant", "beat": "台风夜暴雨倾盆，他独自开车停在她公寓楼下，熄了大灯坐在暗处。雨刷来回摆动，他看着三楼那扇亮着的窗，一坐就是半宿。"}, {"id": "c2s5", "route": "tyrant", "beat": "她在楼道口撑伞走到车窗边，雨水顺着伞骨往下滴。她没避让，直接问他六年前在董事会门口说的那句「各取所需」到底算什么。"}, {"id": "c2s6", "route": "tyrant", "beat": "说完那句她便转身进了单元门，门禁滴一声落锁。他手搭在方向盘上指节发白，这一次没有再借权势拦人，只在雨里目送灯熄。"}], "第三章 把自己交出去": [{"id": "c3s1", "route": "tyrant", "beat": "临时董事会上他关掉投影，当着所有股东与家族长辈的面把当年压下她提案的来龙去脉原原本本摊开，亲手掀翻了自己最看重的体面。"}, {"id": "c3s2", "route": "tyrant", "beat": "走廊尽头她听完会议纪要，唇角扬起一点冷淡的弧度，盯着他问这种伤敌一千自损八百的戏码，他又打算从她这里图什么。"}, {"id": "c3s3", "route": "tyrant", "beat": "他把签好字的股权与管理权移交书推过桌面，将总经理的实权亲手交出去一半，语气平缓地说这一次不再拿筹码跟她谈条件。"}, {"id": "c3s4", "route": "tyrant", "beat": "暴雨过后的黄昏，她在他半掩的办公室门口站了一会儿，看着桌角那份没收走的旧设计稿，终究没有立刻迈步进来。"}, {"id": "c3s5", "route": "tyrant", "beat": "雨停放晴那天傍晚，晚霞把写字楼玻璃幕墙染成橘红。他在楼下台阶前叫住她，难得带了点迟疑，问她愿不愿意一起吃顿晚饭。"}], "第一章 显影液": [{"id": "c1s1", "route": "steady", "beat": "他说你要的话我帮你找，转身进了暗房"}, {"id": "c1s2", "route": "steady", "beat": "暗房红灯下他把底片一张张举起来"}, {"id": "c1s3", "route": "steady", "beat": "照片找到了，边上多洗了一张"}, {"id": "c1s4", "route": "steady", "beat": "他把店里的备用钥匙放你手里"}, {"id": "c1s5", "route": "steady", "beat": "你说这店以前不是他开的"}, {"id": "c1s6", "route": "steady", "beat": "打烊时他送你到巷口，路灯坏了一盏"}], "第二章 你需要的话": [{"id": "c2s1", "route": "steady", "beat": "下雨他撑伞在楼下等，没打电话"}, {"id": "c2s2", "route": "steady", "beat": "你加班到很晚，他把车停在对面"}, {"id": "c2s3", "route": "steady", "beat": "同事误会你们的关系，他没解释"}, {"id": "c2s4", "route": "steady", "beat": "他病了两天，店门关着没人知道"}, {"id": "c2s5", "route": "steady", "beat": "你说起要离开这座城，他沉默了一会儿"}, {"id": "c2s6", "route": "steady", "beat": "他帮你挡了一次不该他管的事"}], "第三章 我该走了": [{"id": "c3s1", "route": "steady", "beat": "他说父亲的店要接手，在外地"}, {"id": "c3s2", "route": "steady", "beat": "他把一本相册推过来，替你留的"}, {"id": "c3s3", "route": "steady", "beat": "他最后一次说：你需要的话"}, {"id": "c3s4", "route": "steady", "beat": "搬店那天他把旧招牌取下来"}, {"id": "c3s5", "route": "steady", "beat": "车开走之前，他摇下窗说了句话"}], "第一章 名字": [{"id": "c1s1", "route": "double", "beat": "她推门进来，报了个名字，声音不像她"}, {"id": "c1s2", "route": "double", "beat": "她认下这个名字，连旧事都说得对"}, {"id": "c1s3", "route": "double", "beat": "她说起那件旧事，语气是别人的"}, {"id": "c1s4", "route": "double", "beat": "派出所的人来查，她演得滴水不漏"}, {"id": "c1s5", "route": "double", "beat": "人走后她靠在柜台上，力气全没了"}, {"id": "c1s6", "route": "double", "beat": "她突然用你的语气回了一句话"}], "第二章 谁的语气": [{"id": "c2s1", "route": "double", "beat": "她学你说话，一字不差"}, {"id": "c2s2", "route": "double", "beat": "她承认自己在演，说演久了就分不清"}, {"id": "c2s3", "route": "double", "beat": "你问她想不想找原来的自己"}, {"id": "c2s4", "route": "double", "beat": "她说起失踪那天的雨，细节全对"}, {"id": "c2s5", "route": "double", "beat": "有人来找「原来的她」，欠了一笔钱"}, {"id": "c2s6", "route": "double", "beat": "她问：你觉得我像谁"}], "第三章 我就是我": [{"id": "c3s1", "route": "double", "beat": "真身没有回来，只寄来一封信"}, {"id": "c3s2", "route": "double", "beat": "她拆信的手停在半空"}, {"id": "c3s3", "route": "double", "beat": "信上说这里的一切都归你"}, {"id": "c3s4", "route": "double", "beat": "她去派出所改了名字，回来时天晴了"}, {"id": "c3s5", "route": "double", "beat": "她站在店门口，第一次没用别人的语气说话"}], "第一章 石板": [{"id": "c1s1", "route": "gate", "beat": "冷雨顺着关墙砖缝往下淌，卫言提着纸罩风灯蹲在石板前，用拇指抹掉第一行刻痕里的泥沙，声音低平地念出第一条：报上名字。"}, {"id": "c1s2", "route": "gate", "beat": "雨点敲在灯纸上发出沉闷细响，他指腹顺着湿冷刻痕一行行往下移，将石板十七条关规逐字念完，不快不慢，像在数一颗颗旧米。"}, {"id": "c1s3", "route": "gate", "beat": "念到第七条「过关者不得回头」时，他的指尖在较浅的刻痕上停了半秒。那行字比前后都小，像是当年有人刻意磨轻过。"}, {"id": "c1s4", "route": "gate", "beat": "夜半落闸后关城死寂，他抱着长刀靠坐在城门内侧石阶上，不吃不睡，只有风灯火苗在雨雾里晃出一小圈微弱的暖光。"}, {"id": "c1s5", "route": "gate", "beat": "雨雾深处窜出一道黑影试图趁夜硬闯，他连刀都没拔，只起身单手扣住对方腕骨往外一送，随即退回门槛内侧重新坐好。"}, {"id": "c1s6", "route": "gate", "beat": "后半夜雨势转小，他替你添了半勺热水进粗陶碗，目光落回门外漆黑古道，破天荒多问了一句你为什么偏要走这条无人问津的道。"}], "第二章 规则高于人": [{"id": "c2s1", "route": "gate", "beat": "第二夜那名硬闯者果然折返，袖中藏着淬了油的短刃，借着雾色直逼关门，目标却在半途猛地转向站在灯影里的你。"}, {"id": "c2s2", "route": "gate", "beat": "刀锋划破他左臂粗布衣袖，血顺着指节滴在青石上。他却没先包扎，反手按住伤口第一件事是蹲下去看石板有没有被刀气碰歪。"}, {"id": "c2s3", "route": "gate", "beat": "山洪冲断了关外石桥，他盯着雨幕沉默许久，第一次违背自己守了半生的条文，把门闩重新插上，让你在关内避雨多待了一夜。"}, {"id": "c2s4", "route": "gate", "beat": "次日巡关使骑马赶来清点名册，目光在屋檐下多留了茶碗的石桌上扫过。卫言面色不动，照常报完账目，一个字也没提你的行踪。"}, {"id": "c2s5", "route": "gate", "beat": "火塘边他低头给伤口换药，绷带缠得极紧。他说关规不是他定的，可既然接了这把钥匙，只要站在这里就得把每一条守死。"}, {"id": "c2s6", "route": "gate", "beat": "你问他一个人守了多久，他抬眼看了一眼被风雨剥蚀的门楣，语气平淡得像在报明日阴晴，说算上前面几位守门人，已经三百年。"}], "第三章 改一条规则": [{"id": "c3s1", "route": "gate", "beat": "雨歇的深夜他提灯带你绕到石板背面，荒草深处藏着一块尚未刻字的空白青石，旁边安静摆着一把刃口发亮的铁凿。"}, {"id": "c3s2", "route": "gate", "beat": "他拿起铁凿在石面上比了比位置，声音低沉却很稳，说改一条旧规必须在一夜之间亲手刻完，只要凿错一笔就得整块推倒重来。"}, {"id": "c3s3", "route": "gate", "beat": "凿石声在寂静关隘里一下一下敲响，石屑溅在他手背上。你凑近风灯才看清，他正在一笔一划重刻的正是第七条：过关者不得回头。"}, {"id": "c3s4", "route": "gate", "beat": "天边透出鱼肚白时最后一笔终于落定，新刻的字痕泛着浅白石粉。他收起铁凿，虎口震裂的口子还在渗血，却先拿衣袖替你拂去肩上石灰。"}, {"id": "c3s5", "route": "gate", "beat": "晨雾散开，他单手将厚重的铁木关门推开一半，自己却仍留在门槛内侧，看着你背影立在日光里，轻声说这一次你可以回头。"}], "第一章 第三章": [{"id": "c1s1", "route": "doomed", "beat": "她把书翻到最后一页，指着自己的名字"}, {"id": "c1s2", "route": "doomed", "beat": "她说反正会死，先干点想干的"}, {"id": "c1s3", "route": "doomed", "beat": "她爬上灯塔顶，风很大"}, {"id": "c1s4", "route": "doomed", "beat": "她说她从来不害怕，因为怕没用"}, {"id": "c1s5", "route": "doomed", "beat": "她问你要不要一起写结局"}, {"id": "c1s6", "route": "doomed", "beat": "半夜她敲门，说睡不着"}], "第二章 免罪符": [{"id": "c2s1", "route": "doomed", "beat": "她用「反正我会死」推掉所有约定"}, {"id": "c2s2", "route": "doomed", "beat": "她说了句很伤人的话，笑着说的"}, {"id": "c2s3", "route": "doomed", "beat": "第二天她拿着两个包子在门口等"}, {"id": "c2s4", "route": "doomed", "beat": "她第一次说对不起，说得很费劲"}, {"id": "c2s5", "route": "doomed", "beat": "书里的字开始变了，她的名字被划掉一半"}, {"id": "c2s6", "route": "doomed", "beat": "她说如果我活到第四章，你要干什么"}], "第三章 被记住": [{"id": "c3s1", "route": "doomed", "beat": "她列了张单子：想被记住的方式"}, {"id": "c3s2", "route": "doomed", "beat": "她想去见一次书里那个「作者」"}, {"id": "c3s3", "route": "doomed", "beat": "作者是个在便利店值夜的人，很年轻"}, {"id": "c3s4", "route": "doomed", "beat": "他改了一句话，她的名字后面多了一个逗号"}, {"id": "c3s5", "route": "doomed", "beat": "天亮之前，她问你记住了什么"}], "第一章 铁链": [{"id": "c1s1", "route": "hostage", "beat": "他把碗推回来，说先尝一口"}, {"id": "c1s2", "route": "hostage", "beat": "他记下你每天来的时辰"}, {"id": "c1s3", "route": "hostage", "beat": "他试探你说漏一句国事"}, {"id": "c1s4", "route": "hostage", "beat": "夜里链子响，他在地上画地图"}, {"id": "c1s5", "route": "hostage", "beat": "他说你比上一个送饭的客气"}, {"id": "c1s6", "route": "hostage", "beat": "他忽然问你叫什么名字"}], "第二章 把温柔当陷阱": [{"id": "c2s1", "route": "hostage", "beat": "你给他药，他先闻再抿一点"}, {"id": "c2s2", "route": "hostage", "beat": "他说从前有人笑着给他下过东西"}, {"id": "c2s3", "route": "hostage", "beat": "他被上头问话，回来时衣领破了"}, {"id": "c2s4", "route": "hostage", "beat": "他说欠你一件事，会记着"}, {"id": "c2s5", "route": "hostage", "beat": "他第一次说了家乡的事，说了很久"}, {"id": "c2s6", "route": "hostage", "beat": "他用你的名字念了一句诗"}], "第三章 学会把人当人": [{"id": "c3s1", "route": "hostage", "beat": "邻国来人，接他回去"}, {"id": "c3s2", "route": "hostage", "beat": "他把脚上的链子放在桌上"}, {"id": "c3s3", "route": "hostage", "beat": "他问你要不要一起走"}, {"id": "c3s4", "route": "hostage", "beat": "出发前夜，他把刀擦干净放回原处"}, {"id": "c3s5", "route": "hostage", "beat": "城门开的时候，他回头看了一眼"}], "第一章 同桌": [{"id": "c1s1", "route": "topstudent", "beat": "九月的风从纱窗缝钻进来，掀起试卷边角。许澈把课桌中间那摞书往自己那边挪了两寸，书脊磕在木沿闷闷一声，眼皮都没抬，算打过招呼。"}, {"id": "c1s2", "route": "topstudent", "beat": "他一整天开口不超过十句，作业本发下来选择题却全对。你凑近问思路，他停了半秒，把写满密密麻麻步骤的草稿纸往你这边推了半寸。"}, {"id": "c1s3", "route": "topstudent", "beat": "早读铃响前你想瞄一眼他的选择题答案，他直接伸出小臂把卷面全挡住，只冷声留一句「自己算」，转手却把关键公式折在草稿纸角推过来。"}, {"id": "c1s4", "route": "topstudent", "beat": "晚自习停电前日光灯闪了两下，他借着微光推过来一张撕齐边角的纸条，上面用极细的笔迹写清三步解法，末尾画了个极小的箭头指着你的错题。"}, {"id": "c1s5", "route": "topstudent", "beat": "月考红榜贴在走廊玻璃窗上，你往前冲了二十名。他路过时停在榜前两秒，什么都没夸，回座位却顺手把一瓶常温酸奶搁在你手边。"}, {"id": "c1s6", "route": "topstudent", "beat": "放学暴雨砸在教学楼雨棚上，你没带伞站在台阶口。他撑开黑伞走下来，伞骨不动声色往你这边偏了三分，自己左肩的校服湿了深色一块。"}], "第二章 分数": [{"id": "c2s1", "route": "topstudent", "beat": "模拟考发卷后你考砸了，把脸埋在胳膊里一动不动。走廊人声渐散，他没劝你别难过，只把你桌角那张皱掉的答题卡慢慢抚平压在尺子下。"}, {"id": "c2s2", "route": "topstudent", "beat": "空教室只剩你们俩，窗外天色暗成铅灰。他讲压轴题时语速放得很慢，一句一句拆开，笔尖在纸上点出轻响，直到你点头才翻下一页。"}, {"id": "c2s3", "route": "topstudent", "beat": "公告栏贴出保送初审名单，最上面印着他的名字，下面没有你。风把红纸吹得猎猎作响，他站在人群外看了一眼，转头先把你拉出走廊。"}, {"id": "c2s4", "route": "topstudent", "beat": "教务处门口他把保送确认表折好塞回袋里，语气平得像在报天气，说不打算去保送，要留下来一起考，说完别开眼没让你看清表情。"}, {"id": "c2s5", "route": "topstudent", "beat": "夜自习后天台风很凉，他第一次提起家里逼他早点定下出路的事。说完指节抵着栏杆顿了顿，低声补一句「这次我想自己选」。"}], "第三章 一起考": [{"id": "c3s1", "route": "topstudent", "beat": "填报志愿那天教室里闷热，风扇吱呀转着。他把自己的志愿草表推到你桌中央，最上面第一栏留着半行空白，只等你抬头看过去。"}, {"id": "c3s2", "route": "topstudent", "beat": "蝉鸣把窗外的午后吵得发白，他低头转着中性笔，声音压得很轻，几乎混在风声里，说出那句藏了整整一学期的打算。"}, {"id": "c3s3", "route": "topstudent", "beat": "高考前一晚操场跑道泛着昏黄路灯，他沿着最外圈走了很多圈，听见你脚步声后放慢步子，把手里两颗薄荷糖分给你一颗。"}, {"id": "c3s4", "route": "topstudent", "beat": "最后一门交卷铃拉长响起，人潮从考场楼梯汹涌往下挤。他逆着人群站在梧桐树影下，一眼找到你，伸手把你被挤歪的书包带扶正。"}, {"id": "c3s5", "route": "topstudent", "beat": "毕业聚餐散场时雨刚好停，路面积着霓虹倒影。他从口袋里抽出两张叠得整齐的车票，指尖在票根上按了一下，问你几点出发。"}], "第一章 内阁": [{"id": "c1s1", "route": "minister", "beat": "内阁值房炭盆闷着三块红炭，你把密信递上案头。崔琰没抬头，左手接过信，右手朱笔仍稳稳圈完折子上的名字，才将信压在案角。"}, {"id": "c1s2", "route": "minister", "beat": "烛芯爆出一点火星，他抬手压住微微卷起的宣纸边角，声音平缓得听不出喜怒，问你方才抬头时在折子上看见了几个字。"}, {"id": "c1s3", "route": "minister", "beat": "他不置可否地合上折子，只以「字迹尚可」为由留你在值房抄录三日文书，案头恰好摆着与旧案牵连的那几卷陈年邸报。"}, {"id": "c1s4", "route": "minister", "beat": "散值时廊下飘起细雪，同僚压低声音扯住你袖角，劝你离崔阁老远些，说他向来把身边人当过河卒，用完即弃。"}, {"id": "c1s5", "route": "minister", "beat": "三更漏尽值房寒气渗骨，你伏案磨墨时肩头忽然一沉，他将一件带着淡淡沉水香的旧玄色披风搭在你背上，没说一句话便转身续炭。"}, {"id": "c1s6", "route": "minister", "beat": "窗外风雪拍打窗棂，他替你斟了一盏滚茶推过案来，语气轻得像闲谈，顺口问起你父亲当年离京前最后见过的那个人。"}], "第二章 把人当筹码": [{"id": "c2s1", "route": "minister", "beat": "他亲手封好一封无印素笺递给你，指明要你在酉时前送到最不该涉足的王府侧门，眉眼沉静，像在试探你的胆量与分寸。"}, {"id": "c2s2", "route": "minister", "beat": "宫门落钥后北风如刀，你因那封信被侍卫拦在宫墙外站了整整一夜，靴底积满碎雪，直到晨鼓响起才见内阁马车缓缓停在阶前。"}, {"id": "c2s3", "route": "minister", "beat": "朝房外众人目光灼灼，他当着御史与诸位阁臣的面淡声开口，说那封信是他的意思，一力替你把越矩的罪名全数担下。"}, {"id": "c2s4", "route": "minister", "beat": "回到值房他提笔重拟票拟，朱笔划过纸面极稳，不动声色删掉了那句足以牵连你全家的评语，墨迹未干便盖上了内阁大印。"}, {"id": "c2s5", "route": "minister", "beat": "灯影在他半边侧脸拉出深浅轮廓，他搁下朱笔抬头看你，指尖在砚台边停了半拍，声音压低问你跟着他走这一步怕不怕。"}, {"id": "c2s6", "route": "minister", "beat": "他从暗格取出那枚边缘磨润的旧私印，放进你微微发凉的掌心，合拢你手指按了一下，只说以后遇急事凭此印见他。"}], "第三章 拿前程下注": [{"id": "c3s1", "route": "minister", "beat": "早朝钟鸣九响，他越众出列，将连夜整理好的陈年证词与翻案奏疏亲手呈上御案，为你的父亲争一个迟来多年的公道。"}, {"id": "c3s2", "route": "minister", "beat": "金殿上御史连番弹劾他徇私结党，言辞锋利如刃。他垂袖立在丹陛之下，脊背挺得笔直，自始至终没为自己辩解半个字。"}, {"id": "c3s3", "route": "minister", "beat": "停职思过的旨意传到内阁，往日门庭若市的值房瞬间冷清，只剩你守着一盏孤灯整理未完的卷宗，案上还留着他的半杯冷茶。"}, {"id": "c3s4", "route": "minister", "beat": "雪夜小院炭火微弱，他脱去官袍只着素色直裰，看着你冻红的指尖，第一次放下首辅的滴水不漏，说出一句带温度的私心话。"}, {"id": "c3s5", "route": "minister", "beat": "开春柳色初新，他复职重入内阁那天，朱红宫墙下百官避道。他从你面前走过时步子略微一顿，低声留了一句傍晚在老地方等你。"}], "第一章 搬家": [{"id": "c1s1", "route": "senior", "beat": "他帮你把箱子抬上四楼，没要谢"}, {"id": "c1s2", "route": "senior", "beat": "他说有事喊一声，然后就回屋了"}, {"id": "c1s3", "route": "senior", "beat": "他记得你不能吃辣，点外卖时说了"}, {"id": "c1s4", "route": "senior", "beat": "楼下有人吵架，他先下来看你在不在"}, {"id": "c1s5", "route": "senior", "beat": "他带你去认路，走到超市门口停下"}, {"id": "c1s6", "route": "senior", "beat": "他说这楼晚上水管会响，别怕"}], "第二章 台阶": [{"id": "c2s1", "route": "senior", "beat": "你面试失利，蹲在楼梯口"}, {"id": "c2s2", "route": "senior", "beat": "他没追问，只说先吃饭"}, {"id": "c2s3", "route": "senior", "beat": "他给你找了个实习，说正好缺人"}, {"id": "c2s4", "route": "senior", "beat": "他毕业答辩那天，你在楼下等"}, {"id": "c2s5", "route": "senior", "beat": "他说要去外地工作，问得很快"}, {"id": "c2s6", "route": "senior", "beat": "他把阳台的花托你照看"}], " 朝你干脆地举了举，转身汇入登机口方向。"}], "第一章 雨棚下的旧骨": [{"id": "umb_1", "route": "umbrella", "beat": "暴雨夜你抱着折断的伞冲进铺子，他递来干毛巾，让你先把伞搁在木凳上晾着。"}, {"id": "umb_2", "route": "umbrella", "beat": "他用钳子一点点掰直变形的铝骨，说这把伞以前被人硬撑过顶风，才留下暗伤。"}, {"id": "umb_3", "route": "umbrella", "beat": "老街竹编匠老吴冒雨来借油漆，顺口提了一句年底拆迁补偿款的事，他只应了一声没接话。"}, {"id": "umb_4", "route": "umbrella", "beat": "你帮他扶着伞柄穿铜丝，指尖不小心碰到他手背，他手稳得连铜丝都没晃一下。"}, {"id": "umb_5", "route": "umbrella", "beat": "雨没有停的意思，他从柜台后倒了两杯滚烫的铁观音，把缺口朝自己的那只留在手边。"}], "第二章 檐下借光": [{"id": "umb_6", "route": "umbrella", "beat": "连续几天阴雨，你索性拿旧画夹去他铺子避雨，两人各自干活，一下午没说超过五句话。"}, {"id": "umb_7", "route": "umbrella", "beat": "快递员小陆送来一箱定制伞骨，顺嘴问他新铺面找好没有，他把签收单压在镇纸下。"}, {"id": "umb_8", "route": "umbrella", "beat": "你在货架最底格看见一把锁在木盒里的旧红伞，伞面崭新，伞骨却断得干干净净。"}, {"id": "umb_9", "route": "umbrella", "beat": "他没有遮掩，只说那是六年前一个没等到雨停的人留下的，后来再没人来取。"}, {"id": "umb_10", "route": "umbrella", "beat": "老街停电半小时，他点起一支白蜡烛插在铁皮罐里，光影把两个人的影子投在挂满旧伞的墙上。"}, {"id": "umb_11", "route": "umbrella", "beat": "停电时雨漏进后窗，你和他一起拿塑料布和胶带封窗框，他肩膀全湿透了也没吭声。"}], "第三章 伞骨合拢": [{"id": "umb_12", "route": "umbrella", "beat": "拆迁通知正式贴在巷口电线杆上，隔壁两家已经开始打包货架。"}, {"id": "umb_13", "route": "umbrella", "beat": "他开始一件件清点铺子里的工具和没人认领的旧伞，把能送人的都擦干净挂到门口。"}, {"id": "umb_14", "route": "umbrella", "beat": "你问他接下来打算去哪条街，他把修好的那把伞递给你，说这次换了实心钢骨，风再大也掀不翻。"}, {"id": "umb_15", "route": "umbrella", "beat": "他在伞柄内侧用刻刀刻了一个极小的编号，却没写价钱，只说以后坏了还能找他修。"}, {"id": "umb_16", "route": "umbrella", "beat": "最后一夜老街下着细雨，铺子灯还亮着，门口那把竹骨旧伞终于被人取了下来。"}], "第一章 冬夜急诊室": [{"id": "c1s1", "route": "snowmelt", "beat": "雨夹雪砸在急诊楼玻璃上，你推开诊室门看见梁砚辞。他笔尖顿了半秒，起身先拿厚黑羽绒服不由分说罩在你肩上。"}, {"id": "c1s2", "route": "snowmelt", "beat": "他替你量完体温，眉头微锁，语气冷淡得只剩医嘱，手却把你冻得发青的指尖拢进自己大衣口袋暖了三秒。"}, {"id": "c1s3", "route": "snowmelt", "beat": "输液室凌晨灯白得刺眼，他换班路过，什么也没问，只把一杯兑好温水的蜂蜜柠檬放上小桌，转身又回抢救室。"}, {"id": "c1s4", "route": "snowmelt", "beat": "你在诊室门口撞见他的好友周朗，对方脱口而出他这一年半胃出血进过两次急诊，被梁砚辞一个眼神硬生生打断。"}, {"id": "c1s5", "route": "snowmelt", "beat": "退烧后你去取药，发现处方单背面用熟悉的锋利字迹多写了一行「回程风大，围巾系紧」，落款没有名字。"}, {"id": "c1s6", "route": "snowmelt", "beat": "医院大门口雪越下越大，你打不到车。他脱了白大褂提着车钥匙站到你身旁，只说「顺路，上车，别让我再收你一次急诊」。"}], "第二章 未寄的病历": [{"id": "c2s1", "route": "snowmelt", "beat": "车厢里暖气开得很足，挡风玻璃蒙着薄雾。他等你系好安全带才挂挡，一路只问高原上的风沙大不大，避口不提这三年。"}, {"id": "c2s2", "route": "snowmelt", "beat": "红灯停下时，你看见中控台暗格里安静躺着你三年前落在医院天台的那枚银质书签，边缘被摩挲得发亮。"}, {"id": "c2s3", "route": "snowmelt", "beat": "他送你到公寓楼下，替你把沉重的行李箱提上三楼，临走前在玄关停了半步，低声说这周复查挂他的号就行。"}, {"id": "c2s4", "route": "snowmelt", "beat": "深夜你在旧酒馆包厢外撞见独自坐着的他，桌边只摆着半杯没喝完的温水。他抬头看见你，自嘲一笑说以为自己又烧糊涂了。"}, {"id": "c2s5", "route": "snowmelt", "beat": "雨打在走廊窄窗上，他第一次卸下冷硬外壳，把三年前医疗调查几乎吊销执照、怕连累你前程才推开你的旧事和盘托出。"}], "第三章 融雪之时": [{"id": "c3s1", "route": "snowmelt", "beat": "你没有立刻原谅，只把这三年你在高原寄不出去的明信片一叠放在他面前，问他凭什么替你决定什么叫为你好。"}, {"id": "c3s2", "route": "snowmelt", "beat": "他一页页翻完那些带着邮戳的卡片，眼尾微红却没躲开你的目光，哑声承认当年是自己怯懦，这一次绝不再替你做决定。"}, {"id": "c3s3", "route": "snowmelt", "beat": "周末急诊大抢救后他累得靠在长椅上睡着，你把大衣搭在他膝头。他醒来攥住你手腕，力道轻得像怕一松手人又不见。"}, {"id": "c3s4", "route": "snowmelt", "beat": "立春前最后一场雪落下来，他休了三年里第一个年假，拎着两袋刚出锅的炒栗子站在你楼下，问你愿不愿意重新认识一次。"}, {"id": "c3s5", "route": "snowmelt", "beat": "阳光照化屋檐积雪，水滴敲在窗台叮咚作响。他把那枚银质书签放回你掌心，这一次换成他等你的回答。"}], "第一章 金光门流灯": [{"id": "c1s1", "route": "lantern", "beat": "细雨初歇的金光门漕渠边，你捞起一盏险些倾覆的素白河灯，灯底压着半枚朱砂印。撑伞的谢清晏立在柳影下问你愿不愿完愿。"}, {"id": "c1s2", "route": "lantern", "beat": "西市茶楼二层雅间，她慢条斯理暖着茶盏，几句轻飘飘的闲谈便试出你手里握着漕运残账，自己却滴水不漏。"}, {"id": "c1s3", "route": "lantern", "beat": "楼下忽有巡城司暗哨经过，她顺手将你的折扇收进袖中，借着替你添茶的动作倾身挡住窗缝视线，呼吸近在耳畔。"}, {"id": "c1s4", "route": "lantern", "beat": "皇家马场秋猎筹备，贵胄设局刁难你不懂礼制。谢清晏执卷出列，三言两语引经据典替你解围，目光却冷得像霜。"}, {"id": "c1s5", "route": "lantern", "beat": "马棚后廊风大，她把一盏暖手铜炉塞进你手里，反问你既知京城水深，为何还要往这浑水里踩。"}, {"id": "c1s6", "route": "lantern", "beat": "夜雨落瓦，她派侍女阿栀送来半张画着漕渠暗闸的舆图，纸背只留四个小楷：明夜子时，桥下候君。"}], "第二章 漕渠暗流": [{"id": "c2s1", "route": "lantern", "beat": "子时石桥下雾气弥漫，你们并肩蹲在暗闸石阶后核对私盐船号。船灯扫过水面，她指尖发凉，却稳稳按住你欲动的手背。"}, {"id": "c2s2", "route": "lantern", "beat": "有人察觉水声放箭试探，你护着她滚进芦苇深处。她发簪散落半缕，黑暗里听见你心跳太快，低声笑了一句「司直大人手在抖」。"}, {"id": "c2s3", "route": "lantern", "beat": "次日礼部公堂上，御史借流灯旧俗参她私会外臣。她端坐案前神色不动，反手将一纸仪典公文拍上桌面，反将对方一军。"}, {"id": "c2s4", "route": "lantern", "beat": "退堂后你在廊柱后拦住她，看见她袖口被箭羽擦破渗血。她嫌你多事，却还是乖乖站着让你把素帕缠上她腕间。"}, {"id": "c2s5", "route": "lantern", "beat": "灯下对账至三更，她第一次提起兄长三年前死于漕运沉船的旧怨，眼里没有泪，只问你这一局敢不敢陪她押到头。"}], "第三章 许愿池明月": [{"id": "c3s1", "route": "lantern", "beat": "主谋借宫宴发难，欲将残账栽赃到你头上。谢清晏当殿呈上另一半朱砂印与人证，字字铿锵，连自身前程也一并押上。"}, {"id": "c3s2", "route": "lantern", "beat": "案情水落石出，主犯下狱。她被罚俸半年闭门思过，你翻过矮墙送去一篮新摘橘子，她靠着窗棂笑问大人何时学会了爬墙。"}, {"id": "c3s3", "route": "lantern", "beat": "风波平息后，她问你当年金光门拾灯时许的愿还算不算数，语气轻慢，垂在膝上的手指却悄悄攥紧了衣角。"}, {"id": "c3s4", "route": "lantern", "beat": "又至放灯夜，漕渠两岸人声鼎沸。她不再穿端庄官服，换了一身素青襦裙站在桥头，把一盏写着两个名字的河灯递给你。"}, {"id": "c3s5", "route": "lantern", "beat": "河灯顺水漂向许愿池，灯火映亮她微弯的眉眼。她伸手轻轻勾住你的小指，说往后京城风浪再大，都不必各自撑伞了。"}], "第一章 课桌上的糖纸": [{"id": "c1s1", "route": "summer", "beat": "雷阵雨砸在建筑楼玻璃上，陆星沉淋湿半肩推门进来，把一盒温热黑巧直接丢进你桌洞，嘴硬说买一送一吃不完。"}, {"id": "c1s2", "route": "summer", "beat": "你把巧克力推回他手边说不要别人顺手买的，他沉默三秒忽然笑了，弯腰敲敲你桌面说「懂了，那这是专程给你买的」。"}, {"id": "c1s3", "route": "summer", "beat": "通宵赶模型时美工刀差点划到你手指，他眼疾手快一把按住你手背，皱眉训你困成这样还硬撑，转手把最难的立面全揽了过去。"}, {"id": "c1s4", "route": "summer", "beat": "清晨评图结束，指导老师夸你们的采光设计巧妙。他在台下踢了踢你鞋尖，压低声音说「谢我不用请吃饭，请喝冰美式就行」。"}, {"id": "c1s5", "route": "summer", "beat": "篮球赛中场休息，有人起哄问他水瓶上贴的卡通贴纸是谁的。他甩开队友揽肩的手，睨了对方一眼说「叫人家全名，别乱喊」。"}, {"id": "c1s6", "route": "summer", "beat": "晚饭后校园大道飘起细雨，你们去老街买糖画。他拎着两支糖画走在路灯下，悄悄挤开你的指缝，试探着扣住你的手指。"}], "第二章 蓄谋的巧合": [{"id": "c2s1", "route": "summer", "beat": "系里分组去古镇测绘，山路突降暴雨。他在窄窄的铁皮棚下把你拉到避风处，自己半边衣服湿透，还拿冷笑话逗你别发抖。"}, {"id": "c2s2", "route": "summer", "beat": "晚上核对测绘数据时停电，手机电筒光照着两人凑近的侧脸。他替你拂开额前碎发，指尖碰到你耳廓，两个人都同时顿住。"}, {"id": "c2s3", "route": "summer", "beat": "回到学校你偶然翻开他借你的速写本，最后一页夹着你大一丢失的校园卡套，还有一张去年雨天你在图书馆睡着的速写。"}, {"id": "c2s4", "route": "summer", "beat": "你拿着速写本在香樟树下堵住他，一桩桩细数他这一年的「巧合」：换画室、顺路带早餐、故意落下钥匙，他耳根瞬间红透。"}, {"id": "c2s5", "route": "summer", "beat": "被逐一拆穿后他干脆不装了，往前逼近半步把你困在树影与他之间，声音又低又哑地说「是，我蓄谋已久，你打算拿我怎么办」。"}], "第三章 烟火与回声": [{"id": "c3s1", "route": "summer", "beat": "期末周压力压得你喘不过气，方案又被退回重画。他半夜翻过画室窗台递进来一杯热牛奶，陪你坐在地板上重新推敲结构。"}, {"id": "c3s2", "route": "summer", "beat": "他旧伤复发手腕贴了膏药，却仍单手替你按住尺子画完最后一条剖面线，见你眼眶发红，笨拙地拿指腹擦你眼角。"}, {"id": "c3s3", "route": "summer", "beat": "跨年夜江边人声鼎沸，倒数声与烟花爆竹震耳欲聋。他低下头凑在你耳边，声音温柔得不像平时，只说了一句「新年快乐，笨蛋」。"}, {"id": "c3s4", "route": "summer", "beat": "烟火在夜空散成金色雨点，他笑着问你干嘛一直盯着他看。你迎上他亮得惊人的眼睛，把藏了整季的心意轻轻说出口。"}, {"id": "c3s5", "route": "summer", "beat": "寒假离校前最后一场小雨，他在车站检票口把自己的围巾绕在你颈间两圈，说好开学第一天还去画室靠风扇的那个位子。"}], "第一章 概率破局": [{"id": "c1s1", "route": "gambit", "beat": "旧工业区地下档案库，电箱跳闸，暴雨引发积水倒灌，应急红灯规律闪烁。。水漫过脚踝，冷意透过帆布鞋底往上蹿。卷闸门卡在半空，机械锁芯发出干涩的卡顿声。"}, {"id": "c1s2", "route": "gambit", "beat": "档案库值班室内，电炉丝泛着暗红微光，铁水壶咕嘟冒气。。退到值班室后，两人发梢都在滴水。老程咳了两声，晃着钥匙串去走廊接备用线，桌上留下一条刚烫过的白棉毛巾。"}, {"id": "c1s3", "route": "gambit", "beat": "你把委托复盘的家属旧档案袋放到案头。陆寻戴上白棉手套，用铅笔尖在图纸几个受力节点间轻点，线条利落得像刻度尺画出来的。"}, {"id": "c1s4", "route": "gambit", "beat": "凌晨两点半，街角便利店外，秋雨细密地斜扫过玻璃门。。核对完第一批施工日志已是后半夜。便利店招牌的冷白灯管在雨地里拉出一片泛青的水光。陆寻拎着两罐热麦茶走出来，铝罐外壁贴着烫手的保温标。"}, {"id": "c1s5", "route": "gambit", "beat": "老式居民楼楼梯间，声控灯坏了两层，窗外只透进一点灰白月光。。楼道里浮着隔夜油烟和潮湿水泥的气味。你的钥匙串在门锁前滑脱，叮当一声滚到台阶边缘。"}], "第二章 裂缝与博弈": [{"id": "c2s1", "route": "gambit", "beat": "行业评审会场外长廊，许昭带着两名法务顾问迎面拦住去路。。许昭抖了抖手里的律师函，笑意只挂在嘴角：“陆顾问，私下替涉案家属复盘原始卷宗，按行规里的保密条文，你的执业资质还打算要吗？”"}, {"id": "c2s2", "route": "gambit", "beat": "走廊尽头的洗手间外，冷风吹得铝合金百叶窗轻敲墙面。。应付完会场盘问，陆寻独自站在洗手池前掬了把冷水拍在脸上。水珠顺着下颌线滴进领口，洇出几道深色水痕。"}, {"id": "c2s3", "route": "gambit", "beat": "深夜闭馆的旧档案室，老程在门外台阶抽旱烟，室内只亮一盏绿罩台灯。。尘封的原始卷宗被搬上长桌。翻到事故责任认定页，签字栏里赫然落着你父亲的名字。"}, {"id": "c2s4", "route": "gambit", "beat": "暴雨将至的旧办公楼天台，铁皮水箱被狂风吹得闷响，远处雷声滚过云层。。查墨水批次惊动了背后的人，楼下巷口停了两辆没熄火的陌生黑车，你们只能暂时退上天台等老程把侧门清开。"}, {"id": "c2s5", "route": "gambit", "beat": "工作室深夜，电脑屏幕蓝光映在白板上，几组风险推演路径全被红笔标了死结。。如果以联合署名的形式递交光谱报告，对方会立刻以“非授权调阅涉密档案”反诉，把你直接拖进漫长的行政诉讼里。"}, {"id": "c2s6", "route": "gambit", "beat": "清晨六点空旷的长街，环卫扫帚沙沙划过湿沥青，早点摊蒸笼冒着白汽。。通宵核完第二套方案，两人沿着街沿慢慢走。他买了两只刚出笼的热肉包，牛皮纸包得严实，递过来时特意捏了捏袋口试温。"}], "第三章 终局定局": [{"id": "c3s1", "route": "gambit", "beat": "市综合执法大厦走廊，登记台前挤满各方代表，窗外天色阴沉。。许昭站在走廊另一端整理袖扣，身后跟着三名专职律师。"}, {"id": "c3s2", "route": "gambit", "beat": "密闭听证室内，长桌两侧坐满评议专家，投影幕上停着光谱曲线图。。质询进入僵局。对方律师咬定私自调
