裙角，转身取出一柄桐油黄纸伞撑开往前递了半尺：「檐水凉，别站在滴水兽底下。」"}, "compass": {"player": "随队进入秦岭南麓核查古水脉与地质滑坡隐患的年轻地质文献研究员。", "relation": "临时编入同一支山区考察队的领队与随队研究员。盘山公路突发塌方，生死一线间他一把把你拽出打滑的越野皮卡。", "world": "暴雨封山的秦岭南麓深山。孤悬山脊的护林道班房、断桥钢缆、浅溶洞柴火堆与裸露花岗岩主脊构成极境求生之路。", "premise": "特大暴雨引发山体塌方，考察队越野皮卡卡在盘山路边缘打滑。副驾门猛地被拉开，浑身雨水的韩烈探身进来一把扣住你冲锋衣后领，低喝一声：「车轮打滑了，跳！踩我脚印，别看崖下！」", "known": ["暴雨伴随强地磁扰动，短波电台暂时失联，四人必须靠古地质图与纯铜罗盘找出安全撤离路径。", "韩烈在秦岭跑了十余年防灾勘探，胸前总挂着师父留下的纯铜老罗盘。", "他左肩胛骨有一道陈年缝合长疤，阴雨天偶尔会暗暗发紧。"], "unknown": "三年前泥石流事故里他左肩留下的钛合金钢板旧事，以及这个寡言硬汉心里究竟藏着多少柔软。", "goal": "借助古地质图与纯铜罗盘翻上花岗岩主脊「龟背石」发出求救信号，全员平安走出暴雨封山。", "public_meta": "28 · 秦岭地质灾害调查队领队", "opening": "秦岭盘山公路泥石滚落，韩烈一把拉开打滑的越野车门，扣住你冲锋衣后领把你带出车厢：「车轮打滑了，跳！踩我脚印，别看崖下！」"}, "gallery": {"player": "受邀在秋展开展前核验展品清单与保单的艺术品保险估价师。", "relation": "素不相识的保险估价师与独立画廊主理人。雨夜展厅初遇，她顺手给你转了五十块跑腿费，不记人情账，却很快被一桩赝品风波绑进同一场鉴真博弈。", "world": "城东老厂房改建的「白匣」艺术空间、市中心秋拍预展厅与城郊恒温画库。聚光灯、紫外验伪灯、松节油味与冷萃咖啡交织出熟龄名利场。", "premise": "秋雨砸在「白匣」玻璃采光顶上。你推门进场核验展品保单，刚从人字梯下来的姜绯递过干毛巾，顺手扫了你的收款码：「你顺路帮我取的展签胶带，跑腿费加湿掉的鞋套，转你五十。收了再看画，我这儿不记人情账。」", "known": ["姜绯筹备了半年的独立青年秋展两天后开幕，主展品是一幅备受关注的油画《暮港》。", "投资人沈澈占了画廊三成股份，一直想借商业流量接管策展话语权。", "姜绯左手无名指常年戴着一枚素银戒圈，内侧刻着一串旧门牌号。"], "unknown": "两年前她为什么卖掉家里的老画室赔违约金，以及匿名爆料《暮港》造假的幕后推手到底是谁。", "goal": "先完成展品进场核验，在秋展风波与资本压价中查清《暮港》真伪，守住保单与「白匣」。", "public_meta": "25 · 独立艺术空间策展人 / 估价顾问", "opening": "秋雨敲打「白匣」玻璃顶，姜绯退下人字梯递过毛巾，顺手扫了你的收款码：「顺路取胶带的跑腿费加湿鞋套，转你五十。收了再看画，我这儿不记人情账。」"}, "silk": {"player": "受邀协助解决新中式独立品牌真丝面料排期与秀场筹备的独立面料供应链顾问。", "relation": "初次合作的供应链顾问与独立成衣主理人。她刚从大品牌断崖辞职单干，独立大秀在即却遭前东家断供与版型狙击。", "world": "梧桐弄堂老洋房二楼的「素尺」裁衣工作室、轻纺城面料档口、湖州织厂与老仓库秀场。划粉、重磅真丝、黄铜裁布剪与手工盘扣交织。", "premise": "秋雨敲打弄堂老洋房的木窗。你带着三册苏州织厂色卡推开「素尺」的门，温舒窈正握着黄铜裁布剪一剪裁开素白重磅真丝，连半毫米毛边也没留。她直起身搁下剪刀：「比约定早了七分钟。先擦手，真丝沾了雨气容易留水渍。」", "known": ["温舒窈半年前离开「锦序」创立独立工作室「素尺」，首场秋季发布秀只剩十八天。", "她在打版与新中式立体剪裁上极有名气，但独立品牌在面料供应链上极易被大厂卡脖子。", "她腰间常挂一把小号黄铜裁布剪，右手食指内侧磨着厚厚的剪刀茧。"], "unknown": "三年前她与前东家「锦序」彻底决裂的署名权旧账，以及大秀前夕前东家还会使出什么渠道狙击。", "goal": "帮「素尺」抢通湖州真丝供应链、凭立体纸样击碎抄袭谣言，把首场独立大秀稳稳立在圈内。", "public_meta": "27 · 新中式成衣主理人 / 立体打版师", "opening": "老洋房二楼案台前，温舒窈一剪裁开素白重磅真丝，直起身搁下黄铜剪刀看你：「比约定早了七分钟。先擦手，真丝沾了雨气容易留水渍。」"}, "rail": {"player": "2000 年深秋从省城下乡、负责采写山区老铁路支线口述史的年轻地方志编辑。", "relation": "暂住青坪小站的地方志编辑与值守巡道工。绿皮慢车晚点六分钟进站，他戴着白线手套替你稳稳托住滑落的旧帆布皮箱。", "world": "2000 年前后即将因新干线贯通而谢幕的山区老铁路支线「青坪站」。绿皮 7024 次慢车、敲轨锤声、煤炉烤红薯与雨夜绿色信号灯。", "premise": "深秋细雨斜落在青坪站铁轨碎石上，7024 次绿皮慢车晚点六分钟停靠。你拎着沉重的采访皮箱踩下铁梯，箱角差点磕上水泥沿，一只戴着白线手套的大手先一步稳稳托住箱底。穿藏青工装的程远山抬头看了一眼站台挂钟：「青坪站台阶高半寸，下车先迈左脚。」", "known": ["青坪支线修建于上世纪六十年代，你这次下乡只有不到一个月时间整理沿线老职工口述史。", "程远山父子两代都在这条线上巡道，他每天清晨六点准时拎着检车锤沿铁轨敲检扣件。", "这条老支线客流稀少，坊间隐约传闻新干线通车后小站迟早会裁撤。"], "unknown": "他抽屉里早就压着一张省城大机务段的调令，以及在旧轨停运与你回省城之间，他打算如何落子。", "goal": "在回省城交稿前完成《青坪铁道志》沿线采访，也在慢车与雨夜巡道里看清彼此的新去处。", "public_meta": "27 · 老铁路支线巡道工 / 检车员", "opening": "青坪站雨雾里 7024 次慢车缓缓停靠，程远山伸手稳稳托住你滑落的旧皮箱，抬头看了眼大挂钟：「青坪站台阶高半寸，下车先迈左脚。马站长烧好水了，走吧。」"}}, AUTHORED={"loop": {"A": {"title": "雨停了", "text": "雨停得很突然，像有人把水龙头一把拧死。她把保温杯塞进他手里，杯壁还烫着。他从抢救室门口的伞架上抽出那把断了骨的旧伞，撑开，骨头歪着，两个人挤在下面刚刚够。走到巷口她才发现自己一直没松手，掌心全是印子。他没说话，只是把伞往她这边偏了两寸。\n再后来那把伞一直搁在值班室门后。有人问是谁的，她说捡的。伞骨上那道弯始终没修，撑开还是歪着，正好挡住两个人的那一半。"}, "B": {"title": "三点十八分", "text": "她刚摸到他的手，墙上的钟跳到三点十八分。抢救室的门被人从外面推开，风灌进来，带着雨味。她低头看自己的手，空的。护士问她要不要休息，她说不用，转身去写记录。写到一半笔停住了——纸上那个名字，她一次也没写对过，划掉重写，又划掉。\n第二天钟换了新的，走得很准。她再没抬头看过它，只是每到三点十七分，手上的动作会慢半拍。"}, "C": {"title": "灯还亮着", "text": "抢救室的灯一直亮着。她站在原地，保温杯放在窗台上，凉透了也没人动。走廊那盏坏灯闪了两下，没灭。外面天快亮了，雨还在下，声音很轻，像有人在隔壁翻一页纸。她伸手把钟往回拨了一格，又停住，把手收了回来，指腹上留了一圈灰。\n那杯水第二天才倒掉。杯底沉着一层茶叶，她看了两眼，连杯子一起扔了。"}, "D": {"title": "没打伞那天", "text": "他出院那天没打伞，走到门口还回头看了一眼，像在确认什么。她那晚值到天亮，把抢救室的器械一件一件擦干净。最后擦到那把断骨的旧伞，撑开看了看，伞骨歪着，跟第一天一样。她收进柜子最里面，谁也没留电话，雨下了整整一周。\n入冬整理柜子时那把伞还在，伞面霉了一小块。她撑开晾了半天，又原样折好放回去，位置没挪。"}}, "scar": {"A": {"title": "多一把钥匙", "text": "你说「你可以不被需要」。他沉默很久，久到楼道灯灭了一次又亮。烟灰落在地上，他没有去擦。然后他第一次没说「我没事」，只问你明天几点下班，声音压得很低。第二天你把钥匙挂在门边，低头一看，自己那把不知什么时候换成了新的，铜色，齿口还是热的。\n后来那把新钥匙一直挂在进门第一颗钉子上。每次他跑完夜路回来，门锁转动的声音都很轻，像怕吵醒谁。"}, "B": {"title": "周四回来一次", "text": "钥匙你收下了。他去了邻县，每周四回来一趟，车停在巷口不进来，电话里只谈天气和路况。有一次信号不好，他连着说了三遍「雨大」，你才听出他不是在报路况。挂了电话，你在窗边站到灯一盏盏全灭。\n抽屉最里面一直躺着那把备用的铜钥匙，齿口被你摩挲得发亮，始终没机会用上。"}, "C": {"title": "伞留在店里", "text": "你把伞留在他店里，什么都没说，转身走进雨里。三个月后，楼下有人修车，铁皮工具箱摊开在地上，人蹲着，背对着你。你问是谁叫的，他说是路过，手里的扳手没停。伞就挂在工具箱旁边，还是那把，骨头歪着。\n后来那把伞一直挂在那儿，夏天也没人收。有一回下暴雨，他把它取下来撑开，站在檐下看了一会儿，又原样挂回去。"}, "D": {"title": "两块牌子", "text": "你跟他去了邻县。铺面重开，门口挂两块牌子：修车、货运。字是他自己写的，笔画很粗。他仍旧只谈天气，仍旧一句话不超过七个字。夜里你数钥匙，发现有两把——一把是门，一把他没说是什么。窗外雨大，铁皮棚顶响得像有人在上面走。\n入秋后他把其中一把钥匙穿进你的旧钥匙圈里，还是没解释，只说那间屋子朝南，晒被子方便。"}}, "revenge": {"A": {"title": "写回本名", "text": "她把旧账一笔一笔清算完，最后一页撕下来，压在新招牌背面。招牌重新刷字那天雨很小，字写回本名，笔画比原来深。夜里她关灯上楼，第一次没检查门锁。楼下书还浸着潮气，纸味慢慢散开。\n第二年开春店里重新粉刷，那张撕下来的旧账页还贴在木牌后面，边角已经卷起来，字迹一点没褪。"}, "B": {"title": "锁进抽屉", "text": "她留下了，和周愔合伙开这间店。账本锁进最深的抽屉，钥匙挂在柜台内侧。有人问起当年的事，她说得像在讲别人，语气平得听不出情绪。只有下雨那天，她会把那本账拿出来，翻到最后空着的一页，看很久。\n后来柜台换了新的木面，旧抽屉原样拆下来装了回去，钥匙也还是原来那把，齿上沾了一点铜绿。"}, "C": {"title": "北上的车", "text": "钱和道歉她都收了，店转出去，招牌留给下一个人。收拾时她把剪报烧了，纸灰落进窗台的水渍里。北上那班车在雨里开得很慢，她抱着那本账，一路上没有翻。\n到站那天北方没下雨，她在车站垃圾桶旁站了一会儿，把那本空白的账本留在了候车室的硬座上。"}, "D": {"title": "半面空招牌", "text": "她什么都没要，走的时候把半面空招牌留在门上。新店在别的街，不欠任何人的账，也不挂名字。第一个客人是躲雨的女生，问她为什么不写招牌，她说还没想好。\n后来那块无字的木牌一直挂在檐下，被雨水淋得发灰。她只在门内贴了张手写的营业时间，字迹很淡。"}}, "ledger": {"A": {"title": "第七十三页", "text": "账本最后一页写满那天，她把它合上，放回抽屉最里面。外面的雨停了，她把伞留在工位上，第一次空手走出写字楼。玻璃门映出她自己的影子，走得很稳，没有回头看一眼十七层。\n隔周保洁阿姨问起那把伞还要不要，她隔着电话说送人了。抽屉里那本旧账后来跟着搬家箱一起收进了储物间，再没翻开。"}, "B": {"title": "第48条", "text": "他先开了口，说得磕磕绊绊，把「我欠你的」说成「我一直知道」。她没笑，翻开账本，在最后一行写下第 48 条：这笔不是垫的。写完之后笔停了很久，才把本子合上。\n那天晚上她把钢笔帽拧紧，和账本一起收进包里。回到家才发现，那一页纸的墨水其实还没干透，在下一页印出了一点浅蓝。"}, "C": {"title": "归档", "text": "那句话没等到。她把清单复印一份，装进档案袋，写上日期，归到自己那一格。钱一分不少地到了，时间晚了三天。雨还在下，她撑着伞走进雨里，伞面只遮住一个人。\n年终整理档案柜时，那个牛皮纸袋还在最上层，封口的绕线缠了三圈，折痕平整得像刚封好那天。"}, "D": {"title": "并成一张", "text": "两人把旧账并成一张表，各写一半。他的字大，她的字小，两栏并排，中间用铅笔划了一道线。雨一直没停，表格最后一行她留了空，笔搁在线上，谁也没先动。\n后来那张表被压在办公桌玻璃板下面，时间久了铅笔线有些发淡，那道空白的格子却一直空在那里。"}}, "coroner": {"A": {"title": "不是速溶的", "text": "他把手套摘了，很慢，一只一只，手背上有一道旧疤，从虎口斜到腕子。然后他伸手，把你湿透的袖子捏了一下，只捏了一下就松开，像在确认温度。明天我请你喝咖啡，他说，不是速溶的。\n第二天他提前到了十分钟，坐在靠门的位置，桌上摆着两个杯子。他把其中一杯往你那边推，说这家的豆子酸，你要是不喜欢，我们换一家。"}, "B": {"title": "下周还来吗", "text": "他把那份副本收进箱子，说等我用完。箱子锁上，钥匙挂回墙上，他在门口停了半步，问你下周还来吗。走廊的除湿机还在响，你点头，他说好，然后先走了。\n下周你真去了，门口多了一把折叠椅，靠墙放着，椅面上还垫了一层旧报纸。他出来时看见了，只说了句椅子不是我的。"}, "C": {"title": "盖章那天", "text": "报告最后只写了结论，一页半，没有推测。信封上盖了章，编号是新的。他把箱子放回柜子，锁好，钥匙挂回墙上，位置和之前一模一样，差半厘米都看得出来。\n那天他没开灯，坐在台子边上把工具一件件插回套子里。最后剩下一把镊子，他捏在手里转了两圈，才放进去。"}, "D": {"title": "台上那份副本", "text": "台风过后他调去了邻市。解剖室的灯还亮着，台上的那份副本没人收，边角被风翻起来。你把它压平，看了一眼最后一页，那里空着，什么都没写。\n新来的人问这份要不要归档，你说放着。纸在台上放了很久，纸角慢慢卷起来，卷成一个不硬也不软的小弯。"}}, "hollow": {"A": {"title": "关灯以后", "text": "他去关会议室的灯，站在门口没走。灯灭了一半，另外一半还亮着，照着他的侧脸。他说其实我一直想让你留下来，就这一句，没有玩笑。窗外的雨停在一句话的缝里，谁也没补下一句。\n第二天清晨保洁来开灯时，桌上还留着两只没收走的纸杯，杯底各剩一点凉透的黑咖啡。"}, "B": {"title": "两个空格", "text": "他开始学着拒绝，第一件事是把周末还给自己。你在他的日历上看到两个空白的方格，什么也没写。他说还没想好放什么，先空着，空着也行。\n到了月底翻页的时候，那两个方格依然空着，只是边缘被他用荧光笔轻轻圈了一道极浅的灰线。"}, "C": {"title": "没人动的那杯", "text": "他还是对谁都好，只是看你的那一眼短了半秒。奶茶还是买两杯，一杯放在你桌上，放凉了也没人动。第二天早上杯子还在原处，杯盖没开。\n后来保洁阿姨顺手把杯子收进了垃圾袋。那天下午他又买了两杯回来，这次两杯都放在了自己的工位上。"}, "D": {"title": "他还是会笑", "text": "项目结束他调去别的组，走廊里碰见还是会笑。茶水间的马克杯他不再记谁用哪个，按颜色随便拿。有人问他要不要一起吃饭，他说都行。\n年底换工位时，他抽屉最里面还留着一张没撕掉的便签，上面写着你以前常喝的那家店的电话，边角已经卷了。"}}, "rival": {"A": {"title": "一人一半", "text": "铜牌挂在入口左手边，两家的名字并排，字号一样。她伸手把偏了的一角摆正，说这次算我们一人一半。铜牌反光，照出两个人都不太会笑的样子，谁也没先说话。\n后来每次雨天有人推门进来，铜牌边缘都会沾上一点水汽，她路过时会顺手用袖口擦一下，只擦自己名字那一侧。"}, "B": {"title": "下次别迟到", "text": "合同签了，署名一前一后。她收拾文件时把散在桌上的你那份也理好，推过来，说下次别迟到。桌上那杯咖啡早凉透了，谁也没提，走的时候她把杯盖扣上。\n回程的电梯里她把文件袋夹在腋下，那份并排署名的副本露出一角，纸边压得整整齐齐，没有一点折痕。"}, "C": {"title": "被磨掉的号码", "text": "项目最后归了别家。她把名片留在桌上，背面写了一个号码，笔迹压在折痕上，最后一位被磨得看不清。你翻过来又翻回去，桌上的灯自动熄了一次。\n后来你把那张名片夹进了笔记本的夹层里。过了一年换本子的时候拿出来看，背面的蓝墨水已经洇成了一小团淡痕。"}, "D": {"title": "散标那天", "text": "散标那天雨很大，她在门口站了一会儿，没打伞，也没叫车。后来听说她去了别的城市，同业里就这么少了个人，名单上还留着她的名字，排在原来那一行。\n年底行业年会印名册时，校对的人问起要不要删掉，主管看了看说先留着，铅字就这么多印了一年。"}}, "badge": {"A": {"title": "这顿他请", "text": "警号牌擦得能照出人影，他把它扣回胸前，帽子夹在腋下。走到门口他停了一下，说这顿他请，不算公事。面馆就在街对面，灯管一闪一闪的，他先替你推了门。\n吃到一半他起身去接了个电话，回来时把外套脱下来搭在椅背上，第一次没有正襟危坐。桌上的醋瓶被他挪到你自己那边，说这个你爱吃。"}, "B": {"title": "念到一半", "text": "检查交了，处分下来了，写在一张白纸上，编号很小。他照旧站在窗口后面，把每一行念给你听，念到一半停了停，喝了口水，再接着念。台面上那盒胃药换成了新的。\n念完他把纸推过来，让你看有没有写错的地方。你看了很久，只看见他手指压着的那一角，被汗浸出一小片深色。"}, "C": {"title": "磨淡的编号", "text": "他调到内勤，窗口换了人。那张回执你一直留着，编号后面几位的墨迹被手指磨淡了。有天你在窗口问起他，新来的人翻了翻册子，说不太清楚，好像调走了。\n后来那张回执夹在书里，纸边起毛。有一年换证，你把旧的回执交上去，办事的人扫了一眼，说这个编号已经作废了。"}, "D": {"title": "帽檐压得很低", "text": "案子结了，他把材料归档，柜门关得很轻。后来在街口碰见过一次，他点了下头，帽檐压得很低，走过去之后你才反应过来。地上的水洼里有半边制服的影子。\n那年冬天派出所搬了新址，旧牌子摘下来靠在墙边。你路过一次，看见牌子上积了雨，字还是那几个字，没人擦。"}}, "boss": {"A": {"title": "第二个问题", "text": "她把你那份合同翻到最后一页，签完递回来，说下个项目你来带。白板上那行字还没擦，下面多了一行新的，笔画比上面那行轻：第二个问题，我们一起解决。\n后来新项目启动会散场后，保洁刚想擦白板，她走过去说最下面那两行先留着，然后自己拿了一支新笔把日期补在了角落。"}, "B": {"title": "一个句号", "text": "项目结了，她照旧只发一个字：好。区别是这次后面跟了一个句号，那个点很小，落在屏幕正中。你盯着它看了很久，才回了一个收到。\n后来部门换了新的沟通软件，旧聊天记录没有迁过去。只有你手机截屏相册的最深处，还留着那张只占了一行的白底黑字。"}, "C": {"title": "划线很直", "text": "她把你调回原来的组，交接表写得很清楚，一条没漏。最后一栏的「下周你决定」被划掉了，改成「按原计划」。那道划线很直，直得像用尺子比着画的。\n交接表签字归档以后，她把那支用顺手的黑水笔插回笔筒最外侧，桌面空出了一整块。"}, "D": {"title": "笔帽不见了", "text": "项目结束后她升了职，办公室搬到十七层。白板擦得很干净，那行字谁也没再写上去。桌角的笔筒里少了一支白板笔的笔帽，找了半天没找到。\n直到年底行政清理旧工位，才在文件柜底下的缝里扫出那个黑色的塑料笔帽，上面落了一层细灰。"}}, "tyrant": {"A": {"title": "位置你挑", "text": "他把办公室钥匙推过来，铜的，磨得发亮，说位置你挑。窗外的雨停了，玻璃上还挂着水痕。她拿起钥匙，先在桌上放了放，才握进手里，很轻地说了一句：那我挑里间。\n第二天一早他推门进来时，里间的百叶窗已经拉开了半截，桌上多了一只素白的陶瓷杯，里面泡着半杯温水。"}, "B": {"title": "不用你决定", "text": "董事会散了，他一个人坐在原位，百叶帘拉开半截。桌上的方案被翻到最后一页，那里有她留的一行字，圆珠笔写的：这次不用你决定。他把那页看了两遍，才合上。\n后来那份方案没有送去销毁，他把它锁进了左手边最底下的铁皮柜，钥匙随身带着，再没拿出来过。"}, "C": {"title": "空着的桌子", "text": "她没留下。他让人把里间那张桌子留着，一直空着。桌面不许人擦，笔筒里的笔还是她走时那个方向，斜着的。有人问要不要收起来，他说放着。\n入冬以后大扫除，保洁阿姨想把里间的窗台擦一擦，刚推开门就被他叫住了，说窗台不用动，只拖外面的地。"}, "D": {"title": "不用叫霍总", "text": "他交出总经理位置那天，她来送文件。签完字他把笔盖扣上，说以后不用叫我霍总了。她笑了一下，笑得很短，把文件收进包里，走廊的灯正好亮起来。\n那支签字笔他留在了旧办公室的抽屉里，没有带走。后来接任的人整理抽屉时，发现笔帽上刻着两个很浅的字母。"}}, "steady": {"A": {"title": "留个念想", "text": "旧招牌他没带走，靠在店里最里面的墙上，木边挨着墙皮，他说留个念想，说完也没再看那块牌子。卷帘门拉到一半停住，他弯腰把门口的台阶扫干净，连缝里的叶子都拨出来，才慢慢拉到底。\n后来这条街翻修路面，门口换了新的水泥台阶。那块旧木牌一直靠在里面墙根，下端被潮气浸深了一寸。"}, "B": {"title": "纸上的号码", "text": "车开出去二十米停下，尾灯亮了一会儿。他摇下窗，说你需要的话就打这个电话，声音不高，像怕惊动什么。手写的号码从窗缝递出来，纸上写了一串数字，中间一位改过一次，笔画叠着笔画。\n那张纸条被你夹在钱包最里面的卡位里。半年后雨季再来时掏出来看，圆珠笔的墨迹微微晕开了一点。"}, "C": {"title": "一页没翻", "text": "相册留在了柜台上，一页没翻，塑封的边缘还没拆。后来那家店换了新的招牌，暗房的红灯再没亮过，窗台的灰积了很厚，有人路过也只看一眼。\n再后来招牌也拆了，卷帘门锈住，只开得了一条缝。你从缝里看进去，柜台还在原位，柜面上那本相册立着，背脊朝外，落满了灰。"}, "D": {"title": "落在指腹上的灰", "text": "他走的那天雨很小。旧招牌靠在墙边，木头的字被雨泡得发白。你伸手摸了一下，指腹上落了一层灰，凑近看了看，是「照相」两个字的凹槽里刮出来的。\n那块牌子后来被他带走了，说垫在车斗里正好。你站在空出来的墙下发了一会儿呆，墙上留着一块比周围干净的长方形。"}}, "double": {"A": {"title": "念得很慢", "text": "新招牌挂上去的时候钉子偏了一点。她退后两步看了看，说就这样吧，偏着才像这店原来的样子。然后她念了一遍自己的新名字，念得很慢，一个字一个字地念，念完才把钥匙插进锁孔。\n后来隔壁五金店的老板娘路过，说帮她找个水平尺重新钉正，她摆摆手说不用，斜着反而好认。"}, "B": {"title": "就这个", "text": "信她收进了抽屉最里面，没回。她照旧每天开门，只是不再演谁。客人问起名字，她说：我叫江栖，就这个。说完低头继续擦柜台上那只不属于任何人的旧表。\n旧表的电池第二年冬天停了，她没有去换，照样每天早上用绒布擦一遍表盘，再放回玻璃柜角。"}, "C": {"title": "没拆的信", "text": "她还是走了，把钥匙放在柜台正中，钥匙下面压着一张纸条，只写了四个字：店你留着。抽屉里那封信没拆，信封上的雨渍干成一圈浅浅的印子，边角翘着。\n后来新店主收拾柜台时把那封没拆的信放进了储物箱。几年后店面转手，箱子被搬上三轮车，信还在最底下。"}, "D": {"title": "另一把钥匙", "text": "真身后来回来过一趟，两人在店里坐了一下午，谁也没提这三个月。走的时候她留了一把钥匙，说店你继续开着，名字你也接着用。门合上之后，店里安静得能听见旧表走秒。\n那把留下的钥匙一直挂在门后墙钉上，从来没配过第二把，金属表面慢慢氧化成暗哑的灰。"}}, "gate": {"A": {"title": "可回头一次", "text": "石板上第七条被磨平重刻，多出四个字：可回头一次。刻痕还很新，石粉落在门槛上没扫。他站在门里没动，说你走吧，回头的时候我还在。关外的雨正落着，关内一滴也没有。\n后来风吹散了门槛上的石粉，那四个字却越来越亮，像天天有人用袖口经过时顺便拂过。"}, "B": {"title": "这算犯规吗", "text": "他守了三百年，第一次跟着过了那道门。走出去三步他才回头，像在确认门还在，然后问你：这算犯规吗。雨水打在他肩上，他没躲，只是把手里那半块饼递过来。\n那半块冷掉的饼后来分着吃完了，油纸被他叠成小方块塞进袖袋，走了很远也没扔。"}, "C": {"title": "比过又收手", "text": "门合上了。石板上的第七条还是原样，只是边角多了一道新刻的浅痕，像有人拿刀比过又收手。关内的灯还亮着，他的影子投在石板上，正好压住那道浅痕。\n此后关外又下了许多场雨，水顺着石板边缘流下去，那道浅痕里总积着一点擦不干的湿气。"}, "D": {"title": "第十八个", "text": "上面的人来了，他被调去看别处的门。石板留在原地，第七条下面多了一行小字，字迹很轻：第十八个不回头的人。后来那行字被雨泡过，笔画涨开，还看得清。\n接替他的人拿抹布擦过几次石板，擦到最后那行小字时手总会停一下，始终没用砂纸磨掉。"}}, "doomed": {"A": {"title": "一个逗号", "text": "书翻到第四章，她的名字还在，后面跟着一个逗号，逗号后面空着。她把书合上，说这下得活久一点了，语气像在抱怨晚饭太咸。书角被她折了一道印子，说做个记号。\n后来那本书一直摆在便利店收银台底下的格子里，那个折角压平了又自己翘起来，像没人管的小耳朵。"}, "B": {"title": "不止一种", "text": "她活过了第三章，但从那以后书里再没写过她。她说没关系，反正被记住的方式不止一种，然后笑了一下，笑得比平时短。海堤上风很大，她把书举起来挡了挡。\n风把几页空白的尾页吹得哗哗作响，她随手从口袋里摸出一张作废的车票夹在中间，权当书签。"}, "C": {"title": "涂改过的墨迹", "text": "第三章还是来了。书页上有一行被涂改过的墨迹，看不清原来写的是什么，只留下一点毛边。灯还亮着，书摊在桌上没有合，风把最上面几页吹起来，又落回去。\n天亮以后店主来打扫，把那本摊开的书合上放回最里面的旧书箱，上面压了一摞过期的杂志。"}, "D": {"title": "没按回车", "text": "她没等到改稿。便利店那晚的灯一直亮着，年轻人的手停在键盘上，屏幕上那行字最后也没按回车。天快亮的时候他起身去理货，屏幕自己暗了。\n后来电脑重装过一次系统，桌面上的草稿文件夹被移进了移动硬盘最深处，文件修改日期停在那个雨夜。"}}, "hostage": {"A": {"title": "刀口朝内", "text": "他把那把不该带的刀留在驿馆，刀口朝内，压在桌上的旧信下面。出城门时他没回头，只把手抬了一下，像在挡风。你站在阶上看着那只手，一直看到看不见。\n后来驿馆换了新差役，收拾屋子时想把那把刀收进库房，刚抽开一点，发现刀鞘内侧刻着半行极细的驿站编号。"}, "B": {"title": "空木匣", "text": "他回国三年，第四年派人送来一只空的木匣。匣子里什么也没有，匣底刻着你的名字，刻得很深，像是怕磨掉。送匣的人说他一切安好，别的没让多讲。\n那只空木匣后来被你用来装零碎的印章和干透的桂花，每次打开盖子，匣底那几道深痕还是咯手。"}, "C": {"title": "尝过", "text": "城门关上那天下了雪。驿馆桌上留着他的链子，链子下面压着一张纸，只写了两个字：尝过。字被炭火烤过一点，边角发脆。窗纸补的第三处又破了。\n开春化雪以后，驿丞把那张纸连同铁链一起锁进了木箱。纸角本来就脆，压在链环下面碎了一小块。"}, "D": {"title": "没人擦的刀", "text": "他走后驿馆换了人看守。那把刀一直挂在墙上，没人动，刀鞘上落了灰，谁也不擦。新来的人问那把刀是谁的，老差役说不记得了。\n有一年夏天连着下了半个月雨，墙皮返潮往下掉渣，刀鞘上的铜环也跟着生了一圈绿锈，还是没人去取。"}}, "topstudent": {"A": {"title": "两张票", "text": "两张票是同一天同一趟车，座位隔了两个。他把你那张折好，塞进你校服口袋，说别弄丢了，这个不好补。说完他把自己的票也对折了一次，折痕压在同一个位置。\n后来车票早就过期褪色，你夹在高中毕业照背面翻出来时，发现两张票根拼在一起，折痕还是完全重合。"}, "B": {"title": "做一遍", "text": "他去了保送那所。开学前寄来一本旧的错题本，扉页上写着：这些题我都讲过了，你自己再做一遍。字很小，写在原本印着日期的那一栏里，挤得有点歪。\n高三最后一次模拟考前，你把那本错题本从头到尾翻了一遍，才发现最后一页夹着一张没写名字的草稿纸。"}, "C": {"title": "没等到", "text": "高考结束那天雨很大，他站在校门口的屋檐下等了一会儿。人一波一波往外涌，他把伞撑开又收起来，最后没等到，伞收起来走了，地上留了一小圈干的地面。\n那圈干水泥地不到十分钟就被斜飘进来的雨水打湿了。后来校门口翻修雨棚，那块地砖也被一并撬掉换了新的。"}, "D": {"title": "一袋橘子", "text": "后来你们在不同城市的大学。有一年春节回家，在巷口碰见，他手里拎着一袋橘子，问你题还会不会做。你说早忘了，他嗯了一声，把袋子往你手里塞了一只橘子。\n那只橘子皮很薄，你一路拎回家没舍得剥，放在书桌角落风干了半个多月，屋里一直有一点淡淡的橘皮味。"}}, "minister": {"A": {"title": "这屋你继续用", "text": "他复职那天没穿官服，只带了一枚旧印。走到值房门口停下，说这间屋子你继续用，我搬去东边。廊下的雪化了半尺，水沿着阶缝往下淌，他站着看了会儿才走。\n次日内阁送来新领的炭盆和公文匣，他只留了文书，把那方旧印留在原屋的砚台旁边，谁也没去挪。"}, "B": {"title": "多出来的钥匙", "text": "案子翻了，他被贬去南边。走之前他把值房的钥匙留下，钥匙串上多了一枚不是这屋的钥匙，铜的，磨得发亮。他没说是哪扇门，只说你若想找，总能找着。\n后来值房换了新锁，那串旧钥匙被收进库房的铁盒里，唯有那枚多出来的铜钥匙，一直放在你自己的书匣底。"}, "C": {"title": "没回音的折子", "text": "折子递上去三个月没回音。他照旧每日到内阁，案上的文书越堆越高，最上面那本你抄到一半。灯芯剪过两次，屋里静得能听见纸翻动的声音。\n入冬以后炭火不够旺，那本抄到一半的册子边角卷了些起来，砚台里的墨结了一层薄冰，第二天早上他亲自拿温水化开。"}, "D": {"title": "没留字", "text": "他复职后第一件事是把你调去别的衙门。交接那天下着雨，你把披风叠好放在他案上，没留字。他进来时看了一眼，把披风收进柜子，柜门关得很轻。\n那件深青色的披风后来一直挂在值房最里面的衣架上，换季晾晒的时候小吏拿出来看过一次，袖口还留着干掉的泥点。"}}, "senior": {"A": {"title": "门垫下面", "text": "他把钥匙留在了门垫下面，只留一把。钥匙扣上挂了个旧的公交牌，牌子背面写了一行字：有事喊一声，这回我不在隔壁了。字很小，是用圆珠笔写的，写完还描了一遍。\n后来你搬家时把那串钥匙交还给了房东，唯独把那个磨掉漆的公交牌拆下来，挂在了自己新屋的门把手上。"}, "B": {"title": "新枝", "text": "他去了外地，花活了下来，长出一根新枝。半年后他回来过一次，站在阳台下抬头看，你把花搬下来给他看。他伸手碰了碰那片新叶，说这盆该换了。\n第二天他在楼下五金店买了个大一号的红泥花盆放在门口，没敲门，只发了条消息说土也顺便放在袋子里。"}, "C": {"title": "摸半层", "text": "钥匙他收回去了，两把都收。门垫下什么也没有，楼道的灯坏了一盏，晚上回来要摸半层。有一晚你摸到一半停下，听见楼上有人关门，声音很轻。\n过了一周物业来把灯泡换了，白炽灯亮起来的时候，楼道墙角那块他以前放雨伞的水渍早就干透了。"}, "D": {"title": "还是那个位置", "text": "后来他很少回来。你把花养到了第二年，花盆换了大的，位置还是原来那个位置。有天浇水的时候发现盆底压着一张旧的公交牌，边角卷了。\n你把公交牌擦干净，晒在阳台的栏杆上，背面圆珠笔写的几行字已经模糊，只认得出最后两个数字。"}}, "exgf": {"A": {"title": "撕成两半", "text": "她把登机牌撕成两半，一半塞给你，说退不了了，你看着办。玻璃外的飞机正在滑行，尾灯亮了一下。她笑了一下，转身往出口走，走了几步又停下来，把手里的箱子换到另一只手。\n半小时后她在机场咖啡厅发来一张照片，桌上摆着两杯美式，旁边放着另外那半张缺了角的登机牌。"}, "B": {"title": "念完航班号", "text": "她还是走了，箱子过安检的时候没回头。你在原地站到广播念完她的航班号，才把手里那半张登机牌折起来。纸很硬，折了两道才服帖。\n后来那半张登机牌一直夹在你常背的那本旧笔记本里，搬家时掉出来过一次，热敏纸上的字迹已经淡得快看不清。"}, "C": {"title": "算清了", "text": "她走前把当年那张电影票根放在你手里，票根已经褪色，日期还看得清。她说这次算清了，说完把箱子拉杆按下去，声音很脆。\n票根边角毛了，你低头看了看，发现背面的条形码早就磨平，只剩下一行印着放映厅排号的小字还勉强能认。"}, "D": {"title": "从不提这座城", "text": "后来听说她在那边做得很好。同学群里她偶尔冒泡，发工作照，配文很短，从不提这座城市。有一年同学会她没来，群里有人问，没人答。\n散场后有人在旧照片文件夹里翻出当年聚餐的合照，她站在最边上，手里正举着半杯还没喝完的柠檬水。"}}, "wan": {"A": {"title": "雨停之后", "text": "两天后，十点零七分。你在检票口把她拉了回来。\n她骂了你一句，很难听，眼睛却是亮的。检票员在雨里笑，说这年头还有人把要走的姑娘拽回来。\n后来她在书店最里面那面墙上办了一次小展，主题叫《撑伞的人》，一共十二张。第一张挂在最高的地方，画的是雨天里一个把伞倾向别人的背影。\n画的右下角有一行很小的字：不催我走的人。\n「白鹭」过后，南方还是常常下雨。现在你们共撑一把伞，她依然走得很慢，依然在数水洼。\n只是走到水最深的地方，她会故意踩一脚，然后回头看你的裤子。"}, "B": {"title": "晴天预报", "text": "半个月后，她自己投出去的第八份稿子有了回音。编辑说，想约她见一面。\n她站在书店门口，手里还捏着那张车票，很久没说话。边角已经被水汽泡软了。\n「我妈会骂我的。」她说。然后她把车票撕成两半，扔进雨里，「不过她骂我，我也听得见。」\n后来她在书店最里面那面墙上办了一次小展，只挂了三张。她说剩下的等画好了再说。\n开幕那天她把你安排在门口，说：你站这儿，别人进来第一眼看到的就是撑伞的那个。\n你在门口站了一整个下午。谁进来都先看你一眼，再去看墙上的画。\n你没有告诉她，其实你只是想第一个看见她笑。\n那本素描本最后被放在柜台最下层，和旧账本摞在一起。\n她后来在城南一家书店做事，不再画画。"}, "C": {"title": "同撑一把伞", "text": "你还是送她去了车站。一路上你们谁都没有说话，伞一直偏向她那边，你的左肩全湿了，她假装没看见。\n她进站之后回头，隔着玻璃用口型说了三个字。你没听清，也不想问。\n秋天的时候，你收到一个没有署名的信封。里面是一张画：雨天，两把伞，一把空着。\n背面写着地址，还有一个字——「来」。\n你把画夹进那本旧书里，翻到中间那一页。便签还在，七根伞骨，一根不少。\n后来你再路过那条街，橱窗里换了一盆绿植，摆得整整齐齐。\n她每天仍旧六点开门，先把伞挂好，再翻开那本没画完的。"}, "D": {"title": "雨一直下", "text": "后天十点零七分，她走了。\n书店照常开门，风扇照常空转。新来的店员问你找什么，你说随便看看。\n你在最高那一格找到一本硬壳的旧书，中间夹着一张便签，上面还是那个撑伞的小人。\n你不会画，所以你把便签放回原地，合上书，像合上一封没有寄出的信。\n雨停了很久之后，你才想起来：那天在站台上，她其实回过头。而你只顾着低头看鞋，没看清她口型说的是什么。\n再后来你搬家，那张便签没带走，夹在旧书里，一起卖给了下一家书店。"}}, "yao": {"A": {"title": "旧调重弹", "text": "她没走。车票退掉那天，她在琴房里坐了整整一个下午，一句话都没说。\n后来她把那架琴留在了书店二楼，说等学生教完了再搬。\n半年后她真的回去了一趟，又回来，说：「我妈说，学琴的姑娘不用非得嫁得好，别太野就行。我做到了。」\n那年冬天，她把十二首曲子录完了。第十二首有名字，叫《跟着，不超过去》。"}, "B": {"title": "各自远扬", "text": "她还是走了。你在站台上把录音笔还给她，她推回来，说留着。\n半年后，一档音乐节目里放了其中一段，没有署名，主持人说「作者不愿透露」。\n你听出来了，那首是第十二首。\n后来你给她发消息：「听到了。」她隔了很久才回：「你耳朵还行。」\n谱架上那首卡农后来换了人弹，第二声部依旧空着。\n她在另一座城的中学教书，课间仍会去琴房坐一会儿。"}, "C": {"title": "朋友以上", "text": "她走的那天，车开走前，她隔着玻璃对你笑了一下，什么也没说。\n你们一直有联系，聊琴，聊学生，聊她妈的身体，就是不聊那天晚上。\n第二年梅雨季，琴房又漏雨。你上去接水，看见她站在窗边，正在擦琴盖。\n「我回来代课。」她说，「这次教一年。」\n琴房的钥匙还回来了，门牌上她的名字被白漆盖住一半。\n她还在那间琴房上课，仍旧只弹声部。"}, "D": {"title": "雨一直下", "text": "她走的那天，你去了，但站在柱子后面。\n车开走以后，你上楼去看那架琴。琴已经搬走了，地板上留着一块四方的浅色印子。\n录音笔在琴凳上。你没打开。\n那年雨下得比往年久，一直到十一月才停。\n琴房后来改成了储物间，门口那块「禁止入内」的牌子一直没摘。"}}, "wen": {"A": {"title": "声音落地", "text": "她没回老家。车票退了，改成了两个月后的一张返程票。\n新节目在另一个平台上线，名字还叫「城市零点」。第一期她只说了一句话：「我回来了，因为有人一直在听。」\n你在便利店上夜班，她在录音间里说话。凌晨两点，两个人隔着一条街，谁也没关手机。\n后来她把节目里那句「算了」剪掉了，换成了一句没说下去的「谢谢你」。"}, "B": {"title": "只闻其声", "text": "她走了。最后一期的母带你留到现在，一年听了三十几遍。\n有一天你在地铁上听见有人放那段录音，放的正是她说「算了」的那一句。\n你没忍住，给那个陌生人发了一条消息：「后面还有四十分钟。」\n对方回：「我知道。我就是想听听她停在哪儿。」\n便利店换了新店员，收音机还在，只是没人再调那个台。\n她换了个城市，不做节目了，改做有声书。"}, "C": {"title": "白班与夜班", "text": "她回了老家，在一所小学教书，白天上班，晚上十点就睡。\n你们偶尔发消息，都是些没什么用的话。她会拍学生画的画，你会拍便利店的萝卜。\n第二年冬天她来这座城出差，只停一晚。你们在便利店门口站着，谁也没提当年。\n「我明天一早就走。」她说。你点点头，替她拉开玻璃门。\n那副耳机后来不知去向，剩下的一只留在收银台抽屉里。\n她还在凌晨守着收音机，只是不再开麦。"}, "D": {"title": "断线", "text": "她走得很快，像怕自己反悔。最后一句是「你路上小心」，和第一天一模一样。\n收音机后来一直放在那家便利店里，新来的店员嫌吵，拔了插头。\n你没有去找她。有些频道关掉了，就是关掉了。\n只是后来每次凌晨一点醒过来，你还是会先摸一下床头那台旧收音机。\n电台的频率后来被另一档节目占了，调过去，是个陌生人在念广告。"}}, "xiao": {"A": {"title": "共谋", "text": "天亮的时候，兵符是真的了。她把假的投进炭盆，看着它烧完。\n早朝上，御史台的人没来得及开口。三天后，户部那位侍郎自尽，案子结了。\n你没有走。你成了长公主府里一个没有官职的抄书人，替她改所有不该出现在册子上的字。\n有人说长公主养了个面首。她听见了，只回一句：「那是我的人。」"}, "B": {"title": "放你走", "text": "名籍烧了。出东门时，守门的老兵看了你一眼，什么也没问。\n三年后，你在南边的一个县里教书。有人从京城来，带了一句话：「她摄政了，没立后。」\n你把那本抄好的《河渠志》从箱底取出来，翻到第七卷。那一页的字很丑，是你写的。\n后来那本书再没有翻过。\n偏殿那盏茶撤了，对面那把椅子搬回了墙边。\n她后来把封地的事交给了别人，自己在城郊住下。"}, "C": {"title": "君臣", "text": "你留在了京城，进了国史馆。她的折子，从这天起由你誊清。\n你们说的话越来越少。她批折子，你抄字，中间隔着一张案。\n有一年冬天她病了，你在殿外站了一夜，第二天照常进去抄书，一个字也没提。\n史书上写：长公主萧氏，终身未嫁。\n城防图上那道朱笔线后来被人描过一遍，颜色深了一层。\n她仍旧每天第一个到殿上，坐原来的位置。"}, "D": {"title": "灭口", "text": "那天晚上你走出了宫门。第二天，京城的河道里捞起一个人，穿着抄书吏的衣裳。\n有人说你卷进了党争，有人说你偷了东西跑了。\n长公主府里，那本《河渠志》被投入炭盆，烧了一夜。\n你最后记着的是她说的那句话：「有些字，改了就回不去了。」\n国史馆的名册上，那一页后来换了新的纸，字是新抄的，笔画一笔不缺。"}}, "lu": {"A": {"title": "并肩", "text": "她没有被杀。陛下看了那份账，沉默了很久，只说了一句：「朕的臣子里，倒有一个不是来混日子的。」\n革职，不追究。她换了女装出宫，第一件事是去买了一双合脚的鞋。\n后来你们一起在城南开了间学馆，教算学，也教《孟子》。学生里有一半是姑娘。\n有人问起你们的来历，她只说：「同僚。」"}, "B": {"title": "辞官", "text": "她辞了官。上奏那日说的最后一句是：「臣不为官了，但这笔账，请陛下记着。」\n你留在刑部，把那一案写进档册。陆知白的名字后面，是「因病去职」四个字。\n三年后你外放，路过她家乡，听人说县里有个女先生在教算学好几年了。\n你终究没有进去。\n刑部的案卷归档了，封皮上她的名字旁边多了一个「调」字。\n她调去了别的州府，仍旧查案，只是不再上奏。"}, "C": {"title": "同僚", "text": "案子结了，她的身份成了刑部里一个谁都不提的秘密。\n你们照旧同进同出，一个主事，一个主事。她照样叫你「同僚」，照旧不叫你名字。\n只有每年冬天她值夜，会把灯留一盏给你。你也装作不知道是谁留的。\n值房的铜镜收进柜底，镜面朝下，再没翻过来。\n她仍旧把卷宗摞得比谁都齐，落款写本名。"}, "D": {"title": "败露", "text": "折子还是递了上去，慢了一步。\n审讯那日，她穿着官服，站得笔直，一句辩解也没有。\n定罪那天下着雨，刑部的院子里没人敢说话。你站在廊下，看着囚车从门前过去。\n后来那桩漕运案再没人提过。\n刑部的值房里留着一份没归档的验状，最后一行底下，有一个被墨涂掉的手印。"}}, "shen": {"A": {"title": "一起算", "text": "铺子第三年换了大些的门面。招牌还是她写的，字比第一年稳。\n账房那间小屋没动，你每天算完最后一笔，就在门口等她落锁。\n有人问起你们是什么关系，她说：「合伙的。」说完看你一眼，补一句，「也是别的。」"}, "B": {"title": "各自记账", "text": "你留在了铺子里，算账、进货、记账，只是没说过那句话。\n第五年她嫁了人，嫁的是一个粮行的掌柜。出嫁前一天，她把铺子的账本交给你。\n「先生，这铺子有你一半。」她说，「账你自己记着。」\n布铺的账本最后一页空着，只落了一行日期。\n她自己开了间小铺子，只卖布头，不记账。"}, "C": {"title": "还了婚书", "text": "婚书退了，你离开了这座城。听说铺子开得不错，她雇了两个伙计。\n三年后你路过城南，隔着街看见她在门口算账。她抬头，正好看见你，抬手打了个招呼——很自然的一个招呼。\n你也抬手，然后走了。\n那副算盘搁在左首边，珠子停在原来那一档。\n她仍旧每天算一遍账，数目对得上才关门。"}, "D": {"title": "没签的那一笔", "text": "那天你没签。族里把这事记了下来，说你「与妇人有私」。\n铺子没开成。她被送回沈家，第二年冬天病了一场。\n你被赶出裴府，在别的城里继续替人算账。算到某一页，笔停了一下。\n那本账册后来流到了旧货摊上，最后一页是空的，一道横线都没有。"}}, "jian": {"A": {"title": "同桌的你", "text": "她在雨里说「我喜欢你，从你帮我捡卷子那天起」。你说「我也没签保送，我跟你考一座城」。成绩出来她去了那所双非，你考上了你想去的学校，地铁三站路。\n大一寒假她回母校看老师，在最后一排靠窗的座位上看到一张纸条，你高三写的：「这道题她做对了，牛。」\n她把纸条拍了张照发给你，配文：「这谁写的，字真丑。」你回：「你同桌写的。」"}, "B": {"title": "各自远扬", "text": "她在雨里话到嘴边咽回去了，说「没事，考完了」。你签了保送，她去了志愿表第二栏的学校，在另一个省。\n两个人偶尔在朋友圈点赞，从没单独聊过天。她大三那年考了研，考到了你保送的那所学校——但那时你已经毕业走了。\n你在校友群里看到她的名字，想了一分钟，点进去看了一眼，退出来了。\n志愿表交上去那天，她在门口站了很久才走。\n她复读那年把错题本烧了，说留着没用。"}, "C": {"title": "同一排", "text": "她没说那句话，你也没说。两人淋着雨走到公交站，各自上了不同的车，各自回家。\n成绩出来她去了双非，你去了想去的学校，不同城。大一她寄过一封信，里面只有一颗薄荷糖和一行字：「这次轮我先说了，谢谢。」\n你回了她一道高数题的解题步骤，附了一句「这道你肯定会」。她没再回信，但你大二那年收到一个快递，里面是一本新版错题本，扉页写着：「继续。」\n讲台旁边那张桌子后来换了人，桌上摆着别人的文具袋。\n她仍旧把错题本带在书包里，一页没撕。"}, "D": {"title": "没对上号", "text": "她在雨里张了张嘴，最后说「谢谢你借我的错题本」。你没接话，两人各自走了。\n她复读了一年，考到了另一个城市。你在保送的学校读得很好，课业很忙，很少想起高中。\n三年后你在校友群里看到她的名字，想了一分钟才想起是高中那个同桌，又过了一分钟才想起来她叫程简简。\n你翻出那本旧错题本，最后一道大题旁边空着，笔迹早褪了。"}}, "qing": {"A": {"title": "学会问的人", "text": "她在办公室听完了你的话——你说「六年前你把我的方案说成你的，我恨过你。但我现在恨不动了。」她没回话，把桌上的旧模型推到你面前，缺角朝向你。\n你留下来做了这个项目，也做了下一个。她不再说「我说了算」，开始说「你觉得呢」。第一个问句比道歉难，她花了六年才说出口。\n事务所的招牌后来换了，名字加了你。她刻字的时候手没抖，你看着她刻，什么都没说。"}, "B": {"title": "各归各位", "text": "项目做完了，结款那天她把合同和图纸一起推过来，说「签收」。你签了。她把旧模型还给你，你说「留这儿吧，项目资产」。\n她点了头。你离开了这座城，第二次。后来你听说事务所拿了那个旧改项目的奖，领奖人写的是她的名字，你不在上面。\n她偶尔给你发消息，都是工作相关的。你偶尔回。两个人像两条平行线，离得不远，但永远碰不上。\n门牌上那个名字最后只刻了她一个，另一格空着。\n她自己单干，接的活都不大，从不署名。"}, "C": {"title": "重蹈一次", "text": "你留下来了。不是因为项目，是因为她那句「愿不愿意」。你告诉自己这次不一样，她学会了问。\n但三个月后，新项目的汇报会上，她又站在了台上。PPT上你的方案署着她的名字。你在台下看着，手心出汗。\n散会后她找到你，说「这次我跟你说过会写你的名字，是他们排版漏了。」语气是命令，不是解释。你信了。或者说，你选择了信。\n工位上的模型搬走了，桌面擦得很干净，什么都没留。\n她仍旧把图纸折三折，角上留一处标红。"}, "D": {"title": "擦肩", "text": "你说「不了」，她点了头。没有挽留，没有第二句。你收拾东西的时候她在窗边站着，背对着你，又点了一支烟。\n你走到门口，停了一下。她没回头。你出了门，走廊的感应灯亮了又灭。\n第二年你在另一座城做项目，甲方发来的合作方名单里有她的事务所。你看了三秒，划掉了。\n名单退回去那天，你在楼下抽完了整支烟，烟灰掉在鞋面上，没拍。窗外没有下雨，天很干，你点了支烟，才发现自己什么时候也学会了抽。"}}, "umbrella": {"A": {"title": "新门牌号", "text": "老街拆迁那天雨下得不大，他把铺子里最后两箱钳子和铜丝搬上三轮车。你撑着那把换过实心钢骨的伞站在车旁，他接过伞放进车斗，顺手把门口那把不卖的竹骨旧伞也收了下来。他说新铺子在两条街外，巷口有棵老槐树，房租比这里便宜两百。\n第二年梅雨季再来时，新铺子门口挂着一块新刷的木牌。你进门收伞的时候，看见门后伞架最里格插着你那把伞，旁边多了一把同款黑色长伞。"}, "B": {"title": "留一把备用", "text": "他把新铺子的地址抄在一张牛皮纸硬卡上，折好放进你的伞套里。搬家那天你正好出差在外，回来时老街已经拉起了蓝色的施工围挡。你隔着围挡缝隙看了一眼，原本亮着黄灯的铺面黑着，卷帘门落到底，只有门缝底下还干干净净的。\n后来你在手机里存下了那个新地址，始终没有过去找他。只是每次出门遇上阴天，你都会习惯性摸一摸伞柄内侧那个刻得很浅的编号。"}, "C": {"title": "没取走的红伞", "text": "最后那晚你把伞留在了他柜台上，只拿走了自己的画夹。他送你到巷口路灯下，手里拿着那把一直没外借过的黑伞，却没有递过来，只是站着看你走远。雨丝落在他肩上，他站了很久才转身回铺子去关灯。\n年底老街彻底清场以后，听说他去了邻省一个更南边的小城。原本锁在木盒里的那把断骨红伞，最后被他拆掉布面，只留了一截竹柄带走。"}, "D": {"title": "檐下各自走", "text": "修好那把折叠伞后，你们再没遇上同时躲雨的傍晚。拆迁贴出通知的那周，他提前把铺子转给了收旧货的老板，连一句道别都没留。你路过空铺子的时候，里面的木架已经拆光了，墙上留着一排钉过铁钩的小洞。\n后来你在城西一家百货商场门口躲雨，听见旁边有人低头修伞骨的声音。你回头看了一眼，那人穿着深灰夹克，手里捏着一小段细铜丝，侧脸却不是他。"}}, "snowmelt": {"A": {"title": "白大褂内袋", "text": "立春那天清城出了大太阳，屋檐积雪化水滴在阳台上噼啪作响。梁砚辞把那枚收了三年的银质书签重新放回你掌心，没有再替你做任何决定，只问你下周休假愿不愿意陪他去城郊看一次日落。你把书签夹进新洗出来的相册扉页，点头说好。\n入冬时他仍旧常值夜班，只是每回下班前都会提前十分钟给你发一条消息报备路况。你去医院接他时，看见他白大褂左胸口袋里依然别着那支旧钢笔，旁边多了一张你随手塞进去的暖贴。"}, "B": {"title": "复诊预约单", "text": "雨雪彻底停了的那天，你去市一院做了最后一次复查。梁砚辞低头签完病历，把单子递过来时手指停了一瞬，语气恢复了最初的克制，只叮嘱你回高原前记得按时吃药。你们在急诊楼门口道别，像一对各自走过漫长弯路的老友。\n后来你又去了几次西南采风，手机里始终留着他的号码。每年入冬下第一场雪时，对话框里都会准时多出一句极短的「降温了，别穿太薄」，你也总会回他一张雪山晴天的照片。"}, "C": {"title": "没寄出的明信片", "text": "那天晚上你在旧酒馆听完了三年前的全部隐情，没有责怪，也没有回头。你把那一叠未寄出的高原明信片留在桌面上，起身披好自己的外套推门走进雪里。他在窗口站了很久，没有追出来拦你，把迟来三年的分寸还给了你。\n第二年春天你调去了海边城市的分社，整理行李时发现包底多了一盒未拆封的常用感冒药，盒角用锋利字迹标清了每一次剂量。你把药盒放进窗台抽屉，窗外的海风很暖。"}, "D": {"title": "两把旧钥匙", "text": "你接过他递来的热栗子，没有再算三年前谁欠了谁的账，只让他把公寓备用钥匙和那枚银书签一起交出来。梁砚辞愣了一秒，随即极浅地笑了一下，把钥匙放进你手心时顺手握紧了你发凉的手指，说以后不管遇到什么事，都不会再一个人躲起来扛。\n次年除夕夜急诊室难得清静，窗外烟花升起时他在值班室给你留了一碗还冒着热气的汤圆。不锈钢饭盒底下垫着一张折叠整齐的处方纸，上面写着「今年按时回家」。"}}, "lantern": {"A": {"title": "双名河灯", "text": "漕运旧案昭雪后的第一个上元夜，金光门漕渠两岸灯火如昼。谢清晏脱了礼部女史的青衫，换上一身素雅襦裙立在石桥边，将一盏并排写着两人姓名的河灯放进水里。河灯顺着微澜缓缓漂向西市许愿池，她偏过头看你，眼底再无试探与防备。\n次年深秋你调任京兆府，每日下值经过金光门时总能遇见她提着一卷新拟的仪典图册在柳树下等你。她袖中常备两块温热的桂花糖糕，说京城秋风凉，先垫垫肚子再回家。"}, "B": {"title": "半枚朱砂印", "text": "大案落定，你奉旨南下继续核查江南水运，谢清晏则留在礼部接掌仪典司。临行前夜她在城外十里亭替你斟了一杯饯行茶，把那半枚朱砂印用锦囊收好递给你，说山高水长，彼此保重。马车驶出官道时，你回头看见她仍撑着油纸伞站在细雨里。\n后来每逢京城来信，公文夹层里偶尔会附一张抄着新茶品评的素笺，字迹依旧清峻沉稳。你把那只锦囊一直悬在书房砚台旁，像留住那年秋夜漕渠上的一点微光。"}, "C": {"title": "各守一局", "text": "宫宴风波平息后，朝局暗流仍未停歇。你在礼部廊下归还了那张漕渠舆图，谢清晏接过纸卷，端端正正福了一礼，唇角仍是最初那副滴水不漏的浅笑。你们都明白，在这座处处皆是算计的京城里，保持半步距离反而是保全彼此最稳妥的法子。\n入冬后她升任司仪正官，朝会上偶尔与你隔阶相望，彼此只微微颔首。直到那年腊月下大雪，你案头无声多了一只刻着竹纹的暖手铜炉，炉灰里还留着余温。"}, "D": {"title": "同舟共渡", "text": "你翻过矮墙把新摘的橘子放在她窗台时，谢清晏没有再讲规矩，只伸手拉你进了屋，替你拂去肩头落叶。她说这半生替朝廷守过太多礼数，唯独这一回，想替自己留住一个并肩看风浪的人。你在灯下握住她微凉的手，把当年拾灯许下的愿亲口兑现。\n第二年春暖花开，她辞去宫中繁务，与你一同领旨巡查江南水道。官船泊在烟雨渡口时，船头挂着两盏一样的素白风灯，风吹过水面，灯影始终挨在一处。"}}, "summer": {"A": {"title": "靠风扇的位子", "text": "跨年夜江边烟花落幕时，陆星沉把自己的羊绒围巾绕在你颈间两圈，嘴上还在嫌你出门不知道多穿件毛衣，手却一直牢牢扣着你的指缝没松开。人潮往地铁站涌去，他把你护在内侧，笑着说下学期所有联名作业都得继续跟你一组。\n开学第一天你推开建筑楼三层画室的门，最靠窗吹得到风扇的那张图板已经擦得干干净净。桌洞里照例放着一盒温热的黑巧和一张折齐的草稿纸，上面画着一只举着三角尺的小猫，写着「早安，这次不是顺路」。"}, "B": {"title": "速写本末页", "text": "期末评图拿了全系第一，庆功宴散场后你们沿着香樟大道走了很久。你笑着把那本夹着校园卡套的速写本还给他，说以后不用再找借口送巧克力了。他挠了挠后颈，耳根泛红，却老老实实应了一声好，把步子放得比平时更慢。\n大三那年你申请了去外校交换一学期，临走前他在你画筒里塞了一本新速写本。翻开最后一页，上面密密麻麻记着交换城市三家不踩雷的夜宵摊和一张手绘地图，落款写着「等暑假我去找你」。"}, "C": {"title": "未拆封的黑巧", "text": "香樟树下你安静听完他所有的坦白，却只是摇了摇头，说你现在只想把专业课和出国作品集顾好，不敢轻易接住这么沉的喜欢。陆星沉愣了半秒，很快扯出一个有点僵硬的笑，说没事，还是好搭档，转身时把原本攥在手里的糖画悄悄藏到了身后。\n毕业展那天他站在你的毕业设计模型前看了很久，留言簿上只留下干干净净的一行「采光比大二那年稳多了」。走出去几步，你看见他书包侧袋里还挂着那年古镇测绘时一起买的小铜铃。"}, "D": {"title": "蓄谋的满分", "text": "江边烟火照亮半片夜空，你迎着他亮得惊人的眼睛，把藏了一整季的喜欢先说了出口。向来嘴快的陆星沉罕见地卡了壳，半晌才低头笑出声，伸手把你整个人拢进大衣前襟挡住江风，哑声说这下他大一写下的所有计划总算全部通关。\n第二年盛夏你们一起去南方老镇做古建修复实习，傍晚收工后并排坐在青石板台阶上分吃一根绿豆冰棍。他把没化掉的那头递给你，夕阳把两个人的影子拉得很长，手背贴着手背，谁也没往回缩。"}}, "gambit": {"A": {"title": "双向掀翻", "text": "新馆开馆那天，陆寻在台阶尽头站了很久。初夏的日光穿过玻璃穹顶落在他肩上，那件穿了整冬的黑风衣收进了柜底，换成一件柔软的米白针织衫。老程在门口招呼客人，陆寻没有上台念准备好的发言稿，只走到你身边，把那把重新换过伞骨的深蓝色长柄伞递进你手里。他说，沙盘和算盘都封箱了，往后不再算胜率，只算每天几点回家。\n次年深秋，旧城片区彻底完工。他在新事务所二楼向阳的窗边安了一张双人木桌，桌角常年放着两盒薄荷糖和一只黄铜量角器。每逢阴雨天，他依然会在傍晚五点半准时合上卷宗，在玄关备好烘干的棉袜和滚热的姜茶；只是那柄曾挡过无数风浪的深蓝旧伞，长长久久挂在门厅木钩上，伞尖再也没沾过一片泥水。"}, "B": {"title": "独木难支", "text": "听证会的裁决书虽还了清白，行业里的暗流却没有立刻散去。在长街尽头，陆寻听完你那句话，手指在长柄伞的木把上收紧又松开。他静静看了你两秒，垂下眼把伞塞回你怀里。他说，这桩案子的余波还没收干净，暗处盯着他的人不止许昭一个，他给不了你安稳的日子，不该把你拉进没有退路的局里。\n次年春天，顾问事务所的铜牌摘了下来，他在城北背街开了一间极小的古籍胶装铺。偶尔在行业内刊的技术勘误栏里，你还能看见那个工整的署名；寄到你住处的挂号信里，除了每季度一份详尽的城市汛期避险图和一张无字的薄荷绿书签外，再也没留过半句私人的字。"}, "C": {"title": "同向回响", "text": "风波落定后，谁都没有再把那层纸戳破。两人顺理成章成了最合拍的搭档。新案子一桩接一桩，他在图纸这端圈出受力断点，你便在桌对面递上核验好的光谱样本；下雨天依然会在便利店屋檐下共撑一把黑伞，步调一致地避开路面积水，肩头之间始终留着恰到好处的半拳空隙。\n入冬初雪那天，老程在门卫室烤热红薯。陆寻从里屋走出来，顺手把烘得微热的羊毛围巾搭在你椅背上，语气一如既往公事公办地交代明早去省城调卷的车次。你低头绕上围巾，布料里带着淡淡的松木烟草味；推门走进落雪的巷口时，两道影子在路灯下拉得很长，脚步始终落在同一个节拍上。"}, "D": {"title": "概率归零", "text": "听证会散场的那个下午，天色干爽，连一滴雨也没落。办完档案交接，他在行政大厅旋转门外和你道别。街上车流嘈杂，两人的话短促又客气。他把装有更正公证书的文件袋双手递过来，交代完后续手续的窗口编号，便抬手拦了辆出租车。车门合拢时，后视镜里他侧脸望着窗外，没有回头。\n三年后的一个雨天，你在市图书馆借阅一本旧版《城市地下管网应力复盘》，在扉页借阅卡最底行看见了“陆寻”两个字。借阅日期正是当年你们走出大厦的那一天。你在借阅台前站了一会儿，想记起他当年推眼镜时的神情，却只记得那天长街的风很凉，把没说出口的话吹得很淡。"}}, "mask": {"A": {"title": "惊鸿同归", "text": "复演散场那晚，老街红灯笼在晚风里轻晃。裴砚之在空下来的戏台中央摆了一张小方桌，温了半壶桂花冬酿，把那枚存了五年的掐丝双鱼银锁重新替你系上。他说，半辈子都在库房里修别人的戏袍与折子，直到今晚才算替自己把这出戏的开头写稳。\n次年仲夏，天井石阶边开满月季。他在东厢房廊下辟了张采光最好的调色长案，案头常年摆着两把红木椅和两盏冰糖梨汤；每逢雷雨骤至，他总会在收摊前合上戏折，撑着那柄重新上过桐油的黄纸伞去文保所门前接你，青石板路上的雨水洗得发亮，两人的步子再没分开过。"}, "B": {"title": "曲终人散", "text": "老戏楼虽保住了产权，历史遗留的修缮债务仍要慢慢偿清。露台看晚霞那天，裴砚之听完你那句话，手指在木栏上收紧又松开。他静静看了你两秒，脱下外衫披在你肩头，低声说，戏院这笔账还要还上三年，他舍不得把你困在潮气重、灰尘多的老院子里一起熬。\n次年秋风起时，你调回省城主持新的古建勘察项目。萃华楼复演那天你因公没能赶回，只收到一个从老街寄来的红木长盒；打开来，里面叠着当年那件补好的红呢斗篷，领口焦痕处用极细的苏绣针脚补了一枝海棠，盒里没有留字，只余一点淡淡松香。"}, "C": {"title": "静水深流", "text": "风波过去后，两人都没戳破那层薄纸。戏院改建成非遗传承工坊，他守着衣箱矿彩，你管着古籍档案，日子安静得像檐下滴落的露水。碰上难辨的旧戏折，他在宣纸上勾出工尺谱推过来，你便顺手找出对应年代的修补竹纸递回去；下雨天照旧在走廊下听六叔拉胡琴，中间始终隔着半拳温和的分寸。\n冬至那天落了场大雪，老槐树枝头压满积雪。裴砚之端着刚出锅的素馅饺子掀帘进屋，顺手拿一支磨润的老竹簪替你挽起垂在桌边的长发，语气如常地交代明早有批外省古戏服入库。你咬下一口热饺子，看着窗外飞雪，心里安稳得像落了地。"}, "D": {"title": "镜花水月", "text": "文保勘察按期结项，萃华楼顺利纳入专项修缮基金。办完交接的下午天色微阴，裴砚之送你到戏院门槛前，双手拢在袖里，周全客气地道谢。两人的道别短促克制，像合上一本翻完的旧账。出租车驶出老街时，后视镜里他仍一身青衫立在砖雕门楼下，很快隐进细雨里。\n四年后你在南方一场戏曲文献展上路过萃华楼展位。展柜正中陈列着一本精装《萃华楼古戏折释义》，副主编印着他的名字。你隔着玻璃看那张黑白作者照，想起昏暗库房里他握着细银针开锁的侧脸，才发觉自己竟没见过他在晴天里真正放松笑开的模样。"}}, "compass": {"A": {"title": "定风止澜", "text": "发车前五分钟，检票口已经开始收队，韩烈气喘吁吁地从站台长廊尽头追了过来。他左手攥着一张刚补的同车次站票，右手把那枚纯铜老罗盘连着一张盖好红章的省城联合勘探调令复印件一起塞进你大衣兜里。他说，山里的事交给老宋盯着了，这趟车他送你回省城，把欠你的那顿饭和后面的日子当面聊清楚。\n次年深秋，秦岭主峰落了第一场薄雪。他在保护站后院亲手用青石砌了座避风壁炉，炉膛里整夜烧着青冈木炭，铁架上永远坐着一壶红枣姜茶；每逢山风呼啸雪落封道，他总会把你冰凉的双手揣进自己暖烘烘的羊绒衫口袋里焐热，屋外风雪拍窗，屋内柴火轻爆，整座大山再也没一阵冷风能吹到你身上。"}, "B": {"title": "峰回路转", "text": "月台汽笛拉响，韩烈听完你那句话，按在罗盘上的手背青筋微微鼓起。他静静看了你两秒，终究退回黄色安全线外。车门合拢前，他把那块盖着保护区钢印的出入牌塞进你手心，哑着嗓子说，山里的苦他一个人吃惯了，等他把这几道滑坡沟全部治理稳妥，如果那时候你还愿意等，他进城找你。\n次年盛夏，省城地质灾害治理评审会上，秦岭方案全票通过。你在发言席抬起头，看见最后一排坐着个肩宽背厚的身影；他穿着一套略显拘谨的深蓝西装，领口别着一枚小小的铜指针，在掌声里隔着人群望向你，眼神沉静笃定。"}, "C": {"title": "高山流水", "text": "走出大山后，谁都没把那句话点破。他留在深山当他的防灾领队，你回研究所主持古水脉文献整理。每年立秋和冬至，山里邮车总会准时捎来两袋新打的野生板栗和晒干的羊肚菌；你在省城挑好的防水登山靴和防滑冰爪，也会按老地址寄回道班房，包裹里谁都不留多余的话。\n三年后联合勘探队重返秦岭，两人在龟背石观测点重逢。雨后初晴，韩烈靠在皮卡车门边擦罗盘，见你拎着测绘仪走来，自然地迈步迎上去接过最沉的那只箱子架上肩头，笑着吐出两个字：“来了？”像昨天才刚分开。"}, "D": {"title": "过客归川", "text": "火车站一别，生活迅速归位。你调往沿海城市参与海洋地质项目，秦岭的暴雨与断崖渐渐成了档案柜里几页工整的坐标日志。偶尔有同事聊起那场暴雨脱险，你总能平静专业地分析花岗岩基岩与古水脉走势，只是很少再提起那个在泥石流里拉住你后领的墨绿色背影。\n五年后一个雨夜，你在纪录片频道看到秦岭国家公园建成的专题片。镜头掠过林场荣誉室展柜，那枚布满划痕的纯铜老罗盘静静躺在绒布上，旁白念着原领队韩烈调赴高原支援地质找矿的消息。你关掉电视站在窗前，掌心似乎还留着当年山风吹过时的凉意。"}}, "gallery": {"A": {"title": "长线持有", "text": "春展闭馆那晚，老厂房院里的玉兰花落了一地白瓣。姜绯关掉主厅射灯，把装有「白匣」新营业执照和备用钥匙的牛皮纸袋推到你面前，没有再谈股份比例，也没有谈违约金。她说，以前卖掉老画室后，她以为自己这辈子只会算短线止损，直到你把那份解约函推回来的那一晚，她才真正学会长线持有。\n次年深秋，画廊二楼多了一间半开放的书房，长桌一半堆着她的策展模型与色卡，一半码着你的艺术品估价图录。每逢雨夜布展收工，她依然习惯在玄关备两把一模一样的黑色直柄伞，只是再也没人提过三十八块的伞钱；手机账单里多了一张共同储蓄卡，备注栏干干净净写着两个字：“不退。”"}, "B": {"title": "账目未平", "text": "秋展风波虽然平息，「白匣」的现金流与新一轮融资谈判仍像一张绷紧的网。闭馆那晚，姜绯听完你那句话，手指在无名指的素银戒圈上转了一圈又一圈。她抬眼看你，神情极清醒，也带着藏不住的倦意。她说，她现在还背着回购股份的对赌压力，给不了你对等的时间和安稳，不想拿一笔没把握的账拖你下水。\n次年夏天，你调去总部负责国际艺术品承保业务。在一次海外秋拍预展上，你远远看见姜绯穿着利落的黑西装和藏家谈笑风生；散场时她托侍应生给你送来一杯刚好常温的乌龙茶，杯垫背面用铅笔写着一行极工整的小字：“那笔咖啡钱还没还，下回见。”"}, "C": {"title": "最佳拍档", "text": "风波散去后，两人都没越过那条体面的界线，顺理成章成了业内最难拆散的搭档。每逢「白匣」筹备新展，总是由你先带着紫外灯进场核验每一件展品；每次拍卖行有拿不准的冷门画作，她也总会第一时间把高清底片发到你邮箱，从不收顾问费。\n入冬第一场雪落下来那天，你们在画廊露台核完年度结算表。姜绯顺手把刚拆封的一条羊绒围巾抛到你怀里，语气如常地说是品牌方送的伴手礼、她戴着颜色太素。你接过围巾系上，淡淡的雪松味混着冬夜寒气，两人在亮着暖灯的玻璃顶下碰了碰纸杯里的热美式。"}, "D": {"title": "两清为止", "text": "秋展顺利闭幕的下午，姜绯把最后一笔保险评估费准时打进了公司对公账户，连同那份盖好公章的结项回执一起寄到了你的工位。你们在展厅门口握了握手，礼貌客气，像两笔恰好平账的交易。她转身回去指挥工人撤展，背影依旧挺拔利落。\n两年后你在艺术杂志的年度人物专访里看见她的照片，「白匣」已经搬进了江边更大的独栋空间。配图里她站在白色展墙前，左手无名指依然戴着那枚素银戒圈。你合上杂志，想起那个暴雨夜她坚持转来的五十块钱，才发觉两人自始至终，连一顿没算清价格的饭都没吃过。"}}, "silk": {"A": {"title": "并肩裁云", "text": "立春那晚展示厅打烊后，温舒窈把「素尺」新刻的铜印放在长案中央，印文旁边刻着两人的名字缩写。她说，以前总觉得手艺和真心一样，握在自己手里才最保险，直到那晚雨里你撑起防雨布替她挡住斜雨，她才明白，有些布料一个人拉不平，得两个人各按一端才能裁得最正。\n次年深秋，「素尺」受邀赴江南古镇做非遗成衣展。你在后台替她核完最后一批真丝吊牌，抬头看见她正蹲在箱边细心收好你那件常穿的藏青衬衫。窗外细雨敲打青瓦，案头那把黄铜剪刀安静躺在绒布上，两人的茶杯并排放在暖炉边，冒着淡淡白汽。"}, "B": {"title": "各自成峰", "text": "秋装大秀大获成功后，订单与资本邀约如雪片般涌来。弄堂铁门前，温舒窈听完你那句话，手指在黄铜门环上停了很久。她抬头看你，眼神依旧清醒坦荡。她说，「素尺」刚站稳脚跟，接下来两年她要把全部心力都押在扩建工坊和打通海外渠道上，不想让你陪着她过连一顿安稳晚饭都凑不齐的日子。\n次年冬天，你在一家买手店橱窗里看见「素尺」最新一季的压轴大衣，衣领走线利落得一眼就能认出她的手笔。元旦前夕你收到一只素白布盒，里面是一条织得极密实的藏青真丝围巾，卡片上只有她一贯干脆的字迹：“天冷，护好嗓子。”"}, "C": {"title": "尺素相知", "text": "大秀之后，两人顺理成章成了最默契的事业搭档。「素尺」每一季的新品研发，都由你提前跑遍江南织厂把关面料支数与缩水率，再交到她的打版案上裁剪成型。谁都没把那层纸戳破，却在每一匹真丝的经纬里留足了对彼此的信任。\n入冬初雪那天，陈姨在工作室炖了萝卜老鸭汤。温舒窈端了一碗放上你的书桌，顺手把一条刚试完版的羊绒披肩搭在你肩上，口吻如常地让你帮忙试一下垂感。窗外雪片安静飘过梧桐枝头，屋里缝纫机停着，暖意刚好。"}, "D": {"title": "一剪两宽", "text": "独立秀圆满收官的次周，温舒窈按合同结清了最后一笔顾问尾款，把签好字的结项单装在干净的素白信封里递给你。弄堂口阳光正好，两人客气道谢，互祝前程顺遂。她转身回二楼继续忙新季排产，步伐利落得没有回头。\n一年后你在机场候机厅翻开时尚季刊，专访页里温舒窈站在新落成的展厅前，手握黄铜裁布剪，眉眼笃定从容。你看着配图里那件熟悉的素白立领大衣，想起那个飘着靛蓝草木香的雨夜，安静合上了杂志。"}}, "rail": {"A": {"title": "同轨新程", "text": "签售会散场那晚，雨歇云开。程远山带你穿过新机务段外的梧桐街，把新配好的房门钥匙放进你掌心。他说，自己嘴笨，不会说漂亮话，但这些年巡道养出来的毛病改不掉——答应好的事绝不晚点，走上来的路绝不半途改道。\n次年冬至，省城落了场薄雪。厨房煤气灶上滚着白菜猪肉饺子，书桌一角稳稳压着那块从青坪三号桥拆下来的钢轨镇纸。每逢你加班写稿到深夜，他总会在十一点整准时敲响书房门，递进来一杯兑好温度的蜂蜜水，顺手把你脚边漏风的门缝用棉条压实，安稳得像一趟永远准点的慢车。"}, "B": {"title": "错峰发车", "text": "天桥晚风微凉，程远山听完你那句话，手掌在栏杆上收紧又慢慢松开。他看着你，眼神依旧坦荡实诚。他说，自己刚调来大机务段，夜班轮值紧，连个安稳落脚的地方都还没置办妥当，不想让你跟着他从头吃这份奔波苦；等他在省城站稳脚跟，如果那时候你还愿意，他再郑重来问你一次。\n次年夏天，你在铁路文化展上再次遇见他。他穿着笔挺的新式检修制服，比去年晒黑了些，神情沉稳利落。散场时他在门口递给你一小袋晒得极甜的青坪红枣，笑着说宿舍窗框今年换了新的，一点风也不漏。"}, "C": {"title": "准点相逢", "text": "两人都没戳破天桥上那层薄纸，却在省城自然而然延续了青坪小站的默契。每逢你出差赶早班火车，只要恰逢他在东站当班，总能看见他在站台柱子旁站着，替你提一把箱子、叮嘱一句车厢空调冷；每次你发了新书样册，也总会第一时间给机务段寄去一本。\n入冬第一场寒潮来袭那天，你在家门口收到他托小周捎来的一对厚棉门帘和两块刨得光滑的松木窗楔。附着的纸条上还是他那手方正实在的字：“降温了，门窗塞紧，别着凉。”"}, "D": {"title": "各赴远站", "text": "青坪站最后一趟慢车停运后，你调往外省主持新的地方志编纂，两人只偶尔在年节时互寄一张简短的明信片。你听说他顺利进了省城机务段，还评上了技术骨干，替他高兴，却再没机会坐上他检过的同一趟车。\n三年后的秋日，你整理旧书箱，从《青坪铁道志》里滑出一张剪掉一角的旧硬板站台票。你捏着那张发黄的硬纸片站了一会儿，耳边似乎还能听见深秋山雾里那几声清脆均匀的敲轨声。"}}}, VIGS={"loop": [{"need": 3, "title": "旧挂表", "lines": ["值班室抽屉最里层放着一块停摆的银壳挂表。", "小周拿起来晃了晃，问怎么不换电池。", "他接过去放回原位：不是没电，是上一轮摔碎了齿轮。", "表盘玻璃上有一道极细的裂纹，正好横在三点十七分。"]}, {"title": "换班表", "need": 6, "lines": ["换班表贴在护士站左边，用磁贴压着，纸角卷起来一块。", "她从来不抬头看。谁几点来、带没带早饭、先进哪间病房，她都知道。", "「你怎么记得住？」同事问她。", "「记性好。」她答，把笔帽按回去，声音没有起伏。"]}, {"title": "保温杯", "need": 12, "lines": ["那只旧保温杯放在值班室最上层，杯底有一圈洗不掉的茶渍。", "侧面贴过名字贴，撕了，只留下一小块胶印和半个字。", "「这谁的？」新来的实习生问。", "「我的。」她伸手拿回来，放进柜子，柜门关得很轻。"]}, {"need": 15, "title": "急诊窗台", "lines": ["凌晨四点半，雨声小了一点。", "他站在窗台边核对交班表，手里转着一支没盖帽的蓝笔。", "你递过去一杯热美式，他接的时候指尖凉得像刚从冷库出来。", "「这一轮还没到点。」他说，声音比平时低。"]}, {"title": "第三病床", "need": 18, "lines": ["三床的老人每次都在三点二十一分停一次心跳。", "她试过三次：提前给药、提前叫人、提前把除颤仪推到床边。", "第三次之后，老人照旧在那个时间停了一下。她站在床边没动，看着监护仪上的线重新走起来。", "那天她在记录上多写了一行字，又划掉了。"]}], "scar": [{"need": 3, "title": "扳手号码", "lines": ["工具箱第二层按毫米数排得一丝不苟。", "老陈来借十四号扳手，顺口问他那道旧伤阴天还疼不疼。", "他头都没抬，把扳手递过去：拧得动就行。", "袖口滑下来半寸，腕骨旁边的旧疤已经淡成一条白线。"]}, {"title": "工具箱", "need": 6, "lines": ["他的工具箱是铁皮的，边角磨得发亮，每一格工具都朝着同一个方向摆。", "「这个不用你递。」他把扳手接过去，用袖口擦了擦再放回原位。", "后来你发现，那格里最旧的一把，缠了两圈黑胶布，胶布已经很脆了。"]}, {"title": "体检单", "need": 12, "lines": ["体检单压在收银台下面，折过三次，边角起了毛。", "结论那栏被人用笔尖点过，点出一个针眼大的洞。", "他进来时你正拿着，他伸手抽走，塞进抽屉：「旧纸。」", "抽屉里有半盒止痛药，开封很久了，还剩三片。"]}, {"need": 15, "title": "夜路发票", "lines": ["驾驶座遮阳板后面夹着一沓高速过路费发票。", "最上面那张的日期是上个月暴雨夜，凌晨两点零七分。", "你问他怎么不拿去报销，他把票抽出来折进烟盒旁。", "「私人跑的，不算货。」"]}, {"title": "七个字", "need": 18, "lines": ["他一天说的话，你数过一遍：路况、雨量、螺丝、吃饭了、我没事。", "加起来不到五十个字，最长的一句七个字：「明天有暴雨。」", "只有一次例外。半夜他在阳台咳了很久，你推门出去，他说：「你怎么还没睡。」", "这句话有八个字。"]}], "revenge": [{"need": 3, "title": "牛皮纸书衣", "lines": ["新到的旧书都要先晾一天潮气再包牛皮纸。", "周愔问她为什么每本扉页都要盖一枚极小的红印。", "她把印泥盒盖上：省得以后有人说不清是谁先拿走的。", "纸页翻过，油墨味混着一点樟脑香。"]}, {"title": "假姓", "need": 6, "lines": ["她在招牌上只写了一个「周」字，是随手挑的姓。", "街坊叫她周老板，她应得很顺，一次没有迟疑。", "派出所登记那天，表格上那栏她写得很慢，笔尖在纸上停了一下，最后落笔还是那个字。"]}, {"title": "剪报", "need": 12, "lines": ["剪报压在柜台的玻璃下面，只露一角，字被磨得发白。", "有客人弯下身想看，她把杯子往那一角上一放：「凉了不好喝。」", "晚上打烊，她把剪报抽出来，对着灯看，看完折好，放回原处，边角对齐玻璃的边缘。"]}, {"need": 15, "title": "打烊以后", "lines": ["十点半卷帘门拉下来一半，留着底下透风。", "她坐在柜台后把当日流水对了一遍，分毫不差。", "窗外有车灯扫过，照亮墙角那摞一直没上架的旧杂志。", "她没抬头，只是把台灯往自己这边拉近两寸。"]}, {"title": "半面招牌", "need": 18, "lines": ["招牌空着半边，木板被雨泡得起了毛，钉子还留着旧孔。", "木匠说刷一遍要两天，她说不用急。", "后来木匠自己把字描了个底，还没上漆，只写了半个。", "她站在门口看了一会儿，说就这样吧，剩下的等你认出来再写。"]}], "ledger": [{"need": 3, "title": "便利贴颜色", "lines": ["她的办公桌上永远放着黄、蓝两种便利贴。", "黄色贴公事催办，蓝色只写垫付金额与日期。", "行政小张路过时夸她工位像样板间一样整齐。", "她笑了一下，把一张蓝色便利贴折进笔记本夹层。"]}, {"title": "账本", "need": 6, "lines": ["账本是薄薄一本，封皮磨白，里面用尺子画了竖线。", "每一笔都写着日期、金额、事由，字小而整齐。", "「你记这个干嘛？」同事问。", "「习惯了。」她合上本子，塞回抽屉。"]}, {"title": "第37条", "need": 12, "lines": ["第 37 条那页有一道折痕，是反复翻过的痕迹。", "事由栏写着两个字：车费。", "下面空着一行，像是留给什么。", "她后来用铅笔在那行补了日期，又擦掉。"]}, {"need": 15, "title": "加班电梯", "lines": ["十七层晚上九点以后只有一部货梯开着。", "她拎着包等电梯，顺手把今天多算的一笔差旅费划掉。", "电梯门开时里面空着，镜面照出她手腕上勒出红印的包带。", "她把包换到左手，站到角落里。"]}, {"title": "四十七笔", "need": 18, "lines": ["三年，四十七笔，全带日期。", "她把清单打印出来，纸边对齐，压在一叠合同下面。", "有人问她为什么不算清。", "她说算清就没意思了——说完自己愣了一下。"]}], "coroner": [{"need": 3, "title": "除湿机水箱", "lines": ["档案室靠墙那台除湿机每两天要倒一次水。", "老周抱怨湿度计坏了，他走过去看了一眼表盘。", "「不是坏了，昨天雨大，门缝没压实。」", "说完他弯腰把水箱抽出来，提着去走廊尽头的水房。"]}, {"title": "十七度", "need": 6, "lines": ["法医室常年十七度，比走廊低四度。", "他从不穿外套，说温度高了手会软。", "你第一次进来打了个哆嗦，他抬头看了一眼，把空调调高一度。", "第二天又调回十七度，谁也没提。"]}, {"title": "手套", "need": 12, "lines": ["他一天换四副手套，换之前先把旧的叠成方块。", "有人问他为什么这么讲究。", "他说：手套破了，证据就脏了。", "抽屉最里面有一副没拆封的，尺码比他的小一号。"]}, {"need": 15, "title": "手套尺码", "lines": ["更衣柜里备着两盒不同尺码的丁腈手套。", "M 码那盒快见底了，S 码还剩大半盒。", "他站在柜门前停了两秒，把那盒 S 码往外推了半寸。", "「下次带人进来看现场，用得着。」"]}, {"title": "第一具", "need": 18, "lines": ["他说起自己第一具尸体时，语速比平时慢。", "名字、年龄、指甲颜色，一个数字都没错。", "「你怎么记得这么清？」", "「记不清就得重来。」他顿了顿，「可人不能重来。」"]}], "hollow": [{"need": 3, "title": "两杯半糖", "lines": ["下午茶点单的时候他照例多问一圈谁要加冰。", "阿凯打趣说他像部门里的隐形行政。", "他笑嘻嘻地应着，把最边上那杯少冰半糖悄悄推到你桌角。", "吸管还没拆，杯壁上凝着一层细水珠。"]}, {"title": "马克杯", "need": 6, "lines": ["茶水间的杯子按颜色排，他知道每个人用哪个。", "新来的实习生随手拿了一个，他递过去另一只：「那个是别人的。」", "实习生问：那你的呢？", "他笑了一下，说我都行。"]}, {"title": "表情包", "need": 12, "lines": ["他道歉的方式是发一个表情包。", "连着三天，每天一个，配字都不一样。", "第四天没发了。", "第五天他出现在楼下，什么也没带。"]}, {"need": 15, "title": "清空的备忘", "lines": ["周末他在地铁口碰见你，手里只拎着一个帆布袋。", "以前周末他总要替别人改两版方案，今天手机居然没响。", "「设了免打扰。」他晃了晃手机，屏幕黑着。", "风吹过站台，他第一次没急着找话说。"]}, {"title": "楼梯间", "need": 18, "lines": ["楼梯间的应急灯是坏的，一直没人报修。", "他靠着墙，手机屏幕朝下扣在膝盖上。", "你问他在这儿待多久了。", "他说不久，说完看了一眼表，表停在三天前。"]}], "rival": [{"need": 3, "title": "同一家咖啡", "lines": ["写字楼底下那家手冲馆子一共只有六张小圆桌。", "早上九点十分，你们同时推门进去，一个要冰美式，一个要热拿铁。", "她挑了靠窗那张，顺手把对面椅子拉开。", "「等会儿招标会见，别忘带授权书。」"]}, {"title": "名片", "need": 6, "lines": ["她的名片比常规窄两毫米，纸很硬。", "背面空白，没有一句客气话。", "你把它夹在方案第一页，合上时压出一道印。", "后来那道印还在，名片不知什么时候不见了。"]}, {"title": "前一页", "need": 12, "lines": ["竞标按姓氏排座，她的名字永远在你前一页。", "翻页的时候你总会先看到她的方案标题。", "有一页她把字改小了，留白多出一指宽。", "那一指宽里什么都没写，但你看了很久。"]}, {"need": 15, "title": "评标席外", "lines": ["休会十分钟，走廊窗台前站了四五家同业的人。", "她站在最边上抽一张纸巾擦掉袖口溅到的水点。", "有人过来套近乎，她礼貌地笑，三句话就把人打发走。", "转过头看见你时，眉梢才松下来一点。"]}, {"title": "凉掉的咖啡", "need": 18, "lines": ["咖啡凉透之后表面会结一层薄膜。", "她用勺子把那层膜挑起来，放在碟子边上。", "「这样喝起来像没凉过。」她说。", "你喝了一口，确实是凉的。"]}], "badge": [{"need": 3, "title": "旧胃药盒", "lines": ["值班室抽屉里放着一盒吃了一半的铝镁碳酸咀嚼片。", "老韩路过时敲了敲桌面，让他按时吃饭。", "他把抽屉推回去，拿出一张刚打印好的调解记录核对签名。", "笔尖在纸上停顿一下，又接着往下勾。"]}, {"title": "一米二", "need": 6, "lines": ["办事窗口一米二高，站着说话得稍微低头。", "他从不坐下来说话，说站着快。", "有人搬了凳子来请他坐，他摆摆手，说流程里没这条。", "凳子在墙边放了一整天，晚上才被他自己搬回去。"]}, {"title": "胃药", "need": 12, "lines": ["桌上那盒胃药压着半张便签，便签上写着三个电话号码。", "药只剩两粒，盒沿被捏得起了毛。", "你问他吃饭了吗。", "他说吃了，然后把药盒往抽屉里推了推。"]}, {"need": 15, "title": "雨夜巡逻", "lines": ["十一点半的巷口路灯坏了一盏，水洼映着便利店的红招牌。", "他拿着手电筒照了一圈墙角，确认没有积水倒灌。", "回所里路上经过那家面馆，老板娘探头问他吃不吃夜宵。", "他摆摆手说还要值班，帽檐上的水珠滴在肩章上。"]}, {"title": "检查", "need": 18, "lines": ["检查写在一页纸上，改了四遍，每一版的错处都圈出来。", "最后一版只剩两行字，字比前面都小。", "他签名字的时候，笔尖在纸上停了一下。", "签完他把纸对折，折痕压得很实。"]}], "boss": [{"need": 3, "title": "白板右下角", "lines": ["会议室白板从来只写项目排期和 KPI 拆解。", "今天散会后，右下角多了一行极小的黑字：下班记得带伞。", "小许收拾电脑时看见，以为是行政写的通知。", "她走过玻璃隔断时看了一眼，没让人擦掉。"]}, {"title": "白板", "need": 6, "lines": ["白板上只写一行字，别人不敢往上加。", "她擦白板从上往下擦，一条一条擦，不留横线。", "有次你加了半行，第二天那半行被擦掉，字下留了空白。", "空白在中间，像她特意留的。"]}, {"title": "外卖", "need": 12, "lines": ["加班到十点，她会把最后一份外卖放在公共桌上。", "不写名字，也不说是给谁的。", "有人问是不是没人要，她说放这儿。", "第二天盒子空着，被洗干净倒扣在沥水架上。"]}, {"need": 15, "title": "十七层茶水间", "lines": ["晚上十点，整层楼只剩她办公室和茶水间的灯亮着。", "你去接热水时看见她正站在咖啡机前等浓缩滴完。", "她没问你怎么还没走，只把旁边干净的纸杯推过来一个。", "「明天上午的会推到十点半。」"]}, {"title": "周报", "need": 18, "lines": ["她的周报每一栏都有结论，只有最后一栏写「下周待定」。", "那栏空了六周。", "第七周她写上：下周你决定。", "写完之后她把字号调小了半号。"]}], "tyrant": [{"need": 3, "title": "百叶窗角度", "lines": ["他的办公室朝西，下午三点阳光总是斜切过会议桌。", "梁秘书习惯把百叶窗全放下来，他却每次都自己调成半开。", "光线落在桌角那份没签字的附件上，切出一道亮边。", "他看了一眼手表，把钢笔盖重新拧紧。"]}, {"title": "百叶帘", "need": 6, "lines": ["百叶帘常年半开，角度是固定的。", "有人调过一回，第二天就恢复了。", "她说光线刺眼，他就让人换了更厚的帘子，没解释。", "帘子换好之后，角度还是那个角度。"]}, {"title": "钢笔", "need": 12, "lines": ["他签字用一支旧钢笔，笔杆有裂纹。", "秘书买过新的，被他放回盒子里。", "那支笔是他父亲留下的，笔尖有点分叉。", "写「霍衍」两个字的时候，他会慢半拍。"]}, {"need": 15, "title": "空出来的副驾", "lines": ["司机请假那天，他自己开车去郊区看厂房。", "副驾上放着两盒没拆封的润喉糖和一把长柄黑伞。", "回来时雨下得正急，他在路边停了两分钟，还是没往你公司门口拐。", "雨刷器在玻璃上划出规律的弧线。"]}, {"title": "老照片", "need": 18, "lines": ["董事会会议室挂着一张老照片，厂门口的合影。", "照片第三排左边第三个人是他父亲。", "他每次开会都坐在能看见照片的位置。", "有一年照片被取下来过，他让人重新挂回去，钉子换了新的。"]}], "steady": [{"need": 3, "title": "暗房计时器", "lines": ["暗房门口挂着一只发条式老计时器，走起来咔嗒响。", "学徒总抱怨这玩意儿不如手机准，他只说手上有数就行。", "红灯亮起的时候，夹子上的相纸慢慢显出一点轮廓。", "他站在水盘前盯着看，连呼吸都放轻了。"]}, {"title": "红灯", "need": 6, "lines": ["暗房的红灯常年亮着，灯泡换了三次。", "他在里面待得比外面久。", "有人问他为什么不装亮一点的灯。", "他说这个颜色看显影正合适。"]}, {"title": "钥匙", "need": 12, "lines": ["柜台抽屉里有一串备用钥匙，五把，标签是手写的。", "他把其中一把放在你手里，说店里没人的时候可以进来坐。", "你问其他四把是谁的。", "他说都不是人的，是柜子的。"]}, {"need": 15, "title": "胶卷编号", "lines": ["柜台最底下的铁盒里按年份排着十几卷没洗的黑白胶卷。", "其中一卷贴着白色的胶布，上面用铅笔写着去年夏天的日期。", "他拿出来对着灯看了一眼，又原样放回铁盒最里面。", "门外风铃响了一声，他抬头迎客。"]}, {"title": "多洗一张", "need": 18, "lines": ["洗照片的时候，他会多洗一张。", "多出来那张放在柜台下面的纸盒里，纸盒满了就换新的。", "有人问那些是给谁的。", "他说还没人来取。"]}], "double": [{"need": 3, "title": "不合脚的鞋", "lines": ["门廊鞋柜最下层摆着一双擦得锃亮的浅口皮鞋。", "尺码比她平时穿的大了半码，后跟贴着透明防磨贴。", "邮差小李催签收时低头看了一眼，问她怎么换了风格。", "她把快递单签好递回去：试穿一下而已。"]}, {"title": "旧表", "need": 6, "lines": ["柜台玻璃下压着一只旧表，表带断了，指针停着。", "有人问卖不卖，她说不卖。", "「那你留着干嘛？」", "她说：留着看时间停着的样子。"]}, {"title": "语气", "need": 12, "lines": ["她学人说话只学半句，剩下的留着。", "「你这句话后面本来还有一句。」你会这么说。", "她就笑，说后面那句还说不好。", "后来她把那句补上了，语气是死的。"]}, {"need": 15, "title": "旧表的走秒", "lines": ["下午三点店里没客人，老旧的座钟走得格外响。", "她把玻璃柜擦完第三遍，对着反光理了理鬓角碎发。", "那个动作以前是学别人的，现在做起来倒像是她自己的习惯。", "窗外雨丝斜斜打在玻璃上，她没拉窗帘。"]}, {"title": "信", "need": 18, "lines": ["信封上的字很轻，像怕写重了就擦不掉。", "邮戳是邻市的，日期差了一天。", "她没有马上拆，先把它放在柜台上，压在那只旧表上面。", "压了三天，信角被表压出一道弧。"]}], "gate": [{"need": 3, "title": "石板上的苔", "lines": ["关口门槛两侧的石缝里长着一圈青苔，踩不死也刮不净。", "挑夫阿福每次过关都要抱怨鞋底打滑。", "他蹲下来用竹片把石板字迹里的泥一点点剔干净。", "「规矩是死物，人自己看着走。」"]}, {"title": "十七条", "need": 6, "lines": ["石板十七条，从上到下刻得很密。", "他念的时候不看石面，眼睛看着来人的鞋。", "有人问第十七条写的什么。", "他说：第十七条，不许问第十七条。"]}, {"title": "关内不下雨", "need": 12, "lines": ["关外常年落雨，关内一滴也没有。", "有孩子问为什么。", "他说门厚三尺。", "孩子又问：那雨去哪了。他抬头看了看门。"]}, {"need": 15, "title": "关内无雨", "lines": ["关外雷声滚过去的时候，关内的灯笼连晃都没晃一下。", "他坐在门房门槛上，手里削着一根刚砍来的干树枝。", "火盆里的炭快灭了，火星在灰里明灭。", "「要过去的人，鞋底都会沾一点那边的泥。」"]}, {"title": "刀", "need": 18, "lines": ["他随身一把刀，从没用来砍过东西。", "刀口磨得很平，刀柄上缠着旧布。", "有人说他不像守门的，像刻字的。", "他把刀收回去，说：也刻。"]}], "doomed": [{"need": 3, "title": "便利贴书签", "lines": ["她把借来的那本印刷体小说从头翻到尾，一共夹了七张便利贴。", "前三张写着人物关系，后四张只画了问号。", "夜班店长看她看得认真，问是不是准备考研。", "她合上书笑了一下：算是复习自己的履历。"]}, {"title": "书", "need": 6, "lines": ["书的纸很薄，翻页会响。", "她把书带在身上，用橡皮筋捆着。", "有人想借，她说不行。", "「为什么？」「怕少一页。」"]}, {"title": "灯塔", "need": 12, "lines": ["灯塔的楼梯有八十九级，她数过。", "数到第七十级就开始喘，还是要上去。", "「上面有什么？」", "她说：能看到第三章在哪儿结束。"]}, {"need": 15, "title": "海堤长椅", "lines": ["下班以后她沿着海堤走了两公里，鞋底沾满细沙。", "长椅油漆剥落得厉害，她挑了块干净的地方坐下。", "远处灯塔转过来一束光，刚好扫过她摊在膝盖上的纸页。", "海风吹得书页哗哗响，她按住最后那一页空白。"]}, {"title": "单子", "need": 18, "lines": ["单子上写了七种被记住的方式，前六种被划掉。", "只留下最后一条，字写得很小：有人记得我笑起来什么样。", "她把单子折成四折，塞进书里当书签。", "夹的位置正好是第三章。"]}], "hostage": [{"need": 3, "title": "半块冷饼", "lines": ["驿馆的早饭总是送得比别的院落晚半个时辰。", "老差役把食盒放在门槛外头，木门吱呀一声合上。", "他走过去端起来，饼已经凉透了，硬得硌牙。", "他坐在阶上慢慢掰成小块，一口一口咽下去。"]}, {"title": "链子", "need": 6, "lines": ["链子是铁的，磨得发亮，脚踝那圈有旧痕。", "他从不要求换新的。", "「换了不还是铁的。」他说。", "说完把裤脚放下来，遮住了。"]}, {"title": "碗", "need": 12, "lines": ["他吃饭前一定等人先尝。", "有一回没人尝，他就一整天没动那碗。", "后来你把碗端起来自己吃了一口。", "他看着你吃完，才动筷子。"]}, {"need": 15, "title": "补过的窗纸", "lines": ["北屋西窗破了个拳头大的洞，夜风往里灌。", "他拿旧公文纸裁成方块，沾着米汤糊了上去。", "纸上还留着几行看不清墨迹的驿站旧文。", "天亮时阳光透过来，窗纸泛着一层微黄。"]}, {"title": "地图", "need": 18, "lines": ["夜里他用炭在地上画地图，画完就擦。", "有一次没擦干净，留下半条河。", "第二天他说是水洒了。", "那半条河一直留到开春才被脚步蹭掉。"]}], "topstudent": [{"need": 3, "title": "草稿纸背面", "lines": ["他的草稿纸从来正反两面都写得密密麻麻，步骤按编号对齐。", "物理课代表来收作业时顺手抽走了一张当垫板。", "他伸手按住纸角抽回来：这张背面有东西。", "你凑过去看了一眼，右下角画着一只歪歪扭扭的雨伞。"]}, {"title": "两寸", "need": 6, "lines": ["他把书往自己那边挪了两寸，空出一条线。", "那条线正好放得下一个人的胳膊肘。", "有人问他要不要换座位。", "他说不用，这样刚好。"]}, {"title": "纸条", "need": 12, "lines": ["晚自习他递纸条，字很小，写在草稿纸背面。", "从来不写多余的字，只有步骤和答案。", "有一次背面多写了一行：这题你上次错在符号。", "那张纸条被夹在书里，压得很平。"]}, {"need": 15, "title": "晚自习停电", "lines": ["周四晚自习第二节突然跳闸，整栋教学楼暗了三秒。", "前排女生小声惊呼，他没动，从笔袋里摸出一只小手电筒扣在桌面。", "光柱照着摊开的物理卷子，刚好也分了一半到你这边。", "「接着做最后一道大题。」他说。"]}, {"title": "操场", "need": 18, "lines": ["高考前一晚，他在操场走了很多圈。", "灯照着跑道，影子一圈一圈叠上去。", "有人问他紧张吗。", "他说不紧张，就是想把圈走完。"]}], "minister": [{"need": 3, "title": "砚台边角", "lines": ["内阁值房的端砚用了十几年，左下角缺了一小块。", "小吏问要不要换一方新的，他把毛笔搁在笔山上。", "「顺手就行，换新的还要磨。」", "窗外檐冰化了一滴水，砸在青砖上啪地一声。"]}, {"title": "旧灯", "need": 6, "lines": ["值房的灯是旧的，灯罩上有一道裂纹。", "他从不换，说这盏灯照得清字。", "有一晚灯芯烧短了，光暗下去。", "他把椅子往前挪了半尺。"]}, {"title": "折子", "need": 12, "lines": ["案上的折子按轻重分三摞，最上面那摞只有一本。", "那本从不批，也不让人碰。", "有人问那是什么。", "他说：还没到时候。"]}, {"need": 15, "title": "雪夜值房", "lines": ["宫门落锁以后，值房里只点着一盏铜座油灯。", "他把几份加急折子按轻重缓急分成两摞，指腹上沾了一点朱砂。", "廊下巡夜的灯笼晃过去，光影从窗纸上掠过。", "他抬眼看了一眼对面空着的座位，又低头批字。"]}, {"title": "披风", "need": 18, "lines": ["披风是旧的，领口磨得起毛。", "他从不披着它见客。", "有一年冬天特别冷，他把它借出去过一次。", "后来披风回来了，领口多缝了一道线。"]}], "senior": [{"need": 3, "title": "楼道声控灯", "lines": ["三楼转角那盏声控灯总不太灵敏，得重重跺一脚才亮。", "门卫大爷说下周报修，说了半个月也没人来。", "每次你提着东西上楼，他总会在二楼楼梯口先咳嗽一声。", "灯光亮起来，正好照亮最后那十级台阶。"]}, {"title": "敲墙", "need": 6, "lines": ["老楼的墙薄，敲三下对面就听得见。", "他敲门问：三下是什么意思。", "你说没什么意思，试试。", "后来他每天敲两下，算是打过招呼。"]}, {"title": "水管", "need": 12, "lines": ["晚上十一点，水管会响一阵，像有人在里面走。", "他提前说过，别怕。", "有一晚响了很久，他把门开了一条缝，问睡了吗。", "你说睡了。他说那就好。"]}, {"need": 15, "title": "阳台花盆", "lines": ["临走前他把阳台那盆绿萝托付给你，说两天浇一次水就行。", "其实土里埋着半片没化完的缓释肥，叶子油亮得很。", "你拍了张照片发过去，他隔了半小时才回：比我养得好。", "屏幕暗下去，阳台外面又开始飘细雨。"]}, {"title": "花", "need": 18, "lines": ["阳台那盆花是他在楼下捡的，蔫着。", "养了两个月，活了。", "他说这花命硬。", "你问他不带走吗。他说明年再说。"]}], "exgf": [{"need": 3, "title": "十年前的歌单", "lines": ["同学聚会包间里点歌台一直循环着十年前的老歌。", "她坐在角落里慢条斯理地剥一颗橘子，全程没碰麦克风。", "侍应生进来添茶时，她抬头说换一壶大麦茶。", "前奏响到副歌那句，她的手指在杯沿上轻轻点了一拍。"]}, {"title": "票根", "need": 6, "lines": ["那张电影票根她留了很多年，字都淡了。", "夹在一本旧书里，书是当年你送的。", "有人问她为什么还留着。", "她说：留着算账用。"]}, {"title": "烟", "need": 12, "lines": ["她其实早戒了。", "那天在路口点了一支，只烧了一半就掐了。", "烟盒塞回包里，包侧袋还有半盒陌生的烟。", "「别人的。」她说，「我帮忙拿着。」"]}, {"need": 15, "title": "退房单", "lines": ["酒店前台打印出退房结账单，她看也没看就签了字。", "拉杆箱轮子滚过大理石地面，在雨天显得有点闷。", "旋转门转到一半时，她回头看了一眼大堂休息区的方向。", "那里空着，只有雨伞架上还插着一把黑伞。"]}, {"title": "两小时", "need": 18, "lines": ["那天下雨，她在你楼下站了两个小时。", "手机调到静音，来电显示亮了七次。", "后来她把那七次都删了。", "只留了一条没发出去的草稿：我到了。"]}], "wan": [{"title": "那本他找的", "need": 0, "lines": ["送货的师傅把新到的书搬进店里，她清点完抽出其中一本放到柜台最里侧，不在上架的那一摞里。", "「这本先留着。上次有个人问过，他可能会来拿。」", "她把书脊朝里搁好，用一本字典挡在前面，拿抹布擦了擦柜面。"]}, {"title": "画扣过去", "need": 0, "lines": ["有人把一本刚到的画册随手翻开放在柜台上压了一杯水，她走过去把水杯拿开，画册合上翻面扣在台面上。", "「别把水搁画上。」", "她把水杯搁到窗台最远处，转身去后屋没回头。"]}, {"title": "书脊朝外", "need": 0, "lines": ["她在书架前停了一下，伸手把第二排歪了的两本书抽出来转九十度，书脊朝外重新插好，跟旁边的齐平。", "「脊朝外才看得见书名。书架不是摆设。」", "她用指腹沿书脊边缘抹了一遍确认没有翘出来的，转身去柜台后面泡茶。"]}, {"title": "青田街那家", "need": 0, "lines": ["她翻书架底层翻出一本封皮发脆的素描本，扉页写着青田街四十七号，日期是五年前。", "「青田街那家画材店，老板姓周，关门前最后一次去，他送了我一整盒马利炭笔。十二支，一支没拆。」", "她把素描本合上插回原位，手指在书脊上停了一下才松开。"]}, {"title": "书不收了", "need": 0, "lines": ["一个拎着编织袋的老人把一摞旧书搬到柜台上说要卖，她翻了几本，大部分是过期的教辅和杂志。", "「这几本品相太差了，没法上架。您拿回去吧，我不收了。」", "老人走后她把留下的一本诗集插进书架最里排，用旁边两本书挡住。"]}, {"title": "那天没有雪", "need": 0, "lines": ["她把一本画册翻到某一页停在柜面上，你随口问这页画的是什么时候的事，她手指压在纸面上没松。", "「……那天没有雪，画的时候手不抖。后来就再没画过那种天。」", "她翻过那页用另一张画压住，拿起旁边的抹布去擦根本不脏的柜台。"]}, {"title": "擦那块玻璃", "need": 0, "lines": ["打烊后她把店面灯调暗，搬了张凳子去擦橱窗内侧那块玻璃，擦到一半发现纸巾用完了。", "「……又忘买。」", "她从口袋里摸出一支秃头铅笔，在玻璃水雾上画了一条鱼的轮廓，看了两秒，用袖子抹掉了。"]}, {"title": "没画完的", "need": 0, "lines": ["你从书架后摸出一张画了一半的速写，正面朝下扣在柜面上。她伸手要翻，你按住纸角。", "「别翻。那张还没画完，画完了我自己给你看。」", "她收回手，坐回窗边的旧沙发，翻开一本没拆塑封的书，不说话了。", "「……行。那我等。」"]}, {"title": "第十二张", "need": 0, "lines": ["画到第十二张的时候，她在背面写了日期，写上天气，然后停住。", "前面十一张的背面都只写天气，没写别的。这一张她多写了一行，写得很小。", "「要是有人看得懂，就看得懂吧。」", "她把画翻过去，正面朝上，晾在窗台上。"]}, {"title": "关灯", "need": 0, "lines": ["打烊以后，书店要留一盏灯。她每天关灯的顺序都一样：先把靠窗的那盏关掉，最后才是柜台。", "今天她关到一半，停在第四盏前面。", "「你先别暗。」", "她对着那盏灯说了一句，然后自己也觉得好笑，把它关了。", "黑下来以后，她在门口站了一会儿，等眼睛适应。"]}, {"title": "第七封", "need": 0, "lines": ["她把七封退稿信按日期排开，铺在柜台上。", "第一封已经被翻得起了毛边。她用食指把折角一一压平。", "「第七封。」", "她数到第七封的时候停住，然后从抽屉里拿出第八张信纸。", "写地址的时候，笔尖抖了一下。"]}], "yao": [{"title": "没在琴房", "need": 0, "lines": ["一个同事路过琴房探头问她今天怎么提前收了排练，她把琴盖合上，手上没停。", "「没事。有个人说路过，我等了他一会儿，没来，就收了。」", "她把谱子塞进包拉上拉链，从兜里掏出手机看了一眼又扣回桌上。"]}, {"title": "琴盖合上", "need": 0, "lines": ["排练时一个学生偷拍了她在弹琴的视频发班群，她没看手机，伸手把琴盖合上声音很响。", "「删了。下课。」", "她拿起谱子夹在腋下走出了琴房，门带上没锁。"]}, {"title": "走东边那条", "need": 0, "lines": ["出校门她拐向东边那条梧桐路而不是直走的大路，梧桐路要多绕五分钟但车少，她走得比平时慢。", "「这边耳朵不疼。大路上喇叭太多了。」", "她从包里掏出一颗薄荷糖剥开含着，脚步没停。"]}, {"title": "金东方琴行", "need": 0, "lines": ["她调弦时从琴盖夹层里掉出一张旧琴行收据，抬头写着金东方琴行，日期是四年前。", "「金东方琴行，南山路拐角那家。第一把琴在那买的，一千二，押了三个月伙食费才凑够。」", "她把收据塞回琴盖夹层，按上盖子坐回琴凳弹了一个和弦。"]}, {"title": "别再吹了", "need": 0, "lines": ["一个男生在琴房走廊里跟她说他上周比赛拿了区里第二名，语气很得意，她靠在门框上听完。", "「第二名。挺好。下次别跟人吹，吹多了手会抖。」", "男生走后她回琴房把门关上，从谱架底下抽出一支红笔在今天的排练备注上画了个勾。"]}, {"title": "第四遍才好", "need": 0, "lines": ["她给琴弦调音调到第三遍还差一个半音，你问她这首是不是弹了很多次才熟的，她笑了笑没接。", "「这首啊，前三年弹了上百遍都不对。后来有一天弹到第四遍突然就……算了，不说了。」", "她拨了一下高音弦听余音，把谱子翻到下一页像是要换一首。"]}, {"title": "琴房练和弦", "need": 0, "lines": ["最后一节课的学生走后，她把琴房门反锁，坐在钢琴前反复弹同一段减七和弦分解。", "「这手怎么就不听话呢。」", "她甩了甩左手手腕，从琴凳上站起来，把谱架上摊开的乐谱合上码齐。"]}, {"title": "挡回去了", "need": 0, "lines": ["她把谱子卷成筒，敲了敲你的肩膀，笑得很大声。你问她最近怎么样，她拿谱子指了指教室后排的钢琴。", "「怎么样？我今天弹了三遍《欢乐颂》，第四节课的小孩鼓掌比你还大声——你别老问这个。」", "「你要真想聊点深刻的，帮我搬琴谱架，比问'最近怎么样'有用多了。」"]}, {"title": "第二声部", "need": 0, "lines": ["她把卡农的谱子摊在琴盖上，第二声部那一行用铅笔描了又擦，纸都起了毛。", "「这一行我写过七遍。每一遍都像在等一个人先开口。」", "她把铅笔递给你，笔杆上有一圈牙印。"]}, {"title": "空琴房", "need": 0, "lines": ["下课以后琴房空着。她没有走，坐在琴凳上，把卡农弹了一遍。", "第二声部弹到一半停了，因为她要等一个不存在的人接下一句。", "「……算了。」", "她把手放回琴键，从第一小节重弹。这一次她弹得很慢，像在教一个不在场的初学者。"]}, {"title": "谱子背面", "need": 0, "lines": ["谱子的背面写满了字，都是她的字。", "「第十一首，写给还没走的人。」后面被划掉了，改成了「写给不走的人」。", "「你倒是挑一个啊。」", "她对着自己写的字说了这句，然后把谱子翻过来，扣在琴盖上。"]}], "wen": [{"title": "第三排靠窗", "need": 0, "lines": ["导播问她今晚直播要保留哪个互动话题，她翻着串场词想了一下，手指停在第三页。", "「就上次那个。第三排靠窗那位发的弹幕，剪进去。」", "她把串场词翻回第一页合上，拿起水杯喝了一口放下。"]}, {"title": "话筒推远", "need": 0, "lines": ["导播在她节目里临时插了一条她不知情的广告口播，她念完最后一句把话筒往桌上推了一截。", "「下次提前说。」", "她摘下耳机搁在话筒旁边，拉开椅子起身出了控室的门。"]}, {"title": "只喝常温", "need": 0, "lines": ["便利店冷柜前她伸手拿了一瓶常温架上的矿泉水，冷柜里的同款她看了一眼没碰。", "「凉的伤嗓子。不碰。」", "她拧开喝了一小口把瓶盖拧紧，从包里摸出耳机塞上一只。"]}, {"title": "老楼那条路", "need": 0, "lines": ["她收拾完控室从抽屉里翻出一串旧门禁卡，背面贴着一张褪色的地址贴纸。", "「最早那年台里在老楼，滨河路一百八十三号，凌晨三点下播走出来整条街一个灯都不亮。」", "她把门禁卡丢进桌上的笔筒里，拉上外套拉链起身关了控室的灯。"]}, {"title": "不用递条子", "need": 0, "lines": ["导播隔着玻璃比了个手势示意有听众打电话进来说想跟她私下聊，她按住耳麦摇了摇头。", "「不接。节目里说的够了，私下没什么好聊的。」", "她把热线按钮切回自动应答，低头翻出下一首歌的串场词在边角处补了两行字。"]}, {"title": "灯不能关", "need": 0, "lines": ["录完节目她在控室收拾东西，你问要不要帮着关灯，她伸手拦了一下又收回去。", "「……灯先别关。我坐一会儿，习惯了。」", "她把耳机挂在架子上调了调角度，拉开抽屉假装找东西。"]}, {"title": "空播控室", "need": 0, "lines": ["凌晨三点十五分节目结束，导播切了播出信号走了，她一个人坐在空了的控室里没动。", "「这屋子安静下来，比话筒里还空。」", "她把耳机挂在话筒架上，从桌上捡起那瓶只剩底的矿泉水拧开喝了一口，又拧上放回原位。"]}, {"title": "先听到她", "need": 0, "lines": ["电台在凌晨一点四十切了片头曲。你坐在她对面，她戴着耳机对着话筒说话，声音跟你白天听到的完全不一样。", "「今天有人问我，如果声音和人对不上，你到底在跟谁说话。我没答，切了首歌。」", "她摘下一侧耳机递给你，话筒还亮着红灯。"]}, {"title": "最后一次通话", "need": 0, "lines": ["节目停播前的最后一夜，热线的灯亮了一次，她接起来，没说话。", "那头也没说话。电流声持续了大约二十秒。", "「我知道是你。」", "她说完就把线挂了，然后在台本上写了一行字，写完撕掉。"]}, {"title": "四十秒", "need": 0, "lines": ["她给你听了一段没剪过的录音：说完了那句晚安之后，还有四十秒。", "四十秒里只有空调声，和一次很轻的吸气。", "「我那时候在想，有没有人在听。」"]}, {"title": "没开麦", "need": 0, "lines": ["录音间的推子全拉到底，麦克风的红灯没亮。她还是说了。", "「三、二、一——现在是凌晨一点。」", "她说完这句，停了很久，才想起来后面没有歌单。", "耳机里只有电流声。她把耳机摘下来，放在桌上，像放下一件很重的东西。"]}, {"title": "三点四十", "need": 0, "lines": ["凌晨三点四十，便利店里没有客人。她把关东煮的锅盖掀开，重新摆了一遍。", "萝卜摆左边，蛋摆右边，丸子在中间排成一排。", "「这样看着像有人来买过。」", "她说完自己笑了，笑完继续擦柜台。"]}], "xiao": [{"title": "站着说话的", "need": 0, "lines": ["中书令来殿中议事，提到城防图修订一事该交给谁，她没抬头，朱笔在折子上点了一下。", "「那个站着说话不跪的，他懂城防。让他来。」", "她搁下笔端起茶盏，没喝，搁回案上。"]}, {"title": "搁笔不批", "need": 0, "lines": ["工部送来的奏疏把城防修缮预算虚报了三成，她看了两行搁下朱笔没批，把奏疏推到案沿。", "「重算。」", "她端起茶盏喝了一口放下，拿起旁边另一份不相干的折子翻开。"]}, {"title": "朱笔搁正", "need": 0, "lines": ["批完折子她拿起案上的朱笔把笔杆转了转，搁在笔架上正中间的位置，笔尖朝外，不偏不倚。", "「笔不正，字就不正。」", "她把案上其余三支笔也归到笔架上按长短排好，起身理了理袖口。"]}, {"title": "西凉那封", "need": 0, "lines": ["她从暗格里取出一封旧信展在案上，信纸边角已经起毛，落款写着西凉都护府。", "「十二岁那年父皇送我去西凉住过八个月。这封信是那时候写的，一共寄出三封，只收到一封回来。」", "她把信折回原来的样子塞进信封，搁进暗格里合上盖板。"]}, {"title": "跪着听完", "need": 0, "lines": ["一个小吏跪在殿外禀报西南粮道又出了纰漏，话没说完就抖得结巴，她从案后看了一眼。", "「说完了再起来。说清楚哪一段、谁的差，别说废话。」", "小吏说完她拿起朱笔在折子上画了一道杠搁到案沿，那小吏伸手接了磕头退出去。"]}, {"title": "那条路没人", "need": 0, "lines": ["你陪她在殿前看城防图，指到北段那条标注了加强巡逻的路，她忽然不说话了。", "「那条路……上次走的人，就没回来过。这事先搁着。」", "她把城防图卷起来塞进暗格，拿起旁边一份不相干的奏疏翻开。"]}, {"title": "独坐偏殿", "need": 0, "lines": ["散了朝所有内侍退到殿外候着，她一个人坐在偏殿案前，面前摊着一张还没批的城防图。", "「这条线，到底该不该动。」", "她拿起朱笔在城防图北段画了个圈，搁笔，把图卷起来塞进暗格里。"]}, {"title": "平身说话", "need": 0, "lines": ["她批完最后一道折子搁笔，没叫你起。你站了半盏茶，她才抬眼看你，把刚批的公文推到桌沿。", "「这篇是你写的？站着说，哪里该改、哪里你不服，一个一个讲。」", "「别跪着回话，跪着说不出真心话。」"]}, {"title": "字迹", "need": 0, "lines": ["她把《河渠志》摊开，指给你看批注：同一页上，两种字迹，一种是你抄的，一种是她改的。", "「你抄的这一段，把『溺』写成了『没』。」", "她说完自己先笑了，笑得很轻，像怕被外面听见。"]}, {"title": "折子", "need": 0, "lines": ["夜里，书房只剩她一个人。半尺高的折子摊在案上，一封也没批。", "朱笔插在笔山里，笔尖早就干了。她伸手试了试，又收回去。", "「这些人，写这么长做什么。」", "她把最上面一封折子合上，压平，再合上下面一封。一叠折子被码得很齐。"]}, {"title": "火", "need": 0, "lines": ["她一个人走到东边的偏殿。十岁那年，这扇门是从外面锁上的。", "现在门是开的，里面住着两个扫洒的小太监，睡得很沉。", "「……睡吧。」", "她在门口站了很久，然后把门轻轻带上，没有锁。"]}], "lu": [{"title": "那人答得出", "need": 0, "lines": ["同僚问她手上这桩走私案要不要请外援帮忙查勘现场，她把卷宗翻到某一页停住。", "「不用。上次那个来过一趟，他答得出路引上的问题。」", "她合上卷宗锁进柜子，把钥匙挂回腰间没多解释。"]}, {"title": "卷宗合上", "need": 0, "lines": ["同僚当着她的面把一桩她查了两月的案子直接报到上峰领了功，她听完没接话，把桌上摊开的卷宗合上。", "「行。」", "她把卷宗锁进柜子收了钥匙，起身倒了一杯凉茶没喝。"]}, {"title": "左手执笔", "need": 0, "lines": ["写案卷时她习惯用左手执笔，同僚问过一次，她没解释，只是换右手写了两个字又换回来。", "「左手写的没人认得出是谁的笔迹。」", "她蘸了墨把最后一行誊完，搁笔吹了吹墨迹合上卷宗。"]}, {"title": "渡口收卷人", "need": 0, "lines": ["她从官帽内侧取下一根旧簪子搁在桌上，簪头磨得发亮，是竹制的不是银的。", "「十八岁那年从洪州渡口上的船，身上只带了三十文盘缠和一个竹簪。收卷的人问我姓什么，我说姓陆。」", "她把簪子重新别回头发里，拉正官帽起身把案上的文书码齐。"]}, {"title": "验过了", "need": 0, "lines": ["仵作把验尸格目递上来，指着一处淤痕问她要不要加注，她接过去看了一眼。", "「验过了。这痕是死后压的，不是伤。照实写，别加。」", "她把格目还给仵作，拉了拉官袖袖口，转身往签押房走。"]}, {"title": "袖口那道痕", "need": 0, "lines": ["她挽袖洗手时你瞥见她小臂内侧有一道旧痕，多看了一眼，她把袖子放下来速度很快。", "「……旧伤。查案子时候留的，不碍事。你别提。」", "她拉正官袖把袖口拢紧，拿起桌上的笔在一份空白文书上写了两个字又划掉。"]}, {"title": "换装那刻", "need": 0, "lines": ["值夜结束后她回到值房闩上门，松了官帽束带，对着铜镜把白天束紧的头发散下来。", "「明天还得再勒一天。」", "她从袖中掏出一面小镜塞进柜子底层，把明日要用的案卷摞到桌面最顺手的位置。"]}, {"title": "灯", "need": 0, "lines": ["值夜那晚，刑部的灯只亮了两盏。她把她那盏挪到你们两张案中间。", "「这样省油。」", "后来你发现，她的案离灯比你的案远。再后来你发现，那盏灯的灯芯是新的——她换过，因为你说过这灯太暗。"]}, {"title": "算稿", "need": 0, "lines": ["散衙以后，她从怀里摸出一册旧算稿，纸边已经磨得发白。", "那是她父亲的字，一笔一划都很慢，像怕写错。她用手指描了一遍。", "「我没给你丢人。」", "说完她把算稿收回去，压在心口的位置，压了一会儿。"]}, {"title": "官帽", "need": 0, "lines": ["上奏前一夜，她一个人坐在案前，官帽摆在对面。", "那是顶六品的旧帽子，帽翅有点歪，她自己缝过。", "「戴了三年，还不知道该不该还回去。」", "她把帽子拿起来，戴好，对着灯坐了很久，没有摘。"]}], "shen": [{"title": "那笔记着呢", "need": 0, "lines": ["布铺的伙计问上个月那笔垫付的货款要不要催，她翻开账册指了其中一行。", "「不催。那笔我记着呢。到时候他自己会来对账。」", "她把账册翻到下一页接着拨算盘，手指在那行底下多划了一道。"]}, {"title": "算盘停了", "need": 0, "lines": ["一个供货商送来的布比样品短了半尺还按原价收钱，她拨算盘的手停了，珠子搁在档上没归零。", "「退回去。」", "她把那匹布从柜台上拎起来搁回供货商脚边，坐回去翻开了账簿。"]}, {"title": "算盘放左", "need": 0, "lines": ["每天开铺她做的第一件事是把算盘从柜台右边挪到左边，账簿放在算盘右手边，铜板匣子在最远端。", "「左手拨珠子顺，右手翻页，不用换手。不顺手的改到顺手。」", "她把算盘珠子归零拨齐，翻开账簿第一页开始核昨天的流水。"]}, {"title": "半匹素绢", "need": 0, "lines": ["她从柜台底下翻出一块叠得整齐的素绢，绢面绣着半个没完成的花样，针脚断了。", "「这是十四岁那年绣的。在沈家后院西厢房，绣到一半被人叫走，后来再没补完。素绢半匹，绣了两天。」", "她把素绢重新叠好塞回柜台底层，拿起算盘拨了两下今天最后一笔账。"]}, {"title": "不抹零", "need": 0, "lines": ["一个买布的妇人挑了三匹绸，结账时说零头抹了算整数，她拨了两下算盘抬起头。", "「零头七文。七文也是钱。不抹。」", "妇人掏出铜板数够搁在柜台上，她一枚一枚拨进钱匣，在账簿上记了数目。"]}, {"title": "不是我的", "need": 0, "lines": ["她翻铺子的流水账翻到某一页停住了，你问是不是哪笔有问题，她没抬头。", "「这本账不是我的。是……别人留下的。我一直替他记着。」", "她合上账簿塞进柜台最底层，拿了一本新的翻开从头开始写第一行。"]}, {"title": "盘今天的账", "need": 0, "lines": ["布铺打烊后伙计走了，她坐在柜台后面拨算盘，把今天的流水和赊账逐条核对。", "「这笔赊的忘了记日期。」", "她拿起笔在赊账簿那一行旁边补了个日子，把算盘推到一旁，起身去关门板。"]}, {"title": "记在册上", "need": 0, "lines": ["她把账册翻开，用指甲在某一行底下划了道印子，册子转向你。你看见那行写着你的名字和一笔数目。", "「这是你垫的。我记了。年底结清。」", "「多一个铜板我不要，少一个铜板你别想。」"]}, {"title": "盘货", "need": 0, "lines": ["月底盘货那晚，她把所有布卷都搬到案上，一卷一卷点数。", "点到一匹青布时，她停下来，用指甲刮了刮布边。", "「这匹潮了。」", "她把那匹抽出来，放到自己脚边，继续点下一卷。", "你数到最后一卷，她已经把脚边堆了一小摞。"]}, {"title": "最后一页", "need": 0, "lines": ["账本的最后一页是空的。她翻到那儿，停了一下。", "前面每一页都写满了：米、布、银，连两匹绢的颜色都注了。只有这最后一页，什么都没写。", "「我娘说，账要留一页空的。」", "「留给还没发生的事。」", "她把笔搁在那一页上，没有写。"]}], "jian": [{"title": "旁边那个座", "need": 0, "lines": ["班主任调座位时问她对调到第一排有什么意见，她把书包甩到新桌上没抬头。", "「没意见。旁边那个座空着也行，反正他不常来。」", "她拉开椅子坐下把错题本翻开放在桌上，往旁边空座位的桌角看了一眼。"]}, {"title": "笔袋拉上", "need": 0, "lines": ["有人趁她不在翻了她桌上的错题本还拿走了夹在里面的志愿草表，她回来发现本子摊着，拉链拉开着。", "「谁翻的。」", "她把错题本塞进书包最底层拉上拉链，把笔袋也收了塞进去。"]}, {"title": "蓝笔不黑笔", "need": 0, "lines": ["她从笔袋里倒出五支笔，把三支黑色的推到一边，留两支蓝色的在桌面上，黑色那三支塞回笔袋底层。", "「蓝笔写卷子老师看得清。黑笔写错了老师也看不清改没改。」", "她拧开一支蓝笔在草稿纸角上画了两道试出水，把另一支备用蓝笔搁在笔袋口。"]}, {"title": "小卖部那条", "need": 0, "lines": ["她从笔袋底部摸出一张旧照片翻过来，背面写着光明路小学六年三班，日期是六年前。", "「小学门口那条光明路有个小卖部，辣条一毛钱一根，我那时候一天买两根，攒了一个月请人吃了根冰棍。」", "她把照片塞回笔袋底部，拉上拉链把错题本翻到新的一页。"]}, {"title": "借什么橡皮", "need": 0, "lines": ["前排一个女生回头说想借她的橡皮，她手捂着错题本看了一眼那女生的桌面。", "「桌上不是还有一块？比这块还新。不借。」", "那女生转回去了，她把橡皮塞进笔袋拉上拉链，低头接着算第三道大题。"]}, {"title": "填了才算", "need": 0, "lines": ["她趴在桌上填志愿表填到第二栏停了笔，你问她卡什么了，她拿笔帽敲了两下桌面。", "「……填了的才算数。没填的那个不算，对吧。」", "她把志愿表折了两折塞进书包夹层，从抽屉里翻出一套数学卷子铺在桌上。"]}, {"title": "一个人刷题", "need": 0, "lines": ["晚自习后教室空了，她把课桌上的练习册摞成一摞挡住脸，从底下抽出一套数学卷子。", "「最后这道大题怎么又是对的，答案印错了吧。」", "她翻到答案页看了两遍，把卷子折成四折塞进书包夹层，趴在桌上闭了眼。"]}, {"title": "错题本还我", "need": 0, "lines": ["她一把抽走你桌上的错题本，翻了两页，嗤了一声，扔回你怀里。你桌上摊着志愿表，她瞥了一眼又移开。", "「你这错题本比我脸皮还厚，第三道你抄了三遍还能抄错，你是故意的吧？」", "「……志愿表别给我看，看了我也不会帮你填。」"]}, {"title": "值日表", "need": 0, "lines": ["值日表贴在门后，每周换一次。你发现自己和她被排在同一组，连续三周。", "「不是我改的。」", "她说这话时没抬头，笔尖在纸上顿了一下。"]}, {"title": "薄荷糖", "need": 0, "lines": ["她的笔袋里有一小罐薄荷糖，铁盒，盖子磨花了。", "午休时她会推一颗到你桌上，从来不多说。", "你后来数过：一罐三十颗，她给你二十三颗，自己留七颗。", "「数什么数。给你就吃。」"]}, {"title": "最后一页", "need": 0, "lines": ["错题本最后一页，她写过一行字又划掉，划得很用力，纸都破了。", "你凑近看，只认得出一个「你」字，后面全被墨水盖住了。", "她把本子合上，塞进抽屉最里面。", "「别看。看什么看。」"]}], "qing": [{"title": "那人懂结构", "need": 0, "lines": ["项目组的年轻设计师问她外立面那个悬挑方案要不要换人重做，她把比例尺搁在图纸上。", "「不换。原来那版是那位画的，他懂结构。照底图改就行。」", "她从抽屉里翻出那份原始底图摊在桌上，手压住边角没松。"]}, {"title": "图纸扣下", "need": 0, "lines": ["甲方在她不知情的情况下把方案效果图发给了竞品公司征求意见，她看到截图后把桌上的图纸翻面扣下。", "「这条线到此为止。」", "她从抽屉里拿出那份原始底图塞进文件袋，拉上拉链放进了保险柜。"]}, {"title": "窗不开半扇", "need": 0, "lines": ["进事务所她先去把会议室的窗户推开整扇而不是只开半扇，半扇开的窗在她看来不通风还漏风。", "「要开就开整扇。半扇的窗跟没开一样，还穿堂。」", "她把窗栓插好确认固定住了，转身拉开椅子上搭着的外套搭在椅背上。"]}, {"title": "工地那把伞", "need": 0, "lines": ["她从工位抽屉角落里翻出一把折叠伞，伞柄上贴着褪色的工地编号标签。", "「五年前第一个项目在江北工地，六月暴雨，编号C4的脚手架塌了一排，我拿这把伞在雨里站了四个钟头等结构报告。」", "她把伞塞回抽屉角落关上抽屉，从桌上拿起那份新方案的图纸摊平。"]}, {"title": "重画三次", "need": 0, "lines": ["一个年轻设计师把改完的平面图铺在她桌上，她拿比例尺量了两处距离，放下尺子。", "「这条走廊净宽差了四十毫米。拿回去改，这是第三次了。」", "设计师把图卷走了，她拉开抽屉拿出一支红笔在自己那份底图上标了三个圈。"]}, {"title": "给谁的位", "need": 0, "lines": ["事务所里有一张工位一直空着，桌上摆着一座旧模型没收，你问那位置怎么不安排人，她没看你。", "「那张工位……我留着的。本来有人坐。后来没了。」", "她拿起桌上一份新方案摊开铺满自己面前的桌面，把视线压到图纸上。"]}, {"title": "模型没装好", "need": 0, "lines": ["事务所所有人都走了，她一个人在工位上拼那个被甲方毙掉的方案实体模型。", "「这块的角度不对，明天得重切。」", "她把没粘牢的体块从底座上掰下来搁在旁边，用美工刀把多余的卡纸边刮平。"]}, {"title": "加建的阳台", "need": 0, "lines": ["图纸的角落里有个没用上的方案：把事务所的阳台封起来，做成一个能坐人的小间。", "「这个我报了三次，都被否了。」", "批注栏里有她自己的字：留着，以后再提。"]}, {"title": "红笔", "need": 0, "lines": ["她的红笔只用一种牌子，笔帽被咬过，缺了一小块。", "改图的时候她从不解释，只在旁边打一个叉。", "「你自己看。看到第三遍就懂了。」"]}, {"title": "模型", "need": 0, "lines": ["旧模型缺了一个角，是被摔的。她用胶水粘过，粘得很丑。", "底部还留着六年前的标签，两个人的名字挤在一行，中间用斜杠分开。", "「从垃圾站抱回来那天，下了雨。」"]}], "umbrella": [{"need": 3, "title": "铜丝盒", "lines": ["工作台最左边摆着一只掉漆的月饼铁盒，里面分格装着粗细不同的铜丝。", "他说现在工厂都用机器压铆钉，嫌铜丝穿起来费工夫。", "「机器压的铆钉一崩就断，铜丝还能再绕两圈。」", "他低头用尖嘴钳绞紧最后一圈，接口平得摸不出毛刺。"]}, {"need": 6, "title": "不卖的竹伞", "lines": ["门框旁边挂着一把油纸早已发黄的竹骨伞，客人问过三次价，他都摆手。", "老吴说那是他师父当年留下的手艺，现在整条街没人会劈这种竹骨了。", "雨大时伞面偶尔会滴水，他就在下面垫一只缺了口的粗瓷碗。", "水滴进碗里叮咚一声，成了铺子里最准的报时器。"]}, {"need": 9, "title": "热茶杯", "lines": ["铺子里一共只有三只陶瓷杯，两只有盖，一只裂了条茶渍纹。", "前两次你来避雨，他都把有盖的那只擦干净递给你。", "你自己留心过一回，发现他自己喝的那只其实烫手得很。", "那天他顺手把旧报纸折成杯垫，垫在了你的杯底下面。"]}, {"need": 12, "title": "停电夜", "lines": ["夏末台风擦过老城，半条街跳闸停电。", "挂满墙的旧伞在蜡烛光里投下巨大的影子，像一排收拢翅膀的大鸟。", "他找出一把备用手电筒照着窗户缝，手稳稳地按住胶带边缘。", "「风从西边来，把这半扇封死，夜里就不会灌水。」"]}, {"need": 18, "title": "钢骨编号", "lines": ["实心钢骨比原来的铝骨沉了半两，撑开时咔嗒一声格外脆。", "他在伞柄内侧刻编号的时候没有用尺子，全凭手感。", "刻完后他拿砂纸把边缘磨圆，免得刮手。", "「这把能用十年。」他说完把伞合上，递到你手里。"]}], "snowmelt": [{"need": 3, "title": "旧钢笔", "lines": ["梁砚辞白大褂左胸口袋里一直别着一支磨掉漆的深蓝钢笔。", "规培护士问他怎么不换支顺手的中性笔，他低头写完医嘱只说习惯了。", "笔帽内侧刻着一个极小的日期，是三年前你在急诊楼外送他上夜班那天。", "每回开处方前，他都会习惯性用拇指在笔帽上摩挲一下。"]}, {"need": 6, "title": "蜂蜜水温度", "lines": ["急诊室饮水机只有滚水和冰水两档，他却总能兑出刚好入口的温度。", "周朗笑他给自己泡胃药都没这么讲究。", "他说发烧的人喝太烫会呛，喝太凉胃不舒服。", "说完把一次性纸杯外又套了一只空杯，防着烫手。"]}, {"need": 9, "title": "停在副驾的羽绒服", "lines": ["那件厚黑羽绒服他其实很少穿，常年整齐叠在车子后座。", "清城十一月刚降温那天，他顺手把它放到了副驾驶椅背上。", "你从高原飞回来那天穿着单薄冲锋衣冲进诊室，他几乎没犹豫就拿起来罩在了你身上。", "衣领里还带着一点干净的雪松洗衣液味道。"]}, {"need": 12, "title": "胃药盒", "lines": ["他值班室抽屉最里层摆着三盒铝箔板胃药，每盒边上都用黑笔标着开封日期。", "你替他整理值班包时才发现，有一盒快过期了还剩大半板。", "你皱眉念叨他只管病人不管自己，他老实接过你递来的温水仰头咽下一片。", "「以后每天下班发照片给你检查，行不行。」"]}, {"need": 15, "title": "炒栗子", "lines": ["立春那场小雪后，他休假第一件事是绕了半个城去买老巷口的糖炒栗子。", "排了四十分钟队，他把纸袋揣在羽绒服内侧一路捂着回来。", "剥好第一颗递到你嘴边时，他指尖沾了一点焦糖黑灰。", "「还热着，吃吧。」"]}], "lantern": [{"need": 3, "title": "素白河灯", "lines": ["京城七夕流灯多用红粉彩纸，唯独谢清晏折的灯一律用素白宣纸。", "阿栀问她怎不添两笔金粉，看着喜庆些。", "她用竹篾压紧灯骨，淡声说花哨的灯最容易被暗流打湿沉底。", "「素一点，反而漂得远，也容易被该看见的人认出来。」"]}, {"need": 6, "title": "暖手铜炉", "lines": ["礼部值房临水，一入秋便湿冷刺骨，谢清晏案头常备两只小巧铜炉。", "一只留给自己暖手抄卷，另一只总让阿栀用银炭煨着。", "你每次从漕渠查账回来推门而入，案角恰好摆着那只温度正好的铜炉。", "她头也不抬地翻着册子：「顺手多煨了一只，别冻僵了字。」"]}, {"need": 9, "title": "素帕缠腕", "lines": ["那晚芦苇荡里她手腕被箭羽擦出一道浅口，回去后自己草草上了药。", "你递过去的那方素色棉帕，她洗净晒干后叠得方方正正收进了妆匣底层。", "阿栀翻找发钗时撞见，打趣说姑娘平日最挑缎面，怎留着块粗布帕子。", "谢清晏把妆匣轻轻合上，眼尾染了点浅淡笑意：「好用，留着应急。」"]}, {"need": 12, "title": "爬墙送橘", "lines": ["闭门思过那半月，院门前总有御史台的眼线晃悠。", "你干脆绕到后巷踩着老槐树翻进矮墙，怀里揣着一篮霜打过的黄橘。", "谢清晏靠在窗边看你拍掉袍角树叶，递过去一盏热茶。", "「堂堂司直大人，这翻墙的身手倒是比翻卷宗还利落。」"]}, {"need": 15, "title": "江南茶笺", "lines": ["风波平息后，她整理旧案抄录时顺手留了一沓干净的宣纸边角。", "闲下来便在上面记几句当日茶味、雨势，或是一句没当面说出口的玩笑。", "等你下值过来吃茶，她就把那一小叠纸推到茶盘边。", "「今日无事可报，只记一句，城南桂花开了。」"]}], "summer": [{"need": 3, "title": "黑巧包装纸", "lines": ["陆星沉每次丢进你桌洞的黑巧都是 72% 可可含量的同一款。", "你随口说过太甜的吃了犯困，他嘴上哼了一声说你真挑剔，往后却再没买错。", "他自己其实不爱吃苦巧克力，每次都把剩下的顺手塞给你。", "「买一送一不吃白不吃，快吃，别等会儿画图低血糖。」"]}, {"need": 6, "title": "模型板边角", "lines": ["通宵做模型那晚，你裁歪了三块椴木板，气得把尺子往桌上一拍。", "他嘴上嘲笑你手抖得像在画心电图，转头却把裁好的齐整木条一块块排在你手边。", "等你抬头道谢时，他正低头吹掉你图板上的木屑，睫毛在台灯下投出很长的影。", "「别发呆了，胶水快干了。」"]}, {"need": 9, "title": "速写本里的睡颜", "lines": ["那张夹在速写本末页的铅笔画，落款日期是去年十一月一个下大雨的周三。", "那天你在图书馆三楼靠窗的位子趴着睡着了，手边压着半张没画完的透视图。", "他在斜对面坐了两节课，用 2B 铅笔极轻地勾完轮廓，连你袖口沾的一点碳粉都没漏掉。", "画纸右下角写着极小一行字：睡醒别忘了带伞。"]}, {"need": 12, "title": "老街糖画", "lines": ["大二那年秋末他带你去老街巷口买糖画，摊主老伯问要画龙还是画凤。", "他盯着转盘想了两秒，说要一只拿着尺子的小猫，把老伯都逗笑了。", "递给你的时候糖浆还带着温热的甜香，他趁你低头咬糖角，悄悄把你的手指扣进了掌心。", "「走路看前面，摔了我不扶。」"]}, {"need": 15, "title": "画室小铜铃", "lines": ["古镇测绘那回你在老铺子里挑了两只巴掌大的小铜铃，随手给了他一只。", "他嫌叮当作响太吵，嘴上说才不挂，第二天却系在了画筒拉链上。", "往后每次建筑楼楼梯间传来清脆一声铃响，你不用回头就知道是他拎着热豆浆上来了。", "「刚路过食堂顺手带的，趁热喝。」"]}], "gambit": [{"need": 3, "title": "雨前气压", "lines": ["工作室窗台上摆着一支老式水银气压计。", "每次落雨前四十分钟，水银柱刚往下跌，陆寻就会起身把靠南的百叶窗拉严，顺手在电磁炉上坐一壶水。", "你问他怎么比天气预报还准，他低头洗着茶杯，淡淡说了一句：“缝过十一针的骨头比气压计灵敏，它一发酸，十分钟内准下雨。”"]}, {"need": 8, "title": "第二根保险丝", "lines": ["在地下档案库换下来的那枚烧黑保险丝，后来被他用透明环氧树脂封成了一块正方体镇纸，压在书桌右上角。", "老程笑他什么破烂都收，他用指腹擦了擦树脂切面，面不改色地回嘴：“全城唯一一块在零点四秒内没让我俩留在地底下的铜片，摆着不亏。”"]}, {"need": 12, "title": "薄荷糖配方", "lines": ["他抽屉里常备的铁盒薄荷糖极呛人，一点甜味也没有。", "有回你熬夜核数据含了一颗，才发现铁盒底垫着半张便签，上面是他规整的小字：“专注力散神超过三秒，推演容错率降 14%。”旁边还有一行被铅笔涂淡的小字：“她今天打了三个哈欠，下次换甜一点的。”"]}, {"need": 16, "title": "黑色护腕的秘密", "lines": ["洗手池边，他第一次没在你走近时把右腕藏进袖口。", "那道旧疤又深又长，横在腕骨内侧。", "你指尖轻轻碰了一下，他小臂肌肉瞬间绷紧，又很快松下来。", "他声音低沉：“当年被钢筋划穿，医生说以后拿筷子都费劲。", "我练了两年握力器，现在拧生锈的机械锁，比谁都快。”"]}, {"need": 20, "title": "不外借的伞", "lines": ["玄关伞架上插着七八把透明塑料伞，专供来访委托人应急。", "唯独墙钉上挂着的那把深蓝双人长柄伞，换了碳纤维伞骨，木柄刻着细密的防滑纹。", "老程有次遇大雨想借，陆寻快步从里屋出来，直接塞了张五十块过去：“门口便利店买两把，这把不借。”老程纳闷问为什么，他侧头看了一眼在沙发上打盹的你：“伞骨沉，她自己撑不动。”"]}], "mask": [{"need": 3, "title": "朱砂的份量", "lines": ["调色室架子上摆着一杆纯铜小药秤。", "每次配矿彩，裴砚之手腕一抖就是稳稳的三分二厘。", "你问他怎么练出来的，他用指腹拂去秤盘余粉，淡淡道：“五岁起在暗室磨朱砂，少一钱发暗，多一钱伤生丝。", "人跟人处也是这分量，过近则浊，过远则淡。”"]}, {"need": 8, "title": "千层底布鞋", "lines": ["他常年穿黑布千层底，踩在老木地板上听不见脚步声。", "有晚你加班写勘察报告，低头发现脚边多了一双崭新的提花棉拖鞋，鞋底特意包了厚毡布。", "六叔路过笑道：“砚之拿做戏靴余下的云头毡连夜给你纳的，嫌老木板返潮冻脚。”"]}, {"need": 12, "title": "不唱的那出戏", "lines": ["六叔的胡琴谱里收着一出《白蛇传·断桥》，裴砚之从不让人在萃华楼排演。", "有回新来的学徒随口问起，被他冷着脸罚去抄了三天曲牌。", "后来你翻看他的旧戏目手记，在页角看见一行朱砂小字：“桥未断，人未散，何须唱断桥。”"]}, {"need": 16, "title": "火场里的红绳", "lines": ["他贴身系着一根褪色的旧红绳，绳结里裹着一颗微微变形的小银珠。", "那是五年前从火场把你抱出来时，从红斗篷盘扣上刮落的一颗纽扣。", "好些个雷雨夜他从梦魇里惊醒，指尖摩挲着那颗微凉银珠，才确认自己当年真的把人带出了火海。"]}, {"need": 20, "title": "桐油纸伞上的画", "lines": ["那柄修补过的桐油纸伞外表陈旧，雨天迎着光撑开，伞面内侧却用极淡的矿彩细细勾了一幅《雨后老街晴光图》，画角站着一个撑伞远眺的姑娘。", "六叔说这幅画他画了整整三年，每落一场雨添两笔，画收笔那年，人也就真回来了。"]}], "compass": [{"need": 3, "title": "烟袋锅的规矩", "lines": ["韩烈随身带着旱烟，但在狭窄的道班房里硬是憋了三天一口没抽。", "老宋笑他什么时候改了性子，他蹲在屋外风口拿柴刀削木楔，闷声回了一句：“屋里地方小，烟味呛姑娘，我站外面抽还能憋死？”"]}, {"need": 8, "title": "七叶一枝花", "lines": ["山里蚊虫毒，你脚踝被咬得红肿。", "第二天醒来，床头摆着一只小瓷瓶，里头是他托老宋采的野生七叶一枝花捣成的药膏，泛着淡淡草木苦香。", "瓶盖贴着一小截医用白胶布，上面是他粗重的字：“抹肿处。”"]}, {"need": 12, "title": "钢板的温度", "lines": ["雷雨夜岩洞湿冷，你睡梦中下意识往热源缩。", "他身子僵了半晌，小心把没受伤的右肩迎向洞口风向，拿温热的脊背挡在你外侧。", "半梦半醒间你摸到他锁骨下方一道硬邦邦的凸起，他在暗处放轻声音：“别摸，里头压着块钢板，凉，别冰着你手。”"]}, {"need": 16, "title": "不吃羊肉的真相", "lines": ["县城小馆子里，老板端上一大碗热腾腾的羊肉汤，韩烈把软烂的肉全拨进你碗里，自己就着辣子啃干锅盔。", "你问他怎么不吃，老宋在旁揭了他的底：“这小子当年在可可西里断粮四天，把最后半条风干羊肉全留给实习生，自己饿出胃病，闻着膻味就反胃，怕你不够吃才硬点的这碗！”"]}, {"need": 20, "title": "柴火堆上的正字", "lines": ["保护站后院码着三面墙的松木劈柴。", "有天你绕去拿柴，发现最靠里的几根木桩截面上，用炭笔歪歪扭扭画着一排“正”字。", "你正数着天数，韩烈拎着斧头走过来，耳根瞬间红透，一把把那几根木桩翻了个面，粗声粗气道：“数着玩呢，看今年过冬的柴够不够烧。”后来小梁偷偷告诉你，那正字是从你提交调驻申请那天开始画的。"]}], "gallery": [{"need": 3, "title": "记账本的最后一页", "lines": ["姜绯办公桌抽屉里有一本黑色皮面小账本，专门记谁帮过她、她怎么还清。", "前几十页密密麻麻全画着红钩。", "只有最后一页写着你的名字，下面列着“顺路取胶带、送回小区、查画框底单”三条，后面既没标金额，也没画钩。"]}, {"need": 8, "title": "常温乌龙茶", "lines": ["画廊小冰箱里常年只放黑咖啡和苏打水，周伯安来都得自己带茶叶。", "直到你第三次来核保单，才发现最上层多了几瓶常温无糖乌龙茶。", "助理小声说，是姜主理人特意交代采购的，因为记得你说过看画前喝冰的胃会不舒服。"]}, {"need": 12, "title": "那枚素银戒", "lines": ["某晚加完班，她把左手那枚素银戒摘下来放在台灯下擦。", "你凑过去看，才看清内侧那串门牌号旁边，不知什么时候多了一道极浅的新划痕。", "她低头淡淡说：“卖掉老画室那天我发誓，以后谁给的东西都按价折现。", "现在想想，好像已经破戒了。”"]}, {"need": 16, "title": "撤掉的转账草稿", "lines": ["你在她电脑上导出展品清单时，不小心点开了微信窗口——聊天草稿栏里还留着半行没发出去的字：“昨晚你那件开衫干洗费四十，还是我请你吃顿饭抵掉？”后面删删改改，最后只给你发了个“早安”。"]}, {"need": 20, "title": "001 号展签", "lines": ["「白匣」每次开展都会留一张未公开发售的 001 号纪念门票。", "你帮她收拾书房时，在画册夹层里翻出了过去三场展的 001 号票，每一张背面都用极细的钢笔字写着当晚的天气和你穿的外套颜色。", "她推门撞见，耳尖瞬间发红，伸手把画册合上压在掌下：“策展归档资料，不准偷看。”"]}], "silk": [{"need": 3, "title": "软尺的刻度", "lines": ["工作室墙上挂着七八条软尺，唯有她挂在颈间的那条浅米色软尺，在四十四厘米的位置用极细的红线缝了个小记号。", "陈姨有回问起，她低头继续画粉线，面不改色：“标准男装肩宽参考位，顺手标的。”其实那是第一回请你试穿样衣时量出来的数字。"]}, {"need": 8, "title": "多留的三米料", "lines": ["湖州织厂发来的那批 30 姆米素绉缎紧俏得很，每一寸都算进了秀场成衣。", "清点库存时你却发现，料架最里层单独用防潮纸卷着三米藏青色料子。", "陈姨笑呵呵递茶过来：“舒窈特意压下来的，说藏青衬你，等忙完大秀给你裁件衬衫。”"]}, {"need": 12, "title": "剪断的旧工牌", "lines": ["她在抽屉最底格收着半张被剪成两截的旧工牌，那是当年离开「锦序」那天亲手剪断的。", "你偶然看见时，她大方地拿出来搁在桌上：“留着提醒自己，往后只给认手艺的人裁衣服，绝不委屈自己。”"]}, {"need": 16, "title": "深夜蟹粉面", "lines": ["弄堂口那家老面馆十一点半收摊。", "有回你俩赶秀场排期忙到十一点二十，她硬是放下剪刀拉着你一路小跑去巷口，赶在老板熄火前抢到最后两碗热腾腾的蟹粉面。", "她把碗里大半勺蟹黄拨进你碗里，理直气壮：“你今天帮我搬了六匹布，按劳分配。”"]}, {"need": 20, "title": "盘扣里的暗结", "lines": ["你穿了一阵那件藏青衬衫，才发现最上面那颗手工琵琶扣的扣芯里，藏着一根极细的金线，不迎着光根本看不见。", "你问她这是什么讲究，她耳尖微热，低头摆弄着衣领：“老辈裁缝说，给重要的人做衣服，扣芯里要压一根金线，走路稳，日子顺。”"]}], "rail": [{"need": 3, "title": "时刻表背后的红笔", "lines": ["青坪站值班室墙上贴着一张旧列车时刻表，平时全是黑笔写的正点时间。", "唯有 7024 次和 7025 次旁边，被人用红铅笔标了两个极小的箭头。", "小周偷偷告诉你，那是程远山记的你每次下乡坐车和回站的时间，生怕哪回晚点让你在风口干等。"]}, {"need": 8, "title": "多削的两块木楔", "lines": ["替你修好招待所木窗那天，他其实一口气刨了六块松木楔子，挑了两块木纹最顺、一点毛刺没有的给你顶窗，剩下四块全留在自己工具箱底。", "马站长笑他修个破窗还讲究木纹，他低头吹掉木屑，闷声回了一句：“万一她晚上手碰着，扎刺疼。”"]}, {"need": 12, "title": "加绒棉手套", "lines": ["你冬至送他的那副加绒棉手套，整个冬天他都没舍得拿去沾机油。", "平时拧螺栓还是戴旧白线手套，只有清晨空手巡道或者骑车出门时才拿出来套上。", "小周想借去戴半小时，被他一把按回兜里：“自己去供销社买，这副码数不对。”"]}, {"need": 16, "title": "冷幽默的来历", "lines": ["有回你问他，平时话那么少，怎么偶尔蹦出一句话能把人逗乐。", "他正蹲在院里修自行车链条，抬头想了想，一脸认真地回答：“平时在铁轨上走一天，除了风就是石子，不自己琢磨两句顺口的话，闷得慌。", "你爱笑，我以后多琢磨两句。”"]}, {"need": 20, "title": "永远留着的硬板票", "lines": ["搬进省城新屋后，你在他书桌玻璃板底下看见两张并排压着的旧硬板火车票——一张是你离开青坪那天坐的 7024 次，另一张是他开春来省城找你那天补的同车次票根。", "两张票根并排放着，始发站都是青坪，终点站写着同一座城。"]}]}, NPCS={"note": "配角（全线启用）：他们不参与恋爱主线，只在对话里偶尔插一句话，负责把世界填满。", "wan": [{"name": "阿棠", "role": "画室同学", "voice": "直球、护短、看破不说破", "trap": "别抢主角的话"}, {"name": "房东阿姨", "role": "街坊", "voice": "唠叨、爱打听、心是热的", "trap": "别变成信息播报器"}], "yao": [{"name": "陈老师", "role": "教研组同事", "voice": "温和、爱操心、总带热茶", "trap": "别把她写成八卦婆"}, {"name": "琴行小弟", "role": "楼下调音学徒", "voice": "说话简短、只聊音准和琴键", "trap": "别硬凑感情戏"}], "wen": [{"name": "导播老李", "role": "夜班搭档", "voice": "哑嗓子、只报倒计时、抽烟", "trap": "别说多余的安慰话"}, {"name": "便利店晚班", "role": "交接店员", "voice": "困倦、爱记账、抱怨冷饮机", "trap": "别推进主线"}], "xiao": [{"name": "内侍陆安", "role": "殿前总管", "voice": "低眉顺眼、只报时辰与奏折", "trap": "别替公主做政治判断"}, {"name": "沈副将", "role": "旧部将领", "voice": "干脆、只谈军报与粮草", "trap": "别抢戏"}], "lu": [{"name": "书吏老冯", "role": "刑部老人", "voice": "慢吞吞、爱核对卷宗编号", "trap": "别主动点破身份秘密"}, {"name": "茶房小厮", "role": "衙门杂役", "voice": "机灵
