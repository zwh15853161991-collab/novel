    else if(r.status===402){ box.style.color='#d98b7a'; box.textContent='余额不足 ❌'; }
    else { box.style.color='#d98b7a'; box.textContent='返回 '+r.status+' ❌'; }
  }catch(e){ box.style.color='#d98b7a'; box.textContent='网络不通：'+e.message; }
}
function clearKey(){ KEY=''; localStorage.removeItem('jieyu.key'); closeSheet(); renderHome(); }

/* ---------- 对话菜单 ---------- */
$('moreBtn').onclick=()=>{
  const box=$('sheetBox');
  box.innerHTML=`<div class="sheettitle"><b>这一局</b><button class="close" onclick="closeSheet()">×</button></div>
   <div class="sgroup">操作</div>
   <div class="opt" onclick="regen()"><div class="lbl">↻ 重新生成</div><span class="tag">换一版</span></div>
   <div class="opt" onclick="undoTurn()"><div class="lbl">↺ 撤回最后一轮</div></div>
   <div class="opt" onclick="newChat()"><div class="lbl">＋ 新建对话（同一人重开）</div></div>
   <div class="sgroup">设置</div>
   <div class="opt" onclick="editStory()"><div class="lbl">剧情选项设置</div><span class="tag">${SET.pace==='fast'?'快':SET.pace==='slow'?'慢':'正常'} · ${SET.tone==='sweet'?'偏甜':SET.tone==='bitter'?'偏苦':'均衡'}</span></div>
   <div class="opt" onclick="openVigs()"><div class="lbl">她的这段日子（番外）</div><span class="tag">${((VIGS||{})[CUR]||[]).filter(v=>(S.turns||[]).length/2>=v.need).length}/${((VIGS||{})[CUR]||[]).length}</span></div>
   <div class="opt" onclick="editMe()"><div class="lbl">我的人设</div><span class="tag">${SET.me.name||'未填'}</span></div>
   <div class="opt" onclick="openSettings()"><div class="lbl">文字模型设置</div></div>`;
  $('sheet').classList.add('on');
};
function undoTurn(){
  if(!S||!S.turns.length) return closeSheet();
  S.turns.splice(-2); S.log=S.log.slice(0,-1); putS(CUR,S); closeSheet(); openChat(CUR);
}
function regen(){
  if(!S||!S.turns.length) return closeSheet();
  const last=S.turns.length>=2?S.turns[S.turns.length-2]:S.turns[0];
  S.turns.splice(-2); S.log=S.log.slice(0,-1); putS(CUR,S);
  closeSheet(); openChat(CUR);
  setTimeout(()=>sendTurn(last),120);
}
function newChat(){ delS(CUR); const r=CUR; S=blank(r); closeSheet(); openChat(r); $('send').disabled=false; $('inp').disabled=false; }
function editStory(){
  const box=$('sheetBox');
  box.innerHTML=`<div class="sheettitle"><b>剧情选项</b><button class="close" onclick="closeSheet()">×</button></div>
   <div class="sgroup">节奏</div>
   <div class="segs" id="paceRow">
     <button data-v="slow">慢（多描写）</button><button data-v="normal">正常</button><button data-v="fast">快（推主线）</button></div>
   <div class="sgroup">基调</div>
   <div class="segs" id="toneRow">
     <button data-v="sweet">偏甜</button><button data-v="balanced">均衡</button><button data-v="bitter">偏苦</button></div>`;
  $('sheet').classList.add('on');
  $('paceRow').querySelectorAll('button').forEach(b=>{ b.classList.toggle('on',SET.pace===b.dataset.v);
    b.onclick=()=>{SET.pace=b.dataset.v; saveSet(); editStory();}; });
  $('toneRow').querySelectorAll('button').forEach(b=>{ b.classList.toggle('on',SET.tone===b.dataset.v);
    b.onclick=()=>{SET.tone=b.dataset.v; saveSet(); editStory();}; });
}
function openVigs(){
  const list=(VIGS||{})[CUR]||[]; const turns=(S.turns||[]).length/2;
  const box=$('sheetBox');
  box.innerHTML='<div class="sheettitle"><b>她的这段日子</b><button class="close" onclick="closeSheet()">×</button></div>'
   + (list.length? list.map(v=>{
       const open=turns>=v.need;
       return '<div class="card" style="margin-top:10px"><div class="nm">'+v.title+' '
         + (open?'':'<span class="tag">再走 '+Math.max(0,Math.ceil(v.need-turns))+' 轮解锁</span>')+'</div>'
         + (open? '<div class="sub" style="margin-top:6px;white-space:pre-wrap">'+v.lines.join('\n')+'</div>' : '')
         + '</div>';
     }).join('') : '<div class="empty">这条线还没有番外</div>');
  $('sheet').classList.add('on');
}
function editMe(){
  const box=$('sheetBox');
  box.innerHTML=`<div class="sheettitle"><b>我的人设</b><button class="close" onclick="closeSheet()">×</button></div>
   <div class="sgroup">她怎么叫你</div>
   <input class="txt" id="meName" placeholder="你的名字（可不填）" value="${SET.me.name||''}">
   <div class="sgroup">称呼 / 身份</div>
   <input class="txt" id="meCall" placeholder="例如：同班同学、店里常客" value="${SET.me.call||''}">
   <div class="sgroup">性格（可留空）</div>
   <input class="txt" id="meTraits" placeholder="例如：话少、心软、爱拆台" value="${SET.me.traits||''}">
   <button class="btn" onclick="saveMe()">保存</button>`;
  $('sheet').classList.add('on');
}
function saveMe(){ SET.me={name:($('meName').value||'').trim(), call:($('meCall').value||'').trim(), traits:($('meTraits').value||'').trim()};
  saveSet(); closeSheet(); }

/* ---------- 记忆面板 ---------- */
$('memBtn').onclick=()=>{
  if(!S) return;
  const box=$('sheetBox');
  box.innerHTML='<div class="sheettitle"><b>这一局</b><button class="close" onclick="closeSheet()">×</button></div>'
   +'<div class="sgroup">状态</div><div class="card" style="margin-top:0">好感 '+S.aff+' · 信任 '+S.trust+' · 阶段 '+S.stage
   +'<div class="sub">'+(S.chapter||'')+'</div></div>'
   +'<div class="sgroup">本局大纲</div><div class="card" style="margin-top:0">'
   +((S.outline||[]).map((o,i)=>(o.done?'√ ':'· ')+(i+1)+'. '+o.t).join('<br>')||'还没定')+'</div>'
   +'<div class="sgroup">未解的线索</div><div class="card" style="margin-top:0">'+((S.threads||[]).join('<br>')||'暂无')+'</div>'
   +'<div class="sgroup">剧情年表</div><div class="card" style="margin-top:0">'+((S.log||[]).slice(-6).join('<br>')||'还没有')+'</div>'
   +'<div class="sgroup">她记住的事</div><div class="card" style="margin-top:0">'+((S.facts||[]).slice(-8).join('<br>')||'还没有')+'</div>';
  $('sheet').classList.add('on');
};

/* ---------- 启动 ---------- */
(async()=>{
  try{ const bt=document.getElementById('buildTag'); if(bt) bt.textContent='v'+Object.keys(CHARS).length+' · '+new Date().getFullYear(); }catch(e){}
  await detect();
  const want=new URLSearchParams(location.search).get('r');
  if(want && CHARS[want]){ setTimeout(()=>openChat(want), 60); }
  if(location.protocol==='file:' && MODE!=='server'){
    setTimeout(()=>{ if(!KEY) alert('你现在是用本地文件打开的：\n· 想直接玩 → 到「我的」填 DeepSeek key\n· 或者用本地服务 http://127.0.0.1:8787（那边的 key 已配好）'); }, 600);
  }
  renderHome();
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js?v=5').catch(()=>{}); }
})();
</script></body></html>
