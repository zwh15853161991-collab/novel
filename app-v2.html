<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">

<title>借你一场雨</title>
<style>
:root{
  --fs:17px;
  --bg:#12100e; --bg2:#181614; --ink:#ece6de; --dim:#a49b90; --faint:#6f6862;
  --line:rgba(255,255,255,.09); --accent:#c9a06a; --accent-ink:#1a140e;
  --bubble:rgba(255,255,255,.055); --bubble-me:rgba(201,160,106,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;position:fixed;width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Songti SC","Noto Serif SC",serif;
  font-size:var(--fs);line-height:1.8;display:flex;flex-direction:column;overscroll-behavior:none}
.view{position:fixed;inset:0;height:100dvh;display:none;flex-direction:column;overflow:hidden}
.view.on{display:flex}
/* ---------- 首页 ---------- */
#home{background:linear-gradient(180deg,var(--bg2),var(--bg) 40%)}
.hhead{padding:calc(18px + env(safe-area-inset-top)) 20px 6px}
.hhead h1{margin:0;font-size:calc(var(--fs) * 1.42);letter-spacing:.06em;font-weight:500}
.hhead p{margin:4px 0 0;color:var(--faint);font-size:12.5px;letter-spacing:.14em}
.hmain{flex:1;overflow-y:auto;padding:8px 16px calc(78px + env(safe-area-inset-bottom))}
.card{background:var(--bubble);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:17px;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),rgba(201,160,106,.55))}
.grow{flex:1;min-width:0}
.nm{font-size:calc(var(--fs) * .92)}
.sub{color:var(--faint);font-size:calc(var(--fs) * .74);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11.5px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.sect{color:var(--faint);font-size:12px;letter-spacing:.14em;margin:18px 4px 9px}
.empty{color:var(--faint);font-size:13.5px;text-align:center;padding:26px 0}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(10,9,8,.86);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:0;color:var(--faint);font-family:inherit;font-size:12.5px;
  padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
/* ---------- 对话 ---------- */
#chat{background:var(--bg)}
.chead{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;
  border-bottom:1px solid var(--line)}
.iconbtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:11px;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:15px}
.log{flex:1;overflow-y:auto;padding:14px 15px 6px}
.nar{max-width:94%;margin:0 auto 13px;text-align:center;color:var(--dim);font-size:.94em;line-height:1.95;white-space:pre-wrap}
.b{max-width:87%;font-size:var(--fs);padding:11px 14px;border-radius:15px;margin:0 0 13px;white-space:pre-wrap}
.b.her{background:var(--bubble);border:1px solid var(--line);border-left:2px solid var(--accent)}
.b.me{margin-left:auto;background:var(--bubble-me);border:1px solid rgba(201,160,106,.26);text-align:right}
.act{color:var(--faint);font-size:.88em;margin-top:6px}
.adv{color:var(--faint);font-size:.82em;border-left:2px solid var(--line);padding-left:9px;margin:-6px 0 14px;line-height:1.65}
.endcard{margin:16px 0;padding:15px 17px;border-radius:16px;border:1px solid rgba(201,160,106,.3);
  background:linear-gradient(180deg,rgba(201,160,106,.1),transparent)}
.eth{color:var(--accent);font-size:12.5px;letter-spacing:.12em;margin-bottom:8px}
.eb{line-height:1.95}
.choices{display:flex;gap:8px;overflow-x:auto;padding:0 14px 9px}
.choices button{flex:0 0 auto;background:var(--bubble);color:var(--ink);border:1px solid var(--line);
  border-radius:999px;padding:9px 14px;font-size:calc(var(--fs) * .8);font-family:inherit;min-height:38px;white-space:nowrap}
.typing{display:none;gap:7px;overflow-x:auto;padding:0 13px 7px}
.typing.on{display:flex}
.typing button{flex:0 0 auto;background:var(--bubble);border:1px solid var(--line);color:var(--dim);
  border-radius:999px;padding:7px 12px;font-size:13px;font-family:inherit;min-height:34px;white-space:nowrap}
.cfoot{display:flex;gap:8px;padding:8px 13px calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.cfoot textarea{flex:1;font-family:inherit;font-size:16px;color:var(--ink);background:var(--bubble);
  border:1px solid var(--line);border-radius:14px;padding:11px 13px;outline:none;resize:none;height:44px;max-height:110px}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:0 17px;
  font-size:calc(var(--fs) * .9);font-weight:600;font-family:inherit}
.intro{position:absolute;inset:0;z-index:5;background:var(--bg);display:none;overflow-y:auto}
.intro.on{display:block}
.introbox{padding:calc(26px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom))}
.ikicker{color:var(--faint);font-size:12px;letter-spacing:.18em}
.introbox h2{margin:8px 0 4px;font-size:calc(var(--fs) * 1.6);font-weight:500;letter-spacing:.04em}
.imeta{color:var(--dim);font-size:calc(var(--fs) * .82);margin-bottom:18px}
.isect{color:var(--accent);font-size:11.5px;letter-spacing:.18em;margin:18px 0 6px}
.introbox p{margin:0;color:var(--ink);font-size:calc(var(--fs) * .95);line-height:2;opacity:.92}
.ihint{color:var(--faint);font-size:12px;text-align:center;margin-top:14px}

/* ---------- 面板 ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:40}
.sheet.on{display:flex;align-items:flex-end}
.sheetbox{width:100%;max-height:86dvh;overflow-y:auto;background:var(--bg2);border-radius:20px 20px 0 0;
  padding:16px 18px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheettitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sheettitle b{font-size:16px;font-weight:500}
.close{background:none;border:0;color:var(--faint);font-size:20px}
.sgroup{color:var(--faint);font-size:12px;letter-spacing:.14em;margin:16px 0 8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt .lbl{font-size:14.5px}
.opt .hint{color:var(--faint);font-size:12px;margin-top:2px}
.swatches{display:flex;gap:8px}
.sw{width:26px;height:26px;border-radius:9px;border:2px solid transparent}
.sw.on{border-color:var(--ink)}
.segs{display:flex;gap:6px}
.segs button{background:var(--bubble);border:1px solid var(--line);color:var(--dim);border-radius:10px;
  padding:6px 11px;font-size:13px;font-family:inherit}
.segs button.on{color:var(--accent);border-color:rgba(201,160,106,.5)}
.val{color:var(--accent);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:2px 8px}
input.txt{width:100%;background:var(--bubble);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;color:var(--ink);font-size:14px;font-family:inherit;outline:none}
.btn{width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:13px;
  padding:12px;font-size:15px;font-weight:600;font-family:inherit;margin-top:10px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--dim);font-weight:400}
</style></head><body>

<!-- 首页 -->
<div class="view on" id="home">
  <div class="hhead"><h1>借你一场雨</h1><p>LEAVE THE RAIN TO YOU</p></div>
  <div class="hmain" id="homeBody"></div>
  <div class="tabbar" id="tabbar">
    <button data-tab="stories" class="on"><svg viewBox="0 0 24 24"><path d="M4 5h11a3 3 0 013 3v11H7a3 3 0 01-3-3z"/><path d="M4 5v11a3 3 0 003 3"/></svg>我的故事</button>
    <button data-tab="pick"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>选择故事</button>
    <button data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>我的</button>
  </div>
</div>

<!-- 对话 -->
<div class="view" id="chat">
  <div class="chead">
    <button class="iconbtn" id="back">‹</button>
    <div class="av" id="cav">晞</div>
    <div class="grow"><div class="nm" id="cnm">林未晞</div><div class="sub" id="csub"></div></div>
    <button class="iconbtn" id="memBtn">记</button>
    <button class="iconbtn" id="setBtn2">⚙</button>
    <button class="iconbtn" id="moreBtn">⋯</button>
  </div>
  <div class="intro" id="intro">
    <div class="introbox">
      <div class="ikicker" id="iKicker"></div>
      <h2 id="iName"></h2>
      <div class="imeta" id="iMeta"></div>
      <div class="isect">故事背景</div><p id="iWorld"></p>
      <div class="isect">前情提要</div><p id="iPremise"></p>
      <div class="isect">她</div><p id="iPersona"></p>
      <button class="btn" id="iStart">开始</button>
      <div class="ihint">开头会让你先看见她，再看见她说什么。</div>
    </div>
  </div>
  <div class="log" id="log" style="display:none"></div>
  <div class="choices" id="choices"></div>
  <div class="typing" id="typingBar">
    <button data-w="（）">（动作）</button>
    <button data-w="“”">“台词”</button>
    <button data-w="（沉默）">沉默</button>
    <button data-w="（点头）">点头</button>
    <button data-w="（靠近一点）">靠近</button>
    <button data-w="（后退半步）">退开</button>
  </div>
  <div class="cfoot"><textarea id="inp" placeholder="（动作）“台词”——只想说一句也行"></textarea>
    <button class="send" id="send">发送</button></div>
</div>

<!-- 设置 -->
<div class="sheet" id="sheet"><div class="sheetbox" id="sheetBox"></div></div>

<script>

n", "beat": "你去书架深处闲逛。书是按颜色排的，不是按类别，红的一排、蓝的一排，最后一排全是褪成灰黄的旧译本。"}, {"id": "c1s4", "route": "wan", "beat": "八点，雨大到雨刷都来不及的那种程度。玻璃门外面什么也看不清，路灯只剩几团橘色的光。"}, {"id": "c1s5", "route": "wan", "beat": "伞下的空间窄得过分。她的肩膀和你的手臂之间隔着一层湿布料，能感觉到温度，也能感觉到那层布很薄。"}, {"id": "c1s6", "route": "wan", "beat": "她住的老楼没有电梯。楼梯间的声控灯坏了一半，走两步亮一下，暗下去的时候能听见雨水从伞尖滴到台阶上的声音。"}, {"id": "c1s7", "route": "wan", "beat": "第二天你带了两杯柚子茶，一杯正常，一杯少糖。塑料袋在手上晃，杯壁的水汽把袋子洇出一层白。"}, {"id": "c1s8", "route": "wan", "beat": "傍晚她在后门接电话。门没关严，声音一串一串飘进来，被雨打得很碎。"}, {"id": "c1s9", "route": "wan", "beat": "打烊之前，她在收银台后面写什么，写完撕下来，又揉掉。纸团在脚边堆了三个。"}], "第二章 未完成的画": [{"id": "c2s1", "route": "wan", "beat": "隔了一天，雨小了一些，成了很细的、落在脸上没有声音的那种。她带你穿过旧城区的巷子，两边是关着门的裁缝铺和修表摊。"}, {"id": "c2s90", "route": "wan", "beat": "书店下午没有客人。她蹲在书架和柜台之间的空地上，速写本摊在膝头，铅笔搁在耳朵上。"}, {"id": "c2s2", "route": "wan", "beat": "巷子尽头是一段废弃的站台。铁轨被雨泡得发黑，枕木间长满了草，草尖上挂着水。远处的信号灯还亮着，红得没有意义。"}, {"id": "c2s3", "route": "wan", "beat": "雨棚的缺口那边，水一层一层往下掉。她把本子从你手里拿回去，合上，两只手压在封面上。"}, {"id": "c2s4", "route": "wan", "beat": "她把手机递过来，屏幕上是一封邮件。退稿信只有三行，最下面是已经看过很多遍的“感谢您的投稿”。"}, {"id": "c2s5", "route": "wan", "beat": "她把本子合上，声音第一次变硬。硬得很干脆，像一块玻璃被人从中间掰断。"}, {"id": "c2s6", "route": "wan", "beat": "你到的时候她已经在搬了。书架最下面两层要清空，纸箱摞在门口，箱子上用马克笔写着文学、画册、不要了。"}, {"id": "c2s7", "route": "wan", "beat": "八点十七分，整条街的灯一起灭掉。"}, {"id": "c2s10", "route": "wan", "beat": "第三次退稿信是当面退的。编辑把稿子放在柜台上，往外推了两寸。"}, {"id": "c2s8", "route": "wan", "beat": "电一直没有来。后来你打开手机的灯，光柱里全是浮尘，慢慢地转，像雪。"}, {"id": "c2s9", "route": "wan", "beat": "十一点，她站起来，拍了拍裤子上的灰，从包里拿出那本速写本。"}], "第三章 雨停之前": [{"id": "c3s1", "route": "loop", "beat": "第十七轮，她不再带表，只带一只旧保温杯。"}, {"id": "c3s2", "route": "loop", "beat": "雨小了，走廊灯闪了两下，没灭。"}, {"id": "c3s3", "route": "loop", "beat": "她终于说出：这轮我赢不了。"}, {"id": "c3s4", "route": "loop", "beat": "钟走到三点十七分，她没有伸手去改。"}, {"id": "c3s5", "route": "loop", "beat": "他问：如果真只剩一次，你想干什么。"}], "第一章 旧调重弹": [{"id": "c1s1", "route": "yao", "beat": "你还没进门就先听见了琴声——一段弹到一半停下的旋律，停了很久，没有接下去。"}, {"id": "c1s2", "route": "yao", "beat": "曲子断在一个休止符上。她转过来，头发比三年前短，笑起来还是先动眼睛。"}, {"id": "c1s3", "route": "yao", "beat": "她把手从琴键上收回去，掌心在裙子上擦了一下。"}, {"id": "c1s4", "route": "yao", "beat": "谱架是松的，你扶起来，它又歪。她伸手来按，两个人的手背撞在一起。"}, {"id": "c1s5", "route": "yao", "beat": "楼下有人喊「沈老师」，是来上课的学生，在门口抖伞。"}, {"id": "c1s6", "route": "yao", "beat": "晚上八点，雨小了些。琴要挪到窗边，给漏雨的天花板腾出地方。"}], "第二章 卡农": [{"id": "c2s1", "route": "yao", "beat": "台风「白鹭」要来那几天，琴房的天花板开始漏雨，一滴滴落在琴盖上，滴出一小片水声。"}, {"id": "c2s2", "route": "yao", "beat": "雨声太大，两个人都不说话。她把一块旧毛毯搭在琴上，拍了拍，像拍一只动物。"}, {"id": "c2s3", "route": "yao", "beat": "她按着你的手，一节一节地带。指尖是凉的，掌心很热。"}, {"id": "c2s4", "route": "yao", "beat": "手机在琴凳上震，她看了一眼，按掉，又震，又按掉。"}, {"id": "c2s5", "route": "yao", "beat": "雨小了一点。她坐回琴凳，手指搭在琴盖上，没弹。"}, {"id": "c2s906", "route": "yao", "beat": "下午最后一节课下了，琴房的门没关，里头还有人在弹，一句一句地停。"}, {"id": "c2s6", "route": "yao", "beat": "台风登陆那晚，琴房的玻璃一直在响。你们在窗上一条一条贴胶带，贴成一张网。"}], "第二章 裂缝": [{"id": "c2s7", "route": "yao", "beat": "市里合唱比赛那天，第三排中间那个男生在第二段抢了半拍，整个声部跟着塌了一片。"}], "第三章 裂缝": [{"id": "c3s6", "route": "yao", "beat": "琴房的钥匙交还那天，管理员在登记本上划掉了她的名字。"}], "第一章 零点之后": [{"id": "c1s1", "route": "wen", "beat": "凌晨一点，你先把收音机打开，再关上门。那个声音已经在里面了——她说「欢迎收听」，像在跟房间里的人打招呼。"}, {"id": "c1s2", "route": "wen", "beat": "她把收音机的音量调小了一格，动作很熟练，像每天都在做。"}, {"id": "c1s3", "route": "wen", "beat": "她终于抬头，看了你两秒。那两秒里，收音机正好播到一句「晚安」。"}, {"id": "c1s4", "route": "wen", "beat": "之后你几乎每天都来。她夜班，你就买一盒关东煮，坐到窗边那张高脚凳上。"}, {"id": "c1s5", "route": "wen", "beat": "那只耳机里正放着同一档节目，延迟半秒。她的声音在耳朵里，也在耳朵外。"}, {"id": "c1s6", "route": "wen", "beat": "五点，天要亮了。她要交班，把收音机关掉，动作比开的时候慢。"}], "第二章 声音的形状": [{"id": "c2s1", "route": "wen", "beat": "那周的节目里，她说了一句话，说到一半笑场。"}, {"id": "c2s2", "route": "wen", "beat": "她关掉收音机，收银台一下就安静了。安静得能听见冰柜的嗡嗡声。"}, {"id": "c2s3", "route": "wen", "beat": "那天她提前下班，说想去看一眼电台。老楼十二层，电梯常年坏。"}, {"id": "c2s4", "route": "wen", "beat": "她在录音室里坐下，把耳机挂在脖子上，习惯性地开口："}, {"id": "c2s5", "route": "wen", "beat": "她戴上耳机，手指在调音台上滑了一下，推子慢慢推上去。"}, {"id": "c2s906", "route": "wen", "beat": "上午十点，便利店的灯调得很亮。柜台后面换了人，她站在货架边上，穿一件洗得发白的衬衫，手里拎着一瓶水。"}, {"id": "c2s6", "route": "wen", "beat": "那一期节目她做了四十分钟。你在走廊上靠着墙，听见门缝里漏出来的声音，忽远忽近。"}], "第二章 一夜之间": [{"id": "c2s7", "route": "wen", "beat": "凌晨三点，便利店的自动门开了两次，没有人进来——风把门口的塑料帘吹得直响。"}], "第三章 闭麦之前": [{"id": "c3s1", "route": "wen", "beat": "她走之前的最后一周，便利店照常营业，收音机里换成了别的节目。"}, {"id": "c3s2", "route": "wen", "beat": "最后一班，她破例把收音机打开了，调到一个没有信号的空白频道。"}, {"id": "c3s3", "route": "wen", "beat": "五点，天要亮了。她把工牌摘下来，放在收银台上，像放下一件很重的东西。"}, {"id": "c3s4", "route": "wen", "beat": "门口的天已经蓝了，路灯一盏一盏灭下去。她站在光里，你站在阴影里。"}, {"id": "c3s905", "route": "wen", "beat": "四点四十，最后一班的点快到了。她蹲在货架前把糖盒一盒一盒摆直，盒沿对着盒沿，留出一指宽的缝。"}, {"id": "c3s5", "route": "wen", "beat": "她低头看了很久地面，然后抬起头，眼睛亮得不像熬了夜。"}], "第三章 最后一期": [{"id": "c3s6", "route": "wen", "beat": "录最后一期那天，台里已经搬空了一半。隔壁办公室的桌子都掀了，地上剩一圈圈电线。"}], "第一章 抄书": [{"id": "c1s1", "route": "xiao", "beat": "调令是三天前送来的：着国史馆抄书吏一人，赴长公主府听候。调令上没写为什么，只盖了一个印。"}, {"id": "c1s2", "route": "xiao", "beat": "屋里只有三个人：她、一个老嬷嬷、一个捧着朱笔的小宫女。"}, {"id": "c1s3", "route": "xiao", "beat": "帘子动了一下。她伸手把帘子掀开半尺，露出半张脸，眼睛很静，像在看一件器物值不值钱。"}, {"id": "c1s4", "route": "xiao", "beat": "她笑了一声，很短，像咳嗽。"}, {"id": "c1s5", "route": "xiao", "beat": "三天的第二天夜里，你在偏房抄到三更。灯芯爆了一下，你才发现门外站着人。"}, {"id": "c1s6", "route": "xiao", "beat": "她在外间的椅子上坐下，离你有三步，隔着半张案。"}], "第二章 把柄": [{"id": "c2s1", "route": "xiao", "beat": "第三天，书校完了。你把改好的那一页铺在案上，字是你的，意思不是。"}, {"id": "c2s2", "route": "xiao", "beat": "她没有生气，只是把纸又推回来，指尖在那行字上敲了一下。"}, {"id": "c2s3", "route": "xiao", "beat": "她沉默了一会儿。窗外有人打更，三更三点。"}, {"id": "c2s4", "route": "xiao", "beat": "她没有回答，只把那份弹劾往前推了半寸。"}, {"id": "c2s5", "route": "xiao", "beat": "天没亮，东华门的采买车排了一长队。你把纸压在萝卜下面，手心全是汗。"}, {"id": "c2s906", "route": "xiao", "beat": "御史台来人的时候，雨还没停。两个人站在偏房门口，靴底带进来一脚泥。"}, {"id": "c2s6", "route": "xiao", "beat": "她走近两步，在你面前停下。这是你第一次在白天、在宫墙外、离她这么近。"}], "第三章 宫门": [{"id": "c3s1", "route": "xiao", "beat": "那一夜宫门闭得很早。街上巡防比平日多了一倍，家家户户关窗。"}, {"id": "c3s2", "route": "xiao", "beat": "她第一次看着你的眼睛说完整句话。"}, {"id": "c3s3", "route": "xiao", "beat": "她听完，没有立刻说话。灯芯烧短了，光很小。"}, {"id": "c3s4", "route": "xiao", "beat": "四更天，宫里传来第一声更鼓。她站起来，走到窗边，把窗推开一条缝。"}, {"id": "c3s905", "route": "xiao", "beat": "天没亮，宫门还闭着。她在廊下等你，手里握着一枚铜符，符上的字被手汗磨得发亮。"}, {"id": "c3s5", "route": "xiao", "beat": "她背对着你站了很久，肩膀有一次很轻的起伏。"}], "第三章 案结之前": [{"id": "c3s7", "route": "xiao", "beat": "消息压在偏殿的案上，一整天没动。她坐在灯下，没有翻开任何一本折子。"}, {"id": "c3s6", "route": "xiao", "beat": "折子是次日早朝递的。你站在殿外第三排，按规矩该跪，你站着。"}, {"id": "c3s1", "route": "lu", "beat": "上奏前夜，她把官服叠得整整齐齐，摆在案上，像摆一件借来的东西。"}, {"id": "c3s90", "route": "lu", "beat": "殿门关了三个时辰。檐下的更漏滴得很慢，里面一直没有声音传出来。"}, {"id": "c3s2", "route": "lu", "beat": "她看着你，看了很久。"}, {"id": "c3s3", "route": "lu", "beat": "天亮之前，宫里来了人，比她的折子早了两个时辰。"}, {"id": "c3s4", "route": "lu", "beat": "案子结了，十年前的漕运账被翻出来，牵出三个人。陆知白在朝上把话说完，没有一个人敢接。"}, {"id": "c3s5", "route": "lu", "beat": "雨停了。宫里的人来请她，说陛下要见。"}], "第一章 同僚": [{"id": "c1s1", "route": "lu", "beat": "你在刑部二门口被拦下，值守的老吏把你的官牌翻过来看了三遍，才让开半步。"}, {"id": "c1s2", "route": "lu", "beat": "她指给你看：同一份供词，三处「画押」的字迹深浅不同，日期却是一天。"}, {"id": "c1s3", "route": "lu", "beat": "案卷查到一起，天就黑了。她起身时扶了一下案角，袖子滑上去半寸。"}, {"id": "c1s4", "route": "lu", "beat": "她没有立刻答，手在案下攥了一下，攥得指节发白。"}, {"id": "c1s5", "route": "lu", "beat": "那晚她没走。两个人对着一盏灯坐到三更，她把话说得很慢。"}, {"id": "c1s6", "route": "lu", "beat": "第二天，漕运案的卷宗被调走了，说是上头要看。调走的人连回执都没留。"}], "第二章 替她瞒": [{"id": "c2s1", "route": "lu", "beat": "为了查那桩旧案，你们换了便装去城南的茶楼。她穿男装比穿官服更自然，走路带风。"}, {"id": "c2s90", "route": "lu", "beat": "吏部来了文书，要刑部各员报一份年貌册：籍贯、年岁、面貌，另附一只手印。"}, {"id": "c2s2", "route": "lu", "beat": "茶楼里坐着几个刑部的老吏。有人认出她，端了酒过来。"}, {"id": "c2s3", "route": "lu", "beat": "出了茶楼，她走了一段才开口，声音有点闷。"}, {"id": "c2s7", "route": "lu", "beat": "夜里刑部的门要落三道锁。她值夜那次，第三道锁卡住了，钥匙插进去转不动。"}, {"id": "c2s4", "route": "lu", "beat": "查到第七天，那个替死人签字的老吏死在了牢里，说是自尽。"}, {"id": "c2s5", "route": "lu", "beat": "三天后，有人递了折子，参刑部主事陆知白「行止不端，恐非男子」。"}, {"id": "c2s6", "route": "lu", "beat": "她一个人去的，回来时天快亮了。官服上沾了酒气，人倒是没事。"}], "第三章 同僚": [{"id": "c3s6", "route": "lu", "beat": "停尸房在西角，只有一盏油灯。仵作把验状摊在石台上，指尖点着最后一行。"}], "第一章 替嫁": [{"id": "c1s1", "route": "shen", "beat": "喜棚搭好那天下了雨，红绸被打湿，颜色深了一块。府里说，沈家的小姐明日进门。"}, {"id": "c1s2", "route": "shen", "beat": "册子上的字很干净，一笔一划，不像仓促写的。她把每一项都记了：米、布、银，连两匹绢的颜色都注了。"}, {"id": "c1s3", "route": "shen", "beat": "喜宴散得早。二公子身子弱，拜完堂就被扶回房里，咳嗽声隔着两道墙都听得见。"}, {"id": "c1s4", "route": "shen", "beat": "她愣了一下，手抬起来，又放下。"}, {"id": "c1s5", "route": "shen", "beat": "三更，府里忽然乱起来。二公子咳血，请了大夫，大夫摇头。"}], "第二章 守寡": [{"id": "c2s1", "route": "shen", "beat": "二公子死在第七天。府里换了白，红绸被扯下来，堆在院角，像一堆没人要的东西。"}, {"id": "c2s9936", "route": "shen", "beat": "祠堂散了之后，府里换了白。她把袖子里的册子摊在桌上，摊得很平，用手指把折痕压实。"}, {"id": "c2s2", "route": "shen", "beat": "你翻出账房底册，一笔一笔对。三十六抬嫁妆，二十六抬入户，十抬记在「待补」，却有三笔银子早在半年前就出了府。"}, {"id": "c2s3", "route": "shen", "beat": "二管事姓周，管着府里三十年的账。他见了你，笑得很和气。"}, {"id": "c2s4", "route": "shen", "beat": "那晚她来账房，看见你桌上的底册，什么也没问。"}, {"id": "c2s5", "route": "shen", "beat": "族长在祠堂议事，说新妇守寡三年，若不安分，就送回沈家。周管事站在旁边，一句没辩。"}, {"id": "c2s6", "route": "shen", "beat": "祠堂里静了一瞬。族长的目光从底册移到你脸上，又移到门口。"}, {"id": "c2s8", "route": "shen", "beat": "底册在库房最里头的柜子里。第二天她去取，被两个管事拦在门口——一个说钥匙在周管事手上，一个说府里查不到这张凭据。"}, {"id": "c2s7", "route": "shen", "beat": "三天后她一个人去了库房，回来的时候袖口撕了一道口子，头发也有点乱。"}], "第三章 出府": [{"id": "c3s1", "route": "shen", "beat": "族长没有当场发作。三日后，周管事被查，府里封了两间库房。"}, {"id": "c3s9128", "route": "shen", "beat": "门板是新上的，漆味还没散。她一个人把三匹布摞上柜台，摞完退后两步，看了一看高度。"}, {"id": "c3s2", "route": "shen", "beat": "她从床底下拖出一个小箱子。里面有布样、账目、还有一张画得很粗的铺面图。"}, {"id": "c3s3", "route": "shen", "beat": "出府那天要签字画押：退了婚书，嫁妆归沈家，从此与裴府无涉。"}, {"id": "c3s8", "route": "shen", "beat": "退婚书要去沈家拿。她一个人回去的，没让你跟，说这是她家的事。"}, {"id": "c3s4", "route": "shen", "beat": "铺子开在城南，门面不大，招牌是新的，字是她自己写的。"}, {"id": "c3s5", "route": "shen", "beat": "入夜，铺子关门。她把灯芯挑亮，坐下来，第一次没有急着说什么。"}, {"id": "c3s6", "route": "shen", "beat": "开张第十天，来了两个人，说是裴府旧人，来收「例钱」——铺子在城南，归这条街的规矩管。"}, {"id": "c3s7", "route": "shen", "beat": "那两个人走了。她关上门，把门闩插上，回头时眼圈是红的，但没哭。"}], "第一章 倒计时 180 天": [{"id": "c1s1", "route": "jian", "beat": "八月底，明德中学高三（七）班。你被班主任叫到办公室，桌上放了一张座位表，最后一排靠窗的位置用红笔圈了出来，旁边写了个名字：程简简。"}, {"id": "c1s2", "route": "jian", "beat": "第一周同桌。她上课不听讲，低着头在本子上写东西，你以为她在画画，扫了一眼——是错题本，抄得很工整，但一道力学公式抄反了两个符号。"}, {"id": "c1s3", "route": "jian", "beat": "体育课自由活动。你跑完三千米，弯着腰喘气，抬头看见她一个人坐在跑道边的台阶上，膝盖上摊着一本单词本，嘴在动，没出声。"}, {"id": "c1s4", "route": "jian", "beat": "午休。全班趴在桌上睡觉。你没睡着，在改上午数学卷子的错。她也醒着，在改同一张卷子，笔尖很轻，怕吵到别人。"}, {"id": "c1s5", "route": "jian", "beat": "月考成绩贴出来了。你年级第一。她年级四百八十名（设定值，非真实数据），倒数第三排的位置，红纸黑字。"}], "第二章 倒计时 90 天": [{"id": "c2s1", "route": "jian", "beat": "月考后按成绩调座位。她被调到中间第四排，你留在最后一排。她收拾东西时错题本从抽屉滑出来，你弯腰捡起，她手抖了一下，接过去没说话。"}, {"id": "c2s9471", "route": "jian", "beat": "教室后门的锁坏了两天，没人报修。她从后门进来，绕过讲台，把卷子反扣在最后一排的空桌上。"}, {"id": "c2s2", "route": "jian", "beat": "她在新座位跟后排的几个人混熟了。上课传纸条，下课嘻嘻哈哈。你从最后一排看过去，她在笑，笑得很用力。"}, {"id": "c2s7", "route": "jian", "beat": "期中家长会那天下午，她妈在教室门口拉住班主任，声音不大，走廊里的人都听得见。"}, {"id": "c2s3", "route": "jian", "beat": "晚自习突然停电。走廊应急灯亮着，你去接水，走到拐角听见她在走廊尽头打电话，声音很轻，但走廊太安静了。"}, {"id": "c2s4", "route": "jian", "beat": "第二天，她像没事人一样。上课照常贫嘴，跟后排的人借修正带，笑得很大声。你把昨天整理的一套卷子递过去，她没接。"}, {"id": "c2s5", "route": "jian", "beat": "班会课。班主任站在讲台上说：「这次月考有几个同学进步很大，程简简进步了一百多名，主要是同桌帮扶效果好——」"}, {"id": "c2s6", "route": "jian", "beat": "班会后你去了天台。她靠在栏杆上，背对着楼梯口，风吹得她头发乱七八糟。你在门口站了一会儿，她没回头，但开口了。"}], "第三章 倒计时 30 天": [{"id": "c3s1", "route": "jian", "beat": "志愿表草表发下来了。三栏，第一栏最重要。你在第一栏填了一直想考的学校。她坐在新座位上，低头填表，笔停了很久。"}, {"id": "c3s9619", "route": "jian", "beat": "倒计时牌换成三十天。晚自习后教室空了一半，她留在最后一排，桌上摊着草表。"}, {"id": "c3s2", "route": "jian", "beat": "你收到保送确认通知了。信封是导师签的字，最后一栏是你一直想自己考的学校。导师说：「签了就不用高考了，名额给你留着，想清楚。」"}, {"id": "c3s3", "route": "jian", "beat": "她从班主任办公室门口路过，听见了你的名字和「保送」两个字。下午自习，你看见她在志愿表上把第一栏擦掉了，重写。新写的学校在另一个省。"}, {"id": "c3s4", "route": "jian", "beat": "高考前三天的晚自习。她翻开错题本的最后一页，写了一行字，又划掉了。你以为她没发现你在看，但她头也没抬就开口了。"}, {"id": "c3s5", "route": "jian", "beat": "高考前一天，全班拍毕业照。她站在最后一排最角落，你站在前排中间。摄影师喊一二三，她在最后一排做了个鬼脸——吐舌头那种，很幼稚。"}, {"id": "c3s7", "route": "jian", "beat": "志愿表交上去那天，她在办公室门口站了很久，出来的时候表已经交了。"}, {"id": "c3s6", "route": "jian", "beat": "考完最后一科。出考场下大雨，没带伞。她站在校门口的梧桐树下，头发湿了一半，贴在脸上。你也没带伞，两人淋着雨沿校门口那条路走。"}], "第一章 归来": [{"id": "c1s1", "route": "qing", "beat": "六年没回这座城。出租车从机场开到老城区，你路过那栋玻璃楼——青梧建筑事务所的招牌挂在十七层，灯亮着。"}, {"id": "c1s2", "route": "qing", "beat": "她转过身来。六年了，她瘦了，颧骨更高了，头发剪到肩膀，不像当年那种长得能扎马尾的样子。她看了你一眼，目光很短，然后看回图纸。"}, {"id": "c1s3", "route": "qing", "beat": "她把红笔搁下了。笔滚了两圈，碰到图纸上的一块橡皮，停了。"}, {"id": "c1s4", "route": "qing", "beat": "她从柜子里翻出一卷图纸，扔在桌上。不是新方案——是你六年前做的那个立面重构，A2图幅，四张，折痕都磨白了，边角起了毛。"}, {"id": "c1s5", "route": "qing", "beat": "她站在门口，手没离开门把。雨声大了，走廊的灯是感应的，亮了一下又灭了。"}, {"id": "c1s6", "route": "qing", "beat": "那天晚上你做了个梦。不是噩梦，是六年前那间会议室。"}], "第二章 对账": [{"id": "c2s1", "route": "qing", "beat": "第二天。事务所十七层，她的办公室门开着。桌上多了一样东西——一个旧模型，巴掌大，是当年你们一起做的社区图书馆草模，你切的纸板，她上的色。"}, {"id": "c2s90", "route": "qing", "beat": "下午三点，她把改过的立面摊在长桌上，用红笔在两处各画了一个圈。笔压得很重，纸背透出红。"}, {"id": "c2s2", "route": "qing", "beat": "你把新图纸展开，跟旧方案并排放。退线多两米，立面确实要重来。但旧方案的结构逻辑还能用——你当年花了三个月推导的那套模数关系，不是白做的。"}, {"id": "c2s7", "route": "qing", "beat": "档案室最里面那一格，标签上的日期是六年前。你抽出来的时候，纸边已经发黄。"}, {"id": "c2s3", "route": "qing", "beat": "她手顿了一下，从口袋里摸出一盒烟，看了看，又塞回去了。没点。"}, {"id": "c2s4", "route": "qing", "beat": "下午，你在她办公室改立面。她出去了，门没锁。你翻她桌上的项目档案，翻到一份会议纪要——日期是六年前，就是那场会。"}, {"id": "c2s5", "route": "qing", "beat": "她回来了，看见桌上的纪要没动过（或者你以为她没看出来）。她坐下来，翻了翻你改的立面初稿，拿红笔圈了两处。"}, {"id": "c2s6", "route": "qing", "beat": "她笔尖停了。红笔戳在图纸上，墨水洇了一个点。她没抬头，但你看见她喉结动了一下。"}], "第三章 问句": [{"id": "c3s1", "route": "qing", "beat": "第三天。你把初稿改完了，两处模数节点保留，但调了比例，绕过了规划局的退线问题。她翻了一遍，没圈红。"}, {"id": "c3s90", "route": "qing", "beat": "雨停了半小时，又落下来。她把那只缺角的模型从柜子最上层搬下来，放在窗前，缺角朝里。"}, {"id": "c3s2", "route": "qing", "beat": "施工节点图铺在桌上。你逐张看过去——结构合理，材料选得准，但有三处节点的逻辑跟她六年前的风格不一样，倒像你当年的思路。"}, {"id": "c3s3", "route": "qing", "beat": "她没接话。把文件合上，站起来，走到窗边。烟盒在窗台上，她拿了一支，没点，夹在指间转。"}, {"id": "c3s4", "route": "qing", "beat": "她回过身来，第一次在这一整天正面看你。烟还夹在手里，没点，滤嘴被她捏扁了。"}, {"id": "c3s5", "route": "qing", "beat": "她把那支捏扁的烟扔进了垃圾桶。纸篓里已经有七八个烟头了，都是今天攒的。"}, {"id": "c3s6", "route": "qing", "beat": "她终于看你了。不是扫一眼，是看。站在窗和桌之间，背后是灰色的雨后天空，光打在她半边脸上。"}, {"id": "c3s7", "route": "qing", "beat": "她在门口站住，转过身来。雨已经停了，路面反着灯，像刚擦过。"}], "第一章 这一轮我改了七次": [{"id": "c1s1", "route": "loop", "beat": "三点十七分，抢救室送来一个没有名字的男人。"}, {"id": "c1s2", "route": "loop", "beat": "第七次重来，她已经能背出每个人的下一句。"}, {"id": "c1s3", "route": "loop", "beat": "她提前备好肾上腺素，手不抖了，人也不抖了。"}, {"id": "c1s4", "route": "loop", "beat": "同事问她怎么知道床号，她说自己记性好。"}, {"id": "c1s5", "route": "loop", "beat": "她犹豫了四十秒，隔壁床老人多停了一次心跳。"}, {"id": "c1s6", "route": "loop", "beat": "她跪在更衣室，把「能重来」三个字从脑子里擦掉。"}], "第二章 他手背上的旧疤": [{"id": "c2s1", "route": "loop", "beat": "她不再算秒，改成记住他手背上的旧疤。"}, {"id": "c2s2", "route": "loop", "beat": "他忽然开口：你上一轮也是这么站的。"}, {"id": "c2s3", "route": "loop", "beat": "他们对了两处细节，确认两人困在同一场雨里。"}, {"id": "c2s4", "route": "loop", "beat": "他说每次重来都要再死一次，说得很轻。"}, {"id": "c2s5", "route": "loop", "beat": "她第一次为了不让他再死，主动放慢了手上的动作。"}], "第一章 雨里的副驾": [{"id": "c1s1", "route": "scar", "beat": "台风夜班车停运，你拦下他的货车，副驾有把旧伞"}, {"id": "c1s2", "route": "scar", "beat": "他只说路况和雨量，一句话不超过七个字"}, {"id": "c1s3", "route": "scar", "beat": "服务区他瘸着腿下车，逐个踢轮胎，不让你帮"}, {"id": "c1s4", "route": "scar", "beat": "你递止痛药，他说我没事，塞回你包侧袋"}, {"id": "c1s5", "route": "scar", "beat": "收音机只剩电流声，他让你随便拧，说反正听不清"}, {"id": "c1s6", "route": "scar", "beat": "他把你放在有路灯的路口，等你进楼道才打转向灯"}], "第二章 修车厂的雨": [{"id": "c2s1", "route": "scar", "beat": "三天后你去还伞，他仰躺在车底，只露出半截鞋"}, {"id": "c2s2", "route": "scar", "beat": "他袖口渗血，说是扳手划的，低头继续拧螺丝"}, {"id": "c2s3", "route": "scar", "beat": "隔壁店主说他昨夜跑了一趟长途，天亮才回"}, {"id": "c2s4", "route": "scar", "beat": "你帮他记流水账，他把卷帘门钥匙丢给你，没解释"}, {"id": "c2s5", "route": "scar", "beat": "旧同事来送材料，提到那场事故，他出门抽烟"}], "第三章 台风过境": [{"id": "c3s1", "route": "scar", "beat": "台风预警，他扛着木板来钉你家的窗，不说为什么"}, {"id": "c3s2", "route": "scar", "beat": "风大雨急他走不了，你留他，他说睡沙发就行"}, {"id": "c3s3", "route": "scar", "beat": "半夜旧伤发作，他压着声在阳台，怕你听见"}, {"id": "c3s4", "route": "scar", "beat": "你替他找药时看见体检单和一份邻县铺面租约"}, {"id": "c3s5", "route": "scar", "beat": "雨停他要走，把钥匙留在桌上，说邻县缺个修车的"}], "第一章 雨落在旧招牌上": [{"id": "c1s1", "route": "revenge", "beat": "她在南巷盘下漏雨的旧书店，招牌用的是假姓。"}, {"id": "c1s2", "route": "revenge", "beat": "旧友周愔推门避雨，没认出她，只说这店以前死过人。"}, {"id": "c1s3", "route": "revenge", "beat": "她翻出当年的判决剪报，纸角缺了一块。"}, {"id": "c1s4", "route": "revenge", "beat": "债主上门，认出她眉眼，开口要旧账。"}, {"id": "c1s5", "route": "revenge", "beat": "她在雨里撞见当年作证的人，对方撑伞替她挡了一下。"}, {"id": "c1s6", "route": "revenge", "beat": "夜里有人从门缝塞进一张收据，字迹是那人的。"}], "第二章 客气话里的刀": [{"id": "c2s1", "route": "revenge", "beat": "她约那人喝茶，全程只说天气和茶价。"}, {"id": "c2s2", "route": "revenge", "beat": "周愔又来，帮她搬书，说起当年那场官司。"}, {"id": "c2s3", "route": "revenge", "beat": "她发现旧账本被翻过，页码乱了两处。"}, {"id": "c2s4", "route": "revenge", "beat": "那人的妻子登门，塞来一沓钱，求她别再闹。"}, {"id": "c2s5", "route": "revenge", "beat": "她在河边听见对方醉酒说了真话，声音被雨盖住一半。"}, {"id": "c2s6", "route": "revenge", "beat": "回家路上她把伞给了淋雨的陌生小孩。"}], "第三章 她自己的活法": [{"id": "c3s1", "route": "revenge", "beat": "她把手上的东西摊在桌上，第一次没有绕弯子。"}, {"id": "c3s2", "route": "revenge", "beat": "那人来求她，说愿意还钱、还名。"}, {"id": "c3s3", "route": "revenge", "beat": "周愔承认当年他也在场，没能开口。"}, {"id": "c3s4", "route": "revenge", "beat": "雨停了一夜，招牌的半边终于写上字。"}, {"id": "c3s5", "route": "revenge", "beat": "书卖出第一本，是个躲雨的女生，问她为何留在这。"}], "第一章 记在账上": [{"id": "c1s1", "route": "ledger", "beat": "雨夜加班，她替他垫付车费，记在第37条。"}, {"id": "c1s2", "route": "ledger", "beat": "茶水间听见他夸别人细心，她把杯子放回原处。"}, {"id": "c1s3", "route": "ledger", "beat": "部门聚餐他说先垫，她付款，备注写清。"}, {"id": "c1s4", "route": "ledger", "beat": "回家雨大，她算出这月替他垫了两千四。"}, {"id": "c1s5", "route": "ledger", "beat": "他发来“改天请你”，她盯着三个字看了很久。"}], "第二章 雨里对账": [{"id": "c2s1", "route": "ledger", "beat": "项目出事，他第一句话是问：哪条合同能补。"}, {"id": "c2s2", "route": "ledger", "beat": "她替他挡下追责，会议记录只写自己经手。"}, {"id": "c2s3", "route": "ledger", "beat": "雨停十分钟，他在楼下说“你人真好”。"}, {"id": "c2s4", "route": "ledger", "beat": "她列了张单：三年，四十七笔，全带日期。"}, {"id": "c2s5", "route": "ledger", "beat": "他生日，她照例转账，这次多打了一行备注。"}], "第三章 我直接要": [{"id": "c3s1", "route": "ledger", "beat": "两份清单并排放在他桌上：一份钱，一份时间。"}, {"id": "c3s2", "route": "ledger", "beat": "他说：我们之间不用算这么清。"}, {"id": "c3s3", "route": "ledger", "beat": "雨又落，她把伞只撑在自己头顶。"}, {"id": "c3s4", "route": "ledger", "beat": "他问非要这样吗，她答一个字：是。"}, {"id": "c3s5", "route": "ledger", "beat": "他转账，数字对，时间晚了两天。"}, {"id": "c3s6", "route": "ledger", "beat": "最后她开口，说出想要的东西，不是钱。"}], "第一章 一具无名尸": [{"id": "c1s1", "route": "coroner", "beat": "雨夜送来无名女尸，他在灯下先看指缝"}, {"id": "c1s2", "route": "coroner", "beat": "他说贝壳粉，来源应该在城东旧码头"}, {"id": "c1s3", "route": "coroner", "beat": "你猜是溺水，他纠正：肺里没水"}, {"id": "c1s4", "route": "coroner", "beat": "凌晨三点，你把凉掉的咖啡换成热的"}, {"id": "c1s5", "route": "coroner", "beat": "报告里他删掉一句推测，只留证据"}, {"id": "c1s6", "route": "coroner", "beat": "死者身份出来：旧城区的裁缝"}], "第二章 证据不足": [{"id": "c2s1", "route": "coroner", "beat": "你来旁听解剖，他没拦你"}, {"id": "c2s2", "route": "coroner", "beat": "中途你退到墙边，他没停手"}, {"id": "c2s3", "route": "coroner", "beat": "你问他为什么老说证据不足"}, {"id": "c2s4", "route": "coroner", "beat": "他讲起自己第一具尸体的名字"}, {"id": "c2s5", "route": "coroner", "beat": "案子被上面调走，理由是辖区变了"}, {"id": "c2s6", "route": "coroner", "beat": "夜里他一个人在解剖室坐着，没开灯"}], "第三章 不必证明": [{"id": "c3s1", "route": "coroner", "beat": "台风夜停电，他用手电把最后一刀做完"}, {"id": "c3s2", "route": "coroner", "beat": "你带来那份被删掉的报告副本"}, {"id": "c3s3", "route": "coroner", "beat": "他说了一句不合职业的话，很轻"}, {"id": "c3s4", "route": "coroner", "beat": "案子结了，没有人被追责"}, {"id": "c3s5", "route": "coroner", "beat": "他把骨锯收进箱子里，扣上锁"}], "第一章 谁都说你好": [{"id": "c1s1", "route": "hollow", "beat": "聚会上他记得每个人口味，自己一杯没喝光"}, {"id": "c1s2", "route": "hollow", "beat": "散场后他坚持送你，路上话很少"}, {"id": "c1s3", "route": "hollow", "beat": "你问他为什么总在笑，他愣了一秒"}, {"id": "c1s4", "route": "hollow", "beat": "他答应的事又忘了，第二天补上表情包"}, {"id": "c1s5", "route": "hollow", "beat": "加班到十点，他在楼下等你，手里两杯奶茶"}, {"id": "c1s6", "route": "hollow", "beat": "你说他好得不像真的，他笑得更用力了"}], "第二章 别看我": [{"id": "c2s1", "route": "hollow", "beat": "项目组吵起来，他端着杯子去了走廊"}, {"id": "c2s2", "route": "hollow", "beat": "楼梯间里他靠着墙，没看手机"}, {"id": "c2s3", "route": "hollow", "beat": "他第一次说「我怕」，说完立刻开玩笑"}, {"id": "c2s4", "route": "hollow", "beat": "他消失三天，消息只回表情"}, {"id": "c2s5", "route": "hollow", "beat": "回来那天，他把方案全推翻重做"}, {"id": "c2s6", "route": "hollow", "beat": "散会后他一个人留在会议室"}], "第三章 好人不等于谁都可以": [{"id": "c3s1", "route": "hollow", "beat": "台风天他提着两袋东西来找你"}, {"id": "c3s2", "route": "hollow", "beat": "他说出真实想法，句子很长，没抬头"}, {"id": "c3s3", "route": "hollow", "beat": "他第一次当面拒绝同事的活"}, {"id": "c3s4", "route": "hollow", "beat": "他把那副笑脸收起来，说这就是我"}, {"id": "c3s5", "route": "hollow", "beat": "项目收尾，他提了个不算讨好的方案"}], "第一章 甲方会议室": [{"id": "c1s1", "route": "rival", "beat": "竞标同场，她的方案比你们薄一页"}, {"id": "c1s2", "route": "rival", "beat": "散会她走过来递名片，说好久不见"}, {"id": "c1s3", "route": "rival", "beat": "甲方把预算压了两成，她没反驳"}, {"id": "c1s4", "route": "rival", "beat": "电梯同乘，她提起六年前那场会"}, {"id": "c1s5", "route": "rival", "beat": "她约你喝咖啡，说只谈项目"}, {"id": "c1s6", "route": "rival", "beat": "咖啡凉了，她把话绕回署名"}], "第二章 各为其主": [{"id": "c2s1", "route": "rival", "beat": "她开始约你团队的人吃饭"}, {"id": "c2s2", "route": "rival", "beat": "她说我只是问价，不挖人"}, {"id": "c2s3", "route": "rival", "beat": "你把话挑明：这次我不让"}, {"id": "c2s4", "route": "rival", "beat": "台风夜两人被困在会议室"}, {"id": "c2s5", "route": "rival", "beat": "她说起当年为什么走，很短"}, {"id": "c2s6", "route": "rival", "beat": "她先开口说自己的现状，不藏了"}], "第三章 各退一步": [{"id": "c3s1", "route": "rival", "beat": "她提合并投标，署名一人一半"}, {"id": "c3s2", "route": "rival", "beat": "你们为一条退线争了两个小时"}, {"id": "c3s3", "route": "rival", "beat": "她把底牌亮出来：甲方要的是低价"}, {"id": "c3s4", "route": "rival", "beat": "签合同那天，她比你先到"}, {"id": "c3s5", "route": "rival", "beat": "签完她问你：还要不要做朋友"}], "第一章 笔录": [{"id": "c1s1", "route": "badge", "beat": "他按流程逐条问，一个字都不跳"}, {"id": "c1s2", "route": "badge", "beat": "你说这事明显是谁干的，他摇头"}, {"id": "c1s3", "route": "badge", "beat": "他给你一张回执，编号写得很工整"}, {"id": "c1s4", "route": "badge", "beat": "桌上有一盒胃药，压着半张便签"}, {"id": "c1s5", "route": "badge", "beat": "临走他多说一句：别自己去找人"}, {"id": "c1s6", "route": "badge", "beat": "夜里你路过，值班室的灯还亮着"}], "第二章 按规矩来": [{"id": "c2s1", "route": "badge", "beat": "隔壁两家吵架，他站中间讲程序"}, {"id": "c2s2", "route": "badge", "beat": "有人骂他死板，他没回嘴"}, {"id": "c2s3", "route": "badge", "beat": "台风夜他值班，接了七个电话"}, {"id": "c2s4", "route": "badge", "beat": "他说最怕的不是累，是判断错"}, {"id": "c2s5", "route": "badge", "beat": "笔录签字前，他把每一行念给你听"}, {"id": "c2s6", "route": "badge", "beat": "有人托关系来打招呼，他当场回绝"}], "第三章 我也会错": [{"id": "c3s 。董事会会议室里挂着一张老照片。", "premise": "三年前他一句话把她赶出公司；今天董事会请的顾问推门进来，是她。"}, "steady": {"world": "老城巷子里的照相馆，暗房的红灯常年亮着。柜台玻璃下面压着一层旧底片，边角泛黄。", "premise": "你回小城取一张十几年前的旧照片，照相馆换了老板，他说：你需要的话，我帮你找。"}, "double": {"world": "小城东街的旧货铺，柜台上摆着别人的旧物：一只表、一把钥匙、半盒火柴。店名是别人的。", "premise": "你认识的「她」三个月前失踪了；今天她推门进来，用同一个名字，语气却是另一个人的。"}, "gate": {"world": "山口的关隘，石门厚三尺，门内侧刻着十七条规矩。关外常年落雨，关内不下。", "premise": "雨夜里你走到关隘下，石板上刻着十七条规矩，守门人只念了第一条：报上名字。"}, "doomed": {"world": "小城的灯塔、便利店和一条总在下雨的海堤。书本身是道具：纸很薄，边角起了毛。", "premise": "她翻到书的最后，看见自己死在第三章。合上书，她笑着问你：那这一天，我们干什么。"}, "hostage": {"world": "驿馆西厢，窗纸补过三处。院里一棵老槐树，落叶没人扫，积到门槛。", "premise": "他被押在驿馆三年，脚上有链。你奉命送饭，第一次进门时，他说：先尝一口。"}, "topstudent": {"world": "南方小城的高三教室，靠窗第三排。窗台上摆着两摞卷子，风扇转起来咔咔响。", "premise": "高三换座位，你被调到靠窗第三排。他把桌上的书往自己那边挪了两寸，算是打过招呼。"}, "minister": {"world": "内阁值房在皇城东南角，窗纸糊得厚，冬天不见日头。案上常年摆着一摞折子和一盏旧灯。", "premise": "你替家族递一封急信进内阁，抬头时看见桌上的折子，写着你父亲的名字。"}, "senior": {"world": "大学城的老楼，四层没电梯，楼道灯坏了一盏。阳台朝西，晒得到一下午的太阳。", "premise": "你搬到大学城的老楼，隔壁学长帮你把最后一个箱子抬上四楼，说以后有事喊一声就行。"}, "exgf": {"world": "小城的同学会馆、路口的便利店、机场的落地窗。常年下雨，玻璃上都是水痕。", "premise": "同学会散场前她推门进来，迟到了整晚，举杯只说了一句：好久不见，你还是坐角落。"}}, AUTHORED={"loop": {"A": {"title": "雨停了", "text": "雨停得很突然。她把保温杯塞进他手里，杯壁还是烫的。他从抢救室门口的伞架上抽了一把断了骨的旧伞，撑开，骨头歪着，勉强挡住两个人。走到巷口她才发现自己一直没松手，掌心全是印子。他没说话，只是把伞往她那边偏了两寸。"}, "B": {"title": "三点十八分", "text": "她刚摸到他的手，墙上的钟跳到三点十八分。抢救室的门被人从外面推开，风灌进来，带着雨味。她低头看自己的手，空的。护士问她要不要休息，她说不用，转身去写记录，写到一半笔停住了——纸上那个名字，她一次也没写对过。"}, "C": {"title": "灯还亮着", "text": "抢救室的灯一直亮着。她站在原地，保温杯放在窗台上，凉透了也没人动。走廊那盏坏灯闪了两下，没灭。外面天快亮了，雨还在下，声音很轻，像有人在隔壁翻一页纸。她伸手把钟往回拨了一格，又停住，把手收了回来。"}, "D": {"title": "没打伞那天", "text": "他出院那天没打伞，走到门口还回头看了一眼，像在确认什么。她那晚值到天亮，把抢救室的器械一件一件擦干净，最后擦到那把断骨的旧伞，撑开看了看，收进了柜子最里面。谁也没留电话。雨下了整整一周。"}}, "scar": {"A": {"title": "多一把钥匙", "text": "你说「你可以不被需要」。他沉默很久，久到楼道的灯灭了一次又亮。然后他第一次没说「我没事」，只问你明天几点下班。第二天你把钥匙挂在门边，发现自己的那把不知什么时候换成了新的，铜色，齿口还是热的。"}, "B": {"title": "周四回来一次", "text": "钥匙你收下了。他去了邻县，每周四回来一趟，车停在巷口不进来，电话里只谈天气和路况。有一次信号不好，他连着说了三遍「雨大」，你才听出他不是在报路况。挂了电话，你在窗边站到灯全灭了。"}, "C": {"title": "伞留在店里", "text": "你把伞留在他店里，什么都没说，转身走进雨里。三个月后，楼下有人修车，铁皮工具箱摊开在地上，人蹲着，背对着你。你问是谁叫的，他说是路过。伞就挂在工具箱旁边，还是那把，骨头歪着。"}, "D": {"title": "两块牌子", "text": "你跟他去了邻县。铺面重开，门口挂两块牌子：修车、货运。他仍旧只谈天气，仍旧一句话不超过七个字。夜里你数钥匙，发现有两把——一把是门，一把他没说是什么。窗外雨大，铁皮棚顶响得像有人在上面走。"}}, "revenge": {"A": {"title": "写回本名", "text": "她把旧账一笔一笔清算完，最后一页撕下来，压在新招牌背面。招牌重新刷字那天雨很小，字写回本名，笔画比原来深。夜里她关灯上楼，第一次没检查门锁。楼下书还浸着潮气，纸味慢慢散开。"}, "B": {"title": "锁进抽屉", "text": "她留下了，和周愔合伙开这间店。账本锁进最深的抽屉，钥匙挂在柜台内侧。有人问起当年的事，她说得像在讲别人，语气平得听不出情绪。只有下雨那天，她会把那本账拿出来，翻到最后空着的一页，看很久。"}, "C": {"title": "北上的车", "text": "钱和道歉她都收了，店转出去，招牌留给下一个人。收拾时她把剪报烧了，纸灰落进窗台的水渍里。北上那班车在雨里开得很慢，她抱着那本账，一路上没有翻。"}, "D": {"title": "半面空招牌", "text": "她什么都没要，走的时候把半面空招牌留在门上。新店在别的街，不欠任何人的账，也不挂名字。第一个客人是躲雨的女生，问她为什么不写招牌，她说还没想好。"}}, "ledger": {"A": {"title": "第七十三页", "text": "账本最后一页写满那天，她把它合上，放回抽屉最里面。外面的雨停了，她把伞留在工位上，第一次空手走出写字楼。玻璃门映出她自己的影子，走得很稳，没有回头看一眼十七层。"}, "B": {"title": "第48条", "text": "他终于先开口，说得磕磕绊绊，把「我欠你的」说成「我一直知道」。她没笑，翻开账本，在最后一行写下第 48 条：这笔不是垫的。写完之后笔停了很久，才把本子合上。"}, "C": {"title": "归档", "text": "那句话没等到。她把清单复印一份，装进档案袋，写上日期，归到自己那一格。钱一分不少地到了，时间晚了三天。雨还在下，她撑着伞走进雨里，伞面只遮住一个人。"}, "D": {"title": "并成一张", "text": "两人把旧账并成一张表，各写一半。他的字大，她的字小，两栏并排，中间用铅笔划了一道线。雨一直没停，表格最后一行她留了空，笔搁在线上，谁也没先动。"}}, "coroner": {"A": {"title": "不是速溶的", "text": "他把手套摘了，很慢，一只一只。手背上有一道旧疤，从虎口斜到腕子。然后他伸手，把你湿透的袖子捏了一下，只捏了一下就松开，像在确认温度。明天我请你喝咖啡，他说，不是速溶的。"}, "B": {"title": "下周还来吗", "text": "他把那份副本收进箱子，说等我用完。箱子锁上，钥匙挂回墙上，他在门口停了半步，问你下周还来吗。走廊的除湿机还在响，你点头，他说好，然后先走了。"}, "C": {"title": "盖章那天", "text": "报告最后只写了结论，一页半，没有推测。信封上盖了章，编号是新的。他把箱子放回柜子，锁好，钥匙挂回墙上，位置和之前一模一样，差半厘米都看得出来。"}, "D": {"title": "台上那份副本", "text": "台风过后他调去了邻市。解剖室的灯还亮着，台上的那份副本没人收，边角被风翻起来。你把它压平，看了一眼最后一页，那里空着，什么都没写。"}}, "hollow": {"A": {"title": "关灯以后", "text": "他去关会议室的灯，站在门口没走。灯灭了一半，另外一半还亮着，照着他的侧脸。他说其实我一直想让你留下来，就这一句，没有玩笑。窗外的雨停在一句话的缝里，谁也没补下一句。"}, "B": {"title": "两个空格", "text": "他开始学着拒绝，第一件事是把周末还给自己。你在他的日历上看到两个空白的方格，什么也没写。他说还没想好放什么，先空着，空着也行。"}, "C": {"title": "没人动的那杯", "text": "他还是对谁都好，只是看你的那一眼短了半秒。奶茶还是买两杯，一杯放在你桌上，放凉了也没人动。第二天早上杯子还在原处，杯盖没开。"}, "D": {"title": "他还是会笑", "text": "项目结束他调去别的组，走廊里碰见还是会笑。茶水间的马克杯他不再记谁用哪个，按颜色随便拿。有人问他要不要一起吃饭，他说都行。"}}, "rival": {"A": {"title": "一人一半", "text": "铜牌挂在入口左手边，两家的名字并排，字号一样。她伸手把偏了的一角摆正，说这次算我们一人一半。铜牌反光，照出两个人都不太会笑的样子，谁也没先说话。"}, "B": {"title": "下次别迟到", "text": "合同签了，署名一前一后。她收拾文件时把散在桌上的你那份也理好，推过来，说下次别迟到。桌上那杯咖啡早凉透了，谁也没提，走的时候她把杯盖扣上。"}, "C": {"title": "被磨掉的号码", "text": "项目最后归了别家。她把名片留在桌上，背面写了一个号码，笔迹压在折痕上，最后一位被磨得看不清。你翻过来又翻回去，桌上的灯自动熄了一次。"}, "D": {"title": "散标那天", "text": "散标那天雨很大，她在门口站了一会儿，没打伞，也没叫车。后来听说她去了别的城市，同业里就这么少了个人，名单上还留着她的名字，排在原来那一行。"}}, "badge": {"A": {"title": "这顿他请", "text": "警号牌擦得能照出人影，他把它扣回胸前，帽子夹在腋下。走到门口他停了一下，说这顿他请，不算公事。面馆就在街对面，灯管一闪一闪的，他先替你推了门。"}, "B": {"title": "念到一半", "text": "检查交了，处分下来了，写在一张白纸上，编号很小。他照旧站在窗口后面，把每一行念给你听，念到一半停了停，喝了口水，再接着念。台面上那盒胃药换成了新的。"}, "C": {"title": "磨淡的编号", "text": "他调到内勤，窗口换了人。那张回执你一直留着，编号后面几位的墨迹被手指磨淡了。有天你在窗口问起他，新来的人翻了翻册子，说不太清楚，好像调走了。"}, "D": {"title": "帽檐压得很低", "text": "案子结了，他把材料归档，柜门关得很轻。后来在街口碰见过一次，他点了下头，帽檐压得很低，走过去之后你才反应过来。地上的水洼里有半边制服的影子。"}}, "boss": {"A": {"title": "第二个问题", "text": "她把你那份合同翻到最后一页，签完递回来，说下个项目你来带。白板上那行字还没擦，下面多了一行新的，笔画比上面那行轻：第二个问题，我们一起解决。"}, "B": {"title": "一个句号", "text": "项目结了，她照旧只发一个字：好。区别是这次后面跟了一个句号，那个点很小，落在屏幕正中。你盯着它看了很久，才回了一个收到。"}, "C": {"title": "划线很直", "text": "她把你调回原来的组，交接表写得很清楚，一条没漏。最后一栏的「下周你决定」被划掉了，改成「按原计划」。那道划线很直，直得像用尺子比着画的。"}, "D": {"title": "笔帽不见了", "text": "项目结束后她升了职，办公室搬到十七层。白板擦得很干净，那行字谁也没再写上去。桌角的笔筒里少了一支白板笔的笔帽，找了半天没找到。"}}, "tyrant": {"A": {"title": "位置你挑", "text": "他把办公室钥匙推过来，铜的，磨得发亮，说位置你挑。窗外的雨停了，玻璃上还挂着水痕。她拿起钥匙，先在桌上放了放，才握进手里，很轻地说了一句：那我挑里间。"}, "B": {"title": "不用你决定", "text": "董事会散了，他一个人坐在原位，百叶帘拉开半截。桌上的方案被翻到最后一页，那里有她留的一行字，圆珠笔写的：这次不用你决定。他把那页看了两遍，才合上。"}, "C": {"title": "空着的桌子", "text": "她没留下。他让人把里间那张桌子留着，一直空着。桌面不许人擦，笔筒里的笔还是她走时那个方向，斜着的。有人问要不要收起来，他说放着。"}, "D": {"title": "不用叫霍总", "text": "他交出总经理位置那天，她来送文件。签完字他把笔盖扣上，说以后不用叫我霍总了。她笑了一下，笑得很短，把文件收进包里，走廊的灯正好亮起来。"}}, "steady": {"A": {"title": "留个念想", "text": "旧招牌他没带走，靠在店里最里面的墙上，说要留个念想。卷帘门拉到一半停住，他弯腰把门口的台阶扫干净，扫得很仔细，连缝里的叶子都拨出来，才慢慢拉到底。"}, "B": {"title": "纸上的号码", "text": "车开出去二十米停下。他摇下窗，说你需要的话就打这个电话，然后把手写的号码递出来。纸上写了一串数字，中间一位改过一次，改的地方用小字重新描了一遍。"}, "C": {"title": "一页没翻", "text": "相册留在了柜台上，一页没翻，塑封的边缘还没拆。后来那家店换了新的招牌，暗房的红灯再没亮过，窗台的灰积了很厚，有人路过也只看一眼。"}, "D": {"title": "落在指腹上的灰", "text": "他走的那天雨很小。旧招牌靠在墙边，木头的字被雨泡得发白。你伸手摸了一下，指腹上落了一层灰，凑近看了看，是「照相」两个字的凹槽里刮出来的。"}}, "double": {"A": {"title": "念得很慢", "text": "新招牌挂上去的时候钉子偏了一点。她退后两步看了看，说就这样吧，偏着才像这店原来的样子。然后她念了一遍自己的新名字，念得很慢，一个字一个字地念，念完才把钥匙插进锁孔。"}, "B": {"title": "就这个", "text": "信她收进了抽屉最里面，没回。她照旧每天开门，只是不再演谁。客人问起名字，她说：我叫江栖，就这个。说完低头继续擦柜台上那只不属于任何人的旧表。"}, "C": {"title": "没拆的信", "text": "她还是走了，把钥匙放在柜台正中，钥匙下面压着一张纸条，只写了四个字：店你留着。抽屉里那封信没拆，信封上的雨渍干成一圈浅浅的印子，边角翘着。"}, "D": {"title": "另一把钥匙", "text": "真身后来回来过一趟，两人在店里坐了一下午，谁也没提这三个月。走的时候她留了一把钥匙，说店你继续开着，名字你也接着用。门合上之后，店里安静得能听见旧表走秒。"}}, "gate": {"A": {"title": "可回头一次", "text": "石板上第七条被磨平重刻，多出四个字：可回头一次。刻痕还很新，石粉落在门槛上没扫。他站在门里没动，说你走吧，回头的时候我还在。关外的雨正落着，关内一滴也没有。"}, "B": {"title": "这算犯规吗", "text": "他守了三百年，第一次跟着过了那道门。走出去三步他才回头，像在确认门还在，然后问你：这算犯规吗。雨水打在他肩上，他没躲，只是把手里那半块饼递过来。"}, "C": {"title": "比过又收手", "text": "门合上了。石板上的第七条还是原样，只是边角多了一道新刻的浅痕，像有人拿刀比过又收手。关内的灯还亮着，他的影子投在石板上，正好压住那道浅痕。"}, "D": {"title": "第十八个", "text": "上面的人来了，他被调去看别处的门。石板留在原地，第七条下面多了一行小字，字迹很轻：第十八个不回头的人。后来那行字被雨泡过，笔画涨开，还看得清。"}}, "doomed": {"A": {"title": "一个逗号", "text": "书翻到第四章，她的名字还在，后面跟着一个逗号，逗号后面空着。她把书合上，说这下得活久一点了，语气像在抱怨晚饭太咸。书角被她折了一道印子，说做个记号。"}, "B": {"title": "不止一种", "text": "她活过了第三章，但从那以后书里再没写过她。她说没关系，反正被记住的方式不止一种，然后笑了一下，笑得比平时短。海堤上风很大，她把书举起来挡了挡。"}, "C": {"title": "涂改过的墨迹", "text": "第三章还是来了。书页上有一行被涂改过的墨迹，看不清原来写的是什么，只留下一点毛边。灯还亮着，书摊在桌上没有合，风把最上面几页吹起来，又落回去。"}, "D": {"title": "没按回车", "text": "她没等到改稿。便利店那晚的灯一直亮着，年轻人的手停在键盘上，屏幕上那行字最后也没按回车。天快亮的时候他起身去理货，屏幕自己暗了。"}}, "hostage": {"A": {"title": "刀口朝内", "text": "他把那把不该带的刀留在驿馆，刀口朝内，压在桌上的旧信下面。出城门时他没回头，只把手抬了一下，像在挡风。你站在阶上看着那只手，一直看到看不见。"}, "B": {"title": "空木匣", "text": "他回国三年，第四年派人送来一只空的木匣。匣子里什么也没有，匣底刻着你的名字，刻得很深，像是怕磨掉。送匣的人说他一切安好，别的没让多讲。"}, "C": {"title": "尝过", "text": "城门关上那天下了雪。驿馆桌上留着他的链子，链子下面压着一张纸，只写了两个字：尝过。字被炭火烤过一点，边角发脆。窗纸补的第三处又破了。"}, "D": {"title": "没人擦的刀", "text": "他走后驿馆换了人看守。那把刀一直挂在墙上，没人动，刀鞘上落了灰，谁也不擦。新来的人问那把刀是谁的，老差役说不记得了。"}}, "topstudent": {"A": {"title": "两张票", "text": "两张票是同一天同一趟车，座位隔了两个。他把你那张折好，塞进你校服口袋，说别弄丢了，这个不好补。说完他把自己的票也对折了一次，折痕压在同一个位置。"}, "B": {"title": "做一遍", "text": "他去了保送那所。开学前寄来一本旧的错题本，扉页上写着：这些题我都讲过了，你自己再做一遍。字很小，写在原本印着日期的那一栏里，挤得有点歪。"}, "C": {"title": "没等到", "text": "高考结束那天雨很大，他站在校门口的屋檐下等了一会儿。人一波一波往外涌，他把伞撑开又收起来，最后没等到，伞收起来走了，地上留了一小圈干的地面。"}, "D": {"title": "一袋橘子", "text": "后来你们在不同城市的大学。有一年春节回家，在巷口碰见，他手里拎着一袋橘子，问你题还会不会做。你说早忘了，他嗯了一声，把袋子往你手里塞了一只橘子。"}}, "minister": {"A": {"title": "这屋你继续用", "text": "他复职那天没穿官服，只带了一枚旧印。走到值房门口停下，说这间屋子你继续用，我搬去东边。廊下的雪化了半尺，水沿着阶缝往下淌，他站着看了会儿才走。"}, "B": {"title": "多出来的钥匙", "text": "案子翻了，他被贬去南边。走之前他把值房的钥匙留下，钥匙串上多了一枚不是这屋的钥匙，铜的，磨得发亮。他没说是哪扇门，只说你若想找，总能找着。"}, "C": {"title": "没回音的折子", "text": "折子递上去三个月没回音。他照旧每日到内阁，案上的文书越堆越高，最上面那本你抄到一半。灯芯剪过两次，屋里静得能听见纸翻动的声音。"}, "D": {"title": "没留字", "text": "他复职后第一件事是把你调去别的衙门。交接那天下着雨，你把披风叠好放在他案上，没留字。他进来时看了一眼，把披风收进柜子，柜门关得很轻。"}}, "senior": {"A": {"title": "门垫下面", "text": "他把钥匙留在了门垫下面，只留一把。钥匙扣上挂了个旧的公交牌，牌子背面写了一行字：有事喊一声，这回我不在隔壁了。字很小，是用圆珠笔写的，写完还描了一遍。"}, "B": {"title": "新枝", "text": "他去了外地，花活了下来，长出一根新枝。半年后他回来过一次，站在阳台下抬头看，你把花搬下来给他看。他伸手碰了碰那片新叶，说这盆该换了。"}, "C": {"title": "摸半层", "text": "钥匙他收回去了，两把都收。门垫下什么也没有，楼道的灯坏了一盏，晚上回来要摸半层。有一晚你摸到一半停下，听见楼上有人关门，声音很轻。"}, "D": {"title": "还是那个位置", "text": "后来他很少回来。你把花养到了第二年，花盆换了大的，位置还是原来那个位置。有天浇水的时候发现盆底压着一张旧的公交牌，边角卷了。"}}, "exgf": {"A": {"title": "撕成两半", "text": "她把登机牌撕成两半，一半塞给你，说退不了了，你看着办。玻璃外的飞机正在滑行，尾灯亮了一下。她笑了一下，转身往出口走，走了几步又停下来，把手里的箱子换到另一只手。"}, "B": {"title": "念完航班号", "text": "她还是走了，箱子过安检的时候没回头。你在原地站到广播念完她的航班号，才把手里那半张登机牌折起来。纸很硬，折了两道才服帖。"}, "C": {"title": "算清了", "text": "她走前把当年那张电影票根放在你手里，票根已经褪色，日期还看得清。她说这次算清了，说完把箱子拉杆按下去，声音很脆。"}, "D": {"title": "从不提这座城", "text": "后来听说她在那边做得很好。同学群里她偶尔冒泡，发工作照，配文很短，从不提这座城市。有一年同学会她没来，群里有人问，没人答。"}}, "wan": {"A": {"title": "雨停之后", "text": "两天后，十点零七分。你在检票口把她拉了回来。\n她骂了你一句，很难听，眼睛却是亮的。检票员在雨里笑，说这年头还有人把要走的姑娘拽回来。\n后来她在书店最里面那面墙上办了一次小展，主题叫《撑伞的人》，一共十二张。第一张挂在最高的地方，画的是雨天里一个把伞倾向别人的背影。\n画的右下角有一行很小的字：不催我走的人。\n「白鹭」过后，南方还是常常下雨。现在你们共撑一把伞，她依然走得很慢，依然在数水洼。\n只是走到水最深的地方，她会故意踩一脚，然后回头看你的裤子。"}, "B": {"title": "晴天预报", "text": "半个月后，她自己投出去的第八份稿子有了回音。编辑说，想约她见一面。\n她站在书店门口，手里还捏着那张车票，很久没说话。边角已经被水汽泡软了。\n「我妈会骂我的。」她说。然后她把车票撕成两半，扔进雨里，「不过她骂我，我也听得见。」\n后来她在书店最里面那面墙上办了一次小展，只挂了三张。她说剩下的等画好了再说。\n开幕那天她把你安排在门口，说：你站这儿，别人进来第一眼看到的就是撑伞的那个。\n你在门口站了一整个下午。谁进来都先看你一眼，再去看墙上的画。\n你没有告诉她，其实你只是想第一个看见她笑。\n那本素描本最后被放在柜台最下层，和旧账本摞在一起。\n她后来在城南一家书店做事，不再画画。"}, "C": {"title": "同撑一把伞", "text": "你还是送她去了车站。一路上你们谁都没有说话，伞一直偏向她那边，你的左肩全湿了，她假装没看见。\n她进站之后回头，隔着玻璃用口型说了三个字。你没听清，也不想问。\n秋天的时候，你收到一个没有署名的信封。里面是一张画：雨天，两把伞，一把空着。\n背面写着地址，还有一个字——「来」。\n你把画夹进那本旧书里，翻到中间那一页。便签还在，七根伞骨，一根不少。\n后来你再路过那条街，橱窗里换了一盆绿植，摆得整整齐齐。\n她每天仍旧六点开门，先把伞挂好，再翻开那本没画完的。"}, "D": {"title": "雨一直下", "text": "后天十点零七分，她走了。\n书店照常开门，风扇照常空转。新来的店员问你找什么，你说随便看看。\n你在最高那一格找到一本硬壳的旧书，中间夹着一张便签，上面还是那个撑伞的小人。\n你不会画，所以你把便签放回原地，合上书，像合上一封没有寄出的信。\n雨停了很久之后，你才想起来：那天在站台上，她其实回过头。而你只顾着低头看鞋，没看清她口型说的是什么。\n再后来你搬家，那张便签没带走，夹在旧书里，一起卖给了下一家书店。"}}, "yao": {"A": {"title": "旧调重弹", "text": "她没走。车票退掉那天，她在琴房里坐了整整一个下午，一句话都没说。\n后来她把那架琴留在了书店二楼，说等学生教完了再搬。\n半年后她真的回去了一趟，又回来，说：「我妈说，学琴的姑娘不用非得嫁得好，别太野就行。我做到了。」\n那年冬天，她把十二首曲子录完了。第十二首有名字，叫《跟着，不超过去》。"}, "B": {"title": "各自远扬", "text": "她还是走了。你在站台上把录音笔还给她，她推回来，说留着。\n半年后，一档音乐节目里放了其中一段，没有署名，主持人说「作者不愿透露」。\n你听出来了，那首是第十二首。\n后来你给她发消息：「听到了。」她隔了很久才回：「你耳朵还行。」\n谱架上那首卡农后来换了人弹，第二声部依旧空着。\n她在另一座城的中学教书，课间仍会去琴房坐一会儿。"}, "C": {"title": "朋友以上", "text": "她走的那天，车开走前，她隔着玻璃对你笑了一下，什么也没说。\n你们一直有联系，聊琴，聊学生，聊她妈的身体，就是不聊那天晚上。\n第二年梅雨季，琴房又漏雨。你上去接水，看见她站在窗边，正在擦琴盖。\n「我回来代课。」她说，「这次教一年。」\n琴房的钥匙还回来了，门牌上她的名字被白漆盖住一半。\n她还在那间琴房上课，仍旧只弹声部。"}, "D": {"title": "雨一直下", "text": "她走的那天，你去了，但站在柱子后面。\n车开走以后，你上楼去看那架琴。琴已经搬走了，地板上留着一块四方的浅色印子。\n录音笔在琴凳上。你没打开。\n那年雨下得比往年久，一直到十一月才停。\n琴房后来改成了储物间，门口那块「禁止入内」的牌子一直没摘。"}}, "wen": {"A": {"title": "声音落地", "text": "她没回老家。车票退了，改成了两个月后的一张返程票。\n新节目在另一个平台上线，名字还叫「城市零点」。第一期她只说了一句话：「我回来了，因为有人一直在听。」\n你在便利店上夜班，她在录音间里说话。凌晨两点，两个人隔着一条街，谁也没关手机。\n后来她把节目里那句「算了」剪掉了，换成了一句没说下去的「谢谢你」。"}, "B": {"title": "只闻其声", "text": "她走了。最后一期的母带你留到现在，一年听了三十几遍。\n有一天你在地铁上听见有人放那段录音，放的正是她说「算了」的那一句。\n你没忍住，给那个陌生人发了一条消息：「后面还有四十分钟。」\n对方回：「我知道。我就是想听听她停在哪儿。」\n便利店换了新店员，收音机还在，只是没人再调那个台。\n她换了个城市，不做节目了，改做有声书。"}, "C": {"title": "白班与夜班", "text": "她回了老家，在一所小学教书，白天上班，晚上十点就睡。\n你们偶尔发消息，都是些没什么用的话。她会拍学生画的画，你会拍便利店的萝卜。\n第二年冬天她来这座城出差，只停一晚。你们在便利店门口站着，谁也没提当年。\n「我明天一早就走。」她说。你点点头，替她拉开玻璃门。\n那副耳机后来不知去向，剩下的一只留在收银台抽屉里。\n她还在凌晨守着收音机，只是不再开麦。"}, "D": {"title": "断线", "text": "她走得很快，像怕自己反悔。最后一句是「你路上小心」，和第一天一模一样。\n收音机后来一直放在那家便利店里，新来的店员嫌吵，拔了插头。\n你没有去找她。有些频道关掉了，就是关掉了。\n只是后来每次凌晨一点醒过来，你还是会先摸一下床头那台旧收音机。\n电台的频率后来被另一档节目占了，调过去，是个陌生人在念广告。"}}, "xiao": {"A": {"title": "共谋", "text": "天亮的时候，兵符是真的了。她把假的投进炭盆，看着它烧完。\n早朝上，御史台的人没来得及开口。三天后，户部那位侍郎自尽，案子结了。\n你没有走。你成了长公主府里一个没有官职的抄书人，替她改所有不该出现在册子上的字。\n有人说长公主养了个面首。她听见了，只回一句：「那是我的人。」"}, "B": {"title": "放你走", "text": "名籍烧了。出东门时，守门的老兵看了你一眼，什么也没问。\n三年后，你在南边的一个县里教书。有人从京城来，带了一句话：「她摄政了，没立后。」\n你把那本抄好的《河渠志》从箱底取出来，翻到第七卷。那一页的字很丑，是你写的。\n后来那本书再没有翻过。\n偏殿那盏茶撤了，对面那把椅子搬回了墙边。\n她后来把封地的事交给了别人，自己在城郊住下。"}, "C": {"title": "君臣", "text": "你留在了京城，进了国史馆。她的折子，从这天起由你誊清。\n你们说的话越来越少。她批折子，你抄字，中间隔着一张案。\n有一年冬天她病了，你在殿外站了一夜，第二天照常进去抄书，一个字也没提。\n史书上写：长公主萧氏，终身未嫁。\n城防图上那道朱笔线后来被人描过一遍，颜色深了一层。\n她仍旧每天第一个到殿上，坐原来的位置。"}, "D": {"title": "灭口", "text": "那天晚上你走出了宫门。第二天，京城的河道里捞起一个人，穿着抄书吏的衣裳。\n有人说你卷进了党争，有人说你偷了东西跑了。\n长公主府里，那本《河渠志》被投入炭盆，烧了一夜。\n你最后记着的是她说的那句话：「有些字，改了就回不去了。」\n国史馆的名册上，那一页后来换了新的纸，字是新抄的，笔画一笔不缺。"}}, "lu": {"A": {"title": "并肩", "text": "她没有被杀。陛下看了那份账，沉默了很久，只说了一句：「朕的臣子里，倒有一个不是来混日子的。」\n革职，不追究。她换了女装出宫，第一件事是去买了一双合脚的鞋。\n后来你们一起在城南开了间学馆，教算学，也教《孟子》。学生里有一半是姑娘。\n有人问起你们的来历，她只说：「同僚。」"}, "B": {"title": "辞官", "text": "她辞了官。上奏那日说的最后一句是：「臣不为官了，但这笔账，请陛下记着。」\n你留在刑部，把那一案写进档册。陆知白的名字后面，是「因病去职」四个字。\n三年后你外放，路过她家乡，听人说县里有个女先生在教算学好几年了。\n你终究没有进去。\n刑部的案卷归档了，封皮上她的名字旁边多了一个「调」字。\n她调去了别的州府，仍旧查案，只是不再上奏。"}, "C": {"title": "同僚", "text": "案子结了，她的身份成了刑部里一个谁都不提的秘密。\n你们照旧同进同出，一个主事，一个主事。她照样叫你「同僚」，照旧不叫你名字。\n只有每年冬天她值夜，会把灯留一盏给你。你也装作不知道是谁留的。\n值房的铜镜收进柜底，镜面朝下，再没翻过来。\n她仍旧把卷宗摞得比谁都齐，落款写本名。"}, "D": {"title": "败露", "text": "折子还是递了上去，慢了一步。\n审讯那日，她穿着官服，站得笔直，一句辩解也没有。\n定罪那天下着雨，刑部的院子里没人敢说话。你站在廊下，看着囚车从门前过去。\n后来那桩漕运案再没人提过。\n刑部的值房里留着一份没归档的验状，最后一行底下，有一个被墨涂掉的手印。"}}, "shen": {"A": {"title": "一起算", "text": "铺子第三年换了大些的门面。招牌还是她写的，字比第一年稳。\n账房那间小屋没动，你每天算完最后一笔，就在门口等她落锁。\n有人问起你们是什么关系，她说：「合伙的。」说完看你一眼，补一句，「也是别的。」"}, "B": {"title": "各自记账", "text": "你留在了铺子里，算账、进货、记账，只是没说过那句话。\n第五年她嫁了人，嫁的是一个粮行的掌柜。出嫁前一天，她把铺子的账本交给你。\n「先生，这铺子有你一半。」她说，「账你自己记着。」\n布铺的账本最后一页空着，只落了一行日期。\n她自己开了间小铺子，只卖布头，不记账。"}, "C": {"title": "还了婚书", "text": "婚书退了，你离开了这座城。听说铺子开得不错，她雇了两个伙计。\n三年后你路过城南，隔着街看见她在门口算账。她抬头，正好看见你，抬手打了个招呼——很自然的一个招呼。\n你也抬手，然后走了。\n那副算盘搁在左首边，珠子停在原来那一档。\n她仍旧每天算一遍账，数目对得上才关门。"}, "D": {"title": "没签的那一笔", "text": "那天你没签。族里把这事记了下来，说你「与妇人有私」。\n铺子没开成。她被送回沈家，第二年冬天病了一场。\n你被赶出裴府，在别的城里继续替人算账。算到某一页，笔停了一下。\n那本账册后来流到了旧货摊上，最后一页是空的，一道横线都没有。"}}, "jian": {"A": {"title": "同桌的你", "text": "她在雨里说「我喜欢你，从你帮我捡卷子那天起」。你说「我也没签保送，我跟你考一座城」。成绩出来她去了那所双非，你考上了你想去的学校，地铁三站路。\n大一寒假她回母校看老师，在最后一排靠窗的座位上看到一张纸条，你高三写的：「这道题她做对了，牛。」\n她把纸条拍了张照发给你，配文：「这谁写的，字真丑。」你回：「你同桌写的。」"}, "B": {"title": "各自远扬", "text": "她在雨里话到嘴边咽回去了，说「没事，考完了」。你签了保送，她去了志愿表第二栏的学校，在另一个省。\n两个人偶尔在朋友圈点赞，从没单独聊过天。她大三那年考了研，考到了你保送的那所学校——但那时你已经毕业走了。\n你在校友群里看到她的名字，想了一分钟，点进去看了一眼，退出来了。\n志愿表交上去那天，她在门口站了很久才走。\n她复读那年把错题本烧了，说留着没用。"}, "C": {"title": "同一排", "text": "她没说那句话，你也没说。两人淋着雨走到公交站，各自上了不同的车，各自回家。\n成绩出来她去了双非，你去了想去的学校，不同城。大一她寄过一封信，里面只有一颗薄荷糖和一行字：「这次轮我先说了，谢谢。」\n你回了她一道高数题的解题步骤，附了一句「这道你肯定会」。她没再回信，但你大二那年收到一个快递，里面是一本新版错题本，扉页写着：「继续。」\n讲台旁边那张桌子后来换了人，桌上摆着别人的文具袋。\n她仍旧把错题本带在书包里，一页没撕。"}, "D": {"title": "没对上号", "text": "她在雨里张了张嘴，最后说「谢谢你借我的错题本」。你没接话，两人各自走了。\n她复读了一年，考到了另一个城市。你在保送的学校读得很好，课业很忙，很少想起高中。\n三年后你在校友群里看到她的名字，想了一分钟才想起是高中那个同桌，又过了一分钟才想起来她叫程简简。\n你翻出那本旧错题本，最后一道大题旁边空着，笔迹早褪了。"}}, "qing": {"A": {"title": "学会问的人", "text": "她在办公室听完了你的话——你说「六年前你把我的方案说成你的，我恨过你。但我现在恨不动了。」她没回话，把桌上的旧模型推到你面前，缺角朝向你。\n你留下来做了这个项目，也做了下一个。她不再说「我说了算」，开始说「你觉得呢」。第一个问句比道歉难，她花了六年才说出口。\n事务所的招牌后来换了，名字加了你。她刻字的时候手没抖，你看着她刻，什么都没说。"}, "B": {"title": "各归各位", "text": "项目做完了，结款那天她把合同和图纸一起推过来，说「签收」。你签了。她把旧模型还给你，你说「留这儿吧，项目资产」。\n她点了头。你离开了这座城，第二次。后来你听说事务所拿了那个旧改项目的奖，领奖人写的是她的名字，你不在上面。\n她偶尔给你发消息，都是工作相关的。你偶尔回。两个人像两条平行线，离得不远，但永远碰不上。\n门牌上那个名字最后只刻了她一个，另一格空着。\n她自己单干，接的活都不大，从不署名。"}, "C": {"title": "重蹈一次", "text": "你留下来了。不是因为项目，是因为她那句「愿不愿意」。你告诉自己这次不一样，她学会了问。\n但三个月后，新项目的汇报会上，她又站在了台上。PPT上你的方案署着她的名字。你在台下看着，手心出汗。\n散会后她找到你，说「这次我跟你说过会写你的名字，是他们排版漏了。」语气是命令，不是解释。你信了。或者说，你选择了信。\n工位上的模型搬走了，桌面擦得很干净，什么都没留。\n她仍旧把图纸折三折，角上留一处标红。"}, "D": {"title": "擦肩", "text": "你说「不了」，她点了头。没有挽留，没有第二句。你收拾东西的时候她在窗边站着，背对着你，又点了一支烟。\n你走到门口，停了一下。她没回头。你出了门，走廊的感应灯亮了又灭。\n第二年你在另一座城做项目，甲方发来的合作方名单里有她的事务所。你看了三秒，划掉了。\n名单退回去那天，你在楼下抽完了整支烟，烟灰掉在鞋面上，没拍。窗外没有下雨，天很干，你点了支烟，才发现自己什么时候也学会了抽。"}}}, VIGS={"loop": [{"title": "换班表", "need": 6, "lines": ["换班表贴在护士站左边，用磁贴压着，纸角卷起来一块。", "她从来不抬头看。谁几点来、带没带早饭、先进哪间病房，她都知道。", "「你怎么记得住？」同事问她。", "「记性好。」她答，把笔帽按回去，声音没有起伏。"]}, {"title": "保温杯", "need": 12, "lines": ["那只旧保温杯放在值班室最上层，杯底有一圈洗不掉的茶渍。", "侧面贴过名字贴，撕了，只留下一小块胶印和半个字。", "「这谁的？」新来的实习生问。", "「我的。」她伸手拿回来，放进柜子，柜门关得很轻。"]}, {"title": "第三病床", "need": 18, "lines": ["三床的老人每次都在三点二十一分停一次心跳。", "她试过三次：提前给药、提前叫人、提前把除颤仪推到床边。", "第三次之后，老人照旧在那个时间停了一下。她站在床边没动，看着监护仪上的线重新走起来。", "那天她在记录上多写了一行字，又划掉了。"]}], "scar": [{"title": "工具箱", "need": 6, "lines": ["他的工具箱是铁皮的，边角磨得发亮，每一格工具都朝着同一个方向摆。", "「这个不用你递。」他把扳手接过去，用袖口擦了擦再放回原位。", "后来你发现，那格里最旧的一把，缠了两圈黑胶布，胶布已经很脆了。"]}, {"title": "体检单", "need": 12, "lines": ["体检单压在收银台下面，折过三次，边角起了毛。", "结论那栏被人用笔尖点过，点出一个针眼大的洞。", "他进来时你正拿着，他伸手抽走，塞进抽屉：「旧纸。」", "抽屉里有半盒止痛药，开封很久了，还剩三片。"]}, {"title": "七个字", "need": 18, "lines": ["他一天说的话，你数过一遍：路况、雨量、螺丝、吃饭了、我没事。", "加起来不到五十个字，最长的一句七个字：「明天有暴雨。」", "只有一次例外。半夜他在阳台咳了很久，你推门出去，他说：「你怎么还没睡。」", "这句话有八个字。"]}], "revenge": [{"title": "假姓", "need": 6, "lines": ["她在招牌上只写了一个「周」字，是随手挑的姓。", "街坊叫她周老板，她应得很顺，一次没有迟疑。", "派出所登记那天，表格上那栏她写得很慢，笔尖在纸上停了一下，最后落笔还是那个字。"]}, {"title": "剪报", "need": 12, "lines": ["剪报压在柜台的玻璃下面，只露一角，字被磨得发白。", "有客人弯下身想看，她把杯子往那一角上一放：「凉了不好喝。」", "晚上打烊，她把剪报抽出来，对着灯看，看完折好，放回原处，边角对齐玻璃的边缘。"]}, {"title": "半面招牌", "need": 18, "lines": ["招牌空着半边，木板被雨泡得起了毛，钉子还留着旧孔。", "木匠说刷一遍要两天，她说不用急。", "后来木匠自己把字描了个底，还没上漆，只写了半个。", "她站在门口看了一会儿，说就这样吧，剩下的等你认出来再写。"]}], "ledger": [{"title": "账本", "need": 6, "lines": ["账本是薄薄一本，封皮磨白，里面用尺子画了竖线。", "每一笔都写着日期、金额、事由，字小而整齐。", "「你记这个干嘛？」同事问。", "「习惯了。」她合上本子，塞回抽屉。"]}, {"title": "第37条", "need": 12, "lines": ["第 37 条那页有一道折痕，是反复翻过的痕迹。", "事由栏写着两个字：车费。", "下面空着一行，像是留给什么。", "她后来用铅笔在那行补了日期，又擦掉。"]}, {"title": "四十七笔", "need": 18, "lines": ["三年，四十七笔，全带日期。", "她把清单打印出来，纸边对齐，压在一叠合同下面。", "有人问她为什么不算清。", "她说算清就没意思了——说完自己愣了一下。"]}], "coroner": [{"title": "十七度", "need": 6, "lines": ["法医室常年十七度，比走廊低四度。", "他从不穿外套，说温度高了手会软。", "你第一次进来打了个哆嗦，他抬头看了一眼，把空调调高一度。", "第二天又调回十七度，谁也没提。"]}, {"title": "手套", "need": 12, "lines": ["他一天换四副手套，换之前先把旧的叠成方块。", "有人问他为什么这么讲究。", "他说：手套破了，证据就脏了。", "抽屉最里面有一副没拆封的，尺码比他的小一号。"]}, {"title": "第一具", "need": 18, "lines": ["他说起自己第一具尸体时，语速比平时慢。", "名字、年龄、指甲颜色，一个数字都没错。", "「你怎么记得这么清？」", "「记不清就得重来。」他顿了顿，「可人不能重来。」"]}], "hollow": [{"title": "马克杯", "need": 6, "lines": ["茶水间的杯子按颜色排，他知道每个人用哪个。", "新来的实习生随手拿了一个，他递过去另一只：「那个是别人的。」", "实习生问：那你的呢？", "他笑了一下，说我都行。"]}, {"title": "表情包", "need": 12, "lines": ["他道歉的方式是发一个表情包。", "连着三天，每天一个，配字都不一样。", "第四天没发了。", "第五天他出现在楼下，什么也没带。"]}, {"title": "楼梯间", "need": 18, "lines": ["楼梯间的应急灯是坏的，一直没人报修。", "他靠着墙，手机屏幕朝下扣在膝盖上。", "你问他在这儿待多久了。", "他说不久，说完看了一眼表，表停在三天前。"]}], "rival": [{"title": "名片", "need": 6, "lines": ["她的名片比常规窄两毫米，纸很硬。", "背面空白，没有一句客气话。", "你把它夹在方案第一页，合上时压出一道印。", "后来那道印还在，名片不知什么时候不见了。"]}, {"title": "前一页", "need": 12, "lines": ["竞标按姓氏排座，她的名字永远在你前一页。", "翻页的时候你总会先看到她的方案标题。", "有一页她把字改小了，留白多出一指宽。", "那一指宽里什么都没写，但你看了很久。"]}, {"title": "凉掉的咖啡", "need": 18, "lines": ["咖啡凉透之后表面会结一层薄膜。", "她用勺子把那层膜挑起来，放在碟子边上。", "「这样喝起来像没凉过。」她说。", "你喝了一口，确实是凉的。"]}], "badge": [{"title": "一米二", "need": 6, "lines": ["办事窗口一米二高，站着说话得稍微低头。", "他从不坐下来说话，说站着快。", "有人搬了凳子来请他坐，他摆摆手，说流程里没这条。", "凳子在墙边放了一整天，晚上才被他自己搬回去。"]}, {"title": "胃药", "need": 12, "lines": ["桌上那盒胃药压着半张便签，便签上写着三个电话号码。", "药只剩两粒，盒沿被捏得起了毛。", "你问他吃饭了吗。", "他说吃了，然后把药盒往抽屉里推了推。"]}, {"title": "检查", "need": 18, "lines": ["检查写在一页纸上，改了四遍，每一版的错处都圈出来。", "最后一版只剩两行字，字比前面都小。", "他签名字的时候，笔尖在纸上停了一下。", "签完他把纸对折，折痕压得很实。"]}], "boss": [{"title": "白板", "need": 6, "lines": ["白板上只写一行字，别人不敢往上加。", "她擦白板从上往下擦，一条一条擦，不留横线。", "有次你加了半行，第二天那半行被擦掉，字下留了空白。", "空白在中间，像她特意留的。"]}, {"title": "外卖", "need": 12, "lines": ["加班到十点，她会把最后一份外卖放在公共桌上。", "不写名字，也不说是给谁的。", "有人问是不是没人要，她说放这儿。", "第二天盒子空着，被洗干净倒扣在沥水架上。"]}, {"title": "周报", "need": 18, "lines": ["她的周报每一栏都有结论，只有最后一栏写「下周待定」。", "那栏空了六周。", "第七周她写上：下周你决定。", "写完之后她把字号调小了半号。"]}], "tyrant": [{"title": "百叶帘", "need": 6, "lines": ["百叶帘常年半开，角度是固定的。", "有人调过一回，第二天就恢复了。", "她说光线刺眼，他就让人换了更厚的帘子，没解释。", "帘子换好之后，角度还是那个角度。"]}, {"title": "钢笔", "need": 12, "lines": ["他签字用一支旧钢笔，笔杆有裂纹。", "秘书买过新的，被他放回盒子里。", "那支笔是他父亲留下的，笔尖有点分叉。", "写「霍衍」两个字的时候，他会慢半拍。"]}, {"title": "老照片", "need": 18, "lines": ["董事会会议室挂着一张老照片，厂门口的合影。", "照片第三排左边第三个人是他父亲。", "他每次开会都坐在能看见照片的位置。", "有一年照片被取下来过，他让人重新挂回去，钉子换了新的。"]}], "steady": [{"title": "红灯", "need": 6, "lines": ["暗房的红灯常年亮着，灯泡换了三次。", "他在里面待得比外面久。", "有人问他为什么不装亮一点的灯。", "他说这个颜色看显影正合适。"]}, {"title": "钥匙", "need": 12, "lines": ["柜台抽屉里有一串备用钥匙，五把，标签是手写的。", "他把其中一把放在你手里，说店里没人的时候可以进来坐。", "你问其他四把是谁的。", "他说都不是人的，是柜子的。"]}, {"title": "多洗一张", "need": 18, "lines": ["洗照片的时候，他会多洗一张。", "多出来那张放在柜台下面的纸盒里，纸盒满了就换新的。", "有人问那些是给谁的。", "他说还没人来取。"]}], "double": [{"title": "旧表", "need": 6, "lines": ["柜台玻璃下压着一只旧表，表带断了，指针停着。", "有人问卖不卖，她说不卖。", "「那你留着干嘛？」", "她说：留着看时间停着的样子。"]}, {"title": "语气", "need": 12, "lines": ["她学人说话只学半句，剩下的留着。", "「你这句话后面本来还有一句。」你会这么说。", "她就笑，说后面那句还说不好。", "后来她把那句补上了，语气是死的。"]}, {"title": "信", "need": 18, "lines": ["信封上的字很轻，像怕写重了就擦不掉。", "邮戳是邻市的，日期差了一天。", "她没有马上拆，先把它放在柜台上，压在那只旧表上面。", "压了三天，信角被表压出一道弧。"]}], "gate": [{"title": "十七条", "need": 6, "lines": ["石板十七条，从上到下刻得很密。", "他念的时候不看石面，眼睛看着来人的鞋。", "有人问第十七条写的什么。", "他说：第十七条，不许问第十七条。"]}, {"title": "关内不下雨", "need": 12, "lines": ["关外常年落雨，关内一滴也没有。", "有孩子问为什么。", "他说门厚三尺。", "孩子又问：那雨去哪了。他抬头看了看门。"]}, {"title": "刀", "need": 18, "lines": ["他随身一把刀，从没用来砍过东西。", "刀口磨得很平，刀柄上缠着旧布。", "有人说他不像守门的，像刻字的。", "他把刀收回去，说：也刻。"]}], "doomed": [{"title": "书", "need": 6, "lines": ["书的纸很薄，翻页会响。", "她把书带在身上，用橡皮筋捆着。", "有人想借，她说不行。", "「为什么？」「怕少一页。」"]}, {"title": "灯塔", "need": 12, "lines": ["灯塔的楼梯有八十九级，她数过。", "数到第七十级就开始喘，还是要上去。", "「上面有什么？」", "她说：能看到第三章在哪儿结束。"]}, {"title": "单子", "need": 18, "lines": ["单子上写了七种被记住的方式，前六种被划掉。", "只留下最后一条，字写得很小：有人记得我笑起来什么样。", "她把单子折成四折，塞进书里当书签。", "夹的位置正好是第三章。"]}], "hostage": [{"title": "链子", "need": 6, "lines": ["链子是铁的，磨得发亮，脚踝那圈有旧痕。", "他从不要求换新的。", "「换了不还是铁的。」他说。", "说完把裤脚放下来，遮住了。"]}, {"title": "碗", "need": 12, "lines": ["他吃饭前一定等人先尝。", "有一回没人尝，他就一整天没动那碗。", "后来你把碗端起来自己吃了一口。", "他看着你吃完，才动筷子。"]}, {"title": "地图", "need": 18, "lines": ["夜里他用炭在地上画地图，画完就擦。", "有一次没擦干净，留下半条河。", "第二天他说是水洒了。", "那半条河一直留到开春才被脚步蹭掉。"]}], "topstudent": [{"title": "两寸", "need": 6, "lines": ["他把书往自己那边挪了两寸，空出一条线。", "那条线正好放得下一个人的胳膊肘。", "有人问他要不要换座位。", "他说不用，这样刚好。"]}, {"title": "纸条", "need": 12, "lines": ["晚自习他递纸条，字很小，写在草稿纸背面。", "从来不写多余的字，只有步骤和答案。", "有一次背面多写了一行：这题你上次错在符号。", "那张纸条被夹在书里，压得很平。"]}, {"title": "操场", "need": 18, "lines": ["高考前一晚，他在操场走了很多圈。", "灯照着跑道，影子一圈一圈叠上去。", "有人问他紧张吗。", "他说不紧张，就是想把圈走完。"]}], "minister": [{"title": "旧灯", "need": 6, "lines": ["值房的灯是旧的，灯罩上有一道裂纹。", "他从不换，说这盏灯照得清字。", "有一晚灯芯烧短了，光暗下去。", "他把椅子往前挪了半尺。"]}, {"title": "折子", "need": 12, "lines": ["案上的折子按轻重分三摞，最上面那摞只有一本。", "那本从不批，也不让人碰。", "有人问那是什么。", "他说：还没到时候。"]}, {"title": "披风", "need": 18, "lines": ["披风是旧的，领口磨得起毛。", "他从不披着它见客。", "有一年冬天特别冷，他把它借出去过一次。", "后来披风回来了，领口多缝了一道线。"]}], "senior": [{"title": "敲墙", "need": 6, "lines": ["老楼的墙薄，敲三下对面就听得见。", "他敲门问：三下是什么意思。", "你说没什么意思，试试。", "后来他每天敲两下，算是打过招呼。"]}, {"title": "水管", "need": 12, "lines": ["晚上十一点，水管会响一阵，像有人在里面走。", "他提前说过，别怕。", "有一晚响了很久，他把门开了一条缝，问睡了吗。", "你说睡了。他说那就好。"]}, {"title": "花", "need": 18, "lines": ["阳台那盆花是他在楼下捡的，蔫着。", "养了两个月，活了。", "他说这花命硬。", "你问他不带走吗。他说明年再说。"]}], "exgf": [{"title": "票根", "need": 6, "lines": ["那张电影票根她留了很多年，字都淡了。", "夹在一本旧书里，书是当年你送的。", "有人问她为什么还留着。", "她说：留着算账用。"]}, {"title": "烟", "need": 12, "lines": ["她其实早戒了。", "那天在路口点了一支，只烧了一半就掐了。", "烟盒塞回包里，包侧袋还有半盒陌生的烟。", "「别人的。」她说，「我帮忙拿着。」"]}, {"title": "两小时", "need": 18, "lines": ["那天下雨，她在你楼下站了两个小时。", "手机调到静音，来电显示亮了七次。", "后来她把那七次都删了。", "只留了一条没发出去的草稿：我到了。"]}], "wan": [{"title": "那本他找的", "need": 0, "lines": ["送货的师傅把新到的书搬进店里，她清点完抽出其中一本放到柜台最里侧，不在上架的那一摞里。", "「这本先留着。上次有个人问过，他可能会来拿。」", "她把书脊朝里搁好，用一本字典挡在前面，拿抹布擦了擦柜面。"]}, {"title": "画扣过去", "need": 0, "lines": ["有人把一本刚到的画册随手翻开放在柜台上压了一杯水，她走过去把水杯拿开，画册合上翻面扣在台面上。", "「别把水搁画上。」", "她把水杯搁到窗台最远处，转身去后屋没回头。"]}, {"title": "书脊朝外", "need": 0, "lines": ["她在书架前停了一下，伸手把第二排歪了的两本书抽出来转九十度，书脊朝外重新插好，跟旁边的齐平。", "「脊朝外才看得见书名。书架不是摆设。」", "她用指腹沿书脊边缘抹了一遍确认没有翘出来的，转身去柜台后面泡茶。"]}, {"title": "青田街那家", "need": 0, "lines": ["她翻书架底层翻出一本封皮发脆的素描本，扉页写着青田街四十七号，日期是五年前。", "「青田街那家画材店，老板姓周，关门前最后一次去，他送了我一整盒马利炭笔。十二支，一支没拆。」", "她把素描本合上插回原位，手指在书脊上停了一下才松开。"]}, {"title": "书不收了", "need": 0, "lines": ["一个拎着编织袋的老人把一摞旧书搬到柜台上说要卖，她翻了几本，大部分是过期的教辅和杂志。", "「这几本品相太差了，没法上架。您拿回去吧，我不收了。」", "老人走后她把留下的一本诗集插进书架最里排，用旁边两本书挡住。"]}, {"title": "那天没有雪", "need": 0, "lines": ["她把一本画册翻到某一页停在柜面上，你随口问这页画的是什么时候的事，她手指压在纸面上没松。", "「……那天没有雪，画的时候手不抖。后来就再没画过那种天。」", "她翻过那页用另一张画压住，拿起旁边的抹布去擦根本不脏的柜台。"]}, {"title": "擦那块玻璃", "need": 0, "lines": ["打烊后她把店面灯调暗，搬了张凳子去擦橱窗内侧那块玻璃，擦到一半发现纸巾用完了。", "「……又忘买。」", "她从口袋里摸出一支秃头铅笔，在玻璃水雾上画了一条鱼的轮廓，看了两秒，用袖子抹掉了。"]}, {"title": "没画完的", "need": 0, "lines": ["你从书架后摸出一张画了一半的速写，正面朝下扣在柜面上。她伸手要翻，你按住纸角。", "「别翻。那张还没画完，画完了我自己给你看。」", "她收回手，坐回窗边的旧沙发，翻开一本没拆塑封的书，不说话了。", "「……行。那我等。」"]}, {"title": "第十二张", "need": 0, "lines": ["画到第十二张的时候，她在背面写了日期，写上天气，然后停住。", "前面十一张的背面都只写天气，没写别的。这一张她多写了一行，写得很小。", "「要是有人看得懂，就看得懂吧。」", "她把画翻过去，正面朝上，晾在窗台上。"]}, {"title": "关灯", "need": 0, "lines": ["打烊以后，书店要留一盏灯。她每天关灯的顺序都一样：先把靠窗的那盏关掉，最后才是柜台。", "今天她关到一半，停在第四盏前面。", "「你先别暗。」", "她对着那盏灯说了一句，然后自己也觉得好笑，把它关了。", "黑下来以后，她在门口站了一会儿，等眼睛适应。"]}, {"title": "第七封", "need": 0, "lines": ["她把七封退稿信按日期排开，铺在柜台上。", "第一封已经被翻得起了毛边。她用食指把折角一一压平。", "「第七封。」", "她数到第七封的时候停住，然后从抽屉里拿出第八张信纸。", "写地址的时候，笔尖抖了一下。"]}], "yao": [{"title": "没在琴房", "need": 0, "lines": ["一个同事路过琴房探头问她今天怎么提前收了排练，她把琴盖合上，手上没停。", "「没事。有个人说路过，我等了他一会儿，没来，就收了。」", "她把谱子塞进包拉上拉链，从兜里掏出手机看了一眼又扣回桌上。"]}, {"title": "琴盖合上", "need": 0, "lines": ["排练时一个学生偷拍了她在弹琴的视频发班群，她没看手机，伸手把琴盖合上声音很响。", "「删了。下课。」", "她拿起谱子夹在腋下走出了琴房，门带上没锁。"]}, {"title": "走东边那条", "need": 0, "lines": ["出校门她拐向东边那条梧桐路而不是直走的大路，梧桐路要多绕五分钟但车少，她走得比平时慢。", "「这边耳朵不疼。大路上喇叭太多了。」", "她从包里掏出一颗薄荷糖剥开含着，脚步没停。"]}, {"title": "金东方琴行", "need": 0, "lines": ["她调弦时从琴盖夹层里掉出一张旧琴行收据，抬头写着金东方琴行，日期是四年前。", "「金东方琴行，南山路拐角那家。第一把琴在那买的，一千二，押了三个月伙食费才凑够。」", "她把收据塞回琴盖夹层，按上盖子坐回琴凳弹了一个和弦。"]}, {"title": "别再吹了", "need": 0, "lines": ["一个男生在琴房走廊里跟她说他上周比赛拿了区里第二名，语气很得意，她靠在门框上听完。", "「第二名。挺好。下次别跟人吹，吹多了手会抖。」", "男生走后她回琴房把门关上，从谱架底下抽出一支红笔在今天的排练备注上画了个勾。"]}, {"title": "第四遍才好", "need": 0, "lines": ["她给琴弦调音调到第三遍还差一个半音，你问她这首是不是弹了很多次才熟的，她笑了笑没接。", "「这首啊，前三年弹了上百遍都不对。后来有一天弹到第四遍突然就……算了，不说了。」", "她拨了一下高音弦听余音，把谱子翻到下一页像是要换一首。"]}, {"title": "琴房练和弦", "need": 0, "lines": ["最后一节课的学生走后，她把琴房门反锁，坐在钢琴前反复弹同一段减七和弦分解。", "「这手怎么就不听话呢。」", "她甩了甩左手手腕，从琴凳上站起来，把谱架上摊开的乐谱合上码齐。"]}, {"title": "挡回去了", "need": 0, "lines": ["她把谱子卷成筒，敲了敲你的肩膀，笑得很大声。你问她最近怎么样，她拿谱子指了指教室后排的钢琴。", "「怎么样？我今天弹了三遍《欢乐颂》，第四节课的小孩鼓掌比你还大声——你别老问这个。」", "「你要真想聊点深刻的，帮我搬琴谱架，比问'最近怎么样'有用多了。」"]}, {"title": "第二声部", "need": 0, "lines": ["她把卡农的谱子摊在琴盖上，第二声部那一行用铅笔描了又擦，纸都起了毛。", "「这一行我写过七遍。每一遍都像在等一个人先开口。」", "她把铅笔递给你，笔杆上有一圈牙印。"]}, {"title": "空琴房", "need": 0, "lines": ["下课以后琴房空着。她没有走，坐在琴凳上，把卡农弹了一遍。", "第二声部弹到一半停了，因为她要等一个不存在的人接下一句。", "「……算了。」", "她把手放回琴键，从第一小节重弹。这一次她弹得很慢，像在教一个不在场的初学者。"]}, {"title": "谱子背面", "need": 0, "lines": ["谱子的背面写满了字，都是她的字。", "「第十一首，写给还没走的人。」后面被划掉了，改成了「写给不走的人」。", "「你倒是挑一个啊。」", "她对着自己写的字说了这句，然后把谱子翻过来，扣在琴盖上。"]}], "wen": [{"title": "第三排靠窗", "need": 0, "lines": ["导播问她今晚直播要保留哪个互动话题，她翻着串场词想了一下，手指停在第三页。", "「就上次那个。第三排靠窗那位发的弹幕，剪进去。」", "她把串场词翻回第一页合上，拿起水杯喝了一口放下。"]}, {"title": "话筒推远", "need": 0, "lines": ["导播在她节目里临时插了一条她不知情的广告口播，她念完最后一句把话筒往桌上推了一截。", "「下次提前说。」", "她摘下耳机搁在话筒旁边，拉开椅子起身出了控室的门。"]}, {"title": "只喝常温", "need": 0, "lines": ["便利店冷柜前她伸手拿了一瓶常温架上的矿泉水，冷柜里的同款她看了一眼没碰。", "「凉的伤嗓子。不碰。」", "她拧开喝了一小口把瓶盖拧紧，从包里摸出耳机塞上一只。"]}, {"title": "老楼那条路", "need": 0, "lines": ["她收拾完控室从抽屉里翻出一串旧门禁卡，背面贴着一张褪色的地址贴纸。", "「最早那年台里在老楼，滨河路一百八十三号，凌晨三点下播走出来整条街一个灯都不亮。」", "她把门禁卡丢进桌上的笔筒里，拉上外套拉链起身关了控室的灯。"]}, {"title": "不用递条子", "need": 0, "lines": ["导播隔着玻璃比了个手势示意有听众打电话进来说想跟她私下聊，她按住耳麦摇了摇头。", "「不接。节目里说的够了，私下没什么好聊的。」", "她把热线按钮切回自动应答，低头翻出下一首歌的串场词在边角处补了两行字。"]}, {"title": "灯不能关", "need": 0, "lines": ["录完节目她在控室收拾东西，你问要不要帮着关灯，她伸手拦了一下又收回去。", "「……灯先别关。我坐一会儿，习惯了。」", "她把耳机挂在架子上调了调角度，拉开抽屉假装找东西。"]}, {"title": "空播控室", "need": 0, "lines": ["凌晨三点十五分节目结束，导播切了播出信号走了，她一个人坐在空了的控室里没动。", "「这屋子安静下来，比话筒里还空。」", "她把耳机挂在话筒架上，从桌上捡起那瓶只剩底的矿泉水拧开喝了一口，又拧上放回原位。"]}, {"title": "先听到她", "need": 0, "lines": ["电台在凌晨一点四十切了片头曲。你坐在她对面，她戴着耳机对着话筒说话，声音跟你白天听到的完全不一样。", "「今天有人问我，如果声音和人对不上，你到底在跟谁说话。我没答，切了首歌。」", "她摘下一侧耳机递给你，话筒还亮着红灯。"]}, {"title": "最后一次通话", "need": 0, "lines": ["节目停播前的最后一夜，热线的灯亮了一次，她接起来，没说话。", "那头也没说话。电流声持续了大约二十秒。", "「我知道是你。」", "她说完就把线挂了，然后在台本上写了一行字，写完撕掉。"]}, {"title": "四十秒", "need": 0, "lines": ["她给你听了一段没剪过的录音：说完了那句晚安之后，还有四十秒。", "四十秒里只有空调声，和一次很轻的吸气。", "「我那时候在想，有没有人在听。」"]}, {"title": "没开麦", "need": 0, "lines": ["录音间的推子全拉到底，麦克风的红灯没亮。她还是说了。", "「三、二、一——现在是凌晨一点。」", "她说完这句，停了很久，才想起来后面没有歌单。", "耳机里只有电流声。她把耳机摘下来，放在桌上，像放下一件很重的东西。"]}, {"title": "三点四十", "need": 0, "lines": ["凌晨三点四十，便利店里没有客人。她把关东煮的锅盖掀开，重新摆了一遍。", "萝卜摆左边，蛋摆右边，丸子在中间排成一排。", "「这样看着像有人来买过。」", "她说完自己笑了，笑完继续擦柜台。"]}], "xiao": [{"title": "站着说话的", "need": 0, "lines": ["中书令来殿中议事，提到城防图修订一事该交给谁，她没抬头，朱笔在折子上点了一下。", "「那个站着说话不跪的，他懂城防。让他来。」", "她搁下笔端起茶盏，没喝，搁回案上。"]}, {"title": "搁笔不批", "need": 0, "lines": ["工部送来的奏疏把城防修缮预算虚报了三成，她看了两行搁下朱笔没批，把奏疏推到案沿。", "「重算。」", "她端起茶盏喝了一口放下，拿起旁边另一份不相干的折子翻开。"]}, {"title": "朱笔搁正", "need": 0, "lines": ["批完折子她拿起案上的朱笔把笔杆转了转，搁在笔架上正中间的位置，笔尖朝外，不偏不倚。", "「笔不正，字就不正。」", "她把案上其余三支笔也归到笔架上按长短排好，起身理了理袖口。"]}, {"title": "西凉那封", "need": 0, "lines": ["她从暗格里取出一封旧信展在案上，信纸边角已经起毛，落款写着西凉都护府。", "「十二岁那年父皇送我去西凉住过八个月。这封信是那时候写的，一共寄出三封，只收到一封回来。」", "她把信折回原来的样子塞进信封，搁进暗格里合上盖板。"]}, {"title": "跪着听完", "need": 0, "lines": ["一个小吏跪在殿外禀报西南粮道又出了纰漏，话没说完就抖得结巴，她从案后看了一眼。", "「说完了再起来。说清楚哪一段、谁的差，别说废话。」", "小吏说完她拿起朱笔在折子上画了一道杠搁到案沿，那小吏伸手接了磕头退出去。"]}, {"title": "那条路没人", "need": 0, "lines": ["你陪她在殿前看城防图，指到北段那条标注了加强巡逻的路，她忽然不说话了。", "「那条路……上次走的人，就没回来过。这事先搁着。」", "她把城防图卷起来塞进暗格，拿起旁边一份不相干的奏疏翻开。"]}, {"title": "独坐偏殿", "need": 0, "lines": ["散了朝所有内侍退到殿外候着，她一个人坐在偏殿案前，面前摊着一张还没批的城防图。", "「这条线，到底该不该动。」", "她拿起朱笔在城防图北段画了个圈，搁笔，把图卷起来塞进暗格里。"]}, {"title": "平身说话", "need": 0, "lines": ["她批完最后一道折子搁笔，没叫你起。你站了半盏茶，她才抬眼看你，把刚批的公文推到桌沿。", "「这篇是你写的？站着说，哪里该改、哪里你不服，一个一个讲。」", "「别跪着回话，跪着说不出真心话。」"]}, {"title": "字迹", "need": 0, "lines": ["她把《河渠志》摊开，指给你看批注：同一页上，两种字迹，一种是你抄的，一种是她改的。", "「你抄的这一段，把『溺』写成了『没』。」", "她说完自己先笑了，笑得很轻，像怕被外面听见。"]}, {"title": "折子", "need": 0, "lines": ["夜里，书房只剩她一个人。半尺高的折子摊在案上，一封也没批。", "朱笔插在笔山里，笔尖早就干了。她伸手试了试，又收回去。", "「这些人，写这么长做什么。」", "她把最上面一封折子合上，压平，再合上下面一封。一叠折子被码得很齐。"]}, {"title": "火", "need": 0, "lines": ["她一个人走到东边的偏殿。十岁那年，这扇门是从外面锁上的。", "现在门是开的，里面住着两个扫洒的小太监，睡得很沉。", "「……睡吧。」", "她在门口站了很久，然后把门轻轻带上，没有锁。"]}], "lu": [{"title": "那人答得出", "need": 0, "lines": ["同僚问她手上这桩走私案要不要请外援帮忙查勘现场，她把卷宗翻到某一页停住。", "「不用。上次那个来过一趟，他答得出路引上的问题。」", "她合上卷宗锁进柜子，把钥匙挂回腰间没多解释。"]}, {"title": "卷宗合上", "need": 0, "lines": ["同僚当着她的面把一桩她查了两月的案子直接报到上峰领了功，她听完没接话，把桌上摊开的卷宗合上。", "「行。」", "她把卷宗锁进柜子收了钥匙，起身倒了一杯凉茶没喝。"]}, {"title": "左手执笔", "need": 0, "lines": ["写案卷时她习惯用左手执笔，同僚问过一次，她没解释，只是换右手写了两个字又换回来。", "「左手写的没人认得出是谁的笔迹。」", "她蘸了墨把最后一行誊完，搁笔吹了吹墨迹合上卷宗。"]}, {"title": "渡口收卷人", "need": 0, "lines": ["她从官帽内侧取下一根旧簪子搁在桌上，簪头磨得发亮，是竹制的不是银的。", "「十八岁那年从洪州渡口上的船，身上只带了三十文盘缠和一个竹簪。收卷的人问我姓什么，我说姓陆。」", "她把簪子重新别回头发里，拉正官帽起身把案上的文书码齐。"]}, {"title": "验过了", "need": 0, "lines": ["仵作把验尸格目递上来，指着一处淤痕问她要不要加注，她接过去看了一眼。", "「验过了。这痕是死后压的，不是伤。照实写，别加。」", "她把格目还给仵作，拉了拉官袖袖口，转身往签押房走。"]}, {"title": "袖口那道痕", "need": 0, "lines": ["她挽袖洗手时你瞥见她小臂内侧有一道旧痕，多看了一眼，她把袖子放下来速度很快。", "「……旧伤。查案子时候留的，不碍事。你别提。」", "她拉正官袖把袖口拢紧，拿起桌上的笔在一份空白文书上写了两个字又划掉。"]}, {"title": "换装那刻", "need": 0, "lines": ["值夜结束后她回到值房闩上门，松了官帽束带，对着铜镜把白天束紧的头发散下来。", "「明天还得再勒一天。」", "她从袖中掏出一面小镜塞进柜子底层，把明日要用的案卷摞到桌面最顺手的位置。"]}, {"title": "灯", "need": 0, "lines": ["值夜那晚，刑部的灯只亮了两盏。她把她那盏挪到你们两张案中间。", "「这样省油。」", "后来你发现，她的案离灯比你的案远。再后来你发现，那盏灯的灯芯是新的——她换过，因为你说过这灯太暗。"]}, {"title": "算稿", "need": 0, "lines": ["散衙以后，她从怀里摸出一册旧算稿，纸边已经磨得发白。", "那是她父亲的字，一笔一划都很慢，像怕写错。她用手指描了一遍。", "「我没给你丢人。」", "说完她把算稿收回去，压在心口的位置，压了一会儿。"]}, {"title": "官帽", "need": 0, "lines": ["上奏前一夜，她一个人坐在案前，官帽摆在对面。", "那是顶六品的旧帽子，帽翅有点歪，她自己缝过。", "「戴了三年，还不知道该不该还回去。」", "她把帽子拿起来，戴好，对着灯坐了很久，没有摘。"]}], "shen": [{"title": "那笔记着呢", "need": 0, "lines": ["布铺的伙计问上个月那笔垫付的货款要不要催，她翻开账册指了其中一行。", "「不催。那笔我记着呢。到时候他自己会来对账。」", "她把账册翻到下一页接着拨算盘，手指在那行底下多划了一道。"]}, {"title": "算盘停了", "need": 0, "lines": ["一个供货商送来的布比样品短了半尺还按原价收钱，她拨算盘的手停了，珠子搁在档上没归零。", "「退回去。」", "她把那匹布从柜台上拎起来搁回供货商脚边，坐回去翻开了账簿。"]}, {"title": "算盘放左", "need": 0, "lines": ["每天开铺她做的第一件事是把算盘从柜台右边挪到左边，账簿放在算盘右手边，铜板匣子在最远端。", "「左手拨珠子顺，右手翻页，不用换手。不顺手的改到顺手。」", "她把算盘珠子归零拨齐，翻开账簿第一页开始核昨天的流水。"]}, {"title": "半匹素绢", "need": 0, "lines": ["她从柜台底下翻出一块叠得整齐的素绢，绢面绣着半个没完成的花样，针脚断了。", "「这是十四岁那年绣的。在沈家后院西厢房，绣到一半被人叫走，后来再没补完。素绢半匹，绣了两天。」", "她把素绢重新叠好塞回柜台底层，拿起算盘拨了两下今天最后一笔账。"]}, {"title": "不抹零", "need": 0, "lines": ["一个买布的妇人挑了三匹绸，结账时说零头抹了算整数，她拨了两下算盘抬起头。", "「零头七文。七文也是钱。不抹。」", "妇人掏出铜板数够搁在柜台上，她一枚一枚拨进钱匣，在账簿上记了数目。"]}, {"title": "不是我的", "need": 0, "lines": ["她翻铺子的流水账翻到某一页停住了，你问是不是哪笔有问题，她没抬头。", "「这本账不是我的。是……别人留下的。我一直替他记着。」", "她合上账簿塞进柜台最底层，拿了一本新的翻开从头开始写第一行。"]}, {"title": "盘今天的账", "need": 0, "lines": ["布铺打烊后伙计走了，她坐在柜台后面拨算盘，把今天的流水和赊账逐条核对。", "「这笔赊的忘了记日期。」", "她拿起笔在赊账簿那一行旁边补了个日子，把算盘推到一旁，起身去关门板。"]}, {"title": "记在册上", "need": 0, "lines": ["她把账册翻开，用指甲在某一行底下划了道印子，册子转向你。你看见那行写着你的名字和一笔数目。", "「这是你垫的。我记了。年底结清。」", "「多一个铜板我不要，少一个铜板你别想。」"]}, {"title": "盘货", "need": 0, "lines": ["月底盘货那晚，她把所有布卷都搬到案上，一卷一卷点数。", "点到一匹青布时，她停下来，用指甲刮了刮布边。", "「这匹潮了。」", "她把那匹抽出来，放到自己脚边，继续点下一卷。", "你数到最后一卷，她已经把脚边堆了一小摞。"]}, {"title": "最后一页", "need": 0, "lines": ["账本的最后一页是空的。她翻到那儿，停了一下。", "前面每一页都写满了：米、布、银，连两匹绢的颜色都注了。只有这最后一页，什么都没写。", "「我娘说，账要留一页空的。」", "「留给还没发生的事。」", "她把笔搁在那一页上，没有写。"]}], "jian": [{"title": "旁边那个座", "need": 0, "lines": ["班主任调座位时问她对调到第一排有什么意见，她把书包甩到新桌上没抬头。", "「没意见。旁边那个座空着也行，反正他不常来。」", "她拉开椅子坐下把错题本翻开放在桌上，往旁边空座位的桌角看了一眼。"]}, {"title": "笔袋拉上", "need": 0, "lines": ["有人趁她不在翻了她桌上的错题本还拿走了夹在里面的志愿草表，她回来发现本子摊着，拉链拉开着。", "「谁翻的。」", "她把错题本塞进书包最底层拉上拉链，把笔袋也收了塞进去。"]}, {"title": "蓝笔不黑笔", "need": 0, "lines": ["她从笔袋里倒出五支笔，把三支黑色的推到一边，留两支蓝色的在桌面上，黑色那三支塞回笔袋底层。", "「蓝笔写卷子老师看得清。黑笔写错了老师也看不清改没改。」", "她拧开一支蓝笔在草稿纸角上画了两道试出水，把另一支备用蓝笔搁在笔袋口。"]}, {"title": "小卖部那条", "need": 0, "lines": ["她从笔袋底部摸出一张旧照片翻过来，背面写着光明路小学六年三班，日期是六年前。", "「小学门口那条光明路有个小卖部，辣条一毛钱一根，我那时候一天买两根，攒了一个月请人吃了根冰棍。」", "她把照片塞回笔袋底部，拉上拉链把错题本翻到新的一页。"]}, {"title": "借什么橡皮", "need": 0, "lines": ["前排一个女生回头说想借她的橡皮，她手捂着错题本看了一眼那女生的桌面。", "「桌上不是还有一块？比这块还新。不借。」", "那女生转回去了，她把橡皮塞进笔袋拉上拉链，低头接着算第三道大题。"]}, {"title": "填了才算", "need": 0, "lines": ["她趴在桌上填志愿表填到第二栏停了笔，你问她卡什么了，她拿笔帽敲了两下桌面。", "「……填了的才算数。没填的那个不算，对吧。」", "她把志愿表折了两折塞进书包夹层，从抽屉里翻出一套数学卷子铺在桌上。"]}, {"title": "一个人刷题", "need": 0, "lines": ["晚自习后教室空了，她把课桌上的练习册摞成一摞挡住脸，从底下抽出一套数学卷子。", "「最后这道大题怎么又是对的，答案印错了吧。」", "她翻到答案页看了两遍，把卷子折成四折塞进书包夹层，趴在桌上闭了眼。" function makeOutline(){
  const SEEDS=['雨','台风','月考','家长会','停电','夜自习','剪头发','体检','生日','搬家','感冒','旧同学'];
  const used=JSON.parse(localStorage.getItem('jieyu.seeds')||'[]');
  const pool=SEEDS.filter(x=>!used.includes(x));
  const seed=pool.length?pool[Math.floor(Math.random()*pool.length)]:SEEDS[0];
  localStorage.setItem('jieyu.seeds',JSON.stringify(used.concat([seed]).slice(-8)));
  const out=[{t:seed+'（本局的引子）',done:false}];
  const beats=[]; Object.keys(SCENES).forEach(ch=>SCENES[ch].forEach(b=>{ if(b.route===CUR) beats.push(b); }));
  for(let i=beats.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[beats[i],beats[j]]=[beats[j],beats[i]];}
  beats.slice(0,4).forEach(b=>out.push({t:b.beat.slice(0,42),id:b.id,done:false}));
  return out;
}

const TIERS={                    // 基线（未乘系数）；台词只按字数，不问句数
  short:{say:55, nar:70,  seg:1},
  mid:  {say:110,nar:150, seg:2},
  long: {say:190,nar:260, seg:3}
};
function pickTier(text){
  const t=String(text||'');
  const soft=/转学|离开|走|分手|喜欢|爱|表白|吵架|滚|别管|死|病|家|妈|爸|哭|对不起|谢谢|再见/;
  const emo=/[!！?？]{2,}|累|难受|害怕|心疼|生气|难过|不想/;
  let tier='short';
  if(emo.test(t)||t.length>26) tier='mid';
  if(soft.test(t)) tier='long';
  if(S.stage==='交心'||S.stage==='不可替代'){ if(tier==='short') tier='mid'; }
  return tier;
}
function targetLen(text){
  const tier=pickTier(text);
  const base=TIERS[tier];
  const k=VERBOSITY[CUR]||0.8;
  const say=Math.max(12, Math.round(base.say*k));       // 系数只作用于台词总字数
  return {tier, say, nar:base.nar, seg:base.seg};
}

function parseSections(all){
  const pick=(tag)=>{
    const re=new RegExp('<'+tag+'>([\\s\\S]*?)(?:</'+tag+'>|$)');
    const m=all.match(re); return m?m[1].replace(/<[^>]*>/g,'').trim():'';
  };
  let nar=pick('nar'), say=pick('say'), act=pick('act');
  if(!say){ // 容错 1：模型用了 [SAY]/[SA] 之类前缀
    const m=all.match(/\[S[^\]]*\]([\s\S]*?)(?=\[A|\[META|$)/);
    if(m) say=m[1].replace(/\[[^\]]*\]/g,'').trim();
  }
  if(!say){ // 容错 2：从中文双引号里抽台词
    const q=all.match(/[“"]([^”"]{2,300})[”"]/g);
    if(q) say=q.map(x=>x.slice(1,-1)).join(' ');
  }
  if(!nar){ // 容错 3：引号之外的文字当叙述
    const cleaned=all.replace(/<[^>]*>/g,'').replace(/\{[\s\S]*\}/g,'')
      .replace(/[“"][^”"]*[”"]/g,'').replace(/\[[A-Z]+[^\]]*\]/g,'').trim();
    if(cleaned) nar=cleaned;
  }
  let meta={};
  const mt=all.match(/<meta>([\s\S]*?)(?:<\/meta>|$)/);
  const src=mt?mt[1]:(all.match(/\{[\s\S]*\}/)||[''])[0];
  try{ const i=src.indexOf('{'), j=src.lastIndexOf('}'); meta=JSON.parse(src.slice(i,j+1)); }catch(e){ meta={}; }
  return {nar,say,act,meta};
}
async function callTurnStream(text, onSections){
  if(MODE==='server'){ return await callTurn(text); }
  if(!KEY) throw new Error('还没填 key（我的 → API key）');
  const body={model:SET.api.model,temperature:0.95,max_tokens:SET.reply,stream:true,
    messages:[{role:'system',content:sysPrompt(text)+STREAM_RULES},{role:'user',content:'读者说／做：'+text}]};
  const r=await fetch(SET.api.base,{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},body:JSON.stringify(body)});
  if(!r.ok){ const map={401:'key 无效或已失效',402:'余额不足',429:'请求太频繁'};
    throw new Error(map[r.status]||('接口 '+r.status)); }
  const reader=r.body.getReader(); const dec=new TextDecoder();
  let buf='', all='';
  while(true){
    const {value,done}=await reader.read(); if(done) break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n'); buf=lines.pop();
    let got=false;
    for(const line of lines){
      const t=line.trim(); if(!t.startsWith('data:')) continue;
      const p=t.slice(5).trim(); if(p==='[DONE]') continue;
      try{ const j=JSON.parse(p); const d=(j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content)||'';
        if(d){ all+=d; got=true; } }catch(e){}
    }
    if(got){ const sec=parseSections(all); onSections(sec); }
  }
  let sec=parseSections(all);
  // 复核：模型自报 short/mid/long，程序核对字数是否落在该档区间，偏了就让模型按目标重写一次
  const T2=targetLen(text);
  const BAND={short:0,mid:0,long:0, _t:T2.say};               // 台词：围绕目标 ±60%
  const NBAND={short:[30,120],mid:[80,260],long:[160,460]};   // 叙述字数区间
  {
    const cls=(sec.meta&&sec.meta.len)||'';
    const chars=(sec.say||'').replace(/[“”「」\s]/g,'').length;   // 只数台词
    const nchars=(sec.nar||'').length;
    if(BAND[cls]){
      const tgt=BAND._t; const lo=Math.round(tgt*0.6), hi=Math.round(tgt*1.6);
      const nb=NBAND[cls]||[0,9999];
      const badSay=(chars<lo || chars>hi);
      const badNar=(nchars<nb[0]*0.75 || nchars>nb[1]*1.4);
      if(badSay||badNar){
        try{
          const target=tgt;
          const r3=await fetch(SET.api.base,{method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},
            body:JSON.stringify({model:SET.api.model,temperature:0.9,max_tokens:SET.reply,
              messages:[{role:'system',content:sysPrompt(text)+STREAM_RULES},
                        {role:'user',content:'读者说／做：'+text},
                        {role:'assistant',content:'<nar>'+(sec.nar||'')+'</nar><say>'+(sec.say||'')+'</say>'},
                        {role:'user',content:'这一版台词 '+chars+' 字（目标 '+lo+'-'+hi+'）、叙述 '+nchars+' 字（目标 '+nb[0]+'-'+nb[1]+'）。保持同样的内容与语气，把不足的补足、超出的压缩，再输出一次，仍用四个标签。'}]})});
          const j3=await r3.json(); const fix=parseSections(j3.choices[0].message.content||'');
          if(fix.nar||fix.say){ sec={...sec, nar:fix.nar||sec.nar, say:fix.say||sec.say, act:fix.act||sec.act,
                                    meta:{...sec.meta, ...(fix.meta||{}), repaired:true}}; onSections(sec); }
        }catch(e){}
      }
    }
  }
  try{
    const L=(sec.meta&&sec.meta.len)||'';
    const chars=(sec.nar||'').length + (sec.say||'').length;
    S.lastLen={len:L, why:(sec.meta&&sec.meta.why)||'', chars, cap:SET.reply};
  }catch(e){}
  if(!sec.nar){   // 叙述缺失就补一次（只补叙述，很便宜）
    try{
      const t2=targetLen(text);
      const r2=await fetch(SET.api.base,{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},
        body:JSON.stringify({model:SET.api.model,temperature:0.9,max_tokens:400,
          messages:[{role:'system',content:'写一段小说叙述（'+t2.nar+'字，2 段）：先写环境，再写这个人的动作。不要对白，不要解释。只输出 <nar>…</nar>'},
                    {role:'user',content:'场景：'+(S.chapter||'')+'；刚才发生：'+(sec.say||'')}]})});
      const j2=await r2.json();
      const extra=parseSections(j2.choices[0].message.content||'');
      if(extra.nar){ sec.nar=extra.nar; onSections(sec); }
    }catch(e){}
  }
  return {nar:sec.nar, say:sec.say, act:sec.act, ...sec.meta};
}
async function sendTurn(text){
  if(busy||!text.trim()||!CUR) return;
  busy=true; $('send').disabled=true;
  bubble('me', text.replace(/[<>]/g,''));
  INP.value=''; $('choices').innerHTML='';
  let d;
  const narBox=document.createElement('div'); narBox.className='nar'; narBox.style.display='none';
  const herBox=document.createElement('div'); herBox.className='b her'; herBox.style.display='none';
  const actBox=document.createElement('div'); actBox.className='nar'; actBox.style.display='none';
  $('log').appendChild(narBox); $('log').appendChild(herBox); $('log').appendChild(actBox);
  const onSec=sec=>{
    if(sec.nar){ narBox.style.display=''; narBox.textContent=sec.nar; }
    if(sec.say){ herBox.style.display=''; herBox.textContent=sec.say; }
    if(sec.act){ actBox.style.display=''; actBox.textContent=sec.act; }
    $('log').scrollTop=1e9;
  };
  try{ d=await callTurnStream(text, onSec); }
  catch(e){
    const raw=String(e && e.message || e);
    const friendly = /Load failed|Failed to fetch|NetworkError|network/i.test(raw)
      ? '网络没能连上模型接口。常见原因：① 开着代理/加速器但节点不通（最常见）② 断网 ③ 浏览器拦了跨域请求。\n先关掉代理再点发送；还不行就换 Wi-Fi / 用离线版 index.html。'
      : ('请求失败：' + raw + '\n如果反复出现，检查「我的 → API key」和余额。');
    narBox.style.display='none'; herBox.style.display='';
    herBox.innerHTML='<span style="color:#d98b7a">'+friendly.replace(/\n/g,'<br>')+'</span>';
    actBox.style.display='none'; busy=false; $('send').disabled=false;
    return;
  }
  narBox.textContent=(d.nar||narTxt); if(narBox.textContent) narBox.style.display='';
  const _s=(d.say||sayTxt||'……');
  herBox.textContent=(/^[“"「]/.test(_s)?_s:'“'+_s+'”');
  if(d.act){ actBox.textContent=d.act; actBox.style.display=''; } else actBox.style.display='none';
  if(d.advance){ const ad=document.createElement('div'); ad.className='adv'; ad.textContent='剧情：'+d.advance; $('log').appendChild(ad); }

  S.aff=Math.max(-20,Math.min(40,S.aff+Number(d.aff||0)));
  S.trust=Math.max(-20,Math.min(40,S.trust+Number(d.trust||0)));
  S.turns.push(text); S.turns.push((CHARS[CUR].name)+'：'+(d.say||''));
  if(d.memory) S.facts.push(d.memory);
  if(d.advance) S.log=S.log.concat([d.advance]).slice(-12);
  S.uturns=(S.uturns||0)+1; if(!(d.state&&d.state.chapter)) clientAdvance();
  if(d.open_thread) S.threads=S.threads.concat([d.open_thread]).slice(-4);
  if(d.close_thread) S.threads=S.threads.filter(x=>!String(x).includes(d.close_thread));
  if(d.outline_hit && S.outline[d.outline_hit-1]) S.outline[d.outline_hit-1].done=true;
  countHits((d.nar||'')+' '+(d.say||'')+' '+(d.act||''));
  S.stage = S.aff>=25||S.turns.length/2>=20 ? '不可替代' : S.aff>=15||S.turns.length/2>=14 ? '交心' : S.aff>=5||S.turns.length/2>=8 ? '熟人':'陌生';
  S.at=Date.now();
  putS(CUR,S);
  (d.choices||[]).forEach(c=>{ const b=document.createElement('button'); b.textContent=c; b.onclick=()=>sendTurn(c); $('choices').appendChild(b); });
  busy=false; $('send').disabled=false; $('log').scrollTop=1e9;
  if((S.turns.length/2)>=24||S.aff>=25||S.aff<=-6) await endGame();
}

function importSaves(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files && inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{

        const cur=JSON.parse(localStorage.getItem('jieyu.sessions')||'{}');
        let n=0;

        toast('已导入 '+n+' 条存档'); closeSheet(); renderHome();

function speakLine(text){
  if(!SET.read || !window.speechSynthesis || !text) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text).replace(/[“”"]/g,''));
    u.lang='zh-CN'; u.rate=0.95; u.pitch=1.02;
    const vs=speechSynthesis.getVoices().filter(v=>/zh/i.test(v.lang));
    if(vs.length) u.voice=vs[0];
    speechSynthesis.speak(u);
  }catch(e){}
}


function clientAdvance(){
  const chs=Object.keys(SCENES).filter(ch=>SCENES[ch].some(b=>b.route===CUR));
  if(!chs.length) return;
  const beatsOf=ch=>SCENES[ch].filter(b=>b.route===CUR);
  const total=chs.reduce((n,ch)=>n+beatsOf(ch).length,0)||1;
  let idx=Math.floor((S.uturns||0)*total/24), i=0;
  while(i+1<chs.length && idx>=beatsOf(chs[i]).length){ idx-=beatsOf(chs[i]).length; i++; }
  S.chapter=chs[i];
  const bs=beatsOf(chs[i]);
  S.beat = bs.length? bs[Math.max(0,Math.min(idx,bs.length-1))].beat : '';
}

    document.body.appendChild(t); }

}

async function endGame(){
  if(S.ended) return;
  S.ended=true; putS(CUR,S);
  const tier = S.aff>=25&&S.trust>=10?'A 走成了':S.aff>=15?'B 差一步':S.aff>=5?'C 停在原地':'D 散了';
  let title='结局', body='';
  const fixed=((AUTHORED||{})[CUR]||{})[tier[0]];
  if(fixed && fixed.text){
    S.endText=fixed.text; S.endTitle=fixed.title||title; S.endTier=tier; putS(CUR,S);
    const cc=document.createElement('div'); cc.className='endcard';
    cc.innerHTML='<div class="eth">'+(fixed.title||title)+' · '+tier+'</div><div class="eb">'+fixed.text+'</div>';
    $('log').appendChild(cc); $('log').scrollTop=1e9;
    $('send').disabled=true; $('inp').disabled=true; $('inp').placeholder='这一局结束了，返回首页开始新的';
    const ag=document.createElement('button'); ag.className='btn'; ag.textContent='用这个人再开一局';
    ag.onclick=()=>{ delS(CUR); const r=CUR; S=blank(r); openChat(r); };
    $('choices').innerHTML=''; $('choices').appendChild(ag);
    return;
  }
  try{
    if(MODE==='server'){
      const r=await fetch('/api/ending?session='+CUR); const e=await r.json();
      title=e.title||title; body=e.ending||'';
    }else{
      const ask='你在写一部中文互动小说的结局。角色：'+CHARS[CUR].name+'。已知：好感'+S.aff+'，信任'+S.trust+'，阶段'+S.stage
        +'，未解线索：'+((S.threads||[]).join('；')||'无')+'；剧情年表：'+((S.log||[]).slice(-6).join('；')||'无')
        +'；请写结局：'+tier+'。120-180字，纯叙述，必须回应至少一条线索，落在一个具体物件上。只输出 JSON：{"title":"4-8字","ending":"…"}';
      const r=await fetch(SET.api.base,{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},
        body:JSON.stringify({model:SET.api.model,temperature:0.95,max_tokens:600,
          messages:[{role:'system',content:ask},{role:'user',content:'写结局'}]})});
      const d=await r.json(); let s=d.choices[0].message.content.trim();
      if(s.startsWith('```')) s=s.split('```')[1].replace(/^json/,'').trim();
      const i=s.indexOf('{'),j=s.lastIndexOf('}'); if(i>=0&&j>i) s=s.slice(i,j+1);
      const o=JSON.parse(s); title=o.title||title; body=o.ending||'';
    }
  }catch(e){ body='（结局没能生成：'+e.message+'）'; }
  S.endText=body; S.endTitle=title; S.endTier=tier; putS(CUR,S);
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+title+' · '+tier+'</div><div class="eb">'+body+'</div>';
  $('log').appendChild(card); $('log').scrollTop=1e9;
  $('send').disabled=true; $('inp').disabled=true; $('inp').placeholder='这一局结束了，返回首页开始新的';
  const again=document.createElement('button'); again.className='btn'; again.textContent='用这个人再开一局';
  again.onclick=()=>{ delS(CUR); const r=CUR; S=blank(r); openChat(r); $('send').disabled=false; $('inp').disabled=false; $('inp').placeholder='（动作）「台词」'; };
  $('choices').innerHTML=''; $('choices').appendChild(again);
}
