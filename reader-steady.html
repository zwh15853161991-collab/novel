<script>
const D={"name": "温叙", "meta": "29 · 旧照相馆老板", "premise": "柜台玻璃下压着泛黄底片，暗房的红灯还亮着。你把要找的照片说给温叙听，他没有先问太多理由，只答应进去找。旧店的东西还在，经营它的人已经不同。", "world": "老城巷子里的照相馆，暗房的红灯常年亮着。柜台玻璃下面压着一层旧底片，边角泛黄。", "chapters": [{"title": "第一章 显影液", "scenes": [{"lines": [["nar", "柜台玻璃下压着一张褪色价目表，“证件照 八元”，边角卷起来，下面还压着半张红纸。 "], ["say", "他掀开布帘，回头说：“你需要的话，我帮你找。”"], ["nar", "暗房的蓝布帘落回去，门缝里漏出一道红光，帘布晃了两下。 "], ["nar", "里面传来抽屉拉开的声音，接着是玻璃片碰玻璃片的轻响，一下，又一下。 "], ["say", "他隔着帘子说：“灯在门边，自己开。”"]], "choices": ["跟着进去", "在柜台等", "（问他要多久）"], "n": 1, "fx": [0, 1, 1]}, {"lines": [["nar", "红灯挂在头顶，他左手捏着底片边缘，一张一张举到灯下，眯起眼，指尖没碰到画面。 "], ["say", "“十几年前的底片，按年份排，中间搬过一次库房。”"], ["nar", "他把一张底片递过来，捏着边角，停在半空，等这边接上。 "], ["say", "“你看看，是不是这张。”"], ["nar", "红灯把他的影子投在药水盘边上，盘里的显影液晃了一下，又静下来。 "]], "choices": ["问他怎么记得", "（帮他举灯）", "说不用这么麻烦"], "n": 2, "fx": [1, 1, 0]}, {"lines": [["nar", "他揭开相纸，浸进药水里，白色慢慢泛出灰，灰里又浮出轮廓。 "], ["say", "“好了。”他把湿相纸夹起来，挂在绳上，又从药水盘里提起另一张。 "], ["nar", "两张并排挂着，水珠顺着纸角往下掉，在水泥地上洇出两个深点。 "], ["say", "“这张多洗的，不收钱。”"], ["nar", "他拿夹子把照片翻了个面，背面朝上，压在玻璃板上。 "]], "choices": ["问为什么多一张", "说谢谢", "（看那张多出来的）"], "n": 3, "fx": [1, 1, 1]}, {"lines": [["nar", "他从抽屉里摸出一把铜钥匙，钥匙柄上系着一段褪色的红绳，绳结磨得起毛。 "], ["say", "“店门的备用钥匙。你要找的那张底片，我留着，万一你还要洗。”"], ["nar", "钥匙在他掌心放了放，递过来，铜面被磨得发亮，齿口有些发乌。 "], ["nar", "柜台上的台灯没关，光落在钥匙齿上，把齿纹照得很清楚。 "]], "choices": ["说不用", "收下", "（问这是干嘛）"], "n": 4, "fx": [0, 0, 1]}, {"lines": [["nar", "墙上挂着旧招牌，白底红字，边角掉了漆，“工农兵照相”几个字只剩轮廓。 "], ["say", "“这店以前不是你的。”"], ["nar", "他顺着看过去，伸手把招牌扶正了一点，钉子松了，牌子又歪回去。 "], ["say", "“老周年纪大了，我接过来，底片一张没扔。”"]], "choices": ["问他为什么接", "说这店挺好", "（看墙上的旧招牌）"], "n": 5, "fx": [1, 0, 1]}, {"lines": [["nar", "卷帘门拉下来，锁扣咔的一声。巷子里的路灯坏了一盏，另一盏照着半截路面，光里飞着细小的虫。 "], ["say", "他站在亮处那截，抬了抬下巴：“前面就是大路。”"], ["nar", "他把口袋里的钥匙串按静了，往墙边退了半步，没再往前走。 "], ["say", "“就送到这儿吧。”他又说，“照片拿好，别弯着。”"], ["nar", "坏掉的路灯底下，他的影子只剩一个模糊的轮廓，很快融进墙根的黑里。 "]], "choices": ["让他回去", "说路上小心", "（并肩走完）"], "n": 6, "fx": [0, 0, 0]}]}, {"title": "第二章 你需要的话", "scenes": [{"lines": [["nar", "雨从傍晚下到路灯亮起来，巷口梧桐叶翻着白面。楼下站着一个人，伞撑得很稳。"], ["nar", "温叙站在灯下，伞柄搁在肩头，另一只手插在兜里。台阶边沿排着三根烟头，雨水漫过他的鞋底。"], ["say", "“下来了。”"], ["nar", "他把伞往前递了递，手机屏幕在口袋里亮了一下，没拨出去的电话还留在上面。"], ["say", "“你没带伞吧。”"]], "choices": ["问他等多久了", "说以后别等", "（把伞接过来）"], "n": 7, "fx": [1, 1, 0]}, {"lines": [["nar", "办公楼只剩三层还亮着灯。对面路边停着一辆灰色面包车，驾驶窗摇下来一半。"], ["nar", "温叙靠在座椅上，仪表盘的光照着他下巴。副驾座位上放着一个塑料袋，里面两个饭盒叠在一起。"], ["say", "“刚关火，还热着。”"], ["nar", "他伸手把副驾车门推开，门缝里的路灯照进来一条光。"], ["nar", "面包车引擎一直没熄，排气管在冷空气里冒白烟。"]], "choices": ["上车", "说不用送", "（发消息让他先走）"], "n": 8, "fx": [0, 0, 0]}, {"lines": [["nar", "照相馆门口，同事小陈拎着一袋底片走过来，看了看温叙，又看了看你。"], ["say", "“温老板，你们这是……”"], ["nar", "温叙把手里那杯豆浆递过来，没接话。他的袖口沾着一点显影液的痕迹。"], ["nar", "小陈笑了一声，把底片放在柜台上，退出去时回头看了一下。"], ["nar", "温叙转过身去挂墙上的照片，梯子挪了半尺，什么也没说。"]], "choices": ["解释", "看他反应", "（不解释）"], "n": 9, "fx": [0, 1, 0]}, {"lines": [["nar", "照相馆的卷帘门拉到底，门口堆着两份报纸，塑料包装上沾着雨水干后的灰点。"], ["nar", "隔壁杂货铺的老板娘探出头来，说两天没见人开门了。"], ["nar", "卷帘门底缝里透出一点光，又灭了。"], ["nar", "门后面传来一声咳嗽，闷在墙壁里。"], ["say", "“店门开着，人不在。”你在门口喊了一声，暗房里传来一句：等我把这卷冲完。"], ["nar", "报纸第三份塞进门缝的时候，被从里面顶了一下，又停住了。"]], "choices": ["去敲门", "打电话", "（买药放门口）"], "n": 10, "fx": [0, 0, 0]}, {"lines": [["nar", "柜台上的台灯照着两杯凉透的茶。你说完那句话，手在杯沿上转了一圈。"], ["nar", "温叙把手里的底片夹放下，胶片在灯下晃了一下。他站起来走到里屋门口，停了两秒。"], ["nar", "他拿起抹布擦柜台，从这头擦到那头，又擦回来。"], ["say", "“照片还没找到。”"], ["nar", "他把抹布叠好放在水池边上，站了一会儿，又拿起另一块干布。"]], "choices": ["问他想什么", "说只是考虑", "（把话说完）"], "n": 11, "fx": [1, 0, 0]}, {"lines": [["nar", "房东在店门口提高了声音，手点着门框上的旧漆皮，说合同上写得明明白白。"], ["nar", "温叙从柜台后面走出来，站在你和房东中间，手插在外套兜里。"], ["say", "“她的事跟我说。”"], ["nar", "房东愣了一下，嗓门降了半截，温叙把桌上的合同拿起来翻到最后一页。"], ["nar", "他指了指付款日期那行，把纸转过去给房东看，肩膀一直没让开。"]], "choices": ["问为什么管", "说谢谢", "（帮他收拾残局）"], "n": 12, "fx": [1, 1, 1]}]}, {"title": "第三章 我该走了", "scenes": [{"lines": [["nar", "柜台上那盏台灯罩着一层灰。他把灯罩掀开，用袖口擦灯管。"], ["say", "“我爸那边店没人看了，上个月摔了一跤，腿脚不利索。”"], ["nar", "他把灯管装回去，按下开关，光落在柜台里一排没取走的相袋上，塑料袋边缘卷着毛边。"], ["say", "“下礼拜把这边收了，过去。”"], ["nar", "他说完在裤子上蹭了蹭手，没抬头看我，弯腰去搬脚边那个压扁了的纸箱。"]], "choices": ["问什么时候走", "说想留下就留下", "（不接话）"], "n": 13, "fx": [1, 1, 0]}, {"lines": [["nar", "他从柜底抽出一本蓝布面相册，边角磨得发白，往我这边推了半尺。"], ["say", "“这个一直搁在最里头那格。上回你来，我没找着。”"], ["nar", "相册停在我手边，布面上有一道浅浅的折痕，是常年被人翻开又合上的样子。"], ["nar", "他的手指还搭在封面上，过了一会儿才收回去，顺手把台灯往我这边挪了挪。"]], "choices": ["翻开", "问里面是什么", "（先推回去）"], "n": 14, "fx": [0, 1, 0]}, {"lines": [["nar", "他把最后一格抽屉腾空，里面的回形针、橡皮筋倒进铁盒，哗啦一声。"], ["say", "“照片的事我托了西街老陈，他那边还留着底片柜。”"], ["nar", "铁盒盖扣上，他用手掌压了压，把翘起来的一角压平。"], ["say", "“你需要的话，我帮你找。”"], ["nar", "门外收废品的喇叭声从街这头拖到那头，慢慢远了，屋里只剩下铁盒在柜面上滑动的声音。"]], "choices": ["说我不需要", "问他你需要吗", "（沉默）"], "n": 15, "fx": [0, 1, 0]}, {"lines": [["nar", "梯子架在门框边，他踩到第三格。旧招牌的螺丝锈住了，每拧一下都发出一声钝响。"], ["nar", "巷口的风把拆开的纸箱吹得贴着墙跑，我用脚踩住一个，鞋底在纸板上留下湿印子。"], ["say", "“这块木头是我爸那会儿自己刨的，字是请人写的，一横一竖都实在。”"], ["nar", "招牌取下来斜靠在梯脚，背面一层水渍，边沿的漆翘起来，翘成一圈一圈的薄片。"]], "choices": ["帮他扶梯子", "问招牌要不要", "（站在巷口看）"], "n": 16, "fx": [1, 1, 1]}, {"lines": [["nar", "货车装了半车，他坐进驾驶室，钥匙拧了两回才打着火。"], ["nar", "车窗降下来一截，他探出半个肩膀，手搭在窗框上，指节上还沾着拆招牌时蹭的锈灰。"], ["say", "“底片要是真没了，我照你那张重新洗一张，洗好了给你寄。”"], ["nar", "车往前挪了半个车身，又停住，排气管在巷子里冒出一小股白烟。"]], "choices": ["走上前", "站在原地", "（挥手）"], "n": 17, "fx": [0, 0, 0]}]}], "endings": {"A": {"title": "留个念想", "text": "旧招牌他没带走，靠在店里最里面的墙上，说要留个念想。卷帘门拉到一半停住，他弯腰把门口的台阶扫干净，扫得很仔细，连缝里的叶子都拨出来，才慢慢拉到底。"}, "B": {"title": "纸上的号码", "text": "车开出去二十米停下。他摇下窗，说你需要的话就打这个电话，然后把手写的号码递出来。纸上写了一串数字，中间一位改过一次，改的地方用小字重新描了一遍。"}, "C": {"title": "一页没翻", "text": "相册留在了柜台上，一页没翻，塑封的边缘还没拆。后来那家店换了新的招牌，暗房的红灯再没亮过，窗台的灰积了很厚，有人路过也只看一眼。"}, "D": {"title": "落在指腹上的灰", "text": "他走的那天雨很小。旧招牌靠在墙边，木头的字被雨泡得发白。你伸手摸了一下，指腹上落了一层灰，凑近看了看，是「照相」两个字的凹槽里刮出来的。"}}, "vigs": [{"title": "红灯", "need": 6, "lines": ["暗房的红灯常年亮着，灯泡换了三次。", "他在里面待得比外面久。", "有人问他为什么不装亮一点的灯。", "他说这个颜色看显影正合适。"]}, {"title": "钥匙", "need": 12, "lines": ["柜台抽屉里有一串备用钥匙，五把，标签是手写的。", "他把其中一把放在你手里，说店里没人的时候可以进来坐。", "你问其他四把是谁的。", "他说都不是人的，是柜子的。"]}, {"title": "多洗一张", "need": 18, "lines": ["洗照片的时候，他会多洗一张。", "多出来那张放在柜台下面的纸盒里，纸盒满了就换新的。", "有人问那些是给谁的。", "他说还没人来取。"]}], "route": "steady", "arch": "温吞守护型男二", "context": {"world": "老城巷子里的照相馆，暗房的红灯常年亮着。柜台玻璃下面压着一层旧底片，边角泛黄。", "premise": "柜台玻璃下压着泛黄底片，暗房的红灯还亮着。你把要找的照片说给温叙听，他没有先问太多理由，只答应进去找。旧店的东西还在，经营它的人已经不同。", "player": "你是回小城寻找一张十几年前旧照片的人。照片的线索留在老巷的照相馆，但这家店如今已经换了老板。", "relation": "温叙是照相馆的现任店主，愿意帮你查找旧底片。你们此刻从找照片这件事开始来往，没有已经确认的恋爱关系，也不能仅凭他的照顾就认定某段旧情。", "known": ["你要找的是早年留下的照片，温叙是帮助查找的人，不是照片年代里已经解释过的旧相识。", "这间照相馆以前由别人经营，温叙现在负责保管、整理这些底片。"], "unknown": "他为何总把关心说成「你需要的话」、怎样看待你们的来往，以及自己将来的打算，都还没有对你讲明。", "opening": "你把照片的年份又说了一遍。温叙把柜台上的台灯移近，低头看了看旧登记。\n「你需要的话，我帮你找。」\n他说完转身进暗房，门缝里留下细细一道红光。", "goal": "先一起找回那张旧照片。此后的来往可以慢慢展开，帮助与亲密关系都需要说清，而不是相互代替。"}, "desc": "稳定、不争，把喜欢存成长期存款；从不越界，也不让人为难。"};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
['player','relation','unknown','goal'].forEach(key=>{$('#'+key).textContent=D.context[key]||'';});
$('#persona').textContent=D.desc||'';
(D.context.known||[]).forEach(text=>{const li=document.createElement('li');li.textContent=text;$('#known').appendChild(li);});
if(D.world){ $('#world').textContent=D.world; } else { $('#secWorld').style.display='none'; $('#world').style.display='none'; }
if(D.premise){ $('#premise').textContent=D.premise; } else { $('#secPremise').style.display='none'; $('#premise').style.display='none'; }
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;   /* warm = 累计显式效果分（来自数据里的 fx.aff），不再用关键词猜 */
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach((choice, idx)=>{
    const t = (typeof choice === 'string') ? choice : (choice && choice.t) || '';
    const aff = (typeof choice === 'object' && choice && choice.fx && Number.isFinite(Number(choice.fx.aff)))
      ? Number(choice.fx.aff)
      : Number((s.fx && s.fx[idx]) || 0);
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      warm += aff;                    /* 分数只来自数据里的 fx，改文案不影响判定 */
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=Math.max(0, Math.min(1, warm/Math.max(1,total)));
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
let started=false;
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; if(!started){started=true;render();} };
$('#contextAgain').onclick=()=>{ $('#intro').style.display='block'; $('#stage').style.display='none'; $('#go').textContent=started?'回到当前剧情':'开始'; window.scrollTo({top:0,behavior:'smooth'}); };
</script></body></html>
