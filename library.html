这是标志", "trap": "悔得太快、代价太轻", "arc": "从把人当筹码，到把自己交出去"}, {"route": "steady", "name": "温叙", "meta": "29 · 旧照相馆老板", "arch": "温吞守护型男二", "voice": "温和、绕弯、常以\"你需要的话\"开头", "trap": "别把他写成坏人：他的退出要出于自尊而非黑化", "arc": "从\"我一直都在\"到\"我该走了\"，退出即完成人物"}, {"route": "double", "name": "江栖", "meta": "26 · 旧货铺店员", "arch": "替身者", "voice": "模仿他人措辞、忽真忽假", "trap": "靠扮演获取爱，最后不知哪个是自己", "arc": "从「我像谁」到「我就是我」"}, {"route": "gate", "name": "卫言", "meta": "看上去二十八 · 关隘守门人", "arch": "守规人", "voice": "陈述句、报条文编号、不说废话", "trap": "用规则当挡箭牌，回避表态", "arc": "从「规则高于人」到「为一个人改一条规则」"}, {"route": "doomed", "name": "时雨", "meta": "22 · 书里注定的配角", "arch": "被写死者", "voice": "俏皮反问、爱自嘲", "trap": "用「反正我会死」当免罪符，伤人不自知", "arc": "从「我只要活」到「我值得被记得」"}, {"route": "hostage", "name": "萧珩", "meta": "二十岁 · 邻国质子", "arch": "被折辱的质子", "voice": "反话多，越生气越客气", "trap": "把爱当试探，一试探就伤人", "arc": "从被当人质，到学会把人当人"}, {"route": "topstudent", "name": "许澈", "meta": "17 · 高三（一）班，年级第一", "arch": "学神型同桌", "voice": "陈述句为主，话少，偶尔一句毒舌", "trap": "替她做决定还叫温柔", "arc": "从\"什么都自己扛\"到\"学会开口要人\""}, {"route": "minister", "name": "崔琰", "meta": "三十二岁 · 内阁首辅", "arch": "冷面首辅", "voice": "话少、语速慢，每句都留退路", "trap": "习惯用婚姻当棋，事后补不上", "arc": "从把人当筹码，到拿前程下注"}, {"route": "senior", "name": "邵川", "meta": "22 · 大四学长，后来去了外地", "arch": "温柔兜底型学长", "voice": "语速慢、带笑、先给退路", "trap": "越界+以照顾为名控制", "arc": "从\"我只是照顾\"到\"我承认我要\""}, {"route": "exgf", "name": "苏梨", "meta": "26 · 广告公司客户总监", "arch": "直球女配 / 前女友", "voice": "直接、带刺、条理清楚", "trap": "写成纯反派工具人", "arc": "从\"抢回来\"到\"我自己走\""}], "unused": [{"topic": "01", "topic_name": "现代都市 · 暗恋 / 职场 / 双向奔赴", "name": "直球型闺蜜/助攻", "meta": "女 / 23–30", "job": "同公司同事、媒体、自由职业", "traits": "嘴快、护短、看破不说破但会推一把", "voice": "语速快、爱打岔、口头禅化、金句输出位", "trap": "别写成纯工具人：她要有自己的麻烦和判断失误", "arc": "从\"替她出头\"到\"让她自己出头\"，助攻退场要体面"}, {"topic": "03", "topic_name": "校园青春 · 同桌 / 暗恋 / 毕业", "name": "家长型阻力（母亲/班主任）", "meta": "女 / 40–50", "job": "母亲（或班主任），家里唯一的规矩制定者", "traits": "务实、焦虑、爱用\"为你好\"", "voice": "下结论式，用生活账本说话", "trap": "无脑恶人、只负责拆散", "arc": "从\"按我说的做\"到\"你自己承担\""}], "traps": [{"topic": "01", "text": "**人设前后崩**：前一章雷厉风行，后一章为了误会而突然变傻。避开办法——写一个\"能力清单\"，凡是涉及她专业领域的事，永远让她做对。"}, {"topic": "01", "text": "**为虐而虐的降智误会**：明明一句话能说清，硬是憋十章。避开办法——给不说破一个具体代价（说了会失业、会连累家人），让沉默变成选择而不是愚蠢。"}, {"topic": "01", "text": "**工具人配角**：闺蜜只负责打气和递消息，男二只负责被拒绝。避开办法——给每个配角一条与主线无关的私人困境，并在结尾交代。"}, {"topic": "01", "text": "**女主只会被救**：所有危机都由男主解决。避开办法——把\"关键一击\"分给女主，男主负责兜底而非代替。"}, {"topic": "01", "text": "**男主冷暴力被写成深情**：不解释、不回应、玩消失，还标榜\"我在保护你\"。避开办法——让沉默付出可见代价（她被误解、被辞退、被家人责怪），并让他为这个代价道歉。"}, {"topic": "01", "text": "**结局靠身份逆袭收买**：最后靠\"原来是豪门/原来是继承人\"抹平所有矛盾。避开办法——结局必须解决前三章就提出的那个具体问题，钱和身份只能是背景，不能是答案。"}, {"topic": "02", "text": "**强行误会**：明明一句话能说清，非要靠偷听和沉默拖十章 —— 给\"信息封锁\"一个硬理由（签了协议、对方手里有人质、说出口会害死第三人），并且让主角**尝试过**解释但失败。"}, {"topic": "02", "text": "**降智追妻**：男主前脚害人、后脚忽然深情，代价为零 —— 每一次悔都要付可量化的代价（失权、失财、失名声），而且必须是他主动付，不是作者替他付。"}, {"topic": "02", "text": "**人设崩**：冷面男主一见面就变黏人，女主一哭就原谅 —— 改变要踩在具体事件上，一次只松动一格，原有的说话习惯（短句、不解释）必须保留。"}, {"topic": "02", "text": "**工具人配角**：现女友、未婚妻只为衬托女主存在 —— 给配角独立的欲望和结局，至少让他/她离场时有一个属于自己的选择。"}, {"topic": "02", "text": "**圣母式原谅**：女主被灭门、被毁掉人生，一句\"我理解你\"就翻篇 —— 原谅要么带条件，要么干脆不给；允许 BE，也允许\"和好但不再爱\"的中间态。"}, {"topic": "02", "text": "**重逢即热恋**：一见面就上床，把七年空白直接跳过 —— 重逢后先写三章\"不合拍的日常\"，用作息、消费、说话方式的冲突证明时间真的过去了。"}, {"topic": "03", "text": "人设崩：为推剧情让学霸突然犯傻、让要强的人突然示弱。避开法：先改外部事件，别改性格，让她用同一个性格撞上新情况。"}, {"topic": "03", "text": "降智误会：一句话能说清的事硬拖八章。避开法：误会必须带成本——说清就要失去一样东西（名额、住处、朋友），否则不许用。"}, {"topic": "03", "text": "工具人配角：闺蜜只递纸巾、竹马只送人头。避开法：每个配角给一条独立目标线，他的选择要能反过来影响主线。"}, {"topic": "03", "text": "强行虐：家庭变故当一次性炸弹，用完就丢。避开法：变故要留下可延续的现实后果（钱少了、搬家了、志愿改了），并在后文持续收租。"}, {"topic": "03", "text": "只有恋爱没有学校：全校除了谈恋爱没人高考。避开法：把高考、分班、老师约谈写成能真正改变关系的力，而不是背景板。"}, {"topic": "03", "text": "告白即解决一切：说完\"我喜欢你\"万事大吉。避开法：结局必须给出具体安排——同城、志愿、家长点头、谁搬谁的房子，缺一项就不算完。"}, {"topic": "04", "text": "**人设崩坏**：为推进剧情让聪明人突然犯蠢。避法：让她犯错，但错在\"她最在意的那件事\"上，动机先行。"}, {"topic": "04", "text": "**降智误会**：一句话能说清的事拖十章。避法：让不说出口有硬理由（说了会死人、会灭族），理由立住误会才立得住。"}, {"topic": "04", "text": "**工具人配角**：反派和配角只为推剧情，没有自己的利益。避法：每个反派先写清\"他要什么\"，他的动作自然会跟主角抢同一件东西。"}, {"topic": "04", "text": "**权谋当背景**：说好的灭族之仇、抄家之祸从不在正文里落地。避法：让权力的代价具体到一场葬礼、一道流放旨、一条被砍掉的手。"}, {"topic": "04", "text": "**替身不背债**：替身只做噱头，不承担代价。避法：替身必须付三样东西里的至少一样——名分、亲人、往后被认出来时的死路。"}, {"topic": "04", "text": "**虐完强行甜**：屠城灭族之后照样大婚，无人负责。避法：让结局先结账（谁死了、谁被贬了、谁一辈子不能抬头），甜才有分量。"}, {"topic": "05", "text": "**规则随口改**——当设定需要时临时加条文救剧情；避开：开篇把条文列清并锁死，改规则必须付出代价，且改动本身写成情节。"}, {"topic": "05", "text": "**降智推进**——角色明明知道规则还去踩，只为制造危机；避开：让角色用最笨也最合理的办法试错，失误要来自「信息不足」而不是「不思考」。"}, {"topic": "05", "text": "**恋爱覆盖悬疑**——破案逻辑让位于撒糖，凶手沦为背景；避开：每章至少推进一条证据链，感情戏必须搭在证据或规则上。"}, {"topic": "05", "text": "**工具人配角**——配角只负责死掉、误会、报信；避开：给配角一条独立于主线的规则知情权，让他也能主动决策。"}, {"topic": "05", "text": "**失忆当橡皮**——轮回与失忆反复清零，读者失去沉没成本；避开：记忆可以丢，但**身体的记性和物证必须留下**，让读者看到累计。"}, {"topic": "05", "text": "**强行误会**——一句实话就能解开却硬不说；避开：先立「说了会死/会重置」这类硬约束，让沉默合法；没有硬约束就不要写误会。"}, {"topic": "06", "text": "把创伤当人设标签：反复渲染\"他好惨\"，却不写具体事件与后果——避开：病灶必须落到\"某年发生的哪件事＋造成了哪个具体行为\"，能演出来。"}, {"topic": "06", "text": "一句台词治好 PTSD：女主说句\"我在\"，男主立刻不药而愈——避开：治愈一次只能推进一小步，且必须落在可执行的动作上（吃下饭、睡着、自己出门）。"}, {"topic": "06", "text": "单向施救的圣母女主：只付出、不索取、从不生气——避开：给她一条自己的病灶线和一次明确说\"我不救了\"的权利。"}, {"topic": "06", "text": "用误会代替冲突：所有裂缝都靠\"他不说、她没听见\"——避开：裂缝要写成善意造成的伤害（为你好、替你决定、瞒着你），说清楚了照样疼。"}, {"topic": "06", "text": "工具人配角：朋友只负责爆料，情敌只负责使坏——避开：每个配角都要有自己的利益诉求，并至少有一次拒绝主角的时刻。"}, {"topic": "06", "text": "结局靠奇迹洗白：要么富豪认亲、要么车祸失忆、要么一方病死完成和解——避开：结局只允许关系形态改变，不允许外部条件突变；救赎要向内结算。"}], "lines": [{"topic": "01", "text": "她用：「材料我改到第七版了，你再看一眼。」"}, {"topic": "01", "text": "他用：「加班可以，别拿它当不回家的理由。」"}, {"topic": "01", "text": "她用：「我在等自己长到，不用等你的那天。」"}, {"topic": "01", "text": "他用：「方案我签，责任我担，判断别改。」"}, {"topic": "01", "text": "她用：「别送到门口，我妈会以为有人要我。」"}, {"topic": "01", "text": "他用：「这杯我请，不是客气，是我想知道下一次。」"}, {"topic": "01", "text": "她用：「你说话别老像开会，我不是你下属。」"}, {"topic": "01", "text": "他用：「我在申请一个只对你开放的长期位置。」"}, {"topic": "01", "text": "她用：「那年不是我走的，这个名声我背了七年。」"}, {"topic": "01", "text": "他用：「过去我不问，我只问这次你走不走。」"}, {"topic": "02", "text": "她用：\"当年是我先走的，所以这次我先开口——你还要不要我。\""}, {"topic": "02", "text": "他用：\"我等了七年，不是为了听你说对不起。\""}, {"topic": "02", "text": "她用：\"你不用对我好，你只要别替我决定。\""}, {"topic": "02", "text": "他用：\"我这条腿、这家公司，都能赔给你，人不行。\""}, {"topic": "02", "text": "她用：\"我可以原谅你，但我不能装作什么都没发生。\""}, {"topic": "02", "text": "他用：\"那年我没去机场，是我这辈子唯一后悔的事。\""}, {"topic": "02", "text": "她用：\"我现在有钱了，换我来照顾你，你别推。\""}, {"topic": "02", "text": "他用：\"你别急着回答，我等得起——这次换我等。\""}, {"topic": "02", "text": "她用：\"我们之间不是误会，是你从来没问过我。\""}, {"topic": "02", "text": "他用：\"你要是还恨我，就说明你还没放下。\""}, {"topic": "03", "text": "她用：「这道题我讲给你听，讲完你就欠我一次。」"}, {"topic": "03", "text": "他用：「别坐窗边，风大，你感冒了我还得多改一份卷子。」"}, {"topic": "03", "text": "她用：「我没在等你，我在等最后一班公交。」"}, {"topic": "03", "text": "他用：「分班表贴出来了，我们还在同一层楼，够了。」"}, {"topic": "03", "text": "她用：「你借我的笔我一直没还，你也一直没问。」"}, {"topic": "03", "text": "他用：「考完这科我有话跟你说，考砸了也一样说。」"}, {"topic": "03", "text": "她用：「志愿表第二栏我空着，你填哪儿我就填哪儿。」"}, {"topic": "03", "text": "他用：「家长会她的位子空着，我去坐。」"}, {"topic": "03", "text": "她用：「毕业照你站我旁边，别的我什么都不要。」"}, {"topic": "03", "text": "他用：「十年后你还喜欢我，这话就当我今天说过。」"}, {"topic": "04", "text": "**她用**：「殿下要的是江山，何必来问我要不要。」"}, {"topic": "04", "text": "**他用**：「我拿半个朝堂，换你一句话。」"}, {"topic": "04", "text": "**她用**：「我这条命是家里给的，如今还给家里。」"}, {"topic": "04", "text": "**他用**：「你不必贤良，只要活着站在我这边。」"}, {"topic": "04", "text": "**她用**：「替身有替身的规矩：人前我认，人后你走。」"}, {"topic": "04", "text": "**她用**：「你既把我当筹码，就别怪我算得比你清。」"}, {"topic": "04", "text": "**他用**：「我这辈子只做过一桩亏本买卖，就是你。」"}, {"topic": "04", "text": "**她用**：「名节是我的，江山是你的，别弄混了。」"}, {"topic": "04", "text": "**他用**：「刀在你手里，要杀要剐，我都认。」"}, {"topic": "04", "text": "**她用**：「这一回不是赐婚，是我自己点的头。」"}, {"topic": "05", "text": "**她用**：这一轮我不救别人了，我只想看你活到天亮。"}, {"topic": "05", "text": "**他用**：规则没说不能喜欢你，那我就当它允许。"}, {"topic": "05", "text": "**她用**：你记得我吧——你刚刚那种眼神，是不记得的人没有的。"}, {"topic": "05", "text": "**他用**：我查过所有解释，没有一个能证明你没骗我；但我还是站这边。"}, {"topic": "05", "text": "**她用**：你可以不回答。你不说谎，沉默我就当默认。"}, {"topic": "05", "text": "**他用**：同一条命，你死我会跟着——所以分手这个词，你别再用。"}, {"topic": "05", "text": "**她用**：别记住我，出去忘了我，这是我能给你的唯一好结局。"}, {"topic": "05", "text": "**他用**：我不是不信鬼神，我是不信你会死。"}, {"topic": "05", "text": "**她用**：规则只禁我说话，没禁我看你，那我多看一会儿。"}, {"topic": "05", "text": "**他用**：第一轮我不敢认你，现在是第九轮，我敢了。"}, {"topic": "06", "text": "【她用】\"你的腿不归我管，你的明天归我管。\""}, {"topic": "06", "text": "【他用】\"别把我当病人。病人不会给你做饭。\""}, {"topic": "06", "text": "【她用】\"我没那么伟大，我只是不想再一个人扛。\""}, {"topic": "06", "text": "【他用】\"你要救我可以，别替我签字。\""}, {"topic": "06", "text": "【她用】\"我伸过手了。这次换你，我不动。\""}, {"topic": "06", "text": "【他用】\"我好的时候没来找你，是怕你觉得我可怜。\""}, {"topic": "06", "text": "【她用】\"你可以不听我的，但别让我从别人嘴里知道。\""}, {"topic": "06", "text": "【他用】\"别把一辈子押在一次救命上，那不值。\""}, {"topic": "06", "text": "【她用】\"我不需要你变好，我需要你在我看得见的地方。\""}, {"topic": "06", "text": "【他用】\"下周三我复诊。你要是没事，就来。\""}], "works": [{"topic": "01", "title": "偷偷藏不住", "author": "竹已"}, {"topic": "01", "title": "难哄", "author": "竹已"}, {"topic": "01", "title": "你是我的荣耀", "author": "顾漫"}, {"topic": "01", "title": "打火机与公主裙", "author": "Twentine"}, {"topic": "01", "title": "三分野", "author": "耳东兔子"}, {"topic": "01", "title": "白日梦我", "author": "栖见"}, {"topic": "01", "title": "如果蜗牛有爱情", "author": "丁墨"}, {"topic": "01", "title": "余生，请多指教", "author": "柏林石匠"}, {"topic": "01", "title": "何以笙箫默", "author": "顾漫"}, {"topic": "01", "title": "江山美人谋", "author": "袖唐"}, {"topic": "01", "title": "错位告白", "author": "瓷话"}, {"topic": "01", "title": "荷包里的单人床", "author": "张小娴"}, {"topic": "01", "title": "吃南瓜的人", "author": "亦舒"}, {"topic": "01", "title": "恃靓行凶", "author": "休屠城"}, {"topic": "01", "title": "淑女本色", "author": "鲜橙"}, {"topic": "01", "title": "我的名字，你的姓氏", "author": "青衫落拓"}, {"topic": "01", "title": "下一次爱情来的时候", "author": "青衫落拓"}, {"topic": "02", "title": "何以笙箫默", "author": "顾漫"}, {"topic": "02", "title": "良言写意", "author": "木浮生"}, {"topic": "02", "title": "打火机与公主裙", "author": "Twentine"}, {"topic": "02", "title": "沥川往事", "author": "施定柔"}, {"topic": "02", "title": "原来你还在这里", "author": "辛夷坞"}, {"topic": "02", "title": "东宫", "author": "匪我思存"}, {"topic": "02", "title": "春日宴", "author": "白鹭成双"}, {"topic": "02", "title": "折腰", "author": "蓬莱客"}, {"topic": "02", "title": "三分野", "author": "耳东兔子"}, {"topic": "02", "title": "难哄", const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function renderRoles(){
  const rows = D.used.map(r=>`<tr>
    <td class="n"><b>${esc(r.name)}</b><br><span style="color:var(--faint);font-size:12px">${esc(r.meta)}</span></td>
    <td>${esc(r.arch)}<br><span style="color:var(--dim);font-size:12px">台词：${esc(r.voice)}</span></td>
    <td style="color:#c8a37a;font-size:12.5px">${esc(r.trap)}</td></tr>`).join('');
  return `<h2>角色 ↔ 原型</h2>
    <p class="lead">每个角色都挂在资料库的一个原型上；右侧是该原型「必须避开的雷点」，写台词时当校对清单用。</p>
    <table class="tbl"><thead><tr><th>角色</th><th>对应原型 / 台词风格</th><th>要避开的雷点</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function renderArch(){
  const topics = [...new Set(D.arch.map(a=>a.topic))];
  const chips = ['all',...topics].map(t=>`<button data-t="${t}" class="${t==='all'?'on':''}">${t==='all'?'全部':t}</button>`).join('');
  const cards = D.arch.map(a=>`<div class="card" data-t="${a.topic}">
      <div class="nm">${esc(a.name)} <span class="count">${esc(a.meta)}</span></div>
      <div class="mt">${esc(a.job)}</div>
      <div class="mt">性格：${esc(a.traits)}</div>
      <div class="mt">台词：${esc(a.voice)}</div>
      <div class="tr">雷点：${esc(a.trap)}</div>
      <div class="mt" style="margin-top:4px">弧线：${esc(a.arc)}</div>
    </div>`).join('');
  return `<h2>原型库</h2>
    <p class="lead">${D.arch.length} 个原型，本作用掉 ${D.used.length} 个，还剩 <b>${D.unused.length}</b> 个没动。</p>
    <div class="filters" id="flt">${chips}</div>
    <div id="archList">${cards}</div>`;
}

function renderTraps(){
  const items = D.traps.map(t=>`<li>${esc(t.text).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</li>`).join('');
  return `<h2>雷点清单</h2>
    <p class="lead">${D.traps.length} 条，按题材归类。这是「同类小说最容易写砸的地方」，改稿时逐条过。</p>
    <details open><summary>展开全部 ${D.traps.length} 条</summary><ol class="lines">${items}</ol></details>`;
}

function renderLines(){
  const items = D.lines.map(l=>`<li>${esc(l.text)}</li>`).join('');
  return `<h2>台词样例</h2><p class="lead">${D.lines.length} 条，用于校准语气（不直接抄用）。</p>
    <details><summary>展开 ${D.lines.length} 条</summary><ol class="lines">${items}</ol></details>`;
}

function renderWorks(){
  const byTopic = {};
  D.works.forEach(w=>{ (byTopic[w.topic] ||= []).push(w); });
  const blocks = Object.keys(byTopic).map(t=>`<details><summary>${t} · ${byTopic[t].length} 部</summary>
    <ol class="lines">${byTopic[t].map(w=>`<li>${esc(w.title)} <span class="count">${esc(w.author)}</span></li>`).join('')}</ol>
    </details>`).join('');
  return `<h2>收录作品</h2><p class="lead">共 ${D.works.length} 部，只做结构提炼，不含原文。</p>${blocks}`;
}

$('#body').innerHTML = renderRoles()+renderArch()+renderTraps()+renderLines()+renderWorks();
$('#flt').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#flt button').forEach(x=>x.classList.toggle('on', x===b));
  const t=b.dataset.t;
  document.querySelectorAll('#archList .card').forEach(c=>{ c.style.display = (t==='all'||c.dataset.t===t)?'':'none'; });
});
</script></body></html>
