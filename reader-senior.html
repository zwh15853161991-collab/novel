<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>邵川 · 逐字版</title>
<style>
:root{--bg:#0f0c0b;--ink:#ece6de;--dim:#a49b90;--faint:#6f6862;--line:rgba(255,255,255,.09);
--accent:#c9a06a;--acc-ink:#1a140e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 70% at 50% 0,#1a1512,#0f0c0b 62%);color:var(--ink);
 font:17px/1.9 "Songti SC","Noto Serif SC",serif;min-height:100dvh}
.wrap{max-width:680px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px 60px}
h1{font-size:22px;font-weight:500;margin:0 0 4px;letter-spacing:.04em}
.meta{color:var(--faint);font-size:12.5px;letter-spacing:.12em}
.sec{color:var(--accent);font-size:11.5px;letter-spacing:.18em;margin:20px 0 6px}
p.world{color:var(--dim);font-size:14px;margin:0}
.btn{display:inline-block;margin-top:18px;background:var(--accent);color:var(--acc-ink);border:0;
 border-radius:12px;padding:11px 20px;font-size:15px;font-family:inherit}
#stage{display:none}
.chap{color:var(--faint);font-size:12px;letter-spacing:.16em;text-align:center;margin:26px 0 14px}
.nar{margin:0 0 14px;line-height:2;font-size:16.5px}
.her{background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:2px solid var(--accent);
 border-radius:14px;padding:11px 15px;margin:0 0 14px}
.choices{display:grid;gap:9px;margin:18px 0 0}
.choices button{text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);
 border-radius:12px;padding:12px 14px;font-size:14.5px;font-family:inherit}
.choices button:hover{border-color:rgba(201,160,106,.5)}
.endcard{margin:22px 0;padding:16px 18px;border-radius:16px;border:1px solid rgba(201,160,106,.32);
 background:linear-gradient(180deg,rgba(201,160,106,.1),transparent)}
.eth{color:var(--accent);font-size:12.5px;letter-spacing:.12em;margin-bottom:8px}
.vig{margin-top:20px;border-top:1px dashed var(--line);padding-top:14px}
.vig h3{font-size:14px;font-weight:500;margin:0 0 8px;color:#c8a37a}
.vig p{margin:0 0 8px;color:var(--dim);font-size:14px}
.small{color:var(--faint);font-size:12.5px;margin-top:10px}
</style></head><body><div class="wrap">
<div class="navrow" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
  <a href="./routes.html" style="color:#a49b90;text-decoration:none;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 11px;font-size:12.5px">← 故事总览</a>
  <a href="./index.html" style="color:#a49b90;text-decoration:none;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 11px;font-size:12.5px">离线完整版</a>
  <a href="./app-v2.html" style="color:#a49b90;text-decoration:none;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 11px;font-size:12.5px">AI 版</a>
</div>
<div id="intro">
  <h1 id="nm"></h1><div class="meta" id="mt"></div>
  <div class="sec" id="secWorld">故事背景</div><p class="world" id="world"></p>
  <div class="sec" id="secProfile">人物</div><div id="profile"></div>
  <div class="sec" id="secPremise">前情提要</div><p class="world" id="premise"></p>
  <button class="btn" id="go">开始</button>
  <div class="small">这一版是写死的正文：不联网、不需要模型，每句都对过。</div>
</div>
<div id="stage"><div id="log"></div><div class="choices" id="ch"></div></div>
</div>
<script>
const D={"name": "邵川", "meta": "22 · 大四学长，后来去了外地", "premise": "你搬到大学城的老楼，隔壁学长帮你把最后一个箱子抬上四楼，说以后有事喊一声就行。", "world": "大学城的老楼，四层没电梯，楼道灯坏了一盏。阳台朝西，晒得到一下午的太阳。", "chapters": [{"title": "第一章 搬家", "scenes": [{"lines": [["nar", "纸箱底下的胶带在二楼半的拐角裂开，他一只手托住箱底，另一只手把箱角往怀里带了带，下巴压住箱盖。"], ["say", "“这箱装的什么，书？”"], ["nar", "他把箱子放到四楼平台上，手背在裤缝上蹭了一下，指节上有一道旧划痕，划痕边缘已经发白。"], ["nar", "我从背包侧袋摸出那瓶没开封的矿泉水递过去。他看了两秒，接了，拧开只喝了一口，瓶盖捏在手心里没扔。"], ["say", "“谢了。以后有事喊一声就行。”"]], "choices": ["请他喝水", "说太麻烦了", "（塞给他一包纸巾）"], "n": 1}, {"lines": [["nar", "他掏出钥匙，钥匙串上挂着一个磨白的塑料牌，插进锁孔转了半圈，锁芯响了两声。"], ["say", "“有事喊一声，我一般都在。”"], ["nar", "门关上。楼道里的声控灯灭了一盏，剩一盏还亮着，隔了几秒也灭了。"], ["nar", "我把最后那箱书推到墙边，纸箱和墙之间留出一指宽的缝。我抬手在墙上敲了两下，隔壁没有动静，也可能是我敲得太轻。"]], "choices": ["喊他", "不打扰", "（敲墙试探）"], "n": 2}, {"lines": [["nar", "外卖挂在门把手上，塑料袋口打了个死结。他从隔壁门口探出半个身子，手里捏着一张同样的单子。"], ["say", "“你那单是微辣吧？这家的微辣也放小米椒。”"], ["nar", "他伸手把我袋上的单子翻过来看了一眼，指腹压着那一行小字，压得纸面发皱。"], ["say", "“我上回吃完半夜起来找水喝。你换一份吧，我这边点的是不辣的。”"], ["nar", "他把自己那袋往我这边推了推，袋底在水泥地上蹭出一声轻响，汤盒在里头晃了一下。"]], "choices": ["问他怎么知道", "说谢谢", "（反手请他吃）"], "n": 3}, {"lines": [["nar", "楼下有人在吵，声音撞着楼道往上走，声控灯一层一层亮上来。"], ["nar", "门被敲了两下，不急。他站在门口，脚上是一只拖鞋，另一只脚光着，手里捏着手机，屏幕还亮着。"], ["say", "“听着不像一楼的。下来看看你在不在。”"], ["nar", "他往我屋里扫了一眼，看见纸箱还堆在墙边，就把光着的那只脚往后收了收，踩在门槛外头。"], ["say", "“没事就行。”"]], "choices": ["说没事", "问他怎么下来了", "（让他进屋坐）"], "n": 4}, {"lines": [["nar", "他带我绕着楼走了一圈，指了快递柜、垃圾房，还有那间总关着卷帘门的修理铺。"], ["nar", "走到超市门口他停下。玻璃门上的塑料条还在晃，冷气从缝里扑出来，吹得门口的促销单掀起一个角。"], ["say", "“这家的鸡蛋周三便宜。别拿最底下那层，不新鲜。”"], ["nar", "他从口袋里摸出一张皱了的小票，翻到背面，用指甲在纸上划了两道，纸被划出白痕。"], ["say", "“从这儿往回走，第二个路口右拐，比原路近。”"]], "choices": ["问他为什么停", "记下路线", "（说以后我自己来）"], "n": 5}, {"lines": [["nar", "四楼拐角的水表箱铁皮盖没扣严，露着一条缝，里头的水表蒙着一层灰。"], ["say", "“这楼晚上水管会响，咕噜咕噜的。别怕，是气。”"], ["nar", "他抬手在铁皮盖上按了一下，盖子咔地扣紧，又弹回半指。"], ["say", "“响了有个把月了，房东不管。睡不着就敲墙，我听得见。”"], ["nar", "他回屋，门没关严，留了一道两指宽的光落在楼道的水泥地上。"]], "choices": ["问响多久", "说我不怕", "（说那就好）"], "n": 6}]}, {"title": "第二章 台阶", "scenes": [{"lines": [["nar", "四楼的声控灯坏了两天，楼梯口堆着别人不要的鞋架，铁杆上挂着几件没收的衣裳。"], ["nar", "你坐在第三节台阶上，简历压在膝盖上，纸边折出一道白印。"], ["say", "“楼道里凉。”"], ["nar", "他把一瓶水放在你脚边的台阶上，瓶身挂着水珠，滚下去半圈，停住。"], ["nar", "他没有蹲下来，站在上一级台阶上，手插在裤兜里，影子从脚边一直铺到墙上。"], ["say", "“先喝水。别急着说话。”"]], "choices": ["他递水", "自己起来", "（说不出口）"], "n": 7}, {"lines": [["nar", "水喝了一半，塑料瓶被你捏得咔咔响，瓶盖拧不回去。"], ["say", "“楼下新开了家面馆，八块。”"], ["nar", "他转身下楼，脚步声在楼道里撞来撞去，走到拐角停住了，回头。"], ["say", "“汤不要钱。”"], ["nar", "你站起来，膝盖上的简历滑到台阶上，纸角翘着。他看了一眼，没有去捡。"]], "choices": ["跟他去", "说吃不下", "（说等我一下）"], "n": 8}, {"lines": [["nar", "面馆的桌角贴着一张手写的招工启事，边角被汤泡软了，字迹发糊。"], ["say", "“我认识一个师兄，做测绘的，缺个画图的。”"], ["say", "“一周去三天，钱不多，够交网费。”"], ["nar", "他把手机推过来，屏幕亮着，是一张表，备注栏里写着“能熬夜优先”。"], ["say", "“不算人情。过去也是干活，干不好照样挨骂。”"]], "choices": ["问是不是看人情", "说谢谢", "（问累不累）"], "n": 9}, {"lines": [["nar", "六月的楼前，梧桐絮落了一地，风一过又滚成一小团，贴着砖缝走。"], ["nar", "你在台阶下站着，手里拎着两瓶水，其中一瓶已经温了，瓶壁上的水痕干成一道印。"], ["nar", "三楼窗户开着，能听见里面有说话声，一句一句，中间隔得很久。"], ["nar", "玻璃门里的人陆续出来，学士服的帽穗一晃一晃，有人把帽子拎在手里扇风。"], ["say", "“你怎么在这儿。”"], ["nar", "你把那瓶温的递过去，他接了，拧开喝了一口。"]], "choices": ["上去看", "在楼下站到结束", "（发消息问他怎么样）"], "n": 10}, {"lines": [["nar", "楼道里的灯修好了，比之前亮，照得墙上那块旧水渍更明显。"], ["say", "“我下周走，南边，签了三年。”"], ["say", "“房子退给房东，东西昨天拉走了，就剩阳台上几盆。”"], ["nar", "钥匙串在他手指上转了一圈，停住，金属碰到指节响了一下。"], ["say", "“你要不要，先帮我看着。”"], ["nar", "话说得快，中间的停顿短得像没有停顿。"]], "choices": ["问他为什么问我", "说去吧", "（问他哪天走）"], "n": 11}, {"lines": [["nar", "阳台很小，两盆绿萝，一盆薄荷，塑料盆沿结着一圈白碱。"], ["nar", "薄荷叶上落了灰，他伸手抹了两下，抹不干净，指尖发绿。"], ["say", "“三天浇一次，别浇透。冬天搬屋里去。”"], ["nar", "他把窗台上那半袋没扎口的土也推过来，袋口漏出一点在黑瓷砖上。"], ["say", "“这个也用得上。”"], ["nar", "钥匙放在窗台上，磕了一声，没有再拿起来。"]], "choices": ["问养法", "说会养死", "（接过来）"], "n": 12}]}, {"title": "第三章 承认", "scenes": [{"lines": [["nar", "四楼的声控灯坏了一盏，他搬箱子下去的时候，影子在墙上断成两截。"], ["nar", "最后一趟，他空手上来，站在门口喘了口气，从钥匙串上拧下一把，放在鞋柜边，铜的，齿口磨得发白。"], ["say", "“楼下铁门的。以后送水的来，省得你再跑一趟。”"], ["nar", "他把剩下的钥匙塞回裤兜，几把金属撞在一起，响了一声。"], ["say", "“有事喊一声，我在隔壁听得见。”"]], "choices": ["问这算什么", "收下", "（推回去）"], "n": 13}, {"lines": [["nar", "他没有马上走，脚尖抵着门槛上一块翘起的漆皮，来回蹭。"], ["say", "“其实第一天，我在楼下站了半个钟头才上去敲门。”"], ["nar", "他说完去摸烟盒，摸出来捏了捏，又塞回口袋。"], ["say", "“怕你觉得我这人太热情。”"], ["nar", "声控灯灭了，他跺了一下脚，灯亮回来的时候，他已经转过身，手插在兜里下楼去了。"]], "choices": ["没听清", "说再说一遍", "（笑了）"], "n": 14}, {"lines": [["nar", "货车停在梧桐底下，车厢里塞着床板和折叠桌，绳子勒了两道，被风一吹，发出很低的响声。"], ["nar", "他拉开车门，又绕到另一侧，站在路牙子上，抬头往上看。"], ["nar", "四楼那扇窗开着半扇，玻璃上还贴着你去年没贴完的窗花，边角卷了起来。"], ["say", "“花记得浇水。”"], ["nar", "车窗降下来一半，他抬起手，在半空停了一下，又放下。"]], "choices": ["在窗口挥手", "站着看", "（躲开）"], "n": 15}, {"lines": [["nar", "半年后的下午，楼道里贴了新的水电通知，纸角被风掀着。他站在门口，先低头看那盆绿萝。"], ["nar", "藤已经绕过窗台，垂下来一截，藤尖搭在暖气管上，几片叶子背面沾着灰。"], ["say", "“长这么长了。”"], ["nar", "他伸手把一根藤拨回铁架子里，指腹在叶子上擦了擦，擦出一道浅痕。"], ["say", "“我以为它过不了那个冬天。”"]], "choices": ["问花还是我", "让他进来", "（说花没死）"], "n": 16}, {"lines": [["nar", "他把手伸进兜里，掏出钥匙串，从上面拧下一把，慢慢旋回环里，就是你鞋柜上放了半年的那把。"], ["say", "“这把我要回去。”"], ["nar", "他顿了一下，把剩下的一整串攥进手心，铜的互相磕了两下。"], ["say", "“留一把在你这儿，我回来的时候好开门。”"], ["nar", "他下楼，脚步声在三四楼之间停了一停，然后就没有了。"]], "choices": ["问另一把呢", "不问", "（把钥匙扣挂上）"], "n": 17}]}], "endings": {"A": {"title": "门垫下面", "text": "他把钥匙留在了门垫下面，只留一把。钥匙扣上挂了个旧的公交牌，牌子背面写了一行字：有事喊一声，这回我不在隔壁了。字很小，是用圆珠笔写的，写完还描了一遍。"}, "B": {"title": "新枝", "text": "他去了外地，花活了下来，长出一根新枝。半年后他回来过一次，站在阳台下抬头看，你把花搬下来给他看。他伸手碰了碰那片新叶，说这盆该换了。"}, "C": {"title": "摸半层", "text": "钥匙他收回去了，两把都收。门垫下什么也没有，楼道的灯坏了一盏，晚上回来要摸半层。有一晚你摸到一半停下，听见楼上有人关门，声音很轻。"}, "D": {"title": "还是那个位置", "text": "后来他很少回来。你把花养到了第二年，花盆换了大的，位置还是原来那个位置。有天浇水的时候发现盆底压着一张旧的公交牌，边角卷了。"}}, "vigs": [{"title": "敲墙", "need": 6, "lines": ["老楼的墙薄，敲三下对面就听得见。", "他敲门问：三下是什么意思。", "你说没什么意思，试试。", "后来他每天敲两下，算是打过招呼。"]}, {"title": "水管", "need": 12, "lines": ["晚上十一点，水管会响一阵，像有人在里面走。", "他提前说过，别怕。", "有一晚响了很久，他把门开了一条缝，问睡了吗。", "你说睡了。他说那就好。"]}, {"title": "花", "need": 18, "lines": ["阳台那盆花是他在楼下捡的，蔫着。", "养了两个月，活了。", "他说这花命硬。", "你问他不带走吗。他说明年再说。"]}], "route": "senior", "arch": "温柔兜底型学长"};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
if(D.world){ $('#world').textContent=D.world; } else { $('#secWorld').style.display='none'; $('#world').style.display='none'; }
if(D.profile && D.profile.length){ $('#profile').innerHTML = D.profile.map(([k,v])=>'<p class="world"><b style="color:#c8a37a;font-weight:400">'+k+'</b>　'+v+'</p>').join(''); }
else { $('#secProfile').style.display='none'; $('#profile').style.display='none'; }
if(D.premise){ $('#premise').textContent=D.premise; } else { $('#secPremise').style.display='none'; $('#premise').style.display='none'; }
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      if(/陪|等|不|别走|谢|留|帮|说|问|看|递|握/.test(t)) warm++;
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=warm/Math.max(1,total);
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; render(); };
</script></body></html>
