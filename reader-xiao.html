"第二章 把柄", "scenes": [{"lines": [["nar", "第三天，书校完了。你把改好的那一页铺在案上，字是你的，意思不是。"], ["nar", "她看完，把一张薄纸推到你面前。是一份弹劾的抄本，参的是户部一位侍郎。"], ["say", "「这一份，要送进宫。送的人会被查。」"], ["say", "「你去。」"]], "choices": ["「臣去。」", "「殿下为什么不自己去。」", "把纸推回去"], "n": 1}, {"lines": [["nar", "她没有生气，只是把纸又推回来，指尖在那行字上敲了一下。"], ["say", "「我去，就是党争。你去，就是个抄书的小吏走错了门。」"], ["say", "「你怕死吗。」"], ["nar", "她问得很平，像在问今天下不下雨。"]], "choices": ["「怕。但更怕一辈子抄别人的话。」", "「怕。殿下给多少银子。」", "「殿下怕过吗。」"], "n": 2}, {"lines": [["nar", "她沉默了一会儿。窗外有人打更，三更三点。"], ["say", "「怕过。」"], ["say", "「十岁那年宫里走水，我在偏殿，门被人从外面锁了。」"], ["nar", "她说到这里就停了，把袖子往下拉了拉，遮住手腕。"], ["say", "「后来我不怕火了。我怕人。」"]], "choices": ["「那殿下现在，怕臣吗。」", "什么也不问，替她把窗关小", "「臣不会锁门。」"], "n": 3}, {"lines": [["nar", "她没有回答，只把那份弹劾往前推了半寸。"], ["say", "「明早卯时，东华门的采买车。你把纸压在菜下面。」"], ["say", "「送完，你就出城。城外有匹马，有人接你。」"], ["nar", "她说得像在吩咐一件差事，只是说到「有人接你」时，停顿了半拍。"]], "choices": ["「殿下不留臣？」", "「臣送完就回来。」", "「好。」"], "n": 4}, {"lines": [["nar", "天没亮，东华门的采买车排了一长队。你把纸压在萝卜下面，手心全是汗。"], ["nar", "验车的军士翻了翻，问了句「哪个衙门的」，你说「长公主府的菜」，他挥挥手放行。"], ["nar", "出来时天刚亮。宫墙的影子斜在地上，一只猫蹲在墙头看你。"], ["say", "「别回头。」"], ["nar", "有人在背后说话。是她，站在阴影里，披着那件旧氅衣。"]], "choices": ["「殿下怎么在这儿？」", "「臣送完了。」", "站着不走"], "n": 5}, {"lines": [["nar", "御史台来人的时候，雨还没停。两个人站在偏房门口，靴底带进来一脚泥。"], ["say", "「《河渠志》第七卷，长公主府抄过。抄本在哪儿。」"], ["nar", "新抄的那一页就在你案上，墨还没干。你把一册旧账挪过去，只压住半边。"], ["nar", "你说府里没有抄本，动笔的是国史馆的人。声音比自己预想的稳。"], ["say", "「他说的，是我教的。」"], ["nar", "她隔着帘子开口。两个人回身行礼，帘后的灯影一动，没有动第二下。"]], "choices": ["「字是臣改的。与殿下无关。」", "把旧账压严，一个字不答", "「殿下府上，也会有人动笔。」"], "n": 6}, {"lines": [["nar", "她走近两步，在你面前停下。这是你第一次在白天、在宫墙外、离她这么近。"], ["say", "「你现在可以走。马在东门外。」"], ["nar", "她从袖子里拿出一样东西，摊开——是你的名籍，一张薄薄的纸。"], ["say", "「这个，我可以烧了。烧了，你就是个死人，谁也找不到你。」"], ["say", "「也可以留着。留着，你就还在册上。」"]], "choices": ["「烧了。」", "「留着。」", "「殿下想让臣怎么选。」"], "n": 7}]}, {"title": "第三章 宫门", "scenes": [{"lines": [["nar", "那一夜宫门闭得很早。街上巡防比平日多了一倍，家家户户关窗。"], ["nar", "她在书房里坐着，案上的折子摊开，一封也没批。朱笔还是干的。"], ["say", "「三天之内，有人要动兵。」"], ["say", "「我手里有兵符，也有圣旨。兵符是假的。」"], ["nar", "她把两样东西都推到你面前，让你看。"]], "choices": ["「殿下要臣做什么。」", "「真的圣旨在哪儿。」", "把假的兵符拿起来看"], "n": 1}, {"lines": [["say", "「真的在御史台。明天早朝，会有人拿出来。」"], ["say", "「我要是先动手，就是乱臣。我要是不动，明天晚上这府里一个人都活不了。」"], ["nar", "她第一次看着你的眼睛说完整句话。"], ["say", "「你告诉我。我该不该动。」"], ["nar", "她把这个问题交给你，像把刀递给一个不会用的人。"], ["nar", "说完她把手缩回袖子里，指节抵着桌沿——那是她在等一个她不想听见的答案。"]], "choices": ["「动。死在刀下，总比跪着等。」", "「不动。等他们先动手。」", "「臣不敢答。」"], "n": 2}, {"lines": [["nar", "她听完，没有立刻说话。灯芯烧短了，光很小。"], ["say", "「你知道我为什么选你抄书吗。」"], ["say", "「翰林院送来的名册上，只有你一个人的字，是给自己写的。」"], ["nar", "她伸手，把你手边那支笔拿过去，又放回来，笔尖朝你。"], ["say", "「你要是想走，现在还能走。」"]], "choices": ["「臣不走。」", "「殿下先回答臣一句话。」", "拿起笔，什么也不说"], "n": 3}, {"lines": [["nar", "四更天，宫里传来第一声更鼓。她站起来，走到窗边，把窗推开一条缝。"], ["nar", "外面的雨已经停了。宫墙上的灯一盏一盏灭下去。"], ["say", "「你说吧。再不说，天就亮了。」"]], "choices": ["「萧明烛，臣喜欢你。不是因为殿下。」", "「殿下保重。」", "「臣把命押在殿下这边。」"], "n": 4}, {"lines": [["nar", "天没亮，宫门还闭着。她在廊下等你，手里握着一枚铜符，符上的字被手汗磨得发亮。"], ["say", "「这个你拿着。出门往西走，有人问，就说是送药的。」"], ["nar", "符上还留着她的体温。她把你手指合上，力道不大，也没有立刻松开。"], ["say", "「我留在殿上。他们要拿人，先拿我。」"], ["nar", "廊下的灯一盏一盏灭下去。门里有人推门，木轴响了一声，很长。"]], "choices": ["「臣把符送到，回来站到殿下这边。」", "「殿下交符，是信臣，还是用人。」", "「臣不敢接。」"], "n": 5}, {"lines": [["nar", "她背对着你站了很久，肩膀有一次很轻的起伏。"], ["say", "「我这辈子听过很多话。」"], ["say", "「跪着的、站着的、隔着帘子的。没有一句是要我这个人。」"], ["nar", "她转过身，眼睛在暗处亮得过分。"], ["say", "「你再说一遍。这次别跪。」"]], "choices": ["站着，把话再说一遍", "上前一步，握住她的手", "什么也不说，只是看着她"], "n": 6}]}, {"title": "第三章 案结之前", "scenes": [{"lines": [["nar", "消息压在偏殿的案上，一整天没动。她坐在灯下，没有翻开任何一本折子。"], ["nar", "灯芯烧短了，她伸手把灯往前挪了半寸。挪完，还是那样坐着。"], ["say", "「他们今晚会来。」"], ["nar", "她说这话时没看你，像在跟自己确认。"]], "choices": ["「来了我挡在前面。」", "「你不是一个人在等。」", "「今晚我等你说完。」"], "n": 1}, {"lines": [["nar", "折子是次日早朝递的。你站在殿外第三排，按规矩该跪，你站着。"], ["nar", "殿上没人说话。她也没有回头，只是把手里的笏板往后压了半寸——那是让你站住的意思。"], ["say", "「你有本，上前来讲。」"], ["nar", "你走上去。走过她身边时，她低声说了一句：「说慢点，他们要记。」"]], "choices": ["按她说的，一句一句讲完", "直接把账目从头念到尾", "只说一句：「账在，人在。」"], "n": 2}]}, {"title": "第三章 · 最后", "scenes": [{"lines": [["nar", "殿门关了。她背对着你，官帽拿在手里。"], ["say", "「……」"]], "choices": ["把话说出口", "拉住她，不让她走", "什么也没做，松开手"], "n": 1}]}], "endings": {"A": {"title": "共谋", "text": "天亮的时候，兵符是真的了。她把假的投进炭盆，看着它烧完。\n早朝上，御史台的人没来得及开口。三天后，户部那位侍郎自尽，案子结了。\n你没有走。你成了长公主府里一个没有官职的抄书人，替她改所有不该出现在册子上的字。\n有人说长公主养了个面首。她听见了，只回一句：「那是我的人。」"}, "B": {"title": "放你走", "text": "名籍烧了。出东门时，守门的老兵看了你一眼，什么也没问。\n三年后，你在南边的一个县里教书。有人从京城来，带了一句话：「她摄政了，没立后。」\n你把那本抄好的《河渠志》从箱底取出来，翻到第七卷。那一页的字很丑，是你写的。\n后来那本书再没有翻过。\n偏殿那盏茶撤了，对面那把椅子搬回了墙边。\n她后来把封地的事交给了别人，自己在城郊住下。"}, "C": {"title": "君臣", "text": "你留在了京城，进了国史馆。她的折子，从这天起由你誊清。\n你们说的话越来越少。她批折子，你抄字，中间隔着一张案。\n有一年冬天她病了，你在殿外站了一夜，第二天照常进去抄书，一个字也没提。\n史书上写：长公主萧氏，终身未嫁。\n城防图上那道朱笔线后来被人描过一遍，颜色深了一层。\n她仍旧每天第一个到殿上，坐原来的位置。"}, "D": {"title": "灭口", "text": "那天晚上你走出了宫门。第二天，京城的河道里捞起一个人，穿着抄书吏的衣裳。\n有人说你卷进了党争，有人说你偷了东西跑了。\n长公主府里，那本《河渠志》被投入炭盆，烧了一夜。\n你最后记着的是她说的那句话：「有些字，改了就回不去了。」\n国史馆的名册上，那一页后来换了新的纸，字是新抄的，笔画一笔不缺。"}}, "vigs": [{"title": "站着说话的", "need": 0, "lines": ["中书令来殿中议事，提到城防图修订一事该交给谁，她没抬头，朱笔在折子上点了一下。", "「那个站着说话不跪的，他懂城防。让他来。」", "她搁下笔端起茶盏，没喝，搁回案上。"]}, {"title": "搁笔不批", "need": 0, "lines": ["工部送来的奏疏把城防修缮预算虚报了三成，她看了两行搁下朱笔没批，把奏疏推到案沿。", "「重算。」", "她端起茶盏喝了一口放下，拿起旁边另一份不相干的折子翻开。"]}, {"title": "朱笔搁正", "need": 0, "lines": ["批完折子她拿起案上的朱笔把笔杆转了转，搁在笔架上正中间的位置，笔尖朝外，不偏不倚。", "「笔不正，字就不正。」", "她把案上其余三支笔也归到笔架上按长短排好，起身理了理袖口。"]}, {"title": "西凉那封", "need": 0, "lines": ["她从暗格里取出一封旧信展在案上，信纸边角已经起毛，落款写着西凉都护府。", "「十二岁那年父皇送我去西凉住过八个月。这封信是那时候写的，一共寄出三封，只收到一封回来。」", "她把信折回原来的样子塞进信封，搁进暗格里合上盖板。"]}, {"title": "跪着听完", "need": 0, "lines": ["一个小吏跪在殿外禀报西南粮道又出了纰漏，话没说完就抖得结巴，她从案后看了一眼。", "「说完了再起来。说清楚哪一段、谁的差，别说废话。」", "小吏说完她拿起朱笔在折子上画了一道杠搁到案沿，那小吏伸手接了磕头退出去。"]}, {"title": "那条路没人", "need": 0, "lines": ["你陪她在殿前看城防图，指到北段那条标注了加强巡逻的路，她忽然不说话了。", "「那条路……上次走的人，就没回来过。这事先搁着。」", "她把城防图卷起来塞进暗格，拿起旁边一份不相干的奏疏翻开。"]}, {"title": "独坐偏殿", "need": 0, "lines": ["散了朝所有内侍退到殿外候着，她一个人坐在偏殿案前，面前摊着一张还没批的城防图。", "「这条线，到底该不该动。」", "她拿起朱笔在城防图北段画了个圈，搁笔，把图卷起来塞进暗格里。"]}, {"title": "平身说话", "need": 0, "lines": ["她批完最后一道折子搁笔，没叫你起。你站了半盏茶，她才抬眼看你，把刚批的公文推到桌沿。", "「这篇是你写的？站着说，哪里该改、哪里你不服，一个一个讲。」", "「别跪着回话，跪着说不出真心话。」"]}, {"title": "字迹", "need": 0, "lines": ["她把《河渠志》摊开，指给你看批注：同一页上，两种字迹，一种是你抄的，一种是她改的。", "「你抄的这一段，把『溺』写成了『没』。」", "她说完自己先笑了，笑得很轻，像怕被外面听见。"]}, {"title": "折子", "need": 0, "lines": ["夜里，书房只剩她一个人。半尺高的折子摊在案上，一封也没批。", "朱笔插在笔山里，笔尖早就干了。她伸手试了试，又收回去。", "「这些人，写这么长做什么。」", "她把最上面一封折子合上，压平，再合上下面一封。一叠折子被码得很齐。"]}, {"title": "火", "need": 0, "lines": ["她一个人走到东边的偏殿。十岁那年，这扇门是从外面锁上的。", "现在门是开的，里面住着两个扫洒的小太监，睡得很沉。", "「……睡吧。」", "她在门口站了很久，然后把门轻轻带上，没有锁。"]}], "route": "xiao", "arch": ""};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
if(D.world){ $('#world').textContent=D.world; } else { $('#secWorld').style.display='none'; $('#world').style.display='none'; }
if(D.profile && D.profile.length){ $('#profile').innerHTML = D.profile.map(([k,v])=>'<p class="world"><b style="color:#c8a37a;font-weight:400">'+k+'</b>　'+v+'</p>').join(''); }
else { $('#secProfile').style.display='none'; $('#profile').style.display='none'; }
if(D.premise){ $('#premise').textContent=D.premise; } else { $('#secPremise').style.display='none'; $('#premise').style.display='none'; }
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      if(/陪|等|不|别走|谢|留|帮|说|问|看|递|握/.test(t)) warm++;
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=warm/Math.max(1,total);
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; render(); };
</script></body></html>
