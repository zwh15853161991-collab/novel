<script>
const D={"name": "纪南", "meta": "31 · 同业事务所合伙人", "premise": "重启项目的竞标会结束了，甲方把预算压得很低。纪南从长桌另一端走来，将名片推到你面前。六年未见，她只说了一句：「好久不见。」旧日来往仍在，两个人却已经各有自己的团队与方案。", "world": "甲方的会议室在二十三层，落地窗上常年有雨痕。竞标按姓氏排座，她的名字永远在你前一页。", "chapters": [{"title": "第一章 甲方会议室", "scenes": [{"lines": [["nar", "会议室的投影白幕拉到一半，长桌两端各摆一摞标书。纪南把纸角对齐，自己那本比对面厚出一指。"], ["say", "“开始吧。”"], ["nar", "甲方翻到第三页，目光在预算栏停住。对面的人把钢笔横放在她薄薄一册的封面上，笔帽没有拧紧。"], ["say", "“我们按模块拆，总价没漏项。”"], ["nar", "投影笔的红点在两家报价之间来回跳动，最后停在低处。"]], "choices": ["按原计划讲", "临时改顺序", "先看她怎么讲"], "n": 1, "fx": [0, 0, 1]}, {"lines": [["nar", "椅子拖过地砖，标书收进纸箱。纪南把电脑合上，电源线绕了两圈。"], ["say", "“好久不见。”"], ["nar", "名片从桌对面推过来，边缘压住她刚才没合上的预算表。纪南看了一眼公司名，指腹停在名片下沿。"], ["say", "“纪南。同业事务所。”"], ["nar", "她把名片翻到背面，那里印着一行更小的字：重启项目负责人。"]], "choices": ["接过名片", "说我们见过", "（把名片放进口袋）"], "n": 2, "fx": [0, 0, 0]}, {"lines": [["nar", "甲方把预算表翻到最后一页，红笔在两成的位置画了个圈，纸面凹下去。"], ["say", "“这个数，能做就签字，不能做就下轮。”"], ["nar", "对面的人把方案合上，手按在封面上，没有翻回去。钢笔帽拧紧，咔一声。"], ["say", "“我们回去调。”"], ["nar", "纪南把那张预算表往自己这边拖了半寸，红圈正好压在她的报价下面。"]], "choices": ["当场争", "会后单独谈", "（沉默，记下数字）"], "n": 3, "fx": [0, 0, 0]}, {"lines": [["nar", "电梯门合上，轿厢里只有三个人和一只纸箱。楼层数字从18往下跳。"], ["say", "“六年前那场会，你也坐这个位置。”"], ["nar", "纪南把纸箱换到左手，箱角碰到电梯壁，发出一声闷响。"], ["say", "“你记性挺好。”"], ["nar", "她抬手按了一层，指尖在按钮上多停了一秒。"]], "choices": ["说记不清了", "问她记得什么", "（盯着楼层数字）"], "n": 4, "fx": [0, 1, 0]}, {"lines": [["nar", "一楼大堂的咖啡机正在磨豆，声音盖住前台叫号。她站在吧台边，把两杯美式往托盘里放。"], ["say", "“只谈项目。半小时。”"], ["nar", "纪南看了一眼手机上的日程，拇指在屏幕边缘划了一下，没点开。"], ["say", "“几点？”"], ["nar", "她把其中一杯推过来，杯壁上贴着一张手写便签：14:30，靠窗。"]], "choices": ["答应", "说要带同事", "（问她几点）"], "n": 5, "fx": [0, 0, 1]}, {"lines": [["nar", "靠窗的位置，杯口的奶泡已经塌下去，勺子搁在碟沿。她把一份联合体协议推过桌面，署名栏空着。"], ["say", "“项目成了，名字怎么排，可以再聊。”"], ["nar", "纪南把协议翻到最后一页，指节压住那条空线，纸边翘起来。"], ["say", "“我不会让。”"], ["nar", "她把凉掉的咖啡端起来，没喝，又放回原处，杯底在便签上洇出一圈水印。"]], "choices": ["直接问她要什么", "说我不会让", "（不接话）"], "n": 6, "fx": [1, 0, 0]}]}, {"title": "第二章 各为其主", "scenes": [{"lines": [["nar", "周一早上，茶水间台面上多了两只纸袋，印着街角那家茶餐厅的标志，袋口还别着结账小票。"], ["nar", "我把小票翻过来，日期是周六，人数那一栏写着四。"], ["nar", "小林端着杯子进来，看见我，脚步慢了半拍，把纸袋往身后挪了挪。"], ["say", "“纪南姐请的，说上次提案我们熬得狠。”"], ["nar", "我把小票放回台面，抹平，指腹在“四”上按了一下。"], ["nar", "窗外吊车在转，玻璃上有一层擦不掉的灰。"], ["say", "“好吃吗。”"], ["nar", "我说了句“下次记得开发票”，端着杯子回了工位。抽屉里躺着那张名片，边角在会上被我捏出了折痕。"]], "choices": ["摊牌", "装作不知道", "给团队涨薪"], "n": 7, "fx": [0, 0, 0]}, {"lines": [["nar", "她约在写字楼一层那家咖啡馆，靠窗，桌上两杯冰美式，杯壁的水顺着杯垫洇开一圈。"], ["nar", "她把我的那杯往我这边推了两厘米，收回手，指尖在桌沿敲了一下。"], ["say", "“我只是问价，不挖人。”"], ["nar", "她说这话时没看我，看的是窗外那排等红灯的车。"], ["nar", "我把吸管纸套撕成两半，叠在一起，又撕成四半。"], ["say", "“问价问到饭桌上，问得还挺细。”"], ["nar", "她笑了一下，很短，从包里拿出一支笔，笔帽在桌面上转了半圈。"], ["say", "“一半。我信你一半。”"], ["nar", "笔帽停了。她把笔收回去，杯里的冰已经化到只剩薄薄一层。"]], "choices": ["信她一半", "说要签竞业", "（笑一下）"], "n": 8, "fx": [0, 0, 0]}, {"lines": [["nar", "走廊尽头那间会议室空着，我推开门，把方案册放在桌上，推到她面前。"], ["nar", "装订条在桌面上滑出一声轻响，停在她手边。"], ["say", "“这次我不让。”"], ["nar", "她低头看封面，手指按在标题上方，没有翻开。"], ["nar", "天花板的日光灯有一支在闪，隔两秒一次，把她的侧脸切成明暗。"], ["say", "“我知道。”"], ["nar", "她把手收回去，放在膝盖上。"], ["nar", "我合上笔帽，说“价各报各的，人各带各的”，站起来，把椅子推回桌下。"], ["nar", "走到门口，我听见身后装订条被翻开的声音，很轻，一页。"]], "choices": ["说完就走", "等她反应", "（把方案推过去）"], "n": 9, "fx": [0, 1, 0]}, {"lines": [["nar", "台风把雨横着甩在玻璃上，窗框一直响。会议室的灯闪了两下，灭了。"], ["nar", "楼道里的应急灯还亮着一点绿，从门缝下漏进来一线。"], ["nar", "我摸到墙边把窗一扇扇推紧，插销扣上时，手背蹭了一层水。"], ["nar", "她坐在长桌另一头，手机的手电立在桌上，光柱照着天花板。"], ["say", "“水还有一瓶。”"], ["nar", "我把那瓶水放在桌子中间，朝她推过去一半，自己在离她三个座位的地方坐下。"], ["nar", "空调停了，屋里静下来，只剩雨点砸在玻璃上的声音，一阵一阵。"], ["nar", "她的手指在桌面上跟着雨点敲，敲了几下，停了。"]], "choices": ["各占一头", "问她要水吗", "（先去关窗）"], "n": 10, "fx": [0, 1, 0]}, {"lines": [["nar", "手电的光暗了一格，她把手机翻过来，屏幕朝下。"], ["say", "“那年我走，是因为我妈住院，账单一沓一沓地来。”"], ["nar", "她停了一下，喉咙动了一下，伸手去够那瓶水，拧开，没喝。"], ["say", "“这边开得起价。就这么简单。”"], ["nar", "雨声压下来，把她的尾音盖掉半截。"], ["nar", "我把那瓶水又往她那边推了两厘米，瓶底在桌面上磨出一声干响。"], ["nar", "窗外什么也看不见，全是水，往下淌。"], ["say", "“嗯。”"]], "choices": ["听完不评价", "问她现在后悔吗", "（说我知道）"], "n": 11, "fx": [0, 1, 0]}, {"lines": [["nar", "灯还没来。她把手电关了，说省电，屋里只剩应急灯那点绿。"], ["say", "“我现在是合伙人。听着好听，去年一整年，我一半的时间在还账。”"], ["say", "“所里三个人，房租按季付，每个月十号我先看账上够不够。”"], ["nar", "她说话时手下压在桌面上，手指张开，又收回来。"], ["nar", "我从包里摸出纸巾，抽了一张递过去。她脸上没有东西。"], ["nar", "她接了，捏在手里，没擦。"], ["nar", "雨小了一点，玻璃上的水痕开始往下走，一条一条，直的。"], ["say", "“打算？先把这单拿下来。”"], ["nar", "楼道里传来发电机的响声，灯管亮了，白得刺眼。她的纸巾还在手里，捏成了一个角。"]], "choices": ["说我也是", "（听完，不打断）", "问她打算怎么办"], "n": 12, "fx": [0, 0, 1]}]}, {"title": "第三章 各退一步", "scenes": [{"lines": [["nar", "会议室的灯关了一半，投影仪还在散热，出风口把桌角的投标文件吹得翻了一页。"], ["nar", "她把两份标书并排推到桌子中间，边角对齐，用手掌压了一下，松开时纸面弹回原位。"], ["say", "“合并投标。技术标我来，商务标你来。”"], ["nar", "她从包里取出一支笔，笔帽咬在齿间，拔开，在封面署名栏画了一道竖线，正好落在中缝上。"], ["say", "“署名一人一半。你要嫌挤，我的名字写小一号。”"]], "choices": ["同意", "要先谈分工", "说让我想想"], "n": 13, "fx": [0, 0, 0]}, {"lines": [["nar", "图纸铺到窗台上，末端垂下来，用两本规范压着，风一过，纸边轻轻拍墙。"], ["nar", "她的指甲沿着红线走，走到拐角停住，指节在纸上按出一个浅坑。"], ["say", "“这条退线让一米五，容积率掉零点零三。”"], ["say", "“我算过三遍。”"], ["nar", "窗外的塔吊转过去，影子扫过图纸，把红线切断，又接上。她把铅笔横在争议处，滚了半圈，停住。"]], "choices": ["让一步", "坚持原方案", "（把两条都画出来）"], "n": 14, "fx": [0, 0, 0]}, {"lines": [["nar", "她把手机翻过来，屏幕朝上，推到桌子中间，手松开时屏保亮了一下。"], ["nar", "上面是甲方成本部的一封邮件，转发链很长，最后一行被截断在半句里。"], ["say", "“低价。不是最低价，是比现在低。”"], ["nar", "她收回手机，用袖口擦了擦屏幕，从上往下，擦了两遍。"], ["say", "“我告诉你这个，你就欠我一次。”"]], "choices": ["改方案", "问她怎么知道", "（把底牌收下）"], "n": 15, "fx": [0, 1, 0]}, {"lines": [["nar", "百叶窗拉到底，光被切成一条一条，铺在她面前的合同上。"], ["nar", "她坐在长桌一侧，两份合同摊开，页码都翻到签字页，回形针夹在右上角，夹口朝同一个方向。"], ["nar", "她面前的纸杯没动过，杯壁的水汽已经干了，桌上留着一圈浅印。"], ["say", "“早到了二十分钟。”"], ["nar", "她把笔从笔袋里抽出来，笔尖转向你那侧的椅子，放平。"]], "choices": ["坐她对面", "坐她旁边", "（站着签）"], "n": 16, "fx": [0, 0, 0]}, {"lines": [["nar", "签完，她把笔帽扣回去，咔一声。"], ["nar", "她把自己那份合同对折，再展开，用指腹把折痕压平。"], ["say", "“纪南。”"], ["nar", "她抬眼，手停在合同边缘，指甲抵着纸，纸被顶出一个小小的弧。"], ["say", "“还要不要做朋友。”"]], "choices": ["说可以", "说不用了", "（反问她想要哪种）"], "n": 17, "fx": [0, 0, 1]}]}], "endings": {"A": {"title": "一人一半", "text": "铜牌挂在入口左手边，两家的名字并排，字号一样。她伸手把偏了的一角摆正，说这次算我们一人一半。铜牌反光，照出两个人都不太会笑的样子，谁也没先说话。"}, "B": {"title": "下次别迟到", "text": "合同签了，署名一前一后。她收拾文件时把散在桌上的你那份也理好，推过来，说下次别迟到。桌上那杯咖啡早凉透了，谁也没提，走的时候她把杯盖扣上。"}, "C": {"title": "被磨掉的号码", "text": "项目最后归了别家。她把名片留在桌上，背面写了一个号码，笔迹压在折痕上，最后一位被磨得看不清。你翻过来又翻回去，桌上的灯自动熄了一次。"}, "D": {"title": "散标那天", "text": "散标那天雨很大，她在门口站了一会儿，没打伞，也没叫车。后来听说她去了别的城市，同业里就这么少了个人，名单上还留着她的名字，排在原来那一行。"}}, "vigs": [{"title": "名片", "need": 6, "lines": ["她的名片比常规窄两毫米，纸很硬。", "背面空白，没有一句客气话。", "你把它夹在方案第一页，合上时压出一道印。", "后来那道印还在，名片不知什么时候不见了。"]}, {"title": "前一页", "need": 12, "lines": ["竞标按姓氏排座，她的名字永远在你前一页。", "翻页的时候你总会先看到她的方案标题。", "有一页她把字改小了，留白多出一指宽。", "那一指宽里什么都没写，但你看了很久。"]}, {"title": "凉掉的咖啡", "need": 18, "lines": ["咖啡凉透之后表面会结一层薄膜。", "她用勺子把那层膜挑起来，放在碟子边上。", "「这样喝起来像没凉过。」她说。", "你喝了一口，确实是凉的。"]}], "route": "rival", "arch": "清醒型前任/竞争者", "context": {"world": "甲方的会议室在二十三层，落地窗上常年有雨痕。竞标按姓氏排座，她的名字永远在你前一页。", "premise": "重启项目的竞标会结束了，甲方把预算压得很低。纪南从长桌另一端走来，将名片推到你面前。六年未见，她只说了一句：「好久不见。」旧日来往仍在，两个人却已经各有自己的团队与方案。", "relation": "六年前你们共事过半年，你追过纪南，但没有得到明确答复。你们没有正式交往，也没有一段已经确认的分手经历。此后六年没有联系。", "player": "你和纪南分别参与这次重启项目的竞标。六年前，你们曾共事。", "known": ["纪南离开时只留下一句：「以后别找我办事。」", "这次竞标让你们再次相遇，公事与当年的未尽之言碰到了一起。"], "unknown": "纪南当年没有说清对你的态度；离开时那句话背后的原因也尚未交代。", "goal": "先完成这次竞标的接触，明确项目与署名的立场；若要谈旧日来往，也需要当面问，而不是默认关系已经确定。", "opening": "会议室的投影白幕只收起一半。纪南合上标书，把一张名片从桌对面推过来。\n「好久不见。」\n名片压住预算表的一角，谁也没有先谈六年前的事。"}, "desc": "聪明、体面、目的明确、不演受害者；每句话都留后手，赢了不炫耀，输了不撒泼。"};
const $=s=>document.querySelector(s);
$('#nm').textContent=D.name; $('#mt').textContent=D.meta;
['player','relation','unknown','goal'].forEach(key=>{$('#'+key).textContent=D.context[key]||'';});
$('#persona').textContent=D.desc||'';
(D.context.known||[]).forEach(text=>{const li=document.createElement('li');li.textContent=text;$('#known').appendChild(li);});
if(D.world){ $('#world').textContent=D.world; } else { $('#secWorld').style.display='none'; $('#world').style.display='none'; }
if(D.premise){ $('#premise').textContent=D.premise; } else { $('#secPremise').style.display='none'; $('#premise').style.display='none'; }
let flat=[];
D.chapters.forEach((c,ci)=>c.scenes.forEach((s,si)=>flat.push({...s,chap:c.title,ci,si})));
let i=0, warm=0, log=null;   /* warm = 累计显式效果分（来自数据里的 fx.aff），不再用关键词猜 */
function line(kind,text){
  const el=document.createElement(kind==='say'?'div':'p');
  el.className = kind==='say'?'her':(kind==='nar'?'nar':'nar');
  el.textContent = text;
  $('#log').appendChild(el);
}
function render(){
  const s=flat[i]; if(!s){ finish(); return; }
  $('#log').innerHTML=''; 
  const c=document.createElement('div'); c.className='chap'; c.textContent=s.chap; $('#log').appendChild(c);
  s.lines.forEach(([k,v])=>line(k,v));
  const box=$('#ch'); box.innerHTML='';
  s.choices.forEach((choice, idx)=>{
    const t = (typeof choice === 'string') ? choice : (choice && choice.t) || '';
    const aff = (typeof choice === 'object' && choice && choice.fx && Number.isFinite(Number(choice.fx.aff)))
      ? Number(choice.fx.aff)
      : Number((s.fx && s.fx[idx]) || 0);
    const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ 
      warm += aff;                    /* 分数只来自数据里的 fx，改文案不影响判定 */
      i++; render();
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    };
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const total=flat.length, ratio=Math.max(0, Math.min(1, warm/Math.max(1,total)));
  const tier = ratio>=0.6?'A':ratio>=0.45?'B':ratio>=0.3?'C':'D';
  const e=D.endings[tier];
  $('#ch').innerHTML='';
  const card=document.createElement('div'); card.className='endcard';
  card.innerHTML='<div class="eth">'+(e.title||'结局')+' · '+tier+'</div>'+e.text.split('\n').map(t=>'<p class="nar">'+t+'</p>').join('');
  $('#log').appendChild(card);
  const v=document.createElement('div'); v.className='vig';
  v.innerHTML='<h3>她的这段日子</h3>'+D.vigs.map(x=>'<p><b style="color:#c8a37a;font-weight:400">'+x.title+'</b><br>'+x.lines.join('<br>')+'</p>').join('');
  $('#log').appendChild(v);
  const again=document.createElement('button'); again.className='btn'; again.textContent='再走一遍';
  again.onclick=()=>{ i=0; warm=0; render(); };
  $('#ch').appendChild(again);
}
let started=false;
$('#go').onclick=()=>{ $('#intro').style.display='none'; $('#stage').style.display='block'; if(!started){started=true;render();} };
$('#contextAgain').onclick=()=>{ $('#intro').style.display='block'; $('#stage').style.display='none'; $('#go').textContent=started?'回到当前剧情':'开始'; window.scrollTo({top:0,behavior:'smooth'}); };
</script></body></html>
